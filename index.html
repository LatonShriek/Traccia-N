<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>TracciaN — test n-back</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2430">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TracciaN">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --ink:#1C2430;
    --paper:#F6F4EF;
    --paper-dim:#EAE6DC;
    --focus:#212C39;
    --focus-2:#2B3A4A;
    --signal:#4C7A6B;
    --signal-soft:#DCE8E3;
    --alert:#B5544A;
    --alert-soft:#F2DEDB;
    --accent:#D9A441;
    --line:#D8D2C4;
    --ink-soft:#5B6472;
    --white:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; overscroll-behavior:none; user-select:none;}
  #app{min-height:100vh; display:flex; flex-direction:column;}

  .brand{display:flex; align-items:baseline; gap:10px; padding:22px 28px 6px;}
  .brand .mark{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:-0.02em;}
  .brand .mark span{color:var(--accent);}
  .brand .sub{font-size:12.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}

  .screen{flex:1; display:flex; flex-direction:column; padding:0 28px 28px;}
  .card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:22px;}

  h2{font-family:'Space Grotesk',sans-serif; font-size:19px; margin:0 0 4px; letter-spacing:-0.01em;}
  .hint{font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; line-height:1.5;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:720px){.grid{grid-template-columns:1fr;}}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); margin-bottom:8px;}
  .seg{display:flex; flex-wrap:wrap; gap:8px;}
  .seg button{border:1.5px solid var(--line); background:var(--paper); color:var(--ink); font-family:'Inter';
    font-size:13.5px; font-weight:600; padding:10px 14px; border-radius:10px; cursor:pointer; transition:.15s;}
  .seg button.on{background:var(--focus); border-color:var(--focus); color:var(--white);}
  .seg button:active{transform:scale(.96);}

  .stepper{display:flex; align-items:center; gap:14px;}
  .stepper button{width:38px; height:38px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper);
    font-size:18px; font-weight:700; cursor:pointer; color:var(--ink);}
  .stepper .val{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; min-width:74px; text-align:center;}

  .seqpreview{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; background:var(--paper-dim);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px;}

    font-family:'Inter'; font-size:14px; background:var(--paper); color:var(--ink);}
  input:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .primary{background:var(--focus); color:var(--white); border:none; border-radius:12px; padding:16px 22px;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; cursor:pointer; width:100%;}
  .primary:active{transform:scale(.985);}
  .ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line); border-radius:12px; padding:13px 18px;
    font-family:'Inter'; font-weight:600; font-size:14px; cursor:pointer;}
  .rowbtns{display:flex; gap:12px; margin-top:6px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 22px; background:var(--focus); color:var(--white);}
  .topbar .info{font-family:'JetBrains Mono',monospace; font-size:12.5px; opacity:.85;}
  .topbar button{background:rgba(255,255,255,.12); color:var(--white); border:1px solid rgba(255,255,255,.25);
    border-radius:8px; padding:8px 12px; font-size:12.5px; cursor:pointer;}

  .stage{flex:1; background:var(--focus); background:linear-gradient(180deg,var(--focus),var(--focus-2));
    display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; min-height:60vh;}
  .stimulus{font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--white); font-size:min(22vw,180px);
    line-height:1; letter-spacing:-0.01em;}
  .stimulus.symbolwrap{font-size:min(18vw,150px);}
  .stimulus.word{font-size:min(11vw,64px);}
  .blank{color:rgba(255,255,255,.18); font-size:min(14vw,110px); font-family:'Space Grotesk',sans-serif;}
  .audio-pulse{width:120px; height:120px; border-radius:50%; border:3px solid var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:44px;}
  .audio-pulse.active{animation:pulse .5s ease-out;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,164,65,.55);}100%{box-shadow:0 0 0 26px rgba(217,164,65,0);}}

  .trail{display:flex; gap:6px; position:absolute; bottom:22px; left:0; right:0; justify-content:center; flex-wrap:wrap; padding:0 12px;}
  .trail .chip{width:26px; height:26px; border-radius:7px; background:rgba(255,255,255,.12); border:2px solid transparent;}
  .trail .chip.hit{border-color:var(--signal); background:rgba(76,122,107,.5);}
  .trail .chip.err{border-color:var(--alert); background:rgba(181,84,74,.5);}
  .trail .chip.pend{border-color:rgba(255,255,255,.3);}

  .respond{padding:18px 22px 26px; background:var(--focus-2); display:flex; gap:14px;}
  button{touch-action:manipulation;}
  .tapbtn{flex:1; padding:22px; border-radius:16px; border:none; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:18px; cursor:pointer; letter-spacing:.01em; transition:transform .08s, filter .08s;}
  .tapbtn.match{background:var(--accent); color:var(--ink);}
  .tapbtn.nomatch{background:rgba(255,255,255,.1); color:var(--white); border:1.5px solid rgba(255,255,255,.25);}
  .tapbtn:active, .tapbtn.tapped{transform:scale(.96); filter:brightness(1.18);}
  .flash{position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity .25s;}
  .flash.on{opacity:1;}

  table{width:100%; border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:13.5px;}
  td,th{padding:9px 6px; border-bottom:1px solid var(--line); text-align:left;}
  th{color:var(--ink-soft); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;}
  .metricgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:14px 0 20px;}
  .metric{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px;}
  .metric .n{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:24px;}
  .metric .l{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

  .histrow{display:flex; justify-content:space-between; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .histrow .l{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft);}
  .empty{color:var(--ink-soft); font-size:13.5px; padding:20px 4px; text-align:center;}
  .navlinks{display:flex; gap:10px; margin-top:16px;}
  .navlinks a, .navlinks .link{color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; background:none; border:none; font-family:'Inter';}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ---------- data pools ---------- */
  const POOLS = {
    lettere: ['B','C','D','F','G','H','L','M','N','P','R','S','T','V'],
    numeri:  ['1','2','3','4','5','6','7','8','9'],
    simboli: ['●','■','▲','◆','★','✚','⬟','⬤'],
    parole:  ['CASA','LIBRO','SOLE','MARE','TAVOLO','FIORE','GATTO','PORTA','STRADA','NUVOLA','PANE','FUOCO','ALBERO','CHIAVE','SEDIA','LUNA'],
    suoni:   [
      {f:220,type:'sine',icon:'A'},{f:294,type:'square',icon:'B'},{f:349,type:'sine',icon:'C'},
      {f:392,type:'triangle',icon:'D'},{f:466,type:'square',icon:'E'},{f:523,type:'triangle',icon:'F'}
    ]
  };
  const STIM_LABELS = {lettere:'Lettere', numeri:'Numeri', simboli:'Simboli', parole:'Parole', suoni:'Suoni'};

  /* ---------- state ---------- */
  let cfg = {
    stimType:'lettere', nLevel:2, isi:2200, stimDuration:600, trials:24,
    targetRate:0.32, respMode:'paziente', voice:false, patientCode:'', notes:'',
    taskMode:'nback', targetSeq: POOLS.lettere.slice(0,3)
  };
  function defaultTargetSeq(stimType, len){
    len = len || (cfg.targetSeq ? cfg.targetSeq.length : 3);
    const pool = POOLS[stimType];
    const out = [];
    for(let i=0;i<len;i++) out.push(pool[i % pool.length]);
    return out;
  }
  let view = 'setup';
  let session = null; // active run state
  let lastResult = null;
  let historyCache = null;

  // ---- cloud sync (optional, Supabase) ----
  let cloudCfg = { url: localStorage.getItem('traccian:cloud:url')||'', key: localStorage.getItem('traccian:cloud:key')||'' };
  let sb = null;
  let cloudUser = null;
  let cloudBusy = false;

  const root = document.getElementById('app');
  let taskDom = null; // persistent DOM refs while view==='task', so buttons never get torn down mid-tap
  function render(){
    if(view==='task'){
      if(!taskDom){ root.innerHTML=''; taskDom = mountTaskScreen(root); }
      updateTaskScreen();
      return;
    }
    taskDom = null;
    root.innerHTML=''; SCREENS[view](root);
  }

  /* ---------- helpers ---------- */
  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(k==='class') e.className = attrs[k];
      else if(k==='html') e.innerHTML = attrs[k];
      else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
      else if(k==='disabled'){ if(attrs[k]) e.setAttribute('disabled','disabled'); }
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c=> e.appendChild(typeof c==='string'? document.createTextNode(c): c));
    return e;
  }
  function fmtTime(ms){ const s = Math.round(ms/1000); const m=Math.floor(s/60); return (m>0? m+'m ':'')+(s%60)+'s'; }
  function fmtPct(x){ return isFinite(x) ? Math.round(x*100)+'%' : '—'; }
  function todayStr(){ const d=new Date(); return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }

  /* ---------- audio ---------- */
  let actx = null;
  function getCtx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
  function playTone(tone, dur){
    try{
      const ctx = getCtx(); const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = tone.type; o.frequency.value = tone.f;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur/1000);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur/1000+0.02);
    }catch(e){}
  }
  function speak(text){
    try{
      if(!window.speechSynthesis) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'it-IT'; u.rate = 0.95;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---------- sequence generation ---------- */
  function buildSequence(){
    return cfg.taskMode==='sequenza' ? buildSequenceTarget() : buildSequenceNback();
  }
  function buildSequenceNback(){
    const pool = POOLS[cfg.stimType];
    const seq = [];
    for(let i=0;i<cfg.trials;i++){
      let isTarget = i>=cfg.nLevel && Math.random() < cfg.targetRate;
      let val;
      if(isTarget){ val = seq[i-cfg.nLevel].val; }
      else {
        do{ val = pool[Math.floor(Math.random()*pool.length)]; }
        while(i>=cfg.nLevel && val===seq[i-cfg.nLevel].val && pool.length>1);
      }
      seq.push({val, isTarget:i>=cfg.nLevel?isTarget:false, valid:i>=cfg.nLevel});
    }
    return seq;
  }
  // Target-sequence mode: respond only when the trailing stimuli exactly
  // match a fixed, custom-built sequence (e.g. 1 → 2 → 3). Everything else
  // is a non-target, regardless of how "close" it looks.
  function buildSequenceTarget(){
    const pool = POOLS[cfg.stimType];
    const target = cfg.targetSeq;
    const len = target.length;
    const raw = [];
    for(let i=0;i<cfg.trials;i++) raw.push(pool[Math.floor(Math.random()*pool.length)]);
    for(let i=len-1;i<cfg.trials;i++){
      if(Math.random() < cfg.targetRate){
        for(let j=0;j<len;j++) raw[i-len+1+j] = target[j];
      }
    }
    return raw.map((val,i)=>{
      let isTarget = false;
      if(i>=len-1){
        isTarget = true;
        for(let j=0;j<len;j++){ if(raw[i-len+1+j] !== target[j]){ isTarget=false; break; } }
      }
      return {val, isTarget, valid:i>=len-1};
    });
  }
  function seqLabel(v){ return (v && typeof v==='object') ? v.icon : v; }
  function describeTargetSeq(){ return cfg.targetSeq.map(seqLabel).join(' → '); }

  /* ---------- scoring ---------- */
  function scoreFromCounts(c){
    const hitRate = c.targets>0 ? c.hits/c.targets : 0;
    const faRate = c.nonTargets>0 ? c.falseAlarms/c.nonTargets : 0;
    // log-linear correction for extreme rates (Hautus, 1995)
    const hr = (c.hits+0.5)/(c.targets+1);
    const fr = (c.falseAlarms+0.5)/(c.nonTargets+1);
    const z = p => -Math.sqrt(2)*erfinv(1-2*p);
    const dprime = c.targets>0 && c.nonTargets>0 ? (z(1-hr)-z(1-fr)) : null;
    const acc = (c.hits+c.correctRejections)/(c.targets+c.nonTargets || 1);
    return {hitRate, faRate, dprime, acc};
  }
  function erfinv(x){
    const a = 0.147;
    const ln = Math.log(1-x*x);
    const t1 = 2/(Math.PI*a)+ln/2;
    return Math.sign(x)*Math.sqrt(Math.sqrt(t1*t1-ln/a)-t1);
  }

  /* ---------- storage ---------- */
  // Storage: plain browser localStorage — works fully offline, no account,
  // no server. Data stays on this device/browser only.
  async function saveSession(rec){
    const key = 'traccian:sessione:'+rec.id;
    try{ localStorage.setItem(key, JSON.stringify(rec)); }
    catch(e){ console.error(e); alert('Impossibile salvare: memoria del browser piena o non disponibile.'); }
    historyCache = null;
    pushSession(rec); // fire-and-forget: la sessione è già al sicuro in locale comunque
  }
  async function loadHistory(){
    let local;
    try{
      local = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('traccian:sessione:')===0){
          try{ local.push(JSON.parse(localStorage.getItem(k))); }catch(e){}
        }
      }
    }catch(e){ local = []; }

    if(sb && cloudUser){
      const remote = await pullRemote();
      const map = {};
      local.forEach(r=> map[r.id]=r);
      remote.forEach(r=>{
        map[r.id]=r;
        try{ localStorage.setItem('traccian:sessione:'+r.id, JSON.stringify(r)); }catch(e){}
      });
      const merged = Object.values(map).sort((a,b)=> b.ts-a.ts);
      historyCache = merged;
      return merged;
    }
    if(historyCache) return historyCache;
    local.sort((a,b)=> b.ts - a.ts);
    historyCache = local;
    return local;
  }
  function exportCSV(items){
    const head = ['data','codice_paziente','stimolo','esercizio','n_back','sequenza_bersaglio','prove','isi_ms','durata_stim_ms','modalita','hit','miss','falsi_allarmi','rifiuti_corretti','accuratezza','dprime','rt_medio_ms','note'];
    const rows = items.map(r=>[
      r.dateLabel, r.patientCode||'', STIM_LABELS[r.stimType]||r.stimType, r.taskMode==='sequenza'?'sequenza':'n-back',
      r.taskMode==='sequenza'?'':r.nLevel, r.taskMode==='sequenza'?(r.targetSeq||[]).join('-'):'',
      r.trials, r.isi, r.stimDuration,
      r.respMode, r.counts.hits, r.counts.misses, r.counts.falseAlarms, r.counts.correctRejections,
      r.metrics.acc!=null? (r.metrics.acc*100).toFixed(1)+'%':'', r.metrics.dprime!=null? r.metrics.dprime.toFixed(2):'',
      r.avgRT!=null? Math.round(r.avgRT):'', (r.notes||'').replace(/[\n,]/g,' ')
    ]);
    const csv = [head.join(';')].concat(rows.map(r=>r.join(';'))).join('\n');
    const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'traccian_sessioni.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------- cloud sync (Supabase, opzionale) ---------- */
  // Tutto qui è opt-in: se cloudCfg è vuoto o la libreria non è disponibile,
  // l'app funziona esattamente come prima, solo con localStorage.
  function initSupabase(){
    if(cloudCfg.url && cloudCfg.key && window.supabase && window.supabase.createClient){
      try{ sb = window.supabase.createClient(cloudCfg.url, cloudCfg.key); }
      catch(e){ sb = null; }
    } else { sb = null; }
  }
  async function restoreCloudSession(){
    if(!sb) return;
    try{
      const { data } = await sb.auth.getSession();
      cloudUser = data && data.session ? data.session.user : null;
    }catch(e){ cloudUser = null; }
  }
  function cloudStatusLabel(){
    if(!cloudCfg.url || !cloudCfg.key) return 'non configurata';
    if(!sb) return 'configurazione non valida';
    if(!cloudUser) return 'configurata, accesso non effettuato';
    return 'connessa · '+cloudUser.email;
  }
  async function cloudSaveConfig(url, key){
    cloudCfg = {url:url.trim(), key:key.trim()};
    localStorage.setItem('traccian:cloud:url', cloudCfg.url);
    localStorage.setItem('traccian:cloud:key', cloudCfg.key);
    initSupabase();
    await restoreCloudSession();
    historyCache = null; render();
  }
  async function cloudSignUp(email, pw){
    if(!sb) return;
    cloudBusy=true; render();
    const { data, error } = await sb.auth.signUp({ email, password: pw });
    cloudBusy=false;
    if(error){ alert('Errore registrazione: '+error.message); render(); return; }
    if(data.user && !data.session){ alert('Controlla la casella email per confermare l\'account, poi accedi.'); cloudUser=null; }
    else { cloudUser = data.user; historyCache=null; }
    render();
  }
  async function cloudSignIn(email, pw){
    if(!sb) return;
    cloudBusy=true; render();
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    cloudBusy=false;
    if(error){ alert('Errore accesso: '+error.message); render(); return; }
    cloudUser = data.user; historyCache=null; render();
  }
  async function cloudSignOut(){
    if(sb) try{ await sb.auth.signOut(); }catch(e){}
    cloudUser = null; historyCache = null; render();
  }
  function recToRow(rec){
    return {
      id: rec.id, user_id: cloudUser.id, ts: rec.ts, date_label: rec.dateLabel,
      stim_type: rec.stimType, n_level: rec.nLevel, trials: rec.trials, isi: rec.isi,
      stim_duration: rec.stimDuration, resp_mode: rec.respMode, patient_code: rec.patientCode,
      notes: rec.notes, task_mode: rec.taskMode, target_seq: rec.targetSeq,
      counts: rec.counts, metrics: rec.metrics, avg_rt: rec.avgRT, duration_ms: rec.durationMs
    };
  }
  function rowToRec(row){
    return {
      id: row.id, ts: row.ts, dateLabel: row.date_label, stimType: row.stim_type, nLevel: row.n_level,
      trials: row.trials, isi: row.isi, stimDuration: row.stim_duration, respMode: row.resp_mode,
      patientCode: row.patient_code, notes: row.notes, taskMode: row.task_mode, targetSeq: row.target_seq,
      counts: row.counts, metrics: row.metrics, avgRT: row.avg_rt, durationMs: row.duration_ms
    };
  }
  async function pushSession(rec){
    if(!sb || !cloudUser) return;
    try{ await sb.from('sessioni').upsert(recToRow(rec)); }
    catch(e){ console.error('sync push fallita', e); }
  }
  async function pullRemote(){
    if(!sb || !cloudUser) return [];
    try{
      const { data, error } = await sb.from('sessioni').select('*').eq('user_id', cloudUser.id).order('ts',{ascending:false});
      if(error) throw error;
      return (data||[]).map(rowToRec);
    }catch(e){ console.error('sync pull fallita', e); return []; }
  }

  /* ---------- SETUP SCREEN ---------- */
  function ScreenSetup(root){
    root.appendChild(el('div',{class:'brand'},[
      el('div',{class:'mark'},['Traccia',el('span',{},['N'])]),
      el('div',{class:'sub'},['test n-back · working memory'])
    ]));
    const s = el('div',{class:'screen'});
    const card = el('div',{class:'card'});
    card.appendChild(el('h2',{},['Imposta la sessione']));
    card.appendChild(el('p',{class:'hint'},['Scegli il tipo di stimolo, il livello n-back e i parametri temporali. I valori restano impostati per la prossima sessione.']));

    const grid = el('div',{class:'grid'});

    // stimulus type

  function field(label, control){
    const f = el('div',{class:'field'});
    f.appendChild(el('label',{},[label]));
    f.appendChild(control);
    return f;
  }
  function segButtons(values, current, onPick, labels){
    const wrap = el('div',{class:'seg'});
    values.forEach(v=>{
      const b = el('button',{class: v===current?'on':'', onclick:()=>onPick(v)},[(labels&&labels[v])||v]);
      wrap.appendChild(b);
    });
    return wrap;
  }
  function stepper(val,min,max,onChange,step,fmt){
    step = step||1;
    let cur = val;
    const wrap = el('div',{class:'stepper'});
    const valNode = el('div',{class:'val'},[fmt? fmt(cur) : String(cur)]);
    function set(nv){
      cur = Math.max(min,Math.min(max,nv));
      valNode.textContent = fmt? fmt(cur) : String(cur);
      onChange(cur);
    }
    wrap.appendChild(el('button',{onclick:()=>set(cur-step)},['–']));
    wrap.appendChild(valNode);
    wrap.appendChild(el('button',{onclick:()=>set(cur+step)},['+']));
    return wrap;
  }
  function sequenceEditor(){

  function ScreenCountdown(root){

  /* ---------- TASK ENGINE ---------- */
  function startSession(){
    session = {
      seq: buildSequence(), idx:-1, timer:null, timerInfo:null, phase:'idle',
      counts:{hits:0, misses:0, falseAlarms:0, correctRejections:0, targets:0, nonTargets:0},
      trail:[], responded:false, respTime:null, trialStart:0,
      rts:[], startedAt: Date.now(), paused:false, pausedAt:null
    };
    view='task'; render();
    nextTrial();
  }
  // Wraps setTimeout so a pause can compute and preserve the remaining delay.
  function scheduleStep(fn, delay){
    const startedAt = performance.now();
    session.timerInfo = {fn, delay, startedAt};
    session.timer = setTimeout(()=>{ session.timerInfo=null; fn(); }, delay);
  }
  function pauseTask(){
    if(!session || session.paused) return;
    if(session.timer) clearTimeout(session.timer);
    if(session.timerInfo){
      const elapsed = performance.now() - session.timerInfo.startedAt;
      session.timerInfo.remaining = Math.max(50, session.timerInfo.delay - elapsed);
    }
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    session.paused = true;
    session.pausedAt = performance.now();
    render();
  }
  function resumeTask(){
    if(!session || !session.paused) return;
    const pausedDuration = performance.now() - session.pausedAt;
    session.trialStart += pausedDuration; // keep reaction times measured on active time only
    session.paused = false;
    if(session.timerInfo){
      const {fn, remaining} = session.timerInfo;
      session.timer = setTimeout(()=>{ session.timerInfo=null; fn(); }, remaining);
    }
    render();
  }
  function nextTrial(){
    session.idx++;
    if(session.idx >= session.seq.length){ finishSession(); return; }
    const trial = session.seq[session.idx];
    session.phase='show'; session.responded=false; session.respTime=null;
    session.trialStart = performance.now();
    render();
    // present stimulus
    presentStimulus(trial);
    // stimulus visible/audible for stimDuration
    scheduleStep(()=>{
      session.phase='wait'; render();
      scheduleStep(()=> resolveTrial(), Math.max(50,cfg.isi-cfg.stimDuration));
    }, cfg.stimDuration);
  }
  function presentStimulus(trial){
    if(cfg.stimType==='suoni'){
      const tone = trial.val; playTone(tone, cfg.stimDuration);
    } else if(cfg.voice && ['lettere','numeri','parole'].includes(cfg.stimType)){
      speak(String(trial.val));
    }
  }
  function registerTap(isMatchTap){
    if(!session || session.paused || session.responded || session.idx<0 || session.idx>=session.seq.length) return;
    if(cfg.respMode==='manuale') return;
    session.responded = true;
    session.respTime = performance.now()-session.trialStart;
    session.pendingTap = isMatchTap;
  }
  function resolveTrial(){
    const trial = session.seq[session.idx];
    let outcome = null;
    if(trial.valid){
      if(trial.isTarget) session.counts.targets++; else session.counts.nonTargets++;
      const tapped = cfg.respMode!=='manuale' && session.responded && session.pendingTap;
      if(cfg.respMode!=='manuale'){
        if(trial.isTarget && tapped){ session.counts.hits++; outcome='hit'; if(session.respTime) session.rts.push(session.respTime); }
        else if(trial.isTarget && !tapped){ session.counts.misses++; outcome='err'; }
        else if(!trial.isTarget && tapped){ session.counts.falseAlarms++; outcome='err'; }
        else { session.counts.correctRejections++; outcome='hit'; }
      } else {
        outcome = 'pend';
      }
    }
    if(outcome) session.trail.push({outcome, target:trial.isTarget});
    nextTrial();
  }

  function mountTaskScreen(root){
    const infoSpan = el('div',{class:'info'},['']);
    const pauseBtn = el('button',{onclick:()=>{ session.paused ? resumeTask() : pauseTask(); }},['Pausa']);
    root.appendChild(el('div',{class:'topbar'},[
      infoSpan,
      el('div',{style:'display:flex; gap:8px;'},[
        pauseBtn,
        el('button',{onclick:()=>{ if(confirm('Interrompere la sessione in corso?')){ if(session.timer) clearTimeout(session.timer); view='setup'; render(); } }},['Interrompi'])
      ])
    ]));
    const stage = el('div',{class:'stage'});
    const stimSlot = el('div',{},[]);
    const trail = el('div',{class:'trail'});
    stage.appendChild(stimSlot);
    stage.appendChild(trail);
    root.appendChild(stage);

    let matchBtn=null, noBtn=null, manualNote=null;
    if(cfg.respMode!=='manuale'){
      const resp = el('div',{class:'respond'});
      const isSeq = cfg.taskMode==='sequenza';
      const matchLabel = isSeq
        ? (cfg.respMode==='operatore' ? "Il paziente segnala: sequenza appena avvenuta" : "È appena avvenuta la sequenza")
        : (cfg.respMode==='operatore' ? 'Il paziente indica corrispondenza' : 'Corrispondenza (n='+cfg.nLevel+')');
      const noLabel = isSeq
        ? 'Nessuna sequenza'
        : (cfg.respMode==='operatore' ? 'Nessuna indicazione' : 'Nessuna corrispondenza');
      matchBtn = el('button',{class:'tapbtn match', onclick:()=>{ registerTap(true); flashTap(matchBtn); }},[matchLabel]);
      noBtn = el('button',{class:'tapbtn nomatch', onclick:()=>{ registerTap(false); flashTap(noBtn); }},[noLabel]);
      resp.appendChild(matchBtn); resp.appendChild(noBtn);
      root.appendChild(resp);
    } else {
      const resp = el('div',{class:'respond'});
      manualNote = el('div',{style:'color:#fff; font-size:13px; opacity:.8; align-self:center;'},['Modalità manuale: la sequenza scorre automaticamente. I risultati si inseriscono al termine.']);
      resp.appendChild(manualNote);
      root.appendChild(resp);
    }
    return {infoSpan, pauseBtn, stimSlot, trail, matchBtn, noBtn};
  }
  function flashTap(btn){
    if(!btn) return;
    btn.classList.add('tapped');
    setTimeout(()=> btn.classList.remove('tapped'), 180);
  }
  function updateTaskScreen(){
    const d = taskDom;
    const trial = session.idx>=0 && session.idx<session.seq.length ? session.seq[session.idx] : null;
    d.infoSpan.textContent = 'prova '+(Math.min(session.idx+1,session.seq.length))+' / '+session.seq.length+' · '+
      (cfg.taskMode==='sequenza' ? 'sequenza '+describeTargetSeq() : 'n='+cfg.nLevel)+' · '+STIM_LABELS[cfg.stimType];
    d.pauseBtn.textContent = session.paused ? '▶ Riprendi' : '❚❚ Pausa';

    d.stimSlot.innerHTML='';
    if(session.paused){
      d.stimSlot.appendChild(el('div',{class:'blank'},['❚❚ in pausa']));
    } else if(trial && session.phase==='show'){
      d.stimSlot.appendChild(renderStimulusNode(trial));
    } else {
      d.stimSlot.appendChild(el('div',{class:'blank'},['· · ·']));
    }

    d.trail.innerHTML='';
    session.trail.slice(-16).forEach(t=> d.trail.appendChild(el('div',{class:'chip '+t.outcome})));

    // enable/disable is visual only (buttons stay mounted throughout the trial)
    const canRespond = cfg.respMode!=='manuale' && !session.responded && !session.paused;
    if(d.matchBtn){ d.matchBtn.style.opacity = canRespond ? '1' : '.55'; d.matchBtn.style.pointerEvents = session.paused ? 'none' : 'auto'; }
    if(d.noBtn){ d.noBtn.style.opacity = canRespond ? '1' : '.55'; d.noBtn.style.pointerEvents = session.paused ? 'none' : 'auto'; }
  }
  function renderStimulusNode(trial){
    if(cfg.stimType==='simboli'){
      return el('div',{class:'stimulus symbolwrap'},[trial.val]);
    }
    if(cfg.stimType==='parole'){
      return el('div',{class:'stimulus word'},[trial.val]);
    }
    if(cfg.stimType==='suoni'){
      return el('div',{class:'audio-pulse active'},['♪']);
    }
    return el('div',{class:'stimulus'},[trial.val]);
  }

  /* ---------- FINISH / RESULTS ---------- */
  function finishSession(){
    const durationMs = Date.now()-session.startedAt;
    const avgRT = session.rts.length? session.rts.reduce((a,b)=>a+b,0)/session.rts.length : null;
    if(cfg.respMode==='manuale'){
      view='manualEntry'; render(); return;
    }
    completeAndSave(session.counts, avgRT, durationMs);
  }
  async function completeAndSave(counts, avgRT, durationMs){
    const metrics = scoreFromCounts(counts);
    const rec = {
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      ts: Date.now(), dateLabel: todayStr(),
      stimType: cfg.stimType, nLevel: cfg.nLevel, trials: cfg.trials, isi: cfg.isi, stimDuration: cfg.stimDuration,
      respMode: cfg.respMode, patientCode: cfg.patientCode, notes: cfg.notes,
      taskMode: cfg.taskMode, targetSeq: cfg.taskMode==='sequenza' ? cfg.targetSeq.map(seqLabel) : null,
      counts, metrics, avgRT, durationMs
    };
    lastResult = rec;
    await saveSession(rec);
    view='results'; render();
  }

          el('div',{},[
            el('div',{},[STIM_LABELS[r.stimType]+' · '+(r.taskMode==='sequenza' ? 'seq '+(r.targetSeq||[]).join('→') : 'n='+r.nLevel)+' · '+r.trials+' prove'+(r.patientCode?' · '+r.patientCode:'')]),
            el('div',{class:'l'},[r.dateLabel])
          ]),
          el('div',{},[fmtPct(r.metrics.acc)+(r.metrics.dprime!=null? ' · d′ '+r.metrics.dprime.toFixed(2):'')])
        ]);
        listWrap.appendChild(row);
      });
    });
  }

  const SCREENS = {
    setup: ScreenSetup, countdown: ScreenCountdown,
    manualEntry: ScreenManualEntry, results: ScreenResults, history: ScreenHistory,
    cloud: ScreenCloud
  };

  initSupabase();
  restoreCloudSession().finally(render);
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
