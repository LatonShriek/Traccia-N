  // Login paziente: un solo campo (codice di accesso) — internamente si
  // traduce nell'email sintetica creata dalla funzione di creazione account.
  function patientCodeToEmail(code){ return code.trim().toLowerCase()+'@paz.traccian.local'; }
  async function cloudPatientSignIn(code){
    if(!sb) return;
    const normalized = code.trim().toUpperCase();
    cloudBusy=true; render();
    const { data, error } = await sb.auth.signInWithPassword({ email: patientCodeToEmail(normalized), password: normalized });
    cloudBusy=false;
    if(error){ alert('Codice non riconosciuto: '+error.message); logAccessEvent('login','fallito','paziente',null,normalized); render(); return; }
    cloudUser = data.user; await checkRole(); historyCache=null;
    if(!patientProfile){ alert('Questo account non risulta un account paziente valido.'); logAccessEvent('login','fallito','paziente',cloudUser.id,normalized); cloudUser=null; await cloudSignOut(); return; }
    if(patientProfile.attivo === false){ alert('Questo profilo è stato archiviato dall\'operatore e non può accedere in autonomia. Contatta la struttura.'); logAccessEvent('login','fallito','paziente',cloudUser.id,normalized,patientProfile.codice_paziente); cloudUser=null; await cloudSignOut(); return; }
    await claimSession();
    logAccessEvent('login','successo','paziente',cloudUser.id,normalized,patientProfile.codice_paziente);
    view='patientHome'; render();
  }
  async function cloudSignOut(){
    stopSessionGuard();
    if(cloudUser) logAccessEvent('logout','successo', patientProfile?'paziente':'operatore', cloudUser.id, cloudUser.email, patientProfile?patientProfile.codice_paziente:null);
    if(sb) try{ await sb.auth.signOut(); }catch(e){}
    cloudUser = null; patientProfile = null; isSuperOperatore = false; historyCache = null;
    cachedRemotePatients = null; localPatientsCloudCache = null; accessLogCache = null;
    view='cloud'; render();
  }
  // Crea un nuovo account paziente tramite la Edge Function (unico punto che
  // può creare account, perché richiede la service_role key lato server —
  // mai esposta al browser). Restituisce {codiceAccesso, pazienteId} o null.
  async function createPatientAccount(codicePaziente){
    if(!sb || !cloudUser || patientProfile) return null; // solo operatori
    try{
      const { data: sessionData } = await sb.auth.getSession();
      const token = sessionData && sessionData.session ? sessionData.session.access_token : null;
      if(!token){ alert('Sessione non valida, riaccedi.'); return null; }
      const fnUrl = cloudCfg.url.replace(/\/$/,'') + '/functions/v1/create-patient';
      const resp = await fetch(fnUrl, {
        method:'POST',
        headers:{'Content-Type':'application/json', 'apikey': cloudCfg.key, 'Authorization':'Bearer '+token},
        body: JSON.stringify({codicePaziente})
      });
      let json = {};
      try{ json = await resp.json(); }catch(e){ /* risposta non-JSON, es. pagina di errore della piattaforma */ }
      if(!resp.ok){ alert('Errore creazione paziente ('+resp.status+'): '+(json.error||json.message||'la funzione create-patient non risponde correttamente — verifica di averla pubblicata con questo nome esatto.')); return null; }
      return json;
    }catch(e){ alert('Errore di rete nella creazione del paziente: '+e.message); return null; }
  }
  async function listMyPatients(){
    if(!sb || !cloudUser || patientProfile) return [];
    try{
      const { data, error } = await sb.from('pazienti').select('*').eq('operatore_id', cloudUser.id).order('creato_il',{ascending:false});
      if(error) throw error;
      return data||[];
    }catch(e){ console.error(e); return []; }

  async function assignProgramToPatient(pazienteId, program){
    if(!sb || !cloudUser) return false;
    try{
      const { error } = await sb.from('pazienti').update({programma_assegnato:program}).eq('id', pazienteId).eq('operatore_id', cloudUser.id);

  async function saveRemotePatientConfig(pazienteId, presetCfg){
    if(!sb || !cloudUser) return;
    try{ await sb.from('pazienti').update({ultima_config:presetCfg}).eq('id', pazienteId); }
    catch(e){ console.error('salvataggio ultima configurazione fallito', e); }
  }
  // A differenza di ultima_config/lastConfig (un solo "ultimo usato",
  // sovrascritto ogni volta), questa mappa ricorda il livello raggiunto
  // separatamente per CIASCUN esercizio — necessario per un paziente con
  // più esercizi assegnati: fare Go/No-Go oggi non deve far dimenticare a
  // che livello era arrivato ieri con l'N-back.
  async function saveExerciseLevel(kind, id, taskMode, snap){
    if(kind==='local'){
      try{
        const raw = localStorage.getItem('traccian:localpatient:'+id);
        if(!raw) return;
        const p = JSON.parse(raw);
        p.livelliEsercizi = p.livelliEsercizi || {};
        p.livelliEsercizi[taskMode] = snap;
        localStorage.setItem('traccian:localpatient:'+id, JSON.stringify(p));
        syncLocalPatientToCloud(p);
      }catch(e){}
    } else if(sb && cloudUser){
      try{
        let existing = null;
        if(patientProfile && patientProfile.id===id) existing = patientProfile.livelli_esercizi;
        else{
          const cached = (cachedRemotePatients||[]).find(p=>p.id===id);
          existing = cached ? cached.livelli_esercizi : (await fetchRemotePatientFresh(id) || {}).livelli_esercizi;
        }
        const merged = Object.assign({}, existing||{}, {[taskMode]:snap});
        await sb.from('pazienti').update({livelli_esercizi:merged}).eq('id', id);
        if(patientProfile && patientProfile.id===id) patientProfile.livelli_esercizi = merged;
        cachedRemotePatients = null;
      }catch(e){ console.error('salvataggio livello esercizio fallito', e); }
    }
  }
  // Configurazione da usare per (ri)aprire un esercizio specifico per un
  // paziente: preferisce il livello che il paziente ha già raggiunto in
  // QUELL'esercizio (se presente), altrimenti torna null (chi chiama
  // ricadrà sul suggerimento da screening o sul livello 1).
  function configForExercise(patientLike, taskMode){
    if(!patientLike) return null;
    const map = patientLike.livelli_esercizi || patientLike.livelliEsercizi;
    return (map && map[taskMode]) ? map[taskMode] : null;
  }
  // Slot nominali per paziente/esercizio — a differenza di
  // livelli_esercizi/livelliEsercizi (UN solo slot, "ultima raggiunta",
  // sovrascritto ad ogni sessione), qui il clinico salva ESPLICITAMENTE
  // una configurazione con un nome a scelta, e ne può avere più di una
  // per lo stesso paziente/esercizio (es. "Livello base", "Rivalutazione
  // marzo"), mai sovrascritte da una sessione qualunque — solo da
  // un salvataggio esplicito con lo stesso nome. Stessa infrastruttura di
  // storage di saveExerciseLevel sopra (localStorage per i pazienti in
  // presenza, colonna Supabase per quelli remoti), campo separato.
  function namedConfigsFor(patientLike, taskMode){
    if(!patientLike) return [];
    const map = patientLike.configurazioni_salvate || patientLike.configurazioniSalvate;
    return (map && map[taskMode]) ? map[taskMode] : [];
  }
  async function saveNamedConfig(kind, id, taskMode, nome, snap){
    if(kind==='local'){
      try{
        const raw = localStorage.getItem('traccian:localpatient:'+id);
        if(!raw) return false;
        const p = JSON.parse(raw);
        p.configurazioniSalvate = p.configurazioniSalvate || {};
        p.configurazioniSalvate[taskMode] = p.configurazioniSalvate[taskMode] || [];
        const list = p.configurazioniSalvate[taskMode];
        const i = list.findIndex(x=>x.nome===nome);
        const entry = {nome, cfg:snap, savedAt:Date.now()};
        if(i>=0) list[i]=entry; else list.push(entry);
        localStorage.setItem('traccian:localpatient:'+id, JSON.stringify(p));
        syncLocalPatientToCloud(p);
        return true;
      }catch(e){ return false; }
    } else if(sb && cloudUser){
      try{
        let existing = null;
        if(patientProfile && patientProfile.id===id) existing = patientProfile.configurazioni_salvate;
        else{
          const cached = (cachedRemotePatients||[]).find(p=>p.id===id);
          existing = cached ? cached.configurazioni_salvate : (await fetchRemotePatientFresh(id) || {}).configurazioni_salvate;
        }
        const map = Object.assign({}, existing||{});
        const list = (map[taskMode]||[]).slice();
        const i = list.findIndex(x=>x.nome===nome);
        const entry = {nome, cfg:snap, savedAt:Date.now()};
        if(i>=0) list[i]=entry; else list.push(entry);
        map[taskMode] = list;
        await sb.from('pazienti').update({configurazioni_salvate:map}).eq('id', id);
        if(patientProfile && patientProfile.id===id) patientProfile.configurazioni_salvate = map;
        cachedRemotePatients = null;
        return true;
      }catch(e){ console.error('salvataggio configurazione nominale fallito', e); return false; }
    }
    return false;
  }
  async function deleteNamedConfig(kind, id, taskMode, nome){
    if(kind==='local'){
      try{
        const raw = localStorage.getItem('traccian:localpatient:'+id);
        if(!raw) return false;
        const p = JSON.parse(raw);
        if(p.configurazioniSalvate && p.configurazioniSalvate[taskMode]){
          p.configurazioniSalvate[taskMode] = p.configurazioniSalvate[taskMode].filter(x=>x.nome!==nome);
        }
        localStorage.setItem('traccian:localpatient:'+id, JSON.stringify(p));
        syncLocalPatientToCloud(p);
        return true;
      }catch(e){ return false; }
    } else if(sb && cloudUser){
      try{
        let existing = null;
        if(patientProfile && patientProfile.id===id) existing = patientProfile.configurazioni_salvate;
        else{
          const cached = (cachedRemotePatients||[]).find(p=>p.id===id);
          existing = cached ? cached.configurazioni_salvate : (await fetchRemotePatientFresh(id) || {}).configurazioni_salvate;
        }
        const map = Object.assign({}, existing||{});
        if(map[taskMode]) map[taskMode] = map[taskMode].filter(x=>x.nome!==nome);
        await sb.from('pazienti').update({configurazioni_salvate:map}).eq('id', id);
        if(patientProfile && patientProfile.id===id) patientProfile.configurazioni_salvate = map;
        cachedRemotePatients = null;
        return true;
      }catch(e){ console.error('cancellazione configurazione nominale fallita', e); return false; }
    }
    return false;
  }
  // Normalizza il programma di un paziente in un array {nome, cfg}[], sia per
  // i pazienti nuovi (programma_assegnato) sia per quelli assegnati prima
  // che esistesse il multi-esercizio (preset_assegnato singolo).
  function patientProgram(p){
    if(!p) return [];
    if(p.programma_assegnato && p.programma_assegnato.length) return p.programma_assegnato; // paziente remoto
    if(p.programma && p.programma.length) return p.programma; // paziente in presenza
    if(p.preset_assegnato){
      const c = p.preset_assegnato;
      const nome = EXERCISES[c.taskMode] ? EXERCISES[c.taskMode].label : c.taskMode;
      return [{nome, cfg:c}];
    }
    return [];
  }
  function recToRow(rec){
    const isPatientSaving = !!patientProfile;
    return {
      id: rec.id,
      user_id: cloudUser.id, // retro-compatibilità con record vecchi
      operatore_id: isPatientSaving ? patientProfile.operatore_id : cloudUser.id,
      paziente_id: isPatientSaving ? cloudUser.id : (rec.pazienteId || null),
      local_patient_id: rec.localPatientId || null,
      ts: rec.ts, date_label: rec.dateLabel,
      stim_type: rec.stimType, n_level: rec.nLevel, trials: rec.trials, isi: rec.isi,
      stim_duration: rec.stimDuration, resp_mode: rec.respMode, patient_code: rec.patientCode,
      notes: rec.notes, task_mode: rec.taskMode, target_seq: rec.targetSeq,
      final_level: rec.finalLevel!=null ? String(rec.finalLevel) : null,
      counts: rec.counts, metrics: rec.metrics, avg_rt: rec.avgRT, duration_ms: rec.durationMs,
      family: rec.family || null, counts_aud: rec.countsAud || null, metrics_aud: rec.metricsAud || null,
      choice: rec.choice || null, ssrt: rec.ssrt!=null?rec.ssrt:null, mean_ssd: rec.meanSSD!=null?rec.meanSSD:null,
      neglect: rec.neglect || null, goaltask: rec.goaltask || null, memoria: rec.memoria || null,
      titration_mode: rec.titrationMode || null, target_rate: rec.targetRate!=null ? rec.targetRate : null
    };
  }
  function rowToRec(row){
    return {
      id: row.id, ts: row.ts, dateLabel: row.date_label, stimType: row.stim_type, nLevel: row.n_level,
      trials: row.trials, isi: row.isi, stimDuration: row.stim_duration, respMode: row.resp_mode,
      patientCode: row.patient_code, notes: row.notes, taskMode: row.task_mode, targetSeq: row.target_seq,
      finalLevel: row.final_level!=null ? (row.final_level.includes && row.final_level.includes('/') ? row.final_level : Number(row.final_level)) : null,
      counts: row.counts, metrics: row.metrics, avgRT: row.avg_rt, durationMs: row.duration_ms,
      family: row.family || 'signal', countsAud: row.counts_aud, metricsAud: row.metrics_aud,
      choice: row.choice, ssrt: row.ssrt, meanSSD: row.mean_ssd, neglect: row.neglect, goaltask: row.goaltask, memoria: row.memoria,
      pazienteId: row.paziente_id || null, localPatientId: row.local_patient_id || null,
      // Colonne nuove (vedi commento su rec.titrationMode in completeAndSave)
      // — row.titration_mode/row.target_rate saranno undefined finché non
      // esistono davvero in Supabase; qui degradano a null senza errori,
      // il controllo di comparabilità dell'RCI tratta il dato mancante
      // come "non verificabile", non come "sicuramente comparabile".
      titrationMode: row.titration_mode || null, targetRate: row.target_rate!=null ? row.target_rate : null
    };
  }
  async function pushSession(rec){
    if(!sb || !cloudUser) return;
    try{ await sb.from('sessioni').upsert(recToRow(rec)); }
    catch(e){ console.error('sync push fallita', e); }
  }
  async function pullRemote(){
    if(!sb || !cloudUser) return [];
    try{
      const { data, error } = await sb.from('sessioni').select('*')
        .or('operatore_id.eq.'+cloudUser.id+',paziente_id.eq.'+cloudUser.id)
        .order('ts',{ascending:false});
      if(error) throw error;
      return (data||[]).map(rowToRec);
    }catch(e){ console.error('sync pull fallita', e); return []; }
  }

  /* ---------- SETUP SCREEN ---------- */
  function ScreenSetup(root){

    // operatore connesso, ma è anche la vera schermata radice dell'app in
    // uso locale puro (nessun cloud configurato, mai passata da
    // operatorHome) — l'Indietro punta a operatorHome quando esiste un

    ]));
    const s = el('div',{class:'screen'});
    const card = el('div',{class:'card'});
    if(buildingProgramFor){
      const giaNelProgramma = editingPatient ? patientProgram(editingPatient) : [];

      banner.appendChild(el('div',{style:'display:flex; align-items:center; justify-content:space-between;'},[

        el('button',{style:'background:none; border:none; color:var(--ink-soft); text-decoration:underline; font-size:12.5px; cursor:pointer; font-family:Inter;', onclick:()=>{ buildingProgramFor=null; editingProgramEntryIndex=null; programAddConfirmation=null; view='patientProgram'; render(); }},['Annulla'])
      ]));
      banner.appendChild(el('div',{style:'font-size:12.5px; color:var(--ink-soft); margin-top:6px;'},[

    else { const ncs = namedConfigSection(); if(ncs) card.appendChild(ncs); }

    const grid = el('div',{class:'grid'});
    const ex = EXERCISES[cfg.taskMode];

    // exercise selector (comes first: it determines which other fields apply)
    grid.appendChild(field('Esercizio', segButtons(Object.keys(EXERCISES), cfg.taskMode, v=>{
      cfg.taskMode=v;

              if(on) cfg.neglectRuleClauses = cfg.neglectRuleClauses.filter(x=>x!==k);
              else cfg.neglectRuleClauses = cfg.neglectRuleClauses.concat([k]);
              render();
            }},[CLAUSE_LABELS[k]]);
            wrap.appendChild(b);
          });
          grid.appendChild(field('Condizioni attive (tocca per attivare/disattivare)', wrap));
        }
      }
      grid.appendChild(field('Numero di tavole', stepper(cfg.trials,1,10,v=>{cfg.trials=v;},1)));
      grid.appendChild(field('Elementi per tavola', stepper(cfg.neglectBoardSize,15,80,v=>{cfg.neglectBoardSize=v;},5)));
      grid.appendChild(field('Layout', segButtons(['griglia','sparsa'], cfg.neglectLayout, v=>{cfg.neglectLayout=v; render();}, {griglia:'Organizzato (griglia)', sparsa:'Sparso (libero)'})));
      if(cfg.neglectMode==='classico' || cfg.neglectMode==='progressiva'){
        grid.appendChild(field('Gradiente sinistra/destra', stepper(cfg.neglectGradient,0,100,v=>{cfg.neglectGradient=v; render();},5,v=> v+'% sin. / '+(100-v)+'% des.')));
        grid.appendChild(field('Sollecitazione bottom-up', segButtons(['auto','off'], cfg.neglectBottomUp, v=>{cfg.neglectBottomUp=v; render();}, {auto:'Automatica (solo livelli bassi, se emerge asimmetria)', off:'Disattivata (consigliata in rivalutazione)'})));
      }
      grid.appendChild(field('Tempo limite per tavola', stepper(cfg.neglectTimeLimit,0,180,v=>{cfg.neglectTimeLimit=v;},15,s=> s===0?'nessuno':s+' s')));
      grid.appendChild(field('Modalità', segButtons(['manuale','livello','adattivo'], cfg.titrationMode||'manuale', v=>{
        cfg.titrationMode = v;
        cfg.adaptive = v==='adattivo';
        render();
      }, {manuale:'Manuale', livello:'Livello', adattivo:'Adattivo'})));
      card.appendChild(el('p',{class:'hint'},[neglectTitrationModeHint(cfg, cfg.titrationMode||'manuale')]));
    }

    // target rate — riusato con etichetta diversa per ciascun esercizio
    const rateLabels = {
      nback:'Frequenza target', sequenza:'Frequenza target', gonogo:'Frequenza no-go',
      stopsignal:'Frequenza trial di stop', switching:'Frequenza cambio regola'
    };
    if(rateLabels[cfg.taskMode]){
      const resolvedFreq = TITRATION_EXERCISES.includes(cfg.taskMode) && cfg.titrationMode && cfg.titrationMode!=='manuale' ? resolvedFreqForDisplay(cfg.taskMode, cfg) : null;
      if(resolvedFreq!=null){
        grid.appendChild(field(rateLabels[cfg.taskMode]+' — da tabella, livello '+levelOfCfg(cfg), el('div',{style:'padding:10px 14px; background:var(--paper-dim); border-radius:8px; font-size:14px; color:var(--ink-soft);'},[Math.round(resolvedFreq*100)+'% — segue il livello, non modificabile in questa modalità'])));
      } else {
        grid.appendChild(field(rateLabels[cfg.taskMode], stepper(Math.round(cfg.targetRate*100),15,45,v=>{cfg.targetRate=v/100; render();},5,v=>v+'%')));
      }
    }

    // Stop-Signal: parametri dello staircase SSD
    if(cfg.taskMode==='stopsignal'){
      grid.appendChild(field('Ritardo iniziale segnale di stop (SSD)', stepper(cfg.ssd,0,cfg.isi-100,v=>{cfg.ssd=v; render();},50,ms=>ms+' ms')));
      grid.appendChild(field('Passo di adattamento SSD', stepper(cfg.ssdStep,10,150,v=>{cfg.ssdStep=v; render();},10,ms=>ms+' ms')));
    }

    card.appendChild(grid);
    if(cfg.taskMode!=='neglect' && !isGoalTask && !isMemoria){
      card.appendChild(field('Progressione durante la sessione', segButtons(['si','no'], cfg.showTrail?'si':'no', v=>{ cfg.showTrail = v==='si'; render(); }, {si:'Mostra (pallini verdi/rossi)', no:'Nascosta'})));
    }

    if(ex.usesTargetSeq && !(cfg.taskMode==='neglect' && cfg.neglectMode!=='classico' && cfg.neglectMode!=='progressiva')){
      card.appendChild(sequenceEditor());
    }
    if(isNeglect){
      if(cfg.neglectMode==='classico'){
        card.appendChild(el('p',{class:'hint'},['Compaiono molti elementi contemporaneamente sulla tavola: quelli scelti sopra sono i bersagli da toccare, tutti gli altri sono distrattori. Il gradiente permette di caricare deliberatamente un lato; la tavola avanza solo quando tocchi "Fatto" — mai da sola, nemmeno se hai già trovato tutti i bersagli — così devi monitorare tu stesso l\'avanzamento.']));
      } else if(cfg.neglectMode==='intruso'){
        card.appendChild(el('p',{class:'hint'},['Ricerca visiva a singolarità: un solo elemento sulla tavola non ha alcun doppione. Ai livelli bassi il resto della tavola è ripetitivo (poche identità molto ripetute, il singolo spicca per contrasto); ai livelli alti diventa eterogeneo (quasi ogni elemento ha un solo doppione, serve confrontarli uno per uno). La tavola avanza solo quando tocchi "Fatto".']));
      } else if(cfg.neglectMode==='regola'){
        card.appendChild(el('p',{class:'hint'},['Conteggio/ricerca a regola composta: la regola cresce di una condizione in più ogni 2 livelli (1-10), cumulativa. La tavola avanza solo quando tocchi "Fatto".']));
      } else {
        card.appendChild(el('p',{class:'hint'},['Progressiva: la sessione passa da sola da una fase all\'altra seguendo il livello 1-30 (con l\'adattivo, in base all\'accuratezza; da fissa, resta sulla fase del livello scelto sopra). La tavola avanza solo quando tocchi "Fatto".']));
      }
      if(cfg.adaptive){
        card.appendChild(el('p',{class:'hint'},['Con l\'adattivo attivo, elementi per tavola e tempo limite crescono/calano insieme in base all\'accuratezza (regola 70-85%)'+((cfg.neglectMode==='classico'||cfg.neglectMode==='progressiva')?'; il gradiente si sposta automaticamente verso il lato che va peggio tavola dopo tavola, fino a un massimo di 75/25 (solo nella fase Classico, se progressiva).':'.')]));
      }
    }
    if(cfg.taskMode==='ant'){
      card.appendChild(field('Modalità', segButtons(['classico','tapat'], cfg.antMode, v=>{cfg.antMode=v; render();}, {classico:'ANT classico (misura)', tapat:'TAPAT (training tonico/fasico)'})));
      if(cfg.antMode==='tapat'){
        card.appendChild(el('p',{class:'hint'},['Variante orientata al training, non alla misura: prima metà delle prove senza cue e con intervalli lunghi e imprevedibili (allerta tonica/sostenuta), seconda metà con intervalli più brevi e un cue di allerta in metà dei casi (allerta fasica). Risposta: tocca appena vedi il bersaglio, non c\'è scelta di direzione. Nota terminologica: il blocco tonico richiede di sostenere l\'attivazione da soli nel tempo, il blocco fasico la innesca un cue esterno appena prima del bersaglio — un\'analogia concettuale con proattivo/reattivo (Braver, 2012), non un\'equivalenza dimostrata nello stesso paradigma.']));
        if(cfg.adaptive){
          card.appendChild(el('p',{class:'hint'},['La difficoltà del blocco tonico (durata delle attese) sale se l\'accuratezza supera l\'85% negli ultimi 8 trial validi, scende sotto il 70% — 5 livelli, dalle attese brevi (2-4s) a quelle lunghe e imprevedibili (8-15s). Puoi comunque forzare il livello con i pulsanti +/– nella barra in alto durante la sessione.']));
        }
        card.appendChild(field('Modalità', segButtons(['visivo','uditivo'], cfg.tapatModalita, v=>{cfg.tapatModalita=v; render();}, {visivo:'Visivo (bersaglio a schermo)', uditivo:'Uditivo (bersaglio sonoro)'})));
        if(cfg.tapatModalita==='uditivo'){
          card.appendChild(el('p',{class:'hint'},['Il bersaglio è un tono dedicato, non uno stimolo visivo — a schermo non compare nulla che anticipi comparsa o posizione del bersaglio, nemmeno il cue fasico (che resta comunque un suono, invariato). Protocollo con base in letteratura: allenamento tonico/fasico dell\'attenzione (DeGutis & Van Vleet, 2010, validato su pazienti con neglect emispaziale) e un precedente diretto di cross-training uditivo-visivo nel neglect (Van Vleet & DeGutis, 2013, Cortex). Richiede cuffie o casse stereo funzionanti — con un solo altoparlante mono (es. telefono appoggiato sul tavolo) il bersaglio si sente comunque, ma la componente spaziale sinistra/destra sotto non ha alcun effetto.']));
        }
        card.appendChild(field('Componente spaziale (neglect)', segButtons(['no','si'], cfg.tapatSpatial?'si':'no', v=>{cfg.tapatSpatial = v==='si'; render();}, {no:'Solo centrale', si:'Bersaglio a sinistra/destra'})));
        if(cfg.tapatSpatial){
          card.appendChild(field('Gradiente sinistra/destra', stepper(cfg.tapatGradient,0,100,v=>{cfg.tapatGradient=v; render();},5,v=> v+'% sin. / '+(100-v)+'% des.')));
          card.appendChild(el('p',{class:'hint'},['Il bersaglio compare a sinistra o a destra invece che al centro, nella proporzione impostata'+(cfg.tapatModalita==='uditivo'?' (in modalità uditiva, tramite panning stereo del tono invece che posizione a schermo — richiede cuffie/casse stereo, vedi sopra)':'')+'. Con l\'adattivo attivo, il gradiente si sposta da solo verso il lato dove l\'accuratezza è più bassa — favorendo l\'esplorazione proprio dello spazio più trascurato, seduta dopo seduta.']));
        }
      } else {
        card.appendChild(field('Materiale', segButtons(['frecce','lettere','simboli','misto'], cfg.antMaterial, v=>{cfg.antMaterial=v; render();}, {frecce:'Frecce (classico)', lettere:'Lettere (H/S)', simboli:'Simboli (●/■)', misto:'Mescolato (a caso ogni prova)'})));
        card.appendChild(el('p',{class:'hint'},['Versione semplificata dell\'Attention Network Test: allerta (cue presente/assente), orienting (cue spaziale valido/invalido), conflitto (flanker congruenti/incongruenti/neutri). Il paziente indica quale dei due elementi designati vede al centro.']));
        card.appendChild(el('p',{class:'hint'},['Il materiale non cambia la difficoltà — cambia solo il canale percettivo coinvolto. Utile per varietà tra sedute, o per evitare le frecce con pazienti con difficoltà visuospaziali specifiche.'+(cfg.antMaterial==='misto'?' In "Mescolato" ogni prova pesca a caso fra i tre — indici di allerta/orienting/conflitto calcolati sullo stesso identico modo, indipendentemente dal materiale pescato in quella prova.':'')]));
        if(cfg.trials<60){
          card.appendChild(el('p',{class:'hint', style:'color:var(--alert);'},['⚠ Gli indici si calcolano su 9 combinazioni cue×congruenza: con meno di 60 prove, ciascuna media poggia su troppo pochi trial per essere affidabile. Consigliate almeno 60–90 prove per questo esercizio.']));
        }
      }
    }
    if(cfg.taskMode==='switching'){
      // Lista esplicita, non Object.keys(SWITCH_RULESETS): quell'oggetto
      // contiene anche alias interni (lettereVoce/numeriVoce, usati da
      // Categorizzazione condizionale) che qui comparirebbero come bottoni
      // fantasma senza etichetta italiana — e 'colori', le cui uniche due
      // regole (Caldo/Freddo, Primario/Non primario) sono state rimosse in
      // quanto categorizzazioni troppo arbitrarie per un compito clinico.
      card.appendChild(field('Materiale', segButtons(['numeri','lettere','simboli','bivalente'], cfg.switchMaterial, v=>{ cfg.switchMaterial=v; render(); }, {numeri:'Numeri', lettere:'Lettere', simboli:'Simboli', bivalente:'Bivalente (conflitto)'})));
      const rs = SWITCH_RULESETS[cfg.switchMaterial];
      card.appendChild(el('p',{class:'hint'},['Regole di questa sessione: "'+rs.ruleA.label+'" ↔ "'+rs.ruleB.label+'". Un\'etichetta prima di ogni stimolo indica quale regola è attiva in quel momento.']));
      if(cfg.switchMaterial==='bivalente'){
        card.appendChild(el('p',{class:'hint'},['Modalità a doppia dimensione (tipo di carattere + colore, assegnati indipendentemente): su metà delle prove le due dimensioni indicano la stessa risposta ("congruenti"), sull\'altra metà indicano risposte opposte ("incongruenti") — genera un indice di conflitto in stile Stroop, oltre allo switch cost. Consigliate almeno 60 prove per un indice di conflitto stabile.']));
      }
    }
    if(cfg.taskMode==='simon'){
      card.appendChild(field('Proporzione di congruenza', segButtons(['bilanciato','prevalenza_congruente','prevalenza_incongruente'], cfg.simonCongruenza||'bilanciato', v=>{ cfg.simonCongruenza=v; render(); }, {bilanciato:'Bilanciato (50/50)', prevalenza_congruente:'Prevalenza congruente (75/25)', prevalenza_incongruente:'Prevalenza incongruente (25/75)'})));
      card.appendChild(el('p',{class:'hint'},['Regola fissa per tutta la sessione: "Blu" a sinistra, "Verde" a destra — la posizione in cui compare il cerchio non conta mai per la risposta, ma può coincidere (congruente) o no (incongruente) con il pulsante corretto. La proporzione qui sopra è un parametro clinico fisso, non una leva di difficoltà: un blocco a prevalenza congruente o incongruente permette di misurare quanto il paziente riesce a sfruttare l\'aspettativa generale del blocco per prepararsi in anticipo all\'interferenza (controllo proattivo); un blocco bilanciato non lo permette. Consigliate almeno 60 prove per un indice di conflitto stabile.']));
    }
    if(cfg.taskMode==='categorizzazione'){
      grid.appendChild(field('Modalità', segButtons(['manuale','livello','adattivo'], cfg.titrationMode||'manuale', v=>{
        cfg.titrationMode = v;
        cfg.adaptive = v==='adattivo';
        render();
      }, {manuale:'Manuale', livello:'Livello', adattivo:'Adattivo'})));
      const manuale = (cfg.titrationMode||'manuale')==='manuale';
      if(manuale){
        // In Manuale la struttura è una scelta indipendente dal numero di
        // livello (decisione di Rodrigo: più libertà per il clinico, al
        // prezzo dichiarato che il numero "Livello" smette di significare
        // qualcosa in questa modalità — per questo qui non compare affatto,
        // sostituito dalla scelta diretta di struttura).
        grid.appendChild(field('Struttura (1-5)', stepper(cfg.categStructManual||1,1,5,v=>{cfg.categStructManual=v; render();},1,v=>CATEG_STRUCTURE_LABELS[v])));
      } else {
        grid.appendChild(field('Livello (1-10)', stepper(cfg.categLivello,1,10,v=>{cfg.categLivello=v; render();},1)));
      }
      const cStruct = categEffectiveStructure(cfg);
      if(cStruct===1 || cStruct===4){
        card.appendChild(field('Materiale', segButtons(['simboli','lettereVoce','numeriVoce'], cfg.categMateriale, v=>{cfg.categMateriale=v; render();}, {simboli:'Simboli', lettereVoce:'Lettere pronunciate', numeriVoce:'Numeri pronunciati'})));
        const rs = SWITCH_RULESETS[cfg.categMateriale].ruleA;
        card.appendChild(el('p',{class:'hint'},['Regola di classificazione per questo materiale: "'+rs.labelA+'" vs "'+rs.labelB+'" ('+rs.label+').']));
      }
      card.appendChild(el('p',{class:'hint'},[CATEG_STRUCTURE_HINTS[cStruct]]));
      if(manuale){
        if(cStruct===4){
          grid.appendChild(field('Frequenza lure', stepper(Math.round((cfg.targetRate||0)*100),0,50,v=>{cfg.targetRate=v/100; render();},5,v=>v+'%')));
        } else {
          grid.appendChild(field('Intervallo tra stimoli (ISI)', stepper(cfg.isi,1000,4000,v=>{cfg.isi=v; updateDurEst();},200,ms=>(ms/1000).toFixed(1)+' s')));
        }
      }
      card.appendChild(el('p',{class:'hint'},[categTitrationModeHint(cfg, cfg.titrationMode||'manuale')]));
    }
    if(cfg.taskMode==='dualtask'){
      const DUAL_VIS_MATS = ['lettere','numeri','simboli','colori'];
      card.appendChild(field('Accoppiamento canali', segButtons(['vis-aud','vis-vis','aud-aud'], cfg.dualPairing, v=>{
        cfg.dualPairing=v;
        // Propone materiali casuali per i canali visivi appena si sceglie
        // l'abbinamento, invece di lasciare sempre lettere/numeri fissi —
        // modificabile subito dopo con i selettori sottostanti.
        if(v==='vis-aud'){ cfg.dualVisual = DUAL_VIS_MATS[Math.floor(Math.random()*DUAL_VIS_MATS.length)]; }
        else if(v==='vis-vis'){
          const a = DUAL_VIS_MATS[Math.floor(Math.random()*DUAL_VIS_MATS.length)];
          const rest = DUAL_VIS_MATS.filter(m=>m!==a);
          cfg.dualVisual = a; cfg.dualVisual2 = rest[Math.floor(Math.random()*rest.length)];
        }
        render();
      }, {'vis-aud':'Visivo + Uditivo', 'vis-vis':'Visivo + Visivo', 'aud-aud':'Uditivo + Uditivo'})));
      if(cfg.dualPairing==='vis-aud'){
        card.appendChild(field('Materiale canale visivo', segButtons(['lettere','numeri','simboli','colori'], cfg.dualVisual, v=>{ cfg.dualVisual=v; render(); }, STIM_LABELS)));
        card.appendChild(el('p',{class:'hint'},['Canale visivo ('+STIM_LABELS[cfg.dualVisual].toLowerCase()+') e canale uditivo (toni) simultanei, ciascuno con regola 1-back propria.']));
      } else if(cfg.dualPairing==='vis-vis'){
        card.appendChild(field('Materiale canale 1 (sinistra)', segButtons(['lettere','numeri','simboli','colori'], cfg.dualVisual, v=>{ cfg.dualVisual=v; render(); }, STIM_LABELS)));
        card.appendChild(field('Materiale canale 2 (destra)', segButtons(['lettere','numeri','simboli','colori'], cfg.dualVisual2, v=>{ cfg.dualVisual2=v; render(); }, STIM_LABELS)));
        card.appendChild(el('p',{class:'hint'},['Due flussi visivi simultanei, uno a sinistra ('+STIM_LABELS[cfg.dualVisual].toLowerCase()+') e uno a destra ('+STIM_LABELS[cfg.dualVisual2].toLowerCase()+'), ciascuno con regola 1-back propria.']));
      } else {
        card.appendChild(el('p',{class:'hint'},['Due toni simultanei di registro diverso (uno grave, uno acuto), ciascuno con regola 1-back propria — nessuno stimolo visivo. Separati con panning stereo netto (grave a sinistra, acuto a destra): richiede cuffie o casse stereo funzionanti — con un solo altoparlante mono (es. telefono appoggiato sul tavolo) i due toni si sentono comunque, ma senza la separazione spaziale che li rende distinguibili.']));
      }
      card.appendChild(el('p',{class:'hint'},['Ogni canale ha un proprio livello (1-10, pulsanti C1/C2 in barra alta), che regola sia la frequenza bersaglio sia la frequenza di trial lure (foil identico a quello di 2 prove fa invece che 1, stessa logica del lure nell\'N-back) — i lure compaiono solo dal livello 2 in su.']));
    }
    if(cfg.taskMode==='nback' && cfg.adaptive){
      card.appendChild(el('p',{class:'hint'},['Il livello sale di 1 se l\'accuratezza supera l\'85% negli ultimi 8 trial validi, scende sotto il 70% (fascia 70–85% invariata) — livello minimo 1, massimo 10. n cresce solo a un cambio di banda (1 ai livelli 1-4, 2 ai livelli 5-9, 3 al solo livello 10); dentro ogni banda la difficoltà sale con la frequenza bersaglio e con i trial lure. Durante la sessione puoi comunque forzare il livello manualmente con i pulsanti +/– nella barra in alto: l\'automatismo riprende dal valore che imposti.']));
    }

    // response mode
    if(!isGoalTask && !isMemoria){
      const respWrap = el('div',{class:'field'});
      respWrap.appendChild(el('label',{},['Modalità di raccolta risposte']));
      respWrap.appendChild(segButtons(['paziente','manuale'], cfg.respMode==='operatore'?'paziente':cfg.respMode, v=>{cfg.respMode=v; render();}, {
        paziente:'Touch (chi tocca lo schermo)', manuale:'Inserimento manuale a fine sessione'
      }));
      card.appendChild(respWrap);
      if(cfg.respMode!=='manuale' && cfg.taskMode!=='neglect' && cfg.taskMode!=='goaltask' && cfg.taskMode!=='memoria'){
        card.appendChild(field('Dispositivo di risposta previsto', segButtons(['touch','tastiera'], cfg.inputDevice||'touch', v=>{
          cfg.inputDevice = v;
          render();
        }, {touch:'Touch (schermo)', tastiera:'Tastiera (computer)'})));
        if(cfg.inputDevice==='tastiera'){
          card.appendChild(field('Disposizione tasti', segButtons(['standard','ravvicinata'], cfg.keyLayout||'standard', v=>{
            cfg.keyLayout = v;
            render();
          }, {standard:'Standard (A / L / Z / M)', ravvicinata:'Ravvicinata, una mano sola (B / N / V / M)'})));
          card.appendChild(el('p',{class:'hint'},['La tastiera funziona comunque sempre, indipendentemente da questa scelta — questa impostazione decide solo quali tasti evidenziare sui pulsanti e nelle istruzioni prima di iniziare, così chi guarda lo schermo sa subito cosa premere senza doverlo scoprire a tentativi. "Ravvicinata" usa 4 tasti adiacenti sulla riga inferiore, raggiungibili con una sola mano.']));
        }
        card.appendChild(field('Zone di risposta grandi', segButtons(['no','si'], cfg.zoneGrandi?'si':'no', v=>{
          cfg.zoneGrandi = v==='si';
          render();
        }, {no:'Normali', si:'Metà schermo (per bassa vista)'})));
        if(cfg.zoneGrandi) card.appendChild(el('p',{class:'hint'},['Utile su tablet/smartphone per chi vede poco: le zone toccabili diventano molto più grandi (metà schermo ciascuna quando ci sono due risposte), invece di piccoli pulsanti da individuare con precisione. Non cambia nulla su computer, dove esiste già la tastiera come alternativa.']));
      } else if(cfg.respMode!=='manuale'){
        card.appendChild(el('p',{class:'hint'},['Qui la risposta è sempre un tocco/clic diretto sull\'elemento a schermo (una cella della tavola, un elemento della lista) — non esiste una scorciatoia da tastiera per questo esercizio, a differenza degli altri.']));
      }
    }
    if(isMemoria){
      card.appendChild(el('p',{class:'hint'},['Il richiamo viene valutato dall\'operatore, non in automatico: dopo la fase di studio, il paziente racconta/richiama a voce, e tu spunti sullo schermo cosa ha effettivamente recuperato.']));
    }

    // voice toggle for verbal stimuli
    if(ex.usesStimType && !isClassicAnt && ['lettere','numeri','parole'].includes(cfg.stimType)){
      const vWrap = el('div',{class:'field'});
      vWrap.appendChild(el('label',{},['Presentazione']));
      vWrap.appendChild(segButtons(['no','si'], cfg.voice?'si':'no', v=>{cfg.voice = v==='si'; render();}, {no:'Visiva', si:'Visiva + uditiva (sintesi vocale)'}));
      card.appendChild(vWrap);
    }

    // patient code
    const pc = el('div',{class:'field'});
    pc.appendChild(el('label',{},['Codice paziente (facoltativo, non usare il nominativo)']));
    const inp = el('input',{type:'text', placeholder:'es. PT-014', value:cfg.patientCode});
    inp.addEventListener('input', e=>{ cfg.patientCode = e.target.value; });
    pc.appendChild(inp);
    card.appendChild(pc);

    const durEstP = el('p',{class:'hint'},[isGoalTask
      ? (()=>{ const sc = goalTaskInstanceFor(cfg.goaltaskScenario, cfg.goaltaskLivello); return (sc.budgetSecondi ? 'Tempo a disposizione: '+fmtTime(sc.budgetSecondi*1000)+'. ' : 'Nessun limite di tempo. ')+sc.items.length+' elementi'+(sc.regole.length?', con regola attiva':'')+'.'; })()
      : isMemoria
      ? (()=>{ const m = memoriaMaterialFor(cfg); return memoriaEffectiveMateriale(cfg)==='lista' ? m.parole.length+' parole da ricordare.' : Math.round(m.testo.split(/\s+/).length)+' parole nel brano, '+m.unita.length+' idee-chiave da riconoscere al richiamo.'; })()
      : 'Durata stimata della sessione: '+fmtTime(cfg.isi*cfg.trials)+'.']);
    function updateDurEst(){ if(isGoalTask || isMemoria) return; durEstP.textContent = 'Durata stimata della sessione: '+fmtTime(cfg.isi*cfg.trials)+'.'; }
    card.appendChild(durEstP);

    if(buildingProgramFor){
      const isEditing = editingProgramEntryIndex!=null;

  function stepper(val,min,max,onChange,step,fmt){
    step = step||1;
    let cur = val;
    const wrap = el('div',{class:'stepper'});
    const valNode = el('div',{class:'val'},[fmt? fmt(cur) : String(cur)]);
    function set(nv){
      cur = Math.max(min,Math.min(max,nv));
      valNode.textContent = fmt? fmt(cur) : String(cur);
      onChange(cur);
    }
    wrap.appendChild(el('button',{onclick:()=>set(cur-step)},['–']));
    wrap.appendChild(valNode);
    wrap.appendChild(el('button',{onclick:()=>set(cur+step)},['+']));
    return wrap;
  }
