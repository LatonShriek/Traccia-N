  function ScreenInstructions(root){
    root.appendChild(el('div',{class:'brand'},[
      el('div',{class:'mark'},['Traccia',el('span',{},['N'])]),
      el('div',{class:'sub'},[EXERCISES[cfg.taskMode].label])
    ]));
    const s = el('div',{class:'screen'});
    const card = el('div',{class:'card'});
    card.appendChild(el('h2',{},['Prima di iniziare']));
    const text = EXERCISES[cfg.taskMode].instructions(cfg);
    const textBox = el('p',{style:'font-size:16px; line-height:1.6; background:var(--paper-dim); border-radius:12px; padding:16px 18px; margin:0 0 18px;'},[text]);
    card.appendChild(textBox);

    const rowbtns = el('div',{class:'rowbtns'});
    const listenBtn = el('button',{class:'ghost', onclick:()=>{ speak(text); }},['🔊 Ascolta le istruzioni']);
    rowbtns.appendChild(listenBtn);
    card.appendChild(rowbtns);

    card.appendChild(el('button',{class:'primary', style:'margin-top:18px;', onclick:()=>{ view='countdown'; render(); }},['Ho capito, inizia']));
    const nav = el('div',{class:'navlinks'});
    nav.appendChild(el('button',{class:'link', onclick:()=>{ try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){} view=homeView(); render(); }},['← Torna al setup']));
    card.appendChild(nav);

    s.appendChild(card); root.appendChild(s);
  }

  function ScreenCountdown(root){
    const s = el('div',{class:'stage'});
    let n = 3;
    const num = el('div',{class:'stimulus'},[String(n)]);
    s.appendChild(num);
    root.appendChild(el('div',{class:'topbar'},[
      el('div',{class:'info'},['preparazione']),
      el('button',{onclick:()=>{view=homeView(); render();}},['Annulla'])
    ]));
    root.appendChild(s);
    const iv = setInterval(()=>{
      n--;
      if(n<=0){ clearInterval(iv); startSession(); return; }
      num.textContent = String(n);
    },800);
  }

  /* ---------- TASK ENGINE ---------- */
  function startSession(){
    if(cfg.taskMode==='neglect'){ startNeglectSession(); return; }
    const isTapat = cfg.taskMode==='ant' && cfg.antMode==='tapat';
    session = {
      // n-back e TAPAT generano le prove una alla volta (serve per poter
      // cambiare livello a metà sessione, manualmente o in automatico);
      // tutti gli altri esercizi restano pre-generati come prima.
      seq: (cfg.taskMode==='nback' || isTapat) ? [] : buildSequence(),
      idx:-1, timer:null, timerInfo:null, phase:'idle',
      counts:{hits:0, misses:0, falseAlarms:0, correctRejections:0, targets:0, nonTargets:0},
      countsAud:{hits:0, misses:0, falseAlarms:0, correctRejections:0, targets:0, nonTargets:0},
      choiceLog:[], // {correct:bool, rt, isSwitch, cueType, congruency}
      trail:[], responses:new Set(), respTime:null, trialStart:0,
      rts:[], startedAt: Date.now(), paused:false, pausedAt:null,
      currentSSD: cfg.ssd, ssdHistory:[], showStopCue:false, stopCueTimer:null,
      liveNLevel: cfg.nLevel, tapatLevel: 3, adaptBlock:[], levelChanges:[]
    };
    view='task'; render();
    nextTrial();
  }
  /* ---- Motore Cancellazione/Neglect: tavole con molti elementi simultanei,
     tocco diretto sui bersagli, non un ciclo di prove sequenziali. ---- */
  function shuffleArr(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
  function buildNeglectBoard(){
    const pool = POOLS[cfg.stimType];
    const targets = cfg.targetSeq;
    const n = cfg.neglectBoardSize;
    const targetCount = Math.max(4, Math.round(n*0.25));
    let leftRatio = 0.5;
    if(cfg.neglectDistribution==='sbilanciata-sinistra') leftRatio = 0.75;
    if(cfg.neglectDistribution==='sbilanciata-destra') leftRatio = 0.25;
    let targetsLeft = Math.round(targetCount*leftRatio), targetsRight = targetCount-targetsLeft;
    const cols=8, rows=Math.ceil(n/cols);
    const cellW=100/cols, cellH=100/rows;
    let positions=[];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) positions.push({r,c});
    positions = shuffleArr(positions).slice(0,n);
    let li=0, ri=0;
    const items = positions.map((p,i)=>{
      const side = p.c < cols/2 ? 'left':'right';
      const x = p.c*cellW + cellW*(0.2+Math.random()*0.6);
      const y = p.r*cellH + cellH*(0.2+Math.random()*0.6);
      let isTarget=false;
      if(side==='left' && li<targetsLeft){ isTarget=true; li++; }
      else if(side==='right' && ri<targetsRight){ isTarget=true; ri++; }
      let val;
      if(isTarget){ val = targets[Math.floor(Math.random()*targets.length)]; }
      else {
        let tries=0;
        do{ val = pool[Math.floor(Math.random()*pool.length)]; tries++; }
        while(targets.some(t=>seqLabel(t)===seqLabel(val)) && tries<20 && pool.length>targets.length);
      }
      return {x, y, val, isTarget, side, found:false, falseTap:false};
    });
    return items;
  }
  function startNeglectSession(){
    session = {
      boardIdx:0, totalBoards:cfg.trials, board:[], boardStartTime:0, startedAt:Date.now(),
      timer:null, timerInfo:null, paused:false, pausedAt:null,
      results:[] // {targetsLeft,targetsRight,foundLeft,foundRight,falseAlarms,timeMs,reason}
    };
    view='task'; render();
    nextBoard();
  }
  function nextBoard(){
    if(session.boardIdx >= session.totalBoards){ finishNeglectSession(); return; }
    session.board = buildNeglectBoard();
    session.boardStartTime = performance.now();
    render();
    if(cfg.neglectTimeLimit>0){
      scheduleStep(()=> finishBoard('tempo scaduto'), cfg.neglectTimeLimit*1000);
    }
  }
  function tapNeglectItem(item){
    if(!session || session.paused || item.found || item.falseTap) return;
    if(cfg.respMode==='manuale') return;
    if(item.isTarget) item.found = true; else item.falseTap = true;
    updateNeglectScreen();
    if(session.board.filter(b=>b.isTarget).every(b=>b.found)) finishBoard('completata');
  }
  function finishBoard(reason){
    if(session.timer){ clearTimeout(session.timer); session.timer=null; session.timerInfo=null; }
    const timeMs = performance.now()-session.boardStartTime;
    const tL = session.board.filter(b=>b.side==='left'&&b.isTarget);
    const tR = session.board.filter(b=>b.side==='right'&&b.isTarget);
    session.results.push({
      targetsLeft:tL.length, targetsRight:tR.length,
      foundLeft:tL.filter(b=>b.found).length, foundRight:tR.filter(b=>b.found).length,
      falseAlarms:session.board.filter(b=>b.falseTap).length, timeMs, reason
    });
    session.boardIdx++;
    nextBoard();
  }

  // (session.liveNLevel), che può cambiare durante la sessione stessa.
  function genNbackTrial(){
    const pool = POOLS[cfg.stimType];
    const i = session.seq.length;
    const n = session.liveNLevel;
    function runLen(val){ let run=1; for(let k=i-1;k>=0;k--){ if(session.seq[k].val===val) run++; else break; } return run; }
    let makeTarget = i>=n && Math.random() < cfg.targetRate;
    let val;
    if(makeTarget){
      const cand = session.seq[i-n].val;
      if(pool.length>1 && runLen(cand) > 3){ makeTarget=false; } else { val = cand; }
    }
    if(!makeTarget){
      do{ val = pool[Math.floor(Math.random()*pool.length)]; }
      while(pool.length>1 && ((i>=n && val===session.seq[i-n].val) || runLen(val)>3));
    }
    const trial = {val, isTarget: i>=n ? makeTarget : false, valid:i>=n, nAtGeneration:n};
    session.seq.push(trial);
    return trial;
  }
  // Titolazione automatica: valuta un blocco di 8 prove valide alla volta.
  // Livelli di difficoltà TAPAT: più alto = attese toniche più lunghe e
  // imprevedibili (più difficile sostenere l'attenzione da soli).
  const TAPAT_LEVELS = { 1:[2000,4000], 2:[3000,6000], 3:[4000,8000], 4:[6000,11000], 5:[8000,15000] };
  function genTapatTrial(){
    const i = session.seq.length;
    const half = Math.floor(cfg.trials/2);
    const block = i<half ? 'tonic' : 'phasic';
    const pool = POOLS[cfg.stimType];
    let cueType, isiOverride;
    if(block==='tonic'){
      cueType = 'none';
      const range = TAPAT_LEVELS[session.tapatLevel] || TAPAT_LEVELS[3];
      isiOverride = range[0] + Math.random()*(range[1]-range[0]);
    } else {
      cueType = Math.random()<0.5 ? 'none' : 'center';
      isiOverride = null; // usa l'ISI normale impostato in setup
    }
    const val = pool[Math.floor(Math.random()*pool.length)];
    const trial = {val, cueType, congruency:'neutral', side:'center', targetDir:null, correctAnswer:'go', block, isiOverride, valid:true};
    session.seq.push(trial);
    return trial;
  }
  // Titolazione automatica: valuta un blocco di 8 prove valide alla volta.
  // Generica: si applica sia al livello n-back sia al livello TAPAT, a
  // seconda dell'esercizio in corso.
  function maybeAdapt(){
    if(!cfg.adaptive) return;
    const isNback = cfg.taskMode==='nback';
    const isTapat = cfg.taskMode==='ant' && cfg.antMode==='tapat';
    if(!isNback && !isTapat) return;
    const BLOCK = 8;
    if(session.adaptBlock.length < BLOCK) return;
    const acc = session.adaptBlock.filter(Boolean).length / session.adaptBlock.length;
    const levelKey = isNback ? 'liveNLevel' : 'tapatLevel';
    if(acc > 0.85 && session[levelKey] < 5){
      session[levelKey]++;
      session.levelChanges.push({trialIdx:session.idx, level:session[levelKey], how:'auto'});
    } else if(acc < 0.70 && session[levelKey] > 1){
      session[levelKey]--;
      session.levelChanges.push({trialIdx:session.idx, level:session[levelKey], how:'auto'});
    }
    session.adaptBlock = [];
  }
  function bumpLevel(delta){
    if(!session) return;
    const isNback = cfg.taskMode==='nback';
    const isTapat = cfg.taskMode==='ant' && cfg.antMode==='tapat';
    if(!isNback && !isTapat) return;
    const levelKey = isNback ? 'liveNLevel' : 'tapatLevel';
    const nv = Math.max(1, Math.min(5, session[levelKey]+delta));
    if(nv===session[levelKey]) return;
    session[levelKey] = nv;
    session.adaptBlock = []; // il blocco automatico riparte da qui
    session.levelChanges.push({trialIdx:session.idx, level:nv, how:'manuale'});
    updateTaskScreen();
  }
  // Wraps setTimeout so a pause can compute and preserve the remaining delay.
  function scheduleStep(fn, delay){
    const startedAt = performance.now();
    session.timerInfo = {fn, delay, startedAt};
    session.timer = setTimeout(()=>{ session.timerInfo=null; fn(); }, delay);
  }
  function pauseTask(){
    if(!session || session.paused) return;
    if(session.timer) clearTimeout(session.timer);
    if(session.stopCueTimer) clearTimeout(session.stopCueTimer);
    if(session.timerInfo){
      const elapsed = performance.now() - session.timerInfo.startedAt;
      session.timerInfo.remaining = Math.max(50, session.timerInfo.delay - elapsed);
    }
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    session.paused = true;
    session.pausedAt = performance.now();
    render();
  }
  function resumeTask(){
    if(!session || !session.paused) return;
    const pausedDuration = performance.now() - session.pausedAt;
    if(session.trialStart!=null) session.trialStart += pausedDuration; // keep reaction times measured on active time only
    if(session.boardStartTime!=null) session.boardStartTime += pausedDuration;
    session.paused = false;
    if(session.timerInfo){
      const {fn, remaining} = session.timerInfo;
      session.timer = setTimeout(()=>{ session.timerInfo=null; fn(); }, remaining);
    }
    render();
  }
  function nextTrial(){
    session.idx++;
    if(session.idx >= cfg.trials){ finishSession(); return; }
    const isTapat = cfg.taskMode==='ant' && cfg.antMode==='tapat';
    const trial = cfg.taskMode==='nback' ? genNbackTrial() : isTapat ? genTapatTrial() : session.seq[session.idx];
    session.phase='show'; session.responses=new Set(); session.respTime=null; session.showStopCue=false;
    if(session.stopCueTimer){ clearTimeout(session.stopCueTimer); session.stopCueTimer=null; }
    session.trialStart = performance.now();
    render();
    presentStimulus(trial);
    if(cfg.taskMode==='stopsignal' && trial.isStopTrial){
      session.stopCueTimer = setTimeout(()=>{
        session.showStopCue=true;
        playTone(STOP_TONE, 220); // segnale uditivo, disaccoppiato dalla modalità dello stimolo go — come nel paradigma originale
        updateTaskScreen();
      }, session.currentSSD);
    }
    scheduleStep(()=>{
      session.phase='wait'; render();
      const isi = trial.isiOverride || cfg.isi;
      scheduleStep(()=> resolveTrial(), Math.max(50,isi-cfg.stimDuration));
    }, cfg.stimDuration);
  }
  function presentStimulus(trial){
    if(cfg.taskMode==='dualtask'){
      playTone(trial.audioVal, cfg.stimDuration);
      return;
    }
    if((cfg.taskMode==='ant' && cfg.antMode!=='tapat') || cfg.taskMode==='switching') return; // solo visivi
    if(cfg.stimType==='suoni'){
      playTone(trial.val, cfg.stimDuration);
    } else if(cfg.voice && ['lettere','numeri','parole'].includes(cfg.stimType)){
      speak(String(trial.val));
    }
  }
  // action: identificatore generico del pulsante toccato ('match'/'nomatch',
  // 'go', 'left'/'right', 'a'/'b', 'vis'/'aud'...). Gli esercizi a singola
  // risposta ignorano tocchi ulteriori dopo il primo; il doppio compito
  // accetta un tocco indipendente per canale.
  function registerTap(action){
    if(!session || session.paused || session.idx<0 || session.idx>=session.seq.length) return;
    if(cfg.respMode==='manuale') return;
    if(session.responses.has(action)) return;
    if(cfg.taskMode!=='dualtask' && session.responses.size>0) return;
    session.responses.add(action);
    if(session.respTime===null) session.respTime = performance.now()-session.trialStart;
  }
  function resolveTrial(){
    const trial = session.seq[session.idx];
    let outcome = null;
    switch(cfg.taskMode){
      case 'gonogo': case 'stopsignal': outcome = resolveSignal(trial); break;
      case 'ant': case 'switching': outcome = resolveChoice(trial); break;
      case 'dualtask': outcome = resolveDualTask(trial); break;
      default: outcome = resolveSignal(trial); // nback / sequenza
    }
    if(outcome) session.trail.push({outcome, target: !!trial.isTarget});
    nextTrial();
  }
  // nback, sequenza, gonogo, stopsignal: tutti sono "rispondi sì/no" con un
  // ground truth trial.isTarget — riusano lo stesso schema hit/miss/FA/CR.
  function resolveSignal(trial){
    if(!trial.valid) return null;
    if(trial.isTarget) session.counts.targets++; else session.counts.nonTargets++;
    if(cfg.respMode==='manuale') return 'pend';
    const tapped = session.responses.size>0;
    let outcome, correct;
    if(trial.isTarget && tapped){ session.counts.hits++; outcome='hit'; correct=true; if(session.respTime) session.rts.push(session.respTime); }
    else if(trial.isTarget && !tapped){ session.counts.misses++; outcome='err'; correct=false; }
    else if(!trial.isTarget && tapped){ session.counts.falseAlarms++; outcome='err'; correct=false; }
    else { session.counts.correctRejections++; outcome='hit'; correct=true; }
    if(cfg.taskMode==='nback'){
      session.adaptBlock.push(correct);
      maybeAdapt();
    }
    if(cfg.taskMode==='stopsignal' && trial.isStopTrial){
      // staircase: fermarsi con successo → SSD più lungo (più difficile);
      // fallire lo stop → SSD più corto (più facile)
      session.currentSSD = tapped
        ? Math.max(0, session.currentSSD - cfg.ssdStep)
        : Math.min(cfg.isi-100, session.currentSSD + cfg.ssdStep);
      session.ssdHistory.push(session.currentSSD);
    }
    return outcome;
  }
  // ANT / switching: scelta 2AFC, non ha senso hit/FA — traccia solo
  // corretto/scorretto + RT, per poi scomporre per condizione a fine sessione.
  function resolveChoice(trial){
    if(cfg.respMode==='manuale') return 'pend';
    const given = [...session.responses][0] || null;
    const correct = given===trial.correctAnswer;
    session.choiceLog.push({
      correct, rt: correct ? session.respTime : null, omitted: given===null,
      isSwitch: !!trial.isSwitch, cueType: trial.cueType, congruency: trial.congruency, block: trial.block
    });
    if(cfg.taskMode==='ant' && cfg.antMode==='tapat'){
      session.adaptBlock.push(correct);
      maybeAdapt();
    }
    return correct ? 'hit' : 'err';
  }
  // Doppio compito: due canali indipendenti, ciascuno con proprio target.
  function resolveDualTask(trial){
    if(!trial.valid) return null;
    if(cfg.respMode==='manuale') return 'pend';
    if(trial.visualIsTarget) session.counts.targets++; else session.counts.nonTargets++;
    if(trial.audioIsTarget) session.countsAud.targets++; else session.countsAud.nonTargets++;
    const tapV = session.responses.has('vis'), tapA = session.responses.has('aud');
    let ok = true;
    if(trial.visualIsTarget && tapV) session.counts.hits++;
    else if(trial.visualIsTarget && !tapV){ session.counts.misses++; ok=false; }
    else if(!trial.visualIsTarget && tapV){ session.counts.falseAlarms++; ok=false; }
    else session.counts.correctRejections++;
    if(trial.audioIsTarget && tapA) session.countsAud.hits++;
    else if(trial.audioIsTarget && !tapA){ session.countsAud.misses++; ok=false; }
    else if(!trial.audioIsTarget && tapA){ session.countsAud.falseAlarms++; ok=false; }
    else session.countsAud.correctRejections++;
    return ok ? 'hit' : 'err';
  }

  // Restituisce la specifica dei pulsanti di risposta per l'esercizio
  // corrente. null per gli esercizi con etichette che dipendono dal trial
  // (switching), gestiti a parte in updateTaskScreen.
  /* ---- rendering Cancellazione/Neglect ---- */
  function mountNeglectScreen(root){
    const infoSpan = el('div',{class:'info'},['']);
    const pauseBtn = el('button',{onclick:()=>{ session.paused ? resumeTask() : pauseTask(); }},['❚❚ Pausa']);
    root.appendChild(el('div',{class:'topbar'},[
      infoSpan,
      el('div',{style:'display:flex; gap:8px;'},[
        pauseBtn,
        el('button',{onclick:()=>{ if(confirm('Interrompere la sessione in corso?')){ if(session.timer) clearTimeout(session.timer); view=homeView(); render(); } }},['Interrompi'])
      ])
    ]));
    const board = el('div',{class:'neglect-board'},[]);
    root.appendChild(board);
    const resp = el('div',{class:'respond'},[]);
    let doneBtn = null, manualNote = null;
    if(cfg.respMode!=='manuale'){
      doneBtn = el('button',{class:'tapbtn nomatch full', onclick:()=>{ if(session.timer) clearTimeout(session.timer); finishBoard('interrotta dall\'operatore'); }},['Fatto con questa tavola']);
      resp.appendChild(doneBtn);
    } else {
      manualNote = el('div',{style:'color:#fff; font-size:13px; opacity:.8; align-self:center;'},['Modalità manuale: conta a voce/carta i bersagli trovati per lato, poi registra il risultato.']);
      const regBtn = el('button',{class:'tapbtn match full', onclick:()=> manualRegisterBoard()},['Registra risultato tavola']);
      resp.appendChild(manualNote); resp.appendChild(regBtn);
    }
    root.appendChild(resp);
    return {infoSpan, pauseBtn, board};
  }
  function manualRegisterBoard(){
    const tL = session.board.filter(b=>b.side==='left'&&b.isTarget).length;
    const tR = session.board.filter(b=>b.side==='right'&&b.isTarget).length;
    const foundLeft = parseInt(prompt('Bersagli trovati a SINISTRA (su '+tL+'):','0'),10) || 0;
    const foundRight = parseInt(prompt('Bersagli trovati a DESTRA (su '+tR+'):','0'),10) || 0;
    const falseAlarms = parseInt(prompt('Falsi allarmi (elementi sbagliati toccati/segnalati):','0'),10) || 0;
    session.results.push({
      targetsLeft:tL, targetsRight:tR,
      foundLeft:Math.min(foundLeft,tL), foundRight:Math.min(foundRight,tR),
      falseAlarms, timeMs:performance.now()-session.boardStartTime, reason:'manuale'
    });
    session.boardIdx++;
    nextBoard();
  }
  function updateNeglectScreen(){
    const d = taskDom;
    d.infoSpan.textContent = 'tavola '+(Math.min(session.boardIdx+1,session.totalBoards))+' / '+session.totalBoards+' · '+
      STIM_LABELS[cfg.stimType]+' · bersagli: '+cfg.targetSeq.map(seqLabel).join(', ');
    d.pauseBtn.textContent = session.paused ? '▶ Riprendi' : '❚❚ Pausa';
    d.board.innerHTML='';
    if(session.paused){
      d.board.appendChild(el('div',{class:'blank'},['❚❚ in pausa']));
      return;
    }
    session.board.forEach(item=>{
      const cls = 'neglect-item'+(item.found?' found':'')+(item.falseTap?' falsetap':'');
      const style = 'left:'+item.x+'%; top:'+item.y+'%;'+(cfg.stimType==='colori' ? ' background:'+item.val.hex+';' : '');
      const content = cfg.stimType==='colori' ? [] : [seqLabel(item.val)];
      const btn = el('div',{class:cls, style, onclick:()=> tapNeglectItem(item)}, content);
      d.board.appendChild(btn);
    });
  }
  /* ---- rendering esercizi sequenziali (n-back, sequenza, gonogo, stopsignal, ant, switching, dualtask) ---- */
  function respondSpec(){
    switch(cfg.taskMode){
      case 'gonogo':
        return [{action:'go', label: cfg.respMode==='operatore' ? 'Il paziente risponde' : 'GO — rispondi', cls:'match', full:true}];
      case 'stopsignal':
        return [{action:'go', label: cfg.respMode==='operatore' ? 'Il paziente risponde' : 'GO — il più veloce possibile', cls:'match', full:true}];
      case 'ant':
        return cfg.antMode==='tapat'
          ? [{action:'go', label:'Rilevato — tocca appena lo vedi', cls:'match', full:true}]
          : [{action:'left', label:'◀ Sinistra', cls:'match'}, {action:'right', label:'Destra ▶', cls:'nomatch'}];
      case 'switching':
        return [{action:'a', label:'—', cls:'match'}, {action:'b', label:'—', cls:'nomatch'}];
      case 'dualtask':
        return [{action:'vis', label:'Target visivo', cls:'match'}, {action:'aud', label:'Target uditivo', cls:'nomatch'}];
      default: { // nback, sequenza — un solo pulsante: l'assenza di tocco
        // è già di per sé la risposta "nessuna corrispondenza" (rifiuto
        // corretto), come nel CPT/n-back standard. Un secondo pulsante
        // "nessuna corrispondenza" non verrebbe distinto dal primo nello
        // scoring (qualunque tocco = "ha risposto") e quindi un tocco
        // esplicito di "no" finirebbe per essere contato come un "sì".
        const isSeq = cfg.taskMode==='sequenza';
        const matchLabel = isSeq
          ? (cfg.respMode==='operatore' ? "Il paziente segnala: sequenza appena avvenuta" : "È appena avvenuta la sequenza")
          : (cfg.respMode==='operatore' ? 'Il paziente indica corrispondenza' : 'Corrispondenza (n='+cfg.nLevel+')');
        return [{action:'match', label:matchLabel, cls:'match', full:true}];
      }
    }
  }
  function mountTaskScreen(root){
    const infoSpan = el('div',{class:'info'},['']);
    const pauseBtn = el('button',{onclick:()=>{ session.paused ? resumeTask() : pauseTask(); }},['Pausa']);
    const topRight = [pauseBtn];
    if(cfg.taskMode==='nback' || (cfg.taskMode==='ant' && cfg.antMode==='tapat')){
      topRight.unshift(
        el('button',{onclick:()=>bumpLevel(-1), style:'padding:8px 11px;'},['–']),
        el('button',{onclick:()=>bumpLevel(1), style:'padding:8px 11px;'},['+'])
      );
    }
    root.appendChild(el('div',{class:'topbar'},[
      infoSpan,
      el('div',{style:'display:flex; gap:8px;'},[
        ...topRight,
        el('button',{onclick:()=>{ if(confirm('Interrompere la sessione in corso?')){ if(session.timer) clearTimeout(session.timer); if(session.stopCueTimer) clearTimeout(session.stopCueTimer); view=homeView(); render(); } }},['Interrompi'])
      ])
    ]));

  function flashTap(btn){

  function updateTaskScreen(){

      : cfg.taskMode==='stopsignal' ? 'SSD '+Math.round(session.currentSSD)+'ms'
      : (cfg.taskMode==='ant' && cfg.antMode==='tapat' && trial) ? 'TAPAT — blocco '+(trial.block==='tonic'?'tonico':'fasico')+' · livello '+session.tapatLevel+(cfg.adaptive?' (adattivo)':'')
      : EXERCISES[cfg.taskMode].label;

      ((EXERCISES[cfg.taskMode].usesStimType && !(cfg.taskMode==='ant' && cfg.antMode==='classico')) ? ' · '+STIM_LABELS[cfg.stimType] : '');
    d.pauseBtn.textContent = session.paused ? '▶ Riprendi' : '❚❚ Pausa';

    // switching: le etichette dei pulsanti dipendono dalla regola del trial corrente
    if(cfg.taskMode==='switching' && trial && d.btns.length===2){
      d.btns[0].textContent = trial.ruleDef.labelA;
      d.btns[1].textContent = trial.ruleDef.labelB;
    }
    if(cfg.taskMode==='nback' && d.btns.length===1 && cfg.respMode!=='operatore'){
      d.btns[0].textContent = 'Corrispondenza (n='+session.liveNLevel+')';
    }

    d.stimSlot.innerHTML='';
    if(session.paused){
      d.stimSlot.appendChild(el('div',{class:'blank'},['❚❚ in pausa']));
    } else if(session.showStopCue){
      d.stimSlot.appendChild(el('div',{class:'stopcue-full'},['STOP']));
    } else if(trial && session.phase==='show'){
      d.stimSlot.appendChild(renderStimulusNode(trial));
    } else {
      d.stimSlot.appendChild(el('div',{class:'blank'},['· · ·']));
    }

    d.trail.innerHTML='';
    session.trail.slice(-16).forEach(t=> d.trail.appendChild(el('div',{class:'chip '+t.outcome})));

    const canRespond = cfg.respMode!=='manuale' && !session.paused &&

  function renderStimulusNode(trial){
    if(cfg.taskMode==='ant' && cfg.antMode==='tapat'){
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:18px;'});
      if(trial.cueType==='center') wrap.appendChild(el('div',{style:'color:var(--accent); font-size:28px;'},['✦']));
      if(cfg.stimType==='colori'){
        wrap.appendChild(el('div',{class:'colorcircle', style:'width:110px; height:110px; background:'+trial.val.hex+';'},[]));
      } else if(cfg.stimType==='suoni'){
        wrap.appendChild(el('div',{class:'audio-pulse active'},['♪']));
      } else if(cfg.stimType==='simboli'){
        wrap.appendChild(el('div',{class:'stimulus symbolwrap'},[seqLabel(trial.val)]));
      } else {
        wrap.appendChild(el('div',{class:'stimulus'},[seqLabel(trial.val)]));
      }
      return wrap;
    }
    if(cfg.taskMode==='ant'){
      const arrow = d=> d==='left' ? '◀' : '▶';
      let flankers;
      if(trial.congruency==='congruent') flankers = arrow(trial.targetDir);
      else if(trial.congruency==='incongruent') flankers = arrow(trial.targetDir==='left'?'right':'left');
      else flankers = '–';
      const row = flankers+flankers+arrow(trial.targetDir)+flankers+flankers;
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:18px;'});
      if(trial.cueType!=='none') wrap.appendChild(el('div',{style:'color:'+ (trial.cueType==='spatial'? 'var(--accent)':'rgba(255,255,255,.6)') +'; font-size:28px;'},[trial.cueType==='spatial' ? (trial.side==='left'?'◀':'▶') : '✦']));
      wrap.appendChild(el('div',{class:'stimulus symbolwrap', style: trial.cueType==='spatial' ? ('align-self:'+(trial.side==='left'?'flex-start':'flex-end')) : ''},[row]));
      return wrap;
    }
    if(cfg.taskMode==='switching'){
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:14px;'});
      wrap.appendChild(el('div',{style:'color:var(--accent); font-size:16px; letter-spacing:.08em; font-weight:700;'},[trial.ruleDef.label.toUpperCase()+'?']));
      if(cfg.switchMaterial==='colori'){
        wrap.appendChild(el('div',{class:'colorcircle', style:'width:140px; height:140px; background:'+trial.val.hex+';'},[]));
      } else {
        wrap.appendChild(el('div',{class:'stimulus'},[seqLabel(trial.val)]));
      }
      return wrap;
    }
    if(cfg.taskMode==='dualtask'){
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:10px;'});
      if(cfg.dualVisual==='colori'){
        wrap.appendChild(el('div',{class:'colorcircle', style:'width:120px; height:120px; background:'+trial.visualVal.hex+';'},[]));
      } else {
        wrap.appendChild(el('div',{class:'stimulus'},[seqLabel(trial.visualVal)]));
      }
      wrap.appendChild(el('div',{class:'audio-pulse active', style:'width:64px;height:64px;font-size:24px;'},['♪']));
      return wrap;
    }
    if(cfg.stimType==='simboli'){
      return el('div',{class:'stimulus symbolwrap'},[trial.val]);
    }
    if(cfg.stimType==='parole'){
      return el('div',{class:'stimulus word'},[trial.val]);
    }
    if(cfg.stimType==='suoni'){
      return el('div',{class:'audio-pulse active'},['♪']);
    }
    if(cfg.stimType==='colori'){
      return el('div',{class:'colorcircle', style:'background:'+trial.val.hex+';'},[]);
    }
    return el('div',{class:'stimulus'},[trial.val]);
  }

  /* ---------- FINISH / RESULTS ---------- */
  function finishSession(){
    const durationMs = Date.now()-session.startedAt;
    if(cfg.respMode==='manuale'){
      view='manualEntry'; render(); return;
    }
    completeAndSave(durationMs);
  }
  function finishNeglectSession(){
    completeAndSave(Date.now()-session.startedAt);
  }
  function rtMeanOf(items){
    const v = items.filter(x=>x!=null);
    return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
  }
  async function completeAndSave(durationMs){
    const family = EXERCISES[cfg.taskMode].family;
    const rec = {
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      ts: Date.now(), dateLabel: todayStr(),
      stimType: cfg.stimType, nLevel: cfg.nLevel, trials: cfg.trials, isi: cfg.isi, stimDuration: cfg.stimDuration,
      respMode: cfg.respMode, patientCode: cfg.patientCode, notes: cfg.notes,
      taskMode: cfg.taskMode, targetSeq: EXERCISES[cfg.taskMode].usesTargetSeq ? cfg.targetSeq.map(seqLabel) : null,
      antMode: cfg.taskMode==='ant' ? cfg.antMode : null,
      localPatientId: patientProfile ? null : (activeLocalPatientId || null),
      durationMs, family
    };
    if(family==='signal'){
      const avgRT = rtMeanOf(session.rts);
      rec.counts = session.counts; rec.metrics = scoreFromCounts(session.counts); rec.avgRT = avgRT;
      if(cfg.taskMode==='stopsignal' && session.ssdHistory.length){
        const meanSSD = rtMeanOf(session.ssdHistory);
        rec.meanSSD = meanSSD;
        rec.ssrt = (avgRT!=null && meanSSD!=null) ? Math.max(0, avgRT-meanSSD) : null;
      }
      if(cfg.taskMode==='nback'){
        rec.finalNLevel = session.liveNLevel;
        rec.adaptive = cfg.adaptive;
        rec.levelChanges = session.levelChanges.length ? session.levelChanges : null;
      }
    } else if(family==='choice'){
      const log = session.choiceLog;
      const total = log.length, correct = log.filter(x=>x.correct).length, omitted = log.filter(x=>x.omitted).length;
      rec.choice = { total, correct, omitted, accuracy: total? correct/total : null, meanRT: rtMeanOf(log.map(x=>x.rt)) };
      if(cfg.taskMode==='ant'){
        const rtBy = (key,val)=> rtMeanOf(log.filter(x=>x[key]===val && x.correct).map(x=>x.rt));
        const noneRT=rtBy('cueType','none'), centerRT=rtBy('cueType','center'), spatialRT=rtBy('cueType','spatial');
        const congRT=rtBy('congruency','congruent'), incongRT=rtBy('congruency','incongruent');
        rec.choice.alerting = (noneRT!=null && centerRT!=null) ? Math.round(noneRT-centerRT) : null;
        rec.choice.orienting = (centerRT!=null && spatialRT!=null) ? Math.round(centerRT-spatialRT) : null;
        rec.choice.conflict = (congRT!=null && incongRT!=null) ? Math.round(incongRT-congRT) : null;
        if(cfg.antMode==='tapat'){
          const tonicTrials = log.filter(x=>x.block==='tonic');
          const phasicTrials = log.filter(x=>x.block==='phasic');
          rec.choice.tonicMeanRT = rtMeanOf(tonicTrials.filter(x=>x.correct).map(x=>x.rt));
          rec.choice.tonicOmissions = tonicTrials.filter(x=>x.omitted).length;
          rec.choice.tonicTotal = tonicTrials.length;
          rec.choice.phasicMeanRT = rtMeanOf(phasicTrials.filter(x=>x.correct).map(x=>x.rt));
          rec.choice.finalTapatLevel = session.tapatLevel;
          rec.choice.adaptive = cfg.adaptive;
        }
      }
      if(cfg.taskMode==='switching'){
        const swRT = rtMeanOf(log.filter(x=>x.isSwitch && x.correct).map(x=>x.rt));
        const repRT = rtMeanOf(log.filter(x=>!x.isSwitch && x.correct).map(x=>x.rt));
        rec.choice.switchCost = (swRT!=null && repRT!=null) ? Math.round(swRT-repRT) : null;
      }
    } else if(family==='dual'){
      rec.counts = session.counts; rec.metrics = scoreFromCounts(session.counts);
      rec.countsAud = session.countsAud; rec.metricsAud = scoreFromCounts(session.countsAud);
    } else if(family==='spatial'){
      const r = session.results;
      const sum = k=> r.reduce((a,b)=>a+b[k],0);
      const tL=sum('targetsLeft'), tR=sum('targetsRight'), fL=sum('foundLeft'), fR=sum('foundRight'), fa=sum('falseAlarms');
      rec.neglect = {
        boards:r.length, targetsLeft:tL, targetsRight:tR, foundLeft:fL, foundRight:fR,
        omittedLeft:tL-fL, omittedRight:tR-fR,
        pctLeft: tL? fL/tL : null, pctRight: tR? fR/tR : null,
        falseAlarms:fa, meanTimeMs: rtMeanOf(r.map(x=>x.timeMs)),
        asymmetry: (tL && tR) ? Math.round(((fL/tL)-(fR/tR))*100) : null // negativo = più omissioni a sinistra
      };
    }
    lastResult = rec;
    await saveSession(rec);
    view='results'; render();
  }

        await cloudSaveConfig(urlInp.value, keyInp.value);
      }},['Salva configurazione']));

      card.appendChild(el('p',{class:'hint'},['Stato: '+cloudStatusLabel()+'. La chiave "anon" è pensata per stare nel codice pubblico: l\'accesso ai dati è comunque protetto dal login e dalle regole del database (vedi istruzioni).']));
    }

    if(sb && !cloudUser){
      card.appendChild(field('Accesso come', segButtons(['operatore','paziente'], cloudLoginMode, v=>{ cloudLoginMode=v; render(); }, {operatore:'Operatore', paziente:'Paziente'})));

      if(cloudLoginMode==='operatore'){
        const emailInp = el('input',{type:'text', placeholder:'email'});
        const pwInp = el('input',{type:'text', placeholder:'password (min 6 caratteri)'});
        card.appendChild(el('div',{class:'field'},[el('label',{},['Email']), emailInp]));
        card.appendChild(el('div',{class:'field'},[el('label',{},['Password']), pwInp]));
        const rb = el('div',{class:'rowbtns'});
        rb.appendChild(el('button',{class:'primary', disabled:cloudBusy, onclick:()=>cloudSignIn(emailInp.value, pwInp.value)},[cloudBusy?'Attendere…':'Accedi']));
        rb.appendChild(el('button',{class:'ghost', disabled:cloudBusy, onclick:()=>cloudSignUp(emailInp.value, pwInp.value)},['Registrati']));
        card.appendChild(rb);
      } else {
        const codeInp = el('input',{type:'text', placeholder:'es. K7XQ2M9P', style:'text-transform:uppercase;'});
        card.appendChild(el('div',{class:'field'},[el('label',{},['Codice di accesso (fornito dall\'operatore)']), codeInp]));
        card.appendChild(el('button',{class:'primary', disabled:cloudBusy, onclick:()=>cloudPatientSignIn(codeInp.value)},[cloudBusy?'Attendere…':'Entra']));
      }
    }
    if(sb && cloudUser){
      if(patientProfile){
        card.appendChild(el('p',{class:'hint'},['Connesso come paziente '+patientProfile.codice_paziente+'.']));
      } else {
        card.appendChild(el('p',{class:'hint'},['Connesso come operatore: '+cloudUser.email+'. Le nuove sessioni si sincronizzano automaticamente; lo storico unisce i dati locali e quelli in cloud.']));
        const nav2 = el('div',{class:'navlinks'});
        nav2.appendChild(el('button',{class:'link', onclick:()=>{ view='patients'; render(); }},['Gestisci pazienti →']));
        card.appendChild(nav2);
      }
      card.appendChild(el('button',{class:'ghost', onclick: cloudSignOut},['Disconnetti']));
    }

    const nav = el('div',{class:'navlinks'});
    if(cloudUser){
      nav.appendChild(el('button',{class:'link', onclick:()=>{ view=homeView(); render(); }},['← Torna al setup']));
    } else {
      nav.appendChild(el('button',{class:'link', onclick:()=>{ view='setup'; render(); }},['Continua senza account (solo su questo dispositivo) →']));
    }
    card.appendChild(nav);

    s.appendChild(card); root.appendChild(s);
  }

  /* ---------- GESTIONE PAZIENTI (solo operatore) ---------- */
  function ScreenPatients(root){
    root.appendChild(el('div',{class:'brand'},[el('div',{class:'mark'},['Traccia',el('span',{},['N'])])]));
    const s = el('div',{class:'screen'});
    const card = el('div',{class:'card'});
    card.appendChild(el('h2',{},['I tuoi pazienti']));
    if(!sb || !cloudUser || patientProfile){
      card.appendChild(el('p',{class:'hint'},['Disponibile solo per account operatore con sincronizzazione cloud attiva.']));
      card.appendChild(el('button',{class:'ghost', onclick:()=>{ view='cloud'; render(); }},['← Sincronizzazione cloud']));
      s.appendChild(card); root.appendChild(s); return;
    }
    card.appendChild(el('p',{class:'hint'},['Ogni paziente ha un proprio account, isolato dagli altri: può allenarsi da un suo dispositivo con il solo codice di accesso, senza vedere nulla del tuo lavoro con altri pazienti.']));

    const listWrap = el('div',{},[el('p',{class:'empty'},['Caricamento…'])]);
    card.appendChild(listWrap);

    card.appendChild(el('button',{class:'primary', onclick: async ()=>{
      const nome = prompt('Codice/etichetta per il nuovo paziente (es. "PT-014" — non usare il nominativo):');
      if(!nome || !nome.trim()) return;
      const res = await createPatientAccount(nome.trim());
      if(res){
        alert('Paziente creato.\nCodice di accesso: '+res.codiceAccesso+'\n\nConsegna questo codice al paziente — è l\'unica cosa che gli serve per accedere. Non è recuperabile in seguito, salvalo ora.');
        render();
      }
    }},['+ Nuovo paziente']));

    const nav = el('div',{class:'navlinks'});
    nav.appendChild(el('button',{class:'link', onclick:()=>{ view='cloud'; render(); }},['← Sincronizzazione cloud']));
    card.appendChild(nav);
    s.appendChild(card); root.appendChild(s);

    listMyPatients().then(list=>{
      listWrap.innerHTML='';
      if(!list.length){ listWrap.appendChild(el('p',{class:'empty'},['Nessun paziente creato ancora.'])); return; }
      list.forEach(p=>{
        const program = patientProgram(p);
        const presetLabel = program.length ? program.map(x=>x.nome).join(', ') : 'nessun allenamento assegnato';
        const row = el('div',{class:'histrow'},[
          el('div',{},[
            el('div',{},[p.codice_paziente]),
            el('div',{class:'l'},['assegnato: '+presetLabel])
          ]),
          el('div',{style:'display:flex; gap:8px;'},[
            el('button',{class:'ghost', onclick:()=>{ alert('Codice di accesso di '+p.codice_paziente+':\n'+p.codice_accesso); }},['Codice']),
            el('button',{class:'ghost', onclick:()=>{ editingPatient = p; view='patientProgram'; render(); }},['Gestisci programma'])
          ])
        ]);
        listWrap.appendChild(row);
      });
    });
  }

  /* ---------- PROGRAMMA PAZIENTE (assegna più esercizi) ---------- */
  function ScreenPatientProgram(root){
    root.appendChild(el('div',{class:'brand'},[el('div',{class:'mark'},['Traccia',el('span',{},['N'])])]));
    const s = el('div',{class:'screen'});
    const card = el('div',{class:'card'});
    if(!editingPatient){
      card.appendChild(el('p',{class:'hint'},['Nessun paziente selezionato.']));
      card.appendChild(el('button',{class:'ghost', onclick:()=>{ view='patients'; render(); }},['← Torna ai pazienti']));
      s.appendChild(card); root.appendChild(s); return;
    }
    card.appendChild(el('h2',{},['Programma di '+editingPatient.codice_paziente]));
    card.appendChild(el('p',{class:'hint'},['Seleziona uno o più preset salvati su questo dispositivo da assegnare. Il paziente vedrà l\'elenco e potrà avviare quello che vuole a ogni accesso — non serve un ordine fisso.']));

    const presets = listPresets();
    const already = new Set(patientProgram(editingPatient).map(x=>x.nome));
    const selected = new Set(presets.filter(p=>already.has(p.name)).map(p=>p.id));

    if(!presets.length){
      card.appendChild(el('p',{class:'hint'},['Non hai ancora preset salvati su questo dispositivo. Torna al setup, configura un esercizio e usa "Salva impostazioni attuali come preset", poi torna qui.']));
    } else {
      presets.forEach(p=>{
        const row = el('label',{style:'display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); cursor:pointer;'});
        const cb = el('input',{type:'checkbox'});
        if(selected.has(p.id)) cb.setAttribute('checked','checked');
        cb.addEventListener('change', ()=>{ if(cb.checked) selected.add(p.id); else selected.delete(p.id); });
        const exLabel = EXERCISES[p.cfg.taskMode] ? EXERCISES[p.cfg.taskMode].label : p.cfg.taskMode;
        row.appendChild(cb);
        row.appendChild(el('div',{},[el('div',{},[p.name]), el('div',{class:'l'},[exLabel])]));
        card.appendChild(row);
      });
    }

    card.appendChild(el('button',{class:'primary', style:'margin-top:16px;', onclick: async ()=>{
      const program = presets.filter(p=>selected.has(p.id)).map(p=>({nome:p.name, cfg:p.cfg}));
      if(!program.length){ alert('Seleziona almeno un preset, oppure annulla.'); return; }
      const ok = await assignProgramToPatient(editingPatient.id, program);
      if(ok){ editingPatient=null; view='patients'; render(); }
    }},['Salva programma ('+selected.size+' selezionati)']));

    const nav = el('div',{class:'navlinks'});
    nav.appendChild(el('button',{class:'link', onclick:()=>{ editingPatient=null; view='patients'; render(); }},['← Annulla']));
    card.appendChild(nav);
    s.appendChild(card); root.appendChild(s);
  }

  /* ---------- VISTA PAZIENTE (semplificata) ---------- */
  function ScreenPatientHome(root){
    root.appendChild(el('div',{class:'brand'},[
      el('div',{class:'mark'},['Traccia',el('span',{},['N'])]),
      el('div',{class:'sub'},['CT MRI'])
    ]));
    const s = el('div',{class:'screen'});
    const card = el('div',{class:'card'});
    card.appendChild(el('h2',{},['Ciao'+(patientProfile&&patientProfile.codice_paziente?', '+patientProfile.codice_paziente:'')]));
    const program = patientProgram(patientProfile);
    if(!program.length){
      card.appendChild(el('p',{class:'hint'},['Il tuo operatore non ha ancora assegnato un allenamento. Torna più tardi.']));
    } else {
      card.appendChild(el('p',{class:'hint'},['Il tuo operatore ti ha assegnato '+program.length+(program.length>1?' allenamenti':' allenamento')+':']));
      program.forEach(item=>{
        const exLabel = EXERCISES[item.cfg.taskMode] ? EXERCISES[item.cfg.taskMode].label : item.cfg.taskMode;
        const row = el('div',{class:'histrow'},[
          el('div',{},[ el('div',{},[item.nome||exLabel]), el('div',{class:'l'},[exLabel]) ]),
          el('button',{class:'primary', style:'padding:10px 16px;', onclick:()=>{
            loadPreset({cfg:item.cfg});
            cfg.patientCode = patientProfile.codice_paziente;
            view='instructions'; render();
          }},['Inizia'])
        ]);
        card.appendChild(row);
      });
    }
    const nav = el('div',{class:'navlinks'});
    nav.appendChild(el('button',{class:'link', onclick:()=>{ view='history'; render(); }},['I miei risultati →']));
    nav.appendChild(el('button',{class:'link', onclick: cloudSignOut},['Esci']));
    card.appendChild(nav);
    s.appendChild(card); root.appendChild(s);
  }


  function ScreenHistory(root){
    root.appendChild(el('div',{class:'brand'},[el('div',{class:'mark'},['Traccia',el('span',{},['N'])])]));
    const s = el('div',{class:'screen'});
    const card = el('div',{class:'card'});
    const filterId = historyFilterPatientId;
    const filterPatient = filterId ? listLocalPatients().find(p=>p.id===filterId) : null;
    card.appendChild(el('h2',{},[filterPatient ? 'Storico di '+filterPatient.nome : 'Storico sessioni']));
    if(filterPatient){
      const rb0 = el('div',{class:'navlinks'});
      rb0.appendChild(el('button',{class:'link', onclick:()=>{ historyFilterPatientId=null; render(); }},['Vedi tutto lo storico →']));
      card.appendChild(rb0);
    }
    card.appendChild(el('p',{class:'hint'},[
      sb && cloudUser ? 'Sincronizzate con il cloud (' + cloudUser.email + ') e disponibili in locale su questo dispositivo.'
                       : 'Salvate solo in locale su questo dispositivo. Attiva la sincronizzazione cloud per condividerle tra i tuoi dispositivi.'
    ]));
    const listWrap = el('div',{},[el('p',{class:'empty'},['Caricamento…'])]);
    card.appendChild(listWrap);
    const rowbtns = el('div',{class:'rowbtns'});
    rowbtns.appendChild(el('button',{class:'ghost', onclick:()=>{ historyFilterPatientId=null; view=homeView(); render(); }},['← Nuova sessione']));
    const exportBtn = el('button',{class:'ghost', onclick:async ()=>{ const items = await loadHistory(); if(items.length) exportCSV(items); }},['Esporta CSV']);
    rowbtns.appendChild(exportBtn);
    card.appendChild(rowbtns);
    s.appendChild(card); root.appendChild(s);

    loadHistory().then(allItems=>{
      const items = filterId ? allItems.filter(r=> r.localPatientId===filterId) : allItems;
      listWrap.innerHTML='';
      if(!items.length){ listWrap.appendChild(el('p',{class:'empty'},['Nessuna sessione salvata.'])); return; }
      items.forEach(r=>{
        const family = r.family || 'signal';
        const exLabel = EXERCISES[r.taskMode] ? EXERCISES[r.taskMode].label : (r.taskMode==='sequenza'?'sequenza':'n-back');
        const detail = family==='choice' ? exLabel
          : (r.taskMode==='nback' ? exLabel+' n='+r.nLevel : exLabel);
        const scoreLabel = family==='choice'
          ? fmtPct(r.choice.accuracy)+' corr.'
          : family==='dual'
            ? fmtPct(r.metrics.acc)+' vis · '+fmtPct(r.metricsAud.acc)+' ud.'
            : family==='spatial'
              ? fmtPct(r.neglect.pctLeft)+' sin · '+fmtPct(r.neglect.pctRight)+' des'
              : fmtPct(r.metrics.acc)+(r.metrics.dprime!=null? ' · d′ '+r.metrics.dprime.toFixed(2):'');
        const row = el('div',{class:'histrow'},[
          el('div',{},[
            el('div',{},[((EXERCISES[r.taskMode] && EXERCISES[r.taskMode].usesStimType && !(r.taskMode==='ant' && r.antMode==='classico')) ? STIM_LABELS[r.stimType]+' · ':'')+detail+' · '+r.trials+' prove'+(r.patientCode?' · '+r.patientCode:'')]),
            el('div',{class:'l'},[r.dateLabel])
          ]),
          el('div',{},[scoreLabel])
        ]);
        listWrap.appendChild(row);
      });
    });
  }

  const SCREENS = {
    setup: ScreenSetup, instructions: ScreenInstructions, countdown: ScreenCountdown,
    manualEntry: ScreenManualEntry, results: ScreenResults, history: ScreenHistory,
    cloud: ScreenCloud, patients: ScreenPatients, patientHome: ScreenPatientHome, patientProgram: ScreenPatientProgram
  };

  try{ if(window.speechSynthesis){ window.speechSynthesis.getVoices(); } }catch(e){}
  initSupabase();
  function decideInitialView(){
    if(patientProfile) return 'patientHome';
    if(cloudUser) return 'setup'; // operatore già collegato
    return 'cloud'; // non collegato: si parte dalla schermata di accesso
  }
  restoreCloudSession().finally(()=>{ view = decideInitialView(); render(); });
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
