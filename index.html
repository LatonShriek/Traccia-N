<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>TracciaN — test n-back</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2430">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TracciaN">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --ink:#1C2430;
    --paper:#F6F4EF;
    --paper-dim:#EAE6DC;
    --focus:#212C39;
    --focus-2:#2B3A4A;
    --signal:#4C7A6B;
    --signal-soft:#DCE8E3;
    --alert:#B5544A;
    --alert-soft:#F2DEDB;
    --accent:#D9A441;
    --line:#D8D2C4;
    --ink-soft:#5B6472;
    --white:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; overscroll-behavior:none; user-select:none;}
  #app{min-height:100vh; display:flex; flex-direction:column;}

  .brand{display:flex; align-items:baseline; gap:10px; padding:22px 28px 6px;}
  .brand .mark{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:-0.02em;}
  .brand .mark span{color:var(--accent);}
  .brand .sub{font-size:12.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}

  .screen{flex:1; display:flex; flex-direction:column; padding:0 28px 28px;}
  .card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:22px;}

  h2{font-family:'Space Grotesk',sans-serif; font-size:19px; margin:0 0 4px; letter-spacing:-0.01em;}
  .hint{font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; line-height:1.5;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:400px){
    .card{padding:14px;}
    .tapbtn{padding:16px 10px; font-size:15px;}
    .stage{min-height:50vh;}
    .respond{padding:12px;}
  }
  @media (max-width:720px){.grid{grid-template-columns:1fr;}}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); margin-bottom:8px;}
  .seg{display:flex; flex-wrap:wrap; gap:8px;}
  .seg button{border:1.5px solid var(--line); background:var(--paper); color:var(--ink); font-family:'Inter';
    font-size:13.5px; font-weight:600; padding:12px 14px; min-height:44px; border-radius:10px; cursor:pointer; transition:.15s;}
  .seg button.on{background:var(--focus); border-color:var(--focus); color:var(--white);}
  .seg button:active{transform:scale(.96);}

  .stepper{display:flex; align-items:center; gap:14px;}
  .stepper button{width:38px; height:38px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper);
    font-size:18px; font-weight:700; cursor:pointer; color:var(--ink);}
  .stepper .val{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; min-width:74px; text-align:center;}

  .seqpreview{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; background:var(--paper-dim);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px;}

  input, select, textarea{
    width:100%; box-sizing:border-box; padding:12px 14px; min-height:48px;
    border:1.5px solid var(--line); border-radius:10px;
    font-family:'Inter'; font-size:16px; background:var(--paper); color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  .pwfield{position:relative;}
  .pwfield input{padding-right:46px;}
  .pwtoggle{position:absolute; right:4px; top:50%; transform:translateY(-50%); width:40px; height:40px;
    border:none; background:transparent; font-size:18px; cursor:pointer; border-radius:8px; padding:0;
    display:flex; align-items:center; justify-content:center;}
  .pwtoggle:active{background:var(--paper-dim);}
  @media (min-width:560px){
    .authcard{max-width:420px; margin-left:auto; margin-right:auto;}
  }

  .primary{background:var(--focus); color:var(--white); border:none; border-radius:12px; padding:16px 22px;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; cursor:pointer; width:100%;}
  .primary:active{transform:scale(.985);}
  .ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line); border-radius:12px; padding:13px 18px;
    min-height:44px; font-family:'Inter'; font-weight:600; font-size:14px; cursor:pointer;}
  .rowbtns{display:flex; gap:12px; margin-top:6px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 22px; background:var(--focus); color:var(--white);}
  .topbar .info{font-family:'JetBrains Mono',monospace; font-size:12.5px; opacity:.85;}
  .topbar button{background:rgba(255,255,255,.12); color:var(--white); border:1px solid rgba(255,255,255,.25);
    border-radius:8px; padding:8px 12px; font-size:12.5px; cursor:pointer;}

  .stage{flex:1; background:var(--focus); background:linear-gradient(180deg,var(--focus),var(--focus-2));
    display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; min-height:60vh;}
  .stimulus{font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--white); font-size:min(22vw,180px);
    line-height:1; letter-spacing:-0.01em;}
  .stimulus.symbolwrap{font-size:min(18vw,150px);}
  .stimulus.word{font-size:min(11vw,64px);}
  .colorcircle{width:min(45vw,220px); height:min(45vw,220px); border-radius:50%; box-shadow:0 8px 30px rgba(0,0,0,.35);}
  .neglect-board{flex:1; position:relative; background:var(--paper); min-height:60vh;}
  .neglect-item{position:absolute; width:9%; aspect-ratio:1; max-width:64px; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center; border-radius:10px; background:var(--white);
    border:1.5px solid var(--line); font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(14px,3vw,22px); color:var(--ink); cursor:pointer; user-select:none; touch-action:manipulation;}
  .neglect-item.found{background:var(--signal-soft); border-color:var(--signal); opacity:.45;}
  .neglect-item.falsetap{background:var(--alert-soft); border-color:var(--alert); opacity:.6;}
  .neglect-item.cue-pulse{animation: neglectCuePulse 1.1s ease-in-out infinite;}
  @keyframes neglectCuePulse{
    0%, 100% { box-shadow: 0 0 0 0 rgba(217,164,65,.55); }
    50% { box-shadow: 0 0 0 8px rgba(217,164,65,0); }
  }
  .blank{color:rgba(255,255,255,.18); font-size:min(14vw,110px); font-family:'Space Grotesk',sans-serif;}

  .audio-pulse{width:120px; height:120px; border-radius:50%; border:3px solid var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:44px;}
  .audio-pulse.active{animation:pulse .5s ease-out;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,164,65,.55);}100%{box-shadow:0 0 0 26px rgba(217,164,65,0);}}

  .trail{display:flex; gap:6px; position:absolute; bottom:22px; left:0; right:0; justify-content:center; flex-wrap:wrap; padding:0 12px;}
  .trail .chip{width:26px; height:26px; border-radius:7px; background:rgba(255,255,255,.12); border:2px solid transparent;}
  .trail .chip.hit{border-color:var(--signal); background:rgba(76,122,107,.5);}
  .trail .chip.err{border-color:var(--alert); background:rgba(181,84,74,.5);}
  .trail .chip.pend{border-color:rgba(255,255,255,.3);}

  .respond{padding:18px 22px 26px; background:var(--focus-2); display:flex; gap:14px;}
  button{touch-action:manipulation; cursor:pointer;}
  @media (hover:hover){
    .seg button:hover{border-color:var(--ink-soft);}
    .primary:hover{filter:brightness(1.1);}
    .ghost:hover{background:var(--paper-dim);}
    .tapbtn:hover{filter:brightness(1.08);}
    .topbar button:hover{background:rgba(255,255,255,.2);}
    .stepper button:hover{background:var(--paper-dim);}
    .navlinks .link:hover, .navlinks a:hover{color:var(--ink);}
    .histrow > div:first-child:hover{opacity:.75;}
  }
  /* Su schermi larghi (desktop) centra i contenuti invece di stenderli
     a piena larghezza — l'app resta comunque a piena larghezza su tablet. */
  @media (min-width:820px){
    .brand, .screen{max-width:960px; margin-left:auto; margin-right:auto; width:100%;}
    .topbar, .stage, .respond{max-width:960px; margin-left:auto; margin-right:auto; width:100%; box-sizing:border-box;}
    .grid{grid-template-columns:repeat(auto-fit, minmax(240px,1fr));}
  }
  .tapbtn{flex:1; padding:22px; border-radius:16px; border:none; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:18px; cursor:pointer; letter-spacing:.01em; transition:transform .08s, filter .08s;}
  .tapbtn.match{background:var(--accent); color:var(--ink);}
  .tapbtn.nomatch{background:rgba(255,255,255,.1); color:var(--white); border:1.5px solid rgba(255,255,255,.25);}
  .tapbtn.full{flex:1 1 100%;}
  .tapbtn:active, .tapbtn.tapped{transform:scale(.96); filter:brightness(1.18);}
  .stopcue-full{width:min(70vw,320px); height:min(70vw,320px); border-radius:50%; background:var(--alert);
    display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:min(12vw,56px); letter-spacing:.06em; animation:stoppulse .22s ease-out;}
  @keyframes stoppulse{0%{transform:scale(.7); opacity:.4;}100%{transform:scale(1); opacity:1;}}

  .flash{position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity .25s;}
  .flash.on{opacity:1;}

  table{width:100%; border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:13.5px;}
  td,th{padding:9px 6px; border-bottom:1px solid var(--line); text-align:left;}
  th{color:var(--ink-soft); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;}
  .metricgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:14px 0 20px;}
  .metric{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px;}
  .metric .n{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:24px;}
  .metric .l{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

  .histrow{display:flex; justify-content:space-between; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .histrow .l{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft);}
  .empty{color:var(--ink-soft); font-size:13.5px; padding:20px 4px; text-align:center;}
  @media (min-width:820px){
    .stimulus{font-size:min(16vw,280px) !important;}
    .stimulus.symbolwrap{font-size:min(13vw,230px) !important;}
    .stimulus.word{font-size:min(8vw,110px) !important;}
    .colorcircle{width:min(30vw,320px) !important; height:min(30vw,320px) !important;}
    .blank{font-size:min(9vw,160px) !important;}
    .stopcue-full{width:min(40vw,420px) !important; height:min(40vw,420px) !important; font-size:min(7vw,72px) !important;}
  }
  .navlinks{display:flex; gap:10px; margin-top:16px;}
  .landing-choices{display:flex; flex-direction:column; gap:14px; margin-top:8px;}
  .landing-card{display:flex; flex-direction:column; align-items:flex-start; gap:8px; text-align:left;
    background:var(--paper); border:1.5px solid var(--line); border-radius:16px; padding:24px;
    cursor:pointer; transition:.15s; flex:1;}
  .landing-card:active{transform:scale(.98);}
  .landing-icon{font-size:32px;}
  .landing-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; color:var(--ink);}
  .landing-desc{font-size:13px; color:var(--ink-soft); line-height:1.5;}
  @media (hover:hover){ .landing-card:hover{border-color:var(--accent); background:var(--paper-dim);} }
  @media (min-width:560px){ .landing-choices{flex-direction:row;} }
  .navlinks a, .navlinks .link{color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; background:none; border:none; font-family:'Inter';}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ---------- data pools ---------- */
  const POOLS = {
    lettere: ['B','C','D','F','G','H','L','M','N','P','R','S','T','V'],
    numeri:  ['1','2','3','4','5','6','7','8','9'], // rigenerato per sessione da regenerateNumeriPool(), in base a cfg.numDigits
    simboli: ['●','■','▲','◆','★','✚','⬟','⬤'],
    parole:  [], // rigenerato da regenerateParolePool(), in base a cfg.wordComplexity
    suoni:   [
      {f:220,type:'sine',icon:'A'},{f:294,type:'square',icon:'B'},{f:349,type:'sine',icon:'C'},
      {f:392,type:'triangle',icon:'D'},{f:466,type:'square',icon:'E'},{f:523,type:'triangle',icon:'F'}
    ],
    suoni2:  [ // registro più acuto, timbro diverso — usato per il secondo canale nel doppio compito uditivo-uditivo
      {f:660,type:'sine',icon:'G'},{f:740,type:'square',icon:'H'},{f:831,type:'triangle',icon:'I'},
      {f:932,type:'sine',icon:'J'},{f:1046,type:'square',icon:'K'},{f:1175,type:'triangle',icon:'L'}
    ],
    colori: [
      {hex:'#D64545', icon:'Rosso'}, {hex:'#3B72D6', icon:'Blu'}, {hex:'#3FA34D', icon:'Verde'},
      {hex:'#E0B12D', icon:'Giallo'}, {hex:'#8E4EC6', icon:'Viola'}, {hex:'#E07B2D', icon:'Arancione'},
      {hex:'#2DB6C7', icon:'Ciano'}, {hex:'#D6469B', icon:'Magenta'}
    ]
  };
  const STIM_LABELS = {lettere:'Lettere', numeri:'Numeri', simboli:'Simboli', parole:'Parole', suoni:'Suoni', colori:'Colori'};
  const STOP_TONE = {f:140, type:'square'}; // segnale di stop uditivo, sempre lo stesso, distinto dagli stimoli
  const TAPAT_CUE_TONE = {f:880, type:'sine'}; // segnale di allerta fasico TAPAT — acuto e breve, non lateralizzato: raggiunge il paziente indipendentemente da dove guarda (importante per la variante spaziale/neglect, dove un cue solo visivo rischierebbe di cadere nell'emicampo trascurato)
  // "lettere"/"parole" sono femminili, gli altri materiali sono maschili —
  // serve per costruire istruzioni con l'accordo di genere corretto
  // (es. "una alla volta" vs "uno alla volta", "molte" vs "molti").
  function stimGender(stimType){ return (stimType==='lettere' || stimType==='parole') ? 'f' : 'm'; }

  // Banca di parole concrete italiane, divisa per lunghezza/complessità.
  // "mista" pesca da tutte e tre in proporzioni uguali.
  const WORD_BANK = {
    breve: ['CASA','SOLE','MARE','PANE','LUNA','ROSA','VINO','MELA','NOCE','RISO','UOVA','ORSO','LUPO','CANE',
      'GATTO','TORO','MONTE','FIUME','PONTE','TORRE','CAMPO','BOSCO','PRATO','VENTO','NEVE','PORTA','SEDIA',
      'FUOCO','FIORE','LIBRO','TAVOLO','CHIAVE','STRADA','NUVOLA','ALBERO'],
    media: ['FINESTRA','GIARDINO','MONTAGNA','FORESTA','SPIAGGIA','CAMICIA','BICCHIERE','CUCCHIAIO','FORCHETTA',
      'OROLOGIO','TELEFONO','COMPUTER','BAMBINO','FAMIGLIA','MEDICINA','OSPEDALE','FARMACIA','STAZIONE',
      'MERCATO','NEGOZIO','QUADERNO','POLTRONA','CUSCINO','LENZUOLO','ASCIUGAMANO','SAPONE','SPAZZOLINO',
      'OMBRELLO','GUANTI','CAPPELLO','SCIARPA','MAGLIONE','PANTALONI','SCARPE','ZAINO'],
    lunga: ['RISTORANTE','BIBLIOTECA','APPARTAMENTO','AUTOMOBILE','TEMPERATURA','REFRIGERATORE','ASCENSORE',
      'PARRUCCHIERE','SUPERMERCATO','INFERMIERA','PROFESSORE','COMPLEANNO','CALENDARIO','PASSEGGINO',
      'AEROPORTO','FOTOGRAFIA','BICICLETTA','MOTOCICLETTA','PARCHEGGIO','SEMAFORO','MARCIAPIEDE',
      'CIOCCOLATO','MINESTRONE','MELANZANA','ANGURIA','ALBICOCCA','FRIGORIFERO','LAVASTOVIGLIE',
      'ASPIRAPOLVERE','TERMOSIFONE','PORTAFOGLIO','OCCHIALI','OROLOGERIA','CARTOLINA']
  };
  function regenerateParolePool(){
    const c = cfg.wordComplexity || 'breve';
    let bank = c==='mista' ? WORD_BANK.breve.concat(WORD_BANK.media, WORD_BANK.lunga) : (WORD_BANK[c] || WORD_BANK.breve);
    POOLS.parole = bank;
  }
  // Numeri a 1-6 cifre, personalizzabile (cfg.numDigits). Rigenera un
  // sottoinsieme casuale ad ogni sessione per varietà, tenendo il pool a
  // una dimensione gestibile indipendentemente da quante cifre.
  function regenerateNumeriPool(){
    const digits = cfg.numDigits || 1;
    const min = digits===1 ? 1 : Math.pow(10, digits-1);
    const max = Math.pow(10, digits) - 1;
    const rangeSize = max - min + 1;
    const count = Math.min(16, rangeSize);
    const seen = new Set(); const arr = [];
    let guard = 0;
    while(arr.length < count && guard < count*50){
      guard++;
      const n = min + Math.floor(Math.random()*rangeSize);
      if(!seen.has(n)){ seen.add(n); arr.push(String(n)); }
    }
    POOLS.numeri = arr;
  }

  const EXERCISES = {
    nback:      {label:'N-back classico',        usesStimType:true,  usesTargetSeq:false, family:'signal',
      domini:['Memoria di lavoro','Attenzione sostenuta'],
      instructions:c=>{
        const f = stimGender(c.stimType)==='f';
        return 'Vedrai una serie di '+STIM_LABELS[c.stimType].toLowerCase()+', '+(f?'una':'uno')+' alla volta. Tocca il pulsante dorato ogni volta che '+(f?'è uguale a quella':'è uguale a quello')+' di '+c.nLevel+(c.nLevel===1?' posizione prima':' posizioni prima')+'. Se non lo è, non toccare nulla.';
      }},
    sequenza:   {label:'Sequenza bersaglio',      usesStimType:true,  usesTargetSeq:true,  family:'signal',
      domini:['Memoria di lavoro','Attenzione sostenuta'],
      instructions:c=> 'Vedrai una serie di stimoli, uno dopo l\'altro. Tocca il pulsante dorato subito dopo che si è conclusa la sequenza '+c.targetSeq.map(seqLabel).join(', poi ')+'. Per tutti gli altri stimoli non toccare nulla.'},
    gonogo:     {label:'Go/No-Go',                usesStimType:true,  usesTargetSeq:true,  family:'signal',
      domini:['Controllo inibitorio','Attenzione sostenuta'],
      instructions:c=>{
        const active = c.adaptive ? c.targetSeq.slice(0, Math.max(1,ADAPT_GONOGO_COUNT[c.adaptStartLevel]||1)) : c.targetSeq;
        const list = active.map(seqLabel).join(', ');
        return 'Tocca il pulsante ogni volta che appare uno stimolo, tranne quando appare '+(active.length>1?'uno di questi: '+list:list)+' — in quel caso non toccare nulla.';
      }},
    stopsignal: {label:'Stop-Signal',             usesStimType:true,  usesTargetSeq:false, family:'signal',
      domini:['Controllo inibitorio (motorio)'],
      instructions:c=> 'Tocca il pulsante il più velocemente possibile, ogni volta che appare uno stimolo. A volte, subito dopo, comparirà la scritta STOP: in quel caso prova a non toccare, anche se avevi già iniziato il movimento.'},
    ant:        {label:'Attenzione (tipo ANT)',   usesStimType:true,  usesTargetSeq:false, family:'choice',
      domini:['Allerta','Orienting spaziale','Controllo esecutivo/conflitto'],
      instructions:c=>{
        if(c.antMode==='tapat'){
          const matName = c.stimType==='suoni' ? 'il suono' : c.stimType==='colori' ? 'il cerchio colorato' : 'lo stimolo';
          const verbo = c.stimType==='suoni' ? 'senti' : 'vedi';
          const spaziale = c.tapatSpatial ? ' Il bersaglio può comparire a sinistra o a destra invece che al centro — esplora tutto lo schermo, non fissare un punto solo.' : '';
          return 'Nella prima parte, gli intervalli tra uno stimolo e l\'altro sono lunghi e imprevedibili: mantieni l\'attenzione anche se sembra non succedere nulla, e tocca il pulsante appena '+verbo+' '+matName+'.'+spaziale+' Nella seconda parte, gli intervalli sono più brevi e a volte un piccolo segnale ti avviserà poco prima — rispondi comunque il più velocemente possibile, ogni volta.';
        }
        const tokens = ANT_MATERIAL_TOKENS[c.antMaterial];
        if(tokens) return 'Vedrai "'+tokens[0]+'" o "'+tokens[1]+'" al centro dello schermo, a volte circondato da altri elementi uguali o diversi. Tocca il pulsante corrispondente a quello al centro, il più velocemente possibile.';
        return 'Vedrai una freccia al centro dello schermo, a volte circondata da altre frecce. Indica la direzione della freccia centrale il più velocemente possibile, toccando il pulsante sinistra o destra.';
      }},
    switching:  {label:'Task-switching',          usesStimType:false, usesTargetSeq:false, family:'choice',
      domini:['Flessibilità cognitiva','Funzioni esecutive'],
      instructions:c=>{

        const rs=SWITCH_RULESETS[c.switchMaterial]; const matName = c.switchMaterial==='numeri'?'un numero':c.switchMaterial==='lettere'?'una lettera':c.switchMaterial==='simboli'?'un simbolo':'un colore'; return 'Vedrai '+matName+', con accanto un\'indicazione che cambia: a volte devi classificarlo come "'+rs.ruleA.label+'", altre volte come "'+rs.ruleB.label+'". Segui l\'indicazione mostrata in quel momento.'; }},
    categorizzazione: {label:'Categorizzazione condizionale', usesStimType:false, usesTargetSeq:false, family:'choice',

        const liv = categStructureOfLevel(c.categLivello);

    dualtask:   {label:'Doppio compito',          usesStimType:false, usesTargetSeq:false, family:'dual',

      }},
    neglect:    {label:'Cancellazione (neglect)',  usesStimType:true,  usesTargetSeq:true,  family:'spatial',

    goaltask:   {label:'Scenari ecologici (pianificazione/multitasking)',      usesStimType:false, usesTargetSeq:false, family:'goaltask',

      instructions:c=>{

        return 'Ti verrà mostrato un elenco di elementi da completare, uno alla volta, nell\'ordine che preferisci — rispetta però le eventuali dipendenze indicate (alcuni elementi richiedono che un altro sia già stato fatto prima).'+regoleTxt+budgetTxt+' Tocca "Completa" su ciascun elemento quando lo hai fatto (o quando l\'operatore lo segna per te).';

    memoria:    {label:'Strategie di memoria',      usesStimType:false, usesTargetSeq:false, family:'memoria',

        const materiale = c.memoriaModo==='chunking' ? 'lista' : (c.memoriaMateriale||'lista');
        const cosa = materiale==='lista' ? 'ogni parola della lista' : 'ogni idea principale del brano';
        if(c.memoriaModo==='loci'){
          const percorsoTxt = c.memoriaLociTipo==='corpo' ? 'un percorso lungo il tuo corpo, dalla testa ai piedi' : c.memoriaLociTipo==='personalizzato' ? 'un percorso di luoghi reali che conosci bene' : 'un tragitto di luoghi familiari';
          return 'Percorrerai mentalmente '+percorsoTxt+' (il metodo dei loci): '+cosa+' verrà associata a una tappa del percorso, una alla volta. Immagina la scena il più vividamente possibile. Dopo, ripercorri il tragitto a mente e richiama ciò che avevi posizionato in ciascuna tappa: l\'operatore segnerà ciò che recuperi.';

        if(c.memoriaModo==='vanishing') return 'Per '+(materiale==='lista'?'ogni parola':'ogni idea')+' vedrai prima un forte suggerimento (quasi tutta l\'informazione), poi uno più debole: prova a completarla tu prima che sparisca del tutto. È la tecnica dei "vanishing cues". Alla fine, un richiamo libero senza alcun suggerimento.';

  };

  /* ---------- state ---------- */
  let cfg = {
    stimType:'lettere', nLevel:5, isi:2200, stimDuration:600, trials:24,
    targetRate:0.32, respMode:'paziente', voice:false, patientCode:'', notes:'',
    taskMode:'nback', targetSeq: POOLS.lettere.slice(0,3),
    ssd:250, ssdStep:50, // solo per Stop-Signal
    adaptive:false, // solo per N-back: titolazione automatica del livello
    switchMaterial:'numeri', // solo per Task-switching
    antMode:'classico', antMaterial:'frecce', // 'classico' | 'tapat'; materiale: 'frecce' | 'lettere' | 'simboli' — solo ANT classico
    showTrail:true, // mostra i pallini di esito prova-per-prova durante la sessione
    numDigits:1, wordComplexity:'breve', // solo per stimolo "numeri"/"parole"
    tapatStartLevel:3, adaptStartLevel:3, neglectStartLevel:3, // livello di partenza, aggiornato dopo ogni sessione adattiva
    tapatSpatial:false, tapatGradient:50, // componente spaziale del TAPAT (specifica per il neglect)
    dualVisual:'lettere', dualVisual2:'numeri', dualPairing:'vis-aud', dualStartLevel1:3, dualStartLevel2:3, // solo per Doppio compito
    neglectGradient:50, neglectLayout:'griglia', neglectTimeLimit:60, neglectBoardSize:40, // solo per Cancellazione — gradiente 0=tutto a destra, 100=tutto a sinistra, 50=simmetrico
    neglectMode:'classico', neglectRuleLevel:1, // 'classico' (bersagli noti), 'intruso' (l'unico elemento senza doppione), 'regola' (regola composta crescente 1-5)
    neglectBottomUp:'auto', // solo per 'classico' — 'auto' (pulsazione bottom-up sul lato debole, solo ai livelli bassi e solo se emerge un'asimmetria nella tavola) oppure 'off' (mai, consigliato nelle sessioni di rivalutazione per non falsare la misura)
    neglectAlphabet:'auto', // solo per 'intruso' — 'auto' (progressione per livello) oppure famiglia forzata: 'latino_cirillico'|'greco'|'armeno'
    neglectRuleClauses:null, // solo per 'regola' — null=progressione automatica cumulativa per livello; altrimenti array di chiavi scelte manualmente fra 'base','colore','riga','sfondo'
    goaltaskScenario:'sei_compiti_classico', goaltaskLivello:2, // solo per Scenari ecologici (1-5, crescente)
    memoriaModo:'pqrst', memoriaLivello:1, memoriaMateriale:'lista', // solo per Strategie di memoria — memoriaMateriale usato solo da loci/errorless/vanishing (pqrst è sempre brano, chunking è sempre lista)
    memoriaFormaIdx:0, // solo per pqrst/chunking, solo sui livelli con forme parallele (1-2 al momento) — quale forma (A/B/C...) usare in questa sessione; scelta sempre manuale dall'operatore, mai casuale, per poter pilotare baseline/intermedia/finale nel confronto RCI
    memoriaLociTipo:'casa', memoriaLociCustom:'', // solo per loci — 'casa'|'corpo'|'personalizzato' (tappe reali digitate dall'operatore, una per riga)
    chunkingMetodi:['categoria'], chunkingNota:'', // solo per chunking — array di chiavi fra 'categoria','acronimo','narrazione','immagine','personale' (max 1 sotto liv.11, max 2 da liv.11); chunkingNota usata solo se 'personale' è selezionato
    categLivello:1, categMateriale:'colori', // solo per Categorizzazione condizionale — livello 1-10 (banda doppia delle 5 strutture, struttura fissa dentro ogni banda, non adattivo); categMateriale usato solo alle strutture 1 e 4 ('colori'|'simboli')
    sequenzaMista:false, // solo per Sequenza bersaglio: mescola codici diversi (lettere/numeri/colori/suoni/simboli) nella stessa sequenza invece di un solo tipo
    nbackMista:false // solo per N-back: stesso principio, materiale che cambia tipo prova per prova invece di restare fisso
  };
  // Tipi di stimolo utilizzabili insieme in una sequenza bersaglio mista.
  // Escluse le parole: la lunghezza variabile complicherebbe la costruzione
  // e la lettura rapida della sequenza da parte del paziente.
  const SEQUENZA_MISTA_TYPES = ['lettere','numeri','colori','suoni','simboli'];
  function defaultTargetSeq(stimType, len){
    len = len || (cfg.targetSeq ? cfg.targetSeq.length : 3);
    const pool = POOLS[stimType];
    const out = [];
    for(let i=0;i<len;i++) out.push(pool[i % pool.length]);
    return out;
  }

  /* ---------- training presets (saved settings, local device) ---------- */
  // Salva solo i parametri del protocollo, non dati di sessione (codice
  // paziente/note) — un preset è "come allenare", non "chi" o "quando".
  function presetCfgOf(c){
    return {
      stimType:c.stimType, taskMode:c.taskMode, nLevel:c.nLevel,
      targetSeq: (EXERCISES[c.taskMode].usesTargetSeq)
        ? (c.taskMode==='sequenza' && c.sequenzaMista
            ? c.targetSeq.map(e=>({stimType:e.stimType, label:seqLabel(e)}))
            : c.targetSeq.map(seqLabel))
        : null,
      sequenzaMista: !!c.sequenzaMista, nbackMista: !!c.nbackMista,
      trials:c.trials, isi:c.isi, stimDuration:c.stimDuration, targetRate:c.targetRate,
      respMode:c.respMode, voice:c.voice, ssd:c.ssd, ssdStep:c.ssdStep, adaptive:c.adaptive,
      switchMaterial:c.switchMaterial, dualVisual:c.dualVisual, dualVisual2:c.dualVisual2, dualPairing:c.dualPairing, antMode:c.antMode,
      tapatSpatial:c.tapatSpatial, tapatGradient:c.tapatGradient, antMaterial:c.antMaterial,
      numDigits:c.numDigits, wordComplexity:c.wordComplexity, showTrail:c.showTrail,
      neglectGradient:c.neglectGradient, neglectLayout:c.neglectLayout, neglectTimeLimit:c.neglectTimeLimit, neglectBoardSize:c.neglectBoardSize,
      neglectMode:c.neglectMode, neglectRuleLevel:c.neglectRuleLevel,
      goaltaskScenario:c.goaltaskScenario, goaltaskLivello:c.goaltaskLivello, memoriaModo:c.memoriaModo, memoriaLivello:c.memoriaLivello, memoriaMateriale:c.memoriaMateriale, memoriaFormaIdx:c.memoriaFormaIdx,
      memoriaLociTipo:c.memoriaLociTipo, memoriaLociCustom:c.memoriaLociCustom,
      chunkingMetodi:c.chunkingMetodi, chunkingNota:c.chunkingNota,
      categLivello:c.categLivello, categMateriale:c.categMateriale
    };
  }
  function listPresets(){
    const out = [];
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('traccian:preset:')===0){
          try{ out.push(JSON.parse(localStorage.getItem(k))); }catch(e){}
        }
      }
    }catch(e){}
    out.sort((a,b)=> b.savedAt - a.savedAt);
    return out;
  }
  function savePreset(name){
    const id = Date.now()+'-'+Math.random().toString(36).slice(2,7);
    const rec = {id, name, savedAt: Date.now(), cfg: presetCfgOf(cfg)};
    try{ localStorage.setItem('traccian:preset:'+id, JSON.stringify(rec)); }catch(e){}
  }
  function deletePreset(id){ try{ localStorage.removeItem('traccian:preset:'+id); }catch(e){} }
  function loadPreset(p){
    const pc = p.cfg;
    cfg.stimType = pc.stimType; cfg.taskMode = pc.taskMode; cfg.nLevel = pc.nLevel;
    cfg.trials = pc.trials; cfg.isi = pc.isi; cfg.stimDuration = pc.stimDuration;
    cfg.targetRate = pc.targetRate; cfg.respMode = pc.respMode; cfg.voice = pc.voice;
    cfg.ssd = pc.ssd || 250; cfg.ssdStep = pc.ssdStep || 50; cfg.adaptive = !!pc.adaptive;
    cfg.switchMaterial = pc.switchMaterial || 'numeri'; cfg.dualVisual = pc.dualVisual || 'lettere'; cfg.dualVisual2 = pc.dualVisual2 || 'numeri'; cfg.dualPairing = pc.dualPairing || 'vis-aud'; cfg.antMode = pc.antMode || 'classico';
    cfg.tapatSpatial = !!pc.tapatSpatial; cfg.tapatGradient = pc.tapatGradient!=null?pc.tapatGradient:50; cfg.antMaterial = pc.antMaterial || 'frecce';
    cfg.numDigits = pc.numDigits || 1; cfg.wordComplexity = pc.wordComplexity || 'breve'; cfg.showTrail = pc.showTrail!==false;
    cfg.neglectGradient = pc.neglectGradient!=null?pc.neglectGradient:50; cfg.neglectLayout = pc.neglectLayout || 'griglia'; cfg.neglectTimeLimit = pc.neglectTimeLimit!=null?pc.neglectTimeLimit:60; cfg.neglectBoardSize = pc.neglectBoardSize || 40;
    cfg.neglectMode = pc.neglectMode || 'classico'; cfg.neglectRuleLevel = pc.neglectRuleLevel || 1;
    cfg.goaltaskScenario = pc.goaltaskScenario || 'sei_compiti_classico';
    cfg.goaltaskLivello = pc.goaltaskLivello || 2;
    cfg.memoriaModo = pc.memoriaModo || 'pqrst'; cfg.memoriaLivello = pc.memoriaLivello || 1; cfg.memoriaMateriale = pc.memoriaMateriale || 'lista';
    cfg.memoriaFormaIdx = pc.memoriaFormaIdx || 0;
    cfg.memoriaLociTipo = pc.memoriaLociTipo || 'casa'; cfg.memoriaLociCustom = pc.memoriaLociCustom || '';
    cfg.chunkingMetodi = (pc.chunkingMetodi && pc.chunkingMetodi.length) ? pc.chunkingMetodi : ['categoria']; cfg.chunkingNota = pc.chunkingNota || '';
    cfg.categLivello = pc.categLivello || 1; cfg.categMateriale = pc.categMateriale || 'colori';
    cfg.sequenzaMista = !!pc.sequenzaMista; cfg.nbackMista = !!pc.nbackMista;
    cfg.targetSeq = (EXERCISES[pc.taskMode] && EXERCISES[pc.taskMode].usesTargetSeq && pc.targetSeq && pc.targetSeq.length)
      ? (pc.taskMode==='sequenza' && pc.sequenzaMista
          ? pc.targetSeq.map(e=>{ const pool = POOLS[e.stimType]||[]; return {stimType:e.stimType, item: pool.find(it=>seqLabel(it)===e.label) || e.label}; })
          : pc.targetSeq.map(v=> POOLS[pc.stimType].find(item=> seqLabel(item)===v) || v))
      : defaultTargetSeq(pc.stimType, pc.taskMode==='gonogo' ? 1 : 3);
    render();
  }
  /* ---------- profili paziente locali (in presenza, senza account remoto) ---------- */
  // A differenza dei pazienti "veri" (account Supabase con codice di
  // accesso, per l'uso da remoto), questi sono etichette locali: servono a
  // organizzare le sessioni fatte in presenza sotto un nome, senza dover
  // creare un account per ogni paziente che l'operatore vede di persona.
  // Possono in seguito essere "promossi" a un vero account remoto.
  // I profili locali vivono anzitutto in localStorage (funzionano anche
  // offline/senza account). Se l'operatore ha la sincronizzazione cloud
  // attiva, li rispecchiamo anche su Supabase (tabella pazienti_locali,
  // isolata per operatore via RLS) — così non spariscono cambiando
  // browser/dispositivo/cache. Non richiedono un account paziente: restano
  // semplici etichette, senza login autonomo, esattamente come prima.
  let localPatientsCloudCache = null; // cache dei profili locali letti da Supabase per l'operatore corrente
  function listLocalPatients(){
    const out = [];
    const seen = {};
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('traccian:localpatient:')===0){
          try{ const p = JSON.parse(localStorage.getItem(k)); out.push(p); seen[p.id]=true; }catch(e){}
        }
      }
    }catch(e){}
    if(sb && cloudUser && !patientProfile){
      if(localPatientsCloudCache===null){
        localPatientsCloudCache = [];
        sb.from('pazienti_locali').select('*').eq('operatore_id', cloudUser.id).then(({data,error})=>{
          if(!error && data){
            localPatientsCloudCache = data.map(r=>({id:r.id, nome:r.nome, createdAt:r.creato_il?Date.parse(r.creato_il):Date.now(), lastConfig:r.ultima_config||null, screeningFlags:r.screening_flags||null, programma:r.programma_assegnato||null, screeningRisultati:r.screening_risultati||null}));
            // porta in locale anche i profili creati altrove, per uso offline
            localPatientsCloudCache.forEach(p=>{
              try{ if(!localStorage.getItem('traccian:localpatient:'+p.id)) localStorage.setItem('traccian:localpatient:'+p.id, JSON.stringify(p)); }catch(e){}
            });
          }
          render();
        });
      }
      (localPatientsCloudCache||[]).forEach(p=>{ if(!seen[p.id]){ out.push(p); seen[p.id]=true; } });
    }
    out.sort((a,b)=> a.nome.localeCompare(b.nome, 'it'));
    return out;
  }
  async function syncLocalPatientToCloud(p){
    if(!sb || !cloudUser || patientProfile) return;
    try{
      await sb.from('pazienti_locali').upsert({
        id:p.id, operatore_id:cloudUser.id, nome:p.nome, ultima_config:p.lastConfig||null, screening_flags:p.screeningFlags||null, programma_assegnato:p.programma||null, screening_risultati:p.screeningRisultati||null
      });
      localPatientsCloudCache = null; // forza un refresco al prossimo listLocalPatients()
    }catch(e){ console.error('sync paziente locale fallita', e); }
  }
  function saveLocalPatient(nome){
    const id = 'lp-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
    const p = {id, nome, createdAt: Date.now()};
    try{ localStorage.setItem('traccian:localpatient:'+id, JSON.stringify(p)); }catch(e){}
    syncLocalPatientToCloud(p);
    return p;
  }
  function updateLocalPatientConfig(id, presetCfg){
    let p = null;
    try{
      const raw = localStorage.getItem('traccian:localpatient:'+id);
      if(!raw) return;
      p = JSON.parse(raw);
      p.lastConfig = presetCfg;

  /* ---------- sequence generation ---------- */
  function buildSequence(){
    switch(cfg.taskMode){
      case 'sequenza': return buildSequenceTarget();
      case 'gonogo': return buildGoNoGo();
      case 'stopsignal': return buildStopSignal();
      case 'ant': return buildANT();
      case 'switching': return buildSwitching();
      case 'categorizzazione': return buildCategorizzazione();
      case 'dualtask': return buildDualTask();
      default: return buildSequenceNback();
    }
  }
  function buildSequenceNback(){
    // Non raggiunta nell'uso normale: l'N-back è sempre a generazione
    // incrementale (vedi isIncremental/genNbackTrial), tenuta comunque
    // coerente con la tabella livello->n per non lasciare codice morto
    // disallineato.
    const pool = POOLS[cfg.stimType];
    const n = nbackParamsForLevel(cfg.nLevel).n;
    const seq = [];
    function runLen(i, val){ // quante ripetizioni consecutive di val terminerebbero in i
      let run = 1;
      for(let k=i-1;k>=0;k--){ if(seq[k].val===val) run++; else break; }
      return run;
    }
    for(let i=0;i<cfg.trials;i++){
      let makeTarget = i>=n && Math.random() < cfg.targetRate;
      let val;
      if(makeTarget){
        const cand = seq[i-n].val;
        if(pool.length>1 && runLen(i,cand) > 3){ makeTarget = false; } // il vincolo anti-ripetizione ha priorità
        else val = cand;
      }
      if(!makeTarget){
        do{ val = pool[Math.floor(Math.random()*pool.length)]; }
        while(pool.length>1 && ((i>=n && val===seq[i-n].val) || runLen(i,val)>3));
      }
      seq.push({val, isTarget: i>=n ? makeTarget : false, valid:i>=n});
    }
    return seq;
  }
  // Target-sequence mode: respond only when the trailing stimuli exactly
  // match a fixed, custom-built sequence (e.g. 1 → 2 → 3). Everything else
  // is a non-target, regardless of how "close" it looks.
  function sameSeqItem(a,b){
    if(cfg.taskMode==='sequenza' && cfg.sequenzaMista) return a && b && a.stimType===b.stimType && a.item===b.item;
    return a===b;
  }
  // In modalità adattiva, la lunghezza della sequenza bersaglio segue
  // ADAPT_SEQ_LEN invece di quella scelta manualmente in cfg.targetSeq —
  // calcolata una sola volta qui, prima che la sessione esista (stesso
  // principio già usato per lo squilibrio di regola dello switching).
  function sequenceTargetForBuild(){
    if(!cfg.adaptive) return cfg.targetSeq;
    const desiredLen = ADAPT_SEQ_LEN[cfg.adaptStartLevel] || cfg.targetSeq.length;
    if(cfg.targetSeq.length===desiredLen) return cfg.targetSeq;
    if(cfg.sequenzaMista){
      const base = cfg.targetSeq.length ? cfg.targetSeq : [{stimType:SEQUENZA_MISTA_TYPES[0], item:POOLS[SEQUENZA_MISTA_TYPES[0]][0]}];
      const out = [];
      for(let i=0;i<desiredLen;i++) out.push(base[i % base.length]);
      return out;
    }
    return defaultTargetSeq(cfg.stimType, desiredLen);
  }
  function buildSequenceTarget(){
    const isMista = cfg.taskMode==='sequenza' && cfg.sequenzaMista;
    const target = sequenceTargetForBuild();
    const len = target.length;
    const raw = [];
    const randMista = ()=>{
      const t = SEQUENZA_MISTA_TYPES[Math.floor(Math.random()*SEQUENZA_MISTA_TYPES.length)];
      const p = POOLS[t];
      return {stimType:t, item:p[Math.floor(Math.random()*p.length)]};
    };
    const pool = isMista ? null : POOLS[cfg.stimType];
    for(let i=0;i<cfg.trials;i++) raw.push(isMista ? randMista() : pool[Math.floor(Math.random()*pool.length)]);
    for(let i=len-1;i<cfg.trials;i++){
      if(Math.random() < cfg.targetRate){
        for(let j=0;j<len;j++) raw[i-len+1+j] = target[j];
      }
    }
    return raw.map((val,i)=>{
      let isTarget = false;
      if(i>=len-1){
        isTarget = true;
        for(let j=0;j<len;j++){ if(!sameSeqItem(raw[i-len+1+j], target[j])){ isTarget=false; break; } }
      }
      return {val, isTarget, valid:i>=len-1};
    });
  }
  // Go/No-Go: isTarget qui significa "va data risposta" (stimolo go).
  // Lo stimolo no-go è il singolo elemento scelto in cfg.targetSeq[0].
  function buildGoNoGo(){
    const pool = POOLS[cfg.stimType];
    const nogo = cfg.targetSeq[0];
    const seq = [];
    for(let i=0;i<cfg.trials;i++){
      let val;
      if(Math.random() < cfg.targetRate){ val = nogo; }
      else { do{ val = pool[Math.floor(Math.random()*pool.length)]; } while(val===nogo && pool.length>1); }
      seq.push({val, isTarget: val!==nogo, valid:true});
    }
    return seq;
  }
  // Stop-Signal: le prove "go" sono target (va sempre data risposta); una
  // quota è designata come trial di stop (non-target, va inibita la
  // risposta), gestiti dinamicamente in sessione tramite lo staircase su
  // session.currentSSD.
  function buildStopSignal(){
    const pool = POOLS[cfg.stimType];
    const seq = [];
    for(let i=0;i<cfg.trials;i++){
      const val = pool[Math.floor(Math.random()*pool.length)];
      const isStopTrial = Math.random() < cfg.targetRate;
      seq.push({val, isTarget: !isStopTrial, isStopTrial, valid:true});
    }
    return seq;
  }
  // ANT semplificato: fattori allerta (cue presente/assente), orienting
  // (cue spaziale valido 80% / non valido 20%), conflitto (flanker
  // congruenti/incongruenti/neutri). Risposta = direzione della freccia
  // centrale, non "match" — non produce hit/FA in senso classico.
  // Materiali alternativi per l'ANT classico: la coppia designata sostituisce
  // sinistra/destra come identità del target — congruenza/neutralità restano
  // la stessa logica, solo con un altro alfabeto percettivo. Non è una leva
  // di difficoltà (non cambia quanto è arduo il compito) — cambia solo
  // quale materiale percettivo lo veicola, utile per varietà e per adattarsi
  // a profili diversi (es. evitare le frecce con difficoltà visuospaziali).
  const ANT_MATERIAL_TOKENS = { lettere:['H','S'], simboli:['●','■'] };
  function buildANT(){
    if(cfg.antMode==='tapat') return buildTAPAT();
    const seq = [];
    const cueTypes = ['none','center','spatial'];
    const congruencies = ['congruent','incongruent','neutral'];
    const material = cfg.antMaterial || 'frecce';
    const tokens = ANT_MATERIAL_TOKENS[material] || null;
    for(let i=0;i<cfg.trials;i++){
      const cueType = cueTypes[Math.floor(Math.random()*cueTypes.length)];
      const congruency = congruencies[Math.floor(Math.random()*congruencies.length)];
      const targetDir = Math.random()<0.5 ? 'left' : 'right';
      let side = Math.random()<0.5 ? 'left' : 'right';
      if(cueType==='spatial'){
        // cue valido nell'80% dei casi (indica il lato corretto)
        side = Math.random()<0.8 ? targetDir : (targetDir==='left'?'right':'left');
      } else {
        side = 'center';
      }
      seq.push({val:targetDir, cueType, congruency, side, targetDir, correctAnswer:targetDir, valid:true, material, tokens});
    }
    return seq;
  }
  // TAPAT (Tonic and Phasic Alertness Training), variante dell'ANT pensata
  // per il training più che per la misura fattoriale: niente flanker né
  // scelta di direzione, solo rilevamento semplice di un target unico.
  // Blocco tonico (prima metà): nessun cue, ISI lungo e variabile —
  // sostiene l'attenzione senza aiuti esterni. Blocco fasico (seconda
  // metà): ISI più breve e fisso, metà dei trial preceduti da un cue di
  // allerta — confronto RT con/senza cue, come nell'ANT classico.
  function buildTAPAT(){
    const seq = [];
    const half = Math.floor(cfg.trials/2);
    for(let i=0;i<cfg.trials;i++){
      const block = i<half ? 'tonic' : 'phasic';
      let cueType, isiOverride;
      if(block==='tonic'){
        cueType = 'none';
        isiOverride = 4000 + Math.random()*6000; // 4-10s, imprevedibile di proposito
      } else {
        cueType = Math.random()<0.5 ? 'none' : 'center';
        isiOverride = null; // usa l'ISI normale impostato in setup
      }
      seq.push({val:'target', cueType, congruency:'neutral', side:'center', targetDir:null, correctAnswer:'go', block, isiOverride, valid:true});
    }
    return seq;
  }
  // Task-switching: regola "parity" (pari/dispari) o "magnitude" (>5 / <5)
  // su numeri 1-9 esclus 5; cambia con probabilità cfg.targetRate.
  // Due regole binarie per ciascun materiale disponibile per il task-switching.
  // classify(item) -> true = risposta "a", false = risposta "b".
  const SWITCH_RULESETS = {
    numeri: {
      ruleA:{label:'Pari / Dispari', labelA:'Pari', labelB:'Dispari', classify:v=> parseInt(v,10)%2===0},
      ruleB:{label:'Alto (>5) / Basso (<5)', labelA:'Alto (>5)', labelB:'Basso (<5)', classify:v=> parseInt(v,10)>5}
    },
    lettere: {
      ruleA:{label:'Vocale / Consonante', labelA:'Vocale', labelB:'Consonante', classify:v=> 'AEIOU'.includes(v)},
      ruleB:{label:'A–M / N–Z', labelA:'A–M', labelB:'N–Z', classify:v=> v<='M'}
    },
    colori: {
      ruleA:{label:'Caldo / Freddo', labelA:'Caldo', labelB:'Freddo', classify:v=> ['Rosso','Giallo','Arancione','Magenta'].includes(v.icon)},
      ruleB:{label:'Primario / Non primario', labelA:'Primario', labelB:'Non primario', classify:v=> ['Rosso','Blu','Giallo'].includes(v.icon)}
    },
    simboli: {
      ruleA:{label:'Rotondo / Con angoli', labelA:'Rotondo', labelB:'Con angoli', classify:v=> ['●','⬤'].includes(v)},
      ruleB:{label:'Grande / Piccolo', labelA:'Grande', labelB:'Piccolo', classify:null} // gestito a parte: dimensione casuale ad ogni prova, non proprietà fissa del simbolo
    },
    // Modalità bivalente: a differenza degli altri materiali, qui le due
    // regole non sono due modi di guardare la STESSA proprietà (es. pari/
    // dispari vs alto/basso su un numero) — sono due dimensioni indipendenti
    // dello stesso stimolo (tipo di carattere e colore), assegnate a caso ad
    // ogni prova. Questo crea vera bivalenza in stile Stroop: su metà delle
    // prove le due dimensioni "concordano" (es. numero nero → risposta A sia
    // per tipo che per colore), sull'altra metà sono in conflitto (es.
    // numero rosso → tipo dice A, colore dice B) — la congruenza è marcata
    // per ogni prova indipendentemente da quale regola sia attiva in quel
    // momento, e alimenta un indice di conflitto calcolato allo stesso modo
    // di quello dell'ANT (RT incongruenti − RT congruenti).
    // Nota sull'etichetta "Bianco" invece di "Nero": lo schermo di sessione
    // ha sfondo scuro (--focus), quindi un vero nero sarebbe invisibile —
    // lo stimolo di quel colore viene reso in bianco (vedi renderStimulus).
    // L'etichetta deve corrispondere a quello che il paziente vede davvero,
    // non al nome interno della proprietà (colore:'nero' resta invariato
    // nei dati per compatibilità con le sessioni già registrate).
    bivalente: {
      ruleA:{label:'Numero / Lettera', labelA:'Numero', labelB:'Lettera', classify:v=> v.tipo==='numero'},
      ruleB:{label:'Bianco / Rosso', labelA:'Bianco', labelB:'Rosso', classify:v=> v.colore==='nero'}
    }
  };
  const SWITCH_BIVALENTE_NUM_POOL = ['1','2','3','4','6','7','8','9'];
  const SWITCH_BIVALENTE_LETTERE = ['B','D','F','G','H','J','K','L','M','P']; // consonanti: evita sovrapposizioni con eventuali altre regole vocale/consonante
  function buildSwitching(){
    const material = cfg.switchMaterial;
    const rs = SWITCH_RULESETS[material];
    const SWITCH_NUM_POOL = ['1','2','3','4','6','7','8','9']; // fisso: la regola >5/<5 richiede numeri a una cifra
    const pool = (material==='numeri') ? SWITCH_NUM_POOL : (material==='bivalente') ? null : POOLS[material];
    const seq = [];
    // Squilibrio tra le due regole: fissato all'inizio della sessione sul
    // livello raggiunto l'ultima volta (buildSwitching gira prima che la
    // sessione esista, quindi non può leggere un livello "in diretta" come
    // fa il CSI, che invece si aggiorna davvero prova per prova).
    const dominance = cfg.adaptive ? (ADAPT_SWITCH_BALANCE[cfg.adaptStartLevel]||0.5) : 0.5;
    let activeRule = Math.random()<0.5 ? 'A' : 'B';
    for(let i=0;i<cfg.trials;i++){
      const prevRule = activeRule;
      const wantsChange = i>0 && Math.random() < cfg.targetRate;
      if(wantsChange){
        activeRule = Math.random() < dominance ? 'A' : 'B';
      }
      const isSwitch = i>0 && activeRule !== prevRule;
      let item;
      if(material==='bivalente'){
        const isNumero = Math.random()<0.5;
        const valore = isNumero
          ? SWITCH_BIVALENTE_NUM_POOL[Math.floor(Math.random()*SWITCH_BIVALENTE_NUM_POOL.length)]
          : SWITCH_BIVALENTE_LETTERE[Math.floor(Math.random()*SWITCH_BIVALENTE_LETTERE.length)];
        item = {valore, tipo: isNumero?'numero':'lettera', colore: Math.random()<0.5?'nero':'rosso'};
      } else {
        item = pool[Math.floor(Math.random()*pool.length)];
      }
      const ruleDef = activeRule==='A' ? rs.ruleA : rs.ruleB;
      let correctAnswer, sizeVariant = null, congruency = null;
      if(material==='simboli' && activeRule==='B'){
        sizeVariant = Math.random()<0.5 ? 'grande' : 'piccolo';
        correctAnswer = sizeVariant==='grande' ? 'a' : 'b';
      } else {
        correctAnswer = ruleDef.classify(item) ? 'a' : 'b';
      }
      if(material==='bivalente'){
        const ansTipo = rs.ruleA.classify(item) ? 'a' : 'b';
        const ansColore = rs.ruleB.classify(item) ? 'a' : 'b';
        congruency = ansTipo===ansColore ? 'congruent' : 'incongruent';
      }
      seq.push({val:item, rule:activeRule, ruleDef, correctAnswer, sizeVariant, congruency, isSwitch, valid:true});
    }
    return seq;
  }
  // ---------- Categorizzazione condizionale ----------
  // Esercizio separato dal Task-switching: qui la regola resta fissa per
  // tutta la sessione (non si misura il costo di cambiare regola, ma il
  // carico di applicarne una di complessità crescente). 5 livelli fissi,
  // struttura confermata da Rodrigo — non adattivo (a differenza di
  // switching/nback/ecc.), il livello si sceglie a mano come per il
  // neglect a regola.
  // Livelli 2/3/5 condividono lo stesso item a due dimensioni indipendenti
  // (tipo: lettera/numero; colore: nero/rosso) usato dal bivalente dello
  // switching, ma con mappature diverse sulla risposta:
  //  - L2: doppia dimensione con no-go (3 risposte attive + un caso di non risposta)
  //  - L3: stessa doppia dimensione, ricombinata in una regola disgiuntiva a 2 risposte
  //  - L5: stessa doppia dimensione, mappatura diretta a 4 risposte (nessun no-go, nessuna disgiunzione)
  // I livelli 1/4 restano invece a singola dimensione (colore o simbolo,
  // scelta dall'operatore) — L4 aggiunge il confronto con lo stimolo
  // precedente (n-back sulla categoria, n=1 fisso).
  const CATEG_LETTERE = ['B','D','F','G','H','J','K','L','M','P']; // consonanti, come nel bivalente dello switching
  const CATEG_NUMERI = ['1','2','3','4','6','7','8','9'];
  function genCategItem(){
    const isLettera = Math.random()<0.5;
    const valore = isLettera
      ? CATEG_LETTERE[Math.floor(Math.random()*CATEG_LETTERE.length)]
      : CATEG_NUMERI[Math.floor(Math.random()*CATEG_NUMERI.length)];
    return { tipo: isLettera?'lettera':'numero', valore, colore: Math.random()<0.5?'nero':'rosso' };
  }
  function categL2Outcome(item){
    if(item.tipo==='lettera' && item.colore==='nero') return 'a';
    if(item.tipo==='lettera' && item.colore==='rosso') return 'nogo';
    if(item.tipo==='numero' && item.colore==='rosso') return 'b';
    return 'c'; // numero nero
  }
  function categL3Outcome(item){
    const isA = (item.tipo==='lettera' && item.colore==='nero') || (item.tipo==='numero' && item.colore==='rosso');
    return isA ? 'a' : 'b';
  }
  function categL5Outcome(item){
    if(item.tipo==='lettera') return item.colore==='nero' ? 'a' : 'l';
    return item.colore==='nero' ? 'z' : 'm';
  }
  function buildCategorizzazione(){
    const level = cfg.categLivello;
    const structure = categStructureOfLevel(level);
    const isiOverride = CATEG_ISI[level]; // undefined ai livelli 7-8 (banda lure): resta cfg.isi
    const seq = [];
    if(structure===1){
      const rs = SWITCH_RULESETS[cfg.categMateriale].ruleA;
      const pool = POOLS[cfg.categMateriale];
      for(let i=0;i<cfg.trials;i++){
        const val = pool[Math.floor(Math.random()*pool.length)];
        seq.push({val, correctAnswer: rs.classify(val)?'a':'b', valid:true, categMateriale:cfg.categMateriale, isiOverride});
      }
    } else if(structure===4){
      const rs = SWITCH_RULESETS[cfg.categMateriale].ruleA;
      const pool = POOLS[cfg.categMateriale];
      const lureFreq = CATEG_LURE[level]||0;
      function pickCategValue(wantCat){
        const want = wantCat==='a';
        const filtered = pool.filter(v=>rs.classify(v)===want);
        return filtered.length ? filtered[Math.floor(Math.random()*filtered.length)] : pool[Math.floor(Math.random()*pool.length)];
      }
      let prevCat = null, prevCat2 = null;
      for(let i=0;i<cfg.trials;i++){
        const valid = i>0;
        let val, cat, isLure=false;
        if(valid && i>=2 && prevCat2!=null && prevCat2!==prevCat && Math.random()<lureFreq){
          // trial lure: stessa categoria di 2 prove fa (non di 1) — "sembra"
          // familiare per prossimità recente ma la risposta corretta resta
          // "nogo", perché il confronto è sempre e solo con la prova
          // immediatamente precedente.
          cat = prevCat2;
          val = pickCategValue(cat);
          isLure = true;
        } else {
          val = pool[Math.floor(Math.random()*pool.length)];
          cat = rs.classify(val) ? 'a' : 'b';
        }
        const correctAnswer = (valid && cat===prevCat) ? 'match' : 'nogo';
        seq.push({val, correctAnswer, valid, categMateriale:cfg.categMateriale, isLure});
        prevCat2 = prevCat; prevCat = cat;
      }
    } else {
      for(let i=0;i<cfg.trials;i++){
        const item = genCategItem();
        const correctAnswer = structure===2 ? categL2Outcome(item) : structure===3 ? categL3Outcome(item) : categL5Outcome(item);
        seq.push({val:item, correctAnswer, valid:true, categBivalente:true, isiOverride});
      }
    }
    return seq;
  }
  // Doppio compito: canale visivo (lettere) + uditivo (toni), ciascuno con
  // regola 1-back indipendente, presentati simultaneamente.
  function buildDualTask(){
    const pairing = cfg.dualPairing || 'vis-aud';
    const pool1 = pairing==='aud-aud' ? POOLS.suoni : POOLS[cfg.dualVisual];
    const pool2 = pairing==='vis-vis' ? POOLS[cfg.dualVisual2] : pairing==='aud-aud' ? POOLS.suoni2 : POOLS.suoni;
    const seq = [];
    let prev1=null, prev2=null;
    for(let i=0;i<cfg.trials;i++){
      let v1 = pool1[Math.floor(Math.random()*pool1.length)];
      let v2 = pool2[Math.floor(Math.random()*pool2.length)];
      let t1 = i>0 && Math.random()<cfg.targetRate;
      let t2 = i>0 && Math.random()<cfg.targetRate;
      if(t1) v1 = prev1;
      if(t2) v2 = prev2;
      seq.push({val:v1, visualVal:v1, audioVal:v2, visualIsTarget: i>0?t1:false, audioIsTarget: i>0?t2:false, valid:i>0});
      prev1=v1; prev2=v2;
    }
    return seq;
  }
  // Generazione incrementale del doppio compito: necessaria per una vera
  // adattività indipendente sui due canali (ciascuno valutato sulla sua
  // accuratezza, non su una media che le confonderebbe).
  function genDualTaskTrial(){
    const pairing = cfg.dualPairing || 'vis-aud';
    const pool1 = pairing==='aud-aud' ? POOLS.suoni : POOLS[cfg.dualVisual];
    const pool2 = pairing==='vis-vis' ? POOLS[cfg.dualVisual2] : pairing==='aud-aud' ? POOLS.suoni2 : POOLS.suoni;
    const i = session.seq.length;
    const freq1 = cfg.adaptive ? (ADAPT_DUAL_FREQ[session.dualLevel1]||cfg.targetRate) : cfg.targetRate;
    const freq2 = cfg.adaptive ? (ADAPT_DUAL_FREQ[session.dualLevel2]||cfg.targetRate) : cfg.targetRate;
    const lure1 = ADAPT_DUAL_LURE[session.dualLevel1]||0;
    const lure2 = ADAPT_DUAL_LURE[session.dualLevel2]||0;
    let v1 = pool1[Math.floor(Math.random()*pool1.length)];
    let v2 = pool2[Math.floor(Math.random()*pool2.length)];
    let t1 = i>0 && Math.random()<freq1;
    let t2 = i>0 && Math.random()<freq2;
    let isLure1=false, isLure2=false;
    if(t1) v1 = session.prevDual1;
    else if(i>=2 && lure1>0 && Math.random()<lure1){
      const cand = session.seq[i-2].visualVal;
      if(cand!==session.prevDual1){ v1 = cand; isLure1 = true; }
    }
    if(t2) v2 = session.prevDual2;
    else if(i>=2 && lure2>0 && Math.random()<lure2){
      const cand = session.seq[i-2].audioVal;
      if(cand!==session.prevDual2){ v2 = cand; isLure2 = true; }
    }
    const trial = {val:v1, visualVal:v1, audioVal:v2, visualIsTarget: i>0?t1:false, audioIsTarget: i>0?t2:false, valid:i>0, visualIsLure:isLure1, audioIsLure:isLure2};
    session.seq.push(trial);
    session.prevDual1 = v1; session.prevDual2 = v2;
    return trial;
  }
  // seqLabel: estrae l'etichetta leggibile di un elemento di sequenza.
  // Nella Sequenza bersaglio mista, ogni elemento è {stimType, item} (serve
  // il tipo per sapere come renderizzarlo/riprodurlo) — qui viene "svolto"
  // in modo trasparente, così tutto il resto del codice (istruzioni,
  // anteprima, CSV) continua a funzionare senza saperlo.
  function seqLabel(v){
    if(v && typeof v==='object' && Object.prototype.hasOwnProperty.call(v,'stimType') && Object.prototype.hasOwnProperty.call(v,'item')) return seqLabel(v.item);
    return (v && typeof v==='object') ? v.icon : v;
  }
  function describeTargetSeq(){ return cfg.targetSeq.map(seqLabel).join(' → '); }

  /* ---------- scoring ---------- */
  function scoreFromCounts(c){
    const hitRate = c.targets>0 ? c.hits/c.targets : 0;
    const faRate = c.nonTargets>0 ? c.falseAlarms/c.nonTargets : 0;
    // log-linear correction for extreme rates (Hautus, 1995)
    const hr = (c.hits+0.5)/(c.targets+1);
    const fr = (c.falseAlarms+0.5)/(c.nonTargets+1);
    const z = p => -Math.sqrt(2)*erfinv(1-2*p);
    const dprime = c.targets>0 && c.nonTargets>0 ? (z(hr)-z(fr)) : null;
    const acc = (c.hits+c.correctRejections)/(c.targets+c.nonTargets || 1);
    return {hitRate, faRate, dprime, acc};
  }
  function erfinv(x){
    const a = 0.147;
    const ln = Math.log(1-x*x);
    const t1 = 2/(Math.PI*a)+ln/2;
    return Math.sign(x)*Math.sqrt(Math.sqrt(t1*t1-ln/a)-t1);
  }

  /* ---------- storage ---------- */
  // Storage: plain browser localStorage — works fully offline, no account,
  // no server. Data stays on this device/browser only.
  async function saveSession(rec){
    const key = 'traccian:sessione:'+rec.id;
    try{ localStorage.setItem(key, JSON.stringify(rec)); }
    catch(e){ console.error(e); alert('Impossibile salvare: memoria del browser piena o non disponibile.'); }
    historyCache = null;
    pushSession(rec); // fire-and-forget: la sessione è già al sicuro in locale comunque
  }
  async function loadHistory(){
    let local;
    try{
      local = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('traccian:sessione:')===0){
          try{ local.push(JSON.parse(localStorage.getItem(k))); }catch(e){}
        }
      }
    }catch(e){ local = []; }

    if(sb && cloudUser){
      const remote = await pullRemote();
      const map = {};
      local.forEach(r=> map[r.id]=r);
      remote.forEach(r=>{
        map[r.id]=r;
        try{ localStorage.setItem('traccian:sessione:'+r.id, JSON.stringify(r)); }catch(e){}
      });
      const merged = Object.values(map).sort((a,b)=> b.ts-a.ts);
      historyCache = merged;
      return merged;
    }
    if(historyCache) return historyCache;
    local.sort((a,b)=> b.ts - a.ts);
    historyCache = local;
    return local;
  }
  // ---------- Reliable Change Index (RCI) — solo per l'export operatore ----------
  // Stima ogni sessione rispetto alla BASELINE del singolo paziente su quello
  // stesso esercizio (le prime N sessioni disponibili), non contro un campione
  // normativo esterno (che non abbiamo). Valori di affidabilità test-retest
  // sono stime prudenti di default: se hai valori più precisi dalla letteratura
  // per un dato paradigma, si possono correggere qui.
  const RCI_BASELINE_N = 3; // numero di sessioni iniziali usate come baseline
  const RCI_RELIABILITY = {
    nback:0.75, sequenza:0.70, gonogo:0.70, stopsignal:0.75,
    ant:0.70, switching:0.70, dualtask:0.65, neglect:0.70
  };
  // Restituisce {value, higherIsBetter} — la metrica principale per la riga,
  // oppure null se quell'esercizio/famiglia non ha una metrica adatta.
  // Estrae un valore 0-1 assimilabile ad "accuratezza" dalla sessione appena
  // conclusa, da usare per rendere il progresso verso l'obiettivo più sfumato
  // (vedi computeLevelGoalProgress) — non per l'RCI, che ha la propria logica.
  function primaryAccuracyOf(rec){
    const family = rec.family || 'signal';
    if((family==='signal' || family==='dual') && rec.metrics && rec.metrics.acc!=null) return rec.metrics.acc;
    if(family==='choice' && rec.choice && rec.choice.total) return rec.choice.correct/rec.choice.total;
    if(family==='spatial' && rec.neglect && rec.neglect.pctLeft!=null && rec.neglect.pctRight!=null) return (rec.neglect.pctLeft+rec.neglect.pctRight)/2;
    return null;
  }
  function rciPrimaryMetric(r){
    const family = r.family || 'signal';
    if(r.taskMode==='stopsignal') return (r.ssrt!=null) ? {value:r.ssrt, higherIsBetter:false} : null;
    if(family==='signal'){
      if(r.metrics && r.metrics.dprime!=null) return {value:r.metrics.dprime, higherIsBetter:true};
      if(r.metrics && r.metrics.acc!=null) return {value:r.metrics.acc, higherIsBetter:true};
      return null;
    }
    if(family==='choice'){
      if(r.choice && r.choice.total) return {value:r.choice.correct/r.choice.total, higherIsBetter:true};
      return null;
    }
    if(family==='dual'){
      const vals = [];
      if(r.metrics && r.metrics.acc!=null) vals.push(r.metrics.acc);
      if(r.metricsAud && r.metricsAud.acc!=null) vals.push(r.metricsAud.acc);
      if(!vals.length) return null;
      return {value: vals.reduce((a,b)=>a+b,0)/vals.length, higherIsBetter:true};
    }
    if(family==='spatial'){
      if(r.neglect && r.neglect.asymmetry!=null) return {value:Math.abs(r.neglect.asymmetry), higherIsBetter:false};
      return null;
    }
    return null;
  }
  function mean(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
  function sd(arr){
    if(arr.length<2) return null;
    const m = mean(arr);
    return Math.sqrt(arr.reduce((s,v)=>s+(v-m)*(v-m),0)/(arr.length-1));
  }
  // items: elenco di sessioni di UN SOLO paziente (già filtrate da chi chiama).
  // Confronta la media delle prime sessioni (baseline) con la media delle
  // ultime sessioni disponibili al momento in cui lo generi — non sessione
  // per sessione: è pensato per essere lanciato quando si vuole valutare
  // l'esito di una fase di trattamento, non ad ogni singolo export.
  // Calcolo condiviso fra l'export CSV e il report stampabile: entrambi
  // devono mostrare esattamente le stesse righe con la stessa logica, quindi
  // il calcolo vive qui una sola volta.
  function computeRCIRows(items){
    const groups = {};
    items.forEach(r=>{
      const metric = rciPrimaryMetric(r);
      if(!metric) return;
      if(!groups[r.taskMode]) groups[r.taskMode] = [];
      groups[r.taskMode].push({r, metric});
    });
    const rows = [];
    Object.keys(groups).forEach(taskMode=>{
      const list = groups[taskMode];
      list.sort((a,b)=> a.r.ts - b.r.ts);
      const n = list.length;
      if(n < 4) return; // troppo poche sessioni per separare baseline e punto finale in modo sensato
      const half = Math.min(RCI_BASELINE_N, Math.floor(n/2));
      const baselineVals = list.slice(0, half).map(x=>x.metric.value);
      const finalVals = list.slice(n-half).map(x=>x.metric.value);
      const higherIsBetter = list[0].metric.higherIsBetter;
      const baselineMean = mean(baselineVals), finalMean = mean(finalVals);
      const baselineSD = sd(baselineVals);
      const reliability = RCI_RELIABILITY[taskMode] != null ? RCI_RELIABILITY[taskMode] : 0.70;
      if(!baselineSD) return;
      const seDiff = baselineSD * Math.sqrt(2*(1-reliability));
      if(!seDiff) return;
      let rci = (finalMean - baselineMean) / seDiff;
      if(!higherIsBetter) rci = -rci;
      const exLabel = EXERCISES[taskMode] ? EXERCISES[taskMode].label : taskMode;
      rows.push({exLabel, n, half, baselineMean, finalMean, rci, significativo: Math.abs(rci)>=1.96});
    });
    return rows;
  }
  function generateRCIReport(items, patientLabel){
    const rows = computeRCIRows(items);
    if(!rows.length){ alert('Non ci sono ancora abbastanza sessioni per un report RCI (servono almeno 4 sessioni sullo stesso esercizio).'); return; }
    const head = ['esercizio','sessioni_totali','sessioni_per_gruppo','media_baseline','media_finale','rci','cambiamento_significativo'];
    const csv = [head.join(';')].concat(rows.map(r=>[r.exLabel, r.n, r.half, r.baselineMean.toFixed(2), r.finalMean.toFixed(2), r.rci.toFixed(2), r.significativo?'Sì':'No'].join(';'))).join('\n');
    const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'traccian_rci_'+(patientLabel||'paziente').replace(/[^a-z0-9]/gi,'_')+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  // Report stampabile: stessa base dati del CSV, presentata come pagina HTML
  // formattata per la stampa/salvataggio in PDF (Ctrl/Cmd+P → "Salva come
  // PDF" — nessuna libreria PDF necessaria, coerente col vincolo "single

  // ---------- Motore generico "compito a obiettivi" ----------
  // Infrastruttura condivisa per pianificazione, multitasking (Six Elements /
  // Multiple Errands) e scenari ecologici (cucina, farmaci, spesa...) — tutti
  // condividono lo stesso schema sottostante: elenco di elementi da
  // completare, vincoli fra loro, un budget di tempo, regole il cui mancato
  // rispetto viene tracciato come "violazione" invece che come semplice
  // errore. Il paziente può sempre TENTARE qualsiasi elemento visibile (come
  // nel Six Elements/Multiple Errands reali): le regole non bloccano il
  // tocco, penalizzano come violazione — coerente con l'approccio già in uso
  // per le dipendenze. Fa eccezione la mutua esclusione (una scelta reale
  // rimuove l'alternativa, non è una "regola infranta") e gli elementi
  // nascosti (finestra oraria non ancora aperta, memoria prospettica non
  // ancora dovuta): quelli non sono nemmeno mostrati, si "materializzano"
  // quando è il momento.
  //
  // Forma di uno scenario:
  // { chiave, label, budgetSecondi: number|null, budgetErroriTollerati: number|null,
  //   regole: ['no_consecutivi_stessa_categoria', 'no_versioni_consecutive_stesso_gruppo', 'ingresso_unico_per_luogo', ...],
  //   distrattore: { alSec, finestraSec, item:{testo,categoria} } | null,
  //   items: [{ id, testo, categoria,
  //     vincoli:{ richiede:'altroId' },        // dipendenza sequenziale
  //     gruppo, versione,                       // per no_versioni_consecutive_stesso_gruppo (due metà dello stesso compito)
  //     luogo,                                  // per ingresso_unico_per_luogo (Multiple Errands: non rientrare due volte)
  //     finestra:{daSec,aSec},                  // finestra oraria: fuori da qui, violazione o perdita automatica
  //     escludeSe:'altroId',                    // mutua esclusione: completarlo rimuove l'altro dalla lista
  //     richiedeInfo:'chiave', fornisceInfo:'chiave', // integrazione informativa fra elementi
  //     prospettica:{dopoNAzioni, alSecondo}    // elemento nascosto finché non è "dovuto" (memoria prospettica)
  //   }] }
  const GOALTASK_SCENARIOS = {};

  function startGoalTask(scenario){
    return {
      scenario, startedAt: performance.now(), completati: [], violazioni: [],
      scartati: [], persi: [], infoRaccolte: {},
      distrattoreAttivo: null, distrattoreScadeAt: null, distrattoreGestito: false
    };
  }
  // Trova un elemento sia fra quelli dello scenario sia nel distrattore
  // eventualmente iniettato (che non fa parte di scenario.items).
  function goalTaskItemById(state, id){
    if(state.distrattoreAttivo && state.distrattoreAttivo.id===id) return state.distrattoreAttivo;
    return state.scenario.items.find(x=>x.id===id) || null;
  }
  function completeGoalTaskItem(state, itemId){
    const item = goalTaskItemById(state, itemId);
    if(!item || state.completati.includes(itemId) || state.scartati.includes(itemId) || state.persi.includes(itemId)) return state;
    const regole = state.scenario.regole || [];
    const ultimoId = state.completati.length ? state.completati[state.completati.length-1] : null;
    const ultimo = ultimoId ? goalTaskItemById(state, ultimoId) : null;
    if(item.vincoli && item.vincoli.richiede && !state.completati.includes(item.vincoli.richiede)){
      state.violazioni.push({itemId, tipo:'dipendenza_non_rispettata', ts:performance.now()});
    }
    if(regole.indexOf('no_consecutivi_stessa_categoria')!==-1 && ultimo && item.categoria && ultimo.categoria===item.categoria){
      state.violazioni.push({itemId, tipo:'due_consecutivi_stessa_categoria', ts:performance.now()});
    }
    // Six Elements originale: le due "metà" dello stesso compito non vanno
    // fatte una dopo l'altra — qui "gruppo" identifica la coppia (es. le due
    // storielle), non basta la categoria generica già usata sopra.
    if(regole.indexOf('no_versioni_consecutive_stesso_gruppo')!==-1 && ultimo && item.gruppo && ultimo.gruppo===item.gruppo){
      state.violazioni.push({itemId, tipo:'versioni_consecutive_stesso_gruppo', ts:performance.now()});
    }
    // Finestra oraria: se si tenta l'elemento fuori dall'intervallo previsto
    // (es. farmaco della sera preso di mattina), è una violazione — resta
    // comunque completabile, come nella vita reale si può sempre provare a
    // fare qualcosa fuori orario, solo che è sbagliato farlo.
    if(item.finestra){
      const elapsedSec = (performance.now()-state.startedAt)/1000;
      if(elapsedSec < item.finestra.daSec || elapsedSec > item.finestra.aSec){
        state.violazioni.push({itemId, tipo:'finestra_non_rispettata', ts:performance.now()});
      }
    }
    // Multiple Errands: non si rientra in un luogo già lasciato per un altro.
    if(regole.indexOf('ingresso_unico_per_luogo')!==-1 && item.luogo){
      const completatiConLuogo = state.completati.map(id=>goalTaskItemById(state,id)).filter(x=>x && x.luogo===item.luogo);
      if(completatiConLuogo.length){
        const idxUltimoStessoLuogo = state.completati.lastIndexOf(completatiConLuogo[completatiConLuogo.length-1].id);
        const cambiatoLuogoDopo = state.completati.slice(idxUltimoStessoLuogo+1).some(id=>{
          const it = goalTaskItemById(state,id); return it && it.luogo && it.luogo!==item.luogo;
        });
        if(cambiatoLuogoDopo) state.violazioni.push({itemId, tipo:'luogo_rivisitato', ts:performance.now()});
      }
    }
    // Integrazione informativa: usare un'informazione prima di averla raccolta.
    if(item.richiedeInfo && !state.infoRaccolte[item.richiedeInfo]){
      state.violazioni.push({itemId, tipo:'informazione_mancante', ts:performance.now()});
    }
    if(item.fornisceInfo) state.infoRaccolte[item.fornisceInfo] = true;
    // Se il distrattore appena iniettato viene gestito, disattivalo.
    if(state.distrattoreAttivo && state.distrattoreAttivo.id===itemId){
      state.distrattoreAttivo = null;
      state.distrattoreGestito = true;
    }
    // Mutua esclusione: una scelta reale, non una regola — l'alternativa
    // sparisce dalla lista invece di poter essere ancora completata.
    if(item.escludeSe && state.scartati.indexOf(item.escludeSe)===-1){
      state.scartati.push(item.escludeSe);
    }
    state.completati.push(itemId);
    return state;
  }
  // Elementi visibili in un dato istante: esclude scartati (mutua esclusione)
  // e persi (finestra oraria scaduta senza completarli), nasconde gli
  // elementi di memoria prospettica finché non sono "dovuti", e include il
  // distrattore iniettato se attivo in questo momento.
  function goalTaskVisibleItems(state){
    const elapsedSec = (performance.now()-state.startedAt)/1000;
    const base = state.scenario.items.filter(it=>{
      if(state.scartati.indexOf(it.id)!==-1 || state.persi.indexOf(it.id)!==-1) return false;
      if(it.prospettica){
        const dueByCount = it.prospettica.dopoNAzioni!=null ? state.completati.length >= it.prospettica.dopoNAzioni : true;
        const dueByTime = it.prospettica.alSecondo!=null ? elapsedSec >= it.prospettica.alSecondo : true;
        if(!(dueByCount && dueByTime)) return false;

      return true;

  // fa scadere le finestre orarie non rispettate e gestisce comparsa/scadenza
  // del distrattore. Ritorna lo stato per comodità di chiamata.
  function goalTaskTick(state){
    const elapsedSec = (performance.now()-state.startedAt)/1000;
    state.scenario.items.forEach(it=>{
      if(it.finestra && !state.completati.includes(it.id) && state.persi.indexOf(it.id)===-1 && state.scartati.indexOf(it.id)===-1){
        if(elapsedSec > it.finestra.aSec){
          state.persi.push(it.id);
          state.violazioni.push({itemId:it.id, tipo:'finestra_scaduta_senza_completare', ts:performance.now()});
        }
      }
    });
    const d = state.scenario.distrattore;
    if(d){
      if(!state.distrattoreAttivo && !state.distrattoreGestito && elapsedSec >= d.alSec){
        state.distrattoreAttivo = Object.assign({id:'distrattore', categoria:'distrattore'}, d.item);
        state.distrattoreScadeAt = elapsedSec + d.finestraSec;
      } else if(state.distrattoreAttivo && elapsedSec > state.distrattoreScadeAt){
        state.violazioni.push({itemId:state.distrattoreAttivo.id, tipo:'distrattore_non_gestito', ts:performance.now()});
        state.distrattoreAttivo = null;
        state.distrattoreGestito = true;
      }
    }
    return state;
  }
  function scoreGoalTask(state){
    const elapsedSec = (performance.now()-state.startedAt)/1000;
    const totaleElementi = state.scenario.items.length;
    const completatiCount = state.completati.length;
    const budgetRispettato = state.scenario.budgetSecondi ? elapsedSec<=state.scenario.budgetSecondi : true;
    const soglia = state.scenario.budgetErroriTollerati;
    const erroriEntroSoglia = soglia!=null ? state.violazioni.length<=soglia : true;
    return {
      completatiCount, totaleElementi,
      percentualeCompletamento: totaleElementi ? Math.round((completatiCount/totaleElementi)*100) : 0,
      violazioniCount: state.violazioni.length,
      tempoImpiegatoSec: Math.round(elapsedSec),
      budgetRispettato,
      sogliaErroriTollerati: soglia!=null ? soglia : null,
      erroriEntroSoglia
    };
  }

  const GOALTASK_BUDGET_FACTOR = {1:1.6, 2:1, 3:0.85, 4:0.70, 5:0.55};
  function goalTaskInstanceFor(chiave, livello){
    const base = GOALTASK_SCENARIOS[chiave];
    if(!base) return null;
    livello = Math.max(1, Math.min(5, livello||2));
    if(livello===1){
      const items = base.items.slice(0, Math.max(3, base.items.length-2));
      const budgetSecondi = base.budgetSecondi ? Math.round(base.budgetSecondi*GOALTASK_BUDGET_FACTOR[1]) : null;
      return {chiave, label:base.label, livello, budgetSecondi, budgetErroriTollerati:null, regole:[], distrattore:null, items};
    }
    if(livello===2){
      return {chiave, label:base.label, livello, budgetSecondi:base.budgetSecondi, budgetErroriTollerati:null, regole:base.regole||[], distrattore:null, items:base.items};
    }
    // livelli 3-5: applica cumulativamente gli step 0..(livello-3) di
    // GOALTASK_PROGRESSION — un livello 5 include sempre anche gli step
    // già introdotti ai livelli 3 e 4, non li sostituisce.
    let items = base.items.map(it=>Object.assign({}, it));
    let regole = (base.regole||[]).slice();
    let distrattore = null, budgetErroriTollerati = null, budgetSecondi = base.budgetSecondi;
    const steps = (GOALTASK_PROGRESSION[chiave] || []).slice(0, livello-2);
    steps.forEach(step=>{
      if(step.finestrePerItem) items = items.map(it=> step.finestrePerItem[it.id] ? Object.assign({}, it, {finestra:step.finestrePerItem[it.id]}) : it);
      if(step.luoghiPerItem) items = items.map(it=> step.luoghiPerItem[it.id] ? Object.assign({}, it, {luogo:step.luoghiPerItem[it.id]}) : it);
      if(step.infoPatch) items = items.map(it=> step.infoPatch[it.id] ? Object.assign({}, it, step.infoPatch[it.id]) : it);
      if(step.extraItems) items = items.concat(step.extraItems.map(it=>Object.assign({}, it)));
      if(step.mutex){
        items = items.map(it=>{
          const pair = step.mutex.find(p=>p.indexOf(it.id)!==-1);
          if(!pair) return it;
          const partner = pair[0]===it.id ? pair[1] : pair[0];
          return Object.assign({}, it, {escludeSe: partner});
        });
      }
      if(step.regoleComplete) regole = step.regoleComplete.slice();
      else if(step.regoleAdd) regole = regole.concat(step.regoleAdd);
      if(step.distrattore) distrattore = step.distrattore;
      if(step.budgetErroriTollerati!=null) budgetErroriTollerati = step.budgetErroriTollerati;
      if(step.budgetSecondiOverride!=null) budgetSecondi = step.budgetSecondiOverride;
    });
    if(!regole.length) regole = ['no_consecutivi_stessa_categoria'];
    if(budgetSecondi) budgetSecondi = Math.round(budgetSecondi*GOALTASK_BUDGET_FACTOR[livello]);
    return {chiave, label:base.label, livello, budgetSecondi, budgetErroriTollerati, regole, distrattore, items};
  }

  // 16 liste graduate per chunking. Parametri: lunghezza (4→14), presenza
  // di categorie semantiche raggruppabili (sì nei livelli bassi, assente
  // negli alti — è il meccanismo stesso del chunking), concretezza delle
  // parole (concrete→astratte, effetto Paivio), frequenza d'uso.
  // Livelli 1-2: forme parallele (3 ciascuno) a sotto-gruppi espliciti —
  // il numero di gruppi e la dimensione di ciascuno crescono insieme, non
  // solo la lunghezza totale (vedi CHUNKING_GROUP_PLAN più sotto per la
  // regola generale su tutti e 16 i livelli). I livelli 3-16 restano nella
  // forma "lista flat" storica finché non vengono anch'essi popolati con
  // gruppi reali — memoriaListaResolve() normalizza entrambe le forme.
  const MEMORIA_LISTE = [
    {livello:1, forme:[
      {gruppi:[{categoria:'frutta', parole:['mela','pera']}, {categoria:'animali', parole:['cane','gatto']}]},
