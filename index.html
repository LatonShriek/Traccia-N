  /* ---- Motore Compiti a obiettivi: elenco di elementi con vincoli/regole/
     budget, non un ciclo di prove sequenziali — vedi startGoalTask() e le
     funzioni collegate più in alto per la logica pura. ---- */
  function startGoalTaskSession(){
    const scenario = goalTaskInstanceFor(cfg.goaltaskScenario, cfg.goaltaskLivello);
    session = Object.assign(startGoalTask(scenario), {timer:null, paused:false, pausedAt:null, startedAtWall:Date.now()});
    view='task'; render();
    session.timer = setInterval(()=>{
      goalTaskTick(session);
      const elapsed = (performance.now()-session.startedAt)/1000;
      if(scenario.budgetSecondi && elapsed >= scenario.budgetSecondi){ clearInterval(session.timer); session.timer=null; finishGoalTaskSession(); return; }
      updateGoalTaskScreen();
    }, 1000);
  }
  function mountGoalTaskScreen(root){
    const infoSpan = el('div',{class:'info'},['']);
    root.appendChild(el('div',{class:'topbar'},[
      infoSpan,
      el('button',{onclick:()=>{ if(confirm('Interrompere il compito in corso?')){ if(session.timer) clearInterval(session.timer); view=homeView(); render(); } }},['Interrompi'])
    ]));
    const listWrap = el('div',{style:'padding:16px; max-width:640px; margin:0 auto; width:100%;'},[]);
    root.appendChild(listWrap);
    const finishBtn = el('button',{class:'primary', style:'display:block; margin:16px auto; max-width:640px; width:calc(100% - 32px);', onclick:()=>{ if(session.timer) clearInterval(session.timer); finishGoalTaskSession(); }},['Termina qui']);
    root.appendChild(finishBtn);
    return {infoSpan, listWrap, finishBtn};
  }
  function updateGoalTaskScreen(){
    const {infoSpan, listWrap} = taskDom;
    const sc = session.scenario;
    const elapsed = Math.round((performance.now()-session.startedAt)/1000);
    const budgetTxt = sc.budgetSecondi ? ' · tempo residuo '+Math.max(0, sc.budgetSecondi-elapsed)+'s' : '';
    const sogliaTxt = sc.budgetErroriTollerati!=null ? ' · errori tollerati '+session.violazioni.length+'/'+sc.budgetErroriTollerati : '';
    infoSpan.textContent = sc.label+' · livello '+sc.livello+' · '+session.completati.length+'/'+sc.items.length+' completati'+(session.violazioni.length?' · '+session.violazioni.length+' violazioni':'')+sogliaTxt+budgetTxt;
    listWrap.innerHTML = '';
    const visibili = goalTaskVisibleItems(session);
    visibili.forEach(item=>{
      const done = session.completati.indexOf(item.id)!==-1;
      const isDistrattore = item.id==='distrattore';
      const noteBits = [];
      if(item.vincoli && item.vincoli.richiede) noteBits.push('richiede: prima completa l\'elemento collegato');
      if(item.finestra) noteBits.push('finestra oraria: '+item.finestra.daSec+'–'+item.finestra.aSec+'s dall\'inizio');
      if(item.richiedeInfo) noteBits.push('richiede un\'informazione raccolta altrove');
      if(isDistrattore && session.distrattoreScadeAt!=null) noteBits.push('gestiscilo entro '+Math.max(0,Math.round(session.distrattoreScadeAt-elapsed))+'s');
      const row = el('div',{class:'histrow', style: (done?'opacity:.55;':'')+(isDistrattore?'border-left:3px solid var(--accent);':'')},[
        el('div',{style:'display:flex; gap:10px; align-items:flex-start;'},[
          el('div',{style:'font-size:22px; line-height:1.3;'},[goalTaskItemIcon(item)]),
          el('div',{},[
            el('div',{style: done?'text-decoration:line-through;':''},[item.testo]),
            ...noteBits.map(t=> el('div',{class:'l'},[t]))
          ])
        ]),
        done ? el('div',{style:'color:var(--signal); font-weight:600;'},['✓']) :
          el('button',{class:'ghost', onclick:()=>{ session = completeGoalTaskItem(session, item.id); updateGoalTaskScreen(); }},['Completa'])
      ]);
      listWrap.appendChild(row);
    });
    if(session.persi.length || session.scartati.length){
      const info = [];
      if(session.persi.length) info.push(session.persi.length+' elemento/i persi per finestra oraria scaduta');
      if(session.scartati.length) info.push(session.scartati.length+' elemento/i non più disponibili (scelta alternativa)');
      listWrap.appendChild(el('p',{class:'hint', style:'margin-top:10px;'},[info.join(' · ')]));
    }
  }
  function finishGoalTaskSession(){
    if(session.timer){ clearInterval(session.timer); session.timer=null; }
    completeAndSave(Date.now()-session.startedAtWall);
  }
  /* ---- Motore Strategie di memoria: fase di studio (testo o lista
     mostrati/letti) seguita da una fase di richiamo valutata dall'operatore
     su una checklist — non un ciclo di prove sequenziali. ---- */
  // Maschera progressiva per il vanishing cues: rivela le prime N lettere
  // (proporzionali a revealFraction), sostituisce il resto con "_" —
  // mantenendo gli spazi. Il cue "svanisce" da uno stadio forte a uno debole.
  function maskWord(str, revealFraction){
    const revealCount = Math.max(1, Math.ceil(str.length*revealFraction));
    return str.split('').map((ch,i)=> ch===' ' ? ' ' : (i<revealCount ? ch : '_')).join('');
  }
  // Spaced retrieval (errorless learning): parametri del protocollo.
  // Intervallo iniziale breve, raddoppia ad ogni richiamo riuscito; un
  // elemento si considera consolidato dopo un numero di successi consecutivi
  // o al superamento di un intervallo massimo — soglie provvisorie, non
  // normative, pensate per stare dentro una seduta clinica.
  const ERRORLESS_START_INTERVAL = 5;
  const ERRORLESS_MAX_CONSECUTIVE = 4;
  const ERRORLESS_MAX_INTERVAL = 60;
  function startMemoriaSession(){
    const material = memoriaMaterialFor(cfg);
    session = {
      material, phase:'studio', pqrstStep:0, pqrstSection:0, recall:{}, startedAtWall:Date.now(),
      lociIdx:0, lociReadDone:false, vanishingIdx:0, vanishingStage:0,
      errIdx:0, errStage:'study', errInterval:ERRORLESS_START_INTERVAL, errLastGood:ERRORLESS_START_INTERVAL,
      errConsecutive:0, errRemaining:0, errTimer:null
    };
    view='task'; render();
  }
  function clearErrorlessTimer(){
    if(session && session.errTimer){ clearInterval(session.errTimer); session.errTimer=null; }
  }
  function mountMemoriaScreen(root){
    const infoSpan = el('div',{class:'info'},['']);
    root.appendChild(el('div',{class:'topbar'},[
      infoSpan,
      el('button',{onclick:()=>{ if(confirm('Interrompere la sessione in corso?')){ clearErrorlessTimer(); view=homeView(); render(); } }},['Interrompi'])
    ]));
    const content = el('div',{style:'padding:16px; max-width:640px; margin:0 auto; width:100%;'},[]);
    root.appendChild(content);
    return {infoSpan, content};
  }
  const MEMORIA_MODO_LABELS = {pqrst:'PQRST', chunking:'chunking', loci:'metodo dei loci', errorless:'errorless learning', vanishing:'vanishing cues'};
  const CHUNKING_METODI_LABELS = {categoria:'Categorizzazione semantica', acronimo:'Acronimo/acrostico', narrazione:'Narrazione/concatenamento', immagine:'Immagine associativa', personale:'Personale (nota libera)'};
  // Un box di suggerimento per metodo attivo — generico per i metodi
  // generativi (acronimo/narrazione/immagine): non c'è contenuto scriptato
  // da mostrare, solo l'istruzione della tecnica, applicata insieme
  // dall'operatore e dal paziente sulla lista mostrata sopra.
  function chunkingStratBox(metodo, m, cfg){
    if(metodo==='categoria'){
      if(m.gruppi) return {titolo:'Suggerimento — più gruppi da ricordare', testo:'Le parole sono già divise in '+m.gruppi.length+' gruppi ('+m.gruppi.map(g=>g.categoria).join(', ')+'): ricorda un gruppo alla volta, non '+m.parole.length+' parole slegate.'};
      if(m.categorizzata) return {titolo:'Suggerimento — chunking per categoria', testo:'Queste parole appartengono tutte alla categoria "'+m.categoria+'": raggruppale mentalmente in un unico blocco invece di ricordarle una per una — ricorda "un gruppo di '+m.categoria+'", non '+m.parole.length+' parole slegate.'};
      return {titolo:'Suggerimento — costruisci tu il raggruppamento', testo:'Queste parole non condividono una categoria ovvia: prova a creare tu piccoli gruppi (2-3 parole) legandole con un\'immagine mentale o una breve storia che le colleghi, invece di ripeterle in ordine.'};
    }
    if(metodo==='acronimo') return {titolo:'Suggerimento — acronimo/acrostico', testo:'Le iniziali sono evidenziate qui sopra: costruite insieme una parola o una breve frase che le usi tutte, in ordine, come aggancio per richiamare l\'intera lista.'};
    if(metodo==='narrazione') return {titolo:'Suggerimento — narrazione/concatenamento', testo:'Costruite insieme una breve storia che colleghi le parole in sequenza, una che porta alla successiva — più è vivida o assurda, meglio si ricorda.'};
    if(metodo==='immagine') return {titolo:'Suggerimento — immagine associativa', testo:'Per ogni parola (o per coppie consecutive), crea un\'immagine mentale vivida che la colleghi alla successiva — nessun percorso fisso, solo l\'associazione tra le immagini.'};
    if(metodo==='personale') return {titolo:'Tecnica personale', testo: cfg.chunkingNota && cfg.chunkingNota.trim() ? cfg.chunkingNota : '(nessuna nota inserita dall\'operatore per questo paziente)'};
    return null;
  }
  // Evidenzia la prima lettera di ogni parola, in maiuscolo — usata solo
  // quando il metodo 'acronimo' è tra quelli attivi, per rendere visibili
  // le iniziali su cui costruire l'acronimo/acrostico.
  function wordsWithInitialsHighlighted(parole){
    return el('div',{},parole.map((w,i)=>{
      const span = el('span',{},[
        el('span',{style:'font-weight:800; text-decoration:underline; color:var(--signal);'},[w.charAt(0).toUpperCase()]),
        w.slice(1)
      ]);
      return i<parole.length-1 ? el('span',{},[span, '  ·  ']) : span;
    }));
  }
  function updateMemoriaScreen(){
    const {infoSpan, content} = taskDom;
    const m = session.material;
    const modo = cfg.memoriaModo;
    const materiale = memoriaEffectiveMateriale(cfg);
    const learnItems = memoriaLearnItems(cfg, m);
    content.innerHTML = '';
    if(session.phase==='studio'){
      infoSpan.textContent = 'Livello '+m.livello+' · '+MEMORIA_MODO_LABELS[modo]+' · fase di studio';
      if(modo==='chunking'){
        const metodi = (cfg.chunkingMetodi && cfg.chunkingMetodi.length) ? cfg.chunkingMetodi : ['categoria'];
        if(m.gruppi){
          // Gruppi visibili (livello <= soglia): un blocco per categoria,
          // con l'etichetta — rende esplicita la struttura da usare come
          // aggancio, invece di un'unica lista indifferenziata.
          const groupsWrap = el('div',{style:'display:flex; flex-direction:column; gap:10px;'});
          m.gruppi.forEach(g=>{
            const box = el('div',{style:'background:var(--paper-dim); border-radius:12px; padding:14px 18px;'});
            box.appendChild(el('div',{style:'font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:4px;'},[g.categoria]));
            box.appendChild(el('div',{style:'font-size:20px; line-height:1.6;'},[
              metodi.includes('acronimo') ? wordsWithInitialsHighlighted(g.parole) : g.parole.join('  ·  ')
            ]));
            groupsWrap.appendChild(box);
          });
          content.appendChild(groupsWrap);
        } else if(metodi.includes('acronimo')){
          content.appendChild(el('div',{style:'font-size:22px; line-height:1.8; text-align:center; padding:24px; background:var(--paper-dim); border-radius:12px;'},[wordsWithInitialsHighlighted(m.parole)]));
        } else {
          content.appendChild(el('div',{style:'font-size:22px; line-height:1.8; text-align:center; padding:24px; background:var(--paper-dim); border-radius:12px;'},[m.parole.join('  ·  ')]));
        }
        metodi.forEach(metodo=>{
          const box = chunkingStratBox(metodo, m, cfg);
          if(!box) return;
          const stratBox = el('div',{style:'background:var(--paper-dim2, var(--paper-dim)); border-left:3px solid var(--signal); border-radius:8px; padding:12px 16px; margin-top:14px; font-size:14px; line-height:1.5;'});
          stratBox.appendChild(el('div',{style:'font-weight:600; margin-bottom:4px;'},[box.titolo]));
          stratBox.appendChild(el('div',{},[box.testo]));
          content.appendChild(stratBox);
        });
        content.appendChild(speakControls(()=>m.parole.join(', ')));
        content.appendChild(el('button',{class:'primary', style:'margin-top:18px;', onclick:()=>{
          try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
          session.phase='richiamo'; updateMemoriaScreen();
        }},['Pronto — passa al richiamo →']));
      } else if(modo==='pqrst'){
        // PQRST vero, per sezione: quattro passaggi guidati (Preview,
        // Question, Read, State) ripetuti su ciascuna sezione del brano
        // (~2 unità concettuali ciascuna), prima di passare alla sezione
        // successiva; solo dopo l'ultima sezione si passa al richiamo, che
        // fa da Test cumulativo su tutte le sezioni insieme — è lo schema
        // di riferimento in letteratura (P-Q-R-S per sezione, T finale),
        // non un unico ciclo sull'intero brano. m.sezioni ha sempre almeno
        // un elemento (i brani storici a blocco unico sono normalizzati a
        // una sola sezione), quindi questo codice serve entrambi i casi.
        const steps = ['preview','question','read','state'];
        const stepIdx = session.pqrstStep || 0;
        const stepKey = steps[stepIdx];
        const secIdx = session.pqrstSection || 0;
        const nSec = m.sezioni.length;
        const sez = m.sezioni[secIdx];
        const isLastSection = secIdx >= nSec-1;
        const stepLabels = {preview:'Anteprima (P)', question:'Domanda (Q)', read:'Lettura (R)', state:'Ripeti a te stesso (S)'};
        const secLabel = nSec>1 ? ' · sezione '+(secIdx+1)+'/'+nSec : '';
        content.appendChild(el('div',{style:'font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:8px;'},[(stepIdx+1)+'/4 — '+stepLabels[stepKey]+secLabel]));
        function goStep(next){ session.pqrstStep=next; updateMemoriaScreen(); }
        function goNextSectionOrRichiamo(){
          if(isLastSection){
            try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
            session.phase='richiamo'; updateMemoriaScreen();
          } else {
            session.pqrstSection = secIdx+1; session.pqrstStep = 0; updateMemoriaScreen();
          }
        }
        if(stepKey==='preview'){
          content.appendChild(el('h3',{},[nSec>1 ? m.titolo+' — parte '+(secIdx+1) : m.titolo]));
          content.appendChild(el('p',{class:'hint'},['Prima di leggere questa parte: cosa pensi che racconterà?']));
          content.appendChild(el('button',{class:'primary', style:'margin-top:12px;', onclick:()=>goStep(1)},['Avanti — formulati una domanda →']));
        } else if(stepKey==='question'){
          content.appendChild(el('h3',{},[nSec>1 ? m.titolo+' — parte '+(secIdx+1) : m.titolo]));
          content.appendChild(el('p',{class:'hint'},['Prima di leggere, formulati una domanda a cui questa parte dovrebbe rispondere (es. "chi fa cosa, dove, perché"). Non serve scriverla — basta pensarla.']));
          content.appendChild(el('button',{class:'primary', style:'margin-top:12px;', onclick:()=>goStep(2)},['Avanti — leggi →']));
        } else if(stepKey==='read'){
          content.appendChild(el('h3',{},[nSec>1 ? m.titolo+' — parte '+(secIdx+1) : m.titolo]));
          content.appendChild(el('p',{style:'font-size:17px; line-height:1.7; background:var(--paper-dim); border-radius:12px; padding:16px 18px;'},[sez.testo]));
          content.appendChild(speakControls(()=>sez.testo));
          content.appendChild(el('button',{class:'primary', style:'margin-top:12px;', onclick:()=>goStep(3)},['Avanti — ripeti a te stesso →']));
        } else {
          content.appendChild(el('p',{class:'hint'},['Senza guardare più il testo, ripeti a te stesso (a voce bassa o mentalmente) i punti principali di questa parte, con parole tue. Quando ti senti pronto, passa alla '+(isLastSection?'verifica finale':'parte successiva')+'.']));
          content.appendChild(el('button',{class:'ghost', onclick:()=>goStep(2)},['← Rileggi questa parte']));
          content.appendChild(el('button',{class:'primary', style:'margin-top:12px;', onclick:goNextSectionOrRichiamo},
            [isLastSection ? 'Pronto — passa al richiamo (Verifica) →' : 'Pronto — passa alla parte successiva →']));
        }
      } else if(modo==='loci'){
        // Metodo dei loci: se il materiale è un brano, prima lettura unica
        // del testo, poi si posiziona un'idea per tappa; se è una lista, si
        // parte direttamente dal percorso, una parola per tappa.
        const isBrano = materiale==='brano';
        if(isBrano && !session.lociReadDone){
          content.appendChild(el('h3',{},[m.titolo]));
          content.appendChild(el('p',{style:'font-size:17px; line-height:1.7; background:var(--paper-dim); border-radius:12px; padding:16px 18px;'},[m.testo]));
          content.appendChild(el('p',{class:'hint'},['Leggi il brano una volta. Poi percorrerai un tragitto mentale, posizionando ogni idea principale in una tappa.']));
          content.appendChild(el('button',{class:'primary', style:'margin-top:12px;', onclick:()=>{ session.lociReadDone=true; updateMemoriaScreen(); }},['Ho letto — inizia il percorso →']));
        } else {
          const idx = session.lociIdx||0;
          const route = lociRouteFor(cfg);
          const locus = route[idx % route.length];
          const item = learnItems[idx];
          const isLast = idx>=learnItems.length-1;
          content.appendChild(el('div',{style:'font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:8px;'},['Tappa '+(idx+1)+' / '+learnItems.length]));
          content.appendChild(el('div',{style:'background:var(--paper-dim); border-radius:12px; padding:20px; text-align:center;'},[
            el('div',{style:'font-size:13px; color:var(--ink-soft); margin-bottom:6px;'},['Tappa del percorso:']),
            el('div',{style:'font-weight:600; font-size:17px; margin-bottom:14px;'},[locus]),
            el('div',{style:'font-size:13px; color:var(--ink-soft); margin-bottom:6px;'},['Immagina qui, il più vividamente possibile:']),
            el('div',{style:'font-size:20px; font-weight:700;'},[item])
          ]));
          content.appendChild(el('button',{class:'primary', style:'margin-top:18px;', onclick:()=>{
            if(isLast){ session.phase='richiamo'; } else { session.lociIdx=idx+1; }
            updateMemoriaScreen();
          }},[isLast ? 'Ho posizionato tutto — ripercorri il tragitto, poi passa al richiamo →' : 'Avanti — prossima tappa →']));
        }
      } else if(modo==='errorless'){
        // Apprendimento senza errori con spaced retrieval: l'elemento viene
        // presentato direttamente (mai indovinato), poi richiamato a
        // intervalli crescenti. Successo -> l'intervallo raddoppia; fallimento
        // -> risposta corretta ridata subito e si torna all'ultimo intervallo
        // riuscito, mai un tentativo libero senza rete.
        const idx = session.errIdx||0;
        const stage = session.errStage||'study';
        const item = learnItems[idx];
        const progressLabel = el('div',{style:'font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:8px;'},
          ['Elemento '+(idx+1)+' / '+learnItems.length]);
        content.appendChild(progressLabel);
        if(stage==='study'){
          content.appendChild(el('p',{class:'hint'},[session.errConsecutive===0 && session.errInterval===ERRORLESS_START_INTERVAL ? 'Osserva con attenzione: non c\'è bisogno di indovinare.' : 'Ecco di nuovo la risposta corretta — nessun tentativo libero, si riparte da qui.']));
          content.appendChild(el('div',{style:'font-size:22px; font-weight:700; text-align:center; padding:24px; background:var(--paper-dim); border-radius:12px;'},[item]));
          content.appendChild(el('button',{class:'primary', style:'margin-top:18px;', onclick:()=>{
            clearErrorlessTimer();
            session.errStage='wait'; session.errRemaining=session.errInterval;
            updateMemoriaScreen();
            session.errTimer = setInterval(()=>{
              session.errRemaining--;
              if(session.errRemaining<=0){
                clearErrorlessTimer();
                session.errStage='test';
                updateMemoriaScreen();
              } else {
                updateMemoriaScreen();
              }
            },1000);
          }},['Ho visto — avvia il richiamo (tra '+session.errInterval+' s) →']));
        } else if(stage==='wait'){
          content.appendChild(el('p',{class:'hint'},['Tra poco l\'operatore chiederà al paziente di richiamare questo elemento. Non mostrarlo nel frattempo.']));
          content.appendChild(el('div',{style:'font-size:40px; font-weight:700; text-align:center; padding:30px;'},[String(session.errRemaining)+' s']));
        } else {
          const revealBox = el('div',{style:'min-height:22px; text-align:center; font-weight:600; margin-bottom:10px;'},['']);
          content.appendChild(el('p',{class:'hint'},['Chiedi al paziente di richiamare a voce questo elemento.']));
          content.appendChild(el('button',{class:'ghost', onclick:()=>{ revealBox.textContent = 'Risposta: '+item; }},['Mostra la risposta (operatore)']));
          content.appendChild(revealBox);
          const row = el('div',{class:'rowbtns', style:'margin-top:14px;'});
          row.appendChild(el('button',{class:'primary', onclick:()=>{
            session.errLastGood = session.errInterval;
            session.errConsecutive = (session.errConsecutive||0)+1;
            if(session.errConsecutive>=ERRORLESS_MAX_CONSECUTIVE || session.errInterval*2>ERRORLESS_MAX_INTERVAL){
              if(idx>=learnItems.length-1){ session.phase='richiamo'; }
              else { session.errIdx=idx+1; session.errStage='study'; session.errInterval=ERRORLESS_START_INTERVAL; session.errLastGood=ERRORLESS_START_INTERVAL; session.errConsecutive=0; }
            } else {
              session.errInterval = session.errInterval*2; session.errStage='wait';
            }
            updateMemoriaScreen();
          }},['✓ Corretto']));
          row.appendChild(el('button',{onclick:()=>{
            session.errInterval = session.errLastGood; session.errConsecutive = 0; session.errStage='study';
            updateMemoriaScreen();
          }},['✗ Scorretto']));
          content.appendChild(row);
        }
      } else if(modo==='vanishing'){
        // Vanishing cues: due stadi con suggerimento via via più debole per
        // ciascun elemento (le lettere iniziali che restano visibili
        // diminuiscono), poi il richiamo finale è già lo stadio a cue zero.
        const idx = session.vanishingIdx||0;
        const stage = session.vanishingStage||0;
        const item = learnItems[idx];
        const fraction = stage===0 ? 0.65 : 0.25;
        const isLastItem = idx>=learnItems.length-1;
        content.appendChild(el('div',{style:'font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:8px;'},['Elemento '+(idx+1)+' / '+learnItems.length+' · '+(stage===0?'suggerimento forte':'suggerimento debole')]));
        content.appendChild(el('div',{style:'font-size:26px; font-weight:700; letter-spacing:.06em; text-align:center; padding:24px; background:var(--paper-dim); border-radius:12px; font-family:monospace;'},[maskWord(item, fraction)]));
        content.appendChild(el('p',{class:'hint'},['Prova a completare tu, ad alta voce, prima di vedere la risposta.']));
        const reveal = el('div',{style:'font-weight:600; min-height:22px; text-align:center; margin-top:6px;'},['']);
        content.appendChild(reveal);
        const rowbtns = el('div',{class:'rowbtns'});
        rowbtns.appendChild(el('button',{class:'ghost', onclick:()=>{ reveal.textContent = 'Risposta: '+item; }},['Mostra la risposta']));
        content.appendChild(rowbtns);
        content.appendChild(el('button',{class:'primary', style:'margin-top:18px;', onclick:()=>{
          if(stage===0){ session.vanishingStage=1; }
          else if(isLastItem){ session.phase='richiamo'; }
          else { session.vanishingIdx=idx+1; session.vanishingStage=0; }
          updateMemoriaScreen();
        }},[stage===0 ? 'Avanti — suggerimento più debole →' : (isLastItem ? 'Pronto — passa al richiamo →' : 'Avanti — prossimo elemento →')]));
      }
    } else {
      infoSpan.textContent = 'Livello '+m.livello+' · '+MEMORIA_MODO_LABELS[modo]+' · richiamo (segna l\'operatore)';
      content.appendChild(el('p',{class:'hint'},['Il paziente richiama a voce quello che ricorda. Spunta qui sotto ciò che ha effettivamente recuperato — non deve usare le stesse parole esatte, basta il concetto.']));
      const items = learnItems.map((w,i)=>({id:String(i), label:w}));
      items.forEach(it=>{
        const checked = !!session.recall[it.id];
        const row = el('div',{class:'histrow', style:'cursor:pointer;', onclick:()=>{ session.recall[it.id] = !session.recall[it.id]; updateMemoriaScreen(); }},[
          el('div',{},[it.label]),
          el('div',{style:'color:'+(checked?'var(--signal)':'var(--ink-soft)')+'; font-weight:600;'},[checked?'✓ recuperato':'○ non recuperato'])
        ]);
        content.appendChild(row);
      });
      content.appendChild(el('button',{class:'primary', style:'margin-top:18px;', onclick:()=> finishMemoriaSession()},['Termina e salva']));
    }
  }
  function finishMemoriaSession(){
    completeAndSave(Date.now()-session.startedAtWall);
  }
  // ---------- Indicatore di calo prestazionale intra-sessione (fatica) ----------
  // Puramente informativo per l'operatore: confronta l'accuratezza sul primo
  // terzo delle prove valide con quella sull'ultimo terzo. NON modifica in
  // alcun modo la difficoltà né chiude la sessione in automatico — è solo un
  // avviso in coda ai risultati. La soglia sotto è un parametro provvisorio
  // (non derivato da letteratura come le soglie Wilson et al. 2019 usate per
  // l'adattività): va validata/tarata nell'uso clinico reale, non è definitiva.
  const FATIGUE_DROP_THRESHOLD = 0.15; // 15 punti percentuali di calo accuratezza primo→ultimo terzo
  const FATIGUE_MIN_TRIALS = 9; // sotto questa soglia lo split in terzi non è abbastanza informativo
  function computeFatigueNote(boolArray){
    const n = boolArray.length;
    if(n < FATIGUE_MIN_TRIALS) return null;
    const third = Math.floor(n/3);
    const first = boolArray.slice(0, third);
    const last = boolArray.slice(n-third);
    const accFirst = first.filter(Boolean).length/first.length;
    const accLast = last.filter(Boolean).length/last.length;
    const drop = accFirst - accLast;
    return {accFirst, accLast, drop, flag: drop >= FATIGUE_DROP_THRESHOLD};
  }
  function rtMeanOf(items){
    const v = items.filter(x=>x!=null);
    return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
  }
  async function completeAndSave(durationMs){
    const family = EXERCISES[cfg.taskMode].family;
    const rec = {
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      ts: Date.now(), dateLabel: todayStr(),
      stimType: cfg.stimType, nLevel: cfg.nLevel, trials: cfg.trials, isi: cfg.isi, stimDuration: cfg.stimDuration,
      // titrationMode/targetRate: servono al controllo di comparabilità
      // dell'RCI (vedi sessionMismatchWarnings) — prima non venivano
      // registrati per sessione, solo nell'ultima configurazione raggiunta,
      // quindi l'RCI non poteva sapere con cosa erano state generate le
      // sessioni che stava confrontando.
      titrationMode: hasTitrationMode(cfg.taskMode) ? (cfg.titrationMode||'manuale') : null,
      targetRate: cfg.targetRate,
      respMode: cfg.respMode, patientCode: cfg.patientCode, notes: cfg.notes,
      taskMode: cfg.taskMode, targetSeq: EXERCISES[cfg.taskMode].usesTargetSeq ? cfg.targetSeq.map(seqLabel) : null,
      sequenzaMista: (cfg.taskMode==='sequenza' && cfg.sequenzaMista && cfg.sequenzaMista!=='no') ? cfg.sequenzaMista : null,
      antMode: cfg.taskMode==='ant' ? cfg.antMode : null,
      tapatModalita: (cfg.taskMode==='ant' && cfg.antMode==='tapat') ? cfg.tapatModalita : null,
      // Livello raggiunto a fine sessione, in un unico campo generico —
      // prima esisteva solo per l'N-back (finalNLevel sotto): senza
      // questo, lo storico non poteva mostrare il livello per nessun
      // altro esercizio, perché il dato non veniva proprio registrato.
      finalLevel: (()=>{
        if(cfg.taskMode==='nback') return session.liveNLevel;
        if(cfg.taskMode==='categorizzazione') return session.categLevel;
        if(cfg.taskMode==='ant' && cfg.antMode==='tapat') return session.tapatLevel;
        if(cfg.taskMode==='neglect') return session.liveBoardLevel;
        if(cfg.taskMode==='dualtask') return session.dualLevel1+'/'+session.dualLevel2;
        if(cfg.taskMode==='goaltask') return cfg.goaltaskLivello;
        if(cfg.taskMode==='memoria') return session.material ? session.material.livello : null;
        if(adaptLevelKey()==='adaptLevel') return session.adaptLevel;
        return null;
      })(),
      localPatientId: patientProfile ? null : (activeLocalPatientId || null),
      pazienteId: (!patientProfile && activeRemotePatientId) ? activeRemotePatientId : null,
      durationMs, family
    };
    if(family==='signal'){
      const avgRT = rtMeanOf(session.rts);
      rec.counts = session.counts; rec.metrics = scoreFromCounts(session.counts); rec.avgRT = avgRT;
      rec.fatigueNote = computeFatigueNote(session.fatigueLog);
      if(cfg.taskMode==='stopsignal' && session.ssdHistory.length){
        const meanSSD = rtMeanOf(session.ssdHistory);
        rec.meanSSD = meanSSD;
        rec.ssrt = (avgRT!=null && meanSSD!=null) ? Math.max(0, avgRT-meanSSD) : null;
      }
      if(cfg.taskMode==='stopsignal' && session.discrimLog.length){
        rec.goAccuracy = session.discrimLog.filter(Boolean).length / session.discrimLog.length;
      }
      if(cfg.taskMode==='nback'){
        rec.finalNLevel = session.liveNLevel;
        rec.adaptive = cfg.adaptive;
        rec.levelChanges = session.levelChanges.length ? session.levelChanges : null;
      }
    } else if(family==='choice'){
      const log = session.choiceLog;
      const total = log.length, correct = log.filter(x=>x.correct).length, omitted = log.filter(x=>x.omitted).length;
      rec.choice = { total, correct, omitted, accuracy: total? correct/total : null, meanRT: rtMeanOf(log.map(x=>x.rt)) };
      rec.fatigueNote = computeFatigueNote(log.map(x=> x.correct && !x.omitted));
      if(cfg.taskMode==='ant'){
        const rtBy = (key,val)=> rtMeanOf(log.filter(x=>x[key]===val && x.correct).map(x=>x.rt));
        const noneRT=rtBy('cueType','none'), centerRT=rtBy('cueType','center'), spatialRT=rtBy('cueType','spatial');
        const congRT=rtBy('congruency','congruent'), incongRT=rtBy('congruency','incongruent');
        rec.choice.alerting = (noneRT!=null && centerRT!=null) ? Math.round(noneRT-centerRT) : null;
        rec.choice.orienting = (centerRT!=null && spatialRT!=null) ? Math.round(centerRT-spatialRT) : null;
        rec.choice.conflict = (congRT!=null && incongRT!=null) ? Math.round(incongRT-congRT) : null;
        if(cfg.antMode==='tapat'){
          const tonicTrials = log.filter(x=>x.block==='tonic');
          const phasicTrials = log.filter(x=>x.block==='phasic');
          rec.choice.tonicMeanRT = rtMeanOf(tonicTrials.filter(x=>x.correct).map(x=>x.rt));
          rec.choice.tonicOmissions = tonicTrials.filter(x=>x.omitted).length;
          rec.choice.tonicTotal = tonicTrials.length;
          rec.choice.phasicMeanRT = rtMeanOf(phasicTrials.filter(x=>x.correct).map(x=>x.rt));
          rec.choice.finalTapatLevel = session.tapatLevel;
          rec.choice.adaptive = cfg.adaptive;
        }
      }
      if(cfg.taskMode==='switching'){
        const swRT = rtMeanOf(log.filter(x=>x.isSwitch && x.correct).map(x=>x.rt));
        const repRT = rtMeanOf(log.filter(x=>!x.isSwitch && x.correct).map(x=>x.rt));
        rec.choice.switchCost = (swRT!=null && repRT!=null) ? Math.round(swRT-repRT) : null;
        // Switch cost relativo al RT di base del paziente (repRT), non solo
        // assoluto: un paziente semplicemente lento in generale (es. per
        // bradicinesia) non deve gonfiare il costo di switching, che dovrebbe
        // riflettere solo il sovraccosto specifico del cambio di regola, non
        // il "vigore" di risposta generale (Cools, Rogers & Robbins — vigore
        // di risposta dopamina-dipendente, distinto dallo shifting). Affianca
        // il valore assoluto, non lo sostituisce.
        rec.choice.switchCostRelative = (rec.choice.switchCost!=null && repRT>0) ? +(rec.choice.switchCost/repRT).toFixed(3) : null;
        // Accuratezza separata per prove di ripetizione e di switch, non
        // solo il tempo di reazione — isola il costo di switching puro
        // (swAcc vs repAcc, entrambe dentro lo stesso blocco misto) da un
        // eventuale carico attentivo generico di dover tenere pronte
        // entrambe le regole (visibile confrontando repAcc con l'accuratezza
        // di un compito a regola singola, quando disponibile altrove — qui
        // dentro un solo esercizio si misura solo la componente di switch,
        // non il "mixing cost" pieno, che richiederebbe un blocco puro a
        // compito singolo come riferimento, non ancora presente).
        const swTrials = log.filter(x=>x.isSwitch), repTrials = log.filter(x=>!x.isSwitch);
        rec.choice.switchAcc = swTrials.length ? swTrials.filter(x=>x.correct).length/swTrials.length : null;
        rec.choice.repAcc = repTrials.length ? repTrials.filter(x=>x.correct).length/repTrials.length : null;
        if(cfg.switchMaterial==='bivalente'){
          const congRT = rtMeanOf(log.filter(x=>x.congruency==='congruent' && x.correct).map(x=>x.rt));
          const incongRT = rtMeanOf(log.filter(x=>x.congruency==='incongruent' && x.correct).map(x=>x.rt));
          rec.choice.conflict = (congRT!=null && incongRT!=null) ? Math.round(incongRT-congRT) : null;
        }
      }
      if(cfg.taskMode==='simon'){
        const congRT = rtMeanOf(log.filter(x=>x.congruency==='congruent' && x.correct).map(x=>x.rt));
        const incongRT = rtMeanOf(log.filter(x=>x.congruency==='incongruent' && x.correct).map(x=>x.rt));
        rec.choice.conflict = (congRT!=null && incongRT!=null) ? Math.round(incongRT-congRT) : null; // "effetto Simon" — stesso segno/interpretazione dell'indice di conflitto già usato per ANT e Task-switching bivalente
        const congLog = log.filter(x=>x.congruency==='congruent');
        const incongLog = log.filter(x=>x.congruency==='incongruent');
        rec.choice.congAccuracy = congLog.length ? congLog.filter(x=>x.correct).length/congLog.length : null;
        rec.choice.incongAccuracy = incongLog.length ? incongLog.filter(x=>x.correct).length/incongLog.length : null;
      }
    } else if(family==='dual'){
      rec.counts = session.counts; rec.metrics = scoreFromCounts(session.counts);
      rec.countsAud = session.countsAud; rec.metricsAud = scoreFromCounts(session.countsAud);
      rec.dualPairing = cfg.dualPairing || 'vis-aud';
    } else if(family==='spatial'){
      const r = session.results;
      const sum = k=> r.reduce((a,b)=>a+(b[k]||0),0);
      const isConteggio = r.length>0 && r[0].modalitaConteggio;
      if(isConteggio){
        // 'Conteggio a regola': un unico numero riportato per tavola, non
        // un conteggio per lato — niente foundLeft/foundRight/falseAlarms
        // reali da cui derivarli (l'asimmetria classica del neglect non è
        // misurabile con questo tipo di risposta), sostituiti da una
        // misura di accuratezza sul conteggio complessivo.
        const corretti = r.filter(x=>x.corretto).length;
        const erroriAssoluti = r.map(x=>Math.abs(x.conteggioDato-x.conteggioAtteso));
        rec.neglect = {
          boards:r.length, modalitaConteggio:true,
          targetsLeft:sum('targetsLeft'), targetsRight:sum('targetsRight'),
          foundLeft:null, foundRight:null, omittedLeft:null, omittedRight:null,
          pctLeft:null, pctRight:null, falseAlarms:null, asymmetry:null,
          meanTimeMs: rtMeanOf(r.map(x=>x.timeMs)),
          conteggiCorretti:corretti, conteggiTotali:r.length,
          accuratezzaConteggio: r.length ? corretti/r.length : null,
          erroreAssolutoMedio: erroriAssoluti.length ? mean(erroriAssoluti) : null
        };
      } else {
        const tL=sum('targetsLeft'), tR=sum('targetsRight'), fL=sum('foundLeft'), fR=sum('foundRight'), fa=sum('falseAlarms');
        rec.neglect = {
          boards:r.length, modalitaConteggio:false,
          targetsLeft:tL, targetsRight:tR, foundLeft:fL, foundRight:fR,
          omittedLeft:tL-fL, omittedRight:tR-fR,
          pctLeft: tL? fL/tL : null, pctRight: tR? fR/tR : null,
          falseAlarms:fa, meanTimeMs: rtMeanOf(r.map(x=>x.timeMs)),
          asymmetry: (tL && tR) ? Math.round(((fL/tL)-(fR/tR))*100) : null // negativo = più omissioni a sinistra
        };
      }
    } else if(family==='goaltask'){
      const score = scoreGoalTask(session);
      rec.goaltask = {
        scenario: cfg.goaltaskScenario, scenarioLabel: session.scenario.label, livello: cfg.goaltaskLivello,
        completatiCount: score.completatiCount, totaleElementi: score.totaleElementi,
        percentualeCompletamento: score.percentualeCompletamento,
        violazioniCount: score.violazioniCount, tempoImpiegatoSec: score.tempoImpiegatoSec,
        budgetRispettato: score.budgetRispettato, budgetSecondi: session.scenario.budgetSecondi || null,
        sogliaErroriTollerati: score.sogliaErroriTollerati, erroriEntroSoglia: score.erroriEntroSoglia,
        violazioni: session.violazioni
      };
    } else if(family==='memoria'){
      const m = session.material;
      const materiale = memoriaEffectiveMateriale(cfg);
      const totale = memoriaLearnItems(cfg, m).length;
      const recuperati = Object.values(session.recall).filter(Boolean).length;
      rec.memoria = {
        modo: cfg.memoriaModo, materiale, livello: m.livello,
        titolo: materiale==='brano' ? m.titolo : null,
        recuperati, totale, percentuale: totale ? Math.round((recuperati/totale)*100) : 0,
        dettaglioRichiamo: session.recall,
        chunkingMetodi: cfg.memoriaModo==='chunking' ? cfg.chunkingMetodi : undefined,
        chunkingNota: (cfg.memoriaModo==='chunking' && cfg.chunkingMetodi.includes('personale')) ? cfg.chunkingNota : undefined,
        // forma parallela usata (solo dove esistono forme multiple per il
        // livello) — tracciata per poter distinguere in retrospettiva se
        // due sessioni allo stesso livello hanno usato lo stesso materiale
        // (rischio di apprendimento/esposizione) o forme diverse (RCI pulito)
        formaIdx: (m.nForme>1) ? m.formaIdx : undefined,
        formaLettera: (m.nForme>1) ? (['A','B','C','D','E','F','G','H','I','J'][m.formaIdx]||null) : undefined,
        nForme: m.nForme>1 ? m.nForme : undefined
      };
    }
    lastResult = rec;
    if(screeningState){
      const block = SCREENING_BLOCKS[screeningState.blockIdx];
      rec.screening = {domain:block.domain, tipo:block.tipo, label:block.label};
      rec.notes = (rec.notes ? rec.notes+' ' : '')+'[Screening — '+block.label+']';
      await saveSession(rec);
      if(block.tipo==='split'){
        // Un solo blocco somministrato, due punteggi derivati dagli stessi
        // dati (vedi commento su SCREENING_BLOCKS) — non una seconda
        // somministrazione.
        screeningState.results.push({domain:block.domain, tipo:'base', accuracy: rec.choice[block.splitAccKeys.base]});
        screeningState.results.push({domain:block.domain, tipo:'caricato', accuracy: rec.choice[block.splitAccKeys.caricato]});
      } else {
        screeningState.results.push({domain:block.domain, tipo:block.tipo, accuracy: primaryAccuracyOf(rec)});
      }
      screeningState.blockIdx++;
      runScreeningBlock(screeningState.blockIdx);
      return;
    }
    await saveSession(rec);
    // continuità: ricorda l'ultima configurazione usata per questo profilo,
    // così la prossima volta che lo si riprende parte da qui, non dai default
    // riporta il livello raggiunto nella config, così "Ripeti" e la
    // continuità del profilo partono davvero da dove ci si era fermati
    if(cfg.taskMode==='nback') cfg.nLevel = session.liveNLevel;
    else if(cfg.taskMode==='ant' && cfg.antMode==='tapat') cfg.tapatStartLevel = session.tapatLevel;
    else if(cfg.taskMode==='neglect' && cfg.neglectMode==='regola') cfg.neglectRuleLevel = session.liveBoardLevel;
    else if(cfg.taskMode==='neglect') cfg.neglectStartLevel = session.liveBoardLevel;
    else if(cfg.taskMode==='categorizzazione') cfg.categLivello = session.categLevel;
    else if(adaptLevelKey()==='adaptLevel') cfg.adaptStartLevel = session.adaptLevel;
    if(cfg.taskMode==='dualtask'){ cfg.dualStartLevel1 = session.dualLevel1; cfg.dualStartLevel2 = session.dualLevel2; }
    const snap = presetCfgOf(cfg);
    const lastAcc = primaryAccuracyOf(rec);
    if(lastAcc!=null) snap.lastAccuracy = lastAcc;
    if(!patientProfile && activeLocalPatientId){ updateLocalPatientConfig(activeLocalPatientId, snap); saveExerciseLevel('local', activeLocalPatientId, cfg.taskMode, snap); }
    else if(patientProfile){ saveRemotePatientConfig(patientProfile.id, snap); saveExerciseLevel('remote', patientProfile.id, cfg.taskMode, snap); }
    if(patientProfile) cachedTodayUsage = null; // forza il ricalcolo del limite giornaliero
    else if(!patientProfile && activeRemotePatientId){ saveRemotePatientConfig(activeRemotePatientId, snap); saveExerciseLevel('remote', activeRemotePatientId, cfg.taskMode, snap); }
    view='results'; render();
  }

  function ScreenResults(root){
    root.appendChild(el('div',{class:'brand'},[el('div',{class:'mark'},['Traccia',el('span',{},['N'])])]));
    const s = el('div',{class:'screen'});
    const card = el('div',{class:'card'});
    const r = lastResult;
    const exLabel = EXERCISES[r.taskMode] ? EXERCISES[r.taskMode].label : r.taskMode;
    card.appendChild(el('h2',{},['Risultati sessione']));
    // Messaggio di chiusura per il paziente: mostrato dopo QUALUNQUE seduta
    // legata a un paziente (autosomministrata da remoto, o in presenza
    // condotta dall'operatore sullo stesso schermo) — non per "esercizi
    // liberi" senza paziente selezionato. Tono deliberatamente neutro e
    // adulto: nessun aggettivo di merito, nessun confronto con sessioni
    // precedenti, nessuna esclamazione — un dato di fatto (durata) più,
    // se ci sono obiettivi impostati per questo paziente, il progresso
    // verso quelli.
    const activePL = activePatientLike();
    if(activePL){
      const isSelfAdmin = !!patientProfile;
      const isLocalCtx = !isSelfAdmin && !!activeLocalPatientId;
      const minuti = Math.max(1, Math.round((r.durationMs||0)/60000));
      const goals = normalizeGoals(activePL.obiettivo);
      let msg = 'Sessione di '+minuti+' minut'+(minuti===1?'o':'i')+' completata.';
      const timeGoal = goals.find(g=>g.tipo==='tempo');
      if(timeGoal){
        const prog = isSelfAdmin ? computeTimeGoalProgress(timeGoal) : computeTimeGoalProgressOperator(timeGoal, isLocalCtx, activePL.id);
        if(prog && prog.percentuale!=null) msg += ' '+prog.etichetta+' verso l\'obiettivo di tempo.';
      }
      const levelGoal = goals.find(g=> g.tipo==='livello' && g.taskMode===r.taskMode);
      if(levelGoal){
        const ucFallback = isSelfAdmin ? activePL.ultima_config : (isLocalCtx ? activePL.lastConfig : activePL.ultima_config);
        const progL = computeLevelGoalProgress(levelGoal, configForExercise(activePL, levelGoal.taskMode) || ucFallback);
        if(progL) msg += ' '+progL.etichetta+' verso l\'obiettivo di livello su questo esercizio.';
      }
      card.appendChild(el('p',{class:'hint', style:'font-size:15px; margin-top:-4px;'},[msg]));
    }
    const subLabel = (r.taskMode==='ant' && r.antMode==='tapat') ? (r.tapatModalita==='uditivo' ? 'Uditivo · ' : '')
      : (EXERCISES[r.taskMode] && EXERCISES[r.taskMode].usesStimType && !(r.taskMode==='ant' && r.antMode==='classico')) ? (r.taskMode==='sequenza' && r.sequenzaMista ? 'Mista' : STIM_LABELS[r.stimType])+' · ' : '';
    card.appendChild(el('p',{class:'hint'},[
      (r.family==='goaltask')
        ? (r.goaltask.scenarioLabel+' · livello '+r.goaltask.livello+' · '+(r.patientCode? 'paziente '+r.patientCode+' · ':'')+r.dateLabel)
        : (r.family==='memoria')
        ? ('Livello '+r.memoria.livello+(r.memoria.formaLettera?' · forma '+r.memoria.formaLettera:'')+' · '+(r.memoria.modo==='chunking'?'chunking':'PQRST')+' · '+(r.patientCode? 'paziente '+r.patientCode+' · ':'')+r.dateLabel)
        : (subLabel+exLabel+' · '+r.trials+' prove · '+(r.patientCode? 'paziente '+r.patientCode+' · ':'')+r.dateLabel)
    ]));

    const mg = el('div',{class:'metricgrid'});
    function metric(n,l){ return el('div',{class:'metric'},[el('div',{class:'n'},[n]),el('div',{class:'l'},[l])]); }

    if(r.family==='choice'){
      mg.appendChild(metric(r.choice.correct+' / '+r.choice.total, 'Risposte corrette'));
      mg.appendChild(metric(fmtPct(r.choice.accuracy), 'Accuratezza'));
      mg.appendChild(metric(String(r.choice.omitted), 'Omesse'));
      if(r.choice.meanRT!=null) mg.appendChild(metric(Math.round(r.choice.meanRT)+' ms', 'RT medio (corrette)'));
      if(r.choice.alerting!=null) mg.appendChild(metric(r.choice.alerting+' ms', 'Indice allerta'));
      if(r.choice.orienting!=null) mg.appendChild(metric(r.choice.orienting+' ms', 'Indice orienting'));
      if(r.choice.conflict!=null) mg.appendChild(metric(r.choice.conflict+' ms', r.taskMode==='simon' ? 'Effetto Simon (RT incongruente − congruente)' : 'Indice conflitto'));
      if(r.choice.congAccuracy!=null) mg.appendChild(metric(fmtPct(r.choice.congAccuracy), 'Accuratezza — prove congruenti'));
      if(r.choice.incongAccuracy!=null) mg.appendChild(metric(fmtPct(r.choice.incongAccuracy), 'Accuratezza — prove incongruenti'));
      if(r.choice.tonicMeanRT!=null) mg.appendChild(metric(Math.round(r.choice.tonicMeanRT)+' ms', 'RT medio — blocco tonico (sostenuto/proattivo)'));
      if(r.choice.tonicTotal!=null) mg.appendChild(metric(r.choice.tonicOmissions+' / '+r.choice.tonicTotal, 'Omissioni — blocco tonico (sostenuto/proattivo)'));
      if(r.choice.phasicMeanRT!=null) mg.appendChild(metric(Math.round(r.choice.phasicMeanRT)+' ms', 'RT medio — blocco fasico (cue-indotto/reattivo)'));
      if(r.choice.adaptive && r.choice.finalTapatLevel!=null) mg.appendChild(metric('livello '+r.choice.finalTapatLevel, 'Difficoltà finale (adattiva)'));
      if(r.choice.switchCost!=null) mg.appendChild(metric(r.choice.switchCost+' ms', 'Switch cost'));
      if(r.choice.switchCostRelative!=null) mg.appendChild(metric((r.choice.switchCostRelative*100).toFixed(1)+' %', 'Switch cost relativo al RT di base'));
      if(r.choice.repAcc!=null) mg.appendChild(metric(Math.round(r.choice.repAcc*100)+'%', 'Accuratezza — ripetizione'));
      if(r.choice.switchAcc!=null) mg.appendChild(metric(Math.round(r.choice.switchAcc*100)+'%', 'Accuratezza — switch'));
    } else if(r.family==='dual'){
      const [lab1,lab2] = dualChannelLabels(r.dualPairing);
      mg.appendChild(metric(fmtPct(r.metrics.acc), 'Accuratezza canale '+lab1));
      mg.appendChild(metric(fmtPct(r.metricsAud.acc), 'Accuratezza canale '+lab2));
      mg.appendChild(metric(r.metrics.dprime!=null? r.metrics.dprime.toFixed(2):'—', "d′ "+lab1));
      mg.appendChild(metric(r.metricsAud.dprime!=null? r.metricsAud.dprime.toFixed(2):'—', "d′ "+lab2));
    } else if(r.family==='spatial'){
      const ng = r.neglect;
      if(ng.modalitaConteggio){
        mg.appendChild(metric(ng.conteggiCorretti+' / '+ng.conteggiTotali, 'Conteggi esatti'));
        mg.appendChild(metric(fmtPct(ng.accuratezzaConteggio), 'Accuratezza conteggio'));
        if(ng.erroreAssolutoMedio!=null) mg.appendChild(metric(ng.erroreAssolutoMedio.toFixed(1), 'Errore assoluto medio'));
        if(ng.meanTimeMs!=null) mg.appendChild(metric(fmtTime(ng.meanTimeMs), 'Tempo medio/tavola'));
      } else {
        mg.appendChild(metric(fmtPct(ng.pctLeft), 'Trovati a sinistra'));
        mg.appendChild(metric(fmtPct(ng.pctRight), 'Trovati a destra'));
        mg.appendChild(metric(ng.omittedLeft+' / '+ng.omittedRight, 'Omessi (sin. / des.)'));
        if(ng.asymmetry!=null) mg.appendChild(metric((ng.asymmetry>0?'+':'')+ng.asymmetry+' pt', 'Asimmetria (– = più omissioni a sin.)'));
        mg.appendChild(metric(String(ng.falseAlarms), 'Falsi allarmi'));
        if(ng.meanTimeMs!=null) mg.appendChild(metric(fmtTime(ng.meanTimeMs), 'Tempo medio/tavola'));
      }
    } else if(r.family==='goaltask'){
      const g = r.goaltask;
      mg.appendChild(metric(g.completatiCount+' / '+g.totaleElementi, 'Elementi completati'));
      mg.appendChild(metric(g.percentualeCompletamento+'%', 'Completamento'));
      mg.appendChild(metric(String(g.violazioniCount), 'Violazioni di regola'));
      // Esito complessivo: un completamento al 100% non deve leggersi come
      // "prova perfetta" se ci sono state violazioni di regola — qui lo
      // rende esplicito invece di lasciare che le due percentuali vengano
      // lette separatamente e la seconda passi inosservata.
      // Esito complessivo: un completamento al 100% non deve leggersi come
      // "prova perfetta" se ci sono state violazioni di regola — qui lo
      // rende esplicito invece di lasciare che le due percentuali vengano
      // lette separatamente e la seconda passi inosservata. Se lo scenario
      // ha una soglia di errori tollerati (livello 3 di alcuni scenari),
      // superarla marca l'esito come "Fallito" indipendentemente dal
      // completamento — coerente col Six Elements reale, dove infrangere
      // troppe regole invalida la prova anche se tutti i compiti sono stati
      // tentati.
      const sogliaSuperata = g.sogliaErroriTollerati!=null && !g.erroriEntroSoglia;
      const esitoTxt = sogliaSuperata
        ? 'Fallito — violazioni oltre la soglia tollerata ('+g.violazioniCount+'/'+g.sogliaErroriTollerati+')'
        : g.violazioniCount>0
        ? (g.percentualeCompletamento===100 ? 'Completato, con violazioni' : 'Incompleto, con violazioni')
        : (g.percentualeCompletamento===100 ? 'Completato senza violazioni' : 'Incompleto, nessuna violazione');
      mg.appendChild(metric(esitoTxt, 'Esito'));
      if(g.budgetSecondi) mg.appendChild(metric(g.budgetRispettato?'Sì':'No', 'Budget di tempo rispettato'));
      mg.appendChild(metric(fmtTime(g.tempoImpiegatoSec*1000), 'Tempo impiegato'));
    } else if(r.family==='memoria'){
      const m = r.memoria;
      const unitLabel = (m.materiale||(m.modo==='chunking'?'lista':'brano'))==='lista' ? 'Parole recuperate' : 'Idee recuperate';
      mg.appendChild(metric(m.recuperati+' / '+m.totale, unitLabel));
      mg.appendChild(metric(m.percentuale+'%', 'Richiamo'));
      mg.appendChild(metric('Livello '+m.livello, 'Difficoltà materiale'));
      mg.appendChild(metric(MEMORIA_MODO_LABELS[m.modo]||m.modo, 'Tecnica'));
    } else { // signal
      mg.appendChild(metric(r.counts.hits+' / '+(r.counts.hits+r.counts.misses), 'Hit / target'));
      mg.appendChild(metric(String(r.counts.falseAlarms), 'Falsi allarmi'));
      mg.appendChild(metric(fmtPct(r.metrics.acc), 'Accuratezza'));
      mg.appendChild(metric(r.metrics.dprime!=null? r.metrics.dprime.toFixed(2):'—', "d′"));
      if(r.avgRT!=null) mg.appendChild(metric(Math.round(r.avgRT)+' ms', 'RT medio (hit)'));
      if(r.ssrt!=null) mg.appendChild(metric(Math.round(r.ssrt)+' ms', 'SSRT (stima)'));
      if(r.taskMode==='stopsignal' && r.goAccuracy!=null) mg.appendChild(metric(fmtPct(r.goAccuracy), 'Accuratezza discriminazione (go)'));
      if(r.taskMode==='nback' && r.finalNLevel!=null && r.finalNLevel!==r.nLevel){
        mg.appendChild(metric(r.nLevel+' → '+r.finalNLevel, 'Livello (iniziale → finale)'));
      }
    }
    mg.appendChild(metric(fmtTime(r.durationMs), 'Durata'));
    card.appendChild(mg);

    // Avviso di calo prestazionale intra-sessione — solo informativo, non
    // cambia la difficoltà né chiude nulla: segnala che l'accuratezza è
    // scesa sensibilmente dal primo all'ultimo terzo delle prove, un
    // pattern compatibile con affaticamento (ma anche con altro — la
    // lettura resta all'operatore). Assente per goaltask/memoria/spatial,
    // dove "un terzo delle prove" non ha lo stesso significato.
    if(r.fatigueNote && r.fatigueNote.flag){
      card.appendChild(el('div',{class:'card', style:'margin-top:12px; background:var(--paper-dim); border-color:var(--alert);'},[
        el('p',{class:'hint', style:'color:var(--ink); margin:0;'},[
          '⚠ Accuratezza in calo nel corso della prova: dal '+fmtPct(r.fatigueNote.accFirst)+' (primo terzo) al '
          +fmtPct(r.fatigueNote.accLast)+' (ultimo terzo). Può indicare affaticamento — valuta se accorciare la '
          +'prossima seduta o inserire una pausa a metà.'
        ])
      ]));
    }

    const rowbtns = el('div',{class:'rowbtns'});
    rowbtns.appendChild(el('button',{class:'primary', onclick:()=>{ view='instructions'; render(); }},['↻ Ripeti (stesso esercizio)']));
    rowbtns.appendChild(el('button',{class:'ghost', onclick:()=>{ view=homeView(); render(); }},['Cambia esercizio']));
    rowbtns.appendChild(el('button',{class:'ghost', onclick:()=>{ view='history'; render(); }},['Storico']));
    card.appendChild(rowbtns);

    s.appendChild(card); root.appendChild(s);
  }

  function ScreenArchive(root){
    root.appendChild(el('div',{class:'topbar'},[
      el('div',{class:'info'},['Archivio']),
      el('button',{onclick:()=>{ view='operatorHome'; render(); }},['← Indietro'])
    ]));
    const s = el('div',{class:'screen'});
    const card = el('div',{class:'card'});
    card.appendChild(el('h2',{},['Archivio']));
    card.appendChild(el('p',{class:'hint'},['Profili archiviati, in presenza e remoti insieme. Non sono eliminati: storico e report restano consultabili, e possono tornare attivi in qualsiasi momento.']));

    const listWrap = el('div',{},[el('p',{class:'empty'},['Caricamento…'])]);
    card.appendChild(listWrap);
    s.appendChild(card); root.appendChild(s);

    const localArchived = listLocalPatients().filter(p=>p.attivo===false).map(p=>Object.assign({_kind:'local'}, p));
    const remoteP = (sb && cloudUser) ? listMyPatients() : Promise.resolve([]);
    remoteP.then(remoteList=>{
      cachedRemotePatients = remoteList.length ? remoteList : cachedRemotePatients;
      const remoteArchived = remoteList.filter(p=>p.attivo===false).map(p=>Object.assign({_kind:'remote'}, p));
      const all = localArchived.concat(remoteArchived).sort((a,b)=>{
        const an = a._kind==='local'?a.nome:a.codice_paziente, bn = b._kind==='local'?b.nome:b.codice_paziente;
        return an.localeCompare(bn);
      });
      listWrap.innerHTML='';
      if(!all.length){ listWrap.appendChild(el('p',{class:'empty'},['Nessun profilo archiviato.'])); return; }
      all.forEach(p=>{
        const isLocal = p._kind==='local';
        const nome = isLocal ? p.nome : p.codice_paziente;
        const linkedRemote = isLocal && p.remotePazienteId ? remoteList.find(r=>r.id===p.remotePazienteId) : null;
        const row = el('div',{style:'padding:14px 4px; border-bottom:1px solid var(--line);'},[
          el('div',{style:'margin-bottom:10px;'},[
            el('div',{style:'font-size:14.5px; font-weight:600;'},[nome, el('span',{style:'margin-left:8px; font-size:11px; font-weight:600; color:var(--ink-soft); border:1px solid var(--line); border-radius:999px; padding:1px 8px;'},[isLocal?'in presenza':'remoto'])]),
            linkedRemote ? el('div',{class:'l', style:'margin-top:2px;'},['confluito nell\'account remoto '+linkedRemote.codice_paziente+(linkedRemote.attivo===false?' (anch\'esso archiviato)':'')]) : null
          ].filter(Boolean)),
          el('div',{style:'display:flex; gap:8px; flex-wrap:wrap;'},[
            el('button',{class:'ghost', style:'padding:8px 14px; font-size:13px;', onclick:()=>{ historyFilterPatientId=p.id; historyFilterKind=isLocal?'local':'remote'; view='history'; render(); }},['Storico']),
            el('button',{class:'ghost', style:'padding:8px 14px; font-size:13px;', onclick:()=>{ editingPatient=p; editingPatientKind=isLocal?'local':'remote'; view='patientProgram'; render(); }},['Gestisci programma']),
            el('button',{class:'primary', style:'padding:8px 14px; font-size:13px; width:auto;', onclick: async ()=>{
              if(isLocal){
                try{
                  const raw = localStorage.getItem('traccian:localpatient:'+p.id);
                  if(!raw) return;
                  const pp = JSON.parse(raw);
                  pp.attivo = true;
                  localStorage.setItem('traccian:localpatient:'+p.id, JSON.stringify(pp));
                  syncLocalPatientToCloud(pp);
                  render();
                }catch(e){}
              } else {
                try{
                  const { error } = await sb.from('pazienti').update({attivo:true}).eq('id', p.id).eq('operatore_id', cloudUser.id);
                  if(error) throw error;
                  cachedRemotePatients = null;
                  render();
                }catch(e){ alert('Errore: '+e.message); }
              }
            }},['Riattiva']),
            el('button',{class:'ghost', style:'padding:8px 14px; font-size:13px; color:var(--alert); border-color:var(--alert);', onclick: async ()=>{
              if(!confirm('Eliminare definitivamente il profilo di '+nome+'? Le sessioni già registrate restano nello storico, ma non saranno più raggruppate sotto il suo nome.')) return;
              if(isLocal){
                try{ localStorage.removeItem('traccian:localpatient:'+p.id); }catch(e){}
                await deleteLocalPatientCloud(p.id);
              } else {
                try{
                  const { error } = await sb.from('pazienti').delete().eq('id', p.id).eq('operatore_id', cloudUser.id);
                  if(error) throw error;
                  cachedRemotePatients = null;
                }catch(e){ alert('Errore eliminazione: '+e.message); return; }
              }
              render();
            }},['Elimina'])
          ])
        ]);
        listWrap.appendChild(row);
      });
    });
  }

              try{ localStorage.setItem('traccian:localpatient:'+p.id, JSON.stringify(p)); }catch(e){}
              syncLocalPatientToCloud(p);
              if(activeLocalPatientId===p.id){ activeLocalPatientId=null; cfg.patientCode=''; }
              render();
            }},['Archivia']),
            el('button',{class:'ghost', style:'padding:8px 14px; font-size:13px; color:var(--alert); border-color:var(--alert);', onclick: async ()=>{
              if(!confirm('Eliminare il profilo locale di '+p.nome+'? Le sessioni già registrate restano nello storico, ma non saranno più raggruppate sotto il suo nome.')) return;
              try{ localStorage.removeItem('traccian:localpatient:'+p.id); }catch(e){}
              await deleteLocalPatientCloud(p.id);
              if(activeLocalPatientId===p.id){ activeLocalPatientId=null; cfg.patientCode=''; }
              render();
            }},['Elimina'])
          ])
        ].filter(Boolean));
        card.appendChild(row);
        const badgeLine = programBadgeLine(p.programma);
        if(badgeLine){
          card.appendChild(el('div',{style:'padding:0 4px 4px; font-size:12.5px; color:var(--ink-soft);'},[badgeLine]));
        }
        const activeFlags = (p.screeningFlags||[]).filter(f=>f.attivo);
        if(activeFlags.length){
          card.appendChild(el('div',{style:'padding:0 4px 10px; font-size:12.5px; color:var(--ink-soft);'},[
            '⭐ '+activeFlags.length+(activeFlags.length===1?' suggerimento':' suggerimenti')+' da screening — gestiscili da "Gestisci programma".'
          ]));
        }
      });
    }

    card.appendChild(el('button',{class:'primary', style:'margin-top:16px;', onclick:()=>{
      const nome = prompt('Nome o codice del nuovo paziente (es. "Sig. Rossi" — valuta se usare un\'iniziale invece del nominativo completo):');
      if(nome && nome.trim()){
        const nomeTrim = nome.trim();
        // Le etichette locali sono testo libero, senza controllo di
        // unicità: due pazienti (anche uno attivo e uno archiviato) con lo
        // stesso nome sono record indipendenti che sembrano collegati ma
        // non lo sono. Un avviso qui non impedisce la scelta (può essere
        // voluta), solo previene la confusione di scoprirlo dopo.
        const dup = listLocalPatients().find(p=> p.nome.toLowerCase()===nomeTrim.toLowerCase());
        if(dup && !confirm('Esiste già un paziente in presenza chiamato "'+nomeTrim+'"'+(dup.attivo===false?' (archiviato)':'')+'. Sarà un profilo separato e indipendente, non collegato a quello esistente. Continuare comunque?')) return;
        const p = saveLocalPatient(nomeTrim);
        activeLocalPatientId=p.id; activeRemotePatientId=null; cfg.patientCode=p.nome;
        applyLevelBaselineOrSuggestion(cfg.taskMode);
        view='setup'; render();
      }
    }},['+ Nuovo paziente']));

    s.appendChild(card); root.appendChild(s);
  }
