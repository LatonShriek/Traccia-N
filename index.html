      {gruppi:[{categoria:'professioni', parole:['medico','cuoco']}, {categoria:'stagioni', parole:['estate','inverno']}, {categoria:'fiori', parole:['rosa','tulipano','girasole']}]}
    ]},
    {livello:3, parole:['sedia','tavolo','letto','armadio','divano'], categorizzata:true, categoria:'mobili'},
    {livello:4, parole:['rosso','blu','verde','giallo','viola','arancione'], categorizzata:true, categoria:'colori'},
    {livello:5, parole:['martello','cacciavite','chiodo','vite','pinza','sega'], categorizzata:true, categoria:'utensili'},
    {livello:6, parole:['cane','martello','mela','sedia','rosso','uva','tavolo'], categorizzata:false},
    {livello:7, parole:['gatto','cacciavite','pera','armadio','blu','vite','banana','divano'], categorizzata:false},
    {livello:8, parole:['nave','montagna','biblioteca','ombrello','fiume','candela','scarpa','orologio'], categorizzata:false},
    {livello:9, parole:['finestra','giardino','matita','specchio','cuscino','bicicletta','lampada','forchetta','quaderno'], categorizzata:false},
    {livello:10, parole:['pazienza','coraggio','velocità','silenzio','armadio','giustizia','matita','libertà'], categorizzata:false},
    {livello:11, parole:['onestà','equilibrio','curiosità','fiducia','stanchezza','gentilezza','sedia','memoria','dubbio'], categorizzata:false},
    {livello:12, parole:['coerenza','ambizione','nostalgia','prudenza','ostacolo','armonia','sospetto','tenacia','sorpresa','equità'], categorizzata:false},
    {livello:13, parole:['discrezione','vulnerabilità','autonomia','riluttanza','integrità','ambiguità','perseveranza','indifferenza','entusiasmo','rassegnazione'], categorizzata:false},
    {livello:14, parole:['sussidiarietà','contingenza','discernimento','emancipazione','equanimità','reticenza','circospezione','pervicacia','indole','sagacia','deferenza'], categorizzata:false},

  // Le tecniche PQRST e Chunking usano ciascuna una sola modalità di
  // materiale (brano/lista); Loci, Errorless learning e Vanishing cues sono
  // invece applicabili a entrambe — memoriaEffectiveMateriale() risolve la
  // modalità effettiva in ogni caso, così tutto il resto del codice usa
  // sempre questa funzione invece di controllare memoriaModo direttamente.
  function memoriaEffectiveMateriale(cfgLike){
    if(cfgLike.memoriaModo==='chunking') return 'lista';
    if(cfgLike.memoriaModo==='pqrst') return 'brano';
    return cfgLike.memoriaMateriale || 'lista';
  }
  // Regola generale di crescita per il chunking a sotto-gruppi (numero di
  // gruppi × dimensione di ciascuno, cresciuti insieme, non solo la
  // lunghezza totale). Livelli 1-10: gruppi mostrati esplicitamente con
  // etichetta di categoria. Livelli 11-16: gruppi presenti nel dato (usati
  // per l'osservazione del clustering in richiamo) ma NON mostrati al
  // paziente — la lista appare come blocco unico e il paziente organizza
  // con una tecnica propria fra quelle già esistenti (chunkingMetodi),
  // fino a 2 combinabili (soglia già in uso altrove nel codice, riusata
  // qui apposta per non introdurre un secondo confine indipendente).
  // Questa tabella governa solo LA STRUTTURA quando esiste un dato a
  // gruppi (vedi forme in MEMORIA_LISTE) — per ora solo i livelli 1-2 sono
  // popolati; i livelli 3-16 restano nella forma flat storica finché non
  // vengono anch'essi convertiti, contenuto da produrre gradualmente.
  const CHUNKING_GROUP_VISIBLE_MAX_LEVEL = 10;
  function chunkingGroupsVisible(livello){ return livello <= CHUNKING_GROUP_VISIBLE_MAX_LEVEL; }
  // Quante forme parallele esistono per il livello/modo correnti (1 se il
  // livello non è ancora stato popolato con forme multiple — vedi commenti
  // sopra). Usata dal selettore in setup e per validare memoriaFormaIdx.
  function memoriaNForme(modo, livello){
    if(modo==='chunking'){
      const e = MEMORIA_LISTE.find(l=>l.livello===livello);
      return (e && e.forme) ? e.forme.length : 1;
    }
    if(modo==='pqrst'){
      const e = MEMORIA_BRANI.find(b=>b.livello===livello);
      return (e && e.forme) ? e.forme.length : 1;
    }
    return 1;
  }
  // Set delle lettere-forma già usate da questo paziente, con questa
  // tecnica e a questo livello, secondo lo storico già caricato in
  // memoria (historyCache). Non forza un caricamento: se lo storico non è
  // ancora stato popolato in questa sessione operatore (es. primo accesso
  // dopo login, prima di aver aperto la scheda storico), ritorna un set
  // vuoto — il tag è un aiuto, non deve mai bloccare o rallentare il setup.
  function memoriaFormeUsatePerPaziente(patientCode, modo, livello){
    const out = new Set();
    if(!patientCode || !historyCache) return out;
    historyCache.forEach(r=>{
      if(r.family==='memoria' && r.patientCode===patientCode && r.memoria && r.memoria.modo===modo && r.memoria.livello===livello && r.memoria.formaLettera){
        out.add(r.memoria.formaLettera);
      }
    });
    return out;
  }
  // Normalizza una voce di MEMORIA_LISTE (nuova forma a `forme`/`gruppi`, o
  // vecchia forma flat con `parole`/`categorizzata`) in un'unica forma
  // canonica: {livello, parole (flat), gruppi (array o null), categorizzata,
  // categoria, nForme, formaIdx}. Il resto del codice usa sempre questa
  // funzione, mai le due forme direttamente.
  function memoriaListaResolve(entry, formaIdx){
    if(entry.forme && entry.forme.length){
      const idx = ((formaIdx||0) % entry.forme.length + entry.forme.length) % entry.forme.length;
      const forma = entry.forme[idx];
      const parole = [].concat(...forma.gruppi.map(g=>g.parole));
      const groupsVisible = chunkingGroupsVisible(entry.livello);
      return {
        livello:entry.livello, parole, categorizzata:true,
        gruppi: groupsVisible ? forma.gruppi : null, // nascosti dal livello 11 in su — restano nel dato solo per lo scoring, non passati al rendering
        nForme:entry.forme.length, formaIdx:idx
      };
    }
    return {livello:entry.livello, parole:entry.parole, categorizzata:entry.categorizzata, categoria:entry.categoria, gruppi:null, nForme:1, formaIdx:0};
  }
  // Normalizza una voce di MEMORIA_BRANI (nuova forma a `forme`/`sezioni`, o
  // vecchia forma flat con `titolo`/`testo`/`unita`) in un'unica forma
  // canonica a sezioni: {livello, titolo, testo (tutte le sezioni unite),
  // unita (tutte le sezioni concatenate), sezioni:[{testo,unita}, ...],
  // nForme, formaIdx}. Le voci storiche diventano una singola sezione, così
  // il ciclo P-Q-R-S per sezione funziona identico sia sul materiale nuovo
  // sia su quello vecchio, senza due percorsi di codice separati.
  function memoriaBranoResolve(entry, formaIdx){
    let titolo, sezioni;
    if(entry.forme && entry.forme.length){
      const idx = ((formaIdx||0) % entry.forme.length + entry.forme.length) % entry.forme.length;
      const forma = entry.forme[idx];
      titolo = forma.titolo; sezioni = forma.sezioni;
      return {
        livello:entry.livello, titolo, sezioni,
        testo: sezioni.map(s=>s.testo).join(' '),
        unita: [].concat(...sezioni.map(s=>s.unita)),
        nForme:entry.forme.length, formaIdx:idx
      };
    }
    return {
      livello:entry.livello, titolo:entry.titolo,
      sezioni:[{testo:entry.testo, unita:entry.unita}],
      testo:entry.testo, unita:entry.unita, nForme:1, formaIdx:0
    };
  }
  function memoriaMaterialFor(cfgLike){
    return memoriaEffectiveMateriale(cfgLike)==='lista'
      ? memoriaListaResolve(MEMORIA_LISTE.find(l=>l.livello===cfgLike.memoriaLivello) || MEMORIA_LISTE[0], cfgLike.memoriaFormaIdx)
      : memoriaBranoResolve(MEMORIA_BRANI.find(b=>b.livello===cfgLike.memoriaLivello) || MEMORIA_BRANI[0], cfgLike.memoriaFormaIdx);
  }
  // Elementi da imparare, come semplice array di stringhe, indipendentemente
  // dal materiale: parole della lista, o idee-chiave del brano. Usata dalle
  // tre tecniche condivise fra le due modalità (loci/errorless/vanishing) e
  // dalla fase di richiamo comune a tutte le modalità.
  function memoriaLearnItems(cfgLike, m){
    return memoriaEffectiveMateriale(cfgLike)==='lista' ? m.parole : m.unita;
  }
  // Percorso fisso di 16 luoghi familiari (un cammino mentale attraverso una
  // casa), sufficiente a coprire anche il materiale più lungo (16 parole al
  // livello 16). Metodo dei loci: un elemento per tappa, nello stesso ordine
  // del percorso — l'ordine del percorso è ciò che sostiene il richiamo,
  // niente di più.
  const LOCI_ROUTE = [
    'la cassetta della posta', 'il portone d\'ingresso', 'l\'attaccapanni dell\'ingresso', 'lo specchio del corridoio',
    'il tavolo della cucina', 'il frigorifero', 'la finestra sul giardino', 'il divano del soggiorno',
    'la libreria', 'la scala che sale', 'il pianerottolo', 'la porta della camera da letto',
    'il comodino', 'l\'armadio', 'la porta del bagno', 'lo scaffale del bagno'
  ];
  // Percorso "corpo": tappe = parti del corpo in ordine anatomico fisso
  // (testa -> piedi), per pazienti con scarsa familiarità ambientale o
  // ricoverati da tempo, per cui un percorso domestico non è un riferimento
  // stabile. Stesso principio del percorso casa: una tappa, un elemento.
  const LOCI_ROUTE_CORPO = [
    'la testa', 'la fronte', 'gli occhi', 'le orecchie',
    'il naso', 'la bocca', 'il collo', 'le spalle',
    'il petto', 'le braccia', 'le mani', 'la pancia',
    'i fianchi', 'le ginocchia', 'le caviglie', 'i piedi'
  ];
  // Percorso "personalizzato": l'operatore digita le tappe reali del
  // paziente (es. il proprio domicilio), una per riga. Usato solo quando
  // memoriaLociTipo==='personalizzato'; se vuoto si ricade sul percorso casa.
  function lociRouteFor(cfgLike){
    if(cfgLike.memoriaLociTipo==='corpo') return LOCI_ROUTE_CORPO;
    if(cfgLike.memoriaLociTipo==='personalizzato'){
      const lines = (cfgLike.memoriaLociCustom||'').split('\n').map(s=>s.trim()).filter(Boolean);
      return lines.length ? lines : LOCI_ROUTE;
    }
    return LOCI_ROUTE;
  }

  function exportCSV(items){
    const head = ['data','codice_paziente','stimolo','esercizio','n_back','sequenza_bersaglio','prove','isi_ms','durata_stim_ms','modalita',
      'hit','miss','falsi_allarmi','rifiuti_corretti','accuratezza','dprime','rt_medio_ms','ssrt_ms',
      'doppio_compito_accoppiamento','acc_canale2','dprime_canale2','risposte_corrette','risposte_omesse','indice_allerta','indice_orienting','indice_conflitto','switch_cost',
      'neglect_pct_sinistra','neglect_pct_destra','neglect_omessi_sin','neglect_omessi_des','neglect_asimmetria','neglect_falsi_allarmi',
      'goaltask_scenario','goaltask_livello','goaltask_completati','goaltask_totale','goaltask_percentuale','goaltask_violazioni','goaltask_tempo_sec','goaltask_budget_rispettato',
      'memoria_modo','memoria_livello','memoria_forma','memoria_recuperati','memoria_totale','memoria_percentuale','calo_intra_sessione','note'];
    const rows = items.map(r=>{
      const family = r.family || 'signal'; // record salvati prima di questa versione
      const exLabel = EXERCISES[r.taskMode] ? EXERCISES[r.taskMode].label : (r.taskMode==='sequenza'?'sequenza':'n-back');
      return [
        r.dateLabel, r.patientCode||'', (r.taskMode==='sequenza' && r.sequenzaMista ? 'Mista' : (STIM_LABELS[r.stimType]||'')), exLabel,
        r.taskMode==='nback'?r.nLevel:'', (r.targetSeq||[]).join('-'),
        r.trials, r.isi, r.stimDuration, r.respMode,
        family==='signal'||family==='dual' ? r.counts.hits : '',
        family==='signal'||family==='dual' ? r.counts.misses : '',
        family==='signal'||family==='dual' ? r.counts.falseAlarms : '',
        family==='signal'||family==='dual' ? r.counts.correctRejections : '',
        (family==='signal'||family==='dual') && r.metrics.acc!=null ? (r.metrics.acc*100).toFixed(1)+'%':'',
        (family==='signal'||family==='dual') && r.metrics.dprime!=null ? r.metrics.dprime.toFixed(2):'',
        family==='signal' && r.avgRT!=null ? Math.round(r.avgRT):'',
        family==='signal' && r.ssrt!=null ? Math.round(r.ssrt):'',
        family==='dual' ? (r.dualPairing||'vis-aud') : '',
        family==='dual' && r.metricsAud.acc!=null ? (r.metricsAud.acc*100).toFixed(1)+'%':'',
        family==='dual' && r.metricsAud.dprime!=null ? r.metricsAud.dprime.toFixed(2):'',
        family==='choice' ? r.choice.correct+'/'+r.choice.total : '',
        family==='choice' ? r.choice.omitted : '',
        family==='choice' && r.choice.alerting!=null ? r.choice.alerting : '',
        family==='choice' && r.choice.orienting!=null ? r.choice.orienting : '',
        family==='choice' && r.choice.conflict!=null ? r.choice.conflict : '',
        family==='choice' && r.choice.switchCost!=null ? r.choice.switchCost : '',
        family==='spatial' && r.neglect.pctLeft!=null ? (r.neglect.pctLeft*100).toFixed(1)+'%':'',
        family==='spatial' && r.neglect.pctRight!=null ? (r.neglect.pctRight*100).toFixed(1)+'%':'',
        family==='spatial' ? r.neglect.omittedLeft : '',
        family==='spatial' ? r.neglect.omittedRight : '',
        family==='spatial' && r.neglect.asymmetry!=null ? r.neglect.asymmetry : '',
        family==='spatial' ? r.neglect.falseAlarms : '',
        family==='goaltask' ? r.goaltask.scenarioLabel : '',
        family==='goaltask' ? r.goaltask.livello : '',
        family==='goaltask' ? r.goaltask.completatiCount : '',
        family==='goaltask' ? r.goaltask.totaleElementi : '',
        family==='goaltask' ? r.goaltask.percentualeCompletamento+'%' : '',
        family==='goaltask' ? r.goaltask.violazioniCount : '',
        family==='goaltask' ? r.goaltask.tempoImpiegatoSec : '',
        family==='goaltask' && r.goaltask.budgetSecondi ? (r.goaltask.budgetRispettato?'Sì':'No') : '',
        family==='memoria' ? MEMORIA_MODO_LABELS[r.memoria.modo] : '',
        family==='memoria' ? r.memoria.livello : '',
        family==='memoria' ? (r.memoria.formaLettera||'') : '',
        family==='memoria' ? r.memoria.recuperati : '',
        family==='memoria' ? r.memoria.totale : '',
        family==='memoria' ? r.memoria.percentuale+'%' : '',
        r.fatigueNote ? (r.fatigueNote.flag?'Sì':'No')+' ('+(r.fatigueNote.accFirst*100).toFixed(0)+'%→'+(r.fatigueNote.accLast*100).toFixed(0)+'%)' : '',
        (r.notes||'').replace(/[\n,]/g,' ')
      ];
    });
    const csv = [head.join(';')].concat(rows.map(r=>r.join(';'))).join('\n');
    const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'traccian_sessioni.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------- cloud sync (Supabase, opzionale) ---------- */
  // Tutto qui è opt-in: se cloudCfg è vuoto o la libreria non è disponibile,
  // l'app funziona esattamente come prima, solo con localStorage.
  function initSupabase(){
    if(cloudCfg.url && cloudCfg.key && window.supabase && window.supabase.createClient){
      try{ sb = window.supabase.createClient(cloudCfg.url, cloudCfg.key); }
      catch(e){ sb = null; }
    } else { sb = null; }
  }
  async function restoreCloudSession(){
    if(!sb) return;
    try{
      const { data } = await sb.auth.getSession();
      cloudUser = data && data.session ? data.session.user : null;
    }catch(e){ cloudUser = null; }
    await checkRole();
    if(cloudUser) await claimSession();

  // Un account è "paziente" se esiste una riga in pazienti con id = auth.uid().
  async function checkRole(){
    patientProfile = null; isSuperOperatore = false;
    if(!sb || !cloudUser) return;
    try{
      const { data } = await sb.from('pazienti').select('*').eq('id', cloudUser.id).maybeSingle();
      patientProfile = data || null;
    }catch(e){ patientProfile = null; }
    if(!patientProfile){

  // ---------- Registro accessi (solo lettura per il super-operatore) ----------
  // Registra eventi discreti (login riuscito/fallito, logout) su 'accessi'.
  // I tentativi falliti avvengono PRIMA di avere una sessione autenticata,
  // quindi la policy di insert su questa tabella è volutamente permissiva
  // (chiunque può scrivere, nessuno tranne il super-operatore può leggere) —
  // stesso principio già in uso nell'app: la sicurezza sta nella RLS in
  // lettura, non nel nascondere la chiave anon.
  async function logAccessEvent(evento, esito, userType, userId, emailTentata){
    if(!sb) return;
    try{
      await sb.from('accessi').insert({
        evento, esito, user_type: userType,
        user_id: userId || null,
        email_tentata: emailTentata || null
      });
    }catch(e){ /* la tabella 'accessi' potrebbe non essere ancora stata migrata: non bloccare mai login/logout per questo */ }
  }
  async function loadAccessLog(force){
    if(accessLogCache && !force) return accessLogCache;
    if(!sb || !isSuperOperatore) return [];
    try{
      const { data, error } = await sb.from('accessi').select('*').order('ts',{ascending:false}).limit(5000);
      if(error) throw error;
      accessLogCache = data || [];
    }catch(e){ accessLogCache = []; }
    return accessLogCache;
  }
  // ---------- Sessione unica per account (anti-uso concorrente) ----------
  // Meccanismo volutamente semplice: al login viene scritto un "gettone"
  // casuale in una riga per-utente su Supabase, sovrascrivendo quello
  // precedente. Ogni scheda/dispositivo collegato controlla periodicamente
  // se il gettone in database è ancora il proprio: se non lo è più, vuol
  // dire che nel frattempo qualcun altro ha effettuato l'accesso con le
  // stesse credenziali altrove, e questa sessione viene chiusa in automatico.
  // Non richiede infrastruttura aggiuntiva: una sola tabella, nessun server.
  function genSessionToken(){
    try{ if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID(); }catch(e){}
    return 'tok-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
  }
  async function claimSession(){
    if(!sb || !cloudUser) return;
    sessionGuardToken = genSessionToken();
    try{ await sb.from('sessioni_login').upsert({user_id:cloudUser.id, token:sessionGuardToken, aggiornato_il:new Date().toISOString()}); }
    catch(e){ console.error('claim sessione fallito (tabella sessioni_login assente?)', e); }
    startSessionGuard();
  }
  function startSessionGuard(){
    stopSessionGuard();
    sessionGuardTimer = setInterval(async ()=>{
      if(!sb || !cloudUser || !sessionGuardToken) return;
      try{
        const { data } = await sb.from('sessioni_login').select('token').eq('user_id', cloudUser.id).maybeSingle();
        if(data && data.token && data.token!==sessionGuardToken){
          stopSessionGuard();
          alert('Sei stato disconnesso: risulta un accesso più recente con le stesse credenziali da un altro dispositivo o scheda. Un solo accesso alla volta è consentito per account.');
          await cloudSignOut();
        }
      }catch(e){ /* rete assente: non forzare il logout, riprova al giro successivo */ }
    }, 25000);
  }
  function stopSessionGuard(){
    if(sessionGuardTimer){ clearInterval(sessionGuardTimer); sessionGuardTimer=null; }
    sessionGuardToken = null;
  }
  function cloudStatusLabel(){
    if(!cloudCfg.url || !cloudCfg.key) return 'non configurata';
    if(!sb) return 'configurazione non valida';
    if(!cloudUser) return 'configurata, accesso non effettuato';
    return 'connessa · '+cloudUser.email;
  }
  async function cloudSaveConfig(url, key){
    cloudCfg = {url:url.trim().replace(/\/$/,''), key:key.trim()};
    localStorage.setItem('traccian:cloud:url', cloudCfg.url);
    localStorage.setItem('traccian:cloud:key', cloudCfg.key);

    await restoreCloudSession();

  async function cloudSignUp(email, pw){

    cloudBusy=true; render();

    cloudBusy=false;
    if(error){ alert('Errore registrazione: '+error.message); logAccessEvent('login','fallito','operatore',null,email); render(); return; }
    if(data.user && !data.session){ alert('Controlla la casella email per confermare l\'account, poi accedi.'); cloudUser=null; }
    else { cloudUser = data.user; await checkRole(); await claimSession(); historyCache=null; logAccessEvent('login','successo','operatore',cloudUser.id,email); view = patientProfile ? 'patientHome' : 'operatorHome'; }

  async function cloudSignIn(email, pw){

    cloudBusy=false;

  // Login paziente: un solo campo (codice di accesso) — internamente si
  // traduce nell'email sintetica creata dalla funzione di creazione account.
  function patientCodeToEmail(code){ return code.trim().toLowerCase()+'@paz.traccian.local'; }
  async function cloudPatientSignIn(code){
    if(!sb) return;
    const normalized = code.trim().toUpperCase();
    cloudBusy=true; render();
    const { data, error } = await sb.auth.signInWithPassword({ email: patientCodeToEmail(normalized), password: normalized });
    cloudBusy=false;
    if(error){ alert('Codice non riconosciuto: '+error.message); logAccessEvent('login','fallito','paziente',null,normalized); render(); return; }
    cloudUser = data.user; await checkRole(); historyCache=null;
    if(!patientProfile){ alert('Questo account non risulta un account paziente valido.'); logAccessEvent('login','fallito','paziente',cloudUser.id,normalized); cloudUser=null; await cloudSignOut(); return; }
    if(patientProfile.attivo === false){ alert('Questo profilo è stato archiviato dall\'operatore e non può accedere in autonomia. Contatta la struttura.'); logAccessEvent('login','fallito','paziente',cloudUser.id,normalized); cloudUser=null; await cloudSignOut(); return; }
    await claimSession();
    logAccessEvent('login','successo','paziente',cloudUser.id,normalized);
    view='patientHome'; render();
  }
  async function cloudSignOut(){
    stopSessionGuard();
    if(cloudUser) logAccessEvent('logout','successo', patientProfile?'paziente':'operatore', cloudUser.id, cloudUser.email);
    if(sb) try{ await sb.auth.signOut(); }catch(e){}
    cloudUser = null; patientProfile = null; isSuperOperatore = false; historyCache = null;
    cachedRemotePatients = null; localPatientsCloudCache = null; accessLogCache = null;
    view='cloud'; render();
  }
  // Crea un nuovo account paziente tramite la Edge Function (unico punto che
  // può creare account, perché richiede la service_role key lato server —
  // mai esposta al browser). Restituisce {codiceAccesso, pazienteId} o null.
  async function createPatientAccount(codicePaziente){
    if(!sb || !cloudUser || patientProfile) return null; // solo operatori
    try{
      const { data: sessionData } = await sb.auth.getSession();
      const token = sessionData && sessionData.session ? sessionData.session.access_token : null;
      if(!token){ alert('Sessione non valida, riaccedi.'); return null; }
      const fnUrl = cloudCfg.url.replace(/\/$/,'') + '/functions/v1/create-patient';
      const resp = await fetch(fnUrl, {
        method:'POST',
        headers:{'Content-Type':'application/json', 'apikey': cloudCfg.key, 'Authorization':'Bearer '+token},
        body: JSON.stringify({codicePaziente})
      });
      let json = {};
      try{ json = await resp.json(); }catch(e){ /* risposta non-JSON, es. pagina di errore della piattaforma */ }
      if(!resp.ok){ alert('Errore creazione paziente ('+resp.status+'): '+(json.error||json.message||'la funzione create-patient non risponde correttamente — verifica di averla pubblicata con questo nome esatto.')); return null; }
      return json;
    }catch(e){ alert('Errore di rete nella creazione del paziente: '+e.message); return null; }
  }

  // Normalizza il programma di un paziente in un array {nome, cfg}[], sia per
  // i pazienti nuovi (programma_assegnato) sia per quelli assegnati prima
  // che esistesse il multi-esercizio (preset_assegnato singolo).
  function patientProgram(p){
    if(!p) return [];
    if(p.programma_assegnato && p.programma_assegnato.length) return p.programma_assegnato; // paziente remoto
    if(p.programma && p.programma.length) return p.programma; // paziente in presenza
    if(p.preset_assegnato){
      const c = p.preset_assegnato;
      const nome = EXERCISES[c.taskMode] ? EXERCISES[c.taskMode].label : c.taskMode;
      return [{nome, cfg:c}];

  function recToRow(rec){

      stim_duration: rec.stimDuration, resp_mode: rec.respMode, patient_code: rec.patientCode,
      notes: rec.notes, task_mode: rec.taskMode, target_seq: rec.targetSeq,

  function rowToRec(row){

      trials: row.trials, isi: row.isi, stimDuration: row.stim_duration, respMode: row.resp_mode,

  async function pushSession(rec){

        grid.appendChild(field('Percorso', segButtons(['casa','corpo','personalizzato'], cfg.memoriaLociTipo||'casa', v=>{cfg.memoriaLociTipo=v; render();}, {casa:'Casa tipo (16 tappe)', corpo:'Corpo (16 tappe)', personalizzato:'Personalizzato'})));

          const ta = el('textarea',{rows:6, style:'width:100%; font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line, #ccc);', placeholder:'Una tappa reale del paziente per riga, in ordine (es. il proprio ingresso di casa, la cucina, ecc.) — fino a 16 righe.'},[cfg.memoriaLociCustom||'']);
          ta.value = cfg.memoriaLociCustom||'';
          ta.addEventListener('change', ()=>{ cfg.memoriaLociCustom = ta.value; });
          grid.appendChild(field('Tappe del paziente (una per riga)', ta));
        }
      }
      grid.appendChild(field('Livello (1-16)', stepper(cfg.memoriaLivello,1,16,v=>{cfg.memoriaLivello=v; if(cfg.memoriaFormaIdx>=memoriaNForme(cfg.memoriaModo,v)) cfg.memoriaFormaIdx=0; render();},1)));
      if((cfg.memoriaModo==='pqrst' || cfg.memoriaModo==='chunking')){
        const nForme = memoriaNForme(cfg.memoriaModo, cfg.memoriaLivello);
        if(nForme>1){
          const lettere = ['A','B','C','D','E','F','G','H','I','J'];
          const opzioni = lettere.slice(0,nForme);
          // Segnala le forme già usate con questo paziente, a questo
          // livello e con questa tecnica — solo informativo (non blocca
          // la scelta), per aiutare l'operatore a evitare ripetizioni non
          // necessarie nel confronto RCI. Best-effort su historyCache già
          // caricata (se non ancora popolata, nessun tag: mai bloccante).
          const usate = memoriaFormeUsatePerPaziente(cfg.patientCode, cfg.memoriaModo, cfg.memoriaLivello);
          const labelsMap = {};
          opzioni.forEach(l=>{ labelsMap[l] = l + (usate.has(l) ? ' ✓ già usata' : ''); });
          grid.appendChild(field('Forma (parallela — scegli a mano per baseline/intermedia/finale)', segButtons(opzioni, lettere[cfg.memoriaFormaIdx]||'A', v=>{cfg.memoriaFormaIdx=lettere.indexOf(v); render();}, labelsMap)));
        }
      }
    } else if(isGoalTask){
      const scKeys = Object.keys(GOALTASK_SCENARIOS);
      grid.appendChild(field('Scenario', segButtons(scKeys, cfg.goaltaskScenario, v=>{cfg.goaltaskScenario=v; render();}, Object.fromEntries(scKeys.map(k=>[k, GOALTASK_SCENARIOS[k].label])))));
      grid.appendChild(field('Livello di complessità', segButtons(['1','2','3','4','5'], String(cfg.goaltaskLivello), v=>{cfg.goaltaskLivello=parseInt(v,10); render();}, {'1':'1 — molto facile', '2':'2 — facile', '3':'3 — medio', '4':'4 — difficile', '5':'5 — molto difficile'})));
    } else if(!isNeglect){
      grid.appendChild(field('Numero di prove', stepper(cfg.trials,10,100,v=>{cfg.trials=v; updateDurEst();},4)));
      // ISI
      grid.appendChild(field('Intervallo tra stimoli (ISI)', stepper(cfg.isi,1000,4000,v=>{cfg.isi=v; updateDurEst();},200,ms=>(ms/1000).toFixed(1)+' s')));
      // stim duration
      grid.appendChild(field('Durata di presentazione', stepper(cfg.stimDuration,200,Math.min(2000,cfg.isi),v=>{cfg.stimDuration=Math.min(v,cfg.isi-100);},100,ms=>ms+' ms')));
    } else {
      grid.appendChild(field('Modalità', segButtons(['classico','intruso','regola'], cfg.neglectMode, v=>{
        cfg.neglectMode=v;
        if(v==='regola' && cfg.stimType!=='numeri' && cfg.stimType!=='lettere'){ cfg.stimType='lettere'; regenerateParolePool(); }
        if(v!=='classico') cfg.targetSeq = [];
        render();
      }, {classico:'Classico (bersagli noti)', intruso:'Trova l\'intruso', regola:'Conteggio a regola'})));
      if(cfg.neglectMode==='intruso'){
        grid.appendChild(field('Alfabeto', segButtons(['auto','latino_cirillico','greco','armeno'], cfg.neglectAlphabet, v=>{cfg.neglectAlphabet=v; render();}, {auto:'Automatico per livello', latino_cirillico:'Solo latino/cirillico', greco:'Forza: + greco', armeno:'Forza: + armeno'})));
      }
      if(cfg.neglectMode==='regola'){
        grid.appendChild(field('Complessità regola (1-5)', stepper(cfg.neglectRuleLevel,1,5,v=>{cfg.neglectRuleLevel=v; render();},1)));
        grid.appendChild(field('Selezione condizioni', segButtons(['auto','manuale'], cfg.neglectRuleClauses?'manuale':'auto', v=>{
          cfg.neglectRuleClauses = v==='manuale' ? ['base'] : null; render();
        }, {auto:'Automatica (cumulativa per livello)', manuale:'Manuale (scelgo io le condizioni)'})));
        if(cfg.neglectRuleClauses){
          const CLAUSE_LABELS = {base:'Pari/vocale (base — sempre attiva)', colore:'Colore rosso', riga:'Riga pari', sfondo:'Sfondo colorato'};
          const wrap = el('div',{class:'seg'});
          ['base','colore','riga','sfondo'].forEach(k=>{
            const on = cfg.neglectRuleClauses.includes(k);
            const b = el('button',{class:on?'on':'', onclick:()=>{
              if(k==='base') return; // sempre attiva, è la condizione minima classificabile
              if(on) cfg.neglectRuleClauses = cfg.neglectRuleClauses.filter(x=>x!==k);
              else cfg.neglectRuleClauses = cfg.neglectRuleClauses.concat([k]);
              render();
            }},[CLAUSE_LABELS[k]]);
            wrap.appendChild(b);
          });
          grid.appendChild(field('Condizioni attive (tocca per attivare/disattivare)', wrap));
        }
      }
      grid.appendChild(field('Numero di tavole', stepper(cfg.trials,1,10,v=>{cfg.trials=v;},1)));
      grid.appendChild(field('Elementi per tavola', stepper(cfg.neglectBoardSize,15,80,v=>{cfg.neglectBoardSize=v;},5)));
      grid.appendChild(field('Layout', segButtons(['griglia','sparsa'], cfg.neglectLayout, v=>{cfg.neglectLayout=v; render();}, {griglia:'Organizzato (griglia)', sparsa:'Sparso (libero)'})));
      if(cfg.neglectMode==='classico'){
        grid.appendChild(field('Gradiente sinistra/destra', stepper(cfg.neglectGradient,0,100,v=>{cfg.neglectGradient=v; render();},5,v=> v+'% sin. / '+(100-v)+'% des.')));
        grid.appendChild(field('Sollecitazione bottom-up', segButtons(['auto','off'], cfg.neglectBottomUp, v=>{cfg.neglectBottomUp=v; render();}, {auto:'Automatica (solo livelli bassi, se emerge asimmetria)', off:'Disattivata (consigliata in rivalutazione)'})));
      }
      grid.appendChild(field('Tempo limite per tavola', stepper(cfg.neglectTimeLimit,0,180,v=>{cfg.neglectTimeLimit=v;},15,s=> s===0?'nessuno':s+' s')));
      grid.appendChild(field('Difficoltà adattiva', segButtons(['no','si'], cfg.adaptive?'si':'no', v=>{ cfg.adaptive = v==='si'; render(); }, {no:'Fissa (manuale)', si:'Adattiva automatica'})));
    }

    // target rate — riusato con etichetta diversa per ciascun esercizio
    const rateLabels = {
      nback:'Frequenza target', sequenza:'Frequenza target', gonogo:'Frequenza no-go',
      stopsignal:'Frequenza trial di stop', switching:'Frequenza cambio regola'
    };
    if(rateLabels[cfg.taskMode]){
      grid.appendChild(field(rateLabels[cfg.taskMode], stepper(Math.round(cfg.targetRate*100),15,45,v=>{cfg.targetRate=v/100; render();},5,v=>v+'%')));
    }

    // Stop-Signal: parametri dello staircase SSD
    if(cfg.taskMode==='stopsignal'){
      grid.appendChild(field('Ritardo iniziale segnale di stop (SSD)', stepper(cfg.ssd,0,cfg.isi-100,v=>{cfg.ssd=v; render();},50,ms=>ms+' ms')));
      grid.appendChild(field('Passo di adattamento SSD', stepper(cfg.ssdStep,10,150,v=>{cfg.ssdStep=v; render();},10,ms=>ms+' ms')));
    }

    card.appendChild(grid);
    if(cfg.taskMode!=='neglect' && !isGoalTask && !isMemoria){
      card.appendChild(field('Progressione durante la sessione', segButtons(['si','no'], cfg.showTrail?'si':'no', v=>{ cfg.showTrail = v==='si'; render(); }, {si:'Mostra (pallini verdi/rossi)', no:'Nascosta'})));
    }

    if(ex.usesTargetSeq && !(cfg.taskMode==='neglect' && cfg.neglectMode!=='classico')){
      card.appendChild(sequenceEditor());
    }
    if(isNeglect){
      if(cfg.neglectMode==='classico'){
        card.appendChild(el('p',{class:'hint'},['Compaiono molti elementi contemporaneamente sulla tavola: quelli scelti sopra sono i bersagli da toccare, tutti gli altri sono distrattori. Il gradiente permette di caricare deliberatamente un lato; la tavola avanza solo quando tocchi "Fatto" — mai da sola, nemmeno se hai già trovato tutti i bersagli — così devi monitorare tu stesso l\'avanzamento.']));
      } else if(cfg.neglectMode==='intruso'){
        card.appendChild(el('p',{class:'hint'},['Ricerca visiva a singolarità: un solo elemento sulla tavola non ha alcun doppione. Ai livelli bassi il resto della tavola è ripetitivo (poche identità molto ripetute, il singolo spicca per contrasto); ai livelli alti diventa eterogeneo (quasi ogni elemento ha un solo doppione, serve confrontarli uno per uno). La tavola avanza solo quando tocchi "Fatto".']));
      } else {
        card.appendChild(el('p',{class:'hint'},['Conteggio/ricerca a regola composta: la regola cresce di una condizione in più ad ogni livello (1-5), cumulativa. La tavola avanza solo quando tocchi "Fatto".']));
      }
      if(cfg.adaptive){
        card.appendChild(el('p',{class:'hint'},['Con l\'adattivo attivo, elementi per tavola e tempo limite crescono/calano insieme in base all\'accuratezza (regola 70-85%)'+(cfg.neglectMode==='classico'?'; il gradiente si sposta automaticamente verso il lato che va peggio tavola dopo tavola, fino a un massimo di 75/25.':'.')]));
      }
    }
    if(cfg.taskMode==='ant'){
      card.appendChild(field('Modalità', segButtons(['classico','tapat'], cfg.antMode, v=>{cfg.antMode=v; render();}, {classico:'ANT classico (misura)', tapat:'TAPAT (training tonico/fasico)'})));
      if(cfg.antMode==='tapat'){
        card.appendChild(el('p',{class:'hint'},['Variante orientata al training, non alla misura: prima metà delle prove senza cue e con intervalli lunghi e imprevedibili (allerta tonica/sostenuta), seconda metà con intervalli più brevi e un cue di allerta in metà dei casi (allerta fasica). Risposta: tocca appena vedi il bersaglio, non c\'è scelta di direzione.']));
        if(cfg.adaptive){
          card.appendChild(el('p',{class:'hint'},['La difficoltà del blocco tonico (durata delle attese) sale se l\'accuratezza supera l\'85% negli ultimi 8 trial validi, scende sotto il 70% — 5 livelli, dalle attese brevi (2-4s) a quelle lunghe e imprevedibili (8-15s). Puoi comunque forzare il livello con i pulsanti +/– nella barra in alto durante la sessione.']));
        }
        card.appendChild(field('Componente spaziale (neglect)', segButtons(['no','si'], cfg.tapatSpatial?'si':'no', v=>{cfg.tapatSpatial = v==='si'; render();}, {no:'Solo centrale', si:'Bersaglio a sinistra/destra'})));
        if(cfg.tapatSpatial){
          card.appendChild(field('Gradiente sinistra/destra', stepper(cfg.tapatGradient,0,100,v=>{cfg.tapatGradient=v; render();},5,v=> v+'% sin. / '+(100-v)+'% des.')));
          card.appendChild(el('p',{class:'hint'},['Il bersaglio compare a sinistra o a destra invece che al centro, nella proporzione impostata. Con l\'adattivo attivo, il gradiente si sposta da solo verso il lato dove l\'accuratezza è più bassa — favorendo l\'esplorazione proprio dello spazio più trascurato, seduta dopo seduta.']));
        }
      } else {
        card.appendChild(field('Materiale', segButtons(['frecce','lettere','simboli'], cfg.antMaterial, v=>{cfg.antMaterial=v; render();}, {frecce:'Frecce (classico)', lettere:'Lettere (H/S)', simboli:'Simboli (●/■)'})));
        card.appendChild(el('p',{class:'hint'},['Versione semplificata dell\'Attention Network Test: allerta (cue presente/assente), orienting (cue spaziale valido/invalido), conflitto (flanker congruenti/incongruenti/neutri). Il paziente indica quale dei due elementi designati vede al centro.']));
        card.appendChild(el('p',{class:'hint'},['Il materiale non cambia la difficoltà — cambia solo il canale percettivo coinvolto. Utile per varietà tra sedute, o per evitare le frecce con pazienti con difficoltà visuospaziali specifiche.']));
        if(cfg.trials<60){
          card.appendChild(el('p',{class:'hint', style:'color:var(--alert);'},['⚠ Gli indici si calcolano su 9 combinazioni cue×congruenza: con meno di 60 prove, ciascuna media poggia su troppo pochi trial per essere affidabile. Consigliate almeno 60–90 prove per questo esercizio.']));
        }
      }
    }
    if(cfg.taskMode==='switching'){
      card.appendChild(field('Materiale', segButtons(Object.keys(SWITCH_RULESETS), cfg.switchMaterial, v=>{ cfg.switchMaterial=v; render(); }, {numeri:'Numeri', lettere:'Lettere', colori:'Colori', simboli:'Simboli', bivalente:'Bivalente (conflitto)'})));
      const rs = SWITCH_RULESETS[cfg.switchMaterial];
      card.appendChild(el('p',{class:'hint'},['Regole di questa sessione: "'+rs.ruleA.label+'" ↔ "'+rs.ruleB.label+'". Un\'etichetta prima di ogni stimolo indica quale regola è attiva in quel momento.']));
      if(cfg.switchMaterial==='bivalente'){
        card.appendChild(el('p',{class:'hint'},['Modalità a doppia dimensione (tipo di carattere + colore, assegnati indipendentemente): su metà delle prove le due dimensioni indicano la stessa risposta ("congruenti"), sull\'altra metà indicano risposte opposte ("incongruenti") — genera un indice di conflitto in stile Stroop, oltre allo switch cost. Consigliate almeno 60 prove per un indice di conflitto stabile.']));
      }
    }
    if(cfg.taskMode==='categorizzazione'){
      card.appendChild(field('Livello (1-10)', stepper(cfg.categLivello,1,10,v=>{cfg.categLivello=v; render();},1)));
      const cStruct = categStructureOfLevel(cfg.categLivello);
      if(cStruct===1 || cStruct===4){
        card.appendChild(field('Materiale', segButtons(['colori','simboli'], cfg.categMateriale, v=>{cfg.categMateriale=v; render();}, {colori:'Colori', simboli:'Simboli'})));
      }
      const CATEG_LEVEL_HINTS = {
        1:'Singola dimensione, regola fissa per tutta la sessione (nessun costo di switch, a differenza del Task-switching) — ISI ampio.',
        2:'Stessa struttura del livello 1 — ISI più stretto (pressione di velocità).',
        3:'Doppia dimensione con no-go: 3 risposte attive più un caso in cui non si deve rispondere — ISI ampio.',
        4:'Stessa struttura del livello 3 — ISI più stretto.',
        5:'Stessa doppia dimensione, ricombinata in una regola disgiuntiva a 2 risposte ("A se... oppure...") — ISI ampio.',
        6:'Stessa struttura del livello 5 — ISI più stretto.',
        7:'Confronto con lo stimolo precedente (1-back sulla categoria) — nessun trial lure.',
        8:'Stessa struttura del livello 7, con trial lure: stessa categoria di 2 prove fa invece che 1 (sembra familiare ma la risposta corretta resta "nessuna risposta").',
        9:'Doppia dimensione mappata direttamente su 4 risposte — nessun no-go, nessuna disgiunzione — ISI ampio.',
        10:'Stessa struttura del livello 9 — ISI più stretto.'
      };
      card.appendChild(el('p',{class:'hint'},[CATEG_LEVEL_HINTS[cfg.categLivello]]));
    }
    if(cfg.taskMode==='dualtask'){
      card.appendChild(field('Accoppiamento canali', segButtons(['vis-aud','vis-vis','aud-aud'], cfg.dualPairing, v=>{ cfg.dualPairing=v; render(); }, {'vis-aud':'Visivo + Uditivo', 'vis-vis':'Visivo + Visivo', 'aud-aud':'Uditivo + Uditivo'})));
      if(cfg.dualPairing==='vis-aud'){
        card.appendChild(field('Materiale canale visivo', segButtons(['lettere','numeri','simboli','colori'], cfg.dualVisual, v=>{ cfg.dualVisual=v; render(); }, STIM_LABELS)));
        card.appendChild(el('p',{class:'hint'},['Canale visivo ('+STIM_LABELS[cfg.dualVisual].toLowerCase()+') e canale uditivo (toni) simultanei, ciascuno con regola 1-back propria.']));
      } else if(cfg.dualPairing==='vis-vis'){
        card.appendChild(field('Materiale canale 1 (sinistra)', segButtons(['lettere','numeri','simboli','colori'], cfg.dualVisual, v=>{ cfg.dualVisual=v; render(); }, STIM_LABELS)));
        card.appendChild(field('Materiale canale 2 (destra)', segButtons(['lettere','numeri','simboli','colori'], cfg.dualVisual2, v=>{ cfg.dualVisual2=v; render(); }, STIM_LABELS)));
        card.appendChild(el('p',{class:'hint'},['Due flussi visivi simultanei, uno a sinistra ('+STIM_LABELS[cfg.dualVisual].toLowerCase()+') e uno a destra ('+STIM_LABELS[cfg.dualVisual2].toLowerCase()+'), ciascuno con regola 1-back propria.']));
      } else {
        card.appendChild(el('p',{class:'hint'},['Due toni simultanei di registro diverso (uno grave, uno acuto), ciascuno con regola 1-back propria — nessuno stimolo visivo.']));
      }
      card.appendChild(el('p',{class:'hint'},['Ogni canale ha un proprio livello (1-10, pulsanti C1/C2 in barra alta), che regola sia la frequenza bersaglio sia la frequenza di trial lure (foil identico a quello di 2 prove fa invece che 1, stessa logica del lure nell\'N-back) — i lure compaiono solo dal livello 2 in su.']));
    }
    if(cfg.taskMode==='nback' && cfg.adaptive){
      card.appendChild(el('p',{class:'hint'},['Il livello sale di 1 se l\'accuratezza supera l\'85% negli ultimi 8 trial validi, scende sotto il 70% (fascia 70–85% invariata) — livello minimo 1, massimo 10. n cresce solo a un cambio di banda (1 ai livelli 1-4, 2 ai livelli 5-9, 3 al solo livello 10); dentro ogni banda la difficoltà sale con la frequenza bersaglio e con i trial lure. Durante la sessione puoi comunque forzare il livello manualmente con i pulsanti +/– nella barra in alto: l\'automatismo riprende dal valore che imposti.']));
    }

    // response mode
    if(!isGoalTask && !isMemoria){
      const respWrap = el('div',{class:'field'});
      respWrap.appendChild(el('label',{},['Modalità di raccolta risposte']));
      respWrap.appendChild(segButtons(['paziente','manuale'], cfg.respMode==='operatore'?'paziente':cfg.respMode, v=>{cfg.respMode=v; render();}, {
        paziente:'Touch (chi tocca lo schermo)', manuale:'Inserimento manuale a fine sessione'
      }));
      card.appendChild(respWrap);
    }
    if(isMemoria){
      card.appendChild(el('p',{class:'hint'},['Il richiamo viene valutato dall\'operatore, non in automatico: dopo la fase di studio, il paziente racconta/richiama a voce, e tu spunti sullo schermo cosa ha effettivamente recuperato.']));
    }

    // voice toggle for verbal stimuli
    if(ex.usesStimType && !isClassicAnt && ['lettere','numeri','parole'].includes(cfg.stimType)){
      const vWrap = el('div',{class:'field'});
      vWrap.appendChild(el('label',{},['Presentazione']));
      vWrap.appendChild(segButtons(['no','si'], cfg.voice?'si':'no', v=>{cfg.voice = v==='si'; render();}, {no:'Visiva', si:'Visiva + uditiva (sintesi vocale)'}));
      card.appendChild(vWrap);
    }

    // patient code
    const pc = el('div',{class:'field'});
    pc.appendChild(el('label',{},['Codice paziente (facoltativo, non usare il nominativo)']));
    const inp = el('input',{type:'text', placeholder:'es. PT-014', value:cfg.patientCode});
    inp.addEventListener('input', e=>{ cfg.patientCode = e.target.value; });
    pc.appendChild(inp);
    card.appendChild(pc);

    const durEstP = el('p',{class:'hint'},[isGoalTask
      ? (()=>{ const sc = goalTaskInstanceFor(cfg.goaltaskScenario, cfg.goaltaskLivello); return (sc.budgetSecondi ? 'Tempo a disposizione: '+fmtTime(sc.budgetSecondi*1000)+'. ' : 'Nessun limite di tempo. ')+sc.items.length+' elementi'+(sc.regole.length?', con regola attiva':'')+'.'; })()
      : isMemoria
      ? (()=>{ const m = memoriaMaterialFor(cfg); return memoriaEffectiveMateriale(cfg)==='lista' ? m.parole.length+' parole da ricordare.' : Math.round(m.testo.split(/\s+/).length)+' parole nel brano, '+m.unita.length+' idee-chiave da riconoscere al richiamo.'; })()
      : 'Durata stimata della sessione: '+fmtTime(cfg.isi*cfg.trials)+'.']);
    function updateDurEst(){ if(isGoalTask || isMemoria) return; durEstP.textContent = 'Durata stimata della sessione: '+fmtTime(cfg.isi*cfg.trials)+'.'; }
    card.appendChild(durEstP);

    if(buildingProgramFor){
      card.appendChild(el('button',{class:'primary', onclick: async ()=>{
        if(cfg.taskMode==='sequenza' && cfg.targetSeq.length<2){ alert('Costruisci prima la sequenza bersaglio (almeno 2 elementi).'); return; }
        if(cfg.taskMode==='gonogo' && (!cfg.targetSeq || cfg.targetSeq.length<1)){ alert('Seleziona prima l\'elemento no-go.'); return; }
        if(cfg.taskMode==='neglect' && cfg.neglectMode==='classico' && (!cfg.targetSeq || cfg.targetSeq.length<1)){ alert('Seleziona prima almeno un elemento bersaglio da cancellare.'); return; }
        const entry = { nome: autoNameFor(cfg), cfg: presetCfgOf(cfg) };
        const ok = await appendProgramEntry(buildingProgramFor.kind, buildingProgramFor.id, entry);
        if(ok){ programAddConfirmation = '✓ "'+entry.nome+'" aggiunto — configura il prossimo, o "Fatto" per tornare al programma.'; render(); }
      }},['+ Aggiungi al programma di '+buildingProgramFor.nome]));
      if(programAddConfirmation) card.appendChild(el('p',{class:'hint', style:'color:var(--signal); font-weight:600;'},[programAddConfirmation]));
      card.appendChild(el('button',{class:'ghost', style:'margin-top:8px;', onclick:()=>{
        const kind = buildingProgramFor.kind;
        buildingProgramFor=null; programAddConfirmation=null;
        view = kind==='local' ? 'localPatientPicker' : 'patients';
        render();
      }},['Fatto — torna al programma']));
    } else {
      card.appendChild(el('button',{class:'primary', onclick:()=>{
        if(cfg.taskMode==='sequenza' && cfg.targetSeq.length<2){ alert('Costruisci prima la sequenza bersaglio (almeno 2 elementi).'); return; }
        if(cfg.taskMode==='gonogo' && (!cfg.targetSeq || cfg.targetSeq.length<1)){ alert('Seleziona prima l\'elemento no-go.'); return; }
        if(cfg.taskMode==='neglect' && cfg.neglectMode==='classico' && (!cfg.targetSeq || cfg.targetSeq.length<1)){ alert('Seleziona prima almeno un elemento bersaglio da cancellare.'); return; }
        view='instructions'; render();
      }},['Avvia sessione']));
    }

    const nav = el('div',{class:'navlinks'});
    nav.appendChild(el('button',{class:'link', onclick:()=>{ view='history'; render(); }},['Storico sessioni →']));
    nav.appendChild(el('button',{class:'link', onclick:()=>{ view='cloud'; render(); }},['Sincronizzazione cloud ('+cloudStatusLabel()+') →']));
    card.appendChild(nav);

    s.appendChild(card);
    root.appendChild(s);
  }

  function field(label, control){
    const f = el('div',{class:'field'});
    f.appendChild(el('label',{},[label]));
    f.appendChild(control);
    return f;
  }
  function segButtons(values, current, onPick, labels){
    const wrap = el('div',{class:'seg'});
    values.forEach(v=>{
      const b = el('button',{class: v===current?'on':'', onclick:()=>onPick(v)},[(labels&&labels[v])||v]);
      wrap.appendChild(b);
    });
    return wrap;
  }
  function stepper(val,min,max,onChange,step,fmt){
    step = step||1;
    let cur = val;
    const wrap = el('div',{class:'stepper'});
    const valNode = el('div',{class:'val'},[fmt? fmt(cur) : String(cur)]);
    function set(nv){
      cur = Math.max(min,Math.min(max,nv));
      valNode.textContent = fmt? fmt(cur) : String(cur);
      onChange(cur);
    }
    wrap.appendChild(el('button',{onclick:()=>set(cur-step)},['–']));
    wrap.appendChild(valNode);
    wrap.appendChild(el('button',{onclick:()=>set(cur+step)},['+']));
    return wrap;
  }

  /* ---------- TASK ENGINE ---------- */
  function startSession(){
    regenerateNumeriPool();
    regenerateParolePool();
    if(cfg.taskMode==='neglect'){ startNeglectSession(); return; }
    if(cfg.taskMode==='goaltask'){ startGoalTaskSession(); return; }
    if(cfg.taskMode==='memoria'){ startMemoriaSession(); return; }
    const isTapat = cfg.taskMode==='ant' && cfg.antMode==='tapat';
    const isIncremental = cfg.taskMode==='nback' || isTapat || cfg.taskMode==='gonogo' || cfg.taskMode==='dualtask';
    session = {
      // n-back, TAPAT e Go/No-Go generano le prove una alla volta (serve
      // per poter cambiare livello a metà sessione, manualmente o in
      // automatico); gli altri esercizi restano pre-generati come prima
      // (la loro adattività riguarda solo l'ISI o il CSI, non il contenuto
      // delle prove, quindi non serve rigenerarle).
      seq: isIncremental ? [] : buildSequence(),
      idx:-1, timer:null, timerInfo:null, phase:'idle',
      counts:{hits:0, misses:0, falseAlarms:0, correctRejections:0, targets:0, nonTargets:0},
      countsAud:{hits:0, misses:0, falseAlarms:0, correctRejections:0, targets:0, nonTargets:0},
      choiceLog:[], // {correct:bool, rt, isSwitch, cueType, congruency}
      fatigueLog:[], // sequenza di bool corretto/scorretto, prova per prova — solo per l'indicatore di calo intra-sessione (famiglia signal)
      trail:[], responses:new Set(), respTime:null, trialStart:0,
      rts:[], startedAt: Date.now(), paused:false, pausedAt:null,
      currentSSD: cfg.ssd, ssdHistory:[], showStopCue:false, stopCueTimer:null,
      liveNLevel: cfg.nLevel, tapatLevel: cfg.tapatStartLevel, adaptLevel: cfg.adaptStartLevel, liveTapatGradient: cfg.tapatGradient,
      dualLevel1: cfg.dualStartLevel1, dualLevel2: cfg.dualStartLevel2, adaptBlock1:[], adaptBlock2:[], prevDual1:null, prevDual2:null,
      adaptBlock:[], levelChanges:[]
    };
    view='task'; render();
    nextTrial();
  }
  /* ---- Motore Cancellazione/Neglect: tavole con molti elementi simultanei,
     tocco diretto sui bersagli, non un ciclo di prove sequenziali. ---- */
  function shuffleArr(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
  // Pool per la modalità "intruso": glifi facilmente confondibili fra loro
  // a colpo d'occhio (lettere latine di forma simile + alcuni equivalenti
  // visivi da altri alfabeti) — la ricerca deve basarsi sulla forma, non su
  // categorie ovvie come "lettera vs numero". Non è un pool linguistico,
  // sono scelti solo per la somiglianza percettiva.
  // Famiglie di glifi per "Trova l'intruso", in ordine di difficoltà
  // percettiva crescente per chi è abituato all'alfabeto latino: la
  // cirillica condivide molte forme quasi identiche al latino (a/а, e/е,
  // o/о...), il greco ne condivide alcune ma introduce forme più estranee
  // (α, θ, λ), l'armeno è quasi interamente nuovo — massima difficoltà
  // percettiva perché non si può fare leva su somiglianze pregresse.
  const INTRUSO_FAMILIES = {
    latino_cirillico: ['a','e','o','p','c','x','y','k','n','u','v','w','m','h','s','z', 'а','е','о','р','с','х','і','ѕ'], // 16 latine + 8 cirilliche
    greco: ['α','β','γ','δ','θ','λ','μ','π','σ','τ','φ','χ'], // 12 lettere greche minuscole, alcune confondibili con il latino (α/a, χ/x, τ/t)
    armeno: ['ա','բ','գ','դ','ե','զ','է','թ','ի','լ','խ','ծ'] // 12 lettere armene minuscole — quasi nessuna somiglianza col latino
  };
  // 'auto' = progressione automatica per livello (solo latino/cirillico ai
  // livelli 1-3, si aggiunge il greco al 4, l'armeno al 5) — coerente con
  // la filosofia "stack": la difficoltà percettiva cresce insieme al
  // numero di identità distinte già gestito da INTRUSO_DISTINCT_FRACTION.
  // In alternativa l'operatore può forzare una famiglia fissa per tutta la
  // sessione (utile per allenare specificamente un pattern percettivo).
  function intrusoPoolFor(alphabetCfg, livello){
    if(alphabetCfg && alphabetCfg!=='auto') return INTRUSO_FAMILIES[alphabetCfg] || INTRUSO_FAMILIES.latino_cirillico;
    let pool = INTRUSO_FAMILIES.latino_cirillico.slice();
    // Soglie riproporzionate da 4/5 (vecchia scala 1-5) a 7/9 sulla nuova
    // scala 1-10, stessa posizione relativa (80%/100% della scala).
    if(livello>=7) pool = pool.concat(INTRUSO_FAMILIES.greco);
    if(livello>=9) pool = pool.concat(INTRUSO_FAMILIES.armeno);
    return pool;
  }
  const INTRUSO_POOL = INTRUSO_FAMILIES.latino_cirillico; // fallback storico, usato solo se qualcosa chiama il pool senza passare da intrusoPoolFor
  // Quante identità DISTINTE usare fra i non-bersaglio, come frazione del
  // massimo possibile per quella tavola: a livelli bassi poche identità
  // molto ripetute (campo omogeneo, il singolo spicca per contrasto —
  // ricerca "a colpo d'occhio"), a livelli alti tante identità quasi tutte
  // in semplice coppia (campo eterogeneo, serve confrontare quasi ogni
  // elemento con il suo eventuale doppione — ricerca seriale, più lenta e
  // impegnativa). Non è la dimensione della tavola a cambiare per livello
  // (quella la gestisce già ADAPT_NEGLECT_SIZE), è quanto la tavola è
  // ripetitiva al suo interno.
  const INTRUSO_DISTINCT_FRACTION = {1:0.10, 2:0.18, 3:0.28, 4:0.40, 5:0.55, 6:0.68, 7:0.80, 8:0.90, 9:0.96, 10:1.0}; // esteso da 5 a 10 livelli, stessa progressione pavimento-più-basso/soffitto-più-alto delle altre tabelle
  // Regole composte per la modalità "regola": ogni livello aggiunge UNA
  // condizione in più rispetto al precedente, cumulativa (livello 3
  // contiene anche le condizioni del livello 1 e 2) — stessa filosofia
  // "stack, non replace" già usata per gli scenari ecologici. "colore" e
  // "riga pari" sono dimensioni aggiunte apposta per la modalità, non
  // proprietà naturali di lettere/numeri.
  // manualClauses: se presente (array di chiavi 'base'|'colore'|'riga'|
  // 'sfondo'), sostituisce la progressione automatica per livello con la
  // combinazione scelta dall'operatore — permette sia condizioni singole
  // sia combinazioni multiple in qualunque ordine, non solo cumulative.
  // Sollecitazione bottom-up (solo modalità classico): non è un cue sempre
  // acceso, ma reattivo — si attiva solo quando, DENTRO la tavola in corso,
  // è già evidente uno squilibrio (il paziente ha trovato molti più
  // bersagli su un lato che sull'altro), e solo ai livelli bassi (dove
  // l'esplorazione autonoma top-down potrebbe non bastare da sola). Il
  // lato "debole" coincide con quello che il gradiente adattivo sta già
  // caricando di più (vedi finishBoard): gradiente >50 = si sta caricando
  // sinistra perché sinistra è il lato che va peggio.
  function neglectBottomUpWeakSide(){
    if(cfg.neglectMode!=='classico' || cfg.neglectBottomUp==='off') return null;
    if(!cfg.adaptive || !session || session.liveBoardLevel==null) return null;
    if(session.liveBoardLevel > 4) return null; // solo ai livelli bassi (era 1-2 su scala 1-5, riproporzionato a 1-4 su scala 1-10)
    const gradient = session.liveGradient!=null ? session.liveGradient : cfg.neglectGradient;
    if(Math.abs(gradient-50) < 15) return null; // nessuna asimmetria ancora emersa
    const weakSide = gradient > 50 ? 'left' : 'right';
    const strongSide = weakSide==='left' ? 'right' : 'left';
    if(!session.board || !session.board.length) return null;
    const foundWeak = session.board.filter(b=> b.side===weakSide && b.found).length;
    const foundStrong = session.board.filter(b=> b.side===strongSide && b.found).length;
    const remainingWeak = session.board.some(b=> b.side===weakSide && b.isTarget && !b.found);
    if(!remainingWeak) return null; // niente rimasto da segnalare su quel lato
    if(foundStrong - foundWeak < 3) return null; // lo squilibrio in questa tavola non è (ancora) evidente
    return weakSide;
  }
  function neglectRuleFor(stimType, livello, manualClauses){
    // Resta volutamente a 5 (max 4 condizioni simultanee), indipendente
    // dalla scala adattiva 1-10 di liveBoardLevel — è uno stepper manuale
    // a parte (cfg.neglectRuleLevel), e oltre 4 condizioni la regola
    // diventa arbitraria da tenere a mente, non più rappresentativa di
    // attenzione selettiva (vedi nota più sotto). Non è stato esteso.
    livello = Math.max(1, Math.min(5, livello||1));
    const CLAUSE_DEFS = {
      base: stimType==='numeri'
        ? {test:(v)=> parseInt(v.carattere,10)%2===0, label:'pari'}
        : {test:(v)=> 'AEIOU'.includes(v.carattere), label:'vocale'},
      colore: {test:(v)=> v.colore==='rosso', label:'rosso'},
      riga:   {test:(v)=> v.rigaPari, label:'in una riga pari'},
      sfondo: {test:(v)=> v.sfondo==='giallo', label:'con sfondo giallo'}
    };
    let keys;
    if(manualClauses && manualClauses.length){
      keys = manualClauses.includes('base') ? manualClauses : ['base'].concat(manualClauses);
    } else {
      keys = ['base'];
      if(livello>=2) keys.push('colore');
      if(livello>=3) keys.push('riga');
      if(livello>=4) keys.push('sfondo');
      // livello 5: stesse quattro condizioni, tavola più grande/tempo più
      // stretto (già gestito da ADAPT_NEGLECT_SIZE/TIME) — la soglia di
      // lettura del compito satura a 4 condizioni simultanee, oltre
      // diventa arbitrario da tenere a mente, non più rappresentativo di
      // attenzione selettiva.
    }
    const clauses = keys.map(k=>CLAUSE_DEFS[k]).filter(Boolean);
    const label = clauses.map(c=>c.label).join(' + ');
    return { test:(v)=> clauses.every(c=>c.test(v)), label, n: clauses.length };
  }
  // Layout condiviso dalle tre modalità: calcola posizioni non sovrapposte
  // per n elementi (griglia leggibile o layout sparso), con lato
  // sinistra/destra per ciascuna — usato sia per assegnare i bersagli per
  // lato (modalità classico) sia solo per l'osservazione post-hoc di dove
  // è caduto l'elemento raro (modalità intruso/regola, dove il lato non è
  // controllato in generazione ma resta comunque utile da registrare).
  function neglectLayoutPositions(n){
    const cols=8, rows=Math.ceil(n/cols);
    const cellW=100/cols, cellH=100/rows;
    let positions=[];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) positions.push({r,c});
    positions = shuffleArr(positions).slice(0,n);
    const scattered = cfg.neglectLayout==='sparsa';
    const MIN_DIST = 10, MAX_TRIES = 40;
    const placedPos = [];
    function candidatePos(p, side){
      if(scattered){
        return { x: side==='left' ? Math.random()*45+2 : Math.random()*45+53, y: Math.random()*90+5 };
      }
      return { x: p.c*cellW + cellW*(0.2+Math.random()*0.6), y: p.r*cellH + cellH*(0.2+Math.random()*0.6) };
    }
    return positions.map(p=>{
      const side = p.c < cols/2 ? 'left':'right';
      let pos, tries=0;
      do{ pos = candidatePos(p, side); tries++; }
      while(tries<MAX_TRIES && placedPos.some(o=> Math.hypot(o.x-pos.x, o.y-pos.y) < MIN_DIST));
      placedPos.push(pos);
      return {x:pos.x, y:pos.y, side, row:p.r, rigaPari: p.r%2===0};
    });
  }
  // Modalità "intruso": ricerca a singolarità (visual search) — sulla
  // tavola ogni glifo compare esattamente due volte, tranne uno che compare
  // una sola volta: quello è l'unico bersaglio. Il lato dove cade non è
  // controllato in generazione (a differenza del classico, che bilancia
  // deliberatamente sinistra/destra), ma viene comunque registrato — utile
  // come osservazione aggiuntiva, non come misura di neglect controllata.
  function buildNeglectBoardIntruso(){
    const n = cfg.adaptive ? (ADAPT_NEGLECT_SIZE[session.liveBoardLevel] || cfg.neglectBoardSize) : cfg.neglectBoardSize;
    const level = (session && session.liveBoardLevel) || cfg.neglectStartLevel || 3;
    const pool = intrusoPoolFor(cfg.neglectAlphabet, level);
    const nOdd = n % 2 === 0 ? n+1 : n; // deve essere dispari: bersaglio singolo + il resto ripetuto
    const slots = nOdd - 1; // posizioni da riempire con identità ripetute
    // Massimo di identità distinte che la tavola può ospitare restando
    // comunque "ripetute" (almeno 2 copie ciascuna) e senza eccedere il
    // pool di glifi disponibili.
    const maxK = Math.max(1, Math.min(Math.floor(slots/2), pool.length-1));
    const fraction = INTRUSO_DISTINCT_FRACTION[Math.max(1,Math.min(5,level))] || 1;
    const k = Math.max(1, Math.min(maxK, Math.round(maxK*fraction)));
    const shuffled = shuffleArr(pool.slice());
    const identities = shuffled.slice(0, k);
    const singleton = shuffled[k];
    // distribuisce gli slot il più equamente possibile fra le k identità
    // (ognuna riceve almeno 2 copie, per costruzione di maxK)
    let glyphSequence = [];
    for(let i=0;i<slots;i++){ glyphSequence.push(identities[i % k]); }
    glyphSequence.push(singleton);
    glyphSequence = shuffleArr(glyphSequence);
    const positions = neglectLayoutPositions(nOdd);
    return positions.map((p,i)=>{
      const val = glyphSequence[i];
      return {x:p.x, y:p.y, val, isTarget: val===singleton, side:p.side, found:false, falseTap:false};
    });
  }
  // Modalità "regola": conteggio/ricerca a regola composta e crescente
  // (colore, parità, riga pari — cumulativa per livello, vedi
  // neglectRuleFor). Ogni elemento è {carattere, colore, rigaPari}; il
  // colore è una dimensione aggiunta apposta, non naturale del materiale.
  function buildNeglectBoardRegola(){
    const stimType = (cfg.stimType==='numeri' || cfg.stimType==='lettere') ? cfg.stimType : 'lettere';
    const basePool = stimType==='numeri' ? ['1','2','3','4','5','6','7','8','9'] : ['A','E','I','O','U','B','C','D','F','G','H','L','M','N','P','R','S','T'];
    const n = cfg.adaptive ? (ADAPT_NEGLECT_SIZE[session.liveBoardLevel] || cfg.neglectBoardSize) : cfg.neglectBoardSize;
    const rule = neglectRuleFor(stimType, cfg.neglectRuleLevel, cfg.neglectRuleClauses);
    const positions = neglectLayoutPositions(n);
    return positions.map(p=>{
      const carattere = basePool[Math.floor(Math.random()*basePool.length)];
      const colore = Math.random()<0.5 ? 'nero' : 'rosso';
      const sfondo = Math.random()<0.5 ? 'giallo' : 'nessuno'; // sfondo ben visibile, dimensione indipendente dal colore del carattere
      const val = {carattere, colore, sfondo, rigaPari:p.rigaPari};
      return {x:p.x, y:p.y, val, isTarget: rule.test(val), side:p.side, found:false, falseTap:false};
    });
  }
  function buildNeglectBoard(){
    if(cfg.neglectMode==='intruso') return buildNeglectBoardIntruso();
    if(cfg.neglectMode==='regola') return buildNeglectBoardRegola();
    const pool = POOLS[cfg.stimType];
    const targets = cfg.targetSeq;
    const n = cfg.adaptive ? (ADAPT_NEGLECT_SIZE[session.liveBoardLevel] || cfg.neglectBoardSize) : cfg.neglectBoardSize;
    const targetCount = Math.max(4, Math.round(n*0.25));
    // gradiente continuo 0-100: 0=tutti i bersagli a destra, 100=tutti a
    // sinistra, 50=simmetrico. Con l'adattivo attivo, session.liveGradient
    // può essersi spostato verso il lato più debole (vedi finishBoard).
    const gradient = cfg.adaptive ? (session.liveGradient!=null ? session.liveGradient : cfg.neglectGradient) : cfg.neglectGradient;
    const leftRatio = gradient/100;
    let targetsLeft = Math.round(targetCount*leftRatio), targetsRight = targetCount-targetsLeft;
    const cols=8, rows=Math.ceil(n/cols);
    const cellW=100/cols, cellH=100/rows;
    let positions=[];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) positions.push({r,c});
    positions = shuffleArr(positions).slice(0,n);
    let li=0, ri=0;
    const scattered = cfg.neglectLayout==='sparsa';
    // Distanza minima tra i centri di due elementi (in punti percentuali
    // dell'area, 0-100) perché non si sovrappongano visivamente — gli
    // elementi occupano fino al 9% di larghezza ciascuno. Nel layout a
    // griglia funge da rete di sicurezza aggiuntiva rispetto alla cella;
    // nel layout sparso è l'unica cosa che evita la sovrapposizione, dato
    // che lì le coordinate erano scelte a caso senza alcun controllo.
    const MIN_DIST = 10;
    const MAX_TRIES = 40;
    const placedPos = [];
    function candidatePos(p, side){
      if(scattered){
        return {
          x: side==='left' ? Math.random()*45+2 : Math.random()*45+53,
          y: Math.random()*90+5
        };
      }
      // "griglia": piccola variazione dentro la cella (ordinato, leggibile).
      return {
        x: p.c*cellW + cellW*(0.2+Math.random()*0.6),
        y: p.r*cellH + cellH*(0.2+Math.random()*0.6)
      };
    }
    const items = positions.map((p,i)=>{
      const side = p.c < cols/2 ? 'left':'right';
      let pos, tries=0;
      do{ pos = candidatePos(p, side); tries++; }
      while(tries<MAX_TRIES && placedPos.some(o=> Math.hypot(o.x-pos.x, o.y-pos.y) < MIN_DIST));
      placedPos.push(pos);
      const x = pos.x, y = pos.y;
      let isTarget=false;
      if(side==='left' && li<targetsLeft){ isTarget=true; li++; }
      else if(side==='right' && ri<targetsRight){ isTarget=true; ri++; }
      let val;
      if(isTarget){ val = targets[Math.floor(Math.random()*targets.length)]; }
      else {
        let tries2=0;
        do{ val = pool[Math.floor(Math.random()*pool.length)]; tries2++; }
        while(targets.some(t=>seqLabel(t)===seqLabel(val)) && tries2<20 && pool.length>targets.length);
      }
      return {x, y, val, isTarget, side, found:false, falseTap:false};
    });
    return items;
  }
  function startNeglectSession(){
    session = {
      boardIdx:0, totalBoards:cfg.trials, board:[], boardStartTime:0, startedAt:Date.now(),
      timer:null, timerInfo:null, paused:false, pausedAt:null, liveBoardLevel:cfg.neglectStartLevel, liveGradient:cfg.neglectGradient, levelChanges:[],
      results:[] // {targetsLeft,targetsRight,foundLeft,foundRight,falseAlarms,timeMs,reason}
    };
    view='task'; render();
    nextBoard();
  }
  function nextBoard(){
    if(session.boardIdx >= session.totalBoards){ finishNeglectSession(); return; }
    session.board = buildNeglectBoard();
    session.boardStartTime = performance.now();
    render();
    const timeLimit = cfg.adaptive ? (ADAPT_NEGLECT_TIME[session.liveBoardLevel] ?? cfg.neglectTimeLimit) : cfg.neglectTimeLimit;
    if(timeLimit>0){
      scheduleStep(()=> finishBoard('tempo scaduto'), timeLimit*1000);
    }
  }
  function tapNeglectItem(item){
    if(!session || session.paused || item.found || item.falseTap) return;
    if(cfg.respMode==='manuale') return;
    if(item.isTarget) item.found = true; else item.falseTap = true;
    updateNeglectScreen();
    // Nota: la tavola NON avanza da sola nemmeno quando tutti i bersagli
    // sono stati trovati — deve essere il paziente/operatore a riconoscerlo
    // e toccare "Fatto", cosa che lo costringe a monitorare attivamente il
    // proprio avanzamento invece di procedere in automatico.
  }
  function finishBoard(reason){
    if(session.timer){ clearTimeout(session.timer); session.timer=null; session.timerInfo=null; }
    const timeMs = performance.now()-session.boardStartTime;
    const tL = session.board.filter(b=>b.side==='left'&&b.isTarget);
    const tR = session.board.filter(b=>b.side==='right'&&b.isTarget);
    const foundLeft = tL.filter(b=>b.found).length, foundRight = tR.filter(b=>b.found).length;
    session.results.push({
      targetsLeft:tL.length, targetsRight:tR.length,
      foundLeft, foundRight,
      falseAlarms:session.board.filter(b=>b.falseTap).length, timeMs, reason
    });
    if(cfg.adaptive){
      const totalTargets = tL.length+tR.length;
      const acc = totalTargets>0 ? (foundLeft+foundRight)/totalTargets : 1;
      if(acc > 0.85 && session.liveBoardLevel < currentLevelMax()){
        session.liveBoardLevel++;
        session.levelChanges.push({board:session.boardIdx, level:session.liveBoardLevel, how:'auto'});
      } else if(acc < 0.70 && session.liveBoardLevel > 1){
        session.liveBoardLevel--;
        session.levelChanges.push({board:session.boardIdx, level:session.liveBoardLevel, how:'auto'});
      }
      // il gradiente si sposta verso il lato che va peggio: se la
      // percentuale trovata a sinistra è più bassa di quella a destra (o
      // viceversa), la prossima tavola carica di più quel lato — fino a un
      // massimo di 75/25, mai totalmente monolaterale.
      const pctLeft = tL.length ? foundLeft/tL.length : 1, pctRight = tR.length ? foundRight/tR.length : 1;
      const base = session.liveGradient!=null ? session.liveGradient : cfg.neglectGradient;
      const step = 5;
      let ng = base;
      if(pctLeft < pctRight - 0.15) ng = Math.min(75, base+step); // sinistra più debole -> più bersagli a sinistra
      else if(pctRight < pctLeft - 0.15) ng = Math.max(25, base-step);
      session.liveGradient = ng;
    }
    session.boardIdx++;
    nextBoard();
  }

  // (session.liveNLevel), che può cambiare durante la sessione stessa.
  // Uguaglianza fra due valori pescati per l'N-back: identica a
  // sameSeqItem, ma richiamabile anche quando taskMode è 'nback' (non solo
  // 'sequenza'), per la modalità mista che riusa la stessa forma {stimType,
  // item} già usata dalla Sequenza bersaglio mista.
  function nbackSameVal(a,b){
    if(cfg.taskMode==='nback' && cfg.nbackMista) return a && b && a.stimType===b.stimType && a.item===b.item;
    return a===b;
  }
  function genNbackTrial(){
    const isMista = cfg.nbackMista;
    const pool = isMista ? null : POOLS[cfg.stimType];
    const randMista = ()=>{
      const t = SEQUENZA_MISTA_TYPES[Math.floor(Math.random()*SEQUENZA_MISTA_TYPES.length)];
      const p = POOLS[t];
      return {stimType:t, item:p[Math.floor(Math.random()*p.length)]};
    };
    const i = session.seq.length;
    const level = session.liveNLevel;
    const params = nbackParamsForLevel(level);
    const n = params.n;
    const freq = cfg.adaptive ? params.freq : cfg.targetRate;
    const lureFreq = params.lure;
    const lureLag = nbackLureLag(n);
    function runLen(val){ let run=1; for(let k=i-1;k>=0;k--){ if(nbackSameVal(session.seq[k].val,val)) run++; else break; } return run; }
    let makeTarget = i>=n && Math.random() < freq;
    let val, isLure=false;
    if(makeTarget){
      const cand = session.seq[i-n].val;
      if((isMista || pool.length>1) && runLen(cand) > 3){ makeTarget=false; } else { val = cand; }
    }
    if(!makeTarget){
      // Prova un trial lure: un foil che corrisponde allo scarto vicino a n
      // (n-1, o n+1 quando n=1) invece che a n — "sembra" familiare per
      // prossimità recente ma la risposta corretta resta "non rispondere".
      if(i>=lureLag && lureFreq>0 && Math.random()<lureFreq){
        const lureCand = session.seq[i-lureLag].val;
        const wouldBeRealTarget = i>=n && nbackSameVal(lureCand, session.seq[i-n].val);
        if(!wouldBeRealTarget && (isMista || pool.length>1 ? runLen(lureCand)<=3 : true)){
          val = lureCand; isLure = true;
        }
      }
      if(val===undefined){
        do{ val = isMista ? randMista() : pool[Math.floor(Math.random()*pool.length)]; }
        while((isMista || pool.length>1) && ((i>=n && nbackSameVal(val, session.seq[i-n].val)) || runLen(val)>3));
      }
    }
    const trial = {val, isTarget: i>=n ? makeTarget : false, valid:i>=n, nAtGeneration:n, isLure};
    session.seq.push(trial);
    return trial;
  }
  // Titolazione automatica: valuta un blocco di 8 prove valide alla volta.
  // Livelli di difficoltà TAPAT: più alto = attese toniche più lunghe e
  // imprevedibili (più difficile sostenere l'attenzione da soli).
  const TAPAT_LEVELS = { 1:[900,1800],2:[1400,2600],3:[2000,4000],4:[3000,6000],5:[4000,8000],6:[5000,9500],7:[6000,11000],8:[8000,13000],9:[10000,18000],10:[12000,25000] };
  // Go/No-Go: generazione incrementale, necessaria perché con l'adattivo
  // attivo la frequenza no-go cambia durante la sessione.
  function genGoNoGoTrial(){
    const pool = POOLS[cfg.stimType];
    const fullSet = cfg.targetSeq;
    const count = cfg.adaptive ? Math.min(fullSet.length, ADAPT_GONOGO_COUNT[session.adaptLevel]||1) : fullSet.length;
    const activeNoGo = fullSet.slice(0, Math.max(1,count));
    const freq = cfg.adaptive ? (ADAPT_GONOGO_FREQ[session.adaptLevel] || cfg.targetRate) : cfg.targetRate;
    let val;
    if(Math.random() < freq){ val = activeNoGo[Math.floor(Math.random()*activeNoGo.length)]; }
    else { do{ val = pool[Math.floor(Math.random()*pool.length)]; } while(activeNoGo.some(x=>seqLabel(x)===seqLabel(val)) && pool.length>activeNoGo.length); }
    const isNoGo = activeNoGo.some(x=>seqLabel(x)===seqLabel(val));
    const trial = {val, isTarget: !isNoGo, valid:true};
    session.seq.push(trial);
    return trial;
  }
  function genTapatTrial(){
    const i = session.seq.length;
    const half = Math.floor(cfg.trials/2);
    const block = i<half ? 'tonic' : 'phasic';
    const pool = POOLS[cfg.stimType];
    let cueType, isiOverride;
    if(block==='tonic'){
      cueType = 'none';
      const range = TAPAT_LEVELS[session.tapatLevel] || TAPAT_LEVELS[3];
      isiOverride = range[0] + Math.random()*(range[1]-range[0]);
    } else {
      cueType = Math.random()<0.5 ? 'none' : 'center';
      isiOverride = null; // usa l'ISI normale impostato in setup
    }
    const val = pool[Math.floor(Math.random()*pool.length)];
    let side = 'center';
    if(cfg.tapatSpatial){
      const gradient = session.liveTapatGradient!=null ? session.liveTapatGradient : cfg.tapatGradient;
      side = Math.random()*100 < gradient ? 'left' : 'right';
    }
    const trial = {val, cueType, congruency:'neutral', side, targetDir:null, correctAnswer:'go', block, isiOverride, valid:true};
    session.seq.push(trial);
    return trial;
  }
  // Titolazione automatica: valuta un blocco di 8 prove valide alla volta.
  // Generica: si applica sia al livello n-back sia al livello TAPAT, a
  // seconda dell'esercizio in corso.
  // Restituisce quale campo di sessione rappresenta "il livello" per
  // l'esercizio corrente, o null se quell'esercizio non è adattivo.
  function adaptLevelKey(){
    if(cfg.taskMode==='nback') return 'liveNLevel';
    if(cfg.taskMode==='ant' && cfg.antMode==='tapat') return 'tapatLevel';
    if(cfg.taskMode==='neglect') return 'liveBoardLevel';
    if(ADAPT_ISI[cfg.taskMode] || cfg.taskMode==='gonogo' || cfg.taskMode==='switching') return 'adaptLevel';
    return null;
  }
  // Tetto della scala per l'esercizio corrente — non è più uguale per
  // tutti: gonogo/sequenza/stopsignal/ant(classico)/TAPAT/switching/
  // cancellazione(liveBoardLevel) sono a 10 livelli; n-back resta a 6
  // (esteso in una sessione precedente); dualtask ha una scala separata
  // per canale, gestita da bumpDualLevel/maybeAdaptDualChannel, non da
  // questa funzione (adaptLevelKey non restituisce 'adaptLevel' per
  // dualtask — vedi sotto).
  function currentLevelMax(){
    const key = adaptLevelKey();
    if(key==='liveNLevel') return 10;
    if(key==='tapatLevel') return 10;
    if(key==='liveBoardLevel') return 10;
    if(key==='adaptLevel') return 10; // gonogo, sequenza, stopsignal, ant, switching
    return 5;
  }
  const DUAL_LEVEL_MAX = 10; // tetto scala doppio compito, per canale — vedi bumpDualLevel/maybeAdaptDualChannel
  function maybeAdapt(){
    if(!cfg.adaptive) return;
    const levelKey = adaptLevelKey();
    if(!levelKey) return;
    const BLOCK = 8;
    if(session.adaptBlock.length < BLOCK) return;
    const acc = session.adaptBlock.filter(Boolean).length / session.adaptBlock.length;
    const levelMax = currentLevelMax();
    if(acc > 0.85 && session[levelKey] < levelMax){
      session[levelKey]++;
      session.levelChanges.push({trialIdx:session.idx, level:session[levelKey], how:'auto'});
    } else if(acc < 0.70 && session[levelKey] > 1){
      session[levelKey]--;
      session.levelChanges.push({trialIdx:session.idx, level:session[levelKey], how:'auto'});
    }
    session.adaptBlock = [];
  }
  function bumpLevel(delta){
    if(!session) return;
    const levelKey = adaptLevelKey();
    if(!levelKey) return;
    const nv = Math.max(1, Math.min(currentLevelMax(), session[levelKey]+delta));
    if(nv===session[levelKey]) return;
    session[levelKey] = nv;
    const isNeglect = cfg.taskMode==='neglect';
    if(!isNeglect) session.adaptBlock = []; // il blocco automatico riparte da qui
    session.levelChanges.push({trialIdx: isNeglect ? session.boardIdx : session.idx, level:nv, how:'manuale'});
    if(isNeglect) updateNeglectScreen(); else updateTaskScreen();
  }
  function bumpDualLevel(channel, delta){
    if(!session || cfg.taskMode!=='dualtask') return;
    const levelKey = channel===1 ? 'dualLevel1' : 'dualLevel2';
    const nv = Math.max(1, Math.min(DUAL_LEVEL_MAX, session[levelKey]+delta));
    if(nv===session[levelKey]) return;
    session[levelKey] = nv;
    session[channel===1?'adaptBlock1':'adaptBlock2'] = [];
    session.levelChanges.push({trialIdx:session.idx, level:nv, how:'manuale', canale:channel});
    updateTaskScreen();
  }
  // Wraps setTimeout so a pause can compute and preserve the remaining delay.
  function scheduleStep(fn, delay){
    const startedAt = performance.now();
    session.timerInfo = {fn, delay, startedAt};
    session.timer = setTimeout(()=>{ session.timerInfo=null; fn(); }, delay);
  }
  function pauseTask(){
    if(!session || session.paused) return;
    if(session.timer) clearTimeout(session.timer);
    if(session.stopCueTimer) clearTimeout(session.stopCueTimer);
    if(session.timerInfo){
      const elapsed = performance.now() - session.timerInfo.startedAt;
      session.timerInfo.remaining = Math.max(50, session.timerInfo.delay - elapsed);
    }
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    session.paused = true;
    session.pausedAt = performance.now();
    render();
  }
  function resumeTask(){
    if(!session || !session.paused) return;
    const pausedDuration = performance.now() - session.pausedAt;
    if(session.trialStart!=null) session.trialStart += pausedDuration; // keep reaction times measured on active time only
    if(session.boardStartTime!=null) session.boardStartTime += pausedDuration;
    session.paused = false;
    if(session.timerInfo){
      const {fn, remaining} = session.timerInfo;
      session.timer = setTimeout(()=>{ session.timerInfo=null; fn(); }, remaining);
    }
    render();
  }
  // Tabelle livello (1-5) -> parametro, per gli esercizi con titolazione
  // adattiva generica. N-back e TAPAT hanno le proprie tabelle dedicate
  // (livello n e durata attesa tonica) definite altrove.
  const ADAPT_ISI = {   // ISI in ms — più basso = più difficile. Tabelle a 10 livelli per
    // gonogo/sequenza/stopsignal/ant/dualtask — pavimento più lento e
    // soffitto più veloce rispetto alla vecchia scala 1-5. Per dualtask
    // l'indice non è session.adaptLevel (i due canali hanno livelli
    // indipendenti) ma la media dei due, vedi showTrialStimulus().
    sequenza: {1:4500,2:3900,3:3200,4:2700,5:2200,6:1900,7:1700,8:1500,9:1150,10:900},
    dualtask: {1:3000,2:2700,3:2400,4:2100,5:1800,6:1550,7:1300,8:1100,9:900,10:700}, // ISI condivisa (leva secondaria), esteso da 5 a 10 livelli
    ant:      {1:3200,2:2800,3:2400,4:2000,5:1600,6:1400,7:1200,8:1000,9:800,10:650},  // solo ANT classico, non TAPAT
    stopsignal: {1:3600,2:3200,3:2800,4:2400,5:2000,6:1700,7:1400,8:1150,9:950,10:750} // leva secondaria, indipendente dallo staircase SSD
  };
  const ADAPT_GONOGO_FREQ = {1:0.48,2:0.44,3:0.40,4:0.34,5:0.28,6:0.22,7:0.17,8:0.12,9:0.08,10:0.05}; // frequenza no-go — più bassa = più difficile
  // N-back: il "livello" (1-10) non è più uguale a n. n resta clinicamente
  // vincolato a un ceiling di 3 (a sua volta confinato al solo livello 10);
  // il resto della scala nasce da due leve — frequenza bersaglio (come
  // prima) e frequenza di trial "lure" (foil che corrispondono a uno
