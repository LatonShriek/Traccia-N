      const resp = el('div',{class:'respond'+(cfg.zoneGrandi && spec.length===2 ? ' respond-large' : '')});
      // Badge del tasto sui pulsanti, SOLO se l'operatore ha dichiarato
      // "Tastiera" come dispositivo previsto (Setup) — la tastiera
      // funziona comunque sempre in background, il badge serve solo a
      // rendere visibile a colpo d'occhio quale tasto corrisponde a quale
      // pulsante, invece di doverlo scoprire per tentativi durante una
      // prova a tempo. Aggiunto come elemento SEPARATO accanto al
      // pulsante (mai dentro il suo testo), perché alcuni esercizi
      // riscrivono s.label via textContent dopo il montaggio (switching,
      // n-back a un pulsante...) — un badge dentro verrebbe cancellato.
      const keyLabels = cfg.inputDevice==='tastiera'
        ? (spec.length===1 ? ['SPAZIO'] : spec.length===2 ? activeKeyLayout().labels2 : spec.length===4 ? activeKeyLayout().labels4 : null)
        : null;
      spec.forEach((s,i)=>{
        const b = el('button',{class:'tapbtn '+s.cls+(s.full?' full':'')+(cfg.zoneGrandi && spec.length===2 ? ' tapbtn-large' : ''), onclick:()=>{ registerTap(s.action); flashTap(b); }},[s.label]);
        b.dataset.action = s.action;
        if(keyLabels && keyLabels[i]){
          const holder = el('div',{style:'position:relative; flex:1 1 auto; display:flex;'});
          holder.appendChild(b);
          holder.appendChild(el('span',{style:'position:absolute; top:6px; right:8px; background:rgba(0,0,0,.35); color:#fff; font-size:11px; font-weight:700; letter-spacing:.03em; padding:2px 7px; border-radius:6px; pointer-events:none;'},[keyLabels[i]]));
          resp.appendChild(holder);
        } else {
          resp.appendChild(b);
        }
        btns.push(b);
      });
      root.appendChild(resp);
    } else {
      const resp = el('div',{class:'respond'});
      resp.appendChild(el('div',{style:'color:#fff; font-size:13px; opacity:.8; align-self:center;'},['Modalità manuale: la sequenza scorre automaticamente. I risultati si inseriscono al termine.']));
      root.appendChild(resp);
    }
    return {infoSpan, pauseBtn, stimSlot, trail, btns};
  }
  function flashTap(btn){
    if(!btn) return;
    btn.classList.add('tapped');
    setTimeout(()=> btn.classList.remove('tapped'), 180);
  }
  function updateTaskScreen(){
    const d = taskDom;

      : cfg.taskMode==='stopsignal' ? 'SSD '+Math.round(session.currentSSD)+'ms · ritmo livello '+session.adaptLevel
      : (cfg.taskMode==='ant' && cfg.antMode==='tapat' && trial) ? 'TAPAT — blocco '+(trial.block==='tonic'?'tonico':'fasico')+' · livello '+session.tapatLevel+(cfg.adaptive?' (adattivo)':'')
      : (cfg.taskMode==='ant' && cfg.antMode==='classico') ? 'ANT · livello '+session.adaptLevel
      : cfg.taskMode==='switching' ? EXERCISES[cfg.taskMode].label+' · livello '+session.adaptLevel
      : cfg.taskMode==='dualtask' ? 'doppio compito · C1 livello '+session.dualLevel1+' · C2 livello '+session.dualLevel2
      : cfg.taskMode==='categorizzazione' ? EXERCISES[cfg.taskMode].label+' · livello '+cfg.categLivello+' · ISI/lure livello '+session.categLevel+(cfg.adaptive?' (adattivo)':'')
      : EXERCISES[cfg.taskMode].label;
    const curMista = cfg.taskMode==='sequenza' ? cfg.sequenzaMista : cfg.taskMode==='nback' ? cfg.nbackMista : cfg.taskMode==='gonogo' ? cfg.gonogoMista : 'no';
    const isTapatSession = cfg.taskMode==='ant' && cfg.antMode==='tapat';
    d.infoSpan.textContent = 'prova '+(Math.min(session.idx+1,cfg.trials))+' / '+cfg.trials+' · '+modeLabel+
      (isTapatSession ? (cfg.tapatModalita==='uditivo' ? ' · Uditivo' : '')
        : (EXERCISES[cfg.taskMode].usesStimType && !(cfg.taskMode==='ant' && cfg.antMode==='classico')) ? ' · '+((curMista && curMista!=='no') ? MISTA_LABELS_SHORT[curMista] : STIM_LABELS[cfg.stimType]) : '');
    d.pauseBtn.textContent = session.paused ? '▶ Riprendi' : '❚❚ Pausa';

    // switching: le etichette dei pulsanti dipendono dalla regola del trial corrente
    if(cfg.taskMode==='switching' && trial && d.btns.length===2){
      d.btns[0].textContent = trial.ruleDef.labelA;
      d.btns[1].textContent = trial.ruleDef.labelB;
    }
    if(cfg.taskMode==='nback' && d.btns.length===1 && cfg.respMode!=='operatore'){
      d.btns[0].textContent = 'Corrispondenza (n='+nbackParamsForLevel(session.liveNLevel).n+')';
    }

    d.stimSlot.innerHTML='';
    if(session.phase==='demoFeedback'){
      const isLast = session.idx+1>=cfg.trials;
      d.stimSlot.appendChild(el('div',{style:'max-width:420px; margin:0 auto; text-align:center;'},[
        el('div',{style:'font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); margin-bottom:8px; font-weight:700;'},['Dimostrazione']),
        el('div',{style:'font-size:17px; line-height:1.4; margin-bottom:18px; color:var(--white);'},[session.lastDemoFeedback||'']),
        el('button',{class:'primary', onclick:()=>{ continueDemo(); }},[isLast ? 'Fine dimostrazione' : 'Avanti'])
      ]));
    } else if(session.paused){
      d.stimSlot.appendChild(el('div',{class:'blank'},['❚❚ in pausa']));
    } else if(session.showStopCue){
      d.stimSlot.appendChild(el('div',{class:'stopcue-full'},['STOP']));
    } else if(trial && session.phase==='cue' && cfg.taskMode==='switching'){
      d.stimSlot.appendChild(el('div',{style:'color:var(--accent); font-size:26px; letter-spacing:.06em; font-weight:800;'},[trial.ruleDef.label.toUpperCase()+'?']));
    } else if(trial && session.phase==='cue' && cfg.taskMode==='ant'){
      d.stimSlot.appendChild(renderCueNode(trial));
    } else if(trial && session.phase==='show'){
      d.stimSlot.appendChild(renderStimulusNode(trial));
    } else {
      d.stimSlot.appendChild(el('div',{class:'blank'},['· · ·']));
    }

    d.trail.innerHTML='';
    if(cfg.showTrail){
      session.trail.slice(-16).forEach(t=> d.trail.appendChild(el('div',{class:'chip '+t.outcome})));
    }

    const canRespond = session.phase!=='demoFeedback' && cfg.respMode!=='manuale' && !session.paused &&
      (cfg.taskMode==='dualtask' ? true : session.responses.size===0);
    d.btns.forEach(b=>{
      const already = cfg.taskMode==='dualtask' ? session.responses.has(b.dataset.action) : false;
      b.style.opacity = (canRespond && !already) ? '1' : '.55';
      b.style.pointerEvents = session.paused ? 'none' : 'auto';
    });
  }
  // Disegna SOLO il cue (fase 'cue', precede il target — vedi nextTrial),
  // mai insieme al bersaglio/flanker. ANT classico: '✦' per il cue
  // centrale (allerta, non informa sulla posizione), freccia per il cue
  // spaziale (posizione probabile del bersaglio, valido nell'80% dei
  // casi). TAPAT visivo: solo '✦' centrale, non lateralizzato per
  // costruzione — stesso principio già usato per il cue acustico, un
  // segnale di allerta non deve anticipare la posizione del bersaglio.
  function renderCueNode(trial){
    if(cfg.taskMode==='ant' && cfg.antMode==='tapat'){
      if(cfg.tapatModalita==='uditivo') return el('div',{style:'display:flex; width:100%; justify-content:center; padding:0 8vw;'},[el('div',{style:'color:var(--ink-soft); font-size:15px; text-align:center;'},['🔊 Ascolta'])]);
      return el('div',{style:'display:flex; width:100%; justify-content:center; padding:0 8vw;'},[
        el('div',{style:'color:var(--accent); font-size:28px;'},['✦'])
      ]);
    }
    const glyph = trial.cueType==='spatial' ? (trial.side==='left'?'◀':'▶') : '✦';
    const color = trial.cueType==='spatial' ? 'var(--accent)' : 'rgba(255,255,255,.6)';
    return el('div',{style:'display:flex; width:100%; justify-content:center; padding:0 8vw;'},[
      el('div',{style:'color:'+color+'; font-size:28px;'},[glyph])
    ]);
  }
  function renderStimulusNode(trial){
    if(cfg.taskMode==='ant' && cfg.antMode==='tapat'){
      if(cfg.tapatModalita==='uditivo'){
        // Nessun accompagnamento visivo, nemmeno per il cue: un segnale
        // sullo schermo (anche solo "sta per arrivare qualcosa") vanificherebbe
        // il punto della modalità uditiva, che è allenare il canale acustico
        // da solo. Placeholder statico, identico su ogni prova — non cambia
        // né alla comparsa del cue né a quella del bersaglio.
        return el('div',{style:'display:flex; width:100%; justify-content:center; padding:0 8vw;'},[
          el('div',{style:'color:var(--ink-soft); font-size:15px; text-align:center;'},['🔊 Ascolta'])
        ]);
      }
      const outer = el('div',{style:'display:flex; width:100%; justify-content:'+(trial.side==='left'?'flex-start':trial.side==='right'?'flex-end':'center')+'; padding:0 8vw;'});
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:18px;'});
      if(cfg.stimType==='colori'){
        wrap.appendChild(el('div',{class:'colorcircle', style:'width:110px; height:110px; background:'+trial.val.hex+';'},[]));
      } else if(isAudioOnlyStim(cfg.stimType)){
        wrap.appendChild(el('div',{class:'audio-pulse active'},['♪']));
      } else if(cfg.stimType==='simboli'){
        wrap.appendChild(el('div',{class:'stimulus symbolwrap'},[seqLabel(trial.val)]));
      } else {
        wrap.appendChild(el('div',{class:'stimulus'},[seqLabel(trial.val)]));
      }
      outer.appendChild(wrap);
      return outer;
    }
    if(cfg.taskMode==='ant'){
      const target = d=>{
        if(!trial.tokens) return d==='left' ? '◀' : '▶'; // frecce (default)
        return d==='left' ? trial.tokens[0] : trial.tokens[1];
      };
      const neutralGlyph = trial.tokens ? (trial.material==='lettere' ? 'X' : '▲') : '–';
      let flankers;
      if(trial.congruency==='congruent') flankers = target(trial.targetDir);
      else if(trial.congruency==='incongruent') flankers = target(trial.targetDir==='left'?'right':'left');
      else flankers = neutralGlyph;
      const row = flankers+flankers+target(trial.targetDir)+flankers+flankers;
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:18px;'});
      wrap.appendChild(el('div',{class:'stimulus symbolwrap', style: trial.cueType==='spatial' ? ('align-self:'+(trial.side==='left'?'flex-start':'flex-end')) : ''},[row]));
      return wrap;
    }
    if(cfg.taskMode==='simon'){
      const outer = el('div',{style:'display:flex; width:100%; justify-content:'+(trial.side==='left'?'flex-start':'flex-end')+'; padding:0 8vw;'});
      outer.appendChild(el('div',{class:'colorcircle', style:'width:110px; height:110px; background:'+trial.val.hex+';'},[]));
      return outer;
    }
    if(cfg.taskMode==='switching'){
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:14px;'});
      wrap.appendChild(el('div',{style:'color:var(--accent); font-size:24px; letter-spacing:.06em; font-weight:800;'},[trial.ruleDef.label.toUpperCase()+'?']));
      if(cfg.switchMaterial==='colori'){
        wrap.appendChild(el('div',{class:'colorcircle', style:'width:140px; height:140px; background:'+trial.val.hex+';'},[]));
      } else if(cfg.switchMaterial==='bivalente'){
        wrap.appendChild(el('div',{class:'stimulus', style:'color:'+(trial.val.colore==='rosso'?'#e33b3b':'var(--white)')+' !important;'},[trial.val.valore]));
      } else if(trial.sizeVariant){
        const sizePx = trial.sizeVariant==='grande' ? 'min(28vw,220px)' : 'min(9vw,64px)';
        wrap.appendChild(el('div',{class:'stimulus', style:'font-size:'+sizePx+' !important;'},[seqLabel(trial.val)]));
      } else {
        wrap.appendChild(el('div',{class:'stimulus'},[seqLabel(trial.val)]));
      }
      return wrap;
    }
    if(cfg.taskMode==='categorizzazione'){
      if(trial.categMateriale){ // livelli 1 e 4: singola dimensione
        if(cfg.categMateriale==='colori') return el('div',{class:'colorcircle', style:'width:140px; height:140px; background:'+trial.val.hex+';'},[]);
        if(isSpokenStim(cfg.categMateriale)) return el('div',{class:'audio-pulse active'},['♪']);
        return el('div',{class:'stimulus symbolwrap'},[trial.val]);
      }
      // livelli 2/3/5: stesso stile del bivalente dello switching — testo
      // bianco o rosso su sfondo scuro, a seconda della dimensione colore.
      return el('div',{class:'stimulus', style:'color:'+(trial.val.colore==='rosso'?'#e33b3b':'var(--white)')+' !important;'},[trial.val.valore]);
    }
    if(cfg.taskMode==='dualtask'){
      const pairing = cfg.dualPairing || 'vis-aud';
      function visualNode(material, val, big){
        if(material==='colori') return el('div',{class:'colorcircle', style:'width:'+(big?'120px':'90px')+'; height:'+(big?'120px':'90px')+'; background:'+val.hex+';'},[]);
        return el('div',{class:'stimulus', style:'font-size:'+(big?'min(20vw,140px)':'min(14vw,90px)')+' !important;'},[seqLabel(val)]);
      }
      if(pairing==='vis-vis'){
        const wrap = el('div',{style:'display:flex; align-items:center; justify-content:center; gap:40px; width:100%;'});
        wrap.appendChild(visualNode(cfg.dualVisual, trial.visualVal, true));
        wrap.appendChild(el('div',{style:'width:2px; height:60px; background:rgba(255,255,255,.2);'},[]));
        wrap.appendChild(visualNode(cfg.dualVisual2, trial.audioVal, true));
        return wrap;
      }
      if(pairing==='aud-aud'){
        const wrap = el('div',{style:'display:flex; align-items:center; justify-content:center; gap:40px;'});
        wrap.appendChild(el('div',{class:'audio-pulse active', style:'width:80px;height:80px;font-size:28px;'},['♪ grave']));
        wrap.appendChild(el('div',{class:'audio-pulse active', style:'width:80px;height:80px;font-size:28px;'},['♪ acuto']));
        return wrap;
      }
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:10px;'});
      wrap.appendChild(visualNode(cfg.dualVisual, trial.visualVal, true));
      wrap.appendChild(el('div',{class:'audio-pulse active', style:'width:64px;height:64px;font-size:24px;'},['♪']));
      return wrap;
    }
    if(cfg.taskMode==='sequenza' && cfg.sequenzaMista && cfg.sequenzaMista!=='no'){
      return renderTypedStimulus(trial.val.stimType, trial.val.item);
    }
    if(cfg.taskMode==='nback' && cfg.nbackMista && cfg.nbackMista!=='no'){
      return renderTypedStimulus(trial.val.stimType, trial.val.item);
    }
    if(cfg.taskMode==='gonogo' && cfg.gonogoMista && cfg.gonogoMista!=='no'){
      return renderTypedStimulus(trial.val.stimType, trial.val.item);
    }
    if(cfg.stimType==='simboli' || cfg.stimType==='forma' || cfg.stimType==='frecce'){
      return el('div',{class:'stimulus symbolwrap'},[trial.val]);
    }
    if(cfg.stimType==='parole'){
      return el('div',{class:'stimulus word'},[trial.val]);
    }
    if(isAudioOnlyStim(cfg.stimType)){
      return el('div',{class:'audio-pulse active'},['♪']);
    }
    if(cfg.stimType==='colori'){
      return el('div',{class:'colorcircle', style:'background:'+trial.val.hex+';'},[]);
    }
    return el('div',{class:'stimulus'},[trial.val]);
  }
  // Renderizza un singolo stimolo tipizzato, a prescindere dall'esercizio
  // corrente — usato dalla Sequenza bersaglio mista, dove ogni elemento
  // porta il proprio tipo invece di condividerne uno solo con cfg.stimType.
  function renderTypedStimulus(stimType, val){
    if(stimType==='simboli') return el('div',{class:'stimulus symbolwrap'},[val]);
    if(isAudioOnlyStim(stimType)) return el('div',{class:'audio-pulse active'},['♪']);
    if(stimType==='colori') return el('div',{class:'colorcircle', style:'background:'+val.hex+';'},[]);
    return el('div',{class:'stimulus'},[val]);
  }

  /* ---------- FINISH / RESULTS ---------- */
  /* ---------- Batteria di screening iniziale ---------- */
  // 4 domini (Attenzione divisa rimossa: considerata di livello superiore
  // rispetto a uno screening rapido — vedi discussione con Rodrigo. Il
  // Doppio compito resta un esercizio pienamente disponibile, semplicemente
  // non più proposto/confrontato in automatico da questa batteria), ciascuno
  // con un blocco "base" (stimolo semplice, nessun carico esecutivo) e un
  // blocco "caricato" (versione con carico esecutivo dello stesso dominio).
  // Ogni blocco è breve e a difficoltà FISSA (adaptive:false), non la
  // solita titolazione automatica: qui l'obiettivo non è trovare il
  // livello ideale del paziente, ma un confronto pulito e riproducibile
  // fra "senza carico" e "con carico" allo stesso dominio.
  const SCREENING_TRIALS = 16;
  // "Attenzione sostenuta / inibizione" (domainLabel sotto) è
  // un'etichetta pragmatica per l'operatore, non una posizione teorica:
  // il framework della batteria (vedi README, "Framework teorico") tratta
  // inibizione e attenzione selettiva come due facce dello stesso
  // meccanismo di mantenimento dell'obiettivo attivo (Munakata, Herd,
  // Chatham, Depue, Banich & O'Reilly, 2011), non come moduli a sé — qui
  // restano accorpate in una sola etichetta perché lo screening ha
  // bisogno di un nome breve e leggibile a colpo d'occhio, non perché il
  // codice le consideri la stessa cosa altrove (Go/No-Go, Stop-Signal,
  // ANT e Cancellazione, per esempio, restano distinti per costrutto
  // specifico in tutto il resto della batteria).
  const SCREENING_BLOCKS = [
    { domain:'attenzione', tipo:'base', domainLabel:'Attenzione sostenuta / inibizione', label:'Attenzione — blocco base',
      patch:()=>({taskMode:'gonogo', stimType:'lettere', targetSeq:[POOLS.lettere[0]], adaptive:false, targetRate:0.48, isi:1600, stimDuration:600, trials:SCREENING_TRIALS}) },
    { domain:'attenzione', tipo:'caricato', domainLabel:'Attenzione sostenuta / inibizione', label:'Attenzione — blocco caricato', suggestTaskMode:'gonogo', suggestLabel:'Go/No-Go',
      // Corretto rispetto alla versione precedente: 3 elementi no-go a
      // frequenza 22% sommava due fonti di difficoltà diverse (carico
      // discriminativo multi-target + minore aspettativa del no-go, che
      // secondo la letteratura sull'inibizione proattiva rende il compito
      // più difficile indipendentemente dal numero di target — una
      // frequenza no-go più bassa riduce l'aspettativa e rinforza la
      // tendenza prepotente a rispondere). Ora: 2 target (carico
      // discriminativo puro) con una riduzione più contenuta della
      // frequenza no-go (48%→35%, non 22%) rispetto al blocco base.
      patch:()=>({taskMode:'gonogo', stimType:'lettere', targetSeq:POOLS.lettere.slice(0,2), adaptive:false, targetRate:0.35, isi:900, stimDuration:500, trials:SCREENING_TRIALS}) },
    { domain:'memoria', tipo:'base', domainLabel:'Memoria di lavoro', label:'Memoria di lavoro — blocco base',
      patch:()=>({taskMode:'nback', stimType:'lettere', nLevel:1, adaptive:false, targetRate:0.32, isi:2200, stimDuration:700, trials:SCREENING_TRIALS}) },
    { domain:'memoria', tipo:'caricato', domainLabel:'Memoria di lavoro', label:'Memoria di lavoro — blocco caricato', suggestTaskMode:'nback', suggestLabel:'N-back',
      // n=5 era irrealistico come misura di screening: anche adulti sani
      // mostrano un calo netto di accuratezza oltre n=2/3 nella
      // letteratura sperimentale sull'n-back (gli studi che usano l'n-back
      // per discriminare gruppi si fermano quasi sempre a 2-3), quindi n=5
      // rischiava un effetto pavimento che avrebbe appiattito la
      // distribuzione invece di discriminare. Ora n=2, tempi invariati.
      patch:()=>({taskMode:'nback', stimType:'lettere', nLevel:2, adaptive:false, targetRate:0.24, isi:1700, stimDuration:600, trials:SCREENING_TRIALS}) },
    // Flessibilità cognitiva: NON più due esercizi diversi confrontati fra
    // loro (Categorizzazione L1 vs Task-switching) — quel confronto
    // mescolava apprendimento di regola singola con costo di alternanza,
    // due costrutti diversi (vedi discussione sulla bivalenza/mixing
    // cost). Ora un SOLO blocco di Task-switching, scomposto in due
    // punteggi dagli stessi dati: repAcc (prove di ripetizione dentro il
    // blocco misto, usata come "base") e switchAcc (prove di switch,
    // usata come "caricato") — isola il vero costo di switching, non
    // ancora il "mixing cost" pieno (richiederebbe un blocco puro a
    // compito singolo come riferimento, non presente qui). Materiale
    // numerico: ogni cifra è bivalente rispetto a entrambe le regole
    // (pari/dispari, alto/basso), condizione necessaria perché il costo
    // di switching emerga (letteratura: con stimoli univalenti il costo
    // si riduce o sparisce). 24 prove non 16: con un solo blocco diviso in
    // due, servono più prove totali perché repAcc e switchAcc abbiano
    // ciascuna un numero di prove sufficiente a una stima non troppo
    // rumorosa.
    { domain:'flessibilita', tipo:'split', domainLabel:'Flessibilità cognitiva', label:'Flessibilità cognitiva', suggestTaskMode:'switching', suggestLabel:'Task-switching',
      splitAccKeys:{base:'repAcc', caricato:'switchAcc'},
      patch:()=>({taskMode:'switching', switchMaterial:'numeri', adaptive:false, targetRate:0.35, isi:1400, stimDuration:700, trials:24}) },
    { domain:'esplorazione', tipo:'base', domainLabel:'Esplorazione visuospaziale', label:'Esplorazione — blocco base',
      patch:()=>({taskMode:'neglect', neglectMode:'classico', stimType:'lettere', targetSeq:defaultTargetSeq('lettere',2), neglectBoardSize:20, neglectGradient:50, neglectTimeLimit:0, neglectBottomUp:'off', neglectRuleClauses:null, trials:1}) },
    { domain:'esplorazione', tipo:'caricato', domainLabel:'Esplorazione visuospaziale', label:'Esplorazione — blocco caricato', suggestTaskMode:'neglect', suggestLabel:'Cancellazione a regola',
      patch:()=>({taskMode:'neglect', neglectMode:'regola', neglectRuleLevel:2, stimType:'lettere', neglectBoardSize:40, neglectGradient:50, neglectTimeLimit:0, neglectBottomUp:'off', neglectRuleClauses:null, trials:1}) }
  ];
  const SCREENING_FLAG_THRESHOLD = 0.70; // coerente con la soglia Wilson già in uso per la titolazione adattiva
  // Prova dimostrativa: 6 prove a difficoltà fissa e facile, con feedback
  // esplicativo dopo ogni risposta, per far capire la regola prima che le
  // prove "contino" davvero. Solo per i 6 esercizi con la regola meno
  // immediata da intuire da soli — Cancellazione, Sequenza bersaglio e le
  // strategie di memoria restano fuori: la loro consegna è già
  // sostanzialmente auto-esplicativa. Riuso, dove possibile, esattamente
  // gli stessi valori isi/stimDuration già validati nei blocchi di
  // screening per lo stesso esercizio (non nuovi numeri inventati); dove
  // lo screening non copre quell'esercizio (Stop-Signal, TAPAT, Doppio
  // compito) i valori sono una scelta di comodo per un ritmo non
  // frettoloso — ipotesi di costruzione, non un dato di letteratura.
  const DEMO_TRIALS = 6;
  const DEMO_ELIGIBLE = ['nback','sequenza','gonogo','switching','stopsignal','categorizzazione','dualtask','tapat','antclassico','simon'];
  const DEMO_PATCHES = {
    nback: ()=>({taskMode:'nback', nLevel:1, isi:2200, stimDuration:700, trials:DEMO_TRIALS}),
    sequenza: ()=>({taskMode:'sequenza', adaptStartLevel:1, isi:2200, stimDuration:700, trials:DEMO_TRIALS}),
    gonogo: ()=>({taskMode:'gonogo', adaptStartLevel:1, isi:1600, stimDuration:600, trials:DEMO_TRIALS}),
    switching: ()=>({taskMode:'switching', adaptStartLevel:1, isi:1800, stimDuration:800, trials:DEMO_TRIALS}),
    stopsignal: ()=>({taskMode:'stopsignal', adaptStartLevel:1, isi:2000, stimDuration:800, trials:DEMO_TRIALS}),
    categorizzazione: ()=>({taskMode:'categorizzazione', categLivello:1, isi:1800, stimDuration:700, trials:DEMO_TRIALS}),
    dualtask: ()=>({taskMode:'dualtask', dualStartLevel1:1, dualStartLevel2:1, isi:2200, stimDuration:800, trials:DEMO_TRIALS}),
    tapat: ()=>({taskMode:'ant', antMode:'tapat', tapatStartLevel:1, trials:DEMO_TRIALS}),
    antclassico: ()=>({taskMode:'ant', antMode:'classico', adaptStartLevel:1, isi:3200, stimDuration:700, trials:DEMO_TRIALS}),
    simon: ()=>({taskMode:'simon', adaptStartLevel:1, simonCongruenza:'bilanciato', isi:3200, stimDuration:700, trials:DEMO_TRIALS})
  };
  function demoLabelFor(key){
    if(key==='tapat') return 'TAPAT';
    if(key==='antclassico') return 'ANT';
    return EXERCISES[key].label;
  }
  function demoKeyForCurrentCfg(){
    if(cfg.taskMode==='ant') return cfg.antMode==='tapat' ? 'tapat' : 'antclassico';
    return DEMO_ELIGIBLE.includes(cfg.taskMode) ? cfg.taskMode : null;
  }
  // Stessi controlli già usati da "Avvia sessione" — una demo su Sequenza
  // bersaglio o Go/No-Go senza bersagli configurati non avrebbe nulla da
  // dimostrare, meglio bloccarla con lo stesso messaggio piuttosto che
  // farla partire su una configurazione vuota.
  function demoPrereqOk(key){
    if(key==='sequenza' && cfg.targetSeq.length<2){ alert('Costruisci prima la sequenza bersaglio (almeno 2 elementi).'); return false; }
    if(key==='gonogo' && (!cfg.targetSeq || cfg.targetSeq.length<1)){ alert('Seleziona prima l\'elemento no-go.'); return false; }
    return true;
  }
  function startDemo(key){
    if(!demoPrereqOk(key)) return;
    demoState = { cfgBackup: Object.assign({}, cfg) };
    Object.assign(cfg, DEMO_PATCHES[key]());
    view='instructions'; render();
  }
  // Testo di feedback dopo ogni prova della demo — usa la classificazione
  // che il motore calcola comunque (outcome, isTarget, isLure, isSwitch,
  // isStopTrial...), non aggiunge nuova logica di valutazione: si limita a
  // spiegare a parole quello che l'esercizio ha già giudicato.
  function demoFeedbackText(trial, outcome){
    const ok = outcome==='hit';
    if(cfg.taskMode==='nback'){
      if(ok && trial.isTarget) return 'Giusto — questa lettera era uguale a quella di n prove fa: andava toccato il tasto.';
      if(ok && trial.isLure) return 'Giusto a non rispondere — questa lettera sembrava familiare, ma non era alla distanza giusta (n prove fa): era una "trappola".';
      if(ok) return 'Giusto a non rispondere — questa lettera non corrispondeva.';
      if(trial.isTarget) return 'Qui andava toccato il tasto: questa lettera era uguale a quella di n prove fa.';
      if(trial.isLure) return 'Qui non andava toccato nulla: questa lettera sembrava familiare, ma era una "trappola" — non alla distanza giusta.';
      return 'Qui non andava toccato nulla: questa lettera non corrispondeva.';
    }
    if(cfg.taskMode==='sequenza'){
      if(ok && trial.isTarget) return 'Giusto — questo elemento è nella sequenza bersaglio da riconoscere: andava toccato il tasto.';
      if(ok) return 'Giusto a non rispondere — questo elemento non fa parte della sequenza bersaglio.';
      if(trial.isTarget) return 'Qui andava toccato il tasto: questo elemento fa parte della sequenza bersaglio.';
      return 'Qui non andava toccato nulla: questo elemento non fa parte della sequenza bersaglio.';
    }
    if(cfg.taskMode==='gonogo'){
      if(ok && !trial.isTarget) return 'Giusto a non rispondere — questo è l\'elemento "no-go", quello a cui NON si risponde mai.';
      if(ok) return 'Giusto — hai risposto, ed era corretto farlo.';
      if(!trial.isTarget) return 'Qui non andava toccato nulla: questo è l\'elemento "no-go".';
      return 'Qui andava data una risposta: non era l\'elemento "no-go".';
    }
    if(cfg.taskMode==='switching'){
      const regola = trial.ruleDef ? trial.ruleDef.label : '';
      if(ok) return 'Giusto — la regola di questa prova era «'+regola+'».';
      return 'Qui la regola era «'+regola+'»'+(trial.isSwitch ? ', cambiata rispetto alla prova precedente.' : ', la stessa della prova precedente.');
    }
    if(cfg.taskMode==='stopsignal'){
      if(trial.isStopTrial) return ok ? 'Giusto — è comparso il segnale di stop: bene a non rispondere.' : 'Qui è comparso il segnale di stop: l\'obiettivo era trattenersi, non rispondere.';
      return ok ? 'Giusto — hai risposto in tempo con la scelta corretta.' : 'Non era la risposta giusta per questo stimolo — rivedi la regola sopra.';
    }
    if(cfg.taskMode==='categorizzazione'){
      const isNogo = trial.correctAnswer==='nogo';
      if(isNogo) return ok ? 'Giusto a non rispondere — la regola attuale lo richiedeva.' : 'Qui non andava data nessuna risposta, secondo la regola attuale.';
      return ok ? 'Giusto.' : 'Non era la categoria corretta secondo la regola attuale.';
    }
    if(cfg.taskMode==='dualtask'){
      return ok ? 'Giusto su entrambi i canali — ricorda: qui si risponde a due cose insieme, ciascuna con la propria regola.' : 'Qui manca o è sbagliata la risposta su almeno uno dei due canali — ricorda: vanno seguiti insieme, ciascuno con la propria regola.';
    }
    if(cfg.taskMode==='ant' && cfg.antMode==='tapat'){
      if(trial.block==='tonic') return ok ? 'Giusto — hai risposto al bersaglio anche senza nessun segnale d\'aiuto.' : 'Il bersaglio è comparso senza preavviso: in questo blocco bisogna restare pronti da soli, senza aiuti.';
      return ok ? 'Giusto — hai risposto al bersaglio dopo il segnale di allerta.' : 'Ricorda: il segnale che precede il bersaglio serve ad anticiparne l\'arrivo.';
    }
    if(cfg.taskMode==='ant' && cfg.antMode==='classico'){
      const cueNote = trial.cueType && trial.cueType!=='none' ? ' Il segnale visto poco prima anticipava l\'arrivo del bersaglio.' : '';
      return ok ? 'Giusto — hai indicato la direzione corretta.'+cueNote : 'La direzione indicata non era corretta — guarda solo la freccia centrale, ignora quelle intorno.'+cueNote;
    }
    if(cfg.taskMode==='simon'){
      const posNote = trial.congruency==='incongruent' ? ' Qui la posizione del cerchio "tirava" verso il pulsante sbagliato — conta solo il colore, mai la posizione.' : '';
      return ok ? 'Giusto — hai risposto in base al colore.'+posNote : 'Risposta sbagliata: la regola è sempre e solo il colore (Blu=sinistra, Verde=destra), mai la posizione in cui compare il cerchio.'+posNote;
    }
    return ok ? 'Giusto.' : 'Risposta non corretta per questa prova.';
  }
  function continueDemo(){ nextTrial(); }

  /* ---------- controllo motorio di base ---------- */
  // Non una misura cognitiva: verifica solo che il canale di risposta
  // (tocco o mouse/trackpad) sia affidabile, PRIMA di qualunque test
  // cognitivo — un'imprecisione qui (tremore, difficoltà visiva, mira)
  // altrimenti rischia di essere letta come un deficit cognitivo che non
  // è. Ispirato al Motor Screening Task di CANTAB, ma senza le sue norme
  // di popolazione (hardware del paziente troppo eterogeneo per avere
  // senso) — qui il confronto è sempre e solo con lo stesso paziente,
  // sullo stesso tipo di dispositivo, nel tempo (stessa filosofia
  // single-case già usata per l'RCI). "Smartphone/Tablet/Computer" non è
  // lo stesso concetto di cfg.inputDevice (touch/tastiera, che riguarda
  // la RISPOSTA durante gli esercizi) — qui serve una categoria più fine,
  // perché la zona di comfort della mano cambia molto fra un telefono e
  // un tablet anche se entrambi sono "touch".
  const MOTOR_TARGET_RADIUS = 34; // px — anche il diametro visivo del bersaglio (68px)
  const MOTOR_TRIALS = 6;
  const MOTOR_TARGET_SETS = {
    // Posizioni [x%, y%] nel container a schermo intero. Smartphone:
    // concentrate nella metà inferiore, raggiungibile dal pollice, mai
    // negli angoli estremi — un tocco impreciso lì può riflettere solo la
    // scomodità dello schermo piccolo, non un problema motorio reale.
    // Tablet/Computer: distribuite su tutto lo schermo, bersagli anche
    // negli angoli — la mano (tablet) o il mouse (computer) raggiungono
    // comodamente tutta l'area.
    smartphone: [[20,55],[80,55],[50,72],[20,90],[80,90],[50,60]],
    tablet:     [[15,18],[85,18],[50,50],[15,82],[85,82],[50,15]],
    computer:   [[10,12],[90,12],[50,50],[10,88],[90,88],[50,10]]
  };
  let motorCheck = null; // {device, idx, taps:[{distancePx,rtMs}], startedAt}

  function startMotorCheck(device){
    motorCheck = { device, idx:0, taps:[], targetShownAt:null };
    view='motorTask'; render();
  }
  function motorTargetPos(idx){
    const set = MOTOR_TARGET_SETS[motorCheck.device] || MOTOR_TARGET_SETS.tablet;
    return set[idx % set.length];
  }
  // Pura: nessun riferimento a motorCheck/DOM, testabile in isolamento.
  // Converte la differenza in percentuale in pixel usando le dimensioni
  // reali del container, per avere una distanza in un'unica unità fisica
  // coerente (non ha senso sommare un dx in % larghezza a un dy in %
  // altezza se il container non è quadrato).
  function motorDistancePx(clientX, clientY, containerRect, targetXPercent, targetYPercent){
    const px = ((clientX-containerRect.left)/containerRect.width)*100;
    const py = ((clientY-containerRect.top)/containerRect.height)*100;
    const dxPx = ((px-targetXPercent)/100)*containerRect.width;
    const dyPx = ((py-targetYPercent)/100)*containerRect.height;
    return Math.sqrt(dxPx*dxPx+dyPx*dyPx);
  }
  // Pura: dato l'elenco dei tocchi, calcola le quattro metriche di sintesi
  // — nessun riferimento a motorCheck/DOM, testabile in isolamento.
  function motorSummaryStats(taps, targetRadius){
    const dists = taps.map(t=>t.distancePx);
    const rts = taps.map(t=>t.rtMs).filter(x=>x!=null);
    const meanDistPx = dists.length ? dists.reduce((a,b)=>a+b,0)/dists.length : null;
    const meanDistRel = meanDistPx!=null ? meanDistPx/targetRadius : null;
    const meanRT = rts.length ? rts.reduce((a,b)=>a+b,0)/rts.length : null;
    const sdRT = (rts.length>1 && meanRT!=null) ? Math.sqrt(rts.reduce((a,b)=>a+(b-meanRT)*(b-meanRT),0)/(rts.length-1)) : null;
    const cvRT = (sdRT!=null && meanRT>0) ? sdRT/meanRT : null;
    return { meanDistPx, meanDistRel, meanRT, cvRT };
  }
  function registerMotorTap(clientX, clientY, containerRect, targetX, targetY){
    const distancePx = motorDistancePx(clientX, clientY, containerRect, targetX, targetY);
    const rtMs = motorCheck.targetShownAt ? (Date.now()-motorCheck.targetShownAt) : null;
    motorCheck.taps.push({ distancePx, rtMs });
    motorCheck.idx++;
    if(motorCheck.idx>=MOTOR_TRIALS){ finishMotorCheck(); }
    else { motorCheck.targetShownAt = Date.now(); render(); }
  }
  async function finishMotorCheck(){
    const { meanDistPx, meanDistRel, meanRT, cvRT } = motorSummaryStats(motorCheck.taps, MOTOR_TARGET_RADIUS);
    const rec = {
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      ts: Date.now(), dateLabel: todayStr(),
      patientCode: cfg.patientCode,
      localPatientId: patientProfile ? null : (activeLocalPatientId || null),
      pazienteId: (!patientProfile && activeRemotePatientId) ? activeRemotePatientId : null,
      family:'motorio', taskMode:'motorio', device: motorCheck.device,
      taps: motorCheck.taps, meanDistPx, meanDistRel, meanRT, cvRT,
      durationMs: motorCheck.taps.reduce((a,t)=>a+(t.rtMs||0),0)
    };
    await saveSession(rec);
    motorCheck.result = rec;
    view='motorResults'; render();
  }
  // Confronto con l'ultimo controllo motorio disponibile per lo STESSO
  // paziente sullo STESSO tipo di dispositivo — mai con un altro
  // dispositivo (non comparabile, stessa logica già usata per l'RCI
  // quando i parametri di sessione cambiano) e mai con una soglia di
  // popolazione (non esiste, per l'eterogeneità dell'hardware). La soglia
  // del 15% qui sotto è una scelta di comodo per descrivere "simile" vs
  // "diverso", non un valore validato in letteratura — dichiarato come
  // tale nel testo mostrato, non presentato come dato clinico.
  async function motorCheckComparison(rec){
    const hist = await loadHistory();
    const prior = hist.filter(r=> r.family==='motorio' && r.device===rec.device && r.patientCode===rec.patientCode && r.id!==rec.id)
      .sort((a,b)=> b.ts-a.ts)[0];
    if(!prior) return null;
    const deltaDist = (rec.meanDistRel - prior.meanDistRel) / prior.meanDistRel;
    return { prior, deltaDist };
  }

  function startScreeningSession(){
    screeningState = { blockIdx:0, results:[], respModeBefore: cfg.respMode };
    if(cfg.respMode==='manuale') cfg.respMode = 'paziente'; // l'inserimento manuale differito non è compatibile con la sequenza automatica dei blocchi
    runScreeningBlock(0);
  }
  function runScreeningBlock(idx){
    if(idx>=SCREENING_BLOCKS.length){ finishScreening(); return; }
    const block = SCREENING_BLOCKS[idx];
    Object.assign(cfg, block.patch());
    view='screeningIntro'; render();
  }
  // Punteggio e suggerimenti: per ogni dominio con un blocco caricato,
  // confronta l'accuratezza del caricato con quella del blocco base dello
  // stesso dominio (o del dominio da cui lo eredita, vedi baseFrom). Se il
  // caricato è sotto soglia MA il base è nella norma, l'esercizio di quel
  // dominio viene proposto come consigliato — se anche il base è sotto
  // soglia, il problema sembra più a monte (percettivo/attentivo) che
  // esecutivo specifico, e non si propone il flag.
  function computeScreeningFlags(results){
    const caricatoBlocks = SCREENING_BLOCKS.filter(b=>b.tipo==='caricato' || b.tipo==='split');
    return caricatoBlocks.map(b=>{
      const baseDomain = b.baseFrom || b.domain;
      const baseRes = results.find(r=>r.domain===baseDomain && r.tipo==='base');
      const carRes = results.find(r=>r.domain===b.domain && r.tipo==='caricato');
      const baseAcc = baseRes ? baseRes.accuracy : null;
      const carAcc = carRes ? carRes.accuracy : null;
      const flagged = carAcc!=null && baseAcc!=null && carAcc<SCREENING_FLAG_THRESHOLD && baseAcc>=SCREENING_FLAG_THRESHOLD;
      // Configurazione suggerita per il "+ aggiungi al programma": riparte
      // dal blocco caricato dello screening (già tarato per il dominio) ma
      // con un numero di prove normale da allenamento, non le 16 ridotte
      // dello screening — e adattivo attivo, così il livello di partenza si
      // aggiusta da solo nelle prime sessioni invece di restare fisso.
      const suggestedCfg = Object.assign({}, b.patch(), {trials:24, adaptive:true});
      return { domain:b.domain, domainLabel:b.domainLabel, baseAcc, carAcc, flagged, suggestTaskMode:b.suggestTaskMode, suggestLabel:b.suggestLabel, suggestedCfg };
    });
  }
  async function finishScreening(){
    const results = screeningState.results;
    const summary = computeScreeningFlags(results);
    cfg.respMode = screeningState.respModeBefore;
    screeningState.summary = summary;
    await persistScreeningFlags(summary.filter(s=>s.flagged), summary);
    view='screeningResults'; render();
  }
  // Salva i flag "consigliato" sul profilo del paziente attivo (locale o
  // remoto, oppure — se è il paziente stesso a fare lo screening da remoto —
  // sul proprio profilo). Mai sul dispositivo/operatore in generale: lo
  // screening senza un paziente selezionato resta solo un'analisi non
  // salvata.
  // Se un flag per lo stesso esercizio esiste già ed è stato disattivato
  // a mano in precedenza, resta disattivato: un nuovo screening non lo
  // riaccende da solo, la disattivazione manuale ha sempre la precedenza.
  function mergeScreeningFlags(existing, fresh){
    const out = (existing||[]).slice();
    fresh.forEach(f=>{
      const i = out.findIndex(x=>x.taskMode===f.suggestTaskMode);
      const rec = {taskMode:f.suggestTaskMode, label:f.suggestLabel, domainLabel:f.domainLabel, motivo:'screening: '+Math.round(f.carAcc*100)+'% con carico vs '+Math.round(f.baseAcc*100)+'% base', cfg:f.suggestedCfg, aggiornatoIl:Date.now()};
      if(i===-1){ out.push(Object.assign({attivo:true}, rec)); }
      else { out[i] = Object.assign({}, out[i], rec); } // preserva 'attivo' esistente (rispetta l'eventuale disattivazione manuale)
    });
    return out;
  }
  // Costruisce una voce di programma da un flag di screening (o da
  // qualunque oggetto con {suggestTaskMode/taskMode, suggestLabel/label,
  // suggestedCfg/cfg}) — usata sia dall'autorizzazione automatica del gate
  // sia dal pulsante "+ Aggiungi al programma" per la modulazione manuale.
  function programEntryFromFlag(f){
    const cfgOut = f.suggestedCfg || f.cfg;
    const label = f.suggestLabel || f.label;
    // "suggerito" è un'istantanea congelata al momento della creazione —
    // resta invariata anche se l'operatore modifica poi la voce a mano
    // (vedi editingProgramEntryIndex), così si può sempre confrontare cosa
    // era stato proposto dallo screening con cosa c'è oggi effettivamente.
    return { nome: label, cfg: cfgOut, fonte:'screening', suggerito:{taskMode:cfgOut.taskMode, label, cfg:cfgOut} };
  }
  // Etichetta materiale uniforme per QUALUNQUE esercizio — a differenza del
  // solo controllo usesStimType/mista (che copriva solo N-back/Sequenza/
  // Go/No-Go/Stop-Signal/ANT/Neglect), qui si aggiungono anche gli
  // esercizi con un campo materiale specifico non generico (Task-switching,
  // Categorizzazione condizionale, Doppio compito, ANT/TAPAT) — così ogni
  // voce di programma mostra sempre esercizio + livello + materiale, non
  // solo un sottoinsieme.
  function materialLabelFor(c){
    if(c.taskMode==='switching') return SWITCH_MATERIAL_LABELS_SHORT[c.switchMaterial]||c.switchMaterial;
    if(c.taskMode==='categorizzazione'){
      const struct = categEffectiveStructure(c);
      return (struct===1||struct===4) ? (CATEG_MATERIAL_LABELS_SHORT[c.categMateriale]||c.categMateriale) : 'Lettere/numeri';
    }
    if(c.taskMode==='dualtask'){
      const pairing = c.dualPairing||'vis-aud';
      if(pairing==='vis-aud') return STIM_LABELS[c.dualVisual]+' + uditivo';
      if(pairing==='vis-vis') return STIM_LABELS[c.dualVisual]+' + '+STIM_LABELS[c.dualVisual2];
      return 'Uditivo × 2';
    }
    if(c.taskMode==='ant' && c.antMode==='tapat') return 'TAPAT · '+(c.tapatModalita==='uditivo'?'Uditivo':'Visivo');
    if(c.taskMode==='ant') return ANT_MATERIAL_TOKENS[c.antMaterial] ? (c.antMaterial==='lettere'?'Lettere H/S':'Simboli') : 'Frecce';
    if(c.taskMode==='neglect'){
      if(c.neglectMode==='intruso') return 'Trova l\'intruso';
      if(c.neglectMode==='regola') return 'Conteggio a regola · '+STIM_LABELS[c.stimType==='numeri'?'numeri':'lettere'];
      if(c.neglectMode==='progressiva') return 'Progressiva (1-30)';
      // "classico" esplicito (non solo il materiale): senza questa parola,
      // due voci di programma con la stessa combinazione materiale+livello
      // ma modalità diverse (raro ma possibile) risultavano indistinguibili
      // a colpo d'occhio — vedi anche il controllo duplicati in
      // appendProgramEntry.
      return 'Classico · '+STIM_LABELS[c.stimType];
    }
    const mistaMode = c.taskMode==='sequenza' ? c.sequenzaMista : c.taskMode==='nback' ? c.nbackMista : c.taskMode==='gonogo' ? c.gonogoMista : null;
    if(mistaMode && mistaMode!=='no') return MISTA_LABELS_SHORT[mistaMode];
    if(EXERCISES[c.taskMode] && EXERCISES[c.taskMode].usesStimType) return STIM_LABELS[c.stimType];
    return null;
  }
  const SWITCH_MATERIAL_LABELS_SHORT = {numeri:'Numeri', lettere:'Lettere', colori:'Colori', simboli:'Simboli', bivalente:'Bivalente'};
  const CATEG_MATERIAL_LABELS_SHORT = {colori:'Colori', simboli:'Simboli', lettereVoce:'Lettere pronunciate', numeriVoce:'Numeri pronunciati'};
  // Badge compatto "programma già presente" per le liste pazienti (in
  // presenza e remoto) — non riapre "Gestisci programma", dà solo un
  // riepilogo essenziale (quanti esercizi, quanti da screening vs manuali)
  // per decidere a colpo d'occhio se serve intervenire, senza appesantire
  // la riga con l'intero elenco.
  function programBadgeLine(programma){
    if(!programma || !programma.length) return null;
    const daScreening = programma.filter(p=>p.fonte==='screening').length;
    const manuali = programma.length - daScreening;
    let detail;
    if(daScreening && manuali) detail = manuali+' manuali, '+daScreening+' da screening';
    else if(daScreening) detail = 'tutti da screening';
    else detail = 'tutti manuali';
    return '📋 Programma: '+programma.length+(programma.length===1?' esercizio':' esercizi')+' ('+detail+')';
  }
  // Nome leggibile generato automaticamente da una configurazione, per le
  // voci di programma aggiunte da Setup mentre si costruisce il programma
  // di un paziente — evita di dover scegliere un nome a mano per ognuna.
  function autoNameFor(c){
    const exl = EXERCISES[c.taskMode] ? EXERCISES[c.taskMode].label : c.taskMode;
    const mat = materialLabelFor(c);
    const stimPart = mat ? mat+' — ' : '';
    const lv = levelOfCfg(c);
    const levelPart = lv!=null ? ' livello '+lv : '';
    return stimPart+exl+levelPart;
  }
  // Aggiunge una voce al programma di un paziente (locale o remoto),
  // preservando quello che c'era già — usata sia dal flusso "Aggiungi
  // esercizio" in Setup sia da qualunque altro punto che debba appendere
  // una voce senza passare dalle checkbox di "Gestisci programma".
  // Va usata ogni volta che si sta per scrivere il programma di un
  // paziente remoto partendo da un oggetto che potrebbe essere solo un
  // segnaposto incompleto (es. subito dopo un ripristino da refresh/tasto
  // indietro, mentre il fetch vero è ancora in corso) — senza questa
  // guardia, scrivere basandosi su un oggetto incompleto rischierebbe di
  // SOVRASCRIVERE l'intero programma reale con uno vuoto.
  async function fetchRemotePatientFresh(id){
    if(!sb || !cloudUser) return null;
    try{
      const { data, error } = await sb.from('pazienti').select('*').eq('id', id).eq('operatore_id', cloudUser.id).maybeSingle();
      if(error) throw error;
      return data;
    }catch(e){ return null; }
  }
  function isThinPatientStub(p){ return !p || !('programma_assegnato' in p); }
  // Se il nome proposto per la nuova voce coincide con uno già presente nel
  // programma, aggiunge un contatore leggibile (" (2)", " (3)"...) invece
  // di lasciare due voci identiche in elenco — capitava soprattutto
  // aggiungendo più varianti di Cancellazione (neglect) una dopo l'altra
  // da Setup, quando materiale/livello coincidevano e il nome restava lo
  // stesso: l'operatore non aveva modo di distinguerle nell'elenco del
  // programma. Non tocca il caso di nomi già diversi.
  function dedupeEntryName(nome, programmaEsistente){
    const nomiEsistenti = new Set((programmaEsistente||[]).map(x=>x.nome));
    if(!nomiEsistenti.has(nome)) return nome;
    let n = 2;
    while(nomiEsistenti.has(nome+' ('+n+')')) n++;
    return nome+' ('+n+')';
  }
  async function appendProgramEntry(kind, id, entry){
    if(kind==='local'){
      try{
        const raw = localStorage.getItem('traccian:localpatient:'+id);
        if(!raw) return false;
        const pp = JSON.parse(raw);
        const programmaEsistente = pp.programma||[];
        const voce = Object.assign({}, entry, {nome: dedupeEntryName(entry.nome, programmaEsistente)});
        pp.programma = programmaEsistente.concat([voce]);
        localStorage.setItem('traccian:localpatient:'+id, JSON.stringify(pp));
        syncLocalPatientToCloud(pp);
        if(editingPatient && editingPatient.id===id) editingPatient.programma = pp.programma;
        return voce;
      }catch(e){ return null; }
    }
    if(!sb || !cloudUser) return null;
    try{
      let existing = (cachedRemotePatients||[]).find(x=>x.id===id) || (editingPatient&&editingPatient.id===id ? editingPatient : null);
      if(isThinPatientStub(existing)) existing = await fetchRemotePatientFresh(id) || existing;
      const programmaAttuale = patientProgram(existing) || [];
      const voce = Object.assign({}, entry, {nome: dedupeEntryName(entry.nome, programmaAttuale)});
      const nuovoProgramma = programmaAttuale.concat([voce]);
      const { error } = await sb.from('pazienti').update({programma_assegnato:nuovoProgramma}).eq('id', id).eq('operatore_id', cloudUser.id);
      if(error) throw error;
      if(editingPatient && editingPatient.id===id) editingPatient.programma_assegnato = nuovoProgramma;
      cachedRemotePatients = null;
      return voce;
    }catch(e){ alert('Errore: '+e.message); return null; }
  }
  // Sostituisce la voce all'indice `idx` con una nuova cfg/nome, ma
  // preservando fonte/suggerito della voce originale — usata quando si
  // "Modifica" una voce esistente (invece di rimuoverla e aggiungerne una
  // nuova, che perderebbe la provenienza da screening).
  async function replaceProgramEntry(kind, id, idx, patch){
    if(kind==='local'){
      try{
        const raw = localStorage.getItem('traccian:localpatient:'+id);
        if(!raw) return false;
        const pp = JSON.parse(raw);
        const programma = (pp.programma||[]).slice();
        if(!programma[idx]) return false;
        programma[idx] = Object.assign({}, programma[idx], patch);
        pp.programma = programma;
        localStorage.setItem('traccian:localpatient:'+id, JSON.stringify(pp));
        syncLocalPatientToCloud(pp);
        if(editingPatient && editingPatient.id===id) editingPatient.programma = programma;
        return true;
      }catch(e){ return false; }
    }
    if(!sb || !cloudUser) return false;
    try{
      let existing = (cachedRemotePatients||[]).find(x=>x.id===id) || (editingPatient&&editingPatient.id===id ? editingPatient : null);
      if(isThinPatientStub(existing)) existing = await fetchRemotePatientFresh(id) || existing;
      const programma = (patientProgram(existing) || []).slice();
      if(!programma[idx]) return false;
      programma[idx] = Object.assign({}, programma[idx], patch);
      const { error } = await sb.from('pazienti').update({programma_assegnato:programma}).eq('id', id).eq('operatore_id', cloudUser.id);
      if(error) throw error;
      if(editingPatient && editingPatient.id===id) editingPatient.programma_assegnato = programma;
      cachedRemotePatients = null;
      return true;
    }catch(e){ alert('Errore: '+e.message); return false; }
  }
  // `flagged`: solo i domini sotto soglia (per i flag/programma).
  // `fullSummary`: TUTTI i domini testati, flaggati o no (per il quadro
  // completo mostrato in "Gestisci programma" — solo l'ultimo screening è
  // conservato, non uno storico di tutti quelli fatti).
  async function persistScreeningFlags(flagged, fullSummary){
    const risultati = fullSummary ? { ts: Date.now(), summary: fullSummary } : null;
    if(patientProfile){
      // Il paziente sta facendo lo screening da solo, da remoto.
      try{
        const merged = mergeScreeningFlags(patientProfile.screening_flags, flagged);
        const patch = { screening_flags: merged };
        if(risultati) patch.screening_risultati = risultati;
        const isFirstGateCompletion = patientProfile.modalita_accesso==='screening_poi_suggeriti' && !patientProfile.screening_completato_il;
        if(isFirstGateCompletion){
          // Autorizzazione automatica una tantum: i domini flaggati in
          // QUESTO screening entrano direttamente nel programma assegnato,
          // così il paziente li vede da subito — l'operatore può comunque
          // aggiungerne/toglierne a mano in qualsiasi momento dopo.
          const nuoveVoci = flagged.map(programEntryFromFlag);
          const programmaEsistente = patientProfile.programma_assegnato || [];
          patch.programma_assegnato = programmaEsistente.concat(nuoveVoci);
          patch.screening_completato_il = new Date().toISOString();
        }
        const { error } = await sb.from('pazienti').update(patch).eq('id', cloudUser.id);
        if(error) throw error;
        Object.assign(patientProfile, patch);
      }catch(e){ console.error('salvataggio flag screening fallito', e); }
      return;
    }
    if(!patientProfile && activeLocalPatientId){
      try{
        const raw = localStorage.getItem('traccian:localpatient:'+activeLocalPatientId);
        if(!raw) return;
        const p = JSON.parse(raw);
        if(flagged.length) p.screeningFlags = mergeScreeningFlags(p.screeningFlags, flagged);
        if(risultati) p.screeningRisultati = risultati;
        localStorage.setItem('traccian:localpatient:'+activeLocalPatientId, JSON.stringify(p));
        syncLocalPatientToCloud(p);
      }catch(e){}
    } else if(!patientProfile && activeRemotePatientId && sb && cloudUser){
      try{
        const existing = (cachedRemotePatients||[]).find(x=>x.id===activeRemotePatientId);
        const patch = {};
        if(flagged.length) patch.screening_flags = mergeScreeningFlags(existing && existing.screening_flags, flagged);
        if(risultati) patch.screening_risultati = risultati;
        if(Object.keys(patch).length) await sb.from('pazienti').update(patch).eq('id', activeRemotePatientId).eq('operatore_id', cloudUser.id);
        cachedRemotePatients = null;
      }catch(e){ console.error('salvataggio flag screening fallito', e); }
    }
  }
