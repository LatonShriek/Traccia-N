<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>TracciaN — test n-back</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2430">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TracciaN">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --ink:#1C2430;
    --paper:#F6F4EF;
    --paper-dim:#EAE6DC;
    --focus:#212C39;
    --focus-2:#2B3A4A;
    --signal:#4C7A6B;
    --signal-soft:#DCE8E3;
    --alert:#B5544A;
    --alert-soft:#F2DEDB;
    --accent:#D9A441;
    --line:#D8D2C4;
    --ink-soft:#5B6472;
    --white:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; overscroll-behavior:none; user-select:none;}
  #app{min-height:100vh; display:flex; flex-direction:column;}

  .brand{display:flex; align-items:baseline; gap:10px; padding:22px 28px 6px;}
  .brand .mark{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:-0.02em;}
  .brand .mark span{color:var(--accent);}
  .brand .sub{font-size:12.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}

  .screen{flex:1; display:flex; flex-direction:column; padding:0 28px 28px;}
  .card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:22px;}

  h2{font-family:'Space Grotesk',sans-serif; font-size:19px; margin:0 0 4px; letter-spacing:-0.01em;}
  .hint{font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; line-height:1.5;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:720px){.grid{grid-template-columns:1fr;}}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); margin-bottom:8px;}
  .seg{display:flex; flex-wrap:wrap; gap:8px;}
  .seg button{border:1.5px solid var(--line); background:var(--paper); color:var(--ink); font-family:'Inter';
    font-size:13.5px; font-weight:600; padding:10px 14px; border-radius:10px; cursor:pointer; transition:.15s;}
  .seg button.on{background:var(--focus); border-color:var(--focus); color:var(--white);}
  .seg button:active{transform:scale(.96);}

  .stepper{display:flex; align-items:center; gap:14px;}
  .stepper button{width:38px; height:38px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper);
    font-size:18px; font-weight:700; cursor:pointer; color:var(--ink);}
  .stepper .val{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; min-width:74px; text-align:center;}

  .seqpreview{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; background:var(--paper-dim);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px;}

    font-family:'Inter'; font-size:14px; background:var(--paper); color:var(--ink);}
  input:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .primary{background:var(--focus); color:var(--white); border:none; border-radius:12px; padding:16px 22px;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; cursor:pointer; width:100%;}
  .primary:active{transform:scale(.985);}
  .ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line); border-radius:12px; padding:13px 18px;
    font-family:'Inter'; font-weight:600; font-size:14px; cursor:pointer;}
  .rowbtns{display:flex; gap:12px; margin-top:6px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 22px; background:var(--focus); color:var(--white);}
  .topbar .info{font-family:'JetBrains Mono',monospace; font-size:12.5px; opacity:.85;}
  .topbar button{background:rgba(255,255,255,.12); color:var(--white); border:1px solid rgba(255,255,255,.25);
    border-radius:8px; padding:8px 12px; font-size:12.5px; cursor:pointer;}

  .stage{flex:1; background:var(--focus); background:linear-gradient(180deg,var(--focus),var(--focus-2));
    display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; min-height:60vh;}
  .stimulus{font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--white); font-size:min(22vw,180px);
    line-height:1; letter-spacing:-0.01em;}
  .stimulus.symbolwrap{font-size:min(18vw,150px);}
  .stimulus.word{font-size:min(11vw,64px);}
  .colorcircle{width:min(45vw,220px); height:min(45vw,220px); border-radius:50%; box-shadow:0 8px 30px rgba(0,0,0,.35);}
  .neglect-board{flex:1; position:relative; background:var(--paper); min-height:60vh;}
  .neglect-item{position:absolute; width:9%; aspect-ratio:1; max-width:64px; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center; border-radius:10px; background:var(--white);
    border:1.5px solid var(--line); font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(14px,3vw,22px); color:var(--ink); cursor:pointer; user-select:none; touch-action:manipulation;}
  .neglect-item.found{background:var(--signal-soft); border-color:var(--signal); opacity:.45;}
  .neglect-item.falsetap{background:var(--alert-soft); border-color:var(--alert); opacity:.6;}
  .blank{color:rgba(255,255,255,.18); font-size:min(14vw,110px); font-family:'Space Grotesk',sans-serif;}

  .audio-pulse{width:120px; height:120px; border-radius:50%; border:3px solid var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:44px;}
  .audio-pulse.active{animation:pulse .5s ease-out;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,164,65,.55);}100%{box-shadow:0 0 0 26px rgba(217,164,65,0);}}

  .trail{display:flex; gap:6px; position:absolute; bottom:22px; left:0; right:0; justify-content:center; flex-wrap:wrap; padding:0 12px;}
  .trail .chip{width:26px; height:26px; border-radius:7px; background:rgba(255,255,255,.12); border:2px solid transparent;}
  .trail .chip.hit{border-color:var(--signal); background:rgba(76,122,107,.5);}
  .trail .chip.err{border-color:var(--alert); background:rgba(181,84,74,.5);}
  .trail .chip.pend{border-color:rgba(255,255,255,.3);}

  .respond{padding:18px 22px 26px; background:var(--focus-2); display:flex; gap:14px;}
  button{touch-action:manipulation; cursor:pointer;}
  @media (hover:hover){
    .seg button:hover{border-color:var(--ink-soft);}
    .primary:hover{filter:brightness(1.1);}
    .ghost:hover{background:var(--paper-dim);}
    .tapbtn:hover{filter:brightness(1.08);}
    .topbar button:hover{background:rgba(255,255,255,.2);}
    .stepper button:hover{background:var(--paper-dim);}
    .navlinks .link:hover, .navlinks a:hover{color:var(--ink);}
    .histrow > div:first-child:hover{opacity:.75;}
  }
  /* Su schermi larghi (desktop) centra i contenuti invece di stenderli
     a piena larghezza — l'app resta comunque a piena larghezza su tablet. */
  @media (min-width:820px){
    .brand, .screen{max-width:960px; margin-left:auto; margin-right:auto; width:100%;}
    .respond{max-width:960px; margin-left:auto; margin-right:auto;}
    .grid{grid-template-columns:repeat(auto-fit, minmax(240px,1fr));}
  }
  .tapbtn{flex:1; padding:22px; border-radius:16px; border:none; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:18px; cursor:pointer; letter-spacing:.01em; transition:transform .08s, filter .08s;}
  .tapbtn.match{background:var(--accent); color:var(--ink);}
  .tapbtn.nomatch{background:rgba(255,255,255,.1); color:var(--white); border:1.5px solid rgba(255,255,255,.25);}
  .tapbtn.full{flex:1 1 100%;}
  .tapbtn:active, .tapbtn.tapped{transform:scale(.96); filter:brightness(1.18);}
  .stopcue-full{width:min(70vw,320px); height:min(70vw,320px); border-radius:50%; background:var(--alert);
    display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:min(12vw,56px); letter-spacing:.06em; animation:stoppulse .22s ease-out;}
  @keyframes stoppulse{0%{transform:scale(.7); opacity:.4;}100%{transform:scale(1); opacity:1;}}

  .flash{position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity .25s;}
  .flash.on{opacity:1;}

  table{width:100%; border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:13.5px;}
  td,th{padding:9px 6px; border-bottom:1px solid var(--line); text-align:left;}
  th{color:var(--ink-soft); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;}
  .metricgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:14px 0 20px;}
  .metric{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px;}
  .metric .n{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:24px;}
  .metric .l{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

  .histrow{display:flex; justify-content:space-between; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .histrow .l{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft);}
  .empty{color:var(--ink-soft); font-size:13.5px; padding:20px 4px; text-align:center;}
  .navlinks{display:flex; gap:10px; margin-top:16px;}
  .navlinks a, .navlinks .link{color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; background:none; border:none; font-family:'Inter';}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ---------- data pools ---------- */
  const POOLS = {
    lettere: ['B','C','D','F','G','H','L','M','N','P','R','S','T','V'],
    numeri:  ['1','2','3','4','5','6','7','8','9'],
    simboli: ['●','■','▲','◆','★','✚','⬟','⬤'],
    parole:  ['CASA','LIBRO','SOLE','MARE','TAVOLO','FIORE','GATTO','PORTA','STRADA','NUVOLA','PANE','FUOCO','ALBERO','CHIAVE','SEDIA','LUNA'],
    suoni:   [
      {f:220,type:'sine',icon:'A'},{f:294,type:'square',icon:'B'},{f:349,type:'sine',icon:'C'},
      {f:392,type:'triangle',icon:'D'},{f:466,type:'square',icon:'E'},{f:523,type:'triangle',icon:'F'}
    ],
    colori: [
      {hex:'#D64545', icon:'Rosso'}, {hex:'#3B72D6', icon:'Blu'}, {hex:'#3FA34D', icon:'Verde'},
      {hex:'#E0B12D', icon:'Giallo'}, {hex:'#8E4EC6', icon:'Viola'}, {hex:'#E07B2D', icon:'Arancione'},
      {hex:'#2DB6C7', icon:'Ciano'}, {hex:'#D6469B', icon:'Magenta'}
    ]
  };
  const STIM_LABELS = {lettere:'Lettere', numeri:'Numeri', simboli:'Simboli', parole:'Parole', suoni:'Suoni', colori:'Colori'};
  const STOP_TONE = {f:140, type:'square'}; // segnale di stop uditivo, sempre lo stesso, distinto dagli stimoli
  // "lettere"/"parole" sono femminili, gli altri materiali sono maschili —
  // serve per costruire istruzioni con l'accordo di genere corretto
  // (es. "una alla volta" vs "uno alla volta", "molte" vs "molti").
  function stimGender(stimType){ return (stimType==='lettere' || stimType==='parole') ? 'f' : 'm'; }
  const EXERCISES = {
    nback:      {label:'N-back classico',        usesStimType:true,  usesTargetSeq:false, family:'signal',
      instructions:c=>{
        const f = stimGender(c.stimType)==='f';
        return 'Vedrai una serie di '+STIM_LABELS[c.stimType].toLowerCase()+', '+(f?'una':'uno')+' alla volta. Tocca il pulsante dorato ogni volta che '+(f?'è uguale a quella':'è uguale a quello')+' di '+c.nLevel+' posizioni prima. Se non lo è, non toccare nulla.';
      }},
    sequenza:   {label:'Sequenza bersaglio',      usesStimType:true,  usesTargetSeq:true,  family:'signal',
      instructions:c=> 'Vedrai una serie di stimoli, uno dopo l\'altro. Tocca il pulsante dorato subito dopo che si è conclusa la sequenza '+c.targetSeq.map(seqLabel).join(', poi ')+'. Per tutti gli altri stimoli non toccare nulla.'},
    gonogo:     {label:'Go/No-Go',                usesStimType:true,  usesTargetSeq:true,  family:'signal',
      instructions:c=> 'Tocca il pulsante ogni volta che appare uno stimolo, tranne quando appare '+seqLabel(c.targetSeq[0])+' — in quel caso non toccare nulla.'},
    stopsignal: {label:'Stop-Signal',             usesStimType:true,  usesTargetSeq:false, family:'signal',
      instructions:c=> 'Tocca il pulsante il più velocemente possibile, ogni volta che appare uno stimolo. A volte, subito dopo, comparirà la scritta STOP: in quel caso prova a non toccare, anche se avevi già iniziato il movimento.'},
    ant:        {label:'Attenzione (tipo ANT)',   usesStimType:true,  usesTargetSeq:false, family:'choice',
      instructions:c=>{
        if(c.antMode==='tapat'){
          const matName = c.stimType==='suoni' ? 'il suono' : c.stimType==='colori' ? 'il cerchio colorato' : 'lo stimolo';
          const verbo = c.stimType==='suoni' ? 'senti' : 'vedi';
          return 'Nella prima parte, gli intervalli tra uno stimolo e l\'altro sono lunghi e imprevedibili: mantieni l\'attenzione anche se sembra non succedere nulla, e tocca il pulsante appena '+verbo+' '+matName+'. Nella seconda parte, gli intervalli sono più brevi e a volte un piccolo segnale ti avviserà poco prima — rispondi comunque il più velocemente possibile, ogni volta.';
        }
        return 'Vedrai una freccia al centro dello schermo, a volte circondata da altre frecce. Indica la direzione della freccia centrale il più velocemente possibile, toccando il pulsante sinistra o destra.';
      }},
    switching:  {label:'Task-switching',          usesStimType:false, usesTargetSeq:false, family:'choice',
      instructions:c=>{ const rs=SWITCH_RULESETS[c.switchMaterial]; return 'Vedrai '+(c.switchMaterial==='numeri'?'un numero':c.switchMaterial==='lettere'?'una lettera':'un colore')+', con accanto un\'indicazione che cambia: a volte devi classificarlo come "'+rs.ruleA.label+'", altre volte come "'+rs.ruleB.label+'". Segui l\'indicazione mostrata in quel momento.'; }},
    dualtask:   {label:'Doppio compito',          usesStimType:false, usesTargetSeq:false, family:'dual',
      instructions:c=> 'Presta attenzione sia a quello che vedi sia a quello che senti. Tocca "target visivo" quando lo stimolo visivo si ripete rispetto al precedente, e "target uditivo" quando il suono si ripete.'},
    neglect:    {label:'Cancellazione (neglect)',  usesStimType:true,  usesTargetSeq:true,  family:'spatial',
      instructions:c=>{
        const f = stimGender(c.stimType)==='f';
        return 'Sullo schermo compariranno '+(f?'molte':'molti')+' '+STIM_LABELS[c.stimType].toLowerCase()+'. Tocca solo '+(f?'quelle uguali':'quelli uguali')+' a: '+c.targetSeq.map(seqLabel).join(', ')+'. Ignora tutti gli altri, e vai avanti finché non li hai trovati tutti.';
      }}
  };

  /* ---------- state ---------- */
  let cfg = {
    stimType:'lettere', nLevel:2, isi:2200, stimDuration:600, trials:24,
    targetRate:0.32, respMode:'paziente', voice:false, patientCode:'', notes:'',
    taskMode:'nback', targetSeq: POOLS.lettere.slice(0,3),
    ssd:250, ssdStep:50, // solo per Stop-Signal
    adaptive:false, // solo per N-back: titolazione automatica del livello
    switchMaterial:'numeri', // solo per Task-switching
    antMode:'classico', // 'classico' | 'tapat' — solo per Attenzione (ANT)
    dualVisual:'lettere', // solo per Doppio compito (canale visivo; l'uditivo è sempre "suoni")
    neglectDistribution:'simmetrica', neglectTimeLimit:60, neglectBoardSize:40 // solo per Cancellazione
  };
  function defaultTargetSeq(stimType, len){
    len = len || (cfg.targetSeq ? cfg.targetSeq.length : 3);
    const pool = POOLS[stimType];
    const out = [];
    for(let i=0;i<len;i++) out.push(pool[i % pool.length]);
    return out;
  }

  /* ---------- training presets (saved settings, local device) ---------- */
  // Salva solo i parametri del protocollo, non dati di sessione (codice
  // paziente/note) — un preset è "come allenare", non "chi" o "quando".
  function presetCfgOf(c){
    return {
      stimType:c.stimType, taskMode:c.taskMode, nLevel:c.nLevel,
      targetSeq: (EXERCISES[c.taskMode].usesTargetSeq) ? c.targetSeq.map(seqLabel) : null,
      trials:c.trials, isi:c.isi, stimDuration:c.stimDuration, targetRate:c.targetRate,
      respMode:c.respMode, voice:c.voice, ssd:c.ssd, ssdStep:c.ssdStep, adaptive:c.adaptive,
      switchMaterial:c.switchMaterial, dualVisual:c.dualVisual, antMode:c.antMode,
      neglectDistribution:c.neglectDistribution, neglectTimeLimit:c.neglectTimeLimit, neglectBoardSize:c.neglectBoardSize
    };
  }
  function listPresets(){
    const out = [];
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('traccian:preset:')===0){
          try{ out.push(JSON.parse(localStorage.getItem(k))); }catch(e){}
        }
      }
    }catch(e){}
    out.sort((a,b)=> b.savedAt - a.savedAt);
    return out;
  }
  function savePreset(name){
    const id = Date.now()+'-'+Math.random().toString(36).slice(2,7);
    const rec = {id, name, savedAt: Date.now(), cfg: presetCfgOf(cfg)};
    try{ localStorage.setItem('traccian:preset:'+id, JSON.stringify(rec)); }catch(e){}
  }
  function deletePreset(id){ try{ localStorage.removeItem('traccian:preset:'+id); }catch(e){} }
  function loadPreset(p){
    const pc = p.cfg;
    cfg.stimType = pc.stimType; cfg.taskMode = pc.taskMode; cfg.nLevel = pc.nLevel;
    cfg.trials = pc.trials; cfg.isi = pc.isi; cfg.stimDuration = pc.stimDuration;
    cfg.targetRate = pc.targetRate; cfg.respMode = pc.respMode; cfg.voice = pc.voice;
    cfg.ssd = pc.ssd || 250; cfg.ssdStep = pc.ssdStep || 50; cfg.adaptive = !!pc.adaptive;
    cfg.switchMaterial = pc.switchMaterial || 'numeri'; cfg.dualVisual = pc.dualVisual || 'lettere'; cfg.antMode = pc.antMode || 'classico';
    cfg.neglectDistribution = pc.neglectDistribution || 'simmetrica'; cfg.neglectTimeLimit = pc.neglectTimeLimit!=null?pc.neglectTimeLimit:60; cfg.neglectBoardSize = pc.neglectBoardSize || 40;
    cfg.targetSeq = (EXERCISES[pc.taskMode] && EXERCISES[pc.taskMode].usesTargetSeq && pc.targetSeq && pc.targetSeq.length)
      ? pc.targetSeq.map(v=> POOLS[pc.stimType].find(item=> seqLabel(item)===v) || v)
      : defaultTargetSeq(pc.stimType, pc.taskMode==='gonogo' ? 1 : 3);
    render();
  }
  /* ---------- profili paziente locali (in presenza, senza account remoto) ---------- */
  // A differenza dei pazienti "veri" (account Supabase con codice di
  // accesso, per l'uso da remoto), questi sono etichette locali: servono a
  // organizzare le sessioni fatte in presenza sotto un nome, senza dover
  // creare un account per ogni paziente che l'operatore vede di persona.
  // Possono in seguito essere "promossi" a un vero account remoto.
  function listLocalPatients(){
    const out = [];
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('traccian:localpatient:')===0){
          try{ out.push(JSON.parse(localStorage.getItem(k))); }catch(e){}
        }
      }
    }catch(e){}
    out.sort((a,b)=> a.nome.localeCompare(b.nome, 'it'));
    return out;
  }
  function saveLocalPatient(nome){
    const id = 'lp-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
    const p = {id, nome, createdAt: Date.now()};
    try{ localStorage.setItem('traccian:localpatient:'+id, JSON.stringify(p)); }catch(e){}
    return p;
  }
  // Ricollega le sessioni già registrate per un profilo locale a un nuovo
  // account remoto — sia quelle salvate solo in locale, sia quelle già
  // sincronizzate in cloud sotto l'account dell'operatore.
  async function migrateLocalPatientSessions(localId, remotePazienteId){
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('traccian:sessione:')===0){
          try{
            const rec = JSON.parse(localStorage.getItem(k));
            if(rec.localPatientId===localId){
              rec.pazienteId = remotePazienteId;
              localStorage.setItem(k, JSON.stringify(rec));
            }
          }catch(e){}
        }
      }
    }catch(e){}
    if(sb && cloudUser){
      try{ await sb.from('sessioni').update({paziente_id:remotePazienteId}).eq('operatore_id',cloudUser.id).eq('local_patient_id', localId); }
      catch(e){ console.error('migrazione cloud fallita', e); }
    }
    historyCache = null;
  }
  function localPatientDropdown(){
    const wrap = el('div',{class:'field'});
    wrap.appendChild(el('label',{},['Modalità']));
    const patients = listLocalPatients();
    const sel = el('select',{style:'width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 12px; font-family:Inter; font-size:14px; background:var(--paper); color:var(--ink);'});
    const optFree = el('option',{value:''},['Esercizi liberi']);
    sel.appendChild(optFree);
    patients.forEach(p=>{
      const o = el('option',{value:p.id},['Paziente: '+p.nome]);
      if(activeLocalPatientId===p.id) o.setAttribute('selected','selected');

  /* ---------- helpers ---------- */

  /* ---------- audio ---------- */
  let actx = null;
  function getCtx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
  function playTone(tone, dur){
    try{
      const ctx = getCtx(); const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = tone.type; o.frequency.value = tone.f;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur/1000);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur/1000+0.02);
    }catch(e){}
  }
  function speak(text){
    try{
      if(!window.speechSynthesis) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'it-IT'; u.rate = 0.94; u.pitch = 1.0;
      const voices = window.speechSynthesis.getVoices() || [];
      const itVoices = voices.filter(v=> v.lang && v.lang.toLowerCase().startsWith('it'));
      // preferisci voci "naturali"/neurali quando il dispositivo le offre — suonano meno meccaniche
      const goodVoice = itVoices.find(v=> /natural|neural|premium|enhanced|online/i.test(v.name)) || itVoices[0];
      if(goodVoice) u.voice = goodVoice;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---------- sequence generation ---------- */
  function buildSequence(){
    switch(cfg.taskMode){
      case 'sequenza': return buildSequenceTarget();
      case 'gonogo': return buildGoNoGo();
      case 'stopsignal': return buildStopSignal();
      case 'ant': return buildANT();
      case 'switching': return buildSwitching();
      case 'dualtask': return buildDualTask();
      default: return buildSequenceNback();
    }
  }
  function buildSequenceNback(){
    const pool = POOLS[cfg.stimType];
    const seq = [];
    function runLen(i, val){ // quante ripetizioni consecutive di val terminerebbero in i
      let run = 1;
      for(let k=i-1;k>=0;k--){ if(seq[k].val===val) run++; else break; }
      return run;
    }
    for(let i=0;i<cfg.trials;i++){
      let makeTarget = i>=cfg.nLevel && Math.random() < cfg.targetRate;
      let val;
      if(makeTarget){
        const cand = seq[i-cfg.nLevel].val;
        if(pool.length>1 && runLen(i,cand) > 3){ makeTarget = false; } // il vincolo anti-ripetizione ha priorità
        else val = cand;
      }
      if(!makeTarget){
        do{ val = pool[Math.floor(Math.random()*pool.length)]; }
        while(pool.length>1 && ((i>=cfg.nLevel && val===seq[i-cfg.nLevel].val) || runLen(i,val)>3));
      }
      seq.push({val, isTarget: i>=cfg.nLevel ? makeTarget : false, valid:i>=cfg.nLevel});
    }
    return seq;
  }
  // Target-sequence mode: respond only when the trailing stimuli exactly
  // match a fixed, custom-built sequence (e.g. 1 → 2 → 3). Everything else
  // is a non-target, regardless of how "close" it looks.
  function buildSequenceTarget(){
    const pool = POOLS[cfg.stimType];
    const target = cfg.targetSeq;
    const len = target.length;
    const raw = [];
    for(let i=0;i<cfg.trials;i++) raw.push(pool[Math.floor(Math.random()*pool.length)]);
    for(let i=len-1;i<cfg.trials;i++){
      if(Math.random() < cfg.targetRate){
        for(let j=0;j<len;j++) raw[i-len+1+j] = target[j];
      }
    }
    return raw.map((val,i)=>{
      let isTarget = false;
      if(i>=len-1){
        isTarget = true;
        for(let j=0;j<len;j++){ if(raw[i-len+1+j] !== target[j]){ isTarget=false; break; } }
      }
      return {val, isTarget, valid:i>=len-1};
    });
  }
  // Go/No-Go: isTarget qui significa "va data risposta" (stimolo go).
  // Lo stimolo no-go è il singolo elemento scelto in cfg.targetSeq[0].
  function buildGoNoGo(){
    const pool = POOLS[cfg.stimType];
    const nogo = cfg.targetSeq[0];
    const seq = [];
    for(let i=0;i<cfg.trials;i++){
      let val;
      if(Math.random() < cfg.targetRate){ val = nogo; }
      else { do{ val = pool[Math.floor(Math.random()*pool.length)]; } while(val===nogo && pool.length>1); }
      seq.push({val, isTarget: val!==nogo, valid:true});
    }
    return seq;
  }
  // Stop-Signal: le prove "go" sono target (va sempre data risposta); una
  // quota è designata come trial di stop (non-target, va inibita la
  // risposta), gestiti dinamicamente in sessione tramite lo staircase su
  // session.currentSSD.
  function buildStopSignal(){
    const pool = POOLS[cfg.stimType];
    const seq = [];
    for(let i=0;i<cfg.trials;i++){
      const val = pool[Math.floor(Math.random()*pool.length)];
      const isStopTrial = Math.random() < cfg.targetRate;
      seq.push({val, isTarget: !isStopTrial, isStopTrial, valid:true});
    }
    return seq;
  }
  // ANT semplificato: fattori allerta (cue presente/assente), orienting
  // (cue spaziale valido 80% / non valido 20%), conflitto (flanker
  // congruenti/incongruenti/neutri). Risposta = direzione della freccia
  // centrale, non "match" — non produce hit/FA in senso classico.
  function buildANT(){
    if(cfg.antMode==='tapat') return buildTAPAT();
    const seq = [];
    const cueTypes = ['none','center','spatial'];
    const congruencies = ['congruent','incongruent','neutral'];
    for(let i=0;i<cfg.trials;i++){
      const cueType = cueTypes[Math.floor(Math.random()*cueTypes.length)];
      const congruency = congruencies[Math.floor(Math.random()*congruencies.length)];
      const targetDir = Math.random()<0.5 ? 'left' : 'right';
      let side = Math.random()<0.5 ? 'left' : 'right';
      if(cueType==='spatial'){
        // cue valido nell'80% dei casi (indica il lato corretto)
        side = Math.random()<0.8 ? targetDir : (targetDir==='left'?'right':'left');
      } else {
        side = 'center';
      }
      seq.push({val:targetDir, cueType, congruency, side, targetDir, correctAnswer:targetDir, valid:true});
    }
    return seq;
  }
  // TAPAT (Tonic and Phasic Alertness Training), variante dell'ANT pensata
  // per il training più che per la misura fattoriale: niente flanker né
  // scelta di direzione, solo rilevamento semplice di un target unico.
  // Blocco tonico (prima metà): nessun cue, ISI lungo e variabile —
  // sostiene l'attenzione senza aiuti esterni. Blocco fasico (seconda
  // metà): ISI più breve e fisso, metà dei trial preceduti da un cue di
  // allerta — confronto RT con/senza cue, come nell'ANT classico.
  function buildTAPAT(){
    const seq = [];
    const half = Math.floor(cfg.trials/2);
    for(let i=0;i<cfg.trials;i++){
      const block = i<half ? 'tonic' : 'phasic';
      let cueType, isiOverride;
      if(block==='tonic'){
        cueType = 'none';
        isiOverride = 4000 + Math.random()*6000; // 4-10s, imprevedibile di proposito
      } else {
        cueType = Math.random()<0.5 ? 'none' : 'center';
        isiOverride = null; // usa l'ISI normale impostato in setup
      }
      seq.push({val:'target', cueType, congruency:'neutral', side:'center', targetDir:null, correctAnswer:'go', block, isiOverride, valid:true});
    }
    return seq;
  }
  // Task-switching: regola "parity" (pari/dispari) o "magnitude" (>5 / <5)
  // su numeri 1-9 esclus 5; cambia con probabilità cfg.targetRate.
  // Due regole binarie per ciascun materiale disponibile per il task-switching.
  // classify(item) -> true = risposta "a", false = risposta "b".
  const SWITCH_RULESETS = {
    numeri: {
      ruleA:{label:'Pari / Dispari', labelA:'Pari', labelB:'Dispari', classify:v=> parseInt(v,10)%2===0},
      ruleB:{label:'Alto (>5) / Basso (<5)', labelA:'Alto (>5)', labelB:'Basso (<5)', classify:v=> parseInt(v,10)>5}
    },
    lettere: {
      ruleA:{label:'Vocale / Consonante', labelA:'Vocale', labelB:'Consonante', classify:v=> 'AEIOU'.includes(v)},
      ruleB:{label:'A–M / N–Z', labelA:'A–M', labelB:'N–Z', classify:v=> v<='M'}
    },
    colori: {
      ruleA:{label:'Caldo / Freddo', labelA:'Caldo', labelB:'Freddo', classify:v=> ['Rosso','Giallo','Arancione','Magenta'].includes(v.icon)},
      ruleB:{label:'Primario / Non primario', labelA:'Primario', labelB:'Non primario', classify:v=> ['Rosso','Blu','Giallo'].includes(v.icon)}
    }
  };
  function buildSwitching(){
    const material = cfg.switchMaterial;
    const rs = SWITCH_RULESETS[material];
    const pool = material==='numeri' ? POOLS.numeri.filter(n=> n!=='5') : POOLS[material];
    const seq = [];
    let activeRule = Math.random()<0.5 ? 'A' : 'B';
    for(let i=0;i<cfg.trials;i++){
      const isSwitch = i>0 && Math.random() < cfg.targetRate;
      if(isSwitch) activeRule = activeRule==='A' ? 'B' : 'A';
      const item = pool[Math.floor(Math.random()*pool.length)];
      const ruleDef = activeRule==='A' ? rs.ruleA : rs.ruleB;
      const correctAnswer = ruleDef.classify(item) ? 'a' : 'b';
      seq.push({val:item, rule:activeRule, ruleDef, correctAnswer, isSwitch: i===0?false:isSwitch, valid:true});
    }
    return seq;
  }
  // Doppio compito: canale visivo (lettere) + uditivo (toni), ciascuno con
  // regola 1-back indipendente, presentati simultaneamente.
  function buildDualTask(){
    const visPool = POOLS[cfg.dualVisual], audPool = POOLS.suoni;
    const seq = [];
    let prevVis=null, prevAud=null;
    for(let i=0;i<cfg.trials;i++){
      let vVal = visPool[Math.floor(Math.random()*visPool.length)];
      let aVal = audPool[Math.floor(Math.random()*audPool.length)];
      let vTarget = i>0 && Math.random()<cfg.targetRate;
      let aTarget = i>0 && Math.random()<cfg.targetRate;
      if(vTarget) vVal = prevVis;
      if(aTarget) aVal = prevAud;
      seq.push({val:vVal, visualVal:vVal, audioVal:aVal, visualIsTarget: i>0?vTarget:false, audioIsTarget: i>0?aTarget:false, valid:i>0});
      prevVis = vVal; prevAud = aVal;
    }
    return seq;
  }
  function seqLabel(v){ return (v && typeof v==='object') ? v.icon : v; }
  function describeTargetSeq(){ return cfg.targetSeq.map(seqLabel).join(' → '); }

  /* ---------- scoring ---------- */
  function scoreFromCounts(c){
    const hitRate = c.targets>0 ? c.hits/c.targets : 0;
    const faRate = c.nonTargets>0 ? c.falseAlarms/c.nonTargets : 0;
    // log-linear correction for extreme rates (Hautus, 1995)
    const hr = (c.hits+0.5)/(c.targets+1);
    const fr = (c.falseAlarms+0.5)/(c.nonTargets+1);
    const z = p => -Math.sqrt(2)*erfinv(1-2*p);
    const dprime = c.targets>0 && c.nonTargets>0 ? (z(hr)-z(fr)) : null;
    const acc = (c.hits+c.correctRejections)/(c.targets+c.nonTargets || 1);
    return {hitRate, faRate, dprime, acc};
  }
  function erfinv(x){
    const a = 0.147;
    const ln = Math.log(1-x*x);
    const t1 = 2/(Math.PI*a)+ln/2;
    return Math.sign(x)*Math.sqrt(Math.sqrt(t1*t1-ln/a)-t1);
  }

  /* ---------- storage ---------- */
  // Storage: plain browser localStorage — works fully offline, no account,
  // no server. Data stays on this device/browser only.
  async function saveSession(rec){
    const key = 'traccian:sessione:'+rec.id;
    try{ localStorage.setItem(key, JSON.stringify(rec)); }
    catch(e){ console.error(e); alert('Impossibile salvare: memoria del browser piena o non disponibile.'); }
    historyCache = null;
    pushSession(rec); // fire-and-forget: la sessione è già al sicuro in locale comunque
  }
  async function loadHistory(){
    let local;
    try{
      local = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('traccian:sessione:')===0){
          try{ local.push(JSON.parse(localStorage.getItem(k))); }catch(e){}
        }
      }
    }catch(e){ local = []; }

    if(sb && cloudUser){
      const remote = await pullRemote();
      const map = {};
      local.forEach(r=> map[r.id]=r);
      remote.forEach(r=>{
        map[r.id]=r;
        try{ localStorage.setItem('traccian:sessione:'+r.id, JSON.stringify(r)); }catch(e){}
      });
      const merged = Object.values(map).sort((a,b)=> b.ts-a.ts);
      historyCache = merged;
      return merged;
    }
    if(historyCache) return historyCache;
    local.sort((a,b)=> b.ts - a.ts);
    historyCache = local;
    return local;
  }
  function exportCSV(items){
    const head = ['data','codice_paziente','stimolo','esercizio','n_back','sequenza_bersaglio','prove','isi_ms','durata_stim_ms','modalita',
      'hit','miss','falsi_allarmi','rifiuti_corretti','accuratezza','dprime','rt_medio_ms','ssrt_ms',
      'acc_uditiva','dprime_uditivo','risposte_corrette','risposte_omesse','indice_allerta','indice_orienting','indice_conflitto','switch_cost',
      'neglect_pct_sinistra','neglect_pct_destra','neglect_omessi_sin','neglect_omessi_des','neglect_asimmetria','neglect_falsi_allarmi','note'];
    const rows = items.map(r=>{
      const family = r.family || 'signal'; // record salvati prima di questa versione
      const exLabel = EXERCISES[r.taskMode] ? EXERCISES[r.taskMode].label : (r.taskMode==='sequenza'?'sequenza':'n-back');
      return [
        r.dateLabel, r.patientCode||'', STIM_LABELS[r.stimType]||'', exLabel,
        r.taskMode==='nback'?r.nLevel:'', (r.targetSeq||[]).join('-'),
        r.trials, r.isi, r.stimDuration, r.respMode,
        family==='signal'||family==='dual' ? r.counts.hits : '',
        family==='signal'||family==='dual' ? r.counts.misses : '',
        family==='signal'||family==='dual' ? r.counts.falseAlarms : '',
        family==='signal'||family==='dual' ? r.counts.correctRejections : '',
        (family==='signal'||family==='dual') && r.metrics.acc!=null ? (r.metrics.acc*100).toFixed(1)+'%':'',
        (family==='signal'||family==='dual') && r.metrics.dprime!=null ? r.metrics.dprime.toFixed(2):'',
        family==='signal' && r.avgRT!=null ? Math.round(r.avgRT):'',
        family==='signal' && r.ssrt!=null ? Math.round(r.ssrt):'',
        family==='dual' && r.metricsAud.acc!=null ? (r.metricsAud.acc*100).toFixed(1)+'%':'',
        family==='dual' && r.metricsAud.dprime!=null ? r.metricsAud.dprime.toFixed(2):'',
        family==='choice' ? r.choice.correct+'/'+r.choice.total : '',
        family==='choice' ? r.choice.omitted : '',
        family==='choice' && r.choice.alerting!=null ? r.choice.alerting : '',
        family==='choice' && r.choice.orienting!=null ? r.choice.orienting : '',
        family==='choice' && r.choice.conflict!=null ? r.choice.conflict : '',
        family==='choice' && r.choice.switchCost!=null ? r.choice.switchCost : '',
        family==='spatial' && r.neglect.pctLeft!=null ? (r.neglect.pctLeft*100).toFixed(1)+'%':'',
        family==='spatial' && r.neglect.pctRight!=null ? (r.neglect.pctRight*100).toFixed(1)+'%':'',
        family==='spatial' ? r.neglect.omittedLeft : '',
        family==='spatial' ? r.neglect.omittedRight : '',
        family==='spatial' && r.neglect.asymmetry!=null ? r.neglect.asymmetry : '',
        family==='spatial' ? r.neglect.falseAlarms : '',
        (r.notes||'').replace(/[\n,]/g,' ')
      ];
    });
    const csv = [head.join(';')].concat(rows.map(r=>r.join(';'))).join('\n');
    const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'traccian_sessioni.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------- cloud sync (Supabase, opzionale) ---------- */
  // Tutto qui è opt-in: se cloudCfg è vuoto o la libreria non è disponibile,
  // l'app funziona esattamente come prima, solo con localStorage.
  function initSupabase(){
    if(cloudCfg.url && cloudCfg.key && window.supabase && window.supabase.createClient){
      try{ sb = window.supabase.createClient(cloudCfg.url, cloudCfg.key); }
      catch(e){ sb = null; }
    } else { sb = null; }
  }
  async function restoreCloudSession(){
    if(!sb) return;
    try{
      const { data } = await sb.auth.getSession();
      cloudUser = data && data.session ? data.session.user : null;
    }catch(e){ cloudUser = null; }
    await checkRole();
  }
  // Un account è "paziente" se esiste una riga in pazienti con id = auth.uid().
  async function checkRole(){
    patientProfile = null;
    if(!sb || !cloudUser) return;
    try{
      const { data } = await sb.from('pazienti').select('*').eq('id', cloudUser.id).maybeSingle();
      patientProfile = data || null;
    }catch(e){ patientProfile = null; }
  }
  function cloudStatusLabel(){
    if(!cloudCfg.url || !cloudCfg.key) return 'non configurata';
    if(!sb) return 'configurazione non valida';
    if(!cloudUser) return 'configurata, accesso non effettuato';
    return 'connessa · '+cloudUser.email;
  }
  async function cloudSaveConfig(url, key){
    cloudCfg = {url:url.trim().replace(/\/$/,''), key:key.trim()};
    localStorage.setItem('traccian:cloud:url', cloudCfg.url);
    localStorage.setItem('traccian:cloud:key', cloudCfg.key);
    initSupabase();
    await restoreCloudSession();
    historyCache = null; render();
  }
  async function cloudSignUp(email, pw){
    if(!sb) return;
    cloudBusy=true; render();
    const { data, error } = await sb.auth.signUp({ email, password: pw });
    cloudBusy=false;
    if(error){ alert('Errore registrazione: '+error.message); render(); return; }
    if(data.user && !data.session){ alert('Controlla la casella email per confermare l\'account, poi accedi.'); cloudUser=null; }
    else { cloudUser = data.user; await checkRole(); historyCache=null; }
    render();
  }
  async function cloudSignIn(email, pw){
    if(!sb) return;
    cloudBusy=true; render();
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
    cloudBusy=false;
    if(error){ alert('Errore accesso: '+error.message); render(); return; }
    cloudUser = data.user; await checkRole(); historyCache=null;
    view = patientProfile ? 'patientHome' : 'setup';
    render();
  }
  // Login paziente: un solo campo (codice di accesso) — internamente si
  // traduce nell'email sintetica creata dalla funzione di creazione account.
  function patientCodeToEmail(code){ return code.trim().toLowerCase()+'@paz.traccian.local'; }
  async function cloudPatientSignIn(code){
    if(!sb) return;
    const normalized = code.trim().toUpperCase();
    cloudBusy=true; render();
    const { data, error } = await sb.auth.signInWithPassword({ email: patientCodeToEmail(normalized), password: normalized });
    cloudBusy=false;
    if(error){ alert('Codice non riconosciuto: '+error.message); render(); return; }
    cloudUser = data.user; await checkRole(); historyCache=null;
    if(!patientProfile){ alert('Questo account non risulta un account paziente valido.'); await cloudSignOut(); return; }
    view='patientHome'; render();
  }
  async function cloudSignOut(){
    if(sb) try{ await sb.auth.signOut(); }catch(e){}
    cloudUser = null; patientProfile = null; historyCache = null;
    view='setup'; render();
  }
  // Crea un nuovo account paziente tramite la Edge Function (unico punto che
  // può creare account, perché richiede la service_role key lato server —
  // mai esposta al browser). Restituisce {codiceAccesso, pazienteId} o null.
  async function createPatientAccount(codicePaziente){
    if(!sb || !cloudUser || patientProfile) return null; // solo operatori
    try{
      const { data: sessionData } = await sb.auth.getSession();
      const token = sessionData && sessionData.session ? sessionData.session.access_token : null;
      if(!token){ alert('Sessione non valida, riaccedi.'); return null; }
      const fnUrl = cloudCfg.url.replace('.supabase.co', '.functions.supabase.co') + '/create-patient';
      const resp = await fetch(fnUrl, {
        method:'POST',
        headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+token},
        body: JSON.stringify({codicePaziente})
      });
      const json = await resp.json();
      if(!resp.ok){ alert('Errore creazione paziente: '+(json.error||'sconosciuto')); return null; }
      return json;
    }catch(e){ alert('Errore di rete nella creazione del paziente: '+e.message); return null; }
  }
  async function listMyPatients(){
    if(!sb || !cloudUser || patientProfile) return [];
    try{
      const { data, error } = await sb.from('pazienti').select('*').eq('operatore_id', cloudUser.id).order('creato_il',{ascending:false});
      if(error) throw error;
      return data||[];
    }catch(e){ console.error(e); return []; }
  }
  async function assignProgramToPatient(pazienteId, program){
    if(!sb || !cloudUser) return false;
    try{
      const { error } = await sb.from('pazienti').update({programma_assegnato:program}).eq('id', pazienteId).eq('operatore_id', cloudUser.id);
      if(error) throw error;
      return true;
    }catch(e){ alert('Errore assegnazione: '+e.message); return false; }
  }
  // Normalizza il programma di un paziente in un array {nome, cfg}[], sia per
  // i pazienti nuovi (programma_assegnato) sia per quelli assegnati prima
  // che esistesse il multi-esercizio (preset_assegnato singolo).
  function patientProgram(p){
    if(!p) return [];
    if(p.programma_assegnato && p.programma_assegnato.length) return p.programma_assegnato;
    if(p.preset_assegnato){
      const c = p.preset_assegnato;
      const nome = EXERCISES[c.taskMode] ? EXERCISES[c.taskMode].label : c.taskMode;
      return [{nome, cfg:c}];
    }
    return [];
  }
  function recToRow(rec){
    const isPatientSaving = !!patientProfile;
    return {
      id: rec.id,
      user_id: cloudUser.id, // retro-compatibilità con record vecchi
      operatore_id: isPatientSaving ? patientProfile.operatore_id : cloudUser.id,
      paziente_id: isPatientSaving ? cloudUser.id : (rec.pazienteId || null),
      local_patient_id: rec.localPatientId || null,
      ts: rec.ts, date_label: rec.dateLabel,
      stim_type: rec.stimType, n_level: rec.nLevel, trials: rec.trials, isi: rec.isi,
      stim_duration: rec.stimDuration, resp_mode: rec.respMode, patient_code: rec.patientCode,
      notes: rec.notes, task_mode: rec.taskMode, target_seq: rec.targetSeq,
      counts: rec.counts, metrics: rec.metrics, avg_rt: rec.avgRT, duration_ms: rec.durationMs,
      family: rec.family || null, counts_aud: rec.countsAud || null, metrics_aud: rec.metricsAud || null,
      choice: rec.choice || null, ssrt: rec.ssrt!=null?rec.ssrt:null, mean_ssd: rec.meanSSD!=null?rec.meanSSD:null,
      neglect: rec.neglect || null
    };
  }
  function rowToRec(row){
    return {
      id: row.id, ts: row.ts, dateLabel: row.date_label, stimType: row.stim_type, nLevel: row.n_level,
      trials: row.trials, isi: row.isi, stimDuration: row.stim_duration, respMode: row.resp_mode,
      patientCode: row.patient_code, notes: row.notes, taskMode: row.task_mode, targetSeq: row.target_seq,
      counts: row.counts, metrics: row.metrics, avgRT: row.avg_rt, durationMs: row.duration_ms,
      family: row.family || 'signal', countsAud: row.counts_aud, metricsAud: row.metrics_aud,
      choice: row.choice, ssrt: row.ssrt, meanSSD: row.mean_ssd, neglect: row.neglect,
      pazienteId: row.paziente_id || null, localPatientId: row.local_patient_id || null
    };
  }
  async function pushSession(rec){
    if(!sb || !cloudUser) return;
    try{ await sb.from('sessioni').upsert(recToRow(rec)); }
    catch(e){ console.error('sync push fallita', e); }
  }
  async function pullRemote(){
    if(!sb || !cloudUser) return [];
    try{
      const { data, error } = await sb.from('sessioni').select('*')
        .or('operatore_id.eq.'+cloudUser.id+',paziente_id.eq.'+cloudUser.id)
        .order('ts',{ascending:false});
      if(error) throw error;
      return (data||[]).map(rowToRec);
    }catch(e){ console.error('sync pull fallita', e); return []; }
  }

  /* ---------- SETUP SCREEN ---------- */
  function ScreenSetup(root){
    root.appendChild(el('div',{class:'brand'},[
      el('div',{class:'mark'},['Traccia',el('span',{},['N'])]),
      el('div',{class:'sub'},['CT MRI'])
    ]));
    const s = el('div',{class:'screen'});
    const card = el('div',{class:'card'});
    if(!patientProfile){
      card.appendChild(localPatientDropdown());
    }
    card.appendChild(el('h2',{},['Imposta la sessione']));
    card.appendChild(el('p',{class:'hint'},['Scegli il tipo di stimolo, il livello n-back e i parametri temporali. I valori restano impostati per la prossima sessione.']));

    card.appendChild(presetSection());

    const grid = el('div',{class:'grid'});
    const ex = EXERCISES[cfg.taskMode];

    // exercise selector (comes first: it determines which other fields apply)
    grid.appendChild(field('Esercizio', segButtons(Object.keys(EXERCISES), cfg.taskMode, v=>{
      cfg.taskMode=v;
      const nv = EXERCISES[v];
      if(nv.usesTargetSeq){
        if(v==='neglect'){ if(!cfg.targetSeq) cfg.targetSeq=[]; if(cfg.targetSeq.length>4) cfg.targetSeq=cfg.targetSeq.slice(0,2); }
        else {
          const len = v==='gonogo' ? 1 : 3;
          if(!cfg.targetSeq || !cfg.targetSeq.length || cfg.targetSeq.length!==len) cfg.targetSeq = defaultTargetSeq(cfg.stimType, len);
        }
      }
      if(v==='ant' && cfg.trials<60) cfg.trials = 72;
      if(v==='neglect' && cfg.trials>10) cfg.trials = 3;
      if(v!=='neglect' && v!=='ant' && cfg.trials<10) cfg.trials = 24;
      render();
    }, Object.fromEntries(Object.entries(EXERCISES).map(([k,v])=>[k,v.label])))));

    // stimulus type — solo per gli esercizi che ne hanno uno configurabile
    // (l'ANT classico usa sempre frecce fisse, il TAPAT invece sceglie il materiale)
    const isClassicAnt = cfg.taskMode==='ant' && cfg.antMode==='classico';
    if(ex.usesStimType && !isClassicAnt){
      grid.appendChild(field('Tipo di stimolo', segButtons(Object.keys(STIM_LABELS).filter(k=> !(cfg.taskMode==='stopsignal' && k==='suoni')), cfg.stimType, v=>{
        cfg.stimType=v;
        if(ex.usesTargetSeq) cfg.targetSeq = cfg.taskMode==='neglect' ? [] : defaultTargetSeq(v, cfg.taskMode==='gonogo' ? 1 : 3);
        render();
      }, STIM_LABELS)));
    }

    if(cfg.taskMode==='nback'){
      grid.appendChild(field('Livello n-back', stepper(cfg.nLevel,1,5,v=>{cfg.nLevel=v; render();})));
    }
    if(cfg.taskMode==='nback' || (cfg.taskMode==='ant' && cfg.antMode==='tapat')){
      grid.appendChild(field('Difficoltà adattiva', segButtons(['no','si'], cfg.adaptive?'si':'no', v=>{ cfg.adaptive = v==='si'; render(); }, {no:'Fissa (manuale)', si:'Adattiva automatica'})));
    }
    const isNeglect = cfg.taskMode==='neglect';
    // trials (per il neglect: numero di tavole)
    if(!isNeglect){
      grid.appendChild(field('Numero di prove', stepper(cfg.trials,10,100,v=>{cfg.trials=v; updateDurEst();},4)));
      // ISI
      grid.appendChild(field('Intervallo tra stimoli (ISI)', stepper(cfg.isi,1000,4000,v=>{cfg.isi=v; updateDurEst();},200,ms=>(ms/1000).toFixed(1)+' s')));
      // stim duration
      grid.appendChild(field('Durata di presentazione', stepper(cfg.stimDuration,200,Math.min(2000,cfg.isi),v=>{cfg.stimDuration=Math.min(v,cfg.isi-100);},100,ms=>ms+' ms')));
    } else {
      grid.appendChild(field('Numero di tavole', stepper(cfg.trials,1,10,v=>{cfg.trials=v;},1)));
      grid.appendChild(field('Elementi per tavola', stepper(cfg.neglectBoardSize,15,80,v=>{cfg.neglectBoardSize=v;},5)));
      grid.appendChild(field('Distribuzione bersagli', segButtons(['simmetrica','sbilanciata-sinistra','sbilanciata-destra'], cfg.neglectDistribution, v=>{cfg.neglectDistribution=v; render();}, {simmetrica:'Simmetrica', 'sbilanciata-sinistra':'Più a sinistra', 'sbilanciata-destra':'Più a destra'})));
      grid.appendChild(field('Tempo limite per tavola', stepper(cfg.neglectTimeLimit,0,180,v=>{cfg.neglectTimeLimit=v;},15,s=> s===0?'nessuno':s+' s')));
    }

    // target rate — riusato con etichetta diversa per ciascun esercizio
    const rateLabels = {
      nback:'Frequenza target', sequenza:'Frequenza target', gonogo:'Frequenza no-go',
      stopsignal:'Frequenza trial di stop', switching:'Frequenza cambio regola'
    };
    if(rateLabels[cfg.taskMode]){
      grid.appendChild(field(rateLabels[cfg.taskMode], stepper(Math.round(cfg.targetRate*100),15,45,v=>{cfg.targetRate=v/100; render();},5,v=>v+'%')));
    }

    // Stop-Signal: parametri dello staircase SSD
    if(cfg.taskMode==='stopsignal'){
      grid.appendChild(field('Ritardo iniziale segnale di stop (SSD)', stepper(cfg.ssd,0,cfg.isi-100,v=>{cfg.ssd=v; render();},50,ms=>ms+' ms')));
      grid.appendChild(field('Passo di adattamento SSD', stepper(cfg.ssdStep,10,150,v=>{cfg.ssdStep=v; render();},10,ms=>ms+' ms')));
    }

    card.appendChild(grid);

    if(ex.usesTargetSeq){
      card.appendChild(sequenceEditor());
    }
    if(isNeglect){
      card.appendChild(el('p',{class:'hint'},['Compaiono molti elementi contemporaneamente sulla tavola: quelli scelti sopra sono i bersagli da toccare, tutti gli altri sono distrattori. La distribuzione sinistra/destra permette di caricare deliberatamente un lato, utile per il training del neglect.']));
    }
    if(cfg.taskMode==='ant'){
      card.appendChild(field('Modalità', segButtons(['classico','tapat'], cfg.antMode, v=>{cfg.antMode=v; render();}, {classico:'ANT classico (misura)', tapat:'TAPAT (training tonico/fasico)'})));
      if(cfg.antMode==='tapat'){
        card.appendChild(el('p',{class:'hint'},['Variante orientata al training, non alla misura: prima metà delle prove senza cue e con intervalli lunghi e imprevedibili (allerta tonica/sostenuta), seconda metà con intervalli più brevi e un cue di allerta in metà dei casi (allerta fasica). Risposta: tocca appena vedi il bersaglio, non c\'è scelta di direzione.']));
        if(cfg.adaptive){
          card.appendChild(el('p',{class:'hint'},['La difficoltà del blocco tonico (durata delle attese) sale se l\'accuratezza supera l\'85% negli ultimi 8 trial validi, scende sotto il 70% — 5 livelli, dalle attese brevi (2-4s) a quelle lunghe e imprevedibili (8-15s). Puoi comunque forzare il livello con i pulsanti +/– nella barra in alto durante la sessione.']));
        }
      } else {
        card.appendChild(el('p',{class:'hint'},['Versione semplificata dell\'Attention Network Test: allerta (cue presente/assente), orienting (cue spaziale valido/invalido), conflitto (flanker congruenti/incongruenti/neutri). Il paziente indica la direzione della freccia centrale.']));
        if(cfg.trials<60){
          card.appendChild(el('p',{class:'hint', style:'color:var(--alert);'},['⚠ Gli indici si calcolano su 9 combinazioni cue×congruenza: con meno di 60 prove, ciascuna media poggia su troppo pochi trial per essere affidabile. Consigliate almeno 60–90 prove per questo esercizio.']));
        }
      }
    }
    if(cfg.taskMode==='switching'){
      card.appendChild(field('Materiale', segButtons(Object.keys(SWITCH_RULESETS), cfg.switchMaterial, v=>{ cfg.switchMaterial=v; render(); }, {numeri:'Numeri', lettere:'Lettere', colori:'Colori'})));
      const rs = SWITCH_RULESETS[cfg.switchMaterial];
      card.appendChild(el('p',{class:'hint'},['Regole di questa sessione: "'+rs.ruleA.label+'" ↔ "'+rs.ruleB.label+'". Un\'etichetta prima di ogni stimolo indica quale regola è attiva in quel momento.']));
    }
    if(cfg.taskMode==='dualtask'){
      card.appendChild(field('Materiale canale visivo', segButtons(['lettere','numeri','simboli','colori'], cfg.dualVisual, v=>{ cfg.dualVisual=v; render(); }, STIM_LABELS)));
      card.appendChild(el('p',{class:'hint'},['Canale visivo ('+STIM_LABELS[cfg.dualVisual].toLowerCase()+') e canale uditivo (toni) simultanei, ciascuno con regola 1-back propria — il paziente ha due pulsanti indipendenti, uno per canale.']));
    }
    if(cfg.taskMode==='nback' && cfg.adaptive){
      card.appendChild(el('p',{class:'hint'},['Il livello sale di 1 se l\'accuratezza supera l\'85% negli ultimi 8 trial validi, scende sotto il 70% (fascia 70–85% invariata) — livello minimo 1, massimo 5. Durante la sessione puoi comunque forzare il livello manualmente con i pulsanti +/– nella barra in alto: l\'automatismo riprende dal valore che imposti.']));
    }

    // response mode
    const respWrap = el('div',{class:'field'});
    respWrap.appendChild(el('label',{},['Modalità di raccolta risposte']));
    respWrap.appendChild(segButtons(['paziente','operatore','manuale'], cfg.respMode, v=>{cfg.respMode=v; render();}, {
      paziente:'Touch — risponde il paziente', operatore:'Touch — segna l\'operatore', manuale:'Inserimento manuale a fine sessione'
    }));
    card.appendChild(respWrap);

    // voice toggle for verbal stimuli
    if(ex.usesStimType && !isClassicAnt && ['lettere','numeri','parole'].includes(cfg.stimType)){
      const vWrap = el('div',{class:'field'});
      vWrap.appendChild(el('label',{},['Presentazione']));
      vWrap.appendChild(segButtons(['no','si'], cfg.voice?'si':'no', v=>{cfg.voice = v==='si'; render();}, {no:'Visiva', si:'Visiva + uditiva (sintesi vocale)'}));
      card.appendChild(vWrap);
    }

    // patient code
    const pc = el('div',{class:'field'});
    pc.appendChild(el('label',{},['Codice paziente (facoltativo, non usare il nominativo)']));
    const inp = el('input',{type:'text', placeholder:'es. PT-014', value:cfg.patientCode});
    inp.addEventListener('input', e=>{ cfg.patientCode = e.target.value; });
    pc.appendChild(inp);
    card.appendChild(pc);

    const durEstP = el('p',{class:'hint'},['Durata stimata della sessione: '+fmtTime(cfg.isi*cfg.trials)+'.']);
    function updateDurEst(){ durEstP.textContent = 'Durata stimata della sessione: '+fmtTime(cfg.isi*cfg.trials)+'.'; }
    card.appendChild(durEstP);

    card.appendChild(el('button',{class:'primary', onclick:()=>{
      if(cfg.taskMode==='sequenza' && cfg.targetSeq.length<2){ alert('Costruisci prima la sequenza bersaglio (almeno 2 elementi).'); return; }
      if(cfg.taskMode==='gonogo' && (!cfg.targetSeq || cfg.targetSeq.length<1)){ alert('Seleziona prima l\'elemento no-go.'); return; }
      if(cfg.taskMode==='neglect' && (!cfg.targetSeq || cfg.targetSeq.length<1)){ alert('Seleziona prima almeno un elemento bersaglio da cancellare.'); return; }
      view='instructions'; render();
    }},['Avvia sessione']));

    const nav = el('div',{class:'navlinks'});
    nav.appendChild(el('button',{class:'link', onclick:()=>{ view='history'; render(); }},['Storico sessioni →']));
    nav.appendChild(el('button',{class:'link', onclick:()=>{ view='cloud'; render(); }},['Sincronizzazione cloud ('+cloudStatusLabel()+') →']));
    card.appendChild(nav);

    s.appendChild(card);
    root.appendChild(s);
  }

  function field(label, control){
    const f = el('div',{class:'field'});
    f.appendChild(el('label',{},[label]));
    f.appendChild(control);
    return f;
  }
  function segButtons(values, current, onPick, labels){
    const wrap = el('div',{class:'seg'});
    values.forEach(v=>{
      const b = el('button',{class: v===current?'on':'', onclick:()=>onPick(v)},[(labels&&labels[v])||v]);
      wrap.appendChild(b);
    });
    return wrap;
  }
  function stepper(val,min,max,onChange,step,fmt){
    step = step||1;
    let cur = val;
    const wrap = el('div',{class:'stepper'});
    const valNode = el('div',{class:'val'},[fmt? fmt(cur) : String(cur)]);
    function set(nv){
      cur = Math.max(min,Math.min(max,nv));
      valNode.textContent = fmt? fmt(cur) : String(cur);
      onChange(cur);
    }
    wrap.appendChild(el('button',{onclick:()=>set(cur-step)},['–']));
    wrap.appendChild(valNode);
    wrap.appendChild(el('button',{onclick:()=>set(cur+step)},['+']));
    return wrap;
  }
  function sequenceEditor(){
    const isGoNoGo = cfg.taskMode==='gonogo';
    const isNeglect = cfg.taskMode==='neglect';
    const wrap = el('div',{class:'field'});
    const label = isGoNoGo ? 'Elemento no-go (tocca quello su cui NON si deve rispondere)'
      : isNeglect ? 'Elementi bersaglio da cancellare (1–4, l\'ordine non conta)'
      : 'Sequenza bersaglio (tocca gli elementi nell\'ordine desiderato, 2–6 elementi)';
    wrap.appendChild(el('label',{},[label]));

    const preview = el('div',{class:'seqpreview'},[
      cfg.targetSeq.length ? cfg.targetSeq.map(seqLabel).join(isNeglect ? ', ' : ' → ') : (isGoNoGo||isNeglect ? '(nessuno selezionato)' : '(sequenza vuota)')
    ]);
    wrap.appendChild(preview);

    const pool = POOLS[cfg.stimType];
    const chips = el('div',{class:'seg'});
    pool.forEach(item=>{
      const itemLabel = seqLabel(item);
      const attrs = {onclick:()=>{
        if(cfg.stimType==='suoni') playTone(item, 350);
        if(isGoNoGo){ cfg.targetSeq = [item]; render(); }
        else if(isNeglect){
          if(cfg.targetSeq.some(t=>seqLabel(t)===itemLabel)) return; // già presente
          if(cfg.targetSeq.length < 4){ cfg.targetSeq = cfg.targetSeq.concat([item]); render(); }
        }
        else if(cfg.targetSeq.length < 6){ cfg.targetSeq = cfg.targetSeq.concat([item]); render(); }
      }};
      if(cfg.stimType==='colori') attrs.style = 'background:'+item.hex+'; color:#fff; border-color:'+item.hex+';';
      chips.appendChild(el('button',attrs,[itemLabel]));
    });
    wrap.appendChild(chips);

    if(!isGoNoGo){
      const ctrl = el('div',{class:'rowbtns'});
      ctrl.appendChild(el('button',{class:'ghost', onclick:()=>{ cfg.targetSeq = cfg.targetSeq.slice(0,-1); render(); }},['← Rimuovi ultimo']));
      ctrl.appendChild(el('button',{class:'ghost', onclick:()=>{ cfg.targetSeq = isNeglect ? [] : defaultTargetSeq(cfg.stimType,3); render(); }},['Reimposta']));
      wrap.appendChild(ctrl);
      if(!isNeglect && cfg.targetSeq.length < 2){
        wrap.appendChild(el('p',{class:'hint'},['Servono almeno 2 elementi in sequenza.']));
      }
      if(isNeglect && cfg.targetSeq.length < 1){
        wrap.appendChild(el('p',{class:'hint'},['Seleziona almeno 1 elemento bersaglio.']));
      }
    }
    return wrap;
  }
