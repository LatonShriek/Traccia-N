<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>TracciaN — batteria di training cognitivo</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2430">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TracciaN">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --ink:#1C2430;
    --paper:#F6F4EF;
    --paper-dim:#EAE6DC;
    --focus:#212C39;
    --focus-2:#2B3A4A;
    --signal:#4C7A6B;
    --signal-soft:#DCE8E3;
    --alert:#B5544A;
    --alert-soft:#F2DEDB;
    --accent:#D9A441;
    --line:#D8D2C4;
    --ink-soft:#5B6472;
    --white:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif; overscroll-behavior:none; user-select:none;}
  #app{min-height:100vh; display:flex; flex-direction:column;}

  .brand{display:flex; align-items:baseline; gap:10px; padding:22px 28px 6px;}
  .brand .mark{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:-0.02em;}
  .brand .mark span{color:var(--accent);}
  .brand .sub{font-size:12.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}

  .screen{flex:1; display:flex; flex-direction:column; padding:0 28px 28px;}
  .card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:22px;}

  h2{font-family:'Space Grotesk',sans-serif; font-size:19px; margin:0 0 4px; letter-spacing:-0.01em;}
  .hint{font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; line-height:1.5;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:400px){
    .card{padding:14px;}
    .tapbtn{padding:16px 10px; font-size:15px;}
    .stage{min-height:50vh;}
    .respond{padding:12px;}
  }
  @media (max-width:720px){.grid{grid-template-columns:1fr;}}

  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); margin-bottom:8px;}
  .seg{display:flex; flex-wrap:wrap; gap:8px;}
  .seg button{border:1.5px solid var(--line); background:var(--paper); color:var(--ink); font-family:'Inter';
    font-size:13.5px; font-weight:600; padding:12px 14px; min-height:44px; border-radius:10px; cursor:pointer; transition:.15s;}
  .seg button.on{background:var(--focus); border-color:var(--focus); color:var(--white);}
  .seg button:active{transform:scale(.96);}

  .stepper{display:flex; align-items:center; gap:14px;}
  .stepper button{width:38px; height:38px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper);
    font-size:18px; font-weight:700; cursor:pointer; color:var(--ink);}
  .stepper .val{font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; min-width:74px; text-align:center;}

  .seqpreview{font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:700; background:var(--paper-dim);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px;}

  input, select, textarea{
    width:100%; box-sizing:border-box; padding:12px 14px; min-height:48px;
    border:1.5px solid var(--line); border-radius:10px;
    font-family:'Inter'; font-size:16px; background:var(--paper); color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  .pwfield{position:relative;}
  .pwfield input{padding-right:46px;}
  .pwtoggle{position:absolute; right:4px; top:50%; transform:translateY(-50%); width:40px; height:40px;
    border:none; background:transparent; font-size:18px; cursor:pointer; border-radius:8px; padding:0;
    display:flex; align-items:center; justify-content:center;}
  .pwtoggle:active{background:var(--paper-dim);}
  @media (min-width:560px){
    .authcard{max-width:420px; margin-left:auto; margin-right:auto;}
  }

  .primary{background:var(--focus); color:var(--white); border:none; border-radius:12px; padding:16px 22px;
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; cursor:pointer; width:100%;}
  .primary:active{transform:scale(.985);}
  .ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line); border-radius:12px; padding:13px 18px;
    min-height:44px; font-family:'Inter'; font-weight:600; font-size:14px; cursor:pointer;}
  .rowbtns{display:flex; gap:12px; margin-top:6px;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 22px; background:var(--focus); color:var(--white);
    flex-wrap:wrap; row-gap:8px;}
  .topbar .info{font-family:'JetBrains Mono',monospace; font-size:12.5px; opacity:.85; flex:1 1 180px; min-width:0; overflow-wrap:anywhere;}
  .topbar button{background:rgba(255,255,255,.12); color:var(--white); border:1px solid rgba(255,255,255,.25);
    border-radius:8px; padding:8px 12px; font-size:12.5px; cursor:pointer;}
  .topbar-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .stage{flex:1; background:var(--focus); background:linear-gradient(180deg,var(--focus),var(--focus-2));
    display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; min-height:60vh;}
  .stimulus{font-family:'Space Grotesk',sans-serif; font-weight:700; color:var(--white); font-size:min(22vw,180px);
    line-height:1; letter-spacing:-0.01em;}
  .stimulus.symbolwrap{font-size:min(18vw,150px);}
  .stimulus.word{font-size:min(11vw,64px);}
  .colorcircle{width:min(45vw,220px); height:min(45vw,220px); border-radius:50%; box-shadow:0 8px 30px rgba(0,0,0,.35);}
  .neglect-board{flex:1; position:relative; background:var(--paper); min-height:60vh;}
  .neglect-item{position:absolute; width:9%; aspect-ratio:1; max-width:64px; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center; border-radius:10px; background:var(--white);
    border:1.5px solid var(--line); font-family:'Space Grotesk',sans-serif; font-weight:700;
    font-size:clamp(14px,3vw,22px); color:var(--ink); cursor:pointer; user-select:none; touch-action:manipulation;}
  .neglect-item.found{background:var(--signal-soft); border-color:var(--signal); opacity:.45;}
  .neglect-item.falsetap{background:var(--alert-soft); border-color:var(--alert); opacity:.6;}
  .neglect-item.cue-pulse{animation: neglectCuePulse 1.1s ease-in-out infinite;}
  @keyframes neglectCuePulse{
    0%, 100% { box-shadow: 0 0 0 0 rgba(217,164,65,.55); }
    50% { box-shadow: 0 0 0 8px rgba(217,164,65,0); }
  }
  .blank{color:rgba(255,255,255,.18); font-size:min(14vw,110px); font-family:'Space Grotesk',sans-serif;}

  .audio-pulse{width:120px; height:120px; border-radius:50%; border:3px solid var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:44px;}
  .audio-pulse.active{animation:pulse .5s ease-out;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,164,65,.55);}100%{box-shadow:0 0 0 26px rgba(217,164,65,0);}}

  .trail{display:flex; gap:6px; position:absolute; bottom:22px; left:0; right:0; justify-content:center; flex-wrap:wrap; padding:0 12px;}
  .trail .chip{width:26px; height:26px; border-radius:7px; background:rgba(255,255,255,.12); border:2px solid transparent;}
  .trail .chip.hit{border-color:var(--signal); background:rgba(76,122,107,.5);}
  .trail .chip.err{border-color:var(--alert); background:rgba(181,84,74,.5);}
  .trail .chip.pend{border-color:rgba(255,255,255,.3);}

  .respond{padding:18px 22px 26px; background:var(--focus-2); display:flex; flex-wrap:wrap; gap:14px;}
  button{touch-action:manipulation; cursor:pointer;}
  @media (hover:hover){
    .seg button:hover{border-color:var(--ink-soft);}
    .primary:hover{filter:brightness(1.1);}
    .ghost:hover{background:var(--paper-dim);}
    .tapbtn:hover{filter:brightness(1.08);}
    .topbar button:hover{background:rgba(255,255,255,.2);}
    .stepper button:hover{background:var(--paper-dim);}
    .navlinks .link:hover, .navlinks a:hover{color:var(--ink);}
    .histrow > div:first-child:hover{opacity:.75;}
  }
  /* Su schermi larghi (desktop) centra i contenuti invece di stenderli
     a piena larghezza — l'app resta comunque a piena larghezza su tablet. */
  @media (min-width:820px){
    .brand, .screen{max-width:960px; margin-left:auto; margin-right:auto; width:100%;}
    .topbar, .stage, .respond{max-width:960px; margin-left:auto; margin-right:auto; width:100%; box-sizing:border-box;}
    .grid{grid-template-columns:repeat(auto-fit, minmax(240px,1fr));}
  }
  .tapbtn{flex:1 1 130px; padding:22px; border-radius:16px; border:none; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:18px; cursor:pointer; letter-spacing:.01em; transition:transform .08s, filter .08s;
    min-width:0; overflow-wrap:break-word;}
  .tapbtn.match{background:var(--accent); color:var(--ink);}
  .tapbtn.nomatch{background:rgba(255,255,255,.1); color:var(--white); border:1.5px solid rgba(255,255,255,.25);}
  .tapbtn.full{flex:1 1 100%;}
  /* Zone di risposta grandi (accessibilità, bassa vista): le due zone
     occupano gran parte dell'altezza disponibile, non solo una fascia in
     basso — pensate per essere trovabili "a tastoni" o con vista molto
     ridotta, senza dover mirare a un bersaglio piccolo. */
  .respond-large{min-height:38vh;}
  .tapbtn-large{min-height:38vh; font-size:28px !important; font-weight:700;}
  .tapbtn:active, .tapbtn.tapped{transform:scale(.96); filter:brightness(1.18);}
  .stopcue-full{width:min(70vw,320px); height:min(70vw,320px); border-radius:50%; background:var(--alert);
    display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:min(12vw,56px); letter-spacing:.06em; animation:stoppulse .22s ease-out;}
  @keyframes stoppulse{0%{transform:scale(.7); opacity:.4;}100%{transform:scale(1); opacity:1;}}

  .flash{position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity .25s;}
  .flash.on{opacity:1;}

  table{width:100%; border-collapse:collapse; font-family:'JetBrains Mono',monospace; font-size:13.5px;}
  td,th{padding:9px 6px; border-bottom:1px solid var(--line); text-align:left;}
  th{color:var(--ink-soft); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;}
  .metricgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:14px 0 20px;}
  .metric{background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px;}
  .metric .n{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:24px;}
  .metric .l{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:2px;}

  .histrow{display:flex; flex-wrap:wrap; gap:6px 10px; justify-content:space-between; align-items:center; padding:12px 4px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .histrow > *:first-child{flex:1 1 160px; min-width:0;}
  .histrow > *:first-child *{overflow-wrap:break-word;}
  .histrow .l{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft);}
  .empty{color:var(--ink-soft); font-size:13.5px; padding:20px 4px; text-align:center;}
  @media (min-width:820px){
    .stimulus{font-size:min(16vw,280px) !important;}
    .stimulus.symbolwrap{font-size:min(13vw,230px) !important;}
    .stimulus.word{font-size:min(8vw,110px) !important;}
    .colorcircle{width:min(30vw,320px) !important; height:min(30vw,320px) !important;}
    .blank{font-size:min(9vw,160px) !important;}
    .stopcue-full{width:min(40vw,420px) !important; height:min(40vw,420px) !important; font-size:min(7vw,72px) !important;}
  }
  .navlinks{display:flex; gap:10px; margin-top:16px;}
  .landing-choices{display:flex; flex-direction:column; gap:14px; margin-top:8px;}
  .landing-card{display:flex; flex-direction:column; align-items:flex-start; gap:8px; text-align:left;
    background:var(--paper); border:1.5px solid var(--line); border-radius:16px; padding:24px;
    cursor:pointer; transition:.15s; flex:1;}
  .landing-card:active{transform:scale(.98);}
  .landing-icon{font-size:32px;}
  .landing-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px; color:var(--ink);}
  .landing-desc{font-size:13px; color:var(--ink-soft); line-height:1.5;}
  @media (hover:hover){ .landing-card:hover{border-color:var(--accent); background:var(--paper-dim);} }
  @media (min-width:560px){ .landing-choices{flex-direction:row;} }
  .navlinks a, .navlinks .link{color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; background:none; border:none; font-family:'Inter';}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ---------- data pools ---------- */
  const POOLS = {
    lettere: ['A','B','C','D','E','F','G','H','I','L','M','N','O','P','R','S','T','U','V'],
    numeri:  ['1','2','3','4','5','6','7','8','9'], // rigenerato per sessione da regenerateNumeriPool(), in base a cfg.numDigits
    simboli: ['●','■','▲','◆','★','✚','⬟','⬤'],
    parole:  [], // rigenerato da regenerateParolePool(), in base a cfg.wordComplexity
    suoni:   [
      {f:220,type:'sine',icon:'A'},{f:294,type:'square',icon:'B'},{f:349,type:'sine',icon:'C'},
      {f:392,type:'triangle',icon:'D'},{f:466,type:'square',icon:'E'},{f:523,type:'triangle',icon:'F'}
    ],
    // Materiali dedicati allo Stop-Signal two-choice: frecce (sinistra/destra,
    // stesso alfabeto grafico dell'ANT classico) e forma (cerchio/triangolo,
    // sottoinsieme di 'simboli' scelto apposta perché la coppia sia
    // percettivamente inequivocabile — non "rotondo/con angoli" come nello
    // Task-switching, ma le due forme letterali richieste).
    frecce:  ['◀','▶'],
    forma:   ['●','▲'],
    suoni2:  [ // registro più acuto, timbro diverso — usato per il secondo canale nel doppio compito uditivo-uditivo
      {f:660,type:'sine',icon:'G'},{f:740,type:'square',icon:'H'},{f:831,type:'triangle',icon:'I'},
      {f:932,type:'sine',icon:'J'},{f:1046,type:'square',icon:'K'},{f:1175,type:'triangle',icon:'L'}
    ],
    colori: [
      {hex:'#D64545', icon:'Rosso'}, {hex:'#3B72D6', icon:'Blu'}, {hex:'#3FA34D', icon:'Verde'},
      {hex:'#E0B12D', icon:'Giallo'}, {hex:'#8E4EC6', icon:'Viola'}, {hex:'#E07B2D', icon:'Arancione'},
      {hex:'#2DB6C7', icon:'Ciano'}, {hex:'#D6469B', icon:'Magenta'}
    ]
  };
  POOLS.lettereVoce = POOLS.lettere; // stessi contenuti di 'lettere', letti dal sintetizzatore invece che mostrati
  POOLS.numeriVoce = POOLS.numeri;   // tenuto sincronizzato con POOLS.numeri in regenerateNumeriPool()
  const STIM_LABELS = {lettere:'Lettere', numeri:'Numeri', simboli:'Simboli', parole:'Parole', suoni:'Suoni', colori:'Colori', lettereVoce:'Lettere pronunciate', numeriVoce:'Numeri pronunciati', paroleVoce:'Parole pronunciate', frecce:'Frecce', forma:'Forma'};
  // Stimoli uditivi puri: 'suoni' (toni) e le due varianti "voce" (lettere o
  // numeri letti dal sintetizzatore vocale, nessuna rivelazione visiva) —
  // stessa idea del canale acustico del Doppio compito, ma come tipo di
  // stimolo autonomo utilizzabile in qualunque esercizio con usesStimType.
  function isSpokenStim(t){ return t==='lettereVoce' || t==='numeriVoce' || t==='paroleVoce'; }
  function isAudioOnlyStim(t){ return t==='suoni' || isSpokenStim(t); }
  // Riproduce lo stimolo per il tipo corrente — un'unica chiamata invece di
  // ripetere ovunque il branch toni/voce.
  function playStimulusAudio(stimType, val, dur){
    if(stimType==='suoni') playTone(val, dur);
    else if(isSpokenStim(stimType)) speak(String(val));
  }
  const STOP_TONE = {f:140, type:'square'}; // segnale di stop uditivo, sempre lo stesso, distinto dagli stimoli
  const TAPAT_CUE_TONE = {f:880, type:'sine'}; // segnale di allerta fasico TAPAT — acuto e breve, non lateralizzato: raggiunge il paziente indipendentemente da dove guarda (importante per la variante spaziale/neglect, dove un cue solo visivo rischierebbe di cadere nell'emicampo trascurato)
  const TAPAT_TARGET_TONE = {f:330, type:'square'}; // bersaglio della variante uditiva del TAPAT — deliberatamente distinto dal cue (più grave, timbro diverso): il paziente deve poter distinguere "sta per arrivare qualcosa" (cue, 880Hz sine) da "è arrivato, rispondi" (bersaglio, 330Hz square), non confonderli
  // Come playTone, ma con panning stereo opzionale (-1 tutto a sinistra,
  // 0 centro, 1 tutto a destra) — usato solo dalla componente spaziale
  // del TAPAT uditivo. Su un dispositivo con un solo altoparlante (mono)
  // il panning non ha alcun effetto percettibile: il suono si sente
  // comunque, semplicemente non lateralizzato — per questo l'app avvisa
  // esplicitamente che la componente spaziale richiede cuffie/casse stereo.
  function playTonePanned(tone, dur, pan){
    try{
      const ctx = getCtx(); const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = tone.type; o.frequency.value = tone.f;
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur/1000);
      let node = g;
      if(pan!=null && ctx.createStereoPanner){
        const p = ctx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan));
        g.connect(p); node = p;
      }
      o.connect(g); node.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur/1000+0.02);
    }catch(e){}
  }
  // "lettere"/"parole" sono femminili, gli altri materiali sono maschili —
  // serve per costruire istruzioni con l'accordo di genere corretto
  // (es. "una alla volta" vs "uno alla volta", "molte" vs "molti").
  function stimGender(stimType){ return (stimType==='lettere' || stimType==='lettereVoce' || stimType==='parole' || stimType==='paroleVoce') ? 'f' : 'm'; }

  // Banca di parole concrete italiane, divisa per lunghezza/complessità.
  // "mista" pesca da tutte e tre in proporzioni uguali.
  const WORD_BANK = {
    breve: ['CASA','SOLE','MARE','PANE','LUNA','ROSA','VINO','MELA','NOCE','RISO','UOVA','ORSO','LUPO','CANE',
      'GATTO','TORO','MONTE','FIUME','PONTE','TORRE','CAMPO','BOSCO','PRATO','VENTO','NEVE','PORTA','SEDIA',
      'FUOCO','FIORE','LIBRO','TAVOLO','CHIAVE','STRADA','NUVOLA','ALBERO'],
    media: ['FINESTRA','GIARDINO','MONTAGNA','FORESTA','SPIAGGIA','CAMICIA','BICCHIERE','CUCCHIAIO','FORCHETTA',
      'OROLOGIO','TELEFONO','COMPUTER','BAMBINO','FAMIGLIA','MEDICINA','OSPEDALE','FARMACIA','STAZIONE',
      'MERCATO','NEGOZIO','QUADERNO','POLTRONA','CUSCINO','LENZUOLO','ASCIUGAMANO','SAPONE','SPAZZOLINO',
      'OMBRELLO','GUANTI','CAPPELLO','SCIARPA','MAGLIONE','PANTALONI','SCARPE','ZAINO'],
    lunga: ['RISTORANTE','BIBLIOTECA','APPARTAMENTO','AUTOMOBILE','TEMPERATURA','REFRIGERATORE','ASCENSORE',
      'PARRUCCHIERE','SUPERMERCATO','INFERMIERA','PROFESSORE','COMPLEANNO','CALENDARIO','PASSEGGINO',
      'AEROPORTO','FOTOGRAFIA','BICICLETTA','MOTOCICLETTA','PARCHEGGIO','SEMAFORO','MARCIAPIEDE',
      'CIOCCOLATO','MINESTRONE','MELANZANA','ANGURIA','ALBICOCCA','FRIGORIFERO','LAVASTOVIGLIE',
      'ASPIRAPOLVERE','TERMOSIFONE','PORTAFOGLIO','OCCHIALI','OROLOGERIA','CARTOLINA']
  };
  function regenerateParolePool(){
    const c = cfg.wordComplexity || 'breve';
    let bank = c==='mista' ? WORD_BANK.breve.concat(WORD_BANK.media, WORD_BANK.lunga) : (WORD_BANK[c] || WORD_BANK.breve);
    POOLS.parole = bank;
    POOLS.paroleVoce = bank;
  }
  // Numeri a 1-6 cifre, personalizzabile (cfg.numDigits). Rigenera un
  // sottoinsieme casuale ad ogni sessione per varietà, tenendo il pool a
  // una dimensione gestibile indipendentemente da quante cifre.
  function regenerateNumeriPool(){
    const digits = cfg.numDigits || 1;
    const min = digits===1 ? 1 : Math.pow(10, digits-1);
    const max = Math.pow(10, digits) - 1;
    const rangeSize = max - min + 1;
    const count = Math.min(16, rangeSize);
    const seen = new Set(); const arr = [];
    let guard = 0;
    while(arr.length < count && guard < count*50){
      guard++;

    neglectRuleClauses:null, // solo per 'regola' — null=progressione automatica cumulativa per livello; altrimenti array di chiavi scelte manualmente fra 'base','colore','riga','sfondo'
    goaltaskScenario:'sei_compiti_classico', goaltaskLivello:2, // solo per Scenari ecologici (1-5, crescente)
    memoriaModo:'pqrst', memoriaLivello:1, memoriaMateriale:'lista', // solo per Strategie di memoria — memoriaMateriale usato solo da loci/errorless/vanishing (pqrst è sempre brano, chunking è sempre lista)
    memoriaFormaIdx:0, // solo per pqrst/chunking, solo sui livelli con forme parallele (1-2 al momento) — quale forma (A/B/C...) usare in questa sessione; scelta sempre manuale dall'operatore, mai casuale, per poter pilotare baseline/intermedia/finale nel confronto RCI
    memoriaLociTipo:'casa', memoriaLociCustom:'', // solo per loci — 'casa'|'corpo'|'personalizzato' (tappe reali digitate dall'operatore, una per riga)
    chunkingMetodi:['categoria'], chunkingNota:'', // solo per chunking — array di chiavi fra 'categoria','acronimo','narrazione','immagine','personale' (max 1 sotto liv.11, max 2 da liv.11); chunkingNota usata solo se 'personale' è selezionato
    categLivello:1, categMateriale:'simboli', // solo per Categorizzazione condizionale — livello 1-10 (banda doppia delle 5 strutture, struttura fissa dentro ogni banda, non adattivo); categMateriale usato solo alle strutture 1 e 4 ('simboli'|'lettereVoce'|'numeriVoce' — 'colori' rimosso dalla selezione, la sua unica regola era Caldo/Freddo, troppo arbitraria; resta leggibile nello storico di sedute già registrate)
    categStructManual:1, // solo in modalità Manuale: struttura (1-5) scelta liberamente dal clinico, indipendente da categLivello — vedi categEffectiveStructure()
    zoneGrandi:false, // accessibilità: zone di risposta molto più grandi (metà schermo per 2 risposte) invece di pulsanti piccoli — utile su tablet/smartphone per bassa vista
    inputDevice:'touch', // 'touch' | 'tastiera' — dichiarato dall'operatore prima di iniziare, usato solo per decidere COSA evidenziare (badge dei tasti sui pulsanti, promemoria nelle istruzioni), la tastiera funziona comunque sempre in background indipendentemente da questa scelta
    keyLayout:'standard', // 'standard' (A/L, A/L/Z/M) | 'ravvicinata' (B/N, V/B/N/M — tasti adiacenti sulla riga inferiore della tastiera, per chi può usare solo una mano)
    sequenzaMista:'no', // solo per Sequenza bersaglio: 'no'|'visivo'|'uditivo'|'misto' — mescola codici diversi nella stessa sequenza invece di un solo tipo
    nbackMista:'no', // solo per N-back: stesso principio, materiale che cambia tipo prova per prova invece di restare fisso
    gonogoMista:'no', // solo per Go/No-Go: stesso principio — il/i bersaglio/i no-go possono essere di tipi diversi fra loro, non solo lo stesso cfg.stimType
  };
  // Tipi di stimolo utilizzabili insieme in una sequenza bersaglio mista.
  // Escluse le parole: la lunghezza variabile complicherebbe la costruzione
  // e la lettura rapida della sequenza da parte del paziente.
  const VISUAL_MISTA_TYPES = ['lettere','numeri','colori','simboli'];
  const AUDIO_MISTA_TYPES = ['suoni','lettereVoce','numeriVoce'];
  const SEQUENZA_MISTA_TYPES = VISUAL_MISTA_TYPES.concat(AUDIO_MISTA_TYPES);
  // cfg.sequenzaMista/nbackMista/gonogoMista: 'no' | 'visivo' | 'uditivo' | 'misto'
  // (visivo+uditivo insieme) — quali tipi di stimolo entrano nel "mescolati".
  function mistaTypesFor(mode){
    if(mode==='visivo') return VISUAL_MISTA_TYPES;
    if(mode==='uditivo') return AUDIO_MISTA_TYPES;
    if(mode==='misto') return SEQUENZA_MISTA_TYPES;
    return null; // 'no' o non impostato: non mista
  }
  function randMistaStim(types){
    const list = types || SEQUENZA_MISTA_TYPES;
    const t = list[Math.floor(Math.random()*list.length)];
    const pool = POOLS[t];
    return {stimType:t, item: pool[Math.floor(Math.random()*pool.length)]};
  }
  const MISTA_LABELS_SHORT = {visivo:'Mista (visivo)', uditivo:'Mista (uditivo)', misto:'Mista (visivo+uditivo)'};
  // Proposta di default per la sequenza bersaglio/no-go: prima era
  // sequenziale sul pool (sempre gli stessi primi elementi, in ordine) —
  // ora pesca a caso, senza ripetizioni, così ogni volta che si apre un
  // esercizio con materiale personalizzabile parte già una proposta
  // sensata invece di uno schema fisso o di una selezione vuota da
  // costruire a mano. Resta sempre pienamente modificabile dopo (chip
  // "← Rimuovi ultimo"/"Reimposta", o aggiungendo altri elementi).
  function defaultTargetSeq(stimType, len){
    len = len || (cfg.targetSeq ? cfg.targetSeq.length : 3);
    const pool = POOLS[stimType];
    const shuffled = pool.slice().sort(()=>Math.random()-0.5);
    const out = [];
    for(let i=0;i<len;i++) out.push(shuffled[i % shuffled.length]);
    return out;
  }
  // Stessa idea ma per la sequenza/no-go "mista" (materiale misto fra più
  // tipologie) — pesca a caso fra i tipi ammessi (visivo/uditivo/misto),
  // evitando duplicati stimType+item.
  function randomMistaTargetSeq(len, types){
    const out = [];
    let guard = 0;
    while(out.length < len && guard < len*40){
      guard++;
      const candidate = randMistaStim(types);
      if(!out.some(x=>sameStim(x,candidate))) out.push(candidate);
    }
    return out;
  }

  /* ---------- training presets (saved settings, local device) ---------- */
  // Salva solo i parametri del protocollo, non dati di sessione (codice
  // paziente/note) — un preset è "come allenare", non "chi" o "quando".
  // I 6 esercizi con stepper "Livello" condiviso e tabelle ADAPT_* — unici
  // interessati dal modello triplice manuale/livello/adattivo. Doppio
  // compito, Cancellazione e Categorizzazione condizionale restano sul
  // vecchio interruttore manuale/adattivo a due vie: hanno meccanismi di
  // livello propri (per-canale, per-tavola, per-struttura) non condivisi
  // con questo gruppo, e non erano fra gli esercizi segnalati col bug di
  // sincronizzazione — includerli sarebbe un allargamento di perimetro non
  // richiesto.
  const TITRATION_EXERCISES = ['nback','sequenza','gonogo','switching','stopsignal','ant','simon'];
  // Neglect e Doppio compito hanno il CONCETTO di titrationMode (e vanno
  // quindi trattati come gli altri per persistenza/switch dal profilo) ma
  // non fanno parte del gruppo "condiviso" sopra: hanno le proprie
  // funzioni di risoluzione dedicate (neglectBoardSubLevel/
  // dualTitrationModeHint), non passano mai dal blocco ISI/frequenza
  // generico dei 6 originali.
  const TITRATION_MODE_EXTRA = ['neglect','dualtask','categorizzazione'];
  function hasTitrationMode(taskMode){ return TITRATION_EXERCISES.includes(taskMode) || TITRATION_MODE_EXTRA.includes(taskMode); }
  // Valore di partenza ragionevole per 'targetRate' quando si arriva su
  // ciascun esercizio da Setup (vedi commento sul reset sopra) — stessi
  // valori già usati come default storico dell'app per ciascun significato.
  const DEFAULT_TARGET_RATE = { nback:0.32, sequenza:0.32, gonogo:0.32, stopsignal:0.25, switching:0.35, categorizzazione:0.20 };
  // Trasparenza obbligatoria: qualunque sia la modalità, il clinico deve
  // sempre vedere a cosa corrisponde esattamente ciò che sta per essere
  // lanciato — un numero di livello da solo non basta in modalità Manuale
  // (dove il livello non pilota nulla), quindi lì si mostrano invece i
  // parametri correnti per esteso. Accetta una cfg esplicita (non solo la
  // cfg live globale) per poter essere riusata anche nel profilo/Gestisci
  // programma, dove si descrive la configurazione salvata di una voce.
  // Parametri davvero derivati dalla tabella di livello (Livello/Adattivo)
  // per ciascun esercizio dei 6 — usato per decidere quali controlli in
  // Setup diventano di sola lettura in quelle due modalità, mostrando il
  // valore realmente in uso invece di un campo indipendente che darebbe
  // l'impressione (sbagliata) di controllare qualcosa. Gli altri esercizi/
  // parametri restano sempre modificabili in OGNI modalità perché non sono
  // MAI stati collegati al livello per scelta di costruzione — es. la
  // frequenza di trial di stop dello Stop-Signal è un parametro
  // metodologico fisso, non una leva di difficoltà, e lo stesso vale per
  // la frequenza bersaglio della Sequenza e la frequenza di cambio regola
  // del Task-switching.
  function resolvedFreqForDisplay(taskMode, c){
    if(taskMode==='nback') return nbackParamsForLevel(c.nLevel).freq;
    if(taskMode==='gonogo') return ADAPT_GONOGO_FREQ[c.adaptStartLevel] || c.targetRate;
    return null;
  }
  function resolvedIsiForDisplay(taskMode, c){
    if(taskMode==='sequenza') return ADAPT_ISI.sequenza[c.adaptStartLevel];
    if(taskMode==='stopsignal') return ADAPT_ISI.stopsignal[c.adaptStartLevel];
    if(taskMode==='ant' && c.antMode==='classico') return ADAPT_ISI.ant[c.adaptStartLevel];
    return null;
  }
  // Trasparenza per Cancellazione (Neglect) — parametri diversi dai 6
  // esercizi con ISI/frequenza (qui: dimensione tavola, tempo limite),
  // quindi una funzione di trasparenza dedicata invece di riusare
  // titrationModeHint, che non li conoscerebbe.
  function neglectSubLevelForDisplay(c){
    if(c.neglectMode==='progressiva') return neglectProgressivaPhase(c.neglectStartLevel).subLevel;
    if(c.neglectMode==='regola') return c.neglectRuleLevel;
    return c.neglectStartLevel;
  }
  // Struttura EFFETTIVA in uso in questo momento — mai più
  // categStructureOfLevel(cfg.categLivello) direttamente, da nessuna
  // parte: in modalità Manuale la struttura è una scelta indipendente del
  // clinico (categStructManual), decisa da Rodrigo esplicitamente contro
  // l'alternativa "solo ISI/lure dentro la struttura del livello" — più
  // libertà, al prezzo dichiarato di rompere la corrispondenza
  // livello↔struttura in questa sola modalità. In Livello/Adattivo,
  // invariato: la struttura resta quella derivata dal livello.
  function categEffectiveStructure(c){
    return c.titrationMode==='manuale' ? (c.categStructManual||1) : categStructureOfLevel(c.categLivello);
  }
  const CATEG_STRUCTURE_LABELS = {
    1:'1 — Dimensione singola', 2:'2 — Doppia dimensione + no-go',
    3:'3 — Regola disgiuntiva', 4:'4 — Confronto 1-back', 5:'5 — Doppia dimensione, 4 risposte'
  };
  const CATEG_STRUCTURE_HINTS = {
    1:'Singola dimensione, regola fissa per tutta la sessione (nessun costo di switch, a differenza del Task-switching).',
    2:'Doppia dimensione con no-go: 3 risposte attive più un caso in cui non si deve rispondere.',
    3:'Stessa doppia dimensione, ricombinata in una regola disgiuntiva a 2 risposte ("A se... oppure...").',
    4:'Confronto con lo stimolo precedente (1-back sulla categoria).',
    5:'Doppia dimensione mappata direttamente su 4 risposte — nessun no-go, nessuna disgiunzione.'
  };
  function categTitrationModeHint(c, mode){
    const struct = categEffectiveStructure(c);
    if(mode==='manuale'){
      const isiPart = struct===4 ? ('frequenza lure '+Math.round((c.targetRate||0)*100)+'%') : ('ISI '+(c.isi/1000).toFixed(1)+'s');
      return 'Modalità Manuale: struttura "'+CATEG_STRUCTURE_LABELS[struct]+'" scelta liberamente qui sotto, indipendente dal numero di livello — '+isiPart+', non collegati a nessuna tabella.';
    }
    const lvl = c.categLivello;
    const isi = CATEG_ISI[lvl];
    const lure = CATEG_LURE[lvl];
    const paramTxt = isi!=null ? 'ISI '+(isi/1000).toFixed(1)+'s' : (lure!=null ? 'frequenza lure '+Math.round(lure*100)+'%' : '');
    if(mode==='livello'){
      return 'Modalità Livello: livello '+lvl+' → struttura "'+CATEG_STRUCTURE_LABELS[struct]+'", '+paramTxt+' — fissi per l\'intera seduta, la struttura non cambia mai durante la sessione.';
    }
    return 'Modalità Adattiva: si parte dal livello '+lvl+' (struttura "'+CATEG_STRUCTURE_LABELS[struct]+'"), '+paramTxt+' si stringe/allarga da solo in base all\'accuratezza — ma resta sempre dentro la stessa struttura per tutta la seduta, non la attraversa mai (vedi "Vincolo di fascia strutturale" nel README).';
  }
  // Trasparenza per il TAPAT — solo il blocco TONICO ha un parametro
  // legato al livello (l'intervallo min-max fra stimoli, non un ISI
  // singolo come altrove: qui l'imprevedibilità dell'intervallo è parte
  // del costrutto). Il blocco FASICO usa sempre il campo ISI generico di
  // Setup, in ogni modalità — non compare qui perché non cambia mai.
  function tapatTitrationModeHint(c, mode){
    if(mode==='manuale'){
      return 'Modalità Manuale: nel blocco tonico l\'intervallo fra stimoli varia liberamente fra '+(c.tapatIsiMin/1000).toFixed(2)+'s e '+(c.tapatIsiMax/1000).toFixed(2)+'s, indipendente dal livello. Il blocco fasico usa sempre l\'ISI impostato più sotto.';
    }
    const range = TAPAT_LEVELS[c.tapatStartLevel] || TAPAT_LEVELS[3];
    if(mode==='livello'){
      return 'Modalità Livello: nel blocco tonico l\'intervallo fra stimoli segue la tabella del livello '+c.tapatStartLevel+' ('+(range[0]/1000).toFixed(2)+'-'+(range[1]/1000).toFixed(2)+'s), fisso per l\'intera seduta.';
    }
    return 'Modalità Adattiva: si parte dal livello '+c.tapatStartLevel+' ('+(range[0]/1000).toFixed(2)+'-'+(range[1]/1000).toFixed(2)+'s nel blocco tonico), ma il livello si sposta da solo in base all\'accuratezza.';
  }
  function neglectTitrationModeHint(c, mode){
    const lvl = c.neglectMode==='progressiva' ? c.neglectStartLevel : neglectSubLevelForDisplay(c);
    if(mode==='manuale'){
      return 'Modalità Manuale: dimensione tavola ('+c.neglectBoardSize+' elementi) e tempo limite ('+(c.neglectTimeLimit||'nessuno')+(c.neglectTimeLimit?'s':'')+') restano quelli impostati qui sopra, indipendenti dal livello.';
    }
    const subLevel = neglectSubLevelForDisplay(c);
    const size = ADAPT_NEGLECT_SIZE[subLevel];
    const time = ADAPT_NEGLECT_TIME[subLevel];
    const sizeTxt = size!=null ? size+' elementi' : '(non definito a questo livello)';
    const timeTxt = time!=null ? (time===0?'nessun limite':time+'s') : (c.neglectTimeLimit||'nessuno')+(c.neglectTimeLimit?'s':'');
    if(mode==='livello'){
      return 'Modalità Livello: dimensione tavola ('+sizeTxt+') e tempo limite ('+timeTxt+') seguono la tabella per il livello '+lvl+', fissi per l\'intera seduta.';
    }
    return 'Modalità Adattiva: si parte dal livello '+lvl+' con gli stessi parametri di tabella della modalità Livello, ma il livello si sposta da solo tavola per tavola in base all\'accuratezza.';
  }
  // Trasparenza per il Doppio compito — un solo selettore Manuale/Livello/
  // Adattivo condiviso (non uno per canale: cfg.adaptive è già un unico
  // interruttore nel motore, i due canali restano indipendenti solo nei
  // LIVELLI numerici, non nella scelta di modalità), quindi la funzione
  // deve descrivere entrambi i canali insieme.
  function dualTitrationModeHint(c, mode){
    if(mode==='manuale'){
      return 'Modalità Manuale: la frequenza target di ciascun canale resta quella impostata qui sotto, indipendente dal livello. L\'ISI resta '+(c.isi/1000).toFixed(1)+'s, non collegato al livello.';
    }
    const freq1 = ADAPT_DUAL_FREQ[c.dualStartLevel1], freq2 = ADAPT_DUAL_FREQ[c.dualStartLevel2];
    const avgLevel = Math.max(1, Math.min(10, Math.round(((c.dualStartLevel1||1)+(c.dualStartLevel2||1))/2)));
    const isi = ADAPT_ISI.dualtask[avgLevel];
    if(mode==='livello'){
      return 'Modalità Livello: frequenza target canale 1 ('+Math.round((freq1||0)*100)+'%) e canale 2 ('+Math.round((freq2||0)*100)+'%) seguono la tabella dei rispettivi livelli. ISI condiviso ('+(isi/1000).toFixed(1)+'s) derivato dalla media dei due livelli ('+avgLevel+') — fissi per l\'intera seduta.';
    }
    return 'Modalità Adattiva: si parte dai livelli '+c.dualStartLevel1+'/'+c.dualStartLevel2+' con gli stessi parametri di tabella della modalità Livello, ma ciascun canale si sposta da solo, in modo indipendente, in base alla propria accuratezza (l\'ISI condiviso segue la media dei due, aggiornata di conseguenza).';
  }
  function titrationModeHint(c, mode){
    const taskMode = c.taskMode;
    const lvl = levelOfCfg(c); // usa il campo livello corretto per l'esercizio (nLevel per N-back, adaptStartLevel per gli altri 6 — non erano lo stesso campo, bug corretto)
    if(mode==='manuale'){
      const parts = [];
      if(taskMode==='nback') parts.push('n='+nbackParamsForLevel(c.nLevel).n, 'frequenza bersaglio '+Math.round(c.targetRate*100)+'%');
      else if(taskMode==='gonogo') parts.push((c.targetSeq||[]).length+' elementi no-go attivi', 'frequenza no-go '+Math.round(c.targetRate*100)+'%');
      else if(taskMode==='switching') parts.push('nessun intervallo cue→stimolo dedicato (regola e stimolo mostrati insieme)', 'nessuno sbilanciamento fra le due regole (50/50)');
      else if(taskMode==='sequenza') parts.push('lunghezza sequenza bersaglio: '+c.targetSeq.length);
      else if(taskMode==='stopsignal' || (taskMode==='ant' && c.antMode==='classico')) parts.push('ISI '+c.isi+' ms (non collegato al livello)');
      return 'Modalità Manuale: ogni parametro resta quello impostato qui sotto, indipendente dal livello.'+(parts.length?' Oggi: '+parts.join(', ')+'.':'');
    }
    if(mode==='livello'){
      return 'Modalità Livello: tutti i parametri collegati (secondo l\'esercizio: ISI, frequenza bersaglio/no-go, intervallo cue→stimolo, sbilanciamento regole, lunghezza sequenza) sono quelli di tabella per il livello '+lvl+', fissi per l\'intera seduta — muovi lo stepper "Livello" qui sopra per cambiarli tutti insieme.';
    }
    return 'Modalità Adattiva: si parte dal livello '+lvl+' con gli stessi parametri di tabella della modalità Livello, ma il livello si sposta da solo durante la seduta in base all\'accuratezza (regola 70-85% ogni 8 prove).';
  }
  function presetCfgOf(c){
    return {
      stimType:c.stimType, taskMode:c.taskMode, nLevel:c.nLevel,
      adaptStartLevel:c.adaptStartLevel, tapatStartLevel:c.tapatStartLevel,
      dualStartLevel1:c.dualStartLevel1, dualStartLevel2:c.dualStartLevel2, neglectStartLevel:c.neglectStartLevel,
      targetSeq: (EXERCISES[c.taskMode].usesTargetSeq)
        ? (c.taskMode==='sequenza' && c.sequenzaMista
            ? c.targetSeq.map(e=>({stimType:e.stimType, label:seqLabel(e)}))
            : c.targetSeq.map(seqLabel))
        : null,
      sequenzaMista: c.sequenzaMista||'no', nbackMista: c.nbackMista||'no', gonogoMista: c.gonogoMista||'no',
      trials:c.trials, isi:c.isi, stimDuration:c.stimDuration, targetRate:c.targetRate,
      respMode:c.respMode, voice:c.voice, ssd:c.ssd, ssdStep:c.ssdStep, adaptive:c.adaptive,
      titrationMode: hasTitrationMode(c.taskMode) ? (c.titrationMode||'manuale') : undefined,
      switchMaterial:c.switchMaterial, dualVisual:c.dualVisual, dualVisual2:c.dualVisual2, dualPairing:c.dualPairing, antMode:c.antMode,
      tapatSpatial:c.tapatSpatial, tapatGradient:c.tapatGradient, tapatModalita:c.tapatModalita, antMaterial:c.antMaterial,
      tapatIsiMin:c.tapatIsiMin, tapatIsiMax:c.tapatIsiMax,
      numDigits:c.numDigits, wordComplexity:c.wordComplexity, showTrail:c.showTrail,
      neglectGradient:c.neglectGradient, neglectLayout:c.neglectLayout, neglectTimeLimit:c.neglectTimeLimit, neglectBoardSize:c.neglectBoardSize,
      neglectMode:c.neglectMode, neglectRuleLevel:c.neglectRuleLevel,
      goaltaskScenario:c.goaltaskScenario, goaltaskLivello:c.goaltaskLivello, memoriaModo:c.memoriaModo, memoriaLivello:c.memoriaLivello, memoriaMateriale:c.memoriaMateriale, memoriaFormaIdx:c.memoriaFormaIdx,
      memoriaLociTipo:c.memoriaLociTipo, memoriaLociCustom:c.memoriaLociCustom,
      chunkingMetodi:c.chunkingMetodi, chunkingNota:c.chunkingNota,
      categLivello:c.categLivello, categMateriale:c.categMateriale, categStructManual:c.categStructManual, zoneGrandi: !!c.zoneGrandi,
      inputDevice: c.inputDevice||'touch', keyLayout: c.keyLayout||'standard'
    };
  }
  function listPresets(){
    const out = [];
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('traccian:preset:')===0){
          try{ out.push(JSON.parse(localStorage.getItem(k))); }catch(e){}
        }
      }
    }catch(e){}
    out.sort((a,b)=> b.savedAt - a.savedAt);
    return out;
  }
  function savePreset(name){
    const id = Date.now()+'-'+Math.random().toString(36).slice(2,7);
    const rec = {id, name, savedAt: Date.now(), cfg: presetCfgOf(cfg)};
    try{ localStorage.setItem('traccian:preset:'+id, JSON.stringify(rec)); }catch(e){}
  }
  function deletePreset(id){ try{ localStorage.removeItem('traccian:preset:'+id); }catch(e){} }
  // Quale campo di cfg rappresenta il "livello di partenza" per ciascun
  // esercizio — usato per riportarlo a 1 quando si apre l'esercizio senza
  // una configurazione specifica da caricare (vedi applyLevelBaselineOrSuggestion).
  const LEVEL_FIELD_OF_TASKMODE = {
    nback:'nLevel', categorizzazione:'categLivello',
    sequenza:'adaptStartLevel', switching:'adaptStartLevel', gonogo:'adaptStartLevel', stopsignal:'adaptStartLevel', ant:'adaptStartLevel',
    neglect:'neglectStartLevel', dualtask:['dualStartLevel1','dualStartLevel2'],
    goaltask:'goaltaskLivello', memoria:'memoriaLivello'
  };
  function resetLevelField(taskMode){
    const field = LEVEL_FIELD_OF_TASKMODE[taskMode];
    if(Array.isArray(field)) field.forEach(k=>{ cfg[k]=1; });
    else if(field) cfg[field]=1;
    if(taskMode==='ant' && cfg.antMode==='tapat') cfg.tapatStartLevel=1;
    if(taskMode==='neglect') cfg.neglectRuleLevel=1;
  }
  // Estrae un valore di livello leggibile da una cfg, per confronti (es. "il
  // suggerimento originale dello screening diceva livello X, oggi è Y") e
  // per mostrarlo ovunque serva (nome proposto, "già nel programma"...).
  function levelOfCfg(c){
    if(c.taskMode==='ant' && c.antMode==='tapat') return c.tapatStartLevel;
    const field = LEVEL_FIELD_OF_TASKMODE[c.taskMode];
    if(!field) return null;

  // Il profilo (locale, remoto, o il paziente stesso) rilevante nel
  // contesto corrente — per cercare un eventuale suggerimento da screening
  // quando si apre un esercizio.
  function activePatientLike(){
    if(patientProfile) return patientProfile;
    if(buildingProgramFor && editingPatient) return editingPatient;
    if(activeLocalPatientId){
      try{ const raw = localStorage.getItem('traccian:localpatient:'+activeLocalPatientId); return raw?JSON.parse(raw):null; }catch(e){ return null; }
    }
    if(activeRemotePatientId){
      return (cachedRemotePatients||[]).find(p=>p.id===activeRemotePatientId) || null;
    }
    return null;

  // Punto unico richiamato ogni volta che si apre/cambia un esercizio senza

  // paziente): riporta il livello a 1, a meno che il paziente attivo in
  // questo momento non abbia un suggerimento da screening per questo
  // esercizio — in tal caso lo applica per intero (livello incluso),
  // sempre modificabile a mano subito dopo dall'operatore.
  function applyLevelBaselineOrSuggestion(taskMode){
    const p = activePatientLike();
    // Priorità: 1) livello già raggiunto dal paziente in QUESTO esercizio
    // (se ci ha già lavorato) — 2) suggerimento da screening (se mai
    // tentato) — 3) livello 1.
    const own = configForExercise(p, taskMode);
    if(own){ Object.assign(cfg, own); cfg.taskMode = taskMode; return; }
    const flags = p ? (p.screening_flags || p.screeningFlags || []) : [];
    const match = flags.find(f=>f.attivo && f.taskMode===taskMode && f.cfg);
    if(match){ Object.assign(cfg, match.cfg); cfg.taskMode = taskMode; }
    else {
      resetLevelField(taskMode);

      // suggerimento da screening): propone subito gli elementi no-go
      // giusti per il livello 1, invece di lasciare il pool vuoto.
      if(taskMode==='gonogo') suggestGoNoGoTargets(cfg.adaptStartLevel||1);
    }

    cfg.tapatSpatial = !!pc.tapatSpatial; cfg.tapatGradient = pc.tapatGradient!=null?pc.tapatGradient:50; cfg.tapatModalita = pc.tapatModalita || 'visivo'; cfg.antMaterial = pc.antMaterial || 'frecce';

  /* ---------- profili paziente locali (in presenza, senza account remoto) ---------- */
  // A differenza dei pazienti "veri" (account Supabase con codice di
  // accesso, per l'uso da remoto), questi sono etichette locali: servono a
  // organizzare le sessioni fatte in presenza sotto un nome, senza dover
  // creare un account per ogni paziente che l'operatore vede di persona.
  // Possono in seguito essere "promossi" a un vero account remoto.
  // I profili locali vivono anzitutto in localStorage (funzionano anche
  // offline/senza account). Se l'operatore ha la sincronizzazione cloud
  // attiva, li rispecchiamo anche su Supabase (tabella pazienti_locali,
  // isolata per operatore via RLS) — così non spariscono cambiando
  // browser/dispositivo/cache. Non richiedono un account paziente: restano
  // semplici etichette, senza login autonomo, esattamente come prima.
  let localPatientsCloudCache = null; // cache dei profili locali letti da Supabase per l'operatore corrente
  function listLocalPatients(){
    const out = [];
    const seen = {};
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('traccian:localpatient:')===0){
          try{ const p = JSON.parse(localStorage.getItem(k)); out.push(p); seen[p.id]=true; }catch(e){}
        }
      }
    }catch(e){}
    if(sb && cloudUser && !patientProfile){
      if(localPatientsCloudCache===null){
        localPatientsCloudCache = [];
        sb.from('pazienti_locali').select('*').eq('operatore_id', cloudUser.id).then(({data,error})=>{
          if(!error && data){
            localPatientsCloudCache = data.map(r=>({id:r.id, nome:r.nome, createdAt:r.creato_il?Date.parse(r.creato_il):Date.now(), lastConfig:r.ultima_config||null, screeningFlags:r.screening_flags||null, programma:r.programma_assegnato||null, screeningRisultati:r.screening_risultati||null, attivo: r.attivo!==false, remotePazienteId: r.remote_paziente_id||null, livelliEsercizi: r.livelli_esercizi||null, obiettivo: r.obiettivo||null}));
            // Porta in locale anche i profili creati/aggiornati altrove
            // (multi-dispositivo). Il cloud è la fonte più fresca quando la
            // sincronizzazione è attiva — sovrascrive SEMPRE la copia locale,
            // non solo se mancante: prima si limitava ad aggiungere i
            // profili assenti, quindi un dispositivo con una copia locale
            // già in cache (es. prima che un paziente venisse archiviato
            // altrove) non riceveva mai l'aggiornamento e continuava a
            // mostrarlo attivo all'infinito — bug reale, non solo teorico.
            localPatientsCloudCache.forEach(p=>{
              try{ localStorage.setItem('traccian:localpatient:'+p.id, JSON.stringify(p)); }catch(e){}
            });
          }
          render();
        });
      }
      (localPatientsCloudCache||[]).forEach(p=>{ if(!seen[p.id]){ out.push(p); seen[p.id]=true; } });
    }
    out.sort((a,b)=> a.nome.localeCompare(b.nome, 'it'));
    return out;
  }
  async function syncLocalPatientToCloud(p){
    if(!sb || !cloudUser || patientProfile) return;
    try{
      await sb.from('pazienti_locali').upsert({
        id:p.id, operatore_id:cloudUser.id, nome:p.nome, ultima_config:p.lastConfig||null, screening_flags:p.screeningFlags||null, programma_assegnato:p.programma||null, screening_risultati:p.screeningRisultati||null, attivo: p.attivo!==false, remote_paziente_id: p.remotePazienteId||null, livelli_esercizi: p.livelliEsercizi||null, obiettivo: p.obiettivo||null
      });

    }catch(e){ console.error('sync paziente locale fallita', e); }
  }
  function saveLocalPatient(nome){
    const id = 'lp-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
    const p = {id, nome, createdAt: Date.now()};
    try{ localStorage.setItem('traccian:localpatient:'+id, JSON.stringify(p)); }catch(e){}

  async function deleteLocalPatientCloud(id){

  // Ricollega le sessioni già registrate per un profilo locale a un nuovo
  // account remoto — sia quelle salvate solo in locale, sia quelle già
  // sincronizzate in cloud sotto l'account dell'operatore.
  async function migrateLocalPatientSessions(localId, remotePazienteId){
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('traccian:sessione:')===0){
          try{
            const rec = JSON.parse(localStorage.getItem(k));
            if(rec.localPatientId===localId){
              rec.pazienteId = remotePazienteId;
              localStorage.setItem(k, JSON.stringify(rec));
            }
          }catch(e){}
        }
      }
    }catch(e){}
    if(sb && cloudUser){
      try{ await sb.from('sessioni').update({paziente_id:remotePazienteId}).eq('operatore_id',cloudUser.id).eq('local_patient_id', localId); }
      catch(e){ console.error('migrazione cloud fallita', e); }
    }

  }
  // Il profilo in presenza superato da una trasformazione in account remoto
  // viene archiviato automaticamente (non eliminato) e collegato al nuovo
  // account, così resta ritrovabile in Archivio con l'indicazione di dove
  // è confluito, invece di restare come doppione "attivo" accanto al nuovo.
  async function archiveLocalPatientLinkedTo(localPatient, remotePazienteId){
    try{
      localPatient.attivo = false;
      localPatient.remotePazienteId = remotePazienteId;
      localStorage.setItem('traccian:localpatient:'+localPatient.id, JSON.stringify(localPatient));
      syncLocalPatientToCloud(localPatient);
    }catch(e){}
  }
  // Percorso inverso: da un account remoto a un profilo in presenza — per
  // un paziente che non usa più (o non ha mai voluto usare) l'accesso da
  // solo, senza perdere storico, programma o suggerimenti da screening.
  // Aggiunge localPatientId alle sessioni già taggate col pazienteId
  // remoto (senza toglierlo — stessa logica, simmetrica, della migrazione
  // in avanti) e disattiva l'accesso remoto senza eliminarlo.
  async function migrateRemoteSessionsToLocal(remotePazienteId, localId){
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('traccian:sessione:')===0){
          try{
            const rec = JSON.parse(localStorage.getItem(k));
            if(rec.pazienteId===remotePazienteId && !rec.localPatientId){
              rec.localPatientId = localId;
              localStorage.setItem(k, JSON.stringify(rec));
            }
          }catch(e){}
        }
      }
    }catch(e){}
    if(sb && cloudUser){
      try{ await sb.from('sessioni').update({local_patient_id:localId}).eq('operatore_id',cloudUser.id).eq('paziente_id', remotePazienteId).is('local_patient_id', null); }
      catch(e){ console.error('migrazione cloud fallita', e); }
    }
    historyCache = null;
  }
  async function demoteRemoteToLocal(p){
    const localP = saveLocalPatient(p.codice_paziente);
    if(p.programma_assegnato && p.programma_assegnato.length) localP.programma = p.programma_assegnato;
    if(p.screening_flags && p.screening_flags.length) localP.screeningFlags = p.screening_flags;
    if(p.livelli_esercizi) localP.livelliEsercizi = p.livelli_esercizi;
    if(p.obiettivo) localP.obiettivo = p.obiettivo;
    try{ localStorage.setItem('traccian:localpatient:'+localP.id, JSON.stringify(localP)); }catch(e){}
    syncLocalPatientToCloud(localP);
    await migrateRemoteSessionsToLocal(p.id, localP.id);

      try{ await sb.from('pazienti').update({attivo:false}).eq('id', p.id).eq('operatore_id', cloudUser.id); }

  function playTone(tone, dur){

      g.gain.setValueAtTime(0.0001, ctx.currentTime);

      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur/1000);
