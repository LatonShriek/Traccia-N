  /* ---------- sequence generation ---------- */
  function buildSequence(){
    switch(cfg.taskMode){
      case 'sequenza': return buildSequenceTarget();
      case 'stopsignal': return buildStopSignal();
      case 'ant': return buildANT();
      case 'switching': return buildSwitching();
      case 'simon': return buildSimon();
      // 'categorizzazione' rimossa da qui: è ora sempre incrementale (vedi
      // genCategTrial/isIncremental), non passa mai da buildSequence().
      case 'dualtask': return buildDualTask();
      default: return buildSequenceNback();
    }
  }
  function buildSequenceNback(){
    // Non raggiunta nell'uso normale: l'N-back è sempre a generazione
    // incrementale (vedi isIncremental/genNbackTrial), tenuta comunque
    // coerente con la tabella livello->n per non lasciare codice morto
    // disallineato.
    const pool = POOLS[cfg.stimType];
    const n = nbackParamsForLevel(cfg.nLevel).n;
    const seq = [];
    function runLen(i, val){ // quante ripetizioni consecutive di val terminerebbero in i
      let run = 1;
      for(let k=i-1;k>=0;k--){ if(seq[k].val===val) run++; else break; }
      return run;
    }
    for(let i=0;i<cfg.trials;i++){
      let makeTarget = i>=n && Math.random() < cfg.targetRate;
      let val;
      if(makeTarget){
        const cand = seq[i-n].val;
        if(pool.length>1 && runLen(i,cand) > 3){ makeTarget = false; } // il vincolo anti-ripetizione ha priorità
        else val = cand;
      }
      if(!makeTarget){
        do{ val = pool[Math.floor(Math.random()*pool.length)]; }
        while(pool.length>1 && ((i>=n && val===seq[i-n].val) || runLen(i,val)>3));
      }
      seq.push({val, isTarget: i>=n ? makeTarget : false, valid:i>=n});
    }
    return seq;
  }
  // Target-sequence mode: respond only when the trailing stimuli exactly
  // match a fixed, custom-built sequence (e.g. 1 → 2 → 3). Everything else
  // is a non-target, regardless of how "close" it looks.
  function sameSeqItem(a,b){
    if(cfg.taskMode==='sequenza' && cfg.sequenzaMista && cfg.sequenzaMista!=='no') return a && b && a.stimType===b.stimType && a.item===b.item;
    return a===b;
  }
  // In modalità adattiva, la lunghezza della sequenza bersaglio segue
  // ADAPT_SEQ_LEN invece di quella scelta manualmente in cfg.targetSeq —
  // calcolata una sola volta qui, prima che la sessione esista (stesso
  // principio già usato per lo squilibrio di regola dello switching).
  // Adatta cfg.targetSeq alla lunghezza richiesta dal livello, riusando gli
  // elementi già scelti dall'operatore ciclicamente (non li scarta con una
  // sequenza generata da zero) — usata sia in anteprima live in Setup (al
  // cambio di livello o di modalità adattiva) sia come rete di sicurezza a
  // inizio sessione (sequenceTargetForBuild), così l'esempio mostrato
  // all'operatore corrisponde sempre a quello che verrà davvero usato.
  function adjustTargetSeqToLength(desiredLen){
    if(!desiredLen || cfg.targetSeq.length===desiredLen) return;
    const isMista = cfg.taskMode==='sequenza' && cfg.sequenzaMista && cfg.sequenzaMista!=='no';
    const base = cfg.targetSeq.length ? cfg.targetSeq : (isMista
      ? [{stimType:SEQUENZA_MISTA_TYPES[0], item:POOLS[SEQUENZA_MISTA_TYPES[0]][0]}]
      : defaultTargetSeq(cfg.stimType, 1));
    const out = [];
    for(let i=0;i<desiredLen;i++) out.push(base[i % base.length]);
    cfg.targetSeq = out;
  }
  // Go/No-Go: propone automaticamente gli elementi no-go coerenti col
  // livello scelto (ADAPT_GONOGO_COUNT), invece di lasciare all'operatore
  // il compito di indovinare quanti elementi servano — riusa quelli già
  // selezionati (in ordine) e ne pesca di nuovi a caso dal pool/materiale
  // attivo per completare il numero richiesto, oppure accorcia se il nuovo
  // livello ne richiede di meno. Resta comunque modificabile a mano subito
  // dopo (chip "← Rimuovi ultimo"/aggiungi), come già per gli altri
  // esercizi — un suggerimento di partenza, non un vincolo.
  function suggestGoNoGoTargets(level){
    const count = Math.max(1, ADAPT_GONOGO_COUNT[level] || 1);
    const isMista = cfg.gonogoMista && cfg.gonogoMista!=='no';
    const cur = (cfg.targetSeq||[]).slice(0, count);
    let guard = 0;
    while(cur.length < count && guard < 200){
      guard++;
      const candidate = isMista ? randMistaStim(mistaTypesFor(cfg.gonogoMista)) : POOLS[cfg.stimType][Math.floor(Math.random()*POOLS[cfg.stimType].length)];
      const already = isMista ? cur.some(x=>sameStim(x,candidate)) : cur.some(x=>seqLabel(x)===seqLabel(candidate));
      if(!already) cur.push(candidate);
    }
    cfg.targetSeq = cur;
  }
  function sequenceTargetForBuild(){
    if(cfg.titrationMode==='manuale') return cfg.targetSeq;
    const desiredLen = ADAPT_SEQ_LEN[cfg.adaptStartLevel] || cfg.targetSeq.length;
    if(cfg.targetSeq.length===desiredLen) return cfg.targetSeq;
    const base = cfg.targetSeq.length ? cfg.targetSeq
      : (cfg.sequenzaMista && cfg.sequenzaMista!=='no') ? [{stimType:SEQUENZA_MISTA_TYPES[0], item:POOLS[SEQUENZA_MISTA_TYPES[0]][0]}]
      : defaultTargetSeq(cfg.stimType, 1);
    const out = [];
    for(let i=0;i<desiredLen;i++) out.push(base[i % base.length]);
    return out;
  }
  function buildSequenceTarget(){
    const isMista = cfg.taskMode==='sequenza' && cfg.sequenzaMista && cfg.sequenzaMista!=='no';
    const mistaTypes = isMista ? mistaTypesFor(cfg.sequenzaMista) : null;
    const target = sequenceTargetForBuild();
    const len = target.length;
    const raw = [];
    const pool = isMista ? null : POOLS[cfg.stimType];
    for(let i=0;i<cfg.trials;i++) raw.push(isMista ? randMistaStim(mistaTypes) : pool[Math.floor(Math.random()*pool.length)]);
    for(let i=len-1;i<cfg.trials;i++){
      if(Math.random() < cfg.targetRate){
        for(let j=0;j<len;j++) raw[i-len+1+j] = target[j];
      }
    }
    return raw.map((val,i)=>{
      let isTarget = false;
      if(i>=len-1){
        isTarget = true;
        for(let j=0;j<len;j++){ if(!sameSeqItem(raw[i-len+1+j], target[j])){ isTarget=false; break; } }
      }
      return {val, isTarget, valid:i>=len-1};
    });
  }
  // Go/No-Go: la generazione vera è genGoNoGoTrial() (una prova alla volta,
  // dentro nextTrial() — serve per poter cambiare livello a metà seduta).
  // Rimossa da qui una vecchia buildGoNoGo() (generazione "tutta insieme")
  // rimasta orfana da quando il Go/No-Go è passato alla generazione
  // incrementale: non era più raggiungibile da nessun punto dell'app
  // (buildSequence() non la chiama mai per 'gonogo', che è nell'elenco
  // isIncremental in startSession()) — codice morto, non un bug, ma
  // proprio il tipo di residuo da togliere quando lo si nota.
  // Stop-Signal: le prove "go" sono target (va sempre data risposta); una
  // quota è designata come trial di stop (non-target, va inibita la
  // risposta), gestiti dinamicamente in sessione tramite lo staircase su
  // session.currentSSD.
  function buildStopSignal(){
    const pool = POOLS[cfg.stimType];
    const rule = STOPSIGNAL_RULES[cfg.stimType] || STOPSIGNAL_RULES.frecce;
    const seq = [];
    for(let i=0;i<cfg.trials;i++){
      const val = pool[Math.floor(Math.random()*pool.length)];
      const isStopTrial = Math.random() < cfg.targetRate;
      const correctAnswer = rule.classify(val) ? 'a' : 'b';
      seq.push({val, correctAnswer, isTarget: !isStopTrial, isStopTrial, valid:true});
    }
    return seq;
  }
  // ANT semplificato: fattori allerta (cue presente/assente), orienting
  // (cue spaziale valido 80% / non valido 20%), conflitto (flanker
  // congruenti/incongruenti/neutri). Risposta = direzione della freccia
  // centrale, non "match" — non produce hit/FA in senso classico.
  // Materiali alternativi per l'ANT classico: la coppia designata sostituisce
  // sinistra/destra come identità del target — congruenza/neutralità restano
  // la stessa logica, solo con un altro alfabeto percettivo. Non è una leva
  // di difficoltà (non cambia quanto è arduo il compito) — cambia solo
  // quale materiale percettivo lo veicola, utile per varietà e per adattarsi
  // a profili diversi (es. evitare le frecce con difficoltà visuospaziali).
  const ANT_MATERIAL_TOKENS = { lettere:['H','S'], simboli:['●','■'] };
  const ANT_MATERIAL_OPTIONS = ['frecce','lettere','simboli'];
  function buildANT(){
    if(cfg.antMode==='tapat') return buildTAPAT();
    const seq = [];
    const cueTypes = ['none','center','spatial'];
    const congruencies = ['congruent','incongruent','neutral'];
    const isMista = cfg.antMaterial==='misto';
    for(let i=0;i<cfg.trials;i++){
      const material = isMista ? ANT_MATERIAL_OPTIONS[Math.floor(Math.random()*ANT_MATERIAL_OPTIONS.length)] : (cfg.antMaterial || 'frecce');
      const tokens = ANT_MATERIAL_TOKENS[material] || null;
      const cueType = cueTypes[Math.floor(Math.random()*cueTypes.length)];
      const congruency = congruencies[Math.floor(Math.random()*congruencies.length)];
      const targetDir = Math.random()<0.5 ? 'left' : 'right';
      let side = Math.random()<0.5 ? 'left' : 'right';
      if(cueType==='spatial'){
        // cue valido nell'80% dei casi (indica il lato corretto)
        side = Math.random()<0.8 ? targetDir : (targetDir==='left'?'right':'left');
      } else {
        side = 'center';
      }
      seq.push({val:targetDir, cueType, congruency, side, targetDir, correctAnswer:targetDir, valid:true, material, tokens});
    }
    return seq;
  }
  // TAPAT (Tonic and Phasic Alertness Training), variante dell'ANT pensata
  // per il training più che per la misura fattoriale: niente flanker né
  // scelta di direzione, solo rilevamento semplice di un target unico.
  // Blocco tonico (prima metà): nessun cue, ISI lungo e variabile —
  // sostiene l'attenzione senza aiuti esterni. Blocco fasico (seconda
  // metà): ISI più breve e fisso, metà dei trial preceduti da un cue di
  // allerta — confronto RT con/senza cue, come nell'ANT classico.
  function buildTAPAT(){
    const seq = [];
    const half = Math.floor(cfg.trials/2);
    for(let i=0;i<cfg.trials;i++){
      const block = i<half ? 'tonic' : 'phasic';
      let cueType, isiOverride;
      if(block==='tonic'){
        cueType = 'none';
        isiOverride = 4000 + Math.random()*6000; // 4-10s, imprevedibile di proposito
      } else {
        cueType = Math.random()<0.5 ? 'none' : 'center';
        isiOverride = null; // usa l'ISI normale impostato in setup
      }
      seq.push({val:'target', cueType, congruency:'neutral', side:'center', targetDir:null, correctAnswer:'go', block, isiOverride, valid:true});
    }
    return seq;
  }
  // Task-switching: regola "parity" (pari/dispari) o "magnitude" (>5 / <5)
  // su numeri 1-9 esclus 5; cambia con probabilità cfg.targetRate.
  // Due regole binarie per ciascun materiale disponibile per il task-switching.
  // classify(item) -> true = risposta "a", false = risposta "b".
  const SWITCH_RULESETS = {
    numeri: {
      ruleA:{label:'Pari / Dispari', labelA:'Pari', labelB:'Dispari', classify:v=> parseInt(v,10)%2===0},
      ruleB:{label:'Alto (>5) / Basso (<5)', labelA:'Alto (>5)', labelB:'Basso (<5)', classify:v=> parseInt(v,10)>5}
    },
    lettere: {
      ruleA:{label:'Vocale / Consonante', labelA:'Vocale', labelB:'Consonante', classify:v=> 'AEIOU'.includes(v)},
      ruleB:{label:'A–M / N–Z', labelA:'A–M', labelB:'N–Z', classify:v=> v<='M'}
    },
    colori: {
      ruleA:{label:'Caldo / Freddo', labelA:'Caldo', labelB:'Freddo', classify:v=> ['Rosso','Giallo','Arancione','Magenta'].includes(v.icon)},
      ruleB:{label:'Primario / Non primario', labelA:'Primario', labelB:'Non primario', classify:v=> ['Rosso','Blu','Giallo'].includes(v.icon)}
    },
    simboli: {
      ruleA:{label:'Rotondo / Con angoli', labelA:'Rotondo', labelB:'Con angoli', classify:v=> ['●','⬤'].includes(v)},
      ruleB:{label:'Grande / Piccolo', labelA:'Grande', labelB:'Piccolo', classify:null} // gestito a parte: dimensione casuale ad ogni prova, non proprietà fissa del simbolo
    },
    // Modalità bivalente: a differenza degli altri materiali, qui le due
    // regole non sono due modi di guardare la STESSA proprietà (es. pari/
    // dispari vs alto/basso su un numero) — sono due dimensioni indipendenti
    // dello stesso stimolo (tipo di carattere e colore), assegnate a caso ad
    // ogni prova. Questo crea vera bivalenza in stile Stroop: su metà delle
    // prove le due dimensioni "concordano" (es. numero nero → risposta A sia
    // per tipo che per colore), sull'altra metà sono in conflitto (es.
    // numero rosso → tipo dice A, colore dice B) — la congruenza è marcata
    // per ogni prova indipendentemente da quale regola sia attiva in quel
    // momento, e alimenta un indice di conflitto calcolato allo stesso modo
    // di quello dell'ANT (RT incongruenti − RT congruenti).
    // Nota sull'etichetta "Bianco" invece di "Nero": lo schermo di sessione
    // ha sfondo scuro (--focus), quindi un vero nero sarebbe invisibile —
    // lo stimolo di quel colore viene reso in bianco (vedi renderStimulus).
    // L'etichetta deve corrispondere a quello che il paziente vede davvero,
    // non al nome interno della proprietà (colore:'nero' resta invariato
    // nei dati per compatibilità con le sessioni già registrate).
    bivalente: {
      ruleA:{label:'Numero / Lettera', labelA:'Numero', labelB:'Lettera', classify:v=> v.tipo==='numero'},
      ruleB:{label:'Bianco / Rosso', labelA:'Bianco', labelB:'Rosso', classify:v=> v.colore==='nero'}
    }
  };
  // Materiale pronunciato: stessa regola di classificazione di lettere/numeri
  // (stessi valori, POOLS.lettereVoce/numeriVoce sono lo stesso array) — usato
  // dalla Categorizzazione condizionale ai livelli a dimensione singola.
  SWITCH_RULESETS.lettereVoce = SWITCH_RULESETS.lettere;
  SWITCH_RULESETS.numeriVoce = SWITCH_RULESETS.numeri;
  // Regole di classificazione dello Stop-Signal two-choice: una sola regola
  // fissa per materiale (a differenza del Task-switching non c'è alternanza
  // fra due regole), riusa le stesse coppie già validate altrove dove
  // esistono (vocale/consonante, pari/dispari) invece di inventarne di nuove.
  // 'suoni' non ha un ruleset preesistente: la coppia scelta (grave/acuto,
  // soglia sulla frequenza mediana del pool esistente) è un'ipotesi di
  // costruzione, non un dato di letteratura — da confermare.
  const STOPSIGNAL_RULES = {
    frecce: {labelA:'◀ Sinistra', labelB:'Destra ▶', classify:v=> v==='◀'},
    lettere:{labelA:SWITCH_RULESETS.lettere.ruleA.labelA, labelB:SWITCH_RULESETS.lettere.ruleA.labelB, classify:SWITCH_RULESETS.lettere.ruleA.classify},
    numeri: {labelA:SWITCH_RULESETS.numeri.ruleA.labelA, labelB:SWITCH_RULESETS.numeri.ruleA.labelB, classify:SWITCH_RULESETS.numeri.ruleA.classify},
    forma:  {labelA:'Cerchio', labelB:'Triangolo', classify:v=> v==='●'},
    suoni:  {labelA:'Grave', labelB:'Acuto', classify:v=> v.f < 380}
  };
  const SWITCH_BIVALENTE_NUM_POOL = ['1','2','3','4','6','7','8','9'];
  const SWITCH_BIVALENTE_LETTERE = ['A','B','D','E','F','G','H','I','J','K','L','M','O','P','U']; // identità della lettera irrilevante per entrambe le regole bivalenti (Numero/Lettera, Bianco/Rosso) — include vocali e consonanti, nessuna ragione per escluderle
  function buildSwitching(){
    const material = cfg.switchMaterial;
    const rs = SWITCH_RULESETS[material];
    const SWITCH_NUM_POOL = ['1','2','3','4','6','7','8','9']; // fisso: la regola >5/<5 richiede numeri a una cifra
    const pool = (material==='numeri') ? SWITCH_NUM_POOL : (material==='bivalente') ? null : POOLS[material];
    const seq = [];
    // Squilibrio tra le due regole: fissato all'inizio della sessione sul
    // livello raggiunto l'ultima volta (buildSwitching gira prima che la
    // sessione esista, quindi non può leggere un livello "in diretta" come
    // fa il CSI, che invece si aggiorna davvero prova per prova).
    const dominance = cfg.titrationMode!=='manuale' ? (ADAPT_SWITCH_BALANCE[cfg.adaptStartLevel]||0.5) : 0.5;
    let activeRule = Math.random()<0.5 ? 'A' : 'B';
    for(let i=0;i<cfg.trials;i++){
      const prevRule = activeRule;
      const wantsChange = i>0 && Math.random() < cfg.targetRate;
      if(wantsChange){
        activeRule = Math.random() < dominance ? 'A' : 'B';
      }
      const isSwitch = i>0 && activeRule !== prevRule;
      let item;
      if(material==='bivalente'){
        const isNumero = Math.random()<0.5;
        const valore = isNumero
          ? SWITCH_BIVALENTE_NUM_POOL[Math.floor(Math.random()*SWITCH_BIVALENTE_NUM_POOL.length)]
          : SWITCH_BIVALENTE_LETTERE[Math.floor(Math.random()*SWITCH_BIVALENTE_LETTERE.length)];
        item = {valore, tipo: isNumero?'numero':'lettera', colore: Math.random()<0.5?'nero':'rosso'};
      } else {
        item = pool[Math.floor(Math.random()*pool.length)];
      }
      const ruleDef = activeRule==='A' ? rs.ruleA : rs.ruleB;
      let correctAnswer, sizeVariant = null, congruency = null;
      if(material==='simboli' && activeRule==='B'){
        sizeVariant = Math.random()<0.5 ? 'grande' : 'piccolo';
        correctAnswer = sizeVariant==='grande' ? 'a' : 'b';
      } else {
        correctAnswer = ruleDef.classify(item) ? 'a' : 'b';
      }
      if(material==='bivalente'){
        const ansTipo = rs.ruleA.classify(item) ? 'a' : 'b';
        const ansColore = rs.ruleB.classify(item) ? 'a' : 'b';
        congruency = ansTipo===ansColore ? 'congruent' : 'incongruent';
      }
      seq.push({val:item, rule:activeRule, ruleDef, correctAnswer, sizeVariant, congruency, isSwitch, valid:true});
    }
    return seq;
  }
  // ---------- Simon task ----------
  // Conflitto spazio-risposta, non identità-vs-identità come il flanker
  // dell'ANT: un solo stimolo (nessun distrattore affiancato), il
  // conflitto nasce fra la POSIZIONE dello stimolo (irrilevante per il
  // compito) e la posizione del pulsante di risposta corretto — Simon &
  // Rudell, 1967, Journal of Applied Psychology, 51(3), 300-304.
  // Deliberatamente NON il Color-Word Stroop classico: eviterebbe di
  // sovrapporsi a un eventuale Stroop usato come misura diagnostica
  // altrove (NeuroScore o test carta-e-matita), che l'esposizione
  // ripetuta come esercizio di training contaminerebbe con un effetto di
  // pratica scambiabile per miglioramento reale.
  // Mappatura colore→pulsante FISSA per l'intera sessione (Blu→sinistra,
  // Verde→destra) — dichiarata una volta nelle istruzioni, non
  // rimescolata prova per prova (sarebbe un cambio di regola a metà
  // sessione, vietato dal principio delle bande strutturali). Riusa gli
  // stessi hex già validati in POOLS.colori, non nuovi colori inventati.
  const SIMON_COLORS = { blu:{hex:'#3B72D6', icon:'Blu'}, verde:{hex:'#3FA34D', icon:'Verde'} };
  // Proporzione di congruenza: manipolazione list-wide (a livello di
  // blocco/sessione, non prova per prova) — parametro clinico fisso,
  // deciso in Setup, non una leva della titolazione adattiva: la
  // proporzione di congruenza cambia CHE COSA si misura (quanto il
  // paziente sfrutta l'aspettativa generale per prepararsi
  // proattivamente all'interferenza), non QUANTO è difficile in senso
  // continuo — stessa distinzione già fatta per Categorizzazione
  // condizionale (struttura Manuale mai derivata dal livello).
  const SIMON_CONGRUENCE_PROB = { bilanciato:0.5, prevalenza_congruente:0.75, prevalenza_incongruente:0.25 };
  function buildSimon(){
    const congProb = SIMON_CONGRUENCE_PROB[cfg.simonCongruenza] || 0.5;
    const seq = [];
    for(let i=0;i<cfg.trials;i++){
      const isBlu = Math.random()<0.5;
      const val = isBlu ? SIMON_COLORS.blu : SIMON_COLORS.verde;
      const correctAnswer = isBlu ? 'left' : 'right'; // mappatura fissa Blu→sinistra, Verde→destra
      const congruent = Math.random() < congProb;
      const side = congruent ? correctAnswer : (correctAnswer==='left' ? 'right' : 'left');
      seq.push({val, side, correctAnswer, congruency: congruent?'congruent':'incongruent', valid:true});
    }
    return seq;
  }

  // Esercizio separato dal Task-switching: qui la regola resta fissa per
  // tutta la sessione (non si misura il costo di cambiare regola, ma il
  // carico di applicarne una di complessità crescente). 5 livelli fissi,
  // struttura confermata da Rodrigo — non adattivo (a differenza di
  // switching/nback/ecc.), il livello si sceglie a mano come per il
  // neglect a regola.
  // Livelli 2/3/5 condividono lo stesso item a due dimensioni indipendenti
  // (tipo: lettera/numero; colore: nero/rosso) usato dal bivalente dello
  // switching, ma con mappature diverse sulla risposta:
  //  - L2: doppia dimensione con no-go (3 risposte attive + un caso di non risposta)
  //  - L3: stessa doppia dimensione, ricombinata in una regola disgiuntiva a 2 risposte
  //  - L5: stessa doppia dimensione, mappatura diretta a 4 risposte (nessun no-go, nessuna disgiunzione)
  // I livelli 1/4 restano invece a singola dimensione (colore o simbolo,
  // scelta dall'operatore) — L4 aggiunge il confronto con lo stimolo
  // precedente (n-back sulla categoria, n=1 fisso).
  const CATEG_LETTERE = ['B','D','F','G','H','J','K','L','M','P']; // consonanti, come nel bivalente dello switching
  const CATEG_NUMERI = ['1','2','3','4','6','7','8','9'];
  function genCategItem(){
    const isLettera = Math.random()<0.5;
    const valore = isLettera
      ? CATEG_LETTERE[Math.floor(Math.random()*CATEG_LETTERE.length)]
      : CATEG_NUMERI[Math.floor(Math.random()*CATEG_NUMERI.length)];
    return { tipo: isLettera?'lettera':'numero', valore, colore: Math.random()<0.5?'nero':'rosso' };
  }
  function categL2Outcome(item){
    if(item.tipo==='lettera' && item.colore==='nero') return 'a';
    if(item.tipo==='lettera' && item.colore==='rosso') return 'nogo';
    if(item.tipo==='numero' && item.colore==='rosso') return 'b';
    return 'c'; // numero nero
  }
  function categL3Outcome(item){
    const isA = (item.tipo==='lettera' && item.colore==='nero') || (item.tipo==='numero' && item.colore==='rosso');
    return isA ? 'a' : 'b';
  }
  function categL5Outcome(item){
    if(item.tipo==='lettera') return item.colore==='nero' ? 'a' : 'l';
    return item.colore==='nero' ? 'z' : 'm';
  }
  // Generazione incrementale, necessaria per l'adattivo: la struttura
  // (quale regola sta seguendo il paziente) resta SEMPRE quella del
  // livello di PARTENZA della sessione (mai quella del livello live) — un
  // cambio di struttura è un cambio di regola, e la titolazione è già
  // vincolata a non attraversare il confine di fascia entro la stessa
  // seduta (vedi sessionLevelBounds/STRUCTURAL_BANDS). Solo ISI e
  // frequenza lure (parametri continui, non regole) seguono il livello
  // live quando l'adattivo è attivo.
  function genCategTrial(){
    const startLevel = cfg.categLivello;
    const structure = categEffectiveStructure(cfg);
    const manuale = cfg.titrationMode==='manuale';
    const liveLevel = (!manuale && cfg.adaptive) ? (session.categLevel||startLevel) : startLevel;
    const isiOverride = manuale ? null : CATEG_ISI[liveLevel];
    if(structure===1){
      const rs = SWITCH_RULESETS[cfg.categMateriale].ruleA;
      const pool = POOLS[cfg.categMateriale];
      const val = pool[Math.floor(Math.random()*pool.length)];
      const trial = {val, correctAnswer: rs.classify(val)?'a':'b', valid:true, categMateriale:cfg.categMateriale, isiOverride};
      session.seq.push(trial);
      return trial;
    }
    if(structure===4){
      const rs = SWITCH_RULESETS[cfg.categMateriale].ruleA;
      const pool = POOLS[cfg.categMateriale];
      const lureFreq = manuale ? (cfg.targetRate||0) : (CATEG_LURE[liveLevel]||0);
      function pickCategValue(wantCat){
        const want = wantCat==='a';
        const filtered = pool.filter(v=>rs.classify(v)===want);
        return filtered.length ? filtered[Math.floor(Math.random()*filtered.length)] : pool[Math.floor(Math.random()*pool.length)];
      }
      const i = session.seq.length;
      const valid = i>0;
      let val, cat, isLure=false;
      const prevCat = session.categPrevCat, prevCat2 = session.categPrevCat2;
      if(valid && i>=2 && prevCat2!=null && prevCat2!==prevCat && Math.random()<lureFreq){
        cat = prevCat2;
        val = pickCategValue(cat);
        isLure = true;
      } else {
        val = pool[Math.floor(Math.random()*pool.length)];
        cat = rs.classify(val) ? 'a' : 'b';
      }
      const correctAnswer = (valid && cat===prevCat) ? 'match' : 'nogo';
      const trial = {val, correctAnswer, valid, categMateriale:cfg.categMateriale, isLure};
      session.categPrevCat2 = prevCat; session.categPrevCat = cat;
      session.seq.push(trial);
      return trial;
    }
    const item = genCategItem();
    const correctAnswer = structure===2 ? categL2Outcome(item) : structure===3 ? categL3Outcome(item) : categL5Outcome(item);
    const trial = {val:item, correctAnswer, valid:true, categBivalente:true, isiOverride};
    session.seq.push(trial);
    return trial;
  }
  // buildCategorizzazione (generazione dell'intera sequenza in anticipo) è
  // stata sostituita da genCategTrial (sopra) — Categorizzazione condizionale
  // è ora sempre incrementale, necessario per l'adattivo con vincolo di
  // fascia strutturale (vedi STRUCTURAL_BANDS).
  // Doppio compito: canale visivo (lettere) + uditivo (toni), ciascuno con
  // regola 1-back indipendente, presentati simultaneamente.
  function buildDualTask(){
    const pairing = cfg.dualPairing || 'vis-aud';
    const pool1 = pairing==='aud-aud' ? POOLS.suoni : POOLS[cfg.dualVisual];
    const pool2 = pairing==='vis-vis' ? POOLS[cfg.dualVisual2] : pairing==='aud-aud' ? POOLS.suoni2 : POOLS.suoni;
    const seq = [];
    let prev1=null, prev2=null;
    for(let i=0;i<cfg.trials;i++){
      let v1 = pool1[Math.floor(Math.random()*pool1.length)];
      let v2 = pool2[Math.floor(Math.random()*pool2.length)];
      let t1 = i>0 && Math.random()<cfg.targetRate;
      let t2 = i>0 && Math.random()<cfg.targetRate;
      if(t1) v1 = prev1;
      if(t2) v2 = prev2;
      seq.push({val:v1, visualVal:v1, audioVal:v2, visualIsTarget: i>0?t1:false, audioIsTarget: i>0?t2:false, valid:i>0});
      prev1=v1; prev2=v2;
    }
    return seq;
  }
  // Generazione incrementale del doppio compito: necessaria per una vera
  // adattività indipendente sui due canali (ciascuno valutato sulla sua
  // accuratezza, non su una media che le confonderebbe).
  function genDualTaskTrial(){
    const pairing = cfg.dualPairing || 'vis-aud';
    const pool1 = pairing==='aud-aud' ? POOLS.suoni : POOLS[cfg.dualVisual];
    const pool2 = pairing==='vis-vis' ? POOLS[cfg.dualVisual2] : pairing==='aud-aud' ? POOLS.suoni2 : POOLS.suoni;
    const i = session.seq.length;
    const freq1 = cfg.titrationMode!=='manuale' ? (ADAPT_DUAL_FREQ[session.dualLevel1]||cfg.targetRate) : cfg.targetRate;
    const freq2 = cfg.titrationMode!=='manuale' ? (ADAPT_DUAL_FREQ[session.dualLevel2]||cfg.targetRate) : cfg.targetRate;
    const lure1 = ADAPT_DUAL_LURE[session.dualLevel1]||0;
    const lure2 = ADAPT_DUAL_LURE[session.dualLevel2]||0;
    let v1 = pool1[Math.floor(Math.random()*pool1.length)];
    let v2 = pool2[Math.floor(Math.random()*pool2.length)];
    let t1 = i>0 && Math.random()<freq1;
    let t2 = i>0 && Math.random()<freq2;
    let isLure1=false, isLure2=false;
    if(t1) v1 = session.prevDual1;
    else if(i>=2 && lure1>0 && Math.random()<lure1){
      const cand = session.seq[i-2].visualVal;
      if(cand!==session.prevDual1){ v1 = cand; isLure1 = true; }
    }
    if(t2) v2 = session.prevDual2;
    else if(i>=2 && lure2>0 && Math.random()<lure2){
      const cand = session.seq[i-2].audioVal;
      if(cand!==session.prevDual2){ v2 = cand; isLure2 = true; }
    }
    const trial = {val:v1, visualVal:v1, audioVal:v2, visualIsTarget: i>0?t1:false, audioIsTarget: i>0?t2:false, valid:i>0, visualIsLure:isLure1, audioIsLure:isLure2};
    session.seq.push(trial);
    session.prevDual1 = v1; session.prevDual2 = v2;
    return trial;
  }
  // seqLabel: estrae l'etichetta leggibile di un elemento di sequenza.
  // Nella Sequenza bersaglio mista, ogni elemento è {stimType, item} (serve
  // il tipo per sapere come renderizzarlo/riprodurlo) — qui viene "svolto"
  // in modo trasparente, così tutto il resto del codice (istruzioni,
  // anteprima, CSV) continua a funzionare senza saperlo.
  function seqLabel(v){
    if(v && typeof v==='object' && Object.prototype.hasOwnProperty.call(v,'stimType') && Object.prototype.hasOwnProperty.call(v,'item')) return seqLabel(v.item);
    return (v && typeof v==='object') ? v.icon : v;
  }
  // A differenza di seqLabel (pensato per l'etichetta da mostrare), questo
  // serve per l'IDENTITÀ: due stimoli con lo stesso valore ma tipo diverso
  // (es. lettera "A" vista vs "A" pronunciata) non sono lo stesso stimolo —
  // serve quando il materiale può essere misto (vedi cfg.*Mista) e il
  // confronto va fatto su stimType+item, non solo sul valore visualizzato.
  function sameStim(a,b){
    const aObj = a && typeof a==='object' && Object.prototype.hasOwnProperty.call(a,'stimType');
    const bObj = b && typeof b==='object' && Object.prototype.hasOwnProperty.call(b,'stimType');
    if(aObj || bObj) return aObj && bObj && a.stimType===b.stimType && a.item===b.item;
    return seqLabel(a)===seqLabel(b);
  }
  function describeTargetSeq(){ return cfg.targetSeq.map(seqLabel).join(' → '); }

  /* ---------- scoring ---------- */
  function scoreFromCounts(c){
    const hitRate = c.targets>0 ? c.hits/c.targets : 0;
    const faRate = c.nonTargets>0 ? c.falseAlarms/c.nonTargets : 0;
    // log-linear correction for extreme rates (Hautus, 1995)
    const hr = (c.hits+0.5)/(c.targets+1);
    const fr = (c.falseAlarms+0.5)/(c.nonTargets+1);
    const z = p => -Math.sqrt(2)*erfinv(1-2*p);
    const dprime = c.targets>0 && c.nonTargets>0 ? (z(hr)-z(fr)) : null;
    const acc = (c.hits+c.correctRejections)/(c.targets+c.nonTargets || 1);
    return {hitRate, faRate, dprime, acc};
  }
  function erfinv(x){
    const a = 0.147;
    const ln = Math.log(1-x*x);
    const t1 = 2/(Math.PI*a)+ln/2;
    return Math.sign(x)*Math.sqrt(Math.sqrt(t1*t1-ln/a)-t1);
  }

  /* ---------- storage ---------- */
  // Storage: plain browser localStorage — works fully offline, no account,
  // no server. Data stays on this device/browser only.
  async function saveSession(rec){
    const key = 'traccian:sessione:'+rec.id;
    try{ localStorage.setItem(key, JSON.stringify(rec)); }
    catch(e){ console.error(e); alert('Impossibile salvare: memoria del browser piena o non disponibile.'); }
    historyCache = null;
    pushSession(rec); // fire-and-forget: la sessione è già al sicuro in locale comunque
  }
  async function loadHistory(){
    let local;
    try{
      local = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf('traccian:sessione:')===0){
          try{ local.push(JSON.parse(localStorage.getItem(k))); }catch(e){}
        }
      }
    }catch(e){ local = []; }

    if(sb && cloudUser){
      const remote = await pullRemote();
      const map = {};
      local.forEach(r=> map[r.id]=r);
      remote.forEach(r=>{
        map[r.id]=r;
        try{ localStorage.setItem('traccian:sessione:'+r.id, JSON.stringify(r)); }catch(e){}
      });
      const merged = Object.values(map).sort((a,b)=> b.ts-a.ts);
      historyCache = merged;
      return merged;
    }
    if(historyCache) return historyCache;
    local.sort((a,b)=> b.ts - a.ts);
    historyCache = local;
    return local;
  }
  // ---------- Reliable Change Index (RCI) — solo per l'export operatore ----------
  // Stima ogni sessione rispetto alla BASELINE del singolo paziente su quello
  // stesso esercizio (le prime N sessioni disponibili), non contro un campione
  // normativo esterno (che non abbiamo). Valori di affidabilità test-retest
  // sono stime prudenti di default: se hai valori più precisi dalla letteratura
  // per un dato paradigma, si possono correggere qui.
  const RCI_BASELINE_N = 3; // numero di sessioni iniziali usate come baseline
  const RCI_RELIABILITY = {
    nback:0.75, sequenza:0.70, gonogo:0.70, stopsignal:0.75,
    ant:0.70, switching:0.70, dualtask:0.65, neglect:0.70
  };
  // Restituisce {value, higherIsBetter} — la metrica principale per la riga,
  // oppure null se quell'esercizio/famiglia non ha una metrica adatta.
  // Estrae un valore 0-1 assimilabile ad "accuratezza" dalla sessione appena
  // conclusa, da usare per rendere il progresso verso l'obiettivo più sfumato
  // (vedi computeLevelGoalProgress) — non per l'RCI, che ha la propria logica.
  function primaryAccuracyOf(rec){
    const family = rec.family || 'signal';
    if((family==='signal' || family==='dual') && rec.metrics && rec.metrics.acc!=null) return rec.metrics.acc;
    if(family==='choice' && rec.choice && rec.choice.total) return rec.choice.correct/rec.choice.total;
    if(family==='spatial' && rec.neglect && rec.neglect.modalitaConteggio) return rec.neglect.accuratezzaConteggio;
    if(family==='spatial' && rec.neglect && rec.neglect.pctLeft!=null && rec.neglect.pctRight!=null) return (rec.neglect.pctLeft+rec.neglect.pctRight)/2;
    return null;
  }
  function rciPrimaryMetric(r){
    const family = r.family || 'signal';
    if(r.taskMode==='stopsignal') return (r.ssrt!=null) ? {value:r.ssrt, higherIsBetter:false} : null;
    if(family==='signal'){
      if(r.metrics && r.metrics.dprime!=null) return {value:r.metrics.dprime, higherIsBetter:true};
      if(r.metrics && r.metrics.acc!=null) return {value:r.metrics.acc, higherIsBetter:true};
      return null;
    }
    if(family==='choice'){
      if(r.choice && r.choice.total) return {value:r.choice.correct/r.choice.total, higherIsBetter:true};
      return null;
    }
    if(family==='dual'){
      const vals = [];
      if(r.metrics && r.metrics.acc!=null) vals.push(r.metrics.acc);
      if(r.metricsAud && r.metricsAud.acc!=null) vals.push(r.metricsAud.acc);
      if(!vals.length) return null;
      return {value: vals.reduce((a,b)=>a+b,0)/vals.length, higherIsBetter:true};
    }
    if(family==='spatial'){
      // 'Conteggio a regola': niente asimmetria misurabile con un unico
      // numero riportato (vedi nota sopra) — l'RCI per queste sedute usa
      // invece l'accuratezza del conteggio, una misura scalare pulita come
      // quella già usata per le famiglie 'choice'/'signal', non un
      // ripiego di fortuna.
      if(r.neglect && r.neglect.modalitaConteggio) return (r.neglect.accuratezzaConteggio!=null) ? {value:r.neglect.accuratezzaConteggio, higherIsBetter:true} : null;
      if(r.neglect && r.neglect.asymmetry!=null) return {value:Math.abs(r.neglect.asymmetry), higherIsBetter:false};
      return null;
    }
    return null;
  }
  function mean(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
  function sd(arr){
    if(arr.length<2) return null;
    const m = mean(arr);
    return Math.sqrt(arr.reduce((s,v)=>s+(v-m)*(v-m),0)/(arr.length-1));
  }
  // items: elenco di sessioni di UN SOLO paziente (già filtrate da chi chiama).
  // Confronta la media delle prime sessioni (baseline) con la media delle
  // ultime sessioni disponibili al momento in cui lo generi — non sessione
  // per sessione: è pensato per essere lanciato quando si vuole valutare
  // l'esito di una fase di trattamento, non ad ogni singolo export.
  // Calcolo condiviso fra l'export CSV e il report stampabile: entrambi
  // devono mostrare esattamente le stesse righe con la stessa logica, quindi
  // il calcolo vive qui una sola volta.
  // Confronta i parametri usati nelle sessioni di baseline con quelli delle
  // sessioni finali incluse nel confronto RCI — un cambiamento di
  // accuratezza fra condizioni diverse (livello, ISI, frequenza, modalità
  // di titolazione) misura quanto è cambiato IL COMPITO, non quanto è
  // cambiato il paziente, e userebbe la formula di Crawford & Howell fuori
  // dalla sua assunzione di fondo (stessa misura, stesse condizioni).
  // Risposta diretta a una domanda di Rodrigo: confrontare il livello 1
  // con il livello 10 dello stesso esercizio ha ESATTAMENTE lo stesso
  // problema di un ISI diverso fra le due sedute — coperto dallo stesso
  // controllo, sul campo finalLevel salvato per ogni sessione, non da un
  // meccanismo a parte.
  function sessionMismatchWarnings(baselineItems, finalItems){
    const warnings = [];
    function numField(getter){
      const b = baselineItems.map(x=>getter(x.r)).filter(v=>v!=null && !isNaN(v));
      const f = finalItems.map(x=>getter(x.r)).filter(v=>v!=null && !isNaN(v));
      if(!b.length || !f.length) return null; // dato non registrato per una delle due parti (es. sessioni storiche precedenti a questa consegna) — non verificabile, non si dichiara comparabile per default
      return {mb: mean(b), mf: mean(f)};
    }
    const isi = numField(r=>r.isi);
    if(isi && isi.mb>0 && Math.abs(isi.mf-isi.mb)/isi.mb > 0.15){
      warnings.push('ISI diverso fra baseline ('+Math.round(isi.mb)+'ms) e punto finale ('+Math.round(isi.mf)+'ms)');
    }
    const lvl = numField(r=> typeof r.finalLevel==='number' ? r.finalLevel : null);
    if(lvl && Math.abs(lvl.mf-lvl.mb) >= 2){
      warnings.push('livello diverso fra baseline (~'+lvl.mb.toFixed(1)+') e punto finale (~'+lvl.mf.toFixed(1)+')');
    }
    const trials = numField(r=>r.trials);
    if(trials && trials.mb>0 && Math.abs(trials.mf-trials.mb)/trials.mb > 0.20){
      warnings.push('numero di prove diverso fra baseline ('+Math.round(trials.mb)+') e punto finale ('+Math.round(trials.mf)+')');
    }
    const rate = numField(r=>r.targetRate);
    if(rate && Math.abs(rate.mf-rate.mb) > 0.05){
      warnings.push('frequenza bersaglio/no-go diversa fra baseline ('+Math.round(rate.mb*100)+'%) e punto finale ('+Math.round(rate.mf*100)+'%)');
    }
    const modesB = new Set(baselineItems.map(x=>x.r.titrationMode).filter(Boolean));
    const modesF = new Set(finalItems.map(x=>x.r.titrationMode).filter(Boolean));
    if(modesB.size && modesF.size && (![...modesB].every(m=>modesF.has(m)) || ![...modesF].every(m=>modesB.has(m)))){
      warnings.push('modalità di titolazione diversa fra baseline ('+[...modesB].join('/')+') e punto finale ('+[...modesF].join('/')+')');
    }
    return warnings;
  }
  function computeRCIRows(items){
    const groups = {};
    items.forEach(r=>{
      const metric = rciPrimaryMetric(r);
      if(!metric) return;
      if(!groups[r.taskMode]) groups[r.taskMode] = [];
      groups[r.taskMode].push({r, metric});
    });
    const rows = [];
    Object.keys(groups).forEach(taskMode=>{
      const list = groups[taskMode];
      list.sort((a,b)=> a.r.ts - b.r.ts);
      const n = list.length;
      if(n < 4) return; // troppo poche sessioni per separare baseline e punto finale in modo sensato
      const half = Math.min(RCI_BASELINE_N, Math.floor(n/2));
      const baselineItems = list.slice(0, half), finalItems = list.slice(n-half);
      const baselineVals = baselineItems.map(x=>x.metric.value);
      const finalVals = finalItems.map(x=>x.metric.value);
      const higherIsBetter = list[0].metric.higherIsBetter;
      const baselineMean = mean(baselineVals), finalMean = mean(finalVals);
      const baselineSD = sd(baselineVals);
      const rawReliability = RCI_RELIABILITY[taskMode] != null ? RCI_RELIABILITY[taskMode] : 0.70;
      // Correzione di Spearman-Brown: baseline e punto finale non sono una
      // singola misurazione ciascuno, sono già la media di 'half' sedute (2
      // o 3, a seconda di quante sedute totali sono disponibili per questo
      // paziente/esercizio) — una media è più affidabile di una singola
      // seduta, e va trattata come tale. Usare il coefficiente di
      // affidabilità di una singola seduta quando si sta in realtà
      // confrontando due medie rendeva il test sistematicamente più
      // conservativo del dovuto (una differenza reale aveva meno probabilità
      // di essere segnalata come significativa di quanto sarebbe corretto),
      // mai nella direzione opposta — non è un allentamento arbitrario del
      // criterio, è smettere di sottostimare l'affidabilità reale della
      // misura. reliability_k = k·r / (1 + (k-1)·r); con k=half=1 (caso
      // limite, non dovrebbe presentarsi dato il minimo di 4 sessioni sopra)
      // la formula si riduce identicamente al coefficiente originale.
      const reliability = (half*rawReliability) / (1 + (half-1)*rawReliability);
      if(!baselineSD) return;
      const seDiff = baselineSD * Math.sqrt(2*(1-reliability));
      if(!seDiff) return;
      let rci = (finalMean - baselineMean) / seDiff;
      if(!higherIsBetter) rci = -rci;
      const exLabel = EXERCISES[taskMode] ? EXERCISES[taskMode].label : taskMode;
      // Il controllo di comparabilità viene DOPO il calcolo, non prima: si
      // vuole sempre poter mostrare le medie grezze (baseline/finale) anche
      // quando il confronto non è valido — solo il numero RCI viene
      // soppresso (null), mai le due medie, che restano dati legittimi da
      // guardare per quello che sono anche senza un indice sintetico sopra.
      const warnings = sessionMismatchWarnings(baselineItems, finalItems);
      rows.push({
        exLabel, n, half, baselineMean, finalMean,
        rci: warnings.length ? null : rci,
        comparable: !warnings.length,
        warnings,
        significativo: warnings.length ? false : Math.abs(rci)>=1.96
      });
    });
    return rows;
  }
  function generateRCIReport(items, patientLabel){
    const rows = computeRCIRows(items);
    if(!rows.length){ alert('Non ci sono ancora abbastanza sessioni per un report RCI (servono almeno 4 sessioni sullo stesso esercizio).'); return; }
    const head = ['esercizio','sessioni_totali','sessioni_per_gruppo','media_baseline','media_finale','rci','cambiamento_significativo','confronto_valido','motivo_non_validita'];
    const csv = [head.join(';')].concat(rows.map(r=>[
      r.exLabel, r.n, r.half, r.baselineMean.toFixed(2), r.finalMean.toFixed(2),
      r.comparable ? r.rci.toFixed(2) : '', r.comparable ? (r.significativo?'Sì':'No') : '',
      r.comparable ? 'Sì' : 'No', r.comparable ? '' : r.warnings.join(' | ')
    ].join(';'))).join('\n');
    const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'traccian_rci_'+(patientLabel||'paziente').replace(/[^a-z0-9]/gi,'_')+'.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  // Report stampabile: stessa base dati del CSV, presentata come pagina HTML
  // formattata per la stampa/salvataggio in PDF (Ctrl/Cmd+P → "Salva come
  // PDF" — nessuna libreria PDF necessaria, coerente col vincolo "single
  // file, no dipendenze esterne"). Apre una finestra separata invece di
  // sovrascrivere lo schermo corrente, così l'operatore non perde il
  // contesto da cui l'ha lanciato.
  function printRCIReport(items, patientLabel){
    const rows = computeRCIRows(items);
    if(!rows.length){ alert('Non ci sono ancora abbastanza sessioni per un report RCI (servono almeno 4 sessioni sullo stesso esercizio).'); return; }
    const w = window.open('', '_blank');
    if(!w){ alert('Il browser ha bloccato l\'apertura della finestra di stampa. Consenti i popup per questo sito e riprova.'); return; }
    const esc = (s)=> String(s).replace(/[&<>]/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const rowsHtml = rows.map(r=>
      '<tr><td>'+esc(r.exLabel)+'</td><td>'+r.n+'</td><td>'+r.half+'</td>'
      +'<td>'+r.baselineMean.toFixed(2)+'</td><td>'+r.finalMean.toFixed(2)+'</td>'
      +(r.comparable
        ? '<td>'+r.rci.toFixed(2)+'</td><td class="'+(r.significativo?'sig-yes':'sig-no')+'">'+(r.significativo?'Sì':'No')+'</td>'
        : '<td colspan="2" class="not-comparable">Confronto non disponibile — '+esc(r.warnings.join('; '))+'</td>')
      +'</tr>'
    ).join('');
    const html = '<!doctype html><html lang="it"><head><meta charset="utf-8">'
      +'<title>Report RCI — '+esc(patientLabel||'paziente')+'</title>'
      +'<style>'
      +'body{font-family:Georgia,serif; color:#1a1a1a; max-width:800px; margin:32px auto; padding:0 16px;}'
      +'h1{font-size:20px; margin-bottom:2px;} .sub{color:#555; font-size:13px; margin-bottom:24px;}'
      +'table{width:100%; border-collapse:collapse; font-size:13px;}'
      +'th,td{border:1px solid #ccc; padding:8px 10px; text-align:left;}'
      +'th{background:#f2f2f2;} .sig-yes{color:#0a6b2f; font-weight:700;} .sig-no{color:#555;}'
      +'.not-comparable{color:#a33; font-style:italic;}'
      +'.note{margin-top:20px; font-size:12px; color:#555; line-height:1.5;}'
      +'.printbtn{margin:16px 0; padding:8px 16px; font-size:13px;}'
      +'@media print{ .printbtn{display:none;} body{margin:0;} }'
      +'</style></head><body>'
      +'<h1>TracciaN — Report cambiamento affidabile (RCI)</h1>'
      +'<div class="sub">Paziente: '+esc(patientLabel||'—')+' · generato il '+esc(todayStr())+'</div>'
      +'<button class="printbtn" onclick="window.print()">Stampa / Salva PDF</button>'
      +'<table><thead><tr><th>Esercizio</th><th>Sessioni tot.</th><th>Per gruppo</th>'
      +'<th>Media baseline</th><th>Media finale</th><th>RCI</th><th>Cambiamento significativo</th></tr></thead>'
      +'<tbody>'+rowsHtml+'</tbody></table>'
      +'<div class="note">RCI calcolato secondo Crawford &amp; Howell — |RCI| ≥ 1.96 indica un cambiamento '
      +'statisticamente affidabile (p&lt;.05), non attribuibile a variabilità di misura tra sessioni. '
      +'Baseline e punto finale sono la media delle prime/ultime sessioni disponibili per ciascun esercizio '
      +'(fino a '+RCI_BASELINE_N+' per gruppo) — l\'affidabilità usata nel calcolo è corretta con la formula '
      +'di Spearman-Brown per riflettere che si confrontano due medie, non due sedute singole. '
      +'Quando i parametri (livello, ISI, numero di prove, frequenza, modalità di titolazione) differiscono '
      +'in modo sostanziale fra le sessioni di baseline e quelle finali, l\'RCI non viene calcolato: un '
      +'cambiamento di accuratezza fra condizioni diverse misurerebbe quanto è cambiato il compito, non il '
      +'paziente — le medie restano comunque mostrate, solo l\'indice sintetico viene soppresso. '
      +'Documento generato da TracciaN, uso clinico.</div>'
      +'</body></html>';
    w.document.open(); w.document.write(html); w.document.close();
  }
  // ---------- Motore generico "compito a obiettivi" ----------
  // Infrastruttura condivisa per pianificazione, multitasking (Six Elements /
  // Multiple Errands) e scenari ecologici (cucina, farmaci, spesa...) — tutti
  // condividono lo stesso schema sottostante: elenco di elementi da
  // completare, vincoli fra loro, un budget di tempo, regole il cui mancato
  // rispetto viene tracciato come "violazione" invece che come semplice
  // errore. Il paziente può sempre TENTARE qualsiasi elemento visibile (come
  // nel Six Elements/Multiple Errands reali): le regole non bloccano il
  // tocco, penalizzano come violazione — coerente con l'approccio già in uso
  // per le dipendenze. Fa eccezione la mutua esclusione (una scelta reale
  // rimuove l'alternativa, non è una "regola infranta") e gli elementi
  // nascosti (finestra oraria non ancora aperta, memoria prospettica non
  // ancora dovuta): quelli non sono nemmeno mostrati, si "materializzano"
  // quando è il momento.
  //
  // Forma di uno scenario:
  // { chiave, label, budgetSecondi: number|null, budgetErroriTollerati: number|null,
  //   regole: ['no_consecutivi_stessa_categoria', 'no_versioni_consecutive_stesso_gruppo', 'ingresso_unico_per_luogo', ...],
  //   distrattore: { alSec, finestraSec, item:{testo,categoria} } | null,
  //   items: [{ id, testo, categoria,
  //     vincoli:{ richiede:'altroId' },        // dipendenza sequenziale
  //     gruppo, versione,                       // per no_versioni_consecutive_stesso_gruppo (due metà dello stesso compito)
  //     luogo,                                  // per ingresso_unico_per_luogo (Multiple Errands: non rientrare due volte)
  //     finestra:{daSec,aSec},                  // finestra oraria: fuori da qui, violazione o perdita automatica
  //     escludeSe:'altroId',                    // mutua esclusione: completarlo rimuove l'altro dalla lista
  //     richiedeInfo:'chiave', fornisceInfo:'chiave', // integrazione informativa fra elementi
  //     prospettica:{dopoNAzioni, alSecondo}    // elemento nascosto finché non è "dovuto" (memoria prospettica)
  //   }] }
  const GOALTASK_SCENARIOS = {};

  function startGoalTask(scenario){
    return {
      scenario, startedAt: performance.now(), completati: [], violazioni: [],
      scartati: [], persi: [], infoRaccolte: {},
      distrattoreAttivo: null, distrattoreScadeAt: null, distrattoreGestito: false
    };
  }
  // Trova un elemento sia fra quelli dello scenario sia nel distrattore
  // eventualmente iniettato (che non fa parte di scenario.items).
  function goalTaskItemById(state, id){
    if(state.distrattoreAttivo && state.distrattoreAttivo.id===id) return state.distrattoreAttivo;
    return state.scenario.items.find(x=>x.id===id) || null;
  }
  function completeGoalTaskItem(state, itemId){
    const item = goalTaskItemById(state, itemId);
    if(!item || state.completati.includes(itemId) || state.scartati.includes(itemId) || state.persi.includes(itemId)) return state;
    const regole = state.scenario.regole || [];
    const ultimoId = state.completati.length ? state.completati[state.completati.length-1] : null;
    const ultimo = ultimoId ? goalTaskItemById(state, ultimoId) : null;
    if(item.vincoli && item.vincoli.richiede && !state.completati.includes(item.vincoli.richiede)){
      state.violazioni.push({itemId, tipo:'dipendenza_non_rispettata', ts:performance.now()});
    }
    if(regole.indexOf('no_consecutivi_stessa_categoria')!==-1 && ultimo && item.categoria && ultimo.categoria===item.categoria){
      state.violazioni.push({itemId, tipo:'due_consecutivi_stessa_categoria', ts:performance.now()});
    }
    // Six Elements originale: le due "metà" dello stesso compito non vanno
    // fatte una dopo l'altra — qui "gruppo" identifica la coppia (es. le due
    // storielle), non basta la categoria generica già usata sopra.
    if(regole.indexOf('no_versioni_consecutive_stesso_gruppo')!==-1 && ultimo && item.gruppo && ultimo.gruppo===item.gruppo){
      state.violazioni.push({itemId, tipo:'versioni_consecutive_stesso_gruppo', ts:performance.now()});
    }
    // Finestra oraria: se si tenta l'elemento fuori dall'intervallo previsto
    // (es. farmaco della sera preso di mattina), è una violazione — resta
    // comunque completabile, come nella vita reale si può sempre provare a
    // fare qualcosa fuori orario, solo che è sbagliato farlo.
    if(item.finestra){
      const elapsedSec = (performance.now()-state.startedAt)/1000;
      if(elapsedSec < item.finestra.daSec || elapsedSec > item.finestra.aSec){
        state.violazioni.push({itemId, tipo:'finestra_non_rispettata', ts:performance.now()});
      }
    }
    // Multiple Errands: non si rientra in un luogo già lasciato per un altro.
    if(regole.indexOf('ingresso_unico_per_luogo')!==-1 && item.luogo){
      const completatiConLuogo = state.completati.map(id=>goalTaskItemById(state,id)).filter(x=>x && x.luogo===item.luogo);
      if(completatiConLuogo.length){
        const idxUltimoStessoLuogo = state.completati.lastIndexOf(completatiConLuogo[completatiConLuogo.length-1].id);
        const cambiatoLuogoDopo = state.completati.slice(idxUltimoStessoLuogo+1).some(id=>{
          const it = goalTaskItemById(state,id); return it && it.luogo && it.luogo!==item.luogo;
        });
        if(cambiatoLuogoDopo) state.violazioni.push({itemId, tipo:'luogo_rivisitato', ts:performance.now()});
      }
    }
    // Integrazione informativa: usare un'informazione prima di averla raccolta.
    if(item.richiedeInfo && !state.infoRaccolte[item.richiedeInfo]){
      state.violazioni.push({itemId, tipo:'informazione_mancante', ts:performance.now()});
    }
    if(item.fornisceInfo) state.infoRaccolte[item.fornisceInfo] = true;
    // Se il distrattore appena iniettato viene gestito, disattivalo.
    if(state.distrattoreAttivo && state.distrattoreAttivo.id===itemId){
      state.distrattoreAttivo = null;
      state.distrattoreGestito = true;
    }
    // Mutua esclusione: una scelta reale, non una regola — l'alternativa
    // sparisce dalla lista invece di poter essere ancora completata.
    if(item.escludeSe && state.scartati.indexOf(item.escludeSe)===-1){
      state.scartati.push(item.escludeSe);
    }
    state.completati.push(itemId);
    return state;
  }
  // Elementi visibili in un dato istante: esclude scartati (mutua esclusione)
  // e persi (finestra oraria scaduta senza completarli), nasconde gli
  // elementi di memoria prospettica finché non sono "dovuti", e include il
  // distrattore iniettato se attivo in questo momento.
  function goalTaskVisibleItems(state){
    const elapsedSec = (performance.now()-state.startedAt)/1000;
    const base = state.scenario.items.filter(it=>{
      if(state.scartati.indexOf(it.id)!==-1 || state.persi.indexOf(it.id)!==-1) return false;
      if(it.prospettica){
        const dueByCount = it.prospettica.dopoNAzioni!=null ? state.completati.length >= it.prospettica.dopoNAzioni : true;
        const dueByTime = it.prospettica.alSecondo!=null ? elapsedSec >= it.prospettica.alSecondo : true;
        if(!(dueByCount && dueByTime)) return false;
      }
      return true;
    });
    return state.distrattoreAttivo ? base.concat([state.distrattoreAttivo]) : base;
  }
  // Da chiamare periodicamente (ogni secondo, insieme al controllo budget):
  // fa scadere le finestre orarie non rispettate e gestisce comparsa/scadenza
  // del distrattore. Ritorna lo stato per comodità di chiamata.
  function goalTaskTick(state){
    const elapsedSec = (performance.now()-state.startedAt)/1000;
    state.scenario.items.forEach(it=>{
      if(it.finestra && !state.completati.includes(it.id) && state.persi.indexOf(it.id)===-1 && state.scartati.indexOf(it.id)===-1){
        if(elapsedSec > it.finestra.aSec){
          state.persi.push(it.id);
          state.violazioni.push({itemId:it.id, tipo:'finestra_scaduta_senza_completare', ts:performance.now()});
        }
      }
    });
    const d = state.scenario.distrattore;
    if(d){
      if(!state.distrattoreAttivo && !state.distrattoreGestito && elapsedSec >= d.alSec){
        state.distrattoreAttivo = Object.assign({id:'distrattore', categoria:'distrattore'}, d.item);
        state.distrattoreScadeAt = elapsedSec + d.finestraSec;
      } else if(state.distrattoreAttivo && elapsedSec > state.distrattoreScadeAt){
        state.violazioni.push({itemId:state.distrattoreAttivo.id, tipo:'distrattore_non_gestito', ts:performance.now()});
        state.distrattoreAttivo = null;
        state.distrattoreGestito = true;
      }
    }
    return state;
  }
  function scoreGoalTask(state){
    const elapsedSec = (performance.now()-state.startedAt)/1000;
    const totaleElementi = state.scenario.items.length;
    const completatiCount = state.completati.length;
    const budgetRispettato = state.scenario.budgetSecondi ? elapsedSec<=state.scenario.budgetSecondi : true;
    const soglia = state.scenario.budgetErroriTollerati;
    const erroriEntroSoglia = soglia!=null ? state.violazioni.length<=soglia : true;
    return {
      completatiCount, totaleElementi,
      percentualeCompletamento: totaleElementi ? Math.round((completatiCount/totaleElementi)*100) : 0,
      violazioniCount: state.violazioni.length,
      tempoImpiegatoSec: Math.round(elapsedSec),
      budgetRispettato,
      sogliaErroriTollerati: soglia!=null ? soglia : null,
      erroriEntroSoglia
    };
  }

    {livello:16, parole:['epifania','recalcitranza','esiguità','preterintenzionale','anacronismo','perentorio','desueto','ineluttabile','circostanziato','peregrino','apodittico','inveterato','ipostasi','vacuità'], categorizzata:false}
  ];
  // Le tecniche PQRST e Chunking usano ciascuna una sola modalità di
  // materiale (brano/lista); Loci, Errorless learning e Vanishing cues sono
  // invece applicabili a entrambe — memoriaEffectiveMateriale() risolve la
  // modalità effettiva in ogni caso, così tutto il resto del codice usa
  // sempre questa funzione invece di controllare memoriaModo direttamente.
  function memoriaEffectiveMateriale(cfgLike){
    if(cfgLike.memoriaModo==='chunking') return 'lista';
    if(cfgLike.memoriaModo==='pqrst') return 'brano';
    return cfgLike.memoriaMateriale || 'lista';
  }
  // Regola generale di crescita per il chunking a sotto-gruppi (numero di
  // gruppi × dimensione di ciascuno, cresciuti insieme, non solo la
  // lunghezza totale). Livelli 1-10: gruppi mostrati esplicitamente con
  // etichetta di categoria. Livelli 11-16: gruppi presenti nel dato (usati
  // per l'osservazione del clustering in richiamo) ma NON mostrati al
  // paziente — la lista appare come blocco unico e il paziente organizza
  // con una tecnica propria fra quelle già esistenti (chunkingMetodi),
  // fino a 2 combinabili (soglia già in uso altrove nel codice, riusata
  // qui apposta per non introdurre un secondo confine indipendente).
  // Questa tabella governa solo LA STRUTTURA quando esiste un dato a
  // gruppi (vedi forme in MEMORIA_LISTE) — per ora solo i livelli 1-2 sono
  // popolati; i livelli 3-16 restano nella forma flat storica finché non
  // vengono anch'essi convertiti, contenuto da produrre gradualmente.
  const CHUNKING_GROUP_VISIBLE_MAX_LEVEL = 10;
  function chunkingGroupsVisible(livello){ return livello <= CHUNKING_GROUP_VISIBLE_MAX_LEVEL; }
  // Quante forme parallele esistono per il livello/modo correnti (1 se il
  // livello non è ancora stato popolato con forme multiple — vedi commenti
  // sopra). Usata dal selettore in setup e per validare memoriaFormaIdx.
  function memoriaNForme(modo, livello){
    if(modo==='chunking'){
      const e = MEMORIA_LISTE.find(l=>l.livello===livello);
      return (e && e.forme) ? e.forme.length : 1;
    }
    if(modo==='pqrst'){
      const e = MEMORIA_BRANI.find(b=>b.livello===livello);
      return (e && e.forme) ? e.forme.length : 1;
    }
    return 1;
  }
  // Set delle lettere-forma già usate da questo paziente, con questa
  // tecnica e a questo livello, secondo lo storico già caricato in
  // memoria (historyCache). Non forza un caricamento: se lo storico non è
  // ancora stato popolato in questa sessione operatore (es. primo accesso
  // dopo login, prima di aver aperto la scheda storico), ritorna un set
  // vuoto — il tag è un aiuto, non deve mai bloccare o rallentare il setup.
  function memoriaFormeUsatePerPaziente(patientCode, modo, livello){
    const out = new Set();
    if(!patientCode || !historyCache) return out;
    historyCache.forEach(r=>{
      if(r.family==='memoria' && r.patientCode===patientCode && r.memoria && r.memoria.modo===modo && r.memoria.livello===livello && r.memoria.formaLettera){
        out.add(r.memoria.formaLettera);
      }
    });
    return out;
  }
  // Normalizza una voce di MEMORIA_LISTE (nuova forma a `forme`/`gruppi`, o
  // vecchia forma flat con `parole`/`categorizzata`) in un'unica forma
  // canonica: {livello, parole (flat), gruppi (array o null), categorizzata,
  // categoria, nForme, formaIdx}. Il resto del codice usa sempre questa
  // funzione, mai le due forme direttamente.
  function memoriaListaResolve(entry, formaIdx){
    if(entry.forme && entry.forme.length){
      const idx = ((formaIdx||0) % entry.forme.length + entry.forme.length) % entry.forme.length;
      const forma = entry.forme[idx];
      if(forma.gruppi){
        const parole = [].concat(...forma.gruppi.map(g=>g.parole));
        const groupsVisible = chunkingGroupsVisible(entry.livello);
        return {
          livello:entry.livello, parole, categorizzata:true,
          gruppi: groupsVisible ? forma.gruppi : null, // nascosti dal livello 11 in su — restano nel dato solo per lo scoring, non passati al rendering
          nForme:entry.forme.length, formaIdx:idx
        };
      }
      // Forma "flat": lista a categoria singola (categorizzata:true, senza
      // sotto-gruppi — livelli 3-5) o non categorizzata (livelli 6+). Prima
      // di questa generalizzazione il ramo 'forme' assumeva sempre gruppi e
      // forzava categorizzata:true — corretto qui perché aggiungere forme
      // parallele a un livello non categorizzato non deve etichettarlo
      // come categorizzato per sbaglio.
      return {
        livello:entry.livello, parole:forma.parole, categorizzata:!!forma.categorizzata, categoria:forma.categoria||null,
        gruppi:null, nForme:entry.forme.length, formaIdx:idx
      };
    }
    return {livello:entry.livello, parole:entry.parole, categorizzata:entry.categorizzata, categoria:entry.categoria, gruppi:null, nForme:1, formaIdx:0};
  }
  // Normalizza una voce di MEMORIA_BRANI (nuova forma a `forme`/`sezioni`, o
  // vecchia forma flat con `titolo`/`testo`/`unita`) in un'unica forma
  // canonica a sezioni: {livello, titolo, testo (tutte le sezioni unite),
  // unita (tutte le sezioni concatenate), sezioni:[{testo,unita}, ...],
  // nForme, formaIdx}. Le voci storiche diventano una singola sezione, così
  // il ciclo P-Q-R-S per sezione funziona identico sia sul materiale nuovo
  // sia su quello vecchio, senza due percorsi di codice separati.
  function memoriaBranoResolve(entry, formaIdx){
    let titolo, sezioni;
    if(entry.forme && entry.forme.length){
      const idx = ((formaIdx||0) % entry.forme.length + entry.forme.length) % entry.forme.length;
      const forma = entry.forme[idx];
      titolo = forma.titolo; sezioni = forma.sezioni;
      return {
        livello:entry.livello, titolo, sezioni,
        testo: sezioni.map(s=>s.testo).join(' '),
        unita: [].concat(...sezioni.map(s=>s.unita)),
        nForme:entry.forme.length, formaIdx:idx
      };
    }
    return {
      livello:entry.livello, titolo:entry.titolo,
      sezioni:[{testo:entry.testo, unita:entry.unita}],
      testo:entry.testo, unita:entry.unita, nForme:1, formaIdx:0
    };
  }
  function memoriaMaterialFor(cfgLike){
    return memoriaEffectiveMateriale(cfgLike)==='lista'
      ? memoriaListaResolve(MEMORIA_LISTE.find(l=>l.livello===cfgLike.memoriaLivello) || MEMORIA_LISTE[0], cfgLike.memoriaFormaIdx)
      : memoriaBranoResolve(MEMORIA_BRANI.find(b=>b.livello===cfgLike.memoriaLivello) || MEMORIA_BRANI[0], cfgLike.memoriaFormaIdx);
  }
  // Elementi da imparare, come semplice array di stringhe, indipendentemente
  // dal materiale: parole della lista, o idee-chiave del brano. Usata dalle
  // tre tecniche condivise fra le due modalità (loci/errorless/vanishing) e
  // dalla fase di richiamo comune a tutte le modalità.
  function memoriaLearnItems(cfgLike, m){
    return memoriaEffectiveMateriale(cfgLike)==='lista' ? m.parole : m.unita;
  }
  // Percorso fisso di 16 luoghi familiari (un cammino mentale attraverso una
  // casa), sufficiente a coprire anche il materiale più lungo (16 parole al
  // livello 16). Metodo dei loci: un elemento per tappa, nello stesso ordine
  // del percorso — l'ordine del percorso è ciò che sostiene il richiamo,
  // niente di più.
  const LOCI_ROUTE = [
    'la cassetta della posta', 'il portone d\'ingresso', 'l\'attaccapanni dell\'ingresso', 'lo specchio del corridoio',
    'il tavolo della cucina', 'il frigorifero', 'la finestra sul giardino', 'il divano del soggiorno',
    'la libreria', 'la scala che sale', 'il pianerottolo', 'la porta della camera da letto',
    'il comodino', 'l\'armadio', 'la porta del bagno', 'lo scaffale del bagno'
  ];
  // Percorso "corpo": tappe = parti del corpo in ordine anatomico fisso
  // (testa -> piedi), per pazienti con scarsa familiarità ambientale o
  // ricoverati da tempo, per cui un percorso domestico non è un riferimento
  // stabile. Stesso principio del percorso casa: una tappa, un elemento.
  const LOCI_ROUTE_CORPO = [
    'la testa', 'la fronte', 'gli occhi', 'le orecchie',
    'il naso', 'la bocca', 'il collo', 'le spalle',
    'il petto', 'le braccia', 'le mani', 'la pancia',
    'i fianchi', 'le ginocchia', 'le caviglie', 'i piedi'
  ];
  // Percorso "personalizzato": l'operatore digita le tappe reali del
  // paziente (es. il proprio domicilio), una per riga. Usato solo quando
  // memoriaLociTipo==='personalizzato'; se vuoto si ricade sul percorso casa.
  function lociRouteFor(cfgLike){
    if(cfgLike.memoriaLociTipo==='corpo') return LOCI_ROUTE_CORPO;
    if(cfgLike.memoriaLociTipo==='personalizzato'){
      const lines = (cfgLike.memoriaLociCustom||'').split('\n').map(s=>s.trim()).filter(Boolean);
      return lines.length ? lines : LOCI_ROUTE;
    }
    return LOCI_ROUTE;
  }

        family==='choice' ? r.choice.correct+'/'+r.choice.total : '',
        family==='choice' ? r.choice.omitted : '',
        family==='choice' && r.choice.alerting!=null ? r.choice.alerting : '',
        family==='choice' && r.choice.orienting!=null ? r.choice.orienting : '',
        family==='choice' && r.choice.conflict!=null ? r.choice.conflict : '',
        family==='choice' && r.choice.switchCost!=null ? r.choice.switchCost : '',
        family==='spatial' && r.neglect.pctLeft!=null ? (r.neglect.pctLeft*100).toFixed(1)+'%':'',
        family==='spatial' && r.neglect.pctRight!=null ? (r.neglect.pctRight*100).toFixed(1)+'%':'',
        family==='spatial' && r.neglect.omittedLeft!=null ? r.neglect.omittedLeft : '',
        family==='spatial' && r.neglect.omittedRight!=null ? r.neglect.omittedRight : '',
        family==='spatial' && r.neglect.asymmetry!=null ? r.neglect.asymmetry : '',
        family==='spatial' && r.neglect.falseAlarms!=null ? r.neglect.falseAlarms : '',
        family==='goaltask' ? r.goaltask.scenarioLabel : '',
        family==='goaltask' ? r.goaltask.livello : '',
        family==='goaltask' ? r.goaltask.completatiCount : '',
        family==='goaltask' ? r.goaltask.totaleElementi : '',
        family==='goaltask' ? r.goaltask.percentualeCompletamento+'%' : '',
        family==='goaltask' ? r.goaltask.violazioniCount : '',
        family==='goaltask' ? r.goaltask.tempoImpiegatoSec : '',
        family==='goaltask' && r.goaltask.budgetSecondi ? (r.goaltask.budgetRispettato?'Sì':'No') : '',
        family==='memoria' ? MEMORIA_MODO_LABELS[r.memoria.modo] : '',
        family==='memoria' ? r.memoria.livello : '',
        family==='memoria' ? (r.memoria.formaLettera||'') : '',
        family==='memoria' ? r.memoria.recuperati : '',
        family==='memoria' ? r.memoria.totale : '',
        family==='memoria' ? r.memoria.percentuale+'%' : '',
        r.fatigueNote ? (r.fatigueNote.flag?'Sì':'No')+' ('+(r.fatigueNote.accFirst*100).toFixed(0)+'%→'+(r.fatigueNote.accLast*100).toFixed(0)+'%)' : '',
        family==='spatial' && r.neglect.modalitaConteggio && r.neglect.accuratezzaConteggio!=null ? (r.neglect.accuratezzaConteggio*100).toFixed(1)+'%' : '',
        family==='spatial' && r.neglect.modalitaConteggio && r.neglect.erroreAssolutoMedio!=null ? r.neglect.erroreAssolutoMedio.toFixed(2) : '',
        (r.notes||'').replace(/[\n,]/g,' '),
        family==='choice' && r.choice.switchCostRelative!=null ? (r.choice.switchCostRelative*100).toFixed(1)+'%' : '',
        family==='choice' && r.choice.repAcc!=null ? (r.choice.repAcc*100).toFixed(1)+'%' : '',
        family==='choice' && r.choice.switchAcc!=null ? (r.choice.switchAcc*100).toFixed(1)+'%' : ''
      ];
    });
    const csv = [head.join(';')].concat(rows.map(r=>r.join(';'))).join('\n');
    const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'traccian_sessioni.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------- cloud sync (Supabase, opzionale) ---------- */
  // Tutto qui è opt-in: se cloudCfg è vuoto o la libreria non è disponibile,
  // l'app funziona esattamente come prima, solo con localStorage.
  function initSupabase(){
    if(cloudCfg.url && cloudCfg.key && window.supabase && window.supabase.createClient){
      try{ sb = window.supabase.createClient(cloudCfg.url, cloudCfg.key); }
      catch(e){ sb = null; }
    } else { sb = null; }
  }
  async function restoreCloudSession(){
    if(!sb) return;
    try{
      const { data } = await sb.auth.getSession();
      cloudUser = data && data.session ? data.session.user : null;
    }catch(e){ cloudUser = null; }
    await checkRole();
    if(cloudUser) await claimSession();
  }
  // Un account è "paziente" se esiste una riga in pazienti con id = auth.uid().
  async function checkRole(){
    patientProfile = null; isSuperOperatore = false;
    if(!sb || !cloudUser) return;
    try{
      const { data } = await sb.from('pazienti').select('*').eq('id', cloudUser.id).maybeSingle();
      patientProfile = data || null;
    }catch(e){ patientProfile = null; }
    if(!patientProfile){
      try{
        const { data } = await sb.from('operatori').select('super').eq('id', cloudUser.id).maybeSingle();
        isSuperOperatore = !!(data && data.super);
      }catch(e){ isSuperOperatore = false; } // tabella 'operatori' assente o non ancora migrata: nessun accesso al registro, nessun blocco dell'app
    }
  }
  // ---------- Registro accessi (solo lettura per il super-operatore) ----------
  // Registra eventi discreti (login riuscito/fallito, logout) su 'accessi'.
  // I tentativi falliti avvengono PRIMA di avere una sessione autenticata,
  // quindi la policy di insert su questa tabella è volutamente permissiva
  // (chiunque può scrivere, nessuno tranne il super-operatore può leggere) —
  // stesso principio già in uso nell'app: la sicurezza sta nella RLS in
  // lettura, non nel nascondere la chiave anon.
  // email_tentata resta il testo grezzo digitato al login (per un paziente,
  // È il codice di accesso stesso — la credenziale segreta, non un nome
  // leggibile): serve solo per ricostruire i tentativi FALLITI, dove non
  // esiste altro. etichetta è invece un'informazione leggibile aggiuntiva,
  // valorizzata solo quando disponibile (nickname del paziente dopo un
  // login riuscito) — il registro la preferisce sempre quando c'è, per non
  // mostrare al super-operatore la credenziale del paziente inutilmente.
  async function logAccessEvent(evento, esito, userType, userId, emailTentata, etichetta){
    if(!sb) return;
    try{
      await sb.from('accessi').insert({
        evento, esito, user_type: userType,
        user_id: userId || null,
        email_tentata: emailTentata || null,
        etichetta: etichetta || null
      });
    }catch(e){ /* la tabella 'accessi' potrebbe non essere ancora stata migrata: non bloccare mai login/logout per questo */ }
  }
  async function loadAccessLog(force){
    if(accessLogCache && !force) return accessLogCache;
    if(!sb || !isSuperOperatore) return [];
    try{
      const { data, error } = await sb.from('accessi').select('*').order('ts',{ascending:false}).limit(5000);
      if(error) throw error;
      accessLogCache = data || [];
    }catch(e){ accessLogCache = []; }
    return accessLogCache;
  }
  // Soglia "online adesso": il battito è ogni 25s (startSessionGuard), 90s
  // di margine tollera un giro mancato senza dichiarare offline chi in
  // realtà è ancora lì. Sopra questa soglia: "visto di recente", non più
  // "online" — la sessione non è stata chiusa esplicitamente (browser
  // chiuso di scatto, rete caduta), quindi non sappiamo con certezza se è
  // ancora aperta, solo da quanto non risponde più.
  const ONLINE_THRESHOLD_MS = 90*1000;
  async function loadOnlineSessions(){
    if(!sb || !isSuperOperatore) return {sessions:[], error:null};
    try{
      const { data, error } = await sb.from('sessioni_login').select('*').order('aggiornato_il',{ascending:false});
      if(error) throw error;
      const now = Date.now();
      const sessions = (data||[]).map(r=>{
        const lastMs = r.aggiornato_il ? new Date(r.aggiornato_il).getTime() : null;
        const startMs = r.iniziata_il ? new Date(r.iniziata_il).getTime() : lastMs;
        return {
          userId: r.user_id, userType: r.user_type, etichetta: r.etichetta,
          online: lastMs!=null && (now-lastMs)<=ONLINE_THRESHOLD_MS,
          durataMs: (startMs!=null && lastMs!=null) ? Math.max(0,lastMs-startMs) : null,
          ultimoVistoMs: lastMs
        };
      });
      return {sessions, error:null};
    }catch(e){
      // Non inghiottire l'errore in silenzio: se le colonne iniziata_il /
      // user_type / etichetta o la policy di lettura per il super-operatore
      // non sono ancora state aggiunte a sessioni_login (aggiornamento SQL
      // nel README non ancora eseguito), questa query fallisce SEMPRE — e
      // senza esporre il motivo, il pannello sembra solo "vuoto", non
      // "rotto per un motivo preciso e risolvibile".
      return {sessions:[], error: (e && e.message) || String(e)};
    }
  }
  // ---------- Sessione unica per account (anti-uso concorrente) ----------
  // Meccanismo volutamente semplice: al login viene scritto un "gettone"
  // casuale in una riga per-utente su Supabase, sovrascrivendo quello
  // precedente. Ogni scheda/dispositivo collegato controlla periodicamente
  // se il gettone in database è ancora il proprio: se non lo è più, vuol
  // dire che nel frattempo qualcun altro ha effettuato l'accesso con le
  // stesse credenziali altrove, e questa sessione viene chiusa in automatico.
  // Non richiede infrastruttura aggiuntiva: una sola tabella, nessun server.
  function genSessionToken(){
    try{ if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID(); }catch(e){}
    return 'tok-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
  }
  async function claimSession(){
    if(!sb || !cloudUser) return;
    sessionGuardToken = genSessionToken();
    // user_type/etichetta letti da patientProfile/cloudUser, già valorizzati
    // da checkRole() chiamato subito prima in ogni punto in cui si arriva
    // qui — evita un secondo giro di query solo per etichettare il
    // pannello "chi è online" più tardi.
    const nowIso = new Date().toISOString();
    const userType = patientProfile ? 'paziente' : 'operatore';
    const etichetta = patientProfile ? (patientProfile.codice_paziente||null) : (cloudUser.email||null);
    try{
      await sb.from('sessioni_login').upsert({
        user_id:cloudUser.id, token:sessionGuardToken,
        aggiornato_il:nowIso, iniziata_il:nowIso, user_type:userType, etichetta
      });
    }catch(e){ console.error('claim sessione fallito (tabella sessioni_login assente?)', e); }
    startSessionGuard();
  }
  function startSessionGuard(){
    stopSessionGuard();
    sessionGuardTimer = setInterval(async ()=>{
      if(!sb || !cloudUser || !sessionGuardToken) return;
      try{
        const { data } = await sb.from('sessioni_login').select('token').eq('user_id', cloudUser.id).maybeSingle();
        if(data && data.token && data.token!==sessionGuardToken){
          stopSessionGuard();
          alert('Sei stato disconnesso: risulta un accesso più recente con le stesse credenziali da un altro dispositivo o scheda. Un solo accesso alla volta è consentito per account.');
          await cloudSignOut();
          return;
        }
        // Battito: aggiorna SOLO aggiornato_il (mai iniziata_il, che segna
        // l'inizio di questa sessione) — solo se il gettone è ancora
        // quello attivo, altrimenti non ha senso rinfrescare una sessione
        // già superata (il ramo sopra la chiude comunque). Questo rende
        // aggiornato_il un vero "ultima attività", non solo un timestamp
        // di apertura — necessario per il pannello "chi è online ora".
        await sb.from('sessioni_login').update({aggiornato_il:new Date().toISOString()}).eq('user_id', cloudUser.id).eq('token', sessionGuardToken);
      }catch(e){ /* rete assente: non forzare il logout, riprova al giro successivo */ }
    }, 25000);
  }
  function stopSessionGuard(){
    if(sessionGuardTimer){ clearInterval(sessionGuardTimer); sessionGuardTimer=null; }
    sessionGuardToken = null;
  }
  function cloudStatusLabel(){
    if(!cloudCfg.url || !cloudCfg.key) return 'non configurata';
    if(!sb) return 'configurazione non valida';
    if(!cloudUser) return 'configurata, accesso non effettuato';
    return 'connessa · '+cloudUser.email;
  }

    cloudCfg = {url:url.trim().replace(/\/$/,''), key:key.trim()};
    localStorage.setItem('traccian:cloud:url', cloudCfg.url);

  async function cloudSignUp(email, pw){
