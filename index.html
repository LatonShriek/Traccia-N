  // scarto vicino a n, non a n stesso: aumentano il carico di controllo
  // dell'interferenza senza alzare n — Kane, Conway, Miura & Colflesh,
  // 2007). All'inizio di ogni nuovo valore di n la lure riparte da 0 per
  // non sommare due salti di difficoltà nello stesso passaggio di livello.
  const NBACK_LEVEL_TABLE = {
    1:{n:1, freq:0.38, lure:0},
    2:{n:1, freq:0.30, lure:0.08},
    3:{n:1, freq:0.24, lure:0.15},
    4:{n:1, freq:0.18, lure:0.22},
    5:{n:2, freq:0.34, lure:0},
    6:{n:2, freq:0.28, lure:0.10},
    7:{n:2, freq:0.22, lure:0.18},
    8:{n:2, freq:0.16, lure:0.25},
    9:{n:2, freq:0.12, lure:0.32},
    10:{n:3, freq:0.20, lure:0.20}
  };
  function nbackParamsForLevel(level){ return NBACK_LEVEL_TABLE[level] || NBACK_LEVEL_TABLE[10]; }
  // Scarto (lag) usato per generare i lure: n-1 se possibile (la
  // manipolazione classica in letteratura), altrimenti n+1 quando n=1 (non
  // esiste uno scarto "0 indietro" significativo).
  function nbackLureLag(n){ return n>1 ? n-1 : n+1; }
  // Switching, doppio compito e cancellazione estesi a 10 livelli in questo
  // turno, stessa filosofia delle tabelle già a 10 livelli sopra: risoluzione
  // aggiunta a pavimento e soffitto, non raddoppio uniforme.
  const ADAPT_SWITCH_BALANCE = {1:0.50,2:0.56,3:0.62,4:0.68,5:0.74,6:0.80,7:0.85,8:0.90,9:0.94,10:0.97}; // quanto la regola "dominante" prevale sull'altra — più sbilanciato = più difficile quando tocca passare alla regola rara
  const ADAPT_DUAL_FREQ = {1:0.40,2:0.35,3:0.30,4:0.25,5:0.20,6:0.16,7:0.13,8:0.10,9:0.07,10:0.05}; // frequenza target per canale, indipendente sui due canali del doppio compito
  // Trial lure per canale — stessa logica del lure nell'N-back (foil che
  // corrisponde a uno scarto vicino al target vero, qui 2 indietro invece
  // di 1, dato che ogni canale è un 1-back fisso): aumenta il carico di
  // controllo dell'interferenza senza introdurre un secondo n. Parte da 0
  // ai livelli più bassi per non sommarsi a una frequenza bersaglio già
  // impegnativa a inizio scala.
  const ADAPT_DUAL_LURE = {1:0,2:0.05,3:0.10,4:0.15,5:0.19,6:0.23,7:0.27,8:0.31,9:0.35,10:0.40};
  // Categorizzazione condizionale: 10 livelli come banda-doppia delle 5
  // strutture originarie (confermate da Rodrigo, ordine di complessità
  // relazionale secondo Halford, Wilson & Phillips 1998 — non numero di
  // mappature S-R). Dentro ogni banda la difficoltà cresce con ISI (più
  // stretto = più difficile), tranne nella banda del 1-back sulla
  // categoria (livelli 7-8), dove il secondo parametro è la frequenza di
  // trial lure (stessa categoria di 2 prove fa invece che 1 — stessa
  // logica del lure nell'N-back/Doppio compito).
  //  1 = dimensione singola; 2 = doppia dimensione + no-go;
  //  3 = regola disgiuntiva; 4 = 1-back sulla categoria; 5 = doppia
  //  dimensione mappata direttamente su 4 risposte.
  const CATEG_STRUCTURE_OF_LEVEL = {1:1,2:1,3:2,4:2,5:3,6:3,7:4,8:4,9:5,10:5};
  const CATEG_ISI  = {1:2200,2:1300,3:2200,4:1300,5:2200,6:1300,9:2200,10:1300}; // assente ai livelli 7-8 (banda lure)
  const CATEG_LURE = {7:0, 8:0.30};
  function categStructureOfLevel(level){ return CATEG_STRUCTURE_OF_LEVEL[level] || 1; }
  const DUAL_DOUBLE_TARGET_GRACE_MS = 500; // proroga concessa quando un trial richiede due tocchi e ne è arrivato solo uno alla scadenza
  const ADAPT_GONOGO_COUNT = {1:1,2:1,3:1,4:2,5:2,6:3,7:3,8:4,9:5,10:6}; // quanti elementi no-go attivi (dal set configurato) — di più = più difficile; ai livelli 9-10 richiede un pool di stimoli di almeno 5-6 elementi
  const ADAPT_SWITCH_CSI  = {1:900,2:750,3:600,4:480,5:380,6:300,7:230,8:170,9:120,10:80}; // intervallo cue→stimolo — più corto = più difficile
  const ADAPT_NEGLECT_SIZE = {1:14,2:20,3:26,4:34,5:42,6:50,7:58,8:66,9:75,10:85}; // elementi per tavola — più alto = più difficile; pavimento abbassato e soffitto alzato rispetto alla vecchia scala 1-5
  // Sequenza bersaglio: la lunghezza della sequenza cresce da 2 (pavimento,
  // liv.1-2) a 5 (soffitto, liv.9-10), oltre all'ISI sopra. Applicata solo
  // quando adattivo — in modalità fissa la lunghezza resta quella scelta
  // manualmente dall'operatore in targetSeq.
  const ADAPT_SEQ_LEN = {1:2,2:2,3:3,4:3,5:3,6:3,7:4,8:4,9:5,10:5};
  const ADAPT_NEGLECT_TIME = {1:0,2:0,3:110,4:90,5:70,6:55,7:42,8:32,9:24,10:18}; // secondi per tavola (0=nessun limite) — più basso = più difficile; nessun limite ora anche al livello 2 (pavimento più graduale)

  function nextTrial(){
    session.idx++;
    if(session.idx >= cfg.trials){ finishSession(); return; }
    const isTapat = cfg.taskMode==='ant' && cfg.antMode==='tapat';
    const trial = cfg.taskMode==='nback' ? genNbackTrial()
      : isTapat ? genTapatTrial()
      : cfg.taskMode==='gonogo' ? genGoNoGoTrial()
      : cfg.taskMode==='dualtask' ? genDualTaskTrial()
      : session.seq[session.idx];
    session.responses=new Set(); session.respTime=null; session.showStopCue=false; session.dualGraceUsed=false;
    if(session.stopCueTimer){ clearTimeout(session.stopCueTimer); session.stopCueTimer=null; }
    session.trialStart = performance.now();

    // Task-switching adattivo: fase di solo cue (la regola, senza stimolo)
    // per l'intervallo CSI corrente, poi lo stimolo — è il parametro con
    // il fondamento più solido in letteratura per questo compito specifico.
    if(cfg.taskMode==='switching' && cfg.adaptive){
      session.phase='cue';
      render();
      const csi = ADAPT_SWITCH_CSI[session.adaptLevel] || 400;
      scheduleStep(()=> showTrialStimulus(trial), csi);
      return;
    }
    showTrialStimulus(trial);
  }
  function showTrialStimulus(trial){
    session.phase='show';
    session.trialStart = performance.now(); // il tempo di reazione parte da quando appare lo stimolo, non dal cue
    render();
    presentStimulus(trial);
    if(cfg.taskMode==='stopsignal' && trial.isStopTrial){
      session.stopCueTimer = setTimeout(()=>{
        session.showStopCue=true;
        playTone(STOP_TONE, 220); // segnale uditivo, disaccoppiato dalla modalità dello stimolo go — come nel paradigma originale
        updateTaskScreen();
      }, session.currentSSD);
    }
    scheduleStep(()=>{
      session.phase='wait'; render();
      let isi = trial.isiOverride || cfg.isi;
      if(!trial.isiOverride && cfg.adaptive && cfg.taskMode==='dualtask'){
        // Il doppio compito non ha un unico session.adaptLevel: i due canali
        // sono adattati in modo indipendente (dualLevel1/dualLevel2). L'ISI
        // è condivisa da entrambi i canali (sono presentati insieme), quindi
        // la deriviamo dalla media dei due livelli, arrotondata — coerente
        // con la tabella ADAPT_ISI.dualtask (10 livelli).
        const avgLevel = Math.round(((session.dualLevel1||1)+(session.dualLevel2||1))/2);
        isi = ADAPT_ISI.dualtask[Math.max(1,Math.min(10,avgLevel))] || cfg.isi;
      } else if(!trial.isiOverride && cfg.adaptive && ADAPT_ISI[cfg.taskMode] && !(cfg.taskMode==='ant' && cfg.antMode==='tapat')){
        isi = ADAPT_ISI[cfg.taskMode][session.adaptLevel];
      }
      scheduleStep(()=> maybeResolveWithGrace(trial), Math.max(50,isi-cfg.stimDuration));
    }, cfg.stimDuration);
  }
  // Doppio compito, trial a doppio bersaglio: la finestra di risposta è la
  // stessa di un trial a un solo tocco, ma qui ne servono due — se a scadenza
  // ne è arrivato solo uno, concediamo UNA proroga breve (non ripetibile,
  // session.dualGraceUsed) prima di considerare mancante il secondo canale,
  // invece di penalizzare un ritardo dovuto solo al maggior carico attentivo
  // di dover rispondere a entrambi i canali quasi insieme.
  function maybeResolveWithGrace(trial){
    if(cfg.taskMode==='dualtask' && trial.valid && trial.visualIsTarget && trial.audioIsTarget &&
       session.responses.size===1 && !session.dualGraceUsed){
      session.dualGraceUsed = true;
      scheduleStep(()=> resolveTrial(), DUAL_DOUBLE_TARGET_GRACE_MS);
      return;
    }
    resolveTrial();
  }
  function presentStimulus(trial){
    if(cfg.taskMode==='dualtask'){
      const pairing = cfg.dualPairing || 'vis-aud';
      if(pairing==='vis-aud') playTone(trial.audioVal, cfg.stimDuration);
      else if(pairing==='aud-aud'){ playTone(trial.visualVal, cfg.stimDuration); playTone(trial.audioVal, cfg.stimDuration); }
      // vis-vis: nessun audio, entrambi i canali sono visivi (mostrati in renderStimulusNode)
      return;
    }
    if((cfg.taskMode==='ant' && cfg.antMode!=='tapat') || cfg.taskMode==='switching') return; // solo visivi
    if(cfg.taskMode==='ant' && cfg.antMode==='tapat'){
      if(trial.cueType==='center') playTone(TAPAT_CUE_TONE, 150); // cue acustico, in aggiunta al simbolo visivo già mostrato in renderStimulusNode
      return;
    }
    if(cfg.taskMode==='sequenza' && cfg.sequenzaMista){
      if(trial.val.stimType==='suoni') playTone(trial.val.item, cfg.stimDuration);
      else if(cfg.voice && trial.val.stimType==='lettere') speak(String(trial.val.item));
      return;
    }
    if(cfg.stimType==='suoni'){
      playTone(trial.val, cfg.stimDuration);
    } else if(cfg.voice && ['lettere','numeri','parole'].includes(cfg.stimType)){
      speak(String(trial.val));
    }
  }
  // action: identificatore generico del pulsante toccato ('match'/'nomatch',
  // 'go', 'left'/'right', 'a'/'b', 'vis'/'aud'...). Gli esercizi a singola
  // risposta ignorano tocchi ulteriori dopo il primo; il doppio compito
  // accetta un tocco indipendente per canale.
  function registerTap(action){
    if(!session || session.paused || session.idx<0 || session.idx>=session.seq.length) return;
    if(cfg.respMode==='manuale') return;
    if(session.responses.has(action)) return;
    if(cfg.taskMode!=='dualtask' && session.responses.size>0) return;
    session.responses.add(action);
    if(session.respTime===null) session.respTime = performance.now()-session.trialStart;
  }
  function resolveTrial(){
    const trial = session.seq[session.idx];
    let outcome = null;
    switch(cfg.taskMode){
      case 'gonogo': case 'stopsignal': outcome = resolveSignal(trial); break;
      case 'ant': case 'switching': outcome = resolveChoice(trial); break;
      case 'categorizzazione': outcome = resolveCategorization(trial); break;
      case 'dualtask': outcome = resolveDualTask(trial); break;
      default: outcome = resolveSignal(trial); // nback / sequenza
    }
    if(outcome) session.trail.push({outcome, target: !!trial.isTarget});
    nextTrial();
  }
  // nback, sequenza, gonogo, stopsignal: tutti sono "rispondi sì/no" con un
  // ground truth trial.isTarget — riusano lo stesso schema hit/miss/FA/CR.
  function resolveSignal(trial){
    if(!trial.valid) return null;
    if(trial.isTarget) session.counts.targets++; else session.counts.nonTargets++;
    if(cfg.respMode==='manuale') return 'pend';
    const tapped = session.responses.size>0;
    let outcome, correct;
    if(trial.isTarget && tapped){ session.counts.hits++; outcome='hit'; correct=true; if(session.respTime) session.rts.push(session.respTime); }
    else if(trial.isTarget && !tapped){ session.counts.misses++; outcome='err'; correct=false; }
    else if(!trial.isTarget && tapped){ session.counts.falseAlarms++; outcome='err'; correct=false; }
    else { session.counts.correctRejections++; outcome='hit'; correct=true; }
    session.fatigueLog.push(correct);
    if(cfg.taskMode==='nback' || cfg.taskMode==='sequenza' || cfg.taskMode==='gonogo'){
      session.adaptBlock.push(correct);
      maybeAdapt();
    }
    if(cfg.taskMode==='stopsignal' && !trial.isStopTrial){
      // leva secondaria (ISI generale), alimentata solo dalle prove "go" —
      // il successo sui trial di stop resta gestito a parte dallo staircase SSD
      session.adaptBlock.push(correct);
      maybeAdapt();
    }
    if(cfg.taskMode==='stopsignal' && trial.isStopTrial){
      // staircase: fermarsi con successo → SSD più lungo (più difficile);
      // fallire lo stop → SSD più corto (più facile)
      session.currentSSD = tapped
        ? Math.max(0, session.currentSSD - cfg.ssdStep)
        : Math.min(cfg.isi-100, session.currentSSD + cfg.ssdStep);
      session.ssdHistory.push(session.currentSSD);
    }
    return outcome;
  }
  // ANT / switching: scelta 2AFC, non ha senso hit/FA — traccia solo
  // corretto/scorretto + RT, per poi scomporre per condizione a fine sessione.
  function resolveChoice(trial){
    if(cfg.respMode==='manuale') return 'pend';
    const given = [...session.responses][0] || null;
    const correct = given===trial.correctAnswer;
    session.choiceLog.push({
      correct, rt: correct ? session.respTime : null, omitted: given===null,
      isSwitch: !!trial.isSwitch, cueType: trial.cueType, congruency: trial.congruency, block: trial.block, side: trial.side
    });
    const isTapatSpatial = cfg.taskMode==='ant' && cfg.antMode==='tapat' && cfg.tapatSpatial;
    if(isTapatSpatial){
      session.spatialBlock = session.spatialBlock || [];
      session.spatialBlock.push({side:trial.side, correct});
    }
    if(cfg.taskMode==='ant' || cfg.taskMode==='switching'){
      session.adaptBlock.push(correct);
      const before = session.adaptBlock.length;
      maybeAdapt();
      // il blocco adattivo si è appena valutato e resettato (era arrivato a
      // 8): stesso momento buono per aggiornare il gradiente spaziale.
      if(isTapatSpatial && before>=8 && session.adaptBlock.length===0){
        const sb = session.spatialBlock;
        const left = sb.filter(x=>x.side==='left'), right = sb.filter(x=>x.side==='right');
        const pctLeft = left.length ? left.filter(x=>x.correct).length/left.length : 1;
        const pctRight = right.length ? right.filter(x=>x.correct).length/right.length : 1;
        const base = session.liveTapatGradient;
        let ng = base;
        if(pctLeft < pctRight - 0.15) ng = Math.min(75, base+5); // sinistra più debole -> più prove a sinistra
        else if(pctRight < pctLeft - 0.15) ng = Math.max(25, base-5);
        session.liveTapatGradient = ng;
        session.spatialBlock = [];
      }
    }
    return correct ? 'hit' : 'err';
  }
  // Categorizzazione condizionale: come resolveChoice, ma con un caso in
  // più — trial.correctAnswer può essere 'nogo' (L2: lettera rossa; L4:
  // categoria diversa dalla precedente), nel qual caso la risposta corretta
  // è NON toccare nulla. 'omitted' conta solo le mancate risposte vere
  // (dove serviva un tocco), non i corretti "non rispondere" — altrimenti
  // il conteggio "risposte omesse" nello storico sarebbe fuorviante per
  // questi livelli. Nessun adattamento automatico: il livello 1-5 si sceglie
  // a mano, come per la Cancellazione a regola.
  function resolveCategorization(trial){
    if(!trial.valid) return null;
    if(cfg.respMode==='manuale') return 'pend';
    const given = [...session.responses][0] || null;
    const isNogo = trial.correctAnswer==='nogo';
    const correct = isNogo ? given===null : given===trial.correctAnswer;
    session.choiceLog.push({
      correct, rt: (correct && !isNogo) ? session.respTime : null,
      omitted: given===null && !isNogo
    });
    return correct ? 'hit' : 'err';
  }
  function resolveDualTask(trial){
    if(!trial.valid) return null;
    if(cfg.respMode==='manuale') return 'pend';
    if(trial.visualIsTarget) session.counts.targets++; else session.counts.nonTargets++;
    if(trial.audioIsTarget) session.countsAud.targets++; else session.countsAud.nonTargets++;
    const tapV = session.responses.has('vis'), tapA = session.responses.has('aud');
    let ok = true, ch1Correct, ch2Correct;
    if(trial.visualIsTarget && tapV){ session.counts.hits++; ch1Correct=true; }
    else if(trial.visualIsTarget && !tapV){ session.counts.misses++; ok=false; ch1Correct=false; }
    else if(!trial.visualIsTarget && tapV){ session.counts.falseAlarms++; ok=false; ch1Correct=false; }
    else { session.counts.correctRejections++; ch1Correct=true; }
    if(trial.audioIsTarget && tapA){ session.countsAud.hits++; ch2Correct=true; }
    else if(trial.audioIsTarget && !tapA){ session.countsAud.misses++; ok=false; ch2Correct=false; }
    else if(!trial.audioIsTarget && tapA){ session.countsAud.falseAlarms++; ok=false; ch2Correct=false; }
    else { session.countsAud.correctRejections++; ch2Correct=true; }
    // i due canali sono valutati e adattati in modo indipendente, non con
    // un'unica media che confonderebbe quale dei due sta davvero in difficoltà
    session.adaptBlock1.push(ch1Correct);
    maybeAdaptDualChannel(1);
    session.adaptBlock2.push(ch2Correct);
    maybeAdaptDualChannel(2);
    return ok ? 'hit' : 'err';
  }
  function maybeAdaptDualChannel(channel){
    if(!cfg.adaptive) return;
    const blockKey = channel===1 ? 'adaptBlock1' : 'adaptBlock2';
    const levelKey = channel===1 ? 'dualLevel1' : 'dualLevel2';
    const block = session[blockKey];
    if(block.length < 8) return;
    const acc = block.filter(Boolean).length / block.length;
    if(acc > 0.85 && session[levelKey] < DUAL_LEVEL_MAX){
      session[levelKey]++;
      session.levelChanges.push({trialIdx:session.idx, level:session[levelKey], how:'auto', canale:channel});
    } else if(acc < 0.70 && session[levelKey] > 1){
      session[levelKey]--;
      session.levelChanges.push({trialIdx:session.idx, level:session[levelKey], how:'auto', canale:channel});
    }
    session[blockKey] = [];
  }

  // Restituisce la specifica dei pulsanti di risposta per l'esercizio
  // corrente. null per gli esercizi con etichette che dipendono dal trial
  // (switching), gestiti a parte in updateTaskScreen.
  /* ---- rendering Cancellazione/Neglect ---- */
  function mountNeglectScreen(root){
    const infoSpan = el('div',{class:'info'},['']);
    const pauseBtn = el('button',{onclick:()=>{ session.paused ? resumeTask() : pauseTask(); }},['❚❚ Pausa']);
    const topRight = [pauseBtn];
    if(cfg.adaptive){
      topRight.unshift(
        el('button',{onclick:()=>bumpLevel(-1), style:'padding:8px 11px;'},['–']),
        el('button',{onclick:()=>bumpLevel(1), style:'padding:8px 11px;'},['+'])
      );
    }
    root.appendChild(el('div',{class:'topbar'},[
      infoSpan,
      el('div',{style:'display:flex; gap:8px;'},[
        ...topRight,
        el('button',{onclick:()=>{ if(confirm('Interrompere la sessione in corso?')){ if(session.timer) clearTimeout(session.timer); view=homeView(); render(); } }},['Interrompi'])
      ])
    ]));
    const board = el('div',{class:'neglect-board'},[]);
    root.appendChild(board);
    const resp = el('div',{class:'respond'},[]);
    let doneBtn = null, manualNote = null;
    if(cfg.respMode!=='manuale'){
      doneBtn = el('button',{class:'tapbtn nomatch full', onclick:()=>{ if(session.timer) clearTimeout(session.timer); finishBoard('interrotta dall\'operatore'); }},['Fatto con questa tavola']);
      resp.appendChild(doneBtn);
    } else {
      manualNote = el('div',{style:'color:#fff; font-size:13px; opacity:.8; align-self:center;'},['Modalità manuale: conta a voce/carta i bersagli trovati per lato, poi registra il risultato.']);
      const regBtn = el('button',{class:'tapbtn match full', onclick:()=> manualRegisterBoard()},['Registra risultato tavola']);
      resp.appendChild(manualNote); resp.appendChild(regBtn);
    }
    root.appendChild(resp);
    return {infoSpan, pauseBtn, board};
  }
  function manualRegisterBoard(){
    const tL = session.board.filter(b=>b.side==='left'&&b.isTarget).length;
    const tR = session.board.filter(b=>b.side==='right'&&b.isTarget).length;
    const foundLeft = parseInt(prompt('Bersagli trovati a SINISTRA (su '+tL+'):','0'),10) || 0;
    const foundRight = parseInt(prompt('Bersagli trovati a DESTRA (su '+tR+'):','0'),10) || 0;
    const falseAlarms = parseInt(prompt('Falsi allarmi (elementi sbagliati toccati/segnalati):','0'),10) || 0;
    session.results.push({
      targetsLeft:tL, targetsRight:tR,
      foundLeft:Math.min(foundLeft,tL), foundRight:Math.min(foundRight,tR),
      falseAlarms, timeMs:performance.now()-session.boardStartTime, reason:'manuale'
    });
    session.boardIdx++;
    nextBoard();
  }
  function updateNeglectScreen(){
    const d = taskDom;
    const modeLabel = cfg.neglectMode==='intruso' ? 'trova l\'intruso (l\'unico senza doppione)'
      : cfg.neglectMode==='regola' ? 'conta secondo la regola: '+neglectRuleFor((cfg.stimType==='numeri'?'numeri':'lettere'), cfg.neglectRuleLevel, cfg.neglectRuleClauses).label
      : 'bersagli: '+cfg.targetSeq.map(seqLabel).join(', ');
    d.infoSpan.textContent = 'tavola '+(Math.min(session.boardIdx+1,session.totalBoards))+' / '+session.totalBoards+' · '+
      (cfg.neglectMode==='classico' ? STIM_LABELS[cfg.stimType]+' · ' : '')+modeLabel;
    d.pauseBtn.textContent = session.paused ? '▶ Riprendi' : '❚❚ Pausa';
    d.board.innerHTML='';
    if(session.paused){
      d.board.appendChild(el('div',{class:'blank'},['❚❚ in pausa']));
      return;
    }
    const weakSide = neglectBottomUpWeakSide();
    session.board.forEach(item=>{
      const cueActive = weakSide && item.side===weakSide && !item.found && !item.falseTap;
      const cls = 'neglect-item'+(item.found?' found':'')+(item.falseTap?' falsetap':'')+(cueActive?' cue-pulse':'');
      const isRegolaItem = item.val && typeof item.val==='object' && 'carattere' in item.val;
      // Sfondo giallo applicato via stile inline solo se l'elemento non è
      // già stato trovato/segnato per errore: le classi .found/.falsetap
      // hanno la stessa specificità CSS dello stile inline sul background,
      // quindi uno stile inline sempre presente ne oscurerebbe il feedback
      // visivo dopo il tocco.
      const showSfondoGiallo = isRegolaItem && item.val.sfondo==='giallo' && !item.found && !item.falseTap;
      const style = 'left:'+item.x+'%; top:'+item.y+'%;'
        +(cfg.stimType==='colori' && cfg.neglectMode==='classico' ? ' background:'+item.val.hex+';' : '')
        +(showSfondoGiallo ? ' background:#F2D34A;' : '')
        // "nero" qui è davvero visibile: la tavola ha sfondo chiaro
        // (var(--paper)), a differenza dello schermo di sessione del
        // task-switching che invece è scuro — vedi nota sul bivalente.
        +(isRegolaItem ? ' color:'+(item.val.colore==='rosso'?'#e33b3b':'var(--ink)')+';' : '');
      const content = (cfg.stimType==='colori' && cfg.neglectMode==='classico') ? [] : [isRegolaItem ? item.val.carattere : seqLabel(item.val)];
      const btn = el('div',{class:cls, style, onclick:()=> tapNeglectItem(item)}, content);
      d.board.appendChild(btn);
    });
  }
  /* ---- rendering esercizi sequenziali (n-back, sequenza, gonogo, stopsignal, ant, switching, dualtask) ---- */
  function respondSpec(){
    switch(cfg.taskMode){
      case 'gonogo':
        return [{action:'go', label: cfg.respMode==='operatore' ? 'Il paziente risponde' : 'GO — rispondi', cls:'match', full:true}];
      case 'stopsignal':
        return [{action:'go', label: cfg.respMode==='operatore' ? 'Il paziente risponde' : 'GO — il più veloce possibile', cls:'match', full:true}];
      case 'ant': {
        if(cfg.antMode==='tapat') return [{action:'go', label:'Rilevato — tocca appena lo vedi', cls:'match', full:true}];
        const tokens = ANT_MATERIAL_TOKENS[cfg.antMaterial];
        return tokens
          ? [{action:'left', label:'◀ '+tokens[0], cls:'match'}, {action:'right', label:tokens[1]+' ▶', cls:'nomatch'}]
          : [{action:'left', label:'◀ Sinistra', cls:'match'}, {action:'right', label:'Destra ▶', cls:'nomatch'}];
      }
      case 'switching':
        return [{action:'a', label:'—', cls:'match'}, {action:'b', label:'—', cls:'nomatch'}];
      case 'categorizzazione': {
        const liv = categStructureOfLevel(cfg.categLivello);
        if(liv===1){
          const rs = SWITCH_RULESETS[cfg.categMateriale].ruleA;
          return [{action:'a', label:rs.labelA, cls:'match'}, {action:'b', label:rs.labelB, cls:'nomatch'}];
        }
        if(liv===2) return [{action:'a', label:'A', cls:'match'}, {action:'b', label:'B', cls:'nomatch'}, {action:'c', label:'C', cls:'nomatch'}];
        if(liv===3) return [{action:'a', label:'A', cls:'match'}, {action:'b', label:'B', cls:'nomatch'}];
        if(liv===4) return [{action:'match', label: cfg.respMode==='operatore' ? 'Il paziente indica corrispondenza' : 'Corrispondenza (stessa categoria di prima)', cls:'match', full:true}];
        return [{action:'a', label:'A — lettera nera', cls:'match'}, {action:'l', label:'L — lettera rossa', cls:'nomatch'}, {action:'z', label:'Z — numero nero', cls:'match'}, {action:'m', label:'M — numero rosso', cls:'nomatch'}];
      }
      case 'dualtask': {
        const pairing = cfg.dualPairing || 'vis-aud';
        if(pairing==='vis-vis') return [{action:'vis', label:'Ripetuto a sinistra ('+STIM_LABELS[cfg.dualVisual]+')', cls:'match'}, {action:'aud', label:'Ripetuto a destra ('+STIM_LABELS[cfg.dualVisual2]+')', cls:'nomatch'}];
        if(pairing==='aud-aud') return [{action:'vis', label:'Ripetuto il tono grave', cls:'match'}, {action:'aud', label:'Ripetuto il tono acuto', cls:'nomatch'}];
        return [{action:'vis', label:'Ripetuto '+STIM_LABELS[cfg.dualVisual].toLowerCase(), cls:'match'}, {action:'aud', label:'Ripetuto il suono', cls:'nomatch'}];
      }
      default: { // nback, sequenza — un solo pulsante: l'assenza di tocco
        // è già di per sé la risposta "nessuna corrispondenza" (rifiuto
        // corretto), come nel CPT/n-back standard. Un secondo pulsante
        // "nessuna corrispondenza" non verrebbe distinto dal primo nello
        // scoring (qualunque tocco = "ha risposto") e quindi un tocco
        // esplicito di "no" finirebbe per essere contato come un "sì".
        const isSeq = cfg.taskMode==='sequenza';
        const matchLabel = isSeq
          ? (cfg.respMode==='operatore' ? "Il paziente segnala: sequenza appena avvenuta" : "È appena avvenuta la sequenza")
          : (cfg.respMode==='operatore' ? 'Il paziente indica corrispondenza' : 'Corrispondenza (n='+nbackParamsForLevel(session&&session.liveNLevel?session.liveNLevel:cfg.nLevel).n+')');
        return [{action:'match', label:matchLabel, cls:'match', full:true}];
      }
    }
  }
  function mountTaskScreen(root){
    const infoSpan = el('div',{class:'info'},['']);
    const pauseBtn = el('button',{onclick:()=>{ session.paused ? resumeTask() : pauseTask(); }},['Pausa']);
    const topRight = [pauseBtn];
    if(adaptLevelKey() && cfg.taskMode!=='neglect'){
      topRight.unshift(
        el('button',{onclick:()=>bumpLevel(-1), style:'padding:8px 11px;'},['–']),
        el('button',{onclick:()=>bumpLevel(1), style:'padding:8px 11px;'},['+'])
      );
    }
    if(cfg.taskMode==='dualtask' && cfg.adaptive){
      topRight.unshift(
        el('button',{onclick:()=>bumpDualLevel(1,-1), style:'padding:6px 9px; font-size:11px;'},['C1–']),
        el('button',{onclick:()=>bumpDualLevel(1,1), style:'padding:6px 9px; font-size:11px;'},['C1+']),
        el('button',{onclick:()=>bumpDualLevel(2,-1), style:'padding:6px 9px; font-size:11px;'},['C2–']),
        el('button',{onclick:()=>bumpDualLevel(2,1), style:'padding:6px 9px; font-size:11px;'},['C2+'])
      );
    }
    root.appendChild(el('div',{class:'topbar'},[
      infoSpan,
      el('div',{style:'display:flex; gap:8px;'},[
        ...topRight,
        el('button',{onclick:()=>{ if(confirm('Interrompere la sessione in corso?')){ if(session.timer) clearTimeout(session.timer); if(session.stopCueTimer) clearTimeout(session.stopCueTimer); view=homeView(); render(); } }},['Interrompi'])
      ])
    ]));
    const stage = el('div',{class:'stage'});
    const stimSlot = el('div',{},[]);
    const trail = el('div',{class:'trail'});
    stage.appendChild(stimSlot);
    stage.appendChild(trail);
    root.appendChild(stage);

    const btns = [];
    if(cfg.respMode!=='manuale'){
      const resp = el('div',{class:'respond'});
      respondSpec().forEach(spec=>{
        const b = el('button',{class:'tapbtn '+spec.cls+(spec.full?' full':''), onclick:()=>{ registerTap(spec.action); flashTap(b); }},[spec.label]);
        b.dataset.action = spec.action;
        resp.appendChild(b);
        btns.push(b);
      });
      root.appendChild(resp);
    } else {
      const resp = el('div',{class:'respond'});
      resp.appendChild(el('div',{style:'color:#fff; font-size:13px; opacity:.8; align-self:center;'},['Modalità manuale: la sequenza scorre automaticamente. I risultati si inseriscono al termine.']));
      root.appendChild(resp);
    }
    return {infoSpan, pauseBtn, stimSlot, trail, btns};
  }
  function flashTap(btn){
    if(!btn) return;
    btn.classList.add('tapped');
    setTimeout(()=> btn.classList.remove('tapped'), 180);
  }
  function updateTaskScreen(){
    const d = taskDom;
    const trial = session.idx>=0 && session.idx<session.seq.length ? session.seq[session.idx] : null;
    const genericLevelKey = adaptLevelKey();
    const modeLabel = cfg.taskMode==='sequenza' ? 'sequenza bersaglio'+(cfg.adaptive?' · livello '+session.adaptLevel:'')
      : cfg.taskMode==='nback' ? 'livello '+session.liveNLevel+' · n='+nbackParamsForLevel(session.liveNLevel).n+(cfg.adaptive?' (adattivo)':'')
      : cfg.taskMode==='gonogo' ? 'go/no-go'+(cfg.adaptive?' · livello '+session.adaptLevel:'')
      : cfg.taskMode==='stopsignal' ? 'SSD '+Math.round(session.currentSSD)+'ms'+(cfg.adaptive?' · ritmo livello '+session.adaptLevel:'')
      : (cfg.taskMode==='ant' && cfg.antMode==='tapat' && trial) ? 'TAPAT — blocco '+(trial.block==='tonic'?'tonico':'fasico')+' · livello '+session.tapatLevel+(cfg.adaptive?' (adattivo)':'')
      : (cfg.taskMode==='ant' && cfg.antMode==='classico') ? 'ANT'+(cfg.adaptive?' · livello '+session.adaptLevel:'')
      : (cfg.taskMode==='switching' || cfg.taskMode==='dualtask') && cfg.adaptive ? EXERCISES[cfg.taskMode].label+' · livello '+session.adaptLevel
      : cfg.taskMode==='categorizzazione' ? EXERCISES[cfg.taskMode].label+' · livello '+cfg.categLivello
      : EXERCISES[cfg.taskMode].label;
    d.infoSpan.textContent = 'prova '+(Math.min(session.idx+1,cfg.trials))+' / '+cfg.trials+' · '+modeLabel+
      ((EXERCISES[cfg.taskMode].usesStimType && !(cfg.taskMode==='ant' && cfg.antMode==='classico')) ? ' · '+(cfg.taskMode==='sequenza' && cfg.sequenzaMista ? 'Mista' : STIM_LABELS[cfg.stimType]) : '');
    d.pauseBtn.textContent = session.paused ? '▶ Riprendi' : '❚❚ Pausa';

    // switching: le etichette dei pulsanti dipendono dalla regola del trial corrente
    if(cfg.taskMode==='switching' && trial && d.btns.length===2){
      d.btns[0].textContent = trial.ruleDef.labelA;
      d.btns[1].textContent = trial.ruleDef.labelB;
    }
    if(cfg.taskMode==='nback' && d.btns.length===1 && cfg.respMode!=='operatore'){
      d.btns[0].textContent = 'Corrispondenza (n='+nbackParamsForLevel(session.liveNLevel).n+')';
    }

    d.stimSlot.innerHTML='';
    if(session.paused){
      d.stimSlot.appendChild(el('div',{class:'blank'},['❚❚ in pausa']));
    } else if(session.showStopCue){
      d.stimSlot.appendChild(el('div',{class:'stopcue-full'},['STOP']));
    } else if(trial && session.phase==='cue' && cfg.taskMode==='switching'){
      d.stimSlot.appendChild(el('div',{style:'color:var(--accent); font-size:18px; letter-spacing:.08em; font-weight:700;'},[trial.ruleDef.label.toUpperCase()+'?']));
    } else if(trial && session.phase==='show'){
      d.stimSlot.appendChild(renderStimulusNode(trial));
    } else {
      d.stimSlot.appendChild(el('div',{class:'blank'},['· · ·']));
    }

    d.trail.innerHTML='';
    if(cfg.showTrail){
      session.trail.slice(-16).forEach(t=> d.trail.appendChild(el('div',{class:'chip '+t.outcome})));
    }

    const canRespond = cfg.respMode!=='manuale' && !session.paused &&
      (cfg.taskMode==='dualtask' ? true : session.responses.size===0);
    d.btns.forEach(b=>{
      const already = cfg.taskMode==='dualtask' ? session.responses.has(b.dataset.action) : false;
      b.style.opacity = (canRespond && !already) ? '1' : '.55';
      b.style.pointerEvents = session.paused ? 'none' : 'auto';
    });
  }
  function renderStimulusNode(trial){
    if(cfg.taskMode==='ant' && cfg.antMode==='tapat'){
      const outer = el('div',{style:'display:flex; width:100%; justify-content:'+(trial.side==='left'?'flex-start':trial.side==='right'?'flex-end':'center')+'; padding:0 8vw;'});
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:18px;'});
      if(trial.cueType==='center') wrap.appendChild(el('div',{style:'color:var(--accent); font-size:28px;'},['✦']));
      if(cfg.stimType==='colori'){
        wrap.appendChild(el('div',{class:'colorcircle', style:'width:110px; height:110px; background:'+trial.val.hex+';'},[]));
      } else if(cfg.stimType==='suoni'){
        wrap.appendChild(el('div',{class:'audio-pulse active'},['♪']));
      } else if(cfg.stimType==='simboli'){
        wrap.appendChild(el('div',{class:'stimulus symbolwrap'},[seqLabel(trial.val)]));
      } else {
        wrap.appendChild(el('div',{class:'stimulus'},[seqLabel(trial.val)]));
      }
      outer.appendChild(wrap);
      return outer;
    }
    if(cfg.taskMode==='ant'){
      const target = d=>{
        if(!trial.tokens) return d==='left' ? '◀' : '▶'; // frecce (default)
        return d==='left' ? trial.tokens[0] : trial.tokens[1];
      };
      const neutralGlyph = trial.tokens ? (trial.material==='lettere' ? 'X' : '▲') : '–';
      let flankers;
      if(trial.congruency==='congruent') flankers = target(trial.targetDir);
      else if(trial.congruency==='incongruent') flankers = target(trial.targetDir==='left'?'right':'left');
      else flankers = neutralGlyph;
      const row = flankers+flankers+target(trial.targetDir)+flankers+flankers;
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:18px;'});
      if(trial.cueType!=='none') wrap.appendChild(el('div',{style:'color:'+ (trial.cueType==='spatial'? 'var(--accent)':'rgba(255,255,255,.6)') +'; font-size:28px;'},[trial.cueType==='spatial' ? (trial.side==='left'?'◀':'▶') : '✦']));
      wrap.appendChild(el('div',{class:'stimulus symbolwrap', style: trial.cueType==='spatial' ? ('align-self:'+(trial.side==='left'?'flex-start':'flex-end')) : ''},[row]));
      return wrap;
    }
    if(cfg.taskMode==='switching'){
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:14px;'});
      wrap.appendChild(el('div',{style:'color:var(--accent); font-size:16px; letter-spacing:.08em; font-weight:700;'},[trial.ruleDef.label.toUpperCase()+'?']));
      if(cfg.switchMaterial==='colori'){
        wrap.appendChild(el('div',{class:'colorcircle', style:'width:140px; height:140px; background:'+trial.val.hex+';'},[]));
      } else if(cfg.switchMaterial==='bivalente'){
        wrap.appendChild(el('div',{class:'stimulus', style:'color:'+(trial.val.colore==='rosso'?'#e33b3b':'var(--white)')+' !important;'},[trial.val.valore]));
      } else if(trial.sizeVariant){
        const sizePx = trial.sizeVariant==='grande' ? 'min(28vw,220px)' : 'min(9vw,64px)';
        wrap.appendChild(el('div',{class:'stimulus', style:'font-size:'+sizePx+' !important;'},[seqLabel(trial.val)]));
      } else {
        wrap.appendChild(el('div',{class:'stimulus'},[seqLabel(trial.val)]));
      }
      return wrap;
    }
    if(cfg.taskMode==='categorizzazione'){
      if(trial.categMateriale){ // livelli 1 e 4: singola dimensione, colore o simbolo
        if(cfg.categMateriale==='colori') return el('div',{class:'colorcircle', style:'width:140px; height:140px; background:'+trial.val.hex+';'},[]);
        return el('div',{class:'stimulus symbolwrap'},[trial.val]);
      }
      // livelli 2/3/5: stesso stile del bivalente dello switching — testo
      // bianco o rosso su sfondo scuro, a seconda della dimensione colore.
      return el('div',{class:'stimulus', style:'color:'+(trial.val.colore==='rosso'?'#e33b3b':'var(--white)')+' !important;'},[trial.val.valore]);
    }
    if(cfg.taskMode==='dualtask'){
      const pairing = cfg.dualPairing || 'vis-aud';
      function visualNode(material, val, big){
        if(material==='colori') return el('div',{class:'colorcircle', style:'width:'+(big?'120px':'90px')+'; height:'+(big?'120px':'90px')+'; background:'+val.hex+';'},[]);
        return el('div',{class:'stimulus', style:'font-size:'+(big?'min(20vw,140px)':'min(14vw,90px)')+' !important;'},[seqLabel(val)]);
      }
      if(pairing==='vis-vis'){
        const wrap = el('div',{style:'display:flex; align-items:center; justify-content:center; gap:40px; width:100%;'});
        wrap.appendChild(visualNode(cfg.dualVisual, trial.visualVal, true));
        wrap.appendChild(el('div',{style:'width:2px; height:60px; background:rgba(255,255,255,.2);'},[]));
        wrap.appendChild(visualNode(cfg.dualVisual2, trial.audioVal, true));
        return wrap;
      }
      if(pairing==='aud-aud'){
        const wrap = el('div',{style:'display:flex; align-items:center; justify-content:center; gap:40px;'});
        wrap.appendChild(el('div',{class:'audio-pulse active', style:'width:80px;height:80px;font-size:28px;'},['♪ grave']));
        wrap.appendChild(el('div',{class:'audio-pulse active', style:'width:80px;height:80px;font-size:28px;'},['♪ acuto']));
        return wrap;
      }
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:10px;'});
      wrap.appendChild(visualNode(cfg.dualVisual, trial.visualVal, true));
      wrap.appendChild(el('div',{class:'audio-pulse active', style:'width:64px;height:64px;font-size:24px;'},['♪']));
      return wrap;
    }
    if(cfg.taskMode==='sequenza' && cfg.sequenzaMista){
      return renderTypedStimulus(trial.val.stimType, trial.val.item);
    }
    if(cfg.taskMode==='nback' && cfg.nbackMista){
      return renderTypedStimulus(trial.val.stimType, trial.val.item);
    }
    if(cfg.stimType==='simboli'){
      return el('div',{class:'stimulus symbolwrap'},[trial.val]);
    }
    if(cfg.stimType==='parole'){
      return el('div',{class:'stimulus word'},[trial.val]);
    }
    if(cfg.stimType==='suoni'){
      return el('div',{class:'audio-pulse active'},['♪']);
    }
    if(cfg.stimType==='colori'){
      return el('div',{class:'colorcircle', style:'background:'+trial.val.hex+';'},[]);
    }
    return el('div',{class:'stimulus'},[trial.val]);
  }
  // Renderizza un singolo stimolo tipizzato, a prescindere dall'esercizio
  // corrente — usato dalla Sequenza bersaglio mista, dove ogni elemento
  // porta il proprio tipo invece di condividerne uno solo con cfg.stimType.
  function renderTypedStimulus(stimType, val){
    if(stimType==='simboli') return el('div',{class:'stimulus symbolwrap'},[val]);
    if(stimType==='suoni') return el('div',{class:'audio-pulse active'},['♪']);
    if(stimType==='colori') return el('div',{class:'colorcircle', style:'background:'+val.hex+';'},[]);
    return el('div',{class:'stimulus'},[val]);
  }

  /* ---------- FINISH / RESULTS ---------- */
  /* ---------- Batteria di screening iniziale ---------- */
  // 5 domini, ciascuno con un blocco "base" (stimolo semplice, nessun
  // carico esecutivo) e un blocco "caricato" (versione con carico
  // esecutivo dello stesso dominio). Il dominio "Attenzione divisa"
  // riusa il blocco base del dominio "Attenzione" invece di averne uno
  // proprio — lo stesso principio del "base condiviso" per esercizi che
  // misurano varianti dello stesso substrato attentivo di base.
  // Ogni blocco è breve e a difficoltà FISSA (adaptive:false), non la
  // solita titolazione automatica: qui l'obiettivo non è trovare il
  // livello ideale del paziente, ma un confronto pulito e riproducibile
  // fra "senza carico" e "con carico" allo stesso dominio.
  const SCREENING_TRIALS = 16;
  const SCREENING_BLOCKS = [
    { domain:'attenzione', tipo:'base', domainLabel:'Attenzione sostenuta / inibizione', label:'Attenzione — blocco base',
      patch:()=>({taskMode:'gonogo', stimType:'lettere', targetSeq:[POOLS.lettere[0]], adaptive:false, targetRate:0.48, isi:1600, stimDuration:600, trials:SCREENING_TRIALS}) },
    { domain:'attenzione', tipo:'caricato', domainLabel:'Attenzione sostenuta / inibizione', label:'Attenzione — blocco caricato', suggestTaskMode:'gonogo', suggestLabel:'Go/No-Go',
      patch:()=>({taskMode:'gonogo', stimType:'lettere', targetSeq:POOLS.lettere.slice(0,3), adaptive:false, targetRate:0.22, isi:900, stimDuration:500, trials:SCREENING_TRIALS}) },
    { domain:'memoria', tipo:'base', domainLabel:'Memoria di lavoro', label:'Memoria di lavoro — blocco base',
      patch:()=>({taskMode:'nback', stimType:'lettere', nLevel:1, adaptive:false, targetRate:0.32, isi:2200, stimDuration:700, trials:SCREENING_TRIALS}) },
    { domain:'memoria', tipo:'caricato', domainLabel:'Memoria di lavoro', label:'Memoria di lavoro — blocco caricato', suggestTaskMode:'nback', suggestLabel:'N-back',
      patch:()=>({taskMode:'nback', stimType:'lettere', nLevel:5, adaptive:false, targetRate:0.24, isi:1700, stimDuration:600, trials:SCREENING_TRIALS}) },
    { domain:'flessibilita', tipo:'base', domainLabel:'Flessibilità cognitiva', label:'Flessibilità — blocco base',
      patch:()=>({taskMode:'categorizzazione', categLivello:1, categMateriale:'colori', isi:1800, stimDuration:700, trials:SCREENING_TRIALS}) },
    { domain:'flessibilita', tipo:'caricato', domainLabel:'Flessibilità cognitiva', label:'Flessibilità — blocco caricato', suggestTaskMode:'switching', suggestLabel:'Task-switching',
      patch:()=>({taskMode:'switching', switchMaterial:'numeri', adaptive:false, targetRate:0.35, isi:1400, stimDuration:700, trials:SCREENING_TRIALS}) },
    { domain:'divisa', tipo:'caricato', domainLabel:'Attenzione divisa', label:'Attenzione divisa — blocco caricato', suggestTaskMode:'dualtask', suggestLabel:'Doppio compito', baseFrom:'attenzione',
      patch:()=>({taskMode:'dualtask', dualPairing:'vis-aud', dualVisual:'lettere', adaptive:false, targetRate:0.30, isi:2200, stimDuration:700, trials:SCREENING_TRIALS}) },
    { domain:'esplorazione', tipo:'base', domainLabel:'Esplorazione visuospaziale', label:'Esplorazione — blocco base',
      patch:()=>({taskMode:'neglect', neglectMode:'classico', stimType:'lettere', targetSeq:defaultTargetSeq('lettere',2), neglectBoardSize:20, neglectGradient:50, neglectTimeLimit:0, neglectBottomUp:'off', neglectRuleClauses:null, trials:1}) },
    { domain:'esplorazione', tipo:'caricato', domainLabel:'Esplorazione visuospaziale', label:'Esplorazione — blocco caricato', suggestTaskMode:'neglect', suggestLabel:'Cancellazione a regola',
      patch:()=>({taskMode:'neglect', neglectMode:'regola', neglectRuleLevel:2, stimType:'lettere', neglectBoardSize:40, neglectGradient:50, neglectTimeLimit:0, neglectBottomUp:'off', neglectRuleClauses:null, trials:1}) }
  ];
  const SCREENING_FLAG_THRESHOLD = 0.70; // coerente con la soglia Wilson già in uso per la titolazione adattiva
  function startScreeningSession(){
    screeningState = { blockIdx:0, results:[], respModeBefore: cfg.respMode };
    if(cfg.respMode==='manuale') cfg.respMode = 'paziente'; // l'inserimento manuale differito non è compatibile con la sequenza automatica dei blocchi
    runScreeningBlock(0);
  }
  function runScreeningBlock(idx){
    if(idx>=SCREENING_BLOCKS.length){ finishScreening(); return; }
    const block = SCREENING_BLOCKS[idx];
    Object.assign(cfg, block.patch());
    view='screeningIntro'; render();
  }
  // Punteggio e suggerimenti: per ogni dominio con un blocco caricato,
  // confronta l'accuratezza del caricato con quella del blocco base dello
  // stesso dominio (o del dominio da cui lo eredita, vedi baseFrom). Se il
  // caricato è sotto soglia MA il base è nella norma, l'esercizio di quel
  // dominio viene proposto come consigliato — se anche il base è sotto
  // soglia, il problema sembra più a monte (percettivo/attentivo) che
  // esecutivo specifico, e non si propone il flag.
  function computeScreeningFlags(results){
    const caricatoBlocks = SCREENING_BLOCKS.filter(b=>b.tipo==='caricato');
    return caricatoBlocks.map(b=>{
      const baseDomain = b.baseFrom || b.domain;
      const baseRes = results.find(r=>r.domain===baseDomain && r.tipo==='base');
      const carRes = results.find(r=>r.domain===b.domain && r.tipo==='caricato');
      const baseAcc = baseRes ? baseRes.accuracy : null;
      const carAcc = carRes ? carRes.accuracy : null;
      const flagged = carAcc!=null && baseAcc!=null && carAcc<SCREENING_FLAG_THRESHOLD && baseAcc>=SCREENING_FLAG_THRESHOLD;
      // Configurazione suggerita per il "+ aggiungi al programma": riparte
      // dal blocco caricato dello screening (già tarato per il dominio) ma
      // con un numero di prove normale da allenamento, non le 16 ridotte
      // dello screening — e adattivo attivo, così il livello di partenza si
      // aggiusta da solo nelle prime sessioni invece di restare fisso.
      const suggestedCfg = Object.assign({}, b.patch(), {trials:24, adaptive:true});
      return { domain:b.domain, domainLabel:b.domainLabel, baseAcc, carAcc, flagged, suggestTaskMode:b.suggestTaskMode, suggestLabel:b.suggestLabel, suggestedCfg };
    });
  }
  async function finishScreening(){
    const results = screeningState.results;
    const summary = computeScreeningFlags(results);
    cfg.respMode = screeningState.respModeBefore;
    screeningState.summary = summary;
    await persistScreeningFlags(summary.filter(s=>s.flagged), summary);
    view='screeningResults'; render();
  }
  // Salva i flag "consigliato" sul profilo del paziente attivo (locale o
  // remoto, oppure — se è il paziente stesso a fare lo screening da remoto —
  // sul proprio profilo). Mai sul dispositivo/operatore in generale: lo
  // screening senza un paziente selezionato resta solo un'analisi non
  // salvata.
  // Se un flag per lo stesso esercizio esiste già ed è stato disattivato
  // a mano in precedenza, resta disattivato: un nuovo screening non lo
  // riaccende da solo, la disattivazione manuale ha sempre la precedenza.
  function mergeScreeningFlags(existing, fresh){
    const out = (existing||[]).slice();
    fresh.forEach(f=>{
      const i = out.findIndex(x=>x.taskMode===f.suggestTaskMode);
      const rec = {taskMode:f.suggestTaskMode, label:f.suggestLabel, domainLabel:f.domainLabel, motivo:'screening: '+Math.round(f.carAcc*100)+'% con carico vs '+Math.round(f.baseAcc*100)+'% base', cfg:f.suggestedCfg, aggiornatoIl:Date.now()};
      if(i===-1){ out.push(Object.assign({attivo:true}, rec)); }
      else { out[i] = Object.assign({}, out[i], rec); } // preserva 'attivo' esistente (rispetta l'eventuale disattivazione manuale)
    });
    return out;
  }
  // Costruisce una voce di programma da un flag di screening (o da
  // qualunque oggetto con {suggestTaskMode/taskMode, suggestLabel/label,
  // suggestedCfg/cfg}) — usata sia dall'autorizzazione automatica del gate
  // sia dal pulsante "+ Aggiungi al programma" per la modulazione manuale.
  function programEntryFromFlag(f){
    const cfgOut = f.suggestedCfg || f.cfg;
    const label = f.suggestLabel || f.label;
    return { nome: label, cfg: cfgOut, fonte:'screening' };
  }
  // Nome leggibile generato automaticamente da una configurazione, per le
  // voci di programma aggiunte da Setup mentre si costruisce il programma
  // di un paziente — evita di dover scegliere un nome a mano per ognuna.
  function autoNameFor(c){
    const exl = EXERCISES[c.taskMode] ? EXERCISES[c.taskMode].label : c.taskMode;
    const stimPart = (EXERCISES[c.taskMode] && EXERCISES[c.taskMode].usesStimType) ? STIM_LABELS[c.stimType]+' — ' : '';
    const levelPart = c.taskMode==='nback' ? ' livello '+c.nLevel : c.taskMode==='categorizzazione' ? ' livello '+c.categLivello : '';
    return stimPart+exl+levelPart;
  }
  // Aggiunge una voce al programma di un paziente (locale o remoto),
  // preservando quello che c'era già — usata sia dal flusso "Aggiungi
  // esercizio" in Setup sia da qualunque altro punto che debba appendere
  // una voce senza passare dalle checkbox di "Gestisci programma".
  async function appendProgramEntry(kind, id, entry){
    if(kind==='local'){
      try{
        const raw = localStorage.getItem('traccian:localpatient:'+id);
        if(!raw) return false;
        const pp = JSON.parse(raw);
        pp.programma = (pp.programma||[]).concat([entry]);
        localStorage.setItem('traccian:localpatient:'+id, JSON.stringify(pp));
        syncLocalPatientToCloud(pp);
        if(editingPatient && editingPatient.id===id) editingPatient.programma = pp.programma;
        return true;
      }catch(e){ return false; }
    }
    if(!sb || !cloudUser) return false;
    try{
      const existing = (cachedRemotePatients||[]).find(x=>x.id===id) || (editingPatient&&editingPatient.id===id ? editingPatient : null);
      const programmaAttuale = patientProgram(existing) || [];
      const nuovoProgramma = programmaAttuale.concat([entry]);
      const { error } = await sb.from('pazienti').update({programma_assegnato:nuovoProgramma}).eq('id', id).eq('operatore_id', cloudUser.id);
      if(error) throw error;
      if(editingPatient && editingPatient.id===id) editingPatient.programma_assegnato = nuovoProgramma;
      cachedRemotePatients = null;
      return true;
    }catch(e){ alert('Errore: '+e.message); return false; }
  }
  // `flagged`: solo i domini sotto soglia (per i flag/programma).
  // `fullSummary`: TUTTI i domini testati, flaggati o no (per il quadro
  // completo mostrato in "Gestisci programma" — solo l'ultimo screening è
  // conservato, non uno storico di tutti quelli fatti).
  async function persistScreeningFlags(flagged, fullSummary){
    const risultati = fullSummary ? { ts: Date.now(), summary: fullSummary } : null;
    if(patientProfile){
      // Il paziente sta facendo lo screening da solo, da remoto.
      try{
        const merged = mergeScreeningFlags(patientProfile.screening_flags, flagged);
        const patch = { screening_flags: merged };
        if(risultati) patch.screening_risultati = risultati;
        const isFirstGateCompletion = patientProfile.modalita_accesso==='screening_poi_suggeriti' && !patientProfile.screening_completato_il;
        if(isFirstGateCompletion){
          // Autorizzazione automatica una tantum: i domini flaggati in
          // QUESTO screening entrano direttamente nel programma assegnato,
          // così il paziente li vede da subito — l'operatore può comunque
          // aggiungerne/toglierne a mano in qualsiasi momento dopo.
          const nuoveVoci = flagged.map(programEntryFromFlag);
          const programmaEsistente = patientProfile.programma_assegnato || [];
          patch.programma_assegnato = programmaEsistente.concat(nuoveVoci);
          patch.screening_completato_il = new Date().toISOString();
        }
        const { error } = await sb.from('pazienti').update(patch).eq('id', cloudUser.id);
        if(error) throw error;
        Object.assign(patientProfile, patch);
      }catch(e){ console.error('salvataggio flag screening fallito', e); }
      return;
    }
    if(!patientProfile && activeLocalPatientId){
      try{
        const raw = localStorage.getItem('traccian:localpatient:'+activeLocalPatientId);
        if(!raw) return;
        const p = JSON.parse(raw);
        if(flagged.length) p.screeningFlags = mergeScreeningFlags(p.screeningFlags, flagged);
        if(risultati) p.screeningRisultati = risultati;
        localStorage.setItem('traccian:localpatient:'+activeLocalPatientId, JSON.stringify(p));
        syncLocalPatientToCloud(p);
      }catch(e){}
    } else if(!patientProfile && activeRemotePatientId && sb && cloudUser){
      try{
        const existing = (cachedRemotePatients||[]).find(x=>x.id===activeRemotePatientId);
        const patch = {};
        if(flagged.length) patch.screening_flags = mergeScreeningFlags(existing && existing.screening_flags, flagged);

  /* ---- Motore Strategie di memoria: fase di studio (testo o lista

  // Maschera progressiva per il vanishing cues: rivela le prime N lettere
  // (proporzionali a revealFraction), sostituisce il resto con "_" —
  // mantenendo gli spazi. Il cue "svanisce" da uno stadio forte a uno debole.
  function maskWord(str, revealFraction){
    const revealCount = Math.max(1, Math.ceil(str.length*revealFraction));
    return str.split('').map((ch,i)=> ch===' ' ? ' ' : (i<revealCount ? ch : '_')).join('');
  }
  // Spaced retrieval (errorless learning): parametri del protocollo.
  // Intervallo iniziale breve, raddoppia ad ogni richiamo riuscito; un
  // elemento si considera consolidato dopo un numero di successi consecutivi
  // o al superamento di un intervallo massimo — soglie provvisorie, non
  // normative, pensate per stare dentro una seduta clinica.
  const ERRORLESS_START_INTERVAL = 5;
  const ERRORLESS_MAX_CONSECUTIVE = 4;
  const ERRORLESS_MAX_INTERVAL = 60;
  function startMemoriaSession(){
    const material = memoriaMaterialFor(cfg);
    session = {
      material, phase:'studio', pqrstStep:0, pqrstSection:0, recall:{}, startedAtWall:Date.now(),
      lociIdx:0, lociReadDone:false, vanishingIdx:0, vanishingStage:0,
      errIdx:0, errStage:'study', errInterval:ERRORLESS_START_INTERVAL, errLastGood:ERRORLESS_START_INTERVAL,
      errConsecutive:0, errRemaining:0, errTimer:null
    };
    view='task'; render();
  }
  function clearErrorlessTimer(){

  function mountMemoriaScreen(root){
    const infoSpan = el('div',{class:'info'},['']);
    root.appendChild(el('div',{class:'topbar'},[
      infoSpan,
      el('button',{onclick:()=>{ if(confirm('Interrompere la sessione in corso?')){ clearErrorlessTimer(); view=homeView(); render(); } }},['Interrompi'])
    ]));
    const content = el('div',{style:'padding:16px; max-width:640px; margin:0 auto; width:100%;'},[]);
    root.appendChild(content);
    return {infoSpan, content};
  }
  const MEMORIA_MODO_LABELS = {pqrst:'PQRST', chunking:'chunking', loci:'metodo dei loci', errorless:'errorless learning', vanishing:'vanishing cues'};
  const CHUNKING_METODI_LABELS = {categoria:'Categorizzazione semantica', acronimo:'Acronimo/acrostico', narrazione:'Narrazione/concatenamento', immagine:'Immagine associativa', personale:'Personale (nota libera)'};
  // Un box di suggerimento per metodo attivo — generico per i metodi
  // generativi (acronimo/narrazione/immagine): non c'è contenuto scriptato
  // da mostrare, solo l'istruzione della tecnica, applicata insieme
  // dall'operatore e dal paziente sulla lista mostrata sopra.
  function chunkingStratBox(metodo, m, cfg){
    if(metodo==='categoria'){
      if(m.gruppi) return {titolo:'Suggerimento — più gruppi da ricordare', testo:'Le parole sono già divise in '+m.gruppi.length+' gruppi ('+m.gruppi.map(g=>g.categoria).join(', ')+'): ricorda un gruppo alla volta, non '+m.parole.length+' parole slegate.'};
      if(m.categorizzata) return {titolo:'Suggerimento — chunking per categoria', testo:'Queste parole appartengono tutte alla categoria "'+m.categoria+'": raggruppale mentalmente in un unico blocco invece di ricordarle una per una — ricorda "un gruppo di '+m.categoria+'", non '+m.parole.length+' parole slegate.'};
      return {titolo:'Suggerimento — costruisci tu il raggruppamento', testo:'Queste parole non condividono una categoria ovvia: prova a creare tu piccoli gruppi (2-3 parole) legandole con un\'immagine mentale o una breve storia che le colleghi, invece di ripeterle in ordine.'};
    }
    if(metodo==='acronimo') return {titolo:'Suggerimento — acronimo/acrostico', testo:'Le iniziali sono evidenziate qui sopra: costruite insieme una parola o una breve frase che le usi tutte, in ordine, come aggancio per richiamare l\'intera lista.'};
    if(metodo==='narrazione') return {titolo:'Suggerimento — narrazione/concatenamento', testo:'Costruite insieme una breve storia che colleghi le parole in sequenza, una che porta alla successiva — più è vivida o assurda, meglio si ricorda.'};
    if(metodo==='immagine') return {titolo:'Suggerimento — immagine associativa', testo:'Per ogni parola (o per coppie consecutive), crea un\'immagine mentale vivida che la colleghi alla successiva — nessun percorso fisso, solo l\'associazione tra le immagini.'};
    if(metodo==='personale') return {titolo:'Tecnica personale', testo: cfg.chunkingNota && cfg.chunkingNota.trim() ? cfg.chunkingNota : '(nessuna nota inserita dall\'operatore per questo paziente)'};
    return null;
  }

  // quando il metodo 'acronimo' è tra quelli attivi, per rendere visibili
  // le iniziali su cui costruire l'acronimo/acrostico.
  function wordsWithInitialsHighlighted(parole){
    return el('div',{},parole.map((w,i)=>{

    }));

        const steps = ['preview','question','read','state'];

        content.appendChild(el('div',{style:'font-size:26px; font-weight:700; letter-spacing:.06em; text-align:center; padding:24px; background:var(--paper-dim); border-radius:12px; font-family:monospace;'},[maskWord(item, fraction)]));

        const reveal = el('div',{style:'font-weight:600; min-height:22px; text-align:center; margin-top:6px;'},['']);
        content.appendChild(reveal);
        const rowbtns = el('div',{class:'rowbtns'});
        rowbtns.appendChild(el('button',{class:'ghost', onclick:()=>{ reveal.textContent = 'Risposta: '+item; }},['Mostra la risposta']));

        content.appendChild(el('button',{class:'primary', style:'margin-top:18px;', onclick:()=>{
          if(stage===0){ session.vanishingStage=1; }

        }},[stage===0 ? 'Avanti — suggerimento più debole →' : (isLastItem ? 'Pronto — passa al richiamo →' : 'Avanti — prossimo elemento →')]));
      }
    } else {
      infoSpan.textContent = 'Livello '+m.livello+' · '+MEMORIA_MODO_LABELS[modo]+' · richiamo (segna l\'operatore)';
      content.appendChild(el('p',{class:'hint'},['Il paziente richiama a voce quello che ricorda. Spunta qui sotto ciò che ha effettivamente recuperato — non deve usare le stesse parole esatte, basta il concetto.']));
      const items = learnItems.map((w,i)=>({id:String(i), label:w}));
      items.forEach(it=>{

          el('div',{},[it.label]),
          el('div',{style:'color:'+(checked?'var(--signal)':'var(--ink-soft)')+'; font-weight:600;'},[checked?'✓ recuperato':'○ non recuperato'])
        ]);
        content.appendChild(row);
      });
      content.appendChild(el('button',{class:'primary', style:'margin-top:18px;', onclick:()=> finishMemoriaSession()},['Termina e salva']));
    }
  }
  function finishMemoriaSession(){
    completeAndSave(Date.now()-session.startedAtWall);
  }
  // ---------- Indicatore di calo prestazionale intra-sessione (fatica) ----------
  // Puramente informativo per l'operatore: confronta l'accuratezza sul primo
  // terzo delle prove valide con quella sull'ultimo terzo. NON modifica in
  // alcun modo la difficoltà né chiude la sessione in automatico — è solo un
  // avviso in coda ai risultati. La soglia sotto è un parametro provvisorio
  // (non derivato da letteratura come le soglie Wilson et al. 2019 usate per
  // l'adattività): va validata/tarata nell'uso clinico reale, non è definitiva.
  const FATIGUE_DROP_THRESHOLD = 0.15; // 15 punti percentuali di calo accuratezza primo→ultimo terzo
  const FATIGUE_MIN_TRIALS = 9; // sotto questa soglia lo split in terzi non è abbastanza informativo
  function computeFatigueNote(boolArray){
    const n = boolArray.length;
    if(n < FATIGUE_MIN_TRIALS) return null;
    const third = Math.floor(n/3);
    const first = boolArray.slice(0, third);
    const last = boolArray.slice(n-third);
    const accFirst = first.filter(Boolean).length/first.length;
    const accLast = last.filter(Boolean).length/last.length;
    const drop = accFirst - accLast;
    return {accFirst, accLast, drop, flag: drop >= FATIGUE_DROP_THRESHOLD};
  }
  function rtMeanOf(items){
    const v = items.filter(x=>x!=null);
    return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
  }
  async function completeAndSave(durationMs){
    const family = EXERCISES[cfg.taskMode].family;
    const rec = {
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      ts: Date.now(), dateLabel: todayStr(),
      stimType: cfg.stimType, nLevel: cfg.nLevel, trials: cfg.trials, isi: cfg.isi, stimDuration: cfg.stimDuration,
      respMode: cfg.respMode, patientCode: cfg.patientCode, notes: cfg.notes,
      taskMode: cfg.taskMode, targetSeq: EXERCISES[cfg.taskMode].usesTargetSeq ? cfg.targetSeq.map(seqLabel) : null,
      sequenzaMista: (cfg.taskMode==='sequenza') ? !!cfg.sequenzaMista : null,
      antMode: cfg.taskMode==='ant' ? cfg.antMode : null,
      localPatientId: patientProfile ? null : (activeLocalPatientId || null),
      pazienteId: (!patientProfile && activeRemotePatientId) ? activeRemotePatientId : null,
      durationMs, family
    };
    if(family==='signal'){
      const avgRT = rtMeanOf(session.rts);
      rec.counts = session.counts; rec.metrics = scoreFromCounts(session.counts); rec.avgRT = avgRT;
      rec.fatigueNote = computeFatigueNote(session.fatigueLog);
      if(cfg.taskMode==='stopsignal' && session.ssdHistory.length){
        const meanSSD = rtMeanOf(session.ssdHistory);
        rec.meanSSD = meanSSD;
        rec.ssrt = (avgRT!=null && meanSSD!=null) ? Math.max(0, avgRT-meanSSD) : null;
      }
      if(cfg.taskMode==='nback'){
        rec.finalNLevel = session.liveNLevel;
        rec.adaptive = cfg.adaptive;
        rec.levelChanges = session.levelChanges.length ? session.levelChanges : null;
      }
    } else if(family==='choice'){
      const log = session.choiceLog;
      const total = log.length, correct = log.filter(x=>x.correct).length, omitted = log.filter(x=>x.omitted).length;
      rec.choice = { total, correct, omitted, accuracy: total? correct/total : null, meanRT: rtMeanOf(log.map(x=>x.rt)) };
      rec.fatigueNote = computeFatigueNote(log.map(x=> x.correct && !x.omitted));
      if(cfg.taskMode==='ant'){
        const rtBy = (key,val)=> rtMeanOf(log.filter(x=>x[key]===val && x.correct).map(x=>x.rt));
        const noneRT=rtBy('cueType','none'), centerRT=rtBy('cueType','center'), spatialRT=rtBy('cueType','spatial');
        const congRT=rtBy('congruency','congruent'), incongRT=rtBy('congruency','incongruent');
        rec.choice.alerting = (noneRT!=null && centerRT!=null) ? Math.round(noneRT-centerRT) : null;
        rec.choice.orienting = (centerRT!=null && spatialRT!=null) ? Math.round(centerRT-spatialRT) : null;
        rec.choice.conflict = (congRT!=null && incongRT!=null) ? Math.round(incongRT-congRT) : null;
        if(cfg.antMode==='tapat'){
          const tonicTrials = log.filter(x=>x.block==='tonic');
          const phasicTrials = log.filter(x=>x.block==='phasic');
          rec.choice.tonicMeanRT = rtMeanOf(tonicTrials.filter(x=>x.correct).map(x=>x.rt));
          rec.choice.tonicOmissions = tonicTrials.filter(x=>x.omitted).length;
          rec.choice.tonicTotal = tonicTrials.length;
          rec.choice.phasicMeanRT = rtMeanOf(phasicTrials.filter(x=>x.correct).map(x=>x.rt));
          rec.choice.finalTapatLevel = session.tapatLevel;
          rec.choice.adaptive = cfg.adaptive;
        }
      }
      if(cfg.taskMode==='switching'){
        const swRT = rtMeanOf(log.filter(x=>x.isSwitch && x.correct).map(x=>x.rt));
        const repRT = rtMeanOf(log.filter(x=>!x.isSwitch && x.correct).map(x=>x.rt));
        rec.choice.switchCost = (swRT!=null && repRT!=null) ? Math.round(swRT-repRT) : null;
        if(cfg.switchMaterial==='bivalente'){
          const congRT = rtMeanOf(log.filter(x=>x.congruency==='congruent' && x.correct).map(x=>x.rt));
          const incongRT = rtMeanOf(log.filter(x=>x.congruency==='incongruent' && x.correct).map(x=>x.rt));
          rec.choice.conflict = (congRT!=null && incongRT!=null) ? Math.round(incongRT-congRT) : null;
        }
      }
    } else if(family==='dual'){
      rec.counts = session.counts; rec.metrics = scoreFromCounts(session.counts);
      rec.countsAud = session.countsAud; rec.metricsAud = scoreFromCounts(session.countsAud);
      rec.dualPairing = cfg.dualPairing || 'vis-aud';
    } else if(family==='spatial'){
      const r = session.results;
      const sum = k=> r.reduce((a,b)=>a+b[k],0);
      const tL=sum('targetsLeft'), tR=sum('targetsRight'), fL=sum('foundLeft'), fR=sum('foundRight'), fa=sum('falseAlarms');
      rec.neglect = {
        boards:r.length, targetsLeft:tL, targetsRight:tR, foundLeft:fL, foundRight:fR,
        omittedLeft:tL-fL, omittedRight:tR-fR,
        pctLeft: tL? fL/tL : null, pctRight: tR? fR/tR : null,
        falseAlarms:fa, meanTimeMs: rtMeanOf(r.map(x=>x.timeMs)),
        asymmetry: (tL && tR) ? Math.round(((fL/tL)-(fR/tR))*100) : null // negativo = più omissioni a sinistra
      };
    } else if(family==='goaltask'){
      const score = scoreGoalTask(session);
      rec.goaltask = {
        scenario: cfg.goaltaskScenario, scenarioLabel: session.scenario.label, livello: cfg.goaltaskLivello,
        completatiCount: score.completatiCount, totaleElementi: score.totaleElementi,
        percentualeCompletamento: score.percentualeCompletamento,
        violazioniCount: score.violazioniCount, tempoImpiegatoSec: score.tempoImpiegatoSec,
        budgetRispettato: score.budgetRispettato, budgetSecondi: session.scenario.budgetSecondi || null,
        sogliaErroriTollerati: score.sogliaErroriTollerati, erroriEntroSoglia: score.erroriEntroSoglia,
        violazioni: session.violazioni
      };
    } else if(family==='memoria'){
      const m = session.material;
      const materiale = memoriaEffectiveMateriale(cfg);
      const totale = memoriaLearnItems(cfg, m).length;
      const recuperati = Object.values(session.recall).filter(Boolean).length;
      rec.memoria = {
        modo: cfg.memoriaModo, materiale, livello: m.livello,
        titolo: materiale==='brano' ? m.titolo : null,
        recuperati, totale, percentuale: totale ? Math.round((recuperati/totale)*100) : 0,
        dettaglioRichiamo: session.recall,
        chunkingMetodi: cfg.memoriaModo==='chunking' ? cfg.chunkingMetodi : undefined,
        chunkingNota: (cfg.memoriaModo==='chunking' && cfg.chunkingMetodi.includes('personale')) ? cfg.chunkingNota : undefined,
        // forma parallela usata (solo dove esistono forme multiple per il
        // livello) — tracciata per poter distinguere in retrospettiva se
        // due sessioni allo stesso livello hanno usato lo stesso materiale
        // (rischio di apprendimento/esposizione) o forme diverse (RCI pulito)
        formaIdx: (m.nForme>1) ? m.formaIdx : undefined,
        formaLettera: (m.nForme>1) ? (['A','B','C','D','E','F','G','H','I','J'][m.formaIdx]||null) : undefined,
        nForme: m.nForme>1 ? m.nForme : undefined
      };
    }
    lastResult = rec;
    if(screeningState){
      const block = SCREENING_BLOCKS[screeningState.blockIdx];
      rec.screening = {domain:block.domain, tipo:block.tipo, label:block.label};
      rec.notes = (rec.notes ? rec.notes+' ' : '')+'[Screening — '+block.label+']';
      await saveSession(rec);
      screeningState.results.push({domain:block.domain, tipo:block.tipo, accuracy: primaryAccuracyOf(rec)});
      screeningState.blockIdx++;
      runScreeningBlock(screeningState.blockIdx);
      return;
    }
    await saveSession(rec);
    // continuità: ricorda l'ultima configurazione usata per questo profilo,
    // così la prossima volta che lo si riprende parte da qui, non dai default
    // riporta il livello raggiunto nella config, così "Ripeti" e la
    // continuità del profilo partono davvero da dove ci si era fermati
    if(cfg.taskMode==='nback') cfg.nLevel = session.liveNLevel;
    else if(cfg.taskMode==='ant' && cfg.antMode==='tapat') cfg.tapatStartLevel = session.tapatLevel;
    else if(cfg.taskMode==='neglect') cfg.neglectStartLevel = session.liveBoardLevel;
    else if(adaptLevelKey()==='adaptLevel') cfg.adaptStartLevel = session.adaptLevel;
    if(cfg.taskMode==='dualtask'){ cfg.dualStartLevel1 = session.dualLevel1; cfg.dualStartLevel2 = session.dualLevel2; }
    const snap = presetCfgOf(cfg);
    const lastAcc = primaryAccuracyOf(rec);
    if(lastAcc!=null) snap.lastAccuracy = lastAcc;
    if(!patientProfile && activeLocalPatientId){ updateLocalPatientConfig(activeLocalPatientId, snap); }
    else if(patientProfile){ saveRemotePatientConfig(patientProfile.id, snap); }
    if(patientProfile) cachedTodayUsage = null; // forza il ricalcolo del limite giornaliero
    else if(!patientProfile && activeRemotePatientId){ saveRemotePatientConfig(activeRemotePatientId, snap); }
    view='results'; render();
  }

    // Tono deliberatamente neutro e adulto: nessun aggettivo di merito, nessun
    // confronto con sessioni precedenti, nessuna esclamazione — un dato di
    // fatto (durata) più, se esiste un obiettivo di tempo impostato per questo

    if(patientProfile){

        : (subLabel+exLabel+' · '+r.trials+' prove · '+(r.patientCode? 'paziente '+r.patientCode+' · ':'')+r.dateLabel)

      mg.appendChild(metric(r.choice.correct+' / '+r.choice.total, 'Risposte corrette'));
      mg.appendChild(metric(fmtPct(r.choice.accuracy), 'Accuratezza'));
      mg.appendChild(metric(String(r.choice.omitted), 'Omesse'));
      if(r.choice.meanRT!=null) mg.appendChild(metric(Math.round(r.choice.meanRT)+' ms', 'RT medio (corrette)'));
      if(r.choice.alerting!=null) mg.appendChild(metric(r.choice.alerting+' ms', 'Indice allerta'));
      if(r.choice.orienting!=null) mg.appendChild(metric(r.choice.orienting+' ms', 'Indice orienting'));
      if(r.choice.conflict!=null) mg.appendChild(metric(r.choice.conflict+' ms', 'Indice conflitto'));
      if(r.choice.tonicMeanRT!=null) mg.appendChild(metric(Math.round(r.choice.tonicMeanRT)+' ms', 'RT medio — blocco tonico'));
      if(r.choice.tonicTotal!=null) mg.appendChild(metric(r.choice.tonicOmissions+' / '+r.choice.tonicTotal, 'Omissioni — blocco tonico'));
      if(r.choice.phasicMeanRT!=null) mg.appendChild(metric(Math.round(r.choice.phasicMeanRT)+' ms', 'RT medio — blocco fasico'));
      if(r.choice.adaptive && r.choice.finalTapatLevel!=null) mg.appendChild(metric('livello '+r.choice.finalTapatLevel, 'Difficoltà finale (adattiva)'));
      if(r.choice.switchCost!=null) mg.appendChild(metric(r.choice.switchCost+' ms', 'Switch cost'));
    } else if(r.family==='dual'){
      const [lab1,lab2] = dualChannelLabels(r.dualPairing);
      mg.appendChild(metric(fmtPct(r.metrics.acc), 'Accuratezza canale '+lab1));
      mg.appendChild(metric(fmtPct(r.metricsAud.acc), 'Accuratezza canale '+lab2));
      mg.appendChild(metric(r.metrics.dprime!=null? r.metrics.dprime.toFixed(2):'—', "d′ "+lab1));
      mg.appendChild(metric(r.metricsAud.dprime!=null? r.metricsAud.dprime.toFixed(2):'—', "d′ "+lab2));
    } else if(r.family==='spatial'){
      const ng = r.neglect;
      mg.appendChild(metric(fmtPct(ng.pctLeft), 'Trovati a sinistra'));
      mg.appendChild(metric(fmtPct(ng.pctRight), 'Trovati a destra'));
      mg.appendChild(metric(ng.omittedLeft+' / '+ng.omittedRight, 'Omessi (sin. / des.)'));
      if(ng.asymmetry!=null) mg.appendChild(metric((ng.asymmetry>0?'+':'')+ng.asymmetry+' pt', 'Asimmetria (– = più omissioni a sin.)'));
      mg.appendChild(metric(String(ng.falseAlarms), 'Falsi allarmi'));
      if(ng.meanTimeMs!=null) mg.appendChild(metric(fmtTime(ng.meanTimeMs), 'Tempo medio/tavola'));
    } else if(r.family==='goaltask'){
      const g = r.goaltask;
      mg.appendChild(metric(g.completatiCount+' / '+g.totaleElementi, 'Elementi completati'));
      mg.appendChild(metric(g.percentualeCompletamento+'%', 'Completamento'));
      mg.appendChild(metric(String(g.violazioniCount), 'Violazioni di regola'));
      // Esito complessivo: un completamento al 100% non deve leggersi come
      // "prova perfetta" se ci sono state violazioni di regola — qui lo
      // rende esplicito invece di lasciare che le due percentuali vengano
      // lette separatamente e la seconda passi inosservata.
      // Esito complessivo: un completamento al 100% non deve leggersi come
      // "prova perfetta" se ci sono state violazioni di regola — qui lo
      // rende esplicito invece di lasciare che le due percentuali vengano
      // lette separatamente e la seconda passi inosservata. Se lo scenario
      // ha una soglia di errori tollerati (livello 3 di alcuni scenari),
      // superarla marca l'esito come "Fallito" indipendentemente dal
      // completamento — coerente col Six Elements reale, dove infrangere
      // troppe regole invalida la prova anche se tutti i compiti sono stati
      // tentati.
      const sogliaSuperata = g.sogliaErroriTollerati!=null && !g.erroriEntroSoglia;
      const esitoTxt = sogliaSuperata
        ? 'Fallito — violazioni oltre la soglia tollerata ('+g.violazioniCount+'/'+g.sogliaErroriTollerati+')'
        : g.violazioniCount>0
        ? (g.percentualeCompletamento===100 ? 'Completato, con violazioni' : 'Incompleto, con violazioni')
        : (g.percentualeCompletamento===100 ? 'Completato senza violazioni' : 'Incompleto, nessuna violazione');
      mg.appendChild(metric(esitoTxt, 'Esito'));
      if(g.budgetSecondi) mg.appendChild(metric(g.budgetRispettato?'Sì':'No', 'Budget di tempo rispettato'));
      mg.appendChild(metric(fmtTime(g.tempoImpiegatoSec*1000), 'Tempo impiegato'));
    } else if(r.family==='memoria'){
      const m = r.memoria;
      const unitLabel = (m.materiale||(m.modo==='chunking'?'lista':'brano'))==='lista' ? 'Parole recuperate' : 'Idee recuperate';
      mg.appendChild(metric(m.recuperati+' / '+m.totale, unitLabel));
      mg.appendChild(metric(m.percentuale+'%', 'Richiamo'));
      mg.appendChild(metric('Livello '+m.livello, 'Difficoltà materiale'));
      mg.appendChild(metric(MEMORIA_MODO_LABELS[m.modo]||m.modo, 'Tecnica'));
    } else { // signal
      mg.appendChild(metric(r.counts.hits+' / '+(r.counts.hits+r.counts.misses), 'Hit / target'));
      mg.appendChild(metric(String(r.counts.falseAlarms), 'Falsi allarmi'));
      mg.appendChild(metric(fmtPct(r.metrics.acc), 'Accuratezza'));
      mg.appendChild(metric(r.metrics.dprime!=null? r.metrics.dprime.toFixed(2):'—', "d′"));
      if(r.avgRT!=null) mg.appendChild(metric(Math.round(r.avgRT)+' ms', 'RT medio (hit)'));
      if(r.ssrt!=null) mg.appendChild(metric(Math.round(r.ssrt)+' ms', 'SSRT (stima)'));
      if(r.taskMode==='nback' && r.finalNLevel!=null && r.finalNLevel!==r.nLevel){
        mg.appendChild(metric(r.nLevel+' → '+r.finalNLevel, 'Livello (iniziale → finale)'));
      }
    }
    mg.appendChild(metric(fmtTime(r.durationMs), 'Durata'));
    card.appendChild(mg);

    // Avviso di calo prestazionale intra-sessione — solo informativo, non
    // cambia la difficoltà né chiude nulla: segnala che l'accuratezza è
    // scesa sensibilmente dal primo all'ultimo terzo delle prove, un
    // pattern compatibile con affaticamento (ma anche con altro — la
    // lettura resta all'operatore). Assente per goaltask/memoria/spatial,
    // dove "un terzo delle prove" non ha lo stesso significato.
    if(r.fatigueNote && r.fatigueNote.flag){
      card.appendChild(el('div',{class:'card', style:'margin-top:12px; background:var(--paper-dim); border-color:var(--alert);'},[
        el('p',{class:'hint', style:'color:var(--ink); margin:0;'},[
          '⚠ Accuratezza in calo nel corso della prova: dal '+fmtPct(r.fatigueNote.accFirst)+' (primo terzo) al '
          +fmtPct(r.fatigueNote.accLast)+' (ultimo terzo). Può indicare affaticamento — valuta se accorciare la '
          +'prossima seduta o inserire una pausa a metà.'
        ])
      ]));
    }

    const rowbtns = el('div',{class:'rowbtns'});
    rowbtns.appendChild(el('button',{class:'primary', onclick:()=>{ view='instructions'; render(); }},['↻ Ripeti (stesso esercizio)']));
    rowbtns.appendChild(el('button',{class:'ghost', onclick:()=>{ view=homeView(); render(); }},['Cambia esercizio']));
    rowbtns.appendChild(el('button',{class:'ghost', onclick:()=>{ view='history'; render(); }},['Storico']));
    card.appendChild(rowbtns);

    s.appendChild(card); root.appendChild(s);
  }
