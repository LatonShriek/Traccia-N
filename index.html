  /* ---------- PROGRAMMA PAZIENTE (assegna più esercizi) ---------- */
  function ScreenPatientProgram(root){
    root.appendChild(el('div',{class:'brand'},[el('div',{class:'mark'},['Traccia',el('span',{},['N'])])]));
    const s = el('div',{class:'screen'});
    const card = el('div',{class:'card'});
    if(!editingPatient){
      card.appendChild(el('p',{class:'hint'},['Nessun paziente selezionato.']));
      card.appendChild(el('button',{class:'ghost', onclick:()=>{ view='patients'; render(); }},['← Torna ai pazienti']));
      s.appendChild(card); root.appendChild(s); return;
    }
    const isLocal = editingPatientKind==='local';
    const displayName = isLocal ? editingPatient.nome : editingPatient.codice_paziente;
    const risultati = isLocal ? editingPatient.screeningRisultati : editingPatient.screening_risultati;
    const backTop = el('button',{class:'link', style:'margin-bottom:10px; padding:0;', onclick:()=>{ editingPatient=null; view= isLocal ? 'localPatientPicker' : 'patients'; render(); }},[isLocal ? '← Torna ai pazienti in presenza' : '← Torna ai pazienti']);
    card.appendChild(backTop);
    card.appendChild(el('h2',{},['Programma di '+displayName]));
    card.appendChild(el('p',{class:'hint'},[
      isLocal
        ? 'Aggiungi esercizi uno alla volta, ciascuno con le sue impostazioni — quando selezioni questo paziente in presenza li trovi come scorciatoia di avvio rapido, non è un vincolo.'
        : 'Aggiungi esercizi uno alla volta, ciascuno con le sue impostazioni. Il paziente vedrà l\'elenco e potrà avviare quello che vuole a ogni accesso — non serve un ordine fisso.'
    ]));
    // Screening e controllo motorio in cima, non in fondo alla scheda —
    // sono le due valutazioni che un operatore cerca per prime aprendo un
    // paziente, prima ancora di guardare il programma assegnato.
    card.appendChild(el('div',{style:'display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;'},[
      el('button',{class:'primary', style:'padding:10px 16px; font-size:13.5px; width:auto;', onclick:()=>{
        if(isLocal){ activeLocalPatientId=editingPatient.id; activeRemotePatientId=null; cfg.patientCode=editingPatient.nome; }
        else { activeRemotePatientId=editingPatient.id; activeLocalPatientId=null; cfg.patientCode=editingPatient.codice_paziente; }
        startScreeningSession();
      }},[risultati ? 'Rifai lo screening' : 'Fai lo screening ora']),
      el('button',{class:'ghost', style:'padding:10px 16px; font-size:13.5px;', onclick:()=>{
        if(isLocal){ activeLocalPatientId=editingPatient.id; activeRemotePatientId=null; cfg.patientCode=editingPatient.nome; }
        else { activeRemotePatientId=editingPatient.id; activeLocalPatientId=null; cfg.patientCode=editingPatient.codice_paziente; }
        view='motorIntro'; render();
      }},['Controllo motorio di base'])
    ]));

    // Elenco del programma attuale, con rimozione riga per riga (persiste
    // subito, non serve un pulsante "salva" separato) — sostituisce il
    // vecchio flusso a checkbox che rimpiazzava l'intero programma in blocco
    // (rischiava di perdere le voci aggiunte da Setup nel frattempo).
    const programmaAttuale = patientProgram(editingPatient);
    card.appendChild(el('label',{style:'display:block;'},['Programma attuale ('+programmaAttuale.length+(programmaAttuale.length===1?' esercizio':' esercizi')+')']));
    if(!programmaAttuale.length){
      card.appendChild(el('p',{class:'hint'},['Ancora nessun esercizio assegnato.']));
    } else {
      programmaAttuale.forEach((entry,idx)=>{
        const exLabel = EXERCISES[entry.cfg.taskMode] ? EXERCISES[entry.cfg.taskMode].label : entry.cfg.taskMode;
        const isFromScreening = entry.fonte==='screening';
        const origLevel = (isFromScreening && entry.suggerito) ? levelOfCfg(entry.suggerito.cfg) : null;
        const curLevel = levelOfCfg(entry.cfg);
        const levelChanged = origLevel!=null && curLevel!=null && String(origLevel)!==String(curLevel);
        // "▶ Avvia" usa configForExercise (l'ultima cfg davvero raggiunta in
        // sessione) quando esiste, non la cfg della voce — la modalità
        // mostrata/modificabile qui deve riflettere quella, non la voce
        // "storica" salvata quando l'esercizio fu assegnato.
        const effectiveCfg = configForExercise(editingPatient, entry.cfg.taskMode) || entry.cfg;
        const row = el('div',{style:'padding:10px 4px; border-bottom:1px solid var(--line);'},[
          el('div',{style:'display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;'},[
            el('div',{},[
              el('div',{},[entry.nome].concat(isFromScreening ? [el('span',{style:'display:inline-block; margin-left:8px; background:var(--paper-dim); color:var(--ink-soft); border-radius:999px; padding:2px 9px; font-size:11px; font-weight:600; vertical-align:middle;', title:'Aggiunto automaticamente in base ai risultati dello screening — modificabile come qualunque altra voce.'},['⭐ da screening'])] : [])),
              el('div',{class:'l'},[exLabel])
            ]),
            el('div',{style:'display:flex; gap:8px; flex-wrap:wrap;'},[
              el('button',{class:'primary', style:'padding:8px 14px; font-size:13px; width:auto;', onclick:()=>{
                // Riprende l'esercizio al livello adattivo corrente (stesso
                // configForExercise usato per il paziente remoto autonomo),
                // saltando Setup — non è "modificare il programma", è avviare
                // subito una seduta con quello che c'è già.
                buildingProgramFor = null; editingProgramEntryIndex = null;
                const own = configForExercise(editingPatient, entry.cfg.taskMode);
                loadPreset({cfg: own || entry.cfg});
                if(isLocal){ activeLocalPatientId=editingPatient.id; activeRemotePatientId=null; cfg.patientCode=editingPatient.nome; }
                else { activeRemotePatientId=editingPatient.id; activeLocalPatientId=null; cfg.patientCode=editingPatient.codice_paziente; }
                view='instructions'; render();
              }},['▶ Avvia']),
              el('button',{class:'ghost', style:'padding:8px 14px; font-size:13px;', onclick:()=>{
                buildingProgramFor = {kind: isLocal?'local':'remote', id:editingPatient.id, nome:displayName};
                editingProgramEntryIndex = idx;
                loadPreset({cfg: entry.cfg});
                view='setup'; render();
              }},['Modifica']),
              el('button',{class:'ghost', style:'padding:8px 14px; font-size:13px;', onclick: async ()=>{
                const rimasti = programmaAttuale.slice(0,idx).concat(programmaAttuale.slice(idx+1));
                if(isLocal){
                  try{
                    const raw = localStorage.getItem('traccian:localpatient:'+editingPatient.id);
                    if(!raw) return;
                    const pp = JSON.parse(raw);
                    pp.programma = rimasti;
                    localStorage.setItem('traccian:localpatient:'+editingPatient.id, JSON.stringify(pp));
                    syncLocalPatientToCloud(pp);
                    editingPatient.programma = rimasti;
                    render();
                  }catch(e){}
                } else {
                  try{
                    const { error } = await sb.from('pazienti').update({programma_assegnato:rimasti}).eq('id', editingPatient.id).eq('operatore_id', cloudUser.id);
                    if(error) throw error;
                    editingPatient.programma_assegnato = rimasti;
                    cachedRemotePatients = null;
                    render();
                  }catch(e){ alert('Errore: '+e.message); }
                }
              }},['✕ Rimuovi'])
            ])
          ]),
          levelChanged ? el('div',{style:'font-size:12px; color:var(--ink-soft); margin-top:4px;'},['Suggerito dallo screening: livello '+origLevel+' — oggi: livello '+curLevel]) : null,
          (TITRATION_EXERCISES.includes(entry.cfg.taskMode) && !(entry.cfg.taskMode==='ant' && entry.cfg.antMode==='tapat')) || TITRATION_MODE_EXTRA.includes(entry.cfg.taskMode) || (entry.cfg.taskMode==='ant' && entry.cfg.antMode==='tapat') ? el('div',{style:'margin-top:6px;'},[
            el('div',{style:'display:flex; align-items:center; gap:6px; flex-wrap:wrap;'},[
              el('span',{style:'font-size:12px; color:var(--ink-soft);'},['Modalità:']),
              ...['manuale','livello','adattivo'].map(m=>{
                const active = (effectiveCfg.titrationMode||'manuale')===m;
                return el('button',{
                  style:'padding:4px 10px; font-size:12px; border-radius:999px; border:1px solid var(--line); cursor:pointer; font-family:Inter;'
                    +(active ? ' background:var(--accent); color:#fff; border-color:var(--accent);' : ' background:none; color:var(--ink-soft);'),
                  onclick: async ()=>{
                    if(active) return;
                    // "▶ Avvia" preferisce configForExercise (l'ultima
                    // configurazione DAVVERO raggiunta in sessione) alla cfg
                    // della voce di programma, se esiste — quindi il cambio
                    // di modalità deve aggiornare entrambe, altrimenti
                    // sembrerebbe applicato ma "▶ Avvia" continuerebbe a
                    // usare la vecchia modalità salvata nello snapshot.
                    const newCfg = Object.assign({}, effectiveCfg, {titrationMode:m, adaptive: m==='adattivo'});
                    await saveExerciseLevel(isLocal?'local':'remote', editingPatient.id, entry.cfg.taskMode, newCfg);
                    const ok = await replaceProgramEntry(isLocal?'local':'remote', editingPatient.id, idx, {cfg: Object.assign({}, entry.cfg, {titrationMode:m, adaptive: m==='adattivo'})});
                    if(ok) render();
                  }
                },[{manuale:'Manuale', livello:'Livello', adattivo:'Adattivo'}[m]]);
              })
            ]),
            el('div',{style:'font-size:11.5px; color:var(--ink-soft); margin-top:3px;'},[
              entry.cfg.taskMode==='neglect' ? neglectTitrationModeHint(effectiveCfg, effectiveCfg.titrationMode||'manuale')
                : entry.cfg.taskMode==='dualtask' ? dualTitrationModeHint(effectiveCfg, effectiveCfg.titrationMode||'manuale')
                : entry.cfg.taskMode==='categorizzazione' ? categTitrationModeHint(effectiveCfg, effectiveCfg.titrationMode||'manuale')
                : (entry.cfg.taskMode==='ant' && entry.cfg.antMode==='tapat') ? tapatTitrationModeHint(effectiveCfg, effectiveCfg.titrationMode||'manuale')
                : titrationModeHint(effectiveCfg, effectiveCfg.titrationMode||'manuale')
            ])
          ]) : null,
          el('div',{style:'display:flex; align-items:center; gap:8px; margin-top:6px;'},[
            el('span',{style:'font-size:12px; color:var(--ink-soft);'},[
              entry.tempoConsigliato ? 'Tempo consigliato: '+entry.tempoConsigliato.minuti+' min/'+(entry.tempoConsigliato.periodo==='giorno'?'giorno':'totale') : 'Nessun tempo consigliato impostato'
            ]),
            el('button',{style:'background:none; border:none; color:var(--signal); text-decoration:underline; font-size:12px; cursor:pointer; font-family:Inter;', onclick: async ()=>{
              const minStr = prompt('Minuti consigliati per questo esercizio (lascia vuoto per rimuovere):', entry.tempoConsigliato ? entry.tempoConsigliato.minuti : '');
              if(minStr===null) return;
              if(minStr.trim()===''){
                const ok = await replaceProgramEntry(isLocal?'local':'remote', editingPatient.id, idx, {tempoConsigliato:null});
                if(ok) render();
                return;
              }
              const minuti = parseInt(minStr,10);
              if(!minuti || minuti<1){ alert('Inserisci un numero di minuti valido.'); return; }
              const periodoScelta = prompt('1) al giorno\n2) totale (una tantum)', '1');
              if(periodoScelta===null) return;
              const periodo = periodoScelta.trim()==='2' ? 'totale' : 'giorno';
              const ok = await replaceProgramEntry(isLocal?'local':'remote', editingPatient.id, idx, {tempoConsigliato:{minuti, periodo}});
              if(ok) render();
            }},[entry.tempoConsigliato ? 'Modifica' : 'Imposta tempo'])
          ])
        ].filter(Boolean));
        card.appendChild(row);
      });
    }

    // Libreria preset salvati su questo dispositivo, non ancora nel
    // programma di questo paziente — un tocco per aggiungerli.
    const presets = listPresets();
    const already = new Set(programmaAttuale.map(x=>x.nome));
    const disponibili = presets.filter(p=>!already.has(p.name));
    if(disponibili.length){
      card.appendChild(el('label',{style:'display:block; margin-top:18px;'},['Aggiungi dalla libreria preset']));
      disponibili.forEach(p=>{
        const exLabel = EXERCISES[p.cfg.taskMode] ? EXERCISES[p.cfg.taskMode].label : p.cfg.taskMode;
        card.appendChild(el('div',{class:'histrow'},[
          el('div',{},[el('div',{},[p.name]), el('div',{class:'l'},[exLabel])]),
          el('button',{class:'ghost', onclick: async ()=>{
            const ok = await appendProgramEntry(isLocal?'local':'remote', editingPatient.id, {nome:p.name, cfg:p.cfg});
            if(ok) render();
          }},['+ Aggiungi'])
        ]));
      });
    }

    card.appendChild(el('button',{class:'primary', style:'margin-top:16px;', onclick:()=>{
      buildingProgramFor = {kind: isLocal?'local':'remote', id:editingPatient.id, nome:displayName};
      applyLevelBaselineOrSuggestion(cfg.taskMode);
      view='setup'; render();
    }},['+ Aggiungi esercizio personalizzato →']));
    card.appendChild(el('p',{class:'hint'},['Configuralo come vuoi in Setup — livello, materiale, parametri — e aggiungilo direttamente al programma, senza doverlo nominare a mano. Puoi aggiungerne più di uno di seguito prima di tornare qui.']));

    // ---- Risultati screening: quadro completo (tutti i domini testati),
    // non solo i suggerimenti — con azione di modulazione manuale accanto
    // a ciascun suggerimento attivo, stessa leva usata dall'autorizzazione
    // automatica del gate.
    const flagsRaw = (isLocal ? editingPatient.screeningFlags : editingPatient.screening_flags) || [];
    card.appendChild(el('label',{style:'display:block; margin-top:24px;'},['Risultati screening']));
    if(!risultati){
      card.appendChild(el('p',{class:'hint'},['Nessuno screening ancora fatto per questo paziente.']));
    } else {
      card.appendChild(el('p',{class:'hint'},['Ultimo screening: '+new Date(risultati.ts).toLocaleString('it-IT')+'. Confronto base/caricato per dominio — i domini evidenziati sono risultati sotto soglia con base nella norma.']));
      risultati.summary.forEach(row=>{
        const bp = row.baseAcc!=null ? Math.round(row.baseAcc*100)+'%' : '—';
        const cp = row.carAcc!=null ? Math.round(row.carAcc*100)+'%' : '—';
        const wrap = el('div',{style:'padding:8px 4px; border-bottom:1px solid var(--line);'+(row.flagged?' background:var(--paper-dim);':'')});
        wrap.appendChild(el('div',{style:'font-weight:600; font-size:14px;'},[row.domainLabel+(row.flagged?' — consigliato: '+row.suggestLabel:'')]));
        wrap.appendChild(el('div',{style:'font-size:12.5px; color:var(--ink-soft);'},['base '+bp+' · caricato '+cp]));
        card.appendChild(wrap);
      });
    }
    const activeFlags = flagsRaw.filter(f=>f.attivo);
    if(activeFlags.length){
      const flagsWrap = el('div',{style:'padding:10px 4px; display:flex; flex-wrap:wrap; gap:6px;'});
      activeFlags.forEach(f=>{
        flagsWrap.appendChild(el('span',{style:'background:var(--paper-dim); border-radius:999px; padding:3px 10px; display:inline-flex; align-items:center; gap:6px;'},[
          '⭐ '+f.label,
          el('button',{style:'border:none; background:none; cursor:pointer; color:var(--signal); padding:0; font-size:12px; font-weight:600;', title:'Aggiungi al programma assegnato', onclick: async ()=>{
            if(!f.cfg){ alert('Questo suggerimento è di una versione precedente e non ha una configurazione salvata — rilancia lo screening per rigenerarlo.'); return; }
            const nuovaVoce = programEntryFromFlag(f);
            if(isLocal){
              try{
                const raw = localStorage.getItem('traccian:localpatient:'+editingPatient.id);
                if(!raw) return;
                const pp = JSON.parse(raw);
                pp.programma = (pp.programma||[]).concat([nuovaVoce]);
                (pp.screeningFlags||[]).forEach(x=>{ if(x.taskMode===f.taskMode) x.attivo=false; });
                localStorage.setItem('traccian:localpatient:'+editingPatient.id, JSON.stringify(pp));
                syncLocalPatientToCloud(pp);
                editingPatient.programma = pp.programma; editingPatient.screeningFlags = pp.screeningFlags;
                render();
              }catch(e){}
            } else {
              const programmaAttuale = patientProgram(editingPatient);
              const ok = await assignProgramToPatient(editingPatient.id, programmaAttuale.concat([nuovaVoce]));
              if(ok){
                const merged = (editingPatient.screening_flags||[]).map(x=> x.taskMode===f.taskMode ? Object.assign({}, x, {attivo:false}) : x);
                try{ await sb.from('pazienti').update({screening_flags:merged}).eq('id', editingPatient.id).eq('operatore_id', cloudUser.id); }catch(e){}
                editingPatient.programma_assegnato = programmaAttuale.concat([nuovaVoce]);
                editingPatient.screening_flags = merged;
                cachedRemotePatients = null;
                render();
              }
            }
          }},['+ Aggiungi']),
          el('button',{style:'border:none; background:none; cursor:pointer; color:var(--ink-soft); padding:0; font-size:12px;', title:'Rimuovi suggerimento', onclick: async ()=>{
            if(isLocal){
              try{
                const raw = localStorage.getItem('traccian:localpatient:'+editingPatient.id);
                if(!raw) return;
                const pp = JSON.parse(raw);
                (pp.screeningFlags||[]).forEach(x=>{ if(x.taskMode===f.taskMode) x.attivo=false; });
                localStorage.setItem('traccian:localpatient:'+editingPatient.id, JSON.stringify(pp));
                syncLocalPatientToCloud(pp);
                editingPatient.screeningFlags = pp.screeningFlags;
                render();
              }catch(e){}
            } else {
              const merged = (editingPatient.screening_flags||[]).map(x=> x.taskMode===f.taskMode ? Object.assign({}, x, {attivo:false}) : x);
              try{
                await sb.from('pazienti').update({screening_flags:merged}).eq('id', editingPatient.id).eq('operatore_id', cloudUser.id);
                editingPatient.screening_flags = merged;
                cachedRemotePatients = null;
                render();
              }catch(e){ alert('Errore: '+e.message); }
            }
          }},['✕'])
        ]));
      });
      card.appendChild(flagsWrap);
    }
    // Screening e controllo motorio: pulsanti spostati in cima alla
    // scheda (subito dopo l'intro), non più qui in fondo.

    // Obiettivi: sezione comune a pazienti in presenza e remoti (stessa
    // struttura dati, normalizeGoals/saveGoalsForPatient astraggono dove
    // viene persistita). Mostrati come barre di avanzamento anche al
    // paziente in presenza, a fine seduta (vedi ScreenResults) — per
    // questo la sezione sta PRIMA del ritorno anticipato dei pazienti
    // locali qui sotto, non dopo come in precedenza.
    card.appendChild(el('label',{style:'display:block; margin-top:24px;'},['Obiettivi (mostrati anche al paziente come barre di avanzamento — facoltativi: si può procedere anche senza. Se ne può impostare più di uno, anche di tipo diverso.']));
    const currentGoals = normalizeGoals(editingPatient.obiettivo);
    if(!currentGoals.length){
      card.appendChild(el('p',{class:'hint'},['Nessun obiettivo impostato — il paziente si allena normalmente, senza barre.']));
    } else {
      currentGoals.forEach((g,i)=>{
        const label = g.tipo==='tempo'
          ? 'Tempo di allenamento: '+g.minutiTarget+' minuti '+(g.periodo==='settimana'?'a settimana':'in totale')
          : 'Livello '+g.livelloTarget+' su '+(EXERCISES[g.taskMode]?EXERCISES[g.taskMode].label:g.taskMode);
        const ucFallback = isLocal ? editingPatient.lastConfig : editingPatient.ultima_config;
        const progress = g.tipo==='tempo' ? computeTimeGoalProgressOperator(g, isLocal, editingPatient.id) : computeLevelGoalProgress(g, configForExercise(editingPatient, g.taskMode) || ucFallback);
        const rowWrap = el('div',{style:'padding:10px 4px; border-bottom:1px solid var(--line);'});
        rowWrap.appendChild(el('div',{class:'histrow', style:'border:none; padding:0; margin-bottom:8px; flex-wrap:wrap; gap:8px;'},[
          el('div',{style:'flex:1 1 200px; min-width:0;'},[label]),
          el('button',{class:'ghost', onclick: async ()=>{
            const nextGoals = currentGoals.slice(); nextGoals.splice(i,1);
            if(await saveGoalsForPatient(isLocal, editingPatient, nextGoals)) render();
          }},['Rimuovi'])
        ]));
        const pct = Math.max(0, Math.min(100, (progress&&progress.percentuale)||0));
        const barOuter = el('div',{style:'background:var(--paper-dim); border-radius:999px; height:14px; overflow:hidden;'});
        barOuter.appendChild(el('div',{style:'background:var(--signal); height:100%; width:'+pct+'%;'},[]));
        rowWrap.appendChild(barOuter);
        rowWrap.appendChild(el('div',{style:'font-size:12px; color:var(--ink-soft); margin-top:4px;'},[pct+'% — '+(progress&&progress.etichetta||'')]));
        card.appendChild(rowWrap);
      });
    }
    card.appendChild(el('button',{class:'ghost', onclick: async ()=>{
      const tipoScelta = prompt('Tipo di obiettivo:\n1) Livello su un esercizio\n2) Tempo di allenamento (minuti)', '1');
      if(tipoScelta===null) return;
      let nuovoGoal;
      if(tipoScelta.trim()==='2'){
        const periodoScelta = prompt('Periodo:\n1) Settimanale (ultimi 7 giorni)\n2) Totale (da sempre)', '1');
        if(periodoScelta===null) return;
        const minuti = parseInt(prompt('Minuti target:','60'),10);
        if(isNaN(minuti) || minuti<1){ alert('Valore non valido.'); return; }
        nuovoGoal = {tipo:'tempo', periodo: periodoScelta.trim()==='2'?'totale':'settimana', minutiTarget:minuti, id: Date.now()+'-'+Math.random().toString(36).slice(2,6)};
      } else {
        const keys = Object.keys(EXERCISES);
        const opts = keys.map((k,i)=> (i+1)+') '+EXERCISES[k].label).join('\n');
        const scelta = prompt('Su quale esercizio impostare l\'obiettivo? Scrivi il numero:\n'+opts);
        const idx = parseInt(scelta,10)-1;
        if(isNaN(idx) || !keys[idx]) return;
        const taskMode = keys[idx];
        const tetto = MAX_LEVEL_BY_TASKMODE[taskMode] || 10;
        const livello = parseInt(prompt('Livello obiettivo (1-'+tetto+'):', String(Math.min(4,tetto))),10);
        if(isNaN(livello) || livello<1 || livello>tetto) { alert('Livello non valido: inserisci un numero fra 1 e '+tetto+'.'); return; }
        nuovoGoal = {tipo:'livello', taskMode, livelloTarget:livello, id: Date.now()+'-'+Math.random().toString(36).slice(2,6)};
      }
      const nextGoals = currentGoals.concat([nuovoGoal]);
      if(await saveGoalsForPatient(isLocal, editingPatient, nextGoals)) render();
    }},['+ Aggiungi obiettivo']));

    if(isLocal){
      const nav = el('div',{class:'navlinks'});
      nav.appendChild(el('button',{class:'link', onclick:()=>{ editingPatient=null; view='localPatientPicker'; render(); }},['← Torna ai pazienti in presenza']));
      card.appendChild(nav);
      s.appendChild(card); root.appendChild(s); return;
    }

    card.appendChild(el('label',{style:'display:block; margin-top:24px;'},['Modalità di accesso remoto']));
    card.appendChild(el('p',{class:'hint'},['"Diretto": il paziente vede subito il programma assegnato sopra. "Solo screening all\'inizio": al primo accesso vede solo una breve valutazione iniziale; al termine, i domini risultati deboli vengono aggiunti automaticamente al programma (resti comunque libero di modificarlo a mano, anche prima o dopo). Il gate scatta una sola volta.']));
    card.appendChild(segButtons(['diretto','screening_poi_suggeriti'], editingPatient.modalita_accesso||'diretto', async v=>{
      try{
        const { error } = await sb.from('pazienti').update({modalita_accesso:v}).eq('id', editingPatient.id).eq('operatore_id', cloudUser.id);
        if(error) throw error;
        editingPatient.modalita_accesso = v;
        cachedRemotePatients = null;
        render();
      }catch(e){ alert('Errore: '+e.message); }
    }, {diretto:'Diretto', screening_poi_suggeriti:'Solo screening all\'inizio'}));
    if(editingPatient.modalita_accesso==='screening_poi_suggeriti'){
      card.appendChild(el('p',{class:'hint'},[editingPatient.screening_completato_il ? 'Gate già superato il '+new Date(editingPatient.screening_completato_il).toLocaleDateString('it-IT')+' — il paziente vede ora il programma normalmente.' : 'Il paziente non ha ancora completato la valutazione iniziale: vedrà solo quella al prossimo accesso.']));
    }

    card.appendChild(el('label',{style:'display:block; margin-top:24px;'},['Limiti giornalieri']));
    const currentLimiti = editingPatient.limiti;
    card.appendChild(el('p',{class:'hint'},[currentLimiti && (currentLimiti.sessioniAlGiorno||currentLimiti.minutiAlGiorno)
      ? 'Attuale: '+(currentLimiti.sessioniAlGiorno?currentLimiti.sessioniAlGiorno+' sessioni/giorno':'')+(currentLimiti.sessioniAlGiorno&&currentLimiti.minutiAlGiorno?', ':'')+(currentLimiti.minutiAlGiorno?currentLimiti.minutiAlGiorno+' minuti/giorno':'')
      : 'Nessun limite impostato — può allenarsi senza restrizioni.']));
    card.appendChild(el('button',{class:'ghost', onclick: async ()=>{
      const sRaw = prompt('Numero massimo di sessioni al giorno (vuoto = nessun limite):', currentLimiti&&currentLimiti.sessioniAlGiorno||'');
      if(sRaw===null) return;
      const mRaw = prompt('Minuti massimi di allenamento al giorno (vuoto = nessun limite):', currentLimiti&&currentLimiti.minutiAlGiorno||'');
      if(mRaw===null) return;
      const limiti = {
        sessioniAlGiorno: sRaw.trim() ? Math.max(1,parseInt(sRaw,10)) : null,
        minutiAlGiorno: mRaw.trim() ? Math.max(1,parseInt(mRaw,10)) : null
      };
      try{
        const { error } = await sb.from('pazienti').update({limiti}).eq('id', editingPatient.id).eq('operatore_id', cloudUser.id);
        if(error) throw error;
        editingPatient.limiti = limiti;
        cachedRemotePatients = null;
        render();
      }catch(e){ alert('Errore: '+e.message); }
    }},['Imposta limiti']));

    card.appendChild(el('label',{style:'display:block; margin-top:24px;'},['Valutazione andamento (RCI)']));
    card.appendChild(el('p',{class:'hint'},['Confronta le prime sessioni con le più recenti su ciascun esercizio, per capire se il cambiamento osservato è probabilmente reale o solo oscillazione normale. Lancialo quando vuoi fare il punto (es. a fine di una fase di trattamento), non ad ogni seduta.']));
    card.appendChild(el('button',{class:'ghost', onclick: async ()=>{
      const items = await loadHistory();
      const mine = items.filter(r=> r.pazienteId === editingPatient.id);
      generateRCIReport(mine, editingPatient.codice_paziente);
    }},['Genera report RCI (CSV)']));
    card.appendChild(el('button',{class:'ghost', style:'margin-left:8px;', onclick: async ()=>{
      const items = await loadHistory();
      const mine = items.filter(r=> r.pazienteId === editingPatient.id);
      printRCIReport(mine, editingPatient.codice_paziente);
    }},['Genera report RCI (stampa/PDF)']));

    const nav = el('div',{class:'navlinks'});
    // Non "Annulla": ogni sezione di questa schermata (programma, modalità
    // di accesso, obiettivi...) salva già da sola a ogni tocco, non c'è
    // nulla da scartare — vedi anche il link identico in cima alla
    // schermata, per non dover scorrere fino in fondo per tornare indietro.
    nav.appendChild(el('button',{class:'link', onclick:()=>{ editingPatient=null; view='patients'; render(); }},['← Torna ai pazienti']));
    card.appendChild(nav);
    s.appendChild(card); root.appendChild(s);
  }

  /* ---------- VISTA PAZIENTE (semplificata) ---------- */
  // Gli obiettivi sono ora una LISTA (0, 1 o più per paziente — facoltativi:
  // se vuota, il paziente si allena normalmente senza barre). Ogni voce è di
  // due tipi possibili: 'livello' (come prima: un livello target su un
  // esercizio specifico) oppure 'tempo' (minuti di allenamento accumulati,
  // a settimana o in totale — non legato a un esercizio in particolare).
  // Il campo su Supabase resta 'obiettivo' (jsonb) per non richiedere una
  // migrazione: prima conteneva un singolo oggetto, ora un array di oggetti.
  function normalizeGoals(raw){
    if(!raw) return [];
    const arr = Array.isArray(raw) ? raw : [raw];
    return arr.map(g=> g.tipo ? g : Object.assign({tipo:'livello'}, g)); // formato vecchio senza 'tipo' esplicito
  }
  // Tetto della scala obiettivo-livello per esercizio — usato solo per
  // validare l'inserimento di un nuovo obiettivo (non per la titolazione
  // vera e propria, che ha i suoi tetti in ADAPT_*/currentLevelMax/
  // DUAL_LEVEL_MAX). Il doppio compito usa la media dei due canali
  // (arrotondata per difetto in computeLevelGoalProgress), quindi il tetto
  // resta lo stesso di un canale singolo (10).
  const MAX_LEVEL_BY_TASKMODE = {
    nback:10, categorizzazione:10, sequenza:10, switching:10, gonogo:10, stopsignal:10, ant:10,
    neglect:30, // copre la modalità Progressiva (1-30); classico/intruso sono 1-10, ma un tetto più largo non è vincolante
    goaltask:5, memoria:16, dualtask:10
  };
  // Salva la lista obiettivi per un paziente, locale o remoto — stessa
  // struttura dati in entrambi i casi (vedi normalizeGoals), cambia solo
  // dove viene persistita: localStorage+sync cloud per i profili in
  // presenza, update diretto su 'pazienti' per i remoti.
  async function saveGoalsForPatient(isLocal, patient, nextGoals){
    if(isLocal){
      try{
        const raw = localStorage.getItem('traccian:localpatient:'+patient.id);
        if(!raw) return false;
        const pp = JSON.parse(raw);
        pp.obiettivo = nextGoals;
        localStorage.setItem('traccian:localpatient:'+patient.id, JSON.stringify(pp));
        syncLocalPatientToCloud(pp);
        patient.obiettivo = nextGoals;
        return true;
      }catch(e){ return false; }
    }
    try{
      const { error } = await sb.from('pazienti').update({obiettivo:nextGoals}).eq('id', patient.id).eq('operatore_id', cloudUser.id);
      if(error) throw error;
      patient.obiettivo = nextGoals;
      cachedRemotePatients = null;
      return true;
    }catch(e){ alert('Errore: '+e.message); return false; }
  }
  function computeLevelGoalProgress(g, uc){
    const exLabel = EXERCISES[g.taskMode] ? EXERCISES[g.taskMode].label : g.taskMode;
    if(!uc || uc.taskMode !== g.taskMode) return {percentuale:0, etichetta:'Livello '+g.livelloTarget+' su '+exLabel+' (non ancora iniziato)'};
    // Riusa LEVEL_FIELD_OF_TASKMODE (via levelOfCfg) invece del vecchio
    // if/else dedicato: quello copriva solo nback/ant-tapat/neglect e
    // faceva ricadere categorizzazione, memoria (chunking/PQRST) e
    // scenari ecologici su un campo inesistente (adaptStartLevel),
    // restando sempre bloccato a "livello 1" indipendentemente da dove
    // fosse arrivato il paziente.
    // Doppio compito: due canali con titolazione indipendente — l'obiettivo
    // di livello usa la media dei due, arrotondata per difetto (decisione
    // di Rodrigo: un target unico "medio" è più sensato clinicamente di
    // uno legato a un solo canale, che finirebbe per ignorare l'altro).
    let livelloAttuale = (g.taskMode==='dualtask')
      ? Math.floor(((uc.dualStartLevel1||1) + (uc.dualStartLevel2||1)) / 2)
      : (levelOfCfg(uc) || 1);
    // Posizione continua all'interno del livello, invece di un salto secco
    // ogni 20%: usa l'accuratezza dell'ultima sessione rispetto alle stesse
    // soglie 70-85% (Wilson et al., 2019) che già guidano la titolazione
    // automatica di questo esercizio — riflette quindi l'interazione reale
    // fra i parametri che cambiano insieme al livello (ISI, frequenza,
    // quantità elementi...), non solo il numero di livello raggiunto.
    let posFinale;
    if(livelloAttuale >= g.livelloTarget){
      posFinale = g.livelloTarget;
    } else if(g.taskMode==='stopsignal' || uc.lastAccuracy==null){
      posFinale = livelloAttuale - 1; // niente accuratezza disponibile (o Stop-Signal, che usa lo staircase SSD verso il 50%, non la regola 70-85%): resta il gradino secco
    } else {
      const frac = Math.max(0, Math.min(1, (uc.lastAccuracy - 0.70) / (0.85 - 0.70)));
      posFinale = (livelloAttuale - 1) + frac;
    }
    const pct = Math.round(Math.max(0, Math.min(100, (posFinale/g.livelloTarget)*100)));
    return {percentuale:pct, etichetta:'Livello '+livelloAttuale+' di '+g.livelloTarget+' — '+exLabel};
  }
  let cachedGoalTimeUsage = {}; // { [goalId]: minuti accumulati nel periodo, o null mentre carica }
  async function loadGoalTimeUsage(g){
    if(!sb || !cloudUser){ cachedGoalTimeUsage[g.id] = 0; return; }
    try{
      let query = sb.from('sessioni').select('duration_ms').eq('paziente_id', cloudUser.id);
      if(g.periodo==='settimana') query = query.gte('ts', Date.now() - 7*24*60*60*1000);
      const { data, error } = await query;
      if(error) throw error;
      cachedGoalTimeUsage[g.id] = Math.round(data.reduce((s,r)=> s+(r.duration_ms||0),0)/60000);
    }catch(e){ cachedGoalTimeUsage[g.id] = 0; }
  }
  function computeTimeGoalProgress(g){
    const periodoLabel = g.periodo==='settimana' ? 'questa settimana' : 'in totale';
    if(cachedGoalTimeUsage[g.id]===undefined){
      cachedGoalTimeUsage[g.id] = null;
      loadGoalTimeUsage(g).then(()=> render());
      return {percentuale:0, etichetta:'Tempo di allenamento '+periodoLabel+' — caricamento…'};
    }
    const minuti = cachedGoalTimeUsage[g.id] || 0;
    const pct = Math.round(Math.max(0, Math.min(100, (minuti/g.minutiTarget)*100)));
    return {percentuale:pct, etichetta:minuti+' di '+g.minutiTarget+' minuti '+periodoLabel};

  // Versione di computeTimeGoalProgress per quando è l'OPERATORE a guardare
  // il progresso di un paziente (locale o remoto) in "Gestisci programma" —
  // computeTimeGoalProgress normale usa cloudUser.id, corretto quando è il
  // paziente remoto a guardare la propria scheda (lì cloudUser è il suo
  // stesso account), ma sbagliato quando è l'operatore a guardare: in quel
  // contesto cloudUser.id è l'ID dell'operatore, non del paziente, quindi la
  // query filtrava sessioni che non esistono. Qui si passa esplicitamente id
  // e tipo di paziente e si passa da loadHistory() (locale+cloud, funziona
  // anche offline), filtrando per localPatientId o pazienteId a seconda dei
  // casi — stessa logica già usata per i report RCI.
  let cachedGoalTimeUsageOperator = {}; // { 'goalId:patientId': minuti, o null mentre carica }
  async function loadGoalTimeUsageOperator(g, isLocal, patientId){
    const key = g.id+':'+patientId;
    try{
      const items = await loadHistory();
      const cutoff = g.periodo==='settimana' ? (Date.now() - 7*24*60*60*1000) : 0;
      const mine = items.filter(r=> (isLocal ? r.localPatientId===patientId : r.pazienteId===patientId) && (r.ts||0) >= cutoff);
      cachedGoalTimeUsageOperator[key] = Math.round(mine.reduce((s,r)=> s+(r.durationMs||0),0)/60000);
    }catch(e){ cachedGoalTimeUsageOperator[key] = 0; }
  }
  function computeTimeGoalProgressOperator(g, isLocal, patientId){
    const periodoLabel = g.periodo==='settimana' ? 'questa settimana' : 'in totale';
    const key = g.id+':'+patientId;
    if(cachedGoalTimeUsageOperator[key]===undefined){
      cachedGoalTimeUsageOperator[key] = null;
      loadGoalTimeUsageOperator(g, isLocal, patientId).then(()=> render());
      return {percentuale:0, etichetta:'Tempo di allenamento '+periodoLabel+' — caricamento…'};
    }
    if(cachedGoalTimeUsageOperator[key]===null) return {percentuale:0, etichetta:'Tempo di allenamento '+periodoLabel+' — caricamento…'};
    const minuti = cachedGoalTimeUsageOperator[key] || 0;
    const pct = Math.round(Math.max(0, Math.min(100, (minuti/g.minutiTarget)*100)));
    return {percentuale:pct, etichetta:minuti+' di '+g.minutiTarget+' minuti '+periodoLabel};
  }
  // Restituisce un array di {percentuale, etichetta}, uno per ogni obiettivo

  function computeGoalsProgress(p){

  function exportAccessLogCSV(rows){
    const head = ['data_ora','evento','esito','tipo_utente','nickname','identificativo_digitato','user_id'];
    const body = rows.map(r=>[
      new Date(r.ts).toLocaleString('it-IT'), r.evento, r.esito, r.user_type||'', (r.etichetta||'').replace(/[\n,;]/g,' '), (r.email_tentata||'').replace(/[\n,;]/g,' '), r.user_id||''
    ]);
    const csv = [head.join(';')].concat(body.map(r=>r.join(';'))).join('\n');
    const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'traccian_registro_accessi.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  // Raggruppa gli eventi grezzi per utente (user_id se presente, altrimenti
  // l'identificativo digitato — capita per i tentativi falliti pre-login,
  // dove non esiste ancora uno user_id autenticato). Calcola le durate
  // sessione appaiando ogni login riuscito con il primo logout successivo
  // dello stesso utente.
  function summarizeAccessLog(rows, userType){
    const filtered = rows.filter(r=> (r.user_type||'operatore')===userType);
    const groups = {};
    filtered.forEach(r=>{
      const key = r.user_id || ('anon:'+(r.email_tentata||'sconosciuto'));
      if(!groups[key]) groups[key] = {key, label: r.etichetta || r.email_tentata || (r.user_id ? r.user_id.slice(0,8) : 'sconosciuto'), events:[]};
      // Un'etichetta leggibile (nickname) è sempre preferita al testo
      // digitato al login — per un paziente quel testo è il codice di
      // accesso stesso, una credenziale, non un nome. Una volta vista
      // un'etichetta per questo utente, non la si lascia più sovrascrivere
      // da email_tentata (che resta comunque nel dettaglio evento per
      // evento, utile solo a ricostruire i tentativi FALLITI).
      if(r.etichetta){ groups[key].label = r.etichetta; groups[key]._hasNickname = true; }
      else if(r.email_tentata && !groups[key]._hasNickname) groups[key].label = r.email_tentata;
      groups[key].events.push(r);
    });
    const out = Object.values(groups).map(g=>{
      const events = g.events.slice().sort((a,b)=> new Date(a.ts)-new Date(b.ts));
      let loginsOk=0, loginsFail=0, logouts=0, lastTs=null, sessions=[], openLogin=null;
      events.forEach(e=>{
        if(e.evento==='login' && e.esito==='successo'){ loginsOk++; openLogin=e; }
        else if(e.evento==='login' && e.esito==='fallito'){ loginsFail++; }
        else if(e.evento==='logout'){
          logouts++;
          if(openLogin){ sessions.push({start:openLogin.ts, end:e.ts, durationMs: new Date(e.ts)-new Date(openLogin.ts)}); openLogin=null; }
        }
        lastTs = e.ts;
      });
      // Sia la media sia il TOTALE contano solo le sessioni chiuse da un
      // logout registrato (login senza logout corrispondente — es. scheda
      // chiusa senza uscire — non contribuisce a nessuno dei due): è una
      // stima per difetto del tempo reale sull'app, non un valore esatto.
      const totalDurationMs = sessions.length ? sessions.reduce((s,x)=>s+x.durationMs,0) : null;
      const avgDurationMs = sessions.length ? totalDurationMs/sessions.length : null;
      // openLogin non nullo qui = ultimo login mai chiuso da un logout
      // registrato (sessione ancora aperta, o scheda chiusa senza uscire) —
      // esposto così chi unisce questi dati con lo stato live di
      // sessioni_login sa quale login sta cercando di abbinare.
      return {key:g.key, label:g.label, userType, loginsOk, loginsFail, logouts, lastTs, avgDurationMs, totalDurationMs, sessions, openLoginTs: openLogin ? openLogin.ts : null, events: events.slice().reverse()};
    });
    out.sort((a,b)=> new Date(b.lastTs||0) - new Date(a.lastTs||0));
    return out;
  }

    return (h>0? h+'h ':'')+m+'min';

    const body = el('div',{style:'min-height:60px;'},[el('p',{class:'hint'},['Caricamento…'])]);
    card.appendChild(body);
    const btnRow = el('div',{class:'rowbtns', style:'margin-top:16px;'});
    btnRow.appendChild(el('button',{class:'ghost', onclick: async ()=>{ await loadAccessLog(true); renderBody(); }},['Aggiorna']));
    btnRow.appendChild(el('button',{class:'ghost', onclick: async ()=>{ exportAccessLogCSV(await loadAccessLog()); }},['Esporta CSV (tutto)']));
    card.appendChild(btnRow);
    s.appendChild(card); root.appendChild(s);

    // Unisce due fonti diverse per utente: lo storico da 'accessi' (sessioni
    // chiuse da un logout esplicito registrato, con durata esatta) e lo
    // stato live da 'sessioni_login' (battito ogni 25s, comprese le riprese
    // senza login esplicito — che lo storico da solo non vede mai, perché
    // non generano un evento 'login' in accessi). Una sessione ancora
    // aperta (nessun logout corrispondente) compare quindi due volte nelle
    // fonti grezze per lo stesso login: qui viene mostrata una sola volta,
    // come riga "in corso" nel dettaglio, usando openLoginTs per abbinarla
    // al gettone live dello stesso utente.
    function mergeGroups(historical, live){
      const byKey = {};
      historical.forEach(g=> byKey[g.key] = Object.assign({}, g, {liveOnline:false, liveDurataMs:null, liveUltimoVistoMs:null}));
      live.forEach(x=>{
        const key = x.userId;
        if(!byKey[key]) byKey[key] = {key, label:x.etichetta||x.userId, userType:x.userType, loginsOk:0, loginsFail:0, logouts:0, lastTs:null, avgDurationMs:null, totalDurationMs:null, sessions:[], openLoginTs:null, events:[]};
        byKey[key].liveOnline = x.online;
        byKey[key].liveDurataMs = x.durataMs;
        byKey[key].liveUltimoVistoMs = x.ultimoVistoMs;
      });
      return Object.values(byKey);
    }
    function statusLine(g){
      if(g.liveOnline) return '🟢 online da '+(g.liveDurataMs!=null ? fmtTime(g.liveDurataMs) : '—');
      if(g.liveUltimoVistoMs) return '⚪ visto l\'ultima volta: '+new Date(g.liveUltimoVistoMs).toLocaleString('it-IT');
      return '⚪ nessuna sessione registrata';
    }
    function renderGroupTable(title, groups){
      const wrap = el('div',{style:'margin-top:18px;'});
      wrap.appendChild(el('div',{style:'font-weight:600; margin-bottom:8px;'},[title+' ('+groups.length+')']));
      if(!groups.length){ wrap.appendChild(el('p',{class:'hint'},['Nessun evento registrato.'])); return wrap; }
      groups.sort((a,b)=> (b.liveOnline-a.liveOnline) || ((b.liveUltimoVistoMs||b.lastTs||0)-(a.liveUltimoVistoMs||a.lastTs||0)));
      groups.forEach(g=>{
        const row = el('div',{class:'histrow', style:'cursor:pointer; flex-direction:column; align-items:stretch;'});
        const summary = el('div',{style:'display:flex; flex:none; justify-content:space-between; gap:10px; width:100%; flex-wrap:wrap;', onclick:()=>{ accessLogExpanded = accessLogExpanded===g.key ? null : g.key; renderBody(); }},[
          el('div',{},[
            el('div',{},[g.label]),
            el('div',{class:'hint', style:'margin-top:2px;'},[statusLine(g)])
          ]),
          el('div',{style:'text-align:right; font-size:13px; color:var(--ink-soft);'},[
            '✓ '+g.loginsOk+' · ✗ '+g.loginsFail+' · media '+fmtDuration(g.avgDurationMs)+' · totale '+fmtDuration(g.totalDurationMs)
          ])
        ]);
        row.appendChild(summary);
        if(accessLogExpanded===g.key){
          const detail = el('div',{style:'margin-top:10px; padding-top:10px; border-top:1px solid var(--line, #eee); font-size:13px;'});
          detail.appendChild(el('div',{style:'font-weight:600; margin-bottom:6px;'},['Sessioni']));
          if(g.liveOnline && g.openLoginTs==null){
            // Ripresa silenziosa tuttora in corso, senza un login esplicito
            // corrispondente in 'accessi' — la sessione "in corso" non ha
            // un inizio noto dallo storico eventi, solo dal battito live.
            detail.appendChild(el('div',{style:'padding:3px 0;'},['In corso (ripresa senza login esplicito) — online da '+(g.liveDurataMs!=null?fmtTime(g.liveDurataMs):'—')]));
          }
          g.sessions.slice().reverse().forEach(sess=>{
            detail.appendChild(el('div',{style:'padding:3px 0;'},[
              new Date(sess.start).toLocaleString('it-IT')+' → '+new Date(sess.end).toLocaleString('it-IT')+' · '+fmtDuration(sess.durationMs)
            ]));
          });
          if(g.openLoginTs!=null && g.liveOnline){
            detail.appendChild(el('div',{style:'padding:3px 0;'},[
              new Date(g.openLoginTs).toLocaleString('it-IT')+' → in corso · '+(g.liveDurataMs!=null?fmtTime(g.liveDurataMs):'—')
            ]));
          } else if(g.openLoginTs!=null && !g.liveOnline){
            detail.appendChild(el('div',{class:'hint', style:'padding:3px 0;'},[
              new Date(g.openLoginTs).toLocaleString('it-IT')+' → nessun logout registrato (scheda chiusa senza uscire, o rete caduta) — durata non stimabile con certezza'
            ]));
          }
          if(!g.sessions.length && g.openLoginTs==null && !g.liveOnline){
            detail.appendChild(el('p',{class:'hint'},['Nessuna sessione con durata ricostruibile.']));
          }
          if(g.events.length){
            detail.appendChild(el('div',{style:'font-weight:600; margin:10px 0 6px;'},['Eventi grezzi (login/logout/tentativi)']));
            g.events.forEach(e=>{
              detail.appendChild(el('div',{style:'padding:3px 0; color:'+(e.esito==='fallito'?'var(--alert)':'var(--ink)')+';'},[
                new Date(e.ts).toLocaleString('it-IT')+' — '+e.evento+' · '+e.esito
              ]));
            });
          }
          row.appendChild(detail);
        }
        wrap.appendChild(row);
      });
      return wrap;
    }
    let autoTimer = null;
    async function renderBody(){
      const [rows, liveResult] = await Promise.all([loadAccessLog(), loadOnlineSessions()]);
      const live = liveResult.sessions;
      body.innerHTML = '';
      if(liveResult.error){
        body.appendChild(el('div',{style:'padding:10px 12px; margin-bottom:14px; border:1px solid var(--alert,#c0392b); border-radius:8px; font-size:13px; color:var(--alert,#c0392b);'},[
          'Stato "online adesso" non disponibile: '+liveResult.error+'. Probabile causa: l\'aggiornamento SQL di sessioni_login (colonne iniziata_il/user_type/etichetta + policy di lettura per il super-operatore, vedi README) non è ancora stato eseguito su questo progetto Supabase. Lo storico sotto resta comunque affidabile.'
        ]));
      }
      const opGroups = mergeGroups(summarizeAccessLog(rows,'operatore'), live.filter(x=>x.userType==='operatore'));
      const patGroups = mergeGroups(summarizeAccessLog(rows,'paziente'), live.filter(x=>x.userType==='paziente'));
      body.appendChild(renderGroupTable('Operatori', opGroups));
      body.appendChild(renderGroupTable('Pazienti', patGroups));
    }
    renderBody();
    // Auto-aggiornamento ogni 20s finché questa schermata resta aperta —
    // così lo stato "online ora" resta corrente senza dover premere
    // "Aggiorna" a mano.
    autoTimer = setInterval(()=>{ if(view==='accessLog') renderBody(); else clearInterval(autoTimer); }, 20000);
  }

  const SCREENS = {
    setup: ScreenSetup, instructions: ScreenInstructions, countdown: ScreenCountdown,
    manualEntry: ScreenManualEntry, results: ScreenResults, history: ScreenHistory,
    cloud: ScreenCloud, patients: ScreenPatients, patientHome: ScreenPatientHome, patientProgram: ScreenPatientProgram,
    operatorHome: ScreenOperatorHome, localPatientPicker: ScreenLocalPatientPicker, accessCode: ScreenAccessCode, accessLog: ScreenAccessLog,
    screeningIntro: ScreenScreeningIntro, screeningResults: ScreenScreeningResults, archive: ScreenArchive, demoDone: ScreenDemoDone,
    motorIntro: ScreenMotorIntro, motorTask: ScreenMotorTask, motorResults: ScreenMotorResults
  };

  // Ingresso da tastiera (solo desktop) per le risposte a 2 o 4 alternative
  // durante una sessione attiva. Due disposizioni possibili (cfg.keyLayout,
  // scelta in Setup — vedi "Dispositivo di risposta previsto"): 'standard'
  // (A/L, A/L/Z/M) o 'ravvicinata' (B/N, V/B/N/M — 4 tasti adiacenti sulla
  // riga inferiore della tastiera, raggiungibili con una sola mano, per chi
  // ha una limitazione motoria che rende impossibile usare due mani o
  // coprire una tastiera intera). La disposizione non cambia MAI quali
  // pulsanti sono attivi, solo quali tasti li attivano — mai attiva fuori
  // da view==='task', per non creare scorciatoie accidentali nei menu.
  // Barra spaziatrice per gli esercizi a un solo pulsante (N-back,
  // categorizzazione 1-back...): prima non avevano NESSUNA scorciatoia da
  // tastiera, un vuoto reale per chi non può individuare il pulsante a
  // schermo (basso vedente, o in generale su materiale uditivo dove non
  // c'è nulla da guardare) — Tab+Invio funzionava già ma è più lento.
  const KEY_LAYOUTS = {
    standard:    { map2:{'a':0,'l':1}, map4:{'a':0,'l':1,'z':2,'m':3}, labels2:['A','L'], labels4:['A','L','Z','M'] },
    ravvicinata: { map2:{'b':0,'n':1}, map4:{'v':0,'b':1,'n':2,'m':3}, labels2:['B','N'], labels4:['V','B','N','M'] }
  };
  function activeKeyLayout(){ return KEY_LAYOUTS[cfg.keyLayout] || KEY_LAYOUTS.standard; }
  document.addEventListener('keydown', function(ev){
    if(view!=='task' || !taskDom || !taskDom.btns || session.paused) return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(tag==='INPUT' || tag==='TEXTAREA') return;
    const n = taskDom.btns.length;
    if(n===1 && ev.key===' '){
      ev.preventDefault();
      taskDom.btns[0].click();
      return;
    }
    const key = ev.key.toLowerCase();
    const layout = activeKeyLayout();
    const map = n===2 ? layout.map2 : (n===4 ? layout.map4 : null);
    if(!map || !(key in map)) return;
    const idx = map[key];
    if(idx>=n) return;
    ev.preventDefault();
    taskDom.btns[idx].click();
  });
  try{ if(window.speechSynthesis){ window.speechSynthesis.getVoices(); } }catch(e){}
  regenerateNumeriPool();
  regenerateParolePool();
  initSupabase();
  // Schermate ricostruibili appieno dopo un refresh vero (F5): non
  // dipendono da un oggetto di sessione in memoria che il reload cancella
  // (session, screeningState, pendingAccessCode...) — solo da id di
  // paziente/filtro, tutti ricostruibili da localStorage/Supabase.
  const RELOAD_SAFE_VIEWS = new Set(['setup','patients','localPatientPicker','history','archive','cloud','accessLog','operatorHome','patientHome','patientProgram']);
  // priorState: lo stato di history.state COM'ERA prima di spingere la
  // sentinella anti-uscita qui sotto — deve essere catturato subito
  // all'avvio, perché dopo il pushState della sentinella history.state
  // punterebbe alla sentinella stessa, non più alla schermata da cui
  // riprendere dopo un refresh vero.
  function decideInitialView(priorState){
    if(patientProfile){
      // Come per l'operatore sotto: se il refresh riporta su una schermata
      // ricostruibile (es. patientProgram, history), resta lì invece di
      // saltare sempre alla home del paziente — la home resta comunque la
      // scelta di sicurezza per tutto il resto (sessione in corso,
      // screening in corso...), che dopo un refresh vero non è
      // ricostruibile.
      try{
        if(priorState && priorState.view){
          restoreNavSnapshot(priorState);
          if(RELOAD_SAFE_VIEWS.has(view)) return view;
        }
      }catch(e){}
      return 'patientHome';
    }
    if(cloudUser){
      try{
        if(priorState && priorState.view){
          restoreNavSnapshot(priorState); // ripristina comunque il contesto (paziente attivo, filtri) anche quando la schermata esatta non è ricostruibile
          if(RELOAD_SAFE_VIEWS.has(view) && view!=='patientHome' && view!=='cloud') return view;
          // Stato a metà flusso (sessione in corso, screening in corso,
          // codice appena generato...) perso per forza col reload: resta
          // nella stessa area — stesso paziente, schermata Setup — invece
          // di saltare a una sezione diversa.
          view = 'setup';
          return view;
        }
      }catch(e){}
      return 'operatorHome'; // nessuno stato precedente (prima apertura): schermata di scelta esercizi liberi/in presenza/remoto
    }
    return 'cloud'; // non collegato: schermata di accesso
  }
  // Cattura lo stato reale PRIMA di spingere la sentinella anti-uscita (vedi
  // popstate sopra): la sentinella va comunque spinta subito, sotto la
  // prima schermata vera, così un indietro ripetuto atterra su di essa
  // invece di uscire dal sito senza preavviso.
  const priorHistoryState = history.state;
  try{ history.pushState({exitGuard:true}, '', ''); }catch(e){}
  restoreCloudSession().finally(()=>{ view = decideInitialView(priorHistoryState); render(); });
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
