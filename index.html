  /* ---------- TASK ENGINE ---------- */
  function startSession(){
    regenerateNumeriPool();
    regenerateParolePool();
    if(cfg.taskMode==='neglect'){ startNeglectSession(); return; }
    if(cfg.taskMode==='goaltask'){ startGoalTaskSession(); return; }
    if(cfg.taskMode==='memoria'){ startMemoriaSession(); return; }
    const isTapat = cfg.taskMode==='ant' && cfg.antMode==='tapat';
    const isIncremental = cfg.taskMode==='nback' || isTapat || cfg.taskMode==='gonogo' || cfg.taskMode==='dualtask';
    session = {
      // n-back, TAPAT e Go/No-Go generano le prove una alla volta (serve
      // per poter cambiare livello a metà sessione, manualmente o in
      // automatico); gli altri esercizi restano pre-generati come prima
      // (la loro adattività riguarda solo l'ISI o il CSI, non il contenuto
      // delle prove, quindi non serve rigenerarle).
      seq: isIncremental ? [] : buildSequence(),
      idx:-1, timer:null, timerInfo:null, phase:'idle',
      counts:{hits:0, misses:0, falseAlarms:0, correctRejections:0, targets:0, nonTargets:0},
      countsAud:{hits:0, misses:0, falseAlarms:0, correctRejections:0, targets:0, nonTargets:0},
      choiceLog:[], // {correct:bool, rt, isSwitch, cueType, congruency}
      trail:[], responses:new Set(), respTime:null, trialStart:0,
      rts:[], startedAt: Date.now(), paused:false, pausedAt:null,
      currentSSD: cfg.ssd, ssdHistory:[], showStopCue:false, stopCueTimer:null,
      liveNLevel: cfg.nLevel, tapatLevel: cfg.tapatStartLevel, adaptLevel: cfg.adaptStartLevel, liveTapatGradient: cfg.tapatGradient,
      dualLevel1: cfg.dualStartLevel1, dualLevel2: cfg.dualStartLevel2, adaptBlock1:[], adaptBlock2:[], prevDual1:null, prevDual2:null,
      adaptBlock:[], levelChanges:[]
    };
    view='task'; render();
    nextTrial();
  }
  /* ---- Motore Cancellazione/Neglect: tavole con molti elementi simultanei,
     tocco diretto sui bersagli, non un ciclo di prove sequenziali. ---- */
  function shuffleArr(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
  function buildNeglectBoard(){
    const pool = POOLS[cfg.stimType];
    const targets = cfg.targetSeq;
    const n = cfg.adaptive ? (ADAPT_NEGLECT_SIZE[session.liveBoardLevel] || cfg.neglectBoardSize) : cfg.neglectBoardSize;
    const targetCount = Math.max(4, Math.round(n*0.25));
    // gradiente continuo 0-100: 0=tutti i bersagli a destra, 100=tutti a
    // sinistra, 50=simmetrico. Con l'adattivo attivo, session.liveGradient
    // può essersi spostato verso il lato più debole (vedi finishBoard).
    const gradient = cfg.adaptive ? (session.liveGradient!=null ? session.liveGradient : cfg.neglectGradient) : cfg.neglectGradient;
    const leftRatio = gradient/100;
    let targetsLeft = Math.round(targetCount*leftRatio), targetsRight = targetCount-targetsLeft;
    const cols=8, rows=Math.ceil(n/cols);
    const cellW=100/cols, cellH=100/rows;
    let positions=[];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) positions.push({r,c});
    positions = shuffleArr(positions).slice(0,n);
    let li=0, ri=0;
    const scattered = cfg.neglectLayout==='sparsa';
    const items = positions.map((p,i)=>{
      const side = p.c < cols/2 ? 'left':'right';
      // "griglia": piccola variazione dentro la cella (ordinato, leggibile).
      // "sparsa": posizione quasi libera in tutta l'area del lato, meno
      // prevedibile — carico di ricerca visiva maggiore.
      const x = scattered
        ? (side==='left' ? Math.random()*45+2 : Math.random()*45+53)
        : p.c*cellW + cellW*(0.2+Math.random()*0.6);
      const y = scattered ? Math.random()*90+5 : p.r*cellH + cellH*(0.2+Math.random()*0.6);
      let isTarget=false;
      if(side==='left' && li<targetsLeft){ isTarget=true; li++; }
      else if(side==='right' && ri<targetsRight){ isTarget=true; ri++; }
      let val;
      if(isTarget){ val = targets[Math.floor(Math.random()*targets.length)]; }
      else {
        let tries=0;
        do{ val = pool[Math.floor(Math.random()*pool.length)]; tries++; }
        while(targets.some(t=>seqLabel(t)===seqLabel(val)) && tries<20 && pool.length>targets.length);
      }
      return {x, y, val, isTarget, side, found:false, falseTap:false};
    });
    return items;
  }
  function startNeglectSession(){
    session = {
      boardIdx:0, totalBoards:cfg.trials, board:[], boardStartTime:0, startedAt:Date.now(),
      timer:null, timerInfo:null, paused:false, pausedAt:null, liveBoardLevel:cfg.neglectStartLevel, liveGradient:cfg.neglectGradient, levelChanges:[],
      results:[] // {targetsLeft,targetsRight,foundLeft,foundRight,falseAlarms,timeMs,reason}
    };
    view='task'; render();
    nextBoard();
  }
  function nextBoard(){
    if(session.boardIdx >= session.totalBoards){ finishNeglectSession(); return; }
    session.board = buildNeglectBoard();
    session.boardStartTime = performance.now();
    render();
    const timeLimit = cfg.adaptive ? (ADAPT_NEGLECT_TIME[session.liveBoardLevel] ?? cfg.neglectTimeLimit) : cfg.neglectTimeLimit;
    if(timeLimit>0){
      scheduleStep(()=> finishBoard('tempo scaduto'), timeLimit*1000);
    }
  }
  function tapNeglectItem(item){
    if(!session || session.paused || item.found || item.falseTap) return;
    if(cfg.respMode==='manuale') return;
    if(item.isTarget) item.found = true; else item.falseTap = true;
    updateNeglectScreen();
    // Nota: la tavola NON avanza da sola nemmeno quando tutti i bersagli
    // sono stati trovati — deve essere il paziente/operatore a riconoscerlo
    // e toccare "Fatto", cosa che lo costringe a monitorare attivamente il
    // proprio avanzamento invece di procedere in automatico.
  }
  function finishBoard(reason){
    if(session.timer){ clearTimeout(session.timer); session.timer=null; session.timerInfo=null; }
    const timeMs = performance.now()-session.boardStartTime;
    const tL = session.board.filter(b=>b.side==='left'&&b.isTarget);
    const tR = session.board.filter(b=>b.side==='right'&&b.isTarget);
    const foundLeft = tL.filter(b=>b.found).length, foundRight = tR.filter(b=>b.found).length;
    session.results.push({
      targetsLeft:tL.length, targetsRight:tR.length,
      foundLeft, foundRight,
      falseAlarms:session.board.filter(b=>b.falseTap).length, timeMs, reason
    });
    if(cfg.adaptive){
      const totalTargets = tL.length+tR.length;
      const acc = totalTargets>0 ? (foundLeft+foundRight)/totalTargets : 1;
      if(acc > 0.85 && session.liveBoardLevel < 5){
        session.liveBoardLevel++;
        session.levelChanges.push({board:session.boardIdx, level:session.liveBoardLevel, how:'auto'});
      } else if(acc < 0.70 && session.liveBoardLevel > 1){
        session.liveBoardLevel--;
        session.levelChanges.push({board:session.boardIdx, level:session.liveBoardLevel, how:'auto'});
      }
      // il gradiente si sposta verso il lato che va peggio: se la
      // percentuale trovata a sinistra è più bassa di quella a destra (o
      // viceversa), la prossima tavola carica di più quel lato — fino a un
      // massimo di 75/25, mai totalmente monolaterale.
      const pctLeft = tL.length ? foundLeft/tL.length : 1, pctRight = tR.length ? foundRight/tR.length : 1;
      const base = session.liveGradient!=null ? session.liveGradient : cfg.neglectGradient;
      const step = 5;
      let ng = base;
      if(pctLeft < pctRight - 0.15) ng = Math.min(75, base+step); // sinistra più debole -> più bersagli a sinistra
      else if(pctRight < pctLeft - 0.15) ng = Math.max(25, base-step);
      session.liveGradient = ng;
    }
    session.boardIdx++;
    nextBoard();
  }

  // (session.liveNLevel), che può cambiare durante la sessione stessa.
  function genNbackTrial(){
    const pool = POOLS[cfg.stimType];
    const i = session.seq.length;
    const n = session.liveNLevel;
    const freq = cfg.adaptive ? (ADAPT_NBACK_FREQ[n] || cfg.targetRate) : cfg.targetRate;
    function runLen(val){ let run=1; for(let k=i-1;k>=0;k--){ if(session.seq[k].val===val) run++; else break; } return run; }
    let makeTarget = i>=n && Math.random() < freq;
    let val;
    if(makeTarget){
      const cand = session.seq[i-n].val;
      if(pool.length>1 && runLen(cand) > 3){ makeTarget=false; } else { val = cand; }
    }
    if(!makeTarget){
      do{ val = pool[Math.floor(Math.random()*pool.length)]; }
      while(pool.length>1 && ((i>=n && val===session.seq[i-n].val) || runLen(val)>3));
    }
    const trial = {val, isTarget: i>=n ? makeTarget : false, valid:i>=n, nAtGeneration:n};
    session.seq.push(trial);
    return trial;
  }
  // Titolazione automatica: valuta un blocco di 8 prove valide alla volta.
  // Livelli di difficoltà TAPAT: più alto = attese toniche più lunghe e
  // imprevedibili (più difficile sostenere l'attenzione da soli).
  const TAPAT_LEVELS = { 1:[2000,4000], 2:[3000,6000], 3:[4000,8000], 4:[6000,11000], 5:[8000,15000] };
  // Go/No-Go: generazione incrementale, necessaria perché con l'adattivo
  // attivo la frequenza no-go cambia durante la sessione.
  function genGoNoGoTrial(){
    const pool = POOLS[cfg.stimType];
    const fullSet = cfg.targetSeq;
    const count = cfg.adaptive ? Math.min(fullSet.length, ADAPT_GONOGO_COUNT[session.adaptLevel]||1) : fullSet.length;
    const activeNoGo = fullSet.slice(0, Math.max(1,count));
    const freq = cfg.adaptive ? (ADAPT_GONOGO_FREQ[session.adaptLevel] || cfg.targetRate) : cfg.targetRate;
    let val;
    if(Math.random() < freq){ val = activeNoGo[Math.floor(Math.random()*activeNoGo.length)]; }
    else { do{ val = pool[Math.floor(Math.random()*pool.length)]; } while(activeNoGo.some(x=>seqLabel(x)===seqLabel(val)) && pool.length>activeNoGo.length); }
    const isNoGo = activeNoGo.some(x=>seqLabel(x)===seqLabel(val));
    const trial = {val, isTarget: !isNoGo, valid:true};
    session.seq.push(trial);
    return trial;
  }
  function genTapatTrial(){
    const i = session.seq.length;
    const half = Math.floor(cfg.trials/2);
    const block = i<half ? 'tonic' : 'phasic';
    const pool = POOLS[cfg.stimType];
    let cueType, isiOverride;
    if(block==='tonic'){
      cueType = 'none';
      const range = TAPAT_LEVELS[session.tapatLevel] || TAPAT_LEVELS[3];
      isiOverride = range[0] + Math.random()*(range[1]-range[0]);
    } else {
      cueType = Math.random()<0.5 ? 'none' : 'center';
      isiOverride = null; // usa l'ISI normale impostato in setup
    }
    const val = pool[Math.floor(Math.random()*pool.length)];
    let side = 'center';
    if(cfg.tapatSpatial){
      const gradient = session.liveTapatGradient!=null ? session.liveTapatGradient : cfg.tapatGradient;
      side = Math.random()*100 < gradient ? 'left' : 'right';
    }
    const trial = {val, cueType, congruency:'neutral', side, targetDir:null, correctAnswer:'go', block, isiOverride, valid:true};
    session.seq.push(trial);
    return trial;
  }
  // Titolazione automatica: valuta un blocco di 8 prove valide alla volta.
  // Generica: si applica sia al livello n-back sia al livello TAPAT, a
  // seconda dell'esercizio in corso.
  // Restituisce quale campo di sessione rappresenta "il livello" per
  // l'esercizio corrente, o null se quell'esercizio non è adattivo.
  function adaptLevelKey(){
    if(cfg.taskMode==='nback') return 'liveNLevel';
    if(cfg.taskMode==='ant' && cfg.antMode==='tapat') return 'tapatLevel';
    if(cfg.taskMode==='neglect') return 'liveBoardLevel';
    if(ADAPT_ISI[cfg.taskMode] || cfg.taskMode==='gonogo' || cfg.taskMode==='switching') return 'adaptLevel';
    return null;
  }
  function maybeAdapt(){
    if(!cfg.adaptive) return;
    const levelKey = adaptLevelKey();
    if(!levelKey) return;
    const BLOCK = 8;
    if(session.adaptBlock.length < BLOCK) return;
    const acc = session.adaptBlock.filter(Boolean).length / session.adaptBlock.length;
    if(acc > 0.85 && session[levelKey] < 5){
      session[levelKey]++;
      session.levelChanges.push({trialIdx:session.idx, level:session[levelKey], how:'auto'});
    } else if(acc < 0.70 && session[levelKey] > 1){
      session[levelKey]--;
      session.levelChanges.push({trialIdx:session.idx, level:session[levelKey], how:'auto'});
    }
    session.adaptBlock = [];
  }
  function bumpLevel(delta){
    if(!session) return;
    const levelKey = adaptLevelKey();
    if(!levelKey) return;
    const nv = Math.max(1, Math.min(5, session[levelKey]+delta));
    if(nv===session[levelKey]) return;
    session[levelKey] = nv;
    const isNeglect = cfg.taskMode==='neglect';
    if(!isNeglect) session.adaptBlock = []; // il blocco automatico riparte da qui
    session.levelChanges.push({trialIdx: isNeglect ? session.boardIdx : session.idx, level:nv, how:'manuale'});
    if(isNeglect) updateNeglectScreen(); else updateTaskScreen();
  }
  function bumpDualLevel(channel, delta){
    if(!session || cfg.taskMode!=='dualtask') return;
    const levelKey = channel===1 ? 'dualLevel1' : 'dualLevel2';
    const nv = Math.max(1, Math.min(5, session[levelKey]+delta));
    if(nv===session[levelKey]) return;
    session[levelKey] = nv;
    session[channel===1?'adaptBlock1':'adaptBlock2'] = [];
    session.levelChanges.push({trialIdx:session.idx, level:nv, how:'manuale', canale:channel});
    updateTaskScreen();
  }
  // Wraps setTimeout so a pause can compute and preserve the remaining delay.
  function scheduleStep(fn, delay){
    const startedAt = performance.now();
    session.timerInfo = {fn, delay, startedAt};
    session.timer = setTimeout(()=>{ session.timerInfo=null; fn(); }, delay);
  }
  function pauseTask(){
    if(!session || session.paused) return;
    if(session.timer) clearTimeout(session.timer);
    if(session.stopCueTimer) clearTimeout(session.stopCueTimer);
    if(session.timerInfo){
      const elapsed = performance.now() - session.timerInfo.startedAt;
      session.timerInfo.remaining = Math.max(50, session.timerInfo.delay - elapsed);
    }
    try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
    session.paused = true;
    session.pausedAt = performance.now();
    render();
  }
  function resumeTask(){
    if(!session || !session.paused) return;
    const pausedDuration = performance.now() - session.pausedAt;
    if(session.trialStart!=null) session.trialStart += pausedDuration; // keep reaction times measured on active time only
    if(session.boardStartTime!=null) session.boardStartTime += pausedDuration;
    session.paused = false;
    if(session.timerInfo){
      const {fn, remaining} = session.timerInfo;
      session.timer = setTimeout(()=>{ session.timerInfo=null; fn(); }, remaining);
    }
    render();
  }
  // Tabelle livello (1-5) -> parametro, per gli esercizi con titolazione
  // adattiva generica. N-back e TAPAT hanno le proprie tabelle dedicate
  // (livello n e durata attesa tonica) definite altrove.
  const ADAPT_ISI = {   // ISI in ms — più basso = più difficile
    sequenza: {1:3200,2:2700,3:2200,4:1700,5:1300},
    dualtask: {1:3000,2:2600,3:2200,4:1800,5:1400},
    ant:      {1:2400,2:2000,3:1600,4:1300,5:1000},  // solo ANT classico, non TAPAT
    stopsignal: {1:2800,2:2400,3:2000,4:1600,5:1200} // leva secondaria, indipendente dallo staircase SSD
  };
  const ADAPT_GONOGO_FREQ = {1:0.40,2:0.32,3:0.24,4:0.16,5:0.10}; // frequenza no-go — più bassa = più difficile
  const ADAPT_NBACK_FREQ = {1:0.40,2:0.32,3:0.24,4:0.16,5:0.10}; // frequenza target n-back — più bassa = più difficile (stessa logica del Go/No-Go: più raro il target, più forte la tendenza abituale a non rispondere)
  const ADAPT_SWITCH_BALANCE = {1:0.50,2:0.60,3:0.70,4:0.80,5:0.90}; // quanto la regola "dominante" prevale sull'altra — più sbilanciato = più difficile quando tocca passare alla regola rara
  const ADAPT_DUAL_FREQ = {1:0.40,2:0.32,3:0.24,4:0.16,5:0.10}; // frequenza target per canale, indipendente sui due canali del doppio compito
  const ADAPT_GONOGO_COUNT = {1:1,2:1,3:2,4:3,5:4}; // quanti elementi no-go attivi (dal set configurato) — di più = più difficile
  const ADAPT_SWITCH_CSI  = {1:900,2:650,3:450,4:300,5:150};      // intervallo cue→stimolo — più corto = più difficile
  const ADAPT_NEGLECT_SIZE = {1:20,2:30,3:40,4:55,5:75};          // elementi per tavola — più alto = più difficile
  const ADAPT_NEGLECT_TIME = {1:0,2:90,3:60,4:40,5:25};           // secondi per tavola (0=nessun limite) — più basso = più difficile

  function nextTrial(){
    session.idx++;
    if(session.idx >= cfg.trials){ finishSession(); return; }
    const isTapat = cfg.taskMode==='ant' && cfg.antMode==='tapat';
    const trial = cfg.taskMode==='nback' ? genNbackTrial()
      : isTapat ? genTapatTrial()
      : cfg.taskMode==='gonogo' ? genGoNoGoTrial()
      : cfg.taskMode==='dualtask' ? genDualTaskTrial()
      : session.seq[session.idx];
    session.responses=new Set(); session.respTime=null; session.showStopCue=false;
    if(session.stopCueTimer){ clearTimeout(session.stopCueTimer); session.stopCueTimer=null; }
    session.trialStart = performance.now();

    // Task-switching adattivo: fase di solo cue (la regola, senza stimolo)
    // per l'intervallo CSI corrente, poi lo stimolo — è il parametro con
    // il fondamento più solido in letteratura per questo compito specifico.
    if(cfg.taskMode==='switching' && cfg.adaptive){
      session.phase='cue';
      render();
      const csi = ADAPT_SWITCH_CSI[session.adaptLevel] || 400;
      scheduleStep(()=> showTrialStimulus(trial), csi);
      return;
    }
    showTrialStimulus(trial);
  }
  function showTrialStimulus(trial){
    session.phase='show';
    session.trialStart = performance.now(); // il tempo di reazione parte da quando appare lo stimolo, non dal cue
    render();
    presentStimulus(trial);
    if(cfg.taskMode==='stopsignal' && trial.isStopTrial){
      session.stopCueTimer = setTimeout(()=>{
        session.showStopCue=true;
        playTone(STOP_TONE, 220); // segnale uditivo, disaccoppiato dalla modalità dello stimolo go — come nel paradigma originale
        updateTaskScreen();
      }, session.currentSSD);
    }
    scheduleStep(()=>{
      session.phase='wait'; render();
      let isi = trial.isiOverride || cfg.isi;
      if(!trial.isiOverride && cfg.adaptive && ADAPT_ISI[cfg.taskMode] && !(cfg.taskMode==='ant' && cfg.antMode==='tapat')){
        isi = ADAPT_ISI[cfg.taskMode][session.adaptLevel];
      }
      scheduleStep(()=> resolveTrial(), Math.max(50,isi-cfg.stimDuration));
    }, cfg.stimDuration);
  }
  function presentStimulus(trial){
    if(cfg.taskMode==='dualtask'){
      const pairing = cfg.dualPairing || 'vis-aud';
      if(pairing==='vis-aud') playTone(trial.audioVal, cfg.stimDuration);
      else if(pairing==='aud-aud'){ playTone(trial.visualVal, cfg.stimDuration); playTone(trial.audioVal, cfg.stimDuration); }
      // vis-vis: nessun audio, entrambi i canali sono visivi (mostrati in renderStimulusNode)
      return;
    }
    if((cfg.taskMode==='ant' && cfg.antMode!=='tapat') || cfg.taskMode==='switching') return; // solo visivi
    if(cfg.taskMode==='ant' && cfg.antMode==='tapat'){
      if(trial.cueType==='center') playTone(TAPAT_CUE_TONE, 150); // cue acustico, in aggiunta al simbolo visivo già mostrato in renderStimulusNode
      return;
    }
    if(cfg.stimType==='suoni'){
      playTone(trial.val, cfg.stimDuration);
    } else if(cfg.voice && ['lettere','numeri','parole'].includes(cfg.stimType)){
      speak(String(trial.val));
    }
  }
  // action: identificatore generico del pulsante toccato ('match'/'nomatch',
  // 'go', 'left'/'right', 'a'/'b', 'vis'/'aud'...). Gli esercizi a singola
  // risposta ignorano tocchi ulteriori dopo il primo; il doppio compito
  // accetta un tocco indipendente per canale.
  function registerTap(action){
    if(!session || session.paused || session.idx<0 || session.idx>=session.seq.length) return;
    if(cfg.respMode==='manuale') return;
    if(session.responses.has(action)) return;
    if(cfg.taskMode!=='dualtask' && session.responses.size>0) return;
    session.responses.add(action);
    if(session.respTime===null) session.respTime = performance.now()-session.trialStart;
  }
  function resolveTrial(){
    const trial = session.seq[session.idx];
    let outcome = null;
    switch(cfg.taskMode){
      case 'gonogo': case 'stopsignal': outcome = resolveSignal(trial); break;
      case 'ant': case 'switching': outcome = resolveChoice(trial); break;
      case 'dualtask': outcome = resolveDualTask(trial); break;
      default: outcome = resolveSignal(trial); // nback / sequenza
    }
    if(outcome) session.trail.push({outcome, target: !!trial.isTarget});
    nextTrial();
  }
  // nback, sequenza, gonogo, stopsignal: tutti sono "rispondi sì/no" con un
  // ground truth trial.isTarget — riusano lo stesso schema hit/miss/FA/CR.
  function resolveSignal(trial){
    if(!trial.valid) return null;
    if(trial.isTarget) session.counts.targets++; else session.counts.nonTargets++;
    if(cfg.respMode==='manuale') return 'pend';
    const tapped = session.responses.size>0;
    let outcome, correct;
    if(trial.isTarget && tapped){ session.counts.hits++; outcome='hit'; correct=true; if(session.respTime) session.rts.push(session.respTime); }
    else if(trial.isTarget && !tapped){ session.counts.misses++; outcome='err'; correct=false; }
    else if(!trial.isTarget && tapped){ session.counts.falseAlarms++; outcome='err'; correct=false; }
    else { session.counts.correctRejections++; outcome='hit'; correct=true; }
    if(cfg.taskMode==='nback' || cfg.taskMode==='sequenza' || cfg.taskMode==='gonogo'){
      session.adaptBlock.push(correct);
      maybeAdapt();
    }
    if(cfg.taskMode==='stopsignal' && !trial.isStopTrial){
      // leva secondaria (ISI generale), alimentata solo dalle prove "go" —
      // il successo sui trial di stop resta gestito a parte dallo staircase SSD
      session.adaptBlock.push(correct);
      maybeAdapt();
    }
    if(cfg.taskMode==='stopsignal' && trial.isStopTrial){
      // staircase: fermarsi con successo → SSD più lungo (più difficile);
      // fallire lo stop → SSD più corto (più facile)
      session.currentSSD = tapped
        ? Math.max(0, session.currentSSD - cfg.ssdStep)
        : Math.min(cfg.isi-100, session.currentSSD + cfg.ssdStep);
      session.ssdHistory.push(session.currentSSD);
    }
    return outcome;
  }
  // ANT / switching: scelta 2AFC, non ha senso hit/FA — traccia solo
  // corretto/scorretto + RT, per poi scomporre per condizione a fine sessione.
  function resolveChoice(trial){
    if(cfg.respMode==='manuale') return 'pend';
    const given = [...session.responses][0] || null;
    const correct = given===trial.correctAnswer;
    session.choiceLog.push({
      correct, rt: correct ? session.respTime : null, omitted: given===null,
      isSwitch: !!trial.isSwitch, cueType: trial.cueType, congruency: trial.congruency, block: trial.block, side: trial.side
    });
    const isTapatSpatial = cfg.taskMode==='ant' && cfg.antMode==='tapat' && cfg.tapatSpatial;
    if(isTapatSpatial){
      session.spatialBlock = session.spatialBlock || [];
      session.spatialBlock.push({side:trial.side, correct});
    }
    if(cfg.taskMode==='ant' || cfg.taskMode==='switching'){
      session.adaptBlock.push(correct);
      const before = session.adaptBlock.length;
      maybeAdapt();
      // il blocco adattivo si è appena valutato e resettato (era arrivato a
      // 8): stesso momento buono per aggiornare il gradiente spaziale.
      if(isTapatSpatial && before>=8 && session.adaptBlock.length===0){
        const sb = session.spatialBlock;
        const left = sb.filter(x=>x.side==='left'), right = sb.filter(x=>x.side==='right');
        const pctLeft = left.length ? left.filter(x=>x.correct).length/left.length : 1;
        const pctRight = right.length ? right.filter(x=>x.correct).length/right.length : 1;
        const base = session.liveTapatGradient;
        let ng = base;
        if(pctLeft < pctRight - 0.15) ng = Math.min(75, base+5); // sinistra più debole -> più prove a sinistra
        else if(pctRight < pctLeft - 0.15) ng = Math.max(25, base-5);
        session.liveTapatGradient = ng;
        session.spatialBlock = [];
      }
    }
    return correct ? 'hit' : 'err';
  }
  // Doppio compito: due canali indipendenti, ciascuno con proprio target.
  function resolveDualTask(trial){
    if(!trial.valid) return null;
    if(cfg.respMode==='manuale') return 'pend';
    if(trial.visualIsTarget) session.counts.targets++; else session.counts.nonTargets++;
    if(trial.audioIsTarget) session.countsAud.targets++; else session.countsAud.nonTargets++;
    const tapV = session.responses.has('vis'), tapA = session.responses.has('aud');
    let ok = true, ch1Correct, ch2Correct;
    if(trial.visualIsTarget && tapV){ session.counts.hits++; ch1Correct=true; }
    else if(trial.visualIsTarget && !tapV){ session.counts.misses++; ok=false; ch1Correct=false; }
    else if(!trial.visualIsTarget && tapV){ session.counts.falseAlarms++; ok=false; ch1Correct=false; }
    else { session.counts.correctRejections++; ch1Correct=true; }
    if(trial.audioIsTarget && tapA){ session.countsAud.hits++; ch2Correct=true; }
    else if(trial.audioIsTarget && !tapA){ session.countsAud.misses++; ok=false; ch2Correct=false; }
    else if(!trial.audioIsTarget && tapA){ session.countsAud.falseAlarms++; ok=false; ch2Correct=false; }
    else { session.countsAud.correctRejections++; ch2Correct=true; }
    // i due canali sono valutati e adattati in modo indipendente, non con
    // un'unica media che confonderebbe quale dei due sta davvero in difficoltà
    session.adaptBlock1.push(ch1Correct);
    maybeAdaptDualChannel(1);
    session.adaptBlock2.push(ch2Correct);
    maybeAdaptDualChannel(2);
    return ok ? 'hit' : 'err';
  }
  function maybeAdaptDualChannel(channel){
    if(!cfg.adaptive) return;
    const blockKey = channel===1 ? 'adaptBlock1' : 'adaptBlock2';
    const levelKey = channel===1 ? 'dualLevel1' : 'dualLevel2';
    const block = session[blockKey];
    if(block.length < 8) return;
    const acc = block.filter(Boolean).length / block.length;
    if(acc > 0.85 && session[levelKey] < 5){
      session[levelKey]++;
      session.levelChanges.push({trialIdx:session.idx, level:session[levelKey], how:'auto', canale:channel});
    } else if(acc < 0.70 && session[levelKey] > 1){
      session[levelKey]--;
      session.levelChanges.push({trialIdx:session.idx, level:session[levelKey], how:'auto', canale:channel});
    }
    session[blockKey] = [];
  }

  // Restituisce la specifica dei pulsanti di risposta per l'esercizio
  // corrente. null per gli esercizi con etichette che dipendono dal trial
  // (switching), gestiti a parte in updateTaskScreen.
  /* ---- rendering Cancellazione/Neglect ---- */
  function mountNeglectScreen(root){
    const infoSpan = el('div',{class:'info'},['']);
    const pauseBtn = el('button',{onclick:()=>{ session.paused ? resumeTask() : pauseTask(); }},['❚❚ Pausa']);
    const topRight = [pauseBtn];
    if(cfg.adaptive){
      topRight.unshift(
        el('button',{onclick:()=>bumpLevel(-1), style:'padding:8px 11px;'},['–']),
        el('button',{onclick:()=>bumpLevel(1), style:'padding:8px 11px;'},['+'])
      );
    }
    root.appendChild(el('div',{class:'topbar'},[
      infoSpan,
      el('div',{style:'display:flex; gap:8px;'},[
        ...topRight,
        el('button',{onclick:()=>{ if(confirm('Interrompere la sessione in corso?')){ if(session.timer) clearTimeout(session.timer); view=homeView(); render(); } }},['Interrompi'])
      ])
    ]));
    const board = el('div',{class:'neglect-board'},[]);
    root.appendChild(board);
    const resp = el('div',{class:'respond'},[]);
    let doneBtn = null, manualNote = null;
    if(cfg.respMode!=='manuale'){
      doneBtn = el('button',{class:'tapbtn nomatch full', onclick:()=>{ if(session.timer) clearTimeout(session.timer); finishBoard('interrotta dall\'operatore'); }},['Fatto con questa tavola']);
      resp.appendChild(doneBtn);
    } else {
      manualNote = el('div',{style:'color:#fff; font-size:13px; opacity:.8; align-self:center;'},['Modalità manuale: conta a voce/carta i bersagli trovati per lato, poi registra il risultato.']);
      const regBtn = el('button',{class:'tapbtn match full', onclick:()=> manualRegisterBoard()},['Registra risultato tavola']);
      resp.appendChild(manualNote); resp.appendChild(regBtn);

  function manualRegisterBoard(){
    const tL = session.board.filter(b=>b.side==='left'&&b.isTarget).length;
    const tR = session.board.filter(b=>b.side==='right'&&b.isTarget).length;
    const foundLeft = parseInt(prompt('Bersagli trovati a SINISTRA (su '+tL+'):','0'),10) || 0;
    const foundRight = parseInt(prompt('Bersagli trovati a DESTRA (su '+tR+'):','0'),10) || 0;
    const falseAlarms = parseInt(prompt('Falsi allarmi (elementi sbagliati toccati/segnalati):','0'),10) || 0;
    session.results.push({
      targetsLeft:tL, targetsRight:tR,
      foundLeft:Math.min(foundLeft,tL), foundRight:Math.min(foundRight,tR),
      falseAlarms, timeMs:performance.now()-session.boardStartTime, reason:'manuale'
    });
    session.boardIdx++;
    nextBoard();
  }

  /* ---- rendering esercizi sequenziali (n-back, sequenza, gonogo, stopsignal, ant, switching, dualtask) ---- */
  function respondSpec(){
    switch(cfg.taskMode){
      case 'gonogo':
        return [{action:'go', label: cfg.respMode==='operatore' ? 'Il paziente risponde' : 'GO — rispondi', cls:'match', full:true}];
      case 'stopsignal':
        return [{action:'go', label: cfg.respMode==='operatore' ? 'Il paziente risponde' : 'GO — il più veloce possibile', cls:'match', full:true}];
      case 'ant': {
        if(cfg.antMode==='tapat') return [{action:'go', label:'Rilevato — tocca appena lo vedi', cls:'match', full:true}];
        const tokens = ANT_MATERIAL_TOKENS[cfg.antMaterial];
        return tokens
          ? [{action:'left', label:'◀ '+tokens[0], cls:'match'}, {action:'right', label:tokens[1]+' ▶', cls:'nomatch'}]
          : [{action:'left', label:'◀ Sinistra', cls:'match'}, {action:'right', label:'Destra ▶', cls:'nomatch'}];
      }
      case 'switching':
        return [{action:'a', label:'—', cls:'match'}, {action:'b', label:'—', cls:'nomatch'}];
      case 'dualtask': {
        const pairing = cfg.dualPairing || 'vis-aud';
        if(pairing==='vis-vis') return [{action:'vis', label:'Ripetuto a sinistra ('+STIM_LABELS[cfg.dualVisual]+')', cls:'match'}, {action:'aud', label:'Ripetuto a destra ('+STIM_LABELS[cfg.dualVisual2]+')', cls:'nomatch'}];
        if(pairing==='aud-aud') return [{action:'vis', label:'Ripetuto il tono grave', cls:'match'}, {action:'aud', label:'Ripetuto il tono acuto', cls:'nomatch'}];
        return [{action:'vis', label:'Ripetuto '+STIM_LABELS[cfg.dualVisual].toLowerCase(), cls:'match'}, {action:'aud', label:'Ripetuto il suono', cls:'nomatch'}];
      }
      default: { // nback, sequenza — un solo pulsante: l'assenza di tocco
        // è già di per sé la risposta "nessuna corrispondenza" (rifiuto
        // corretto), come nel CPT/n-back standard. Un secondo pulsante
        // "nessuna corrispondenza" non verrebbe distinto dal primo nello
        // scoring (qualunque tocco = "ha risposto") e quindi un tocco
        // esplicito di "no" finirebbe per essere contato come un "sì".
        const isSeq = cfg.taskMode==='sequenza';
        const matchLabel = isSeq
          ? (cfg.respMode==='operatore' ? "Il paziente segnala: sequenza appena avvenuta" : "È appena avvenuta la sequenza")
          : (cfg.respMode==='operatore' ? 'Il paziente indica corrispondenza' : 'Corrispondenza (n='+cfg.nLevel+')');
        return [{action:'match', label:matchLabel, cls:'match', full:true}];
      }
    }
  }

  function flashTap(btn){
    if(!btn) return;
    btn.classList.add('tapped');
    setTimeout(()=> btn.classList.remove('tapped'), 180);
  }
  function updateTaskScreen(){
    const d = taskDom;
    const trial = session.idx>=0 && session.idx<session.seq.length ? session.seq[session.idx] : null;
    const genericLevelKey = adaptLevelKey();
    const modeLabel = cfg.taskMode==='sequenza' ? 'sequenza bersaglio'+(cfg.adaptive?' · livello '+session.adaptLevel:'')
      : cfg.taskMode==='nback' ? 'n='+session.liveNLevel+(cfg.adaptive?' (adattivo)':'')
      : cfg.taskMode==='gonogo' ? 'go/no-go'+(cfg.adaptive?' · livello '+session.adaptLevel:'')
      : cfg.taskMode==='stopsignal' ? 'SSD '+Math.round(session.currentSSD)+'ms'+(cfg.adaptive?' · ritmo livello '+session.adaptLevel:'')
      : (cfg.taskMode==='ant' && cfg.antMode==='tapat' && trial) ? 'TAPAT — blocco '+(trial.block==='tonic'?'tonico':'fasico')+' · livello '+session.tapatLevel+(cfg.adaptive?' (adattivo)':'')
      : (cfg.taskMode==='ant' && cfg.antMode==='classico') ? 'ANT'+(cfg.adaptive?' · livello '+session.adaptLevel:'')
      : (cfg.taskMode==='switching' || cfg.taskMode==='dualtask') && cfg.adaptive ? EXERCISES[cfg.taskMode].label+' · livello '+session.adaptLevel
      : EXERCISES[cfg.taskMode].label;
    d.infoSpan.textContent = 'prova '+(Math.min(session.idx+1,cfg.trials))+' / '+cfg.trials+' · '+modeLabel+
      ((EXERCISES[cfg.taskMode].usesStimType && !(cfg.taskMode==='ant' && cfg.antMode==='classico')) ? ' · '+STIM_LABELS[cfg.stimType] : '');
    d.pauseBtn.textContent = session.paused ? '▶ Riprendi' : '❚❚ Pausa';

    // switching: le etichette dei pulsanti dipendono dalla regola del trial corrente
    if(cfg.taskMode==='switching' && trial && d.btns.length===2){
      d.btns[0].textContent = trial.ruleDef.labelA;
      d.btns[1].textContent = trial.ruleDef.labelB;
    }
    if(cfg.taskMode==='nback' && d.btns.length===1 && cfg.respMode!=='operatore'){
      d.btns[0].textContent = 'Corrispondenza (n='+session.liveNLevel+')';
    }

    d.stimSlot.innerHTML='';
    if(session.paused){
      d.stimSlot.appendChild(el('div',{class:'blank'},['❚❚ in pausa']));
    } else if(session.showStopCue){
      d.stimSlot.appendChild(el('div',{class:'stopcue-full'},['STOP']));
    } else if(trial && session.phase==='cue' && cfg.taskMode==='switching'){
      d.stimSlot.appendChild(el('div',{style:'color:var(--accent); font-size:18px; letter-spacing:.08em; font-weight:700;'},[trial.ruleDef.label.toUpperCase()+'?']));
    } else if(trial && session.phase==='show'){
      d.stimSlot.appendChild(renderStimulusNode(trial));
    } else {
      d.stimSlot.appendChild(el('div',{class:'blank'},['· · ·']));
    }

    d.trail.innerHTML='';
    if(cfg.showTrail){
      session.trail.slice(-16).forEach(t=> d.trail.appendChild(el('div',{class:'chip '+t.outcome})));
    }

    const canRespond = cfg.respMode!=='manuale' && !session.paused &&
      (cfg.taskMode==='dualtask' ? true : session.responses.size===0);
    d.btns.forEach(b=>{
      const already = cfg.taskMode==='dualtask' ? session.responses.has(b.dataset.action) : false;
      b.style.opacity = (canRespond && !already) ? '1' : '.55';
      b.style.pointerEvents = session.paused ? 'none' : 'auto';

  }
  function renderStimulusNode(trial){
    if(cfg.taskMode==='ant' && cfg.antMode==='tapat'){
      const outer = el('div',{style:'display:flex; width:100%; justify-content:'+(trial.side==='left'?'flex-start':trial.side==='right'?'flex-end':'center')+'; padding:0 8vw;'});
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:18px;'});
      if(trial.cueType==='center') wrap.appendChild(el('div',{style:'color:var(--accent); font-size:28px;'},['✦']));
      if(cfg.stimType==='colori'){
        wrap.appendChild(el('div',{class:'colorcircle', style:'width:110px; height:110px; background:'+trial.val.hex+';'},[]));
      } else if(cfg.stimType==='suoni'){
        wrap.appendChild(el('div',{class:'audio-pulse active'},['♪']));
      } else if(cfg.stimType==='simboli'){
        wrap.appendChild(el('div',{class:'stimulus symbolwrap'},[seqLabel(trial.val)]));
      } else {
        wrap.appendChild(el('div',{class:'stimulus'},[seqLabel(trial.val)]));
      }
      outer.appendChild(wrap);
      return outer;
    }
    if(cfg.taskMode==='ant'){
      const target = d=>{
        if(!trial.tokens) return d==='left' ? '◀' : '▶'; // frecce (default)
        return d==='left' ? trial.tokens[0] : trial.tokens[1];
      };
      const neutralGlyph = trial.tokens ? (trial.material==='lettere' ? 'X' : '▲') : '–';
      let flankers;
      if(trial.congruency==='congruent') flankers = target(trial.targetDir);
      else if(trial.congruency==='incongruent') flankers = target(trial.targetDir==='left'?'right':'left');
      else flankers = neutralGlyph;
      const row = flankers+flankers+target(trial.targetDir)+flankers+flankers;
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:18px;'});
      if(trial.cueType!=='none') wrap.appendChild(el('div',{style:'color:'+ (trial.cueType==='spatial'? 'var(--accent)':'rgba(255,255,255,.6)') +'; font-size:28px;'},[trial.cueType==='spatial' ? (trial.side==='left'?'◀':'▶') : '✦']));
      wrap.appendChild(el('div',{class:'stimulus symbolwrap', style: trial.cueType==='spatial' ? ('align-self:'+(trial.side==='left'?'flex-start':'flex-end')) : ''},[row]));
      return wrap;
    }
    if(cfg.taskMode==='switching'){
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:14px;'});
      wrap.appendChild(el('div',{style:'color:var(--accent); font-size:16px; letter-spacing:.08em; font-weight:700;'},[trial.ruleDef.label.toUpperCase()+'?']));
      if(cfg.switchMaterial==='colori'){
        wrap.appendChild(el('div',{class:'colorcircle', style:'width:140px; height:140px; background:'+trial.val.hex+';'},[]));
      } else if(trial.sizeVariant){
        const sizePx = trial.sizeVariant==='grande' ? 'min(28vw,220px)' : 'min(9vw,64px)';
        wrap.appendChild(el('div',{class:'stimulus', style:'font-size:'+sizePx+' !important;'},[seqLabel(trial.val)]));
      } else {
        wrap.appendChild(el('div',{class:'stimulus'},[seqLabel(trial.val)]));
      }
      return wrap;
    }
    if(cfg.taskMode==='dualtask'){
      const pairing = cfg.dualPairing || 'vis-aud';
      function visualNode(material, val, big){
        if(material==='colori') return el('div',{class:'colorcircle', style:'width:'+(big?'120px':'90px')+'; height:'+(big?'120px':'90px')+'; background:'+val.hex+';'},[]);
        return el('div',{class:'stimulus', style:'font-size:'+(big?'min(20vw,140px)':'min(14vw,90px)')+' !important;'},[seqLabel(val)]);
      }
      if(pairing==='vis-vis'){
        const wrap = el('div',{style:'display:flex; align-items:center; justify-content:center; gap:40px; width:100%;'});
        wrap.appendChild(visualNode(cfg.dualVisual, trial.visualVal, true));
        wrap.appendChild(el('div',{style:'width:2px; height:60px; background:rgba(255,255,255,.2);'},[]));
        wrap.appendChild(visualNode(cfg.dualVisual2, trial.audioVal, true));
        return wrap;
      }
      if(pairing==='aud-aud'){
        const wrap = el('div',{style:'display:flex; align-items:center; justify-content:center; gap:40px;'});
        wrap.appendChild(el('div',{class:'audio-pulse active', style:'width:80px;height:80px;font-size:28px;'},['♪ grave']));
        wrap.appendChild(el('div',{class:'audio-pulse active', style:'width:80px;height:80px;font-size:28px;'},['♪ acuto']));
        return wrap;
      }
      const wrap = el('div',{style:'display:flex; flex-direction:column; align-items:center; gap:10px;'});
      wrap.appendChild(visualNode(cfg.dualVisual, trial.visualVal, true));
      wrap.appendChild(el('div',{class:'audio-pulse active', style:'width:64px;height:64px;font-size:24px;'},['♪']));
      return wrap;
    }
    if(cfg.stimType==='simboli'){
      return el('div',{class:'stimulus symbolwrap'},[trial.val]);
    }
    if(cfg.stimType==='parole'){
      return el('div',{class:'stimulus word'},[trial.val]);
    }
    if(cfg.stimType==='suoni'){
      return el('div',{class:'audio-pulse active'},['♪']);
    }
    if(cfg.stimType==='colori'){
      return el('div',{class:'colorcircle', style:'background:'+trial.val.hex+';'},[]);
    }
    return el('div',{class:'stimulus'},[trial.val]);
  }

  /* ---- Motore Compiti a obiettivi: elenco di elementi con vincoli/regole/

  function startGoalTaskSession(){

  /* ---- Motore Strategie di memoria: fase di studio (testo o lista

  function startMemoriaSession(){

    session = { material, phase:'studio', pqrstStep:0, recall:{}, startedAtWall:Date.now() };
    view='task'; render();
  }
  function mountMemoriaScreen(root){

    root.appendChild(el('div',{class:'topbar'},[

  function updateMemoriaScreen(){
    const {infoSpan, content} = taskDom;
    const m = session.material;
    const isChunking = cfg.memoriaModo==='chunking';
    content.innerHTML = '';
    if(session.phase==='studio'){
      infoSpan.textContent = 'Livello '+m.livello+' · '+(isChunking?'chunking':'PQRST')+' · fase di studio';
      if(isChunking){
        content.appendChild(el('div',{style:'font-size:22px; line-height:1.8; text-align:center; padding:24px; background:var(--paper-dim); border-radius:12px;'},[m.parole.join('  ·  ')]));
        const stratBox = el('div',{style:'background:var(--paper-dim2, var(--paper-dim)); border-left:3px solid var(--signal); border-radius:8px; padding:12px 16px; margin-top:14px; font-size:14px; line-height:1.5;'});
        if(m.categorizzata){
          stratBox.appendChild(el('div',{style:'font-weight:600; margin-bottom:4px;'},['Suggerimento — chunking per categoria']));
          stratBox.appendChild(el('div',{},['Queste parole appartengono tutte alla categoria "'+m.categoria+'": raggruppale mentalmente in un unico blocco invece di ricordarle una per una — ricorda "un gruppo di '+m.categoria+'", non '+m.parole.length+' parole slegate.']));
        } else {
          stratBox.appendChild(el('div',{style:'font-weight:600; margin-bottom:4px;'},['Suggerimento — costruisci tu il raggruppamento']));
          stratBox.appendChild(el('div',{},['Queste parole non condividono una categoria ovvia: prova a creare tu piccoli gruppi (2-3 parole) legandole con un\'immagine mentale o una breve storia che le colleghi, invece di ripeterle in ordine.']));
        }
        content.appendChild(stratBox);
        const rowbtns = el('div',{class:'rowbtns'});
        rowbtns.appendChild(el('button',{class:'ghost', onclick:()=>{ speak(m.parole.join(', ')); }},['🔊 Ascolta']));
        content.appendChild(rowbtns);
        content.appendChild(el('button',{class:'primary', style:'margin-top:18px;', onclick:()=>{
          try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
          session.phase='richiamo'; updateMemoriaScreen();
        }},['Pronto — passa al richiamo →']));
      } else {
        // PQRST vero: quattro passaggi guidati (Preview, Question, Read,
        // State) prima del richiamo, che fa da quinto passaggio (Test).
        const steps = ['preview','question','read','state'];
        const stepIdx = session.pqrstStep || 0;
        const stepKey = steps[stepIdx];

  function rtMeanOf(items){
    const v = items.filter(x=>x!=null);
    return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
  }
  async function completeAndSave(durationMs){
    const family = EXERCISES[cfg.taskMode].family;
    const rec = {
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      ts: Date.now(), dateLabel: todayStr(),
      stimType: cfg.stimType, nLevel: cfg.nLevel, trials: cfg.trials, isi: cfg.isi, stimDuration: cfg.stimDuration,
      respMode: cfg.respMode, patientCode: cfg.patientCode, notes: cfg.notes,
      taskMode: cfg.taskMode, targetSeq: EXERCISES[cfg.taskMode].usesTargetSeq ? cfg.targetSeq.map(seqLabel) : null,
      antMode: cfg.taskMode==='ant' ? cfg.antMode : null,
      localPatientId: patientProfile ? null : (activeLocalPatientId || null),
      pazienteId: (!patientProfile && activeRemotePatientId) ? activeRemotePatientId : null,
      durationMs, family
    };
    if(family==='signal'){
      const avgRT = rtMeanOf(session.rts);
      rec.counts = session.counts; rec.metrics = scoreFromCounts(session.counts); rec.avgRT = avgRT;
      if(cfg.taskMode==='stopsignal' && session.ssdHistory.length){
        const meanSSD = rtMeanOf(session.ssdHistory);
        rec.meanSSD = meanSSD;
        rec.ssrt = (avgRT!=null && meanSSD!=null) ? Math.max(0, avgRT-meanSSD) : null;
      }
      if(cfg.taskMode==='nback'){
        rec.finalNLevel = session.liveNLevel;
        rec.adaptive = cfg.adaptive;
        rec.levelChanges = session.levelChanges.length ? session.levelChanges : null;
      }
    } else if(family==='choice'){
      const log = session.choiceLog;
      const total = log.length, correct = log.filter(x=>x.correct).length, omitted = log.filter(x=>x.omitted).length;
      rec.choice = { total, correct, omitted, accuracy: total? correct/total : null, meanRT: rtMeanOf(log.map(x=>x.rt)) };
      if(cfg.taskMode==='ant'){
        const rtBy = (key,val)=> rtMeanOf(log.filter(x=>x[key]===val && x.correct).map(x=>x.rt));
        const noneRT=rtBy('cueType','none'), centerRT=rtBy('cueType','center'), spatialRT=rtBy('cueType','spatial');
        const congRT=rtBy('congruency','congruent'), incongRT=rtBy('congruency','incongruent');
        rec.choice.alerting = (noneRT!=null && centerRT!=null) ? Math.round(noneRT-centerRT) : null;
        rec.choice.orienting = (centerRT!=null && spatialRT!=null) ? Math.round(centerRT-spatialRT) : null;
        rec.choice.conflict = (congRT!=null && incongRT!=null) ? Math.round(incongRT-congRT) : null;
        if(cfg.antMode==='tapat'){
          const tonicTrials = log.filter(x=>x.block==='tonic');
          const phasicTrials = log.filter(x=>x.block==='phasic');
          rec.choice.tonicMeanRT = rtMeanOf(tonicTrials.filter(x=>x.correct).map(x=>x.rt));
          rec.choice.tonicOmissions = tonicTrials.filter(x=>x.omitted).length;
          rec.choice.tonicTotal = tonicTrials.length;
          rec.choice.phasicMeanRT = rtMeanOf(phasicTrials.filter(x=>x.correct).map(x=>x.rt));
          rec.choice.finalTapatLevel = session.tapatLevel;
          rec.choice.adaptive = cfg.adaptive;
        }
      }
      if(cfg.taskMode==='switching'){
        const swRT = rtMeanOf(log.filter(x=>x.isSwitch && x.correct).map(x=>x.rt));
        const repRT = rtMeanOf(log.filter(x=>!x.isSwitch && x.correct).map(x=>x.rt));
        rec.choice.switchCost = (swRT!=null && repRT!=null) ? Math.round(swRT-repRT) : null;
      }
    } else if(family==='dual'){
      rec.counts = session.counts; rec.metrics = scoreFromCounts(session.counts);
      rec.countsAud = session.countsAud; rec.metricsAud = scoreFromCounts(session.countsAud);
    } else if(family==='spatial'){
      const r = session.results;
      const sum = k=> r.reduce((a,b)=>a+b[k],0);
      const tL=sum('targetsLeft'), tR=sum('targetsRight'), fL=sum('foundLeft'), fR=sum('foundRight'), fa=sum('falseAlarms');
      rec.neglect = {
        boards:r.length, targetsLeft:tL, targetsRight:tR, foundLeft:fL, foundRight:fR,
        omittedLeft:tL-fL, omittedRight:tR-fR,
        pctLeft: tL? fL/tL : null, pctRight: tR? fR/tR : null,
        falseAlarms:fa, meanTimeMs: rtMeanOf(r.map(x=>x.timeMs)),
        asymmetry: (tL && tR) ? Math.round(((fL/tL)-(fR/tR))*100) : null // negativo = più omissioni a sinistra
      };
    } else if(family==='goaltask'){
      const score = scoreGoalTask(session);
      rec.goaltask = {
        scenario: cfg.goaltaskScenario, scenarioLabel: session.scenario.label, livello: cfg.goaltaskLivello,
        completatiCount: score.completatiCount, totaleElementi: score.totaleElementi,
        percentualeCompletamento: score.percentualeCompletamento,
        violazioniCount: score.violazioniCount, tempoImpiegatoSec: score.tempoImpiegatoSec,
        budgetRispettato: score.budgetRispettato, budgetSecondi: session.scenario.budgetSecondi || null,
        violazioni: session.violazioni
      };
    } else if(family==='memoria'){
      const m = session.material;
      const totale = cfg.memoriaModo==='chunking' ? m.parole.length : m.unita.length;
      const recuperati = Object.values(session.recall).filter(Boolean).length;
      rec.memoria = {
        modo: cfg.memoriaModo, livello: m.livello,
        titolo: cfg.memoriaModo==='chunking' ? null : m.titolo,
        recuperati, totale, percentuale: totale ? Math.round((recuperati/totale)*100) : 0,
        dettaglioRichiamo: session.recall
      };
    }
    lastResult = rec;
    await saveSession(rec);
    // continuità: ricorda l'ultima configurazione usata per questo profilo,
    // così la prossima volta che lo si riprende parte da qui, non dai default
    // riporta il livello raggiunto nella config, così "Ripeti" e la
    // continuità del profilo partono davvero da dove ci si era fermati
    if(cfg.taskMode==='nback') cfg.nLevel = session.liveNLevel;
    else if(cfg.taskMode==='ant' && cfg.antMode==='tapat') cfg.tapatStartLevel = session.tapatLevel;
    else if(cfg.taskMode==='neglect') cfg.neglectStartLevel = session.liveBoardLevel;
    else if(adaptLevelKey()==='adaptLevel') cfg.adaptStartLevel = session.adaptLevel;
    if(cfg.taskMode==='dualtask'){ cfg.dualStartLevel1 = session.dualLevel1; cfg.dualStartLevel2 = session.dualLevel2; }
    const snap = presetCfgOf(cfg);
    const lastAcc = primaryAccuracyOf(rec);
    if(lastAcc!=null) snap.lastAccuracy = lastAcc;
    if(!patientProfile && activeLocalPatientId){ updateLocalPatientConfig(activeLocalPatientId, snap); }
    else if(patientProfile){ saveRemotePatientConfig(patientProfile.id, snap); }
    if(patientProfile) cachedTodayUsage = null; // forza il ricalcolo del limite giornaliero
    else if(!patientProfile && activeRemotePatientId){ saveRemotePatientConfig(activeRemotePatientId, snap); }
    view='results'; render();
  }

  function ScreenManualEntry(root){
    root.appendChild(el('div',{class:'brand'},[el('div',{class:'mark'},['Traccia',el('span',{},['N'])])]));
    const s = el('div',{class:'screen'});
    const card = el('div',{class:'card'});
    card.appendChild(el('h2',{},['Inserimento manuale dei risultati']));
    card.appendChild(el('p',{class:'hint'},['La sequenza è stata presentata senza raccolta automatica delle risposte. Inserisci i conteggi osservati durante la sessione.']));

    const family = EXERCISES[cfg.taskMode].family;
    const noteWrap = el('div',{class:'field'});
    noteWrap.appendChild(el('label',{},['Note cliniche (facoltativo)']));
    const noteInp = el('input',{type:'text', placeholder:'osservazioni sulla prestazione'});
    noteInp.addEventListener('input', e=> cfg.notes = e.target.value);
    noteWrap.appendChild(noteInp);

    if(family==='signal'){
      const totalValid = session.seq.filter(t=>t.valid).length;
      const targets = session.seq.filter(t=>t.valid && t.isTarget).length;
      card.appendChild(el('p',{class:'hint'},['Prove valide: '+totalValid+' · da rispondere: '+targets+' · da non rispondere: '+(totalValid-targets)]));
      const manual = {hits:0, misses:0, falseAlarms:0, correctRejections:0, targets, nonTargets: totalValid-targets};
      const grid = el('div',{class:'grid'});
      const labels = {hits:'Risposte corrette (hit)', misses:'Mancate risposte (miss)', falseAlarms:'Falsi allarmi', correctRejections:'Rifiuti corretti'};
      ['hits','misses','falseAlarms','correctRejections'].forEach(k=>{
        grid.appendChild(field(labels[k], stepper(0,0,80,v=>{ manual[k]=v; }, 1)));
      });
      card.appendChild(grid); card.appendChild(noteWrap);
      card.appendChild(el('button',{class:'primary', onclick:async ()=>{
        session.counts = manual;
        await completeAndSave(Date.now()-session.startedAt);
      }},['Salva risultati']));
    } else if(family==='choice'){
      const totalValid = session.seq.filter(t=>t.valid).length;
      card.appendChild(el('p',{class:'hint'},['Prove totali: '+totalValid]));
      let correct=0, errors=0, omitted=0;
      const grid = el('div',{class:'grid'});
      grid.appendChild(field('Risposte corrette', stepper(0,0,120,v=>{correct=v;},1)));
      grid.appendChild(field('Risposte errate', stepper(0,0,120,v=>{errors=v;},1)));
      grid.appendChild(field('Risposte omesse', stepper(0,0,120,v=>{omitted=v;},1)));
      card.appendChild(grid); card.appendChild(noteWrap);
      card.appendChild(el('p',{class:'hint'},['In modalità manuale non è possibile calcolare la scomposizione per condizione (allerta/orienting/conflitto o switch cost) — solo l\'accuratezza complessiva.']));
      card.appendChild(el('button',{class:'primary', onclick:async ()=>{
        const log = [];
        for(let i=0;i<correct;i++) log.push({correct:true, rt:null, omitted:false});
        for(let i=0;i<errors;i++) log.push({correct:false, rt:null, omitted:false});
        for(let i=0;i<omitted;i++) log.push({correct:false, rt:null, omitted:true});
        session.choiceLog = log;
        await completeAndSave(Date.now()-session.startedAt);
      }},['Salva risultati']));
    } else { // dual
      card.appendChild(el('p',{class:'hint'},['Inserisci i conteggi separatamente per canale visivo e uditivo.']));
      const manualV = {hits:0, misses:0, falseAlarms:0, correctRejections:0};
      const manualA = {hits:0, misses:0, falseAlarms:0, correctRejections:0};
      const labels = {hits:'Hit', misses:'Miss', falseAlarms:'Falsi allarmi', correctRejections:'Rifiuti corretti'};
      card.appendChild(el('label',{},['Canale visivo']));
      const gridV = el('div',{class:'grid'});
      ['hits','misses','falseAlarms','correctRejections'].forEach(k=> gridV.appendChild(field(labels[k], stepper(0,0,80,v=>{manualV[k]=v;},1))));
      card.appendChild(gridV);
      card.appendChild(el('label',{},['Canale uditivo']));
      const gridA = el('div',{class:'grid'});
      ['hits','misses','falseAlarms','correctRejections'].forEach(k=> gridA.appendChild(field(labels[k], stepper(0,0,80,v=>{manualA[k]=v;},1))));
      card.appendChild(gridA);
      card.appendChild(noteWrap);
      card.appendChild(el('button',{class:'primary', onclick:async ()=>{
        session.counts = manualV; session.countsAud = manualA;
        await completeAndSave(Date.now()-session.startedAt);
      }},['Salva risultati']));
    }

    s.appendChild(card); root.appendChild(s);
  }

  function ScreenResults(root){

        : (r.family==='memoria')

    ]));

    function metric(n,l){ return el('div',{class:'metric'},[el('div',{class:'n'},[n]),el('div',{class:'l'},[l])]); }

    if(r.family==='choice'){
      mg.appendChild(metric(r.choice.correct+' / '+r.choice.total, 'Risposte corrette'));
      mg.appendChild(metric(fmtPct(r.choice.accuracy), 'Accuratezza'));
      mg.appendChild(metric(String(r.choice.omitted), 'Omesse'));
      if(r.choice.meanRT!=null) mg.appendChild(metric(Math.round(r.choice.meanRT)+' ms', 'RT medio (corrette)'));
      if(r.choice.alerting!=null) mg.appendChild(metric(r.choice.alerting+' ms', 'Indice allerta'));
      if(r.choice.orienting!=null) mg.appendChild(metric(r.choice.orienting+' ms', 'Indice orienting'));
      if(r.choice.conflict!=null) mg.appendChild(metric(r.choice.conflict+' ms', 'Indice conflitto'));
      if(r.choice.tonicMeanRT!=null) mg.appendChild(metric(Math.round(r.choice.tonicMeanRT)+' ms', 'RT medio — blocco tonico'));
      if(r.choice.tonicTotal!=null) mg.appendChild(metric(r.choice.tonicOmissions+' / '+r.choice.tonicTotal, 'Omissioni — blocco tonico'));
      if(r.choice.phasicMeanRT!=null) mg.appendChild(metric(Math.round(r.choice.phasicMeanRT)+' ms', 'RT medio — blocco fasico'));
      if(r.choice.adaptive && r.choice.finalTapatLevel!=null) mg.appendChild(metric('livello '+r.choice.finalTapatLevel, 'Difficoltà finale (adattiva)'));
      if(r.choice.switchCost!=null) mg.appendChild(metric(r.choice.switchCost+' ms', 'Switch cost'));
    } else if(r.family==='dual'){
      mg.appendChild(metric(fmtPct(r.metrics.acc), 'Accuratezza visiva'));
      mg.appendChild(metric(fmtPct(r.metricsAud.acc), 'Accuratezza uditiva'));
      mg.appendChild(metric(r.metrics.dprime!=null? r.metrics.dprime.toFixed(2):'—', "d′ visivo"));
      mg.appendChild(metric(r.metricsAud.dprime!=null? r.metricsAud.dprime.toFixed(2):'—', "d′ uditivo"));
    } else if(r.family==='spatial'){
      const ng = r.neglect;
      mg.appendChild(metric(fmtPct(ng.pctLeft), 'Trovati a sinistra'));
      mg.appendChild(metric(fmtPct(ng.pctRight), 'Trovati a destra'));
      mg.appendChild(metric(ng.omittedLeft+' / '+ng.omittedRight, 'Omessi (sin. / des.)'));
      if(ng.asymmetry!=null) mg.appendChild(metric((ng.asymmetry>0?'+':'')+ng.asymmetry+' pt', 'Asimmetria (– = più omissioni a sin.)'));
      mg.appendChild(metric(String(ng.falseAlarms), 'Falsi allarmi'));
      if(ng.meanTimeMs!=null) mg.appendChild(metric(fmtTime(ng.meanTimeMs), 'Tempo medio/tavola'));
    } else if(r.family==='goaltask'){
      const g = r.goaltask;
      mg.appendChild(metric(g.completatiCount+' / '+g.totaleElementi, 'Elementi completati'));
      mg.appendChild(metric(g.percentualeCompletamento+'%', 'Completamento'));
      mg.appendChild(metric(String(g.violazioniCount), 'Violazioni di regola'));
      if(g.budgetSecondi) mg.appendChild(metric(g.budgetRispettato?'Sì':'No', 'Budget di tempo rispettato'));
      mg.appendChild(metric(fmtTime(g.tempoImpiegatoSec*1000), 'Tempo impiegato'));
    } else if(r.family==='memoria'){
      const m = r.memoria;
      mg.appendChild(metric(m.recuperati+' / '+m.totale, m.modo==='chunking'?'Parole recuperate':'Idee recuperate'));
      mg.appendChild(metric(m.percentuale+'%', 'Richiamo'));
      mg.appendChild(metric('Livello '+m.livello, 'Difficoltà materiale'));
    } else { // signal
      mg.appendChild(metric(r.counts.hits+' / '+(r.counts.hits+r.counts.misses), 'Hit / target'));
      mg.appendChild(metric(String(r.counts.falseAlarms), 'Falsi allarmi'));
      mg.appendChild(metric(fmtPct(r.metrics.acc), 'Accuratezza'));
      mg.appendChild(metric(r.metrics.dprime!=null? r.metrics.dprime.toFixed(2):'—', "d′"));
      if(r.avgRT!=null) mg.appendChild(metric(Math.round(r.avgRT)+' ms', 'RT medio (hit)'));
      if(r.ssrt!=null) mg.appendChild(metric(Math.round(r.ssrt)+' ms', 'SSRT (stima)'));
      if(r.taskMode==='nback' && r.finalNLevel!=null && r.finalNLevel!==r.nLevel){
        mg.appendChild(metric(r.nLevel+' → '+r.finalNLevel, 'Livello (iniziale → finale)'));
      }
    }
    mg.appendChild(metric(fmtTime(r.durationMs), 'Durata'));
    card.appendChild(mg);

    const rowbtns = el('div',{class:'rowbtns'});
    rowbtns.appendChild(el('button',{class:'primary', onclick:()=>{ view='instructions'; render(); }},['↻ Ripeti (stesso esercizio)']));
    rowbtns.appendChild(el('button',{class:'ghost', onclick:()=>{ view=homeView(); render(); }},['Cambia esercizio']));
    rowbtns.appendChild(el('button',{class:'ghost', onclick:()=>{ view='history'; render(); }},['Storico']));
    card.appendChild(rowbtns);

    s.appendChild(card); root.appendChild(s);
  }

  /* ---------- VISTA PAZIENTE (semplificata) ---------- */
  // Gli obiettivi sono ora una LISTA (0, 1 o più per paziente — facoltativi:
  // se vuota, il paziente si allena normalmente senza barre). Ogni voce è di
  // due tipi possibili: 'livello' (come prima: un livello target su un
  // esercizio specifico) oppure 'tempo' (minuti di allenamento accumulati,
  // a settimana o in totale — non legato a un esercizio in particolare).
  // Il campo su Supabase resta 'obiettivo' (jsonb) per non richiedere una
  // migrazione: prima conteneva un singolo oggetto, ora un array di oggetti.
  function normalizeGoals(raw){
    if(!raw) return [];
    const arr = Array.isArray(raw) ? raw : [raw];
    return arr.map(g=> g.tipo ? g : Object.assign({tipo:'livello'}, g)); // formato vecchio senza 'tipo' esplicito
  }
  function computeLevelGoalProgress(g, uc){
    const exLabel = EXERCISES[g.taskMode] ? EXERCISES[g.taskMode].label : g.taskMode;
    if(!uc || uc.taskMode !== g.taskMode) return {percentuale:0, etichetta:'Livello '+g.livelloTarget+' su '+exLabel+' (non ancora iniziato)'};
    let livelloAttuale;
    if(g.taskMode==='nback') livelloAttuale = uc.nLevel;
    else if(g.taskMode==='ant' && uc.antMode==='tapat') livelloAttuale = uc.tapatStartLevel;
    else if(g.taskMode==='neglect') livelloAttuale = uc.neglectStartLevel;
    else livelloAttuale = uc.adaptStartLevel;
    livelloAttuale = livelloAttuale || 1;
    // Posizione continua all'interno del livello, invece di un salto secco
    // ogni 20%: usa l'accuratezza dell'ultima sessione rispetto alle stesse
    // soglie 70-85% (Wilson et al., 2019) che già guidano la titolazione
    // automatica di questo esercizio — riflette quindi l'interazione reale
    // fra i parametri che cambiano insieme al livello (ISI, frequenza,
    // quantità elementi...), non solo il numero di livello raggiunto.
    let posFinale;
    if(livelloAttuale >= g.livelloTarget){
      posFinale = g.livelloTarget;
    } else if(g.taskMode==='stopsignal' || uc.lastAccuracy==null){
      posFinale = livelloAttuale - 1; // niente accuratezza disponibile (o Stop-Signal, che usa lo staircase SSD verso il 50%, non la regola 70-85%): resta il gradino secco
    } else {
      const frac = Math.max(0, Math.min(1, (uc.lastAccuracy - 0.70) / (0.85 - 0.70)));
      posFinale = (livelloAttuale - 1) + frac;
    }
    const pct = Math.round(Math.max(0, Math.min(100, (posFinale/g.livelloTarget)*100)));
    return {percentuale:pct, etichetta:'Livello '+livelloAttuale+' di '+g.livelloTarget+' — '+exLabel};
  }
  let cachedGoalTimeUsage = {}; // { [goalId]: minuti accumulati nel periodo, o null mentre carica }
  async function loadGoalTimeUsage(g){
    if(!sb || !cloudUser){ cachedGoalTimeUsage[g.id] = 0; return; }
    try{
      let query = sb.from('sessioni').select('duration_ms').eq('paziente_id', cloudUser.id);
      if(g.periodo==='settimana') query = query.gte('ts', Date.now() - 7*24*60*60*1000);
      const { data, error } = await query;
      if(error) throw error;
      cachedGoalTimeUsage[g.id] = Math.round(data.reduce((s,r)=> s+(r.duration_ms||0),0)/60000);
    }catch(e){ cachedGoalTimeUsage[g.id] = 0; }
  }
  function computeTimeGoalProgress(g){
    const periodoLabel = g.periodo==='settimana' ? 'questa settimana' : 'in totale';
    if(cachedGoalTimeUsage[g.id]===undefined){
      cachedGoalTimeUsage[g.id] = null;
      loadGoalTimeUsage(g).then(()=> render());
      return {percentuale:0, etichetta:'Tempo di allenamento '+periodoLabel+' — caricamento…'};
    }
    const minuti = cachedGoalTimeUsage[g.id] || 0;
    const pct = Math.round(Math.max(0, Math.min(100, (minuti/g.minutiTarget)*100)));
    return {percentuale:pct, etichetta:minuti+' di '+g.minutiTarget+' minuti '+periodoLabel};
  }
  // Restituisce un array di {percentuale, etichetta}, uno per ogni obiettivo
  // impostato dall'operatore (può essere vuoto: nessun obiettivo è la norma).
  function computeGoalsProgress(p){
    if(!p) return [];
    const goals = normalizeGoals(p.obiettivo);
    return goals.map(g=> g.tipo==='tempo' ? computeTimeGoalProgress(g) : computeLevelGoalProgress(g, p.ultima_config)).filter(Boolean);
  }
  let cachedTodayUsage = null; // {count, minuti}, null = non ancora caricato per oggi
  async function loadTodayUsage(){
    if(!sb || !cloudUser){ cachedTodayUsage = {count:0, minuti:0}; return; }
    try{
      const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
      const { data, error } = await sb.from('sessioni').select('duration_ms').eq('paziente_id', cloudUser.id).gte('ts', startOfDay.getTime());
      if(error) throw error;
      const count = data.length;
      const minuti = Math.round(data.reduce((s,r)=> s+(r.duration_ms||0),0)/60000);
      cachedTodayUsage = {count, minuti};
    }catch(e){ cachedTodayUsage = {count:0, minuti:0}; }
  }
  function ScreenPatientHome(root){
    root.appendChild(el('div',{class:'brand'},[
      el('div',{class:'mark'},['Traccia',el('span',{},['N'])]),
      el('div',{class:'sub'},['CT MRI'])
    ]));
    const s = el('div',{class:'screen'});
    const card = el('div',{class:'card'});
    card.appendChild(el('h2',{},['Ciao'+(patientProfile&&patientProfile.codice_paziente?', '+patientProfile.codice_paziente:'')]));

    const goals = computeGoalsProgress(patientProfile);
    goals.forEach(goal=>{
      const progWrap = el('div',{style:'margin-bottom:18px;'});
      const barOuter = el('div',{style:'background:var(--paper-dim); border-radius:999px; height:20px; overflow:hidden;'});
      const pct = Math.max(0, Math.min(100, goal.percentuale||0));
      barOuter.appendChild(el('div',{style:'background:var(--signal); height:100%; width:'+pct+'%; transition:width .4s;'},[]));
      progWrap.appendChild(barOuter);
      progWrap.appendChild(el('div',{style:'font-size:13px; color:var(--ink-soft); margin-top:6px;'},[pct+'% completato']));
      card.appendChild(progWrap);
    });

    const limiti = patientProfile && patientProfile.limiti;
    const hasLimits = limiti && (limiti.sessioniAlGiorno || limiti.minutiAlGiorno);
    if(hasLimits && cachedTodayUsage===null){
      cachedTodayUsage = {count:0, minuti:0}; // placeholder, evita richieste ripetute mentre carica
      loadTodayUsage().then(()=> render());
    }
    let limitReached = false, limitMsg = '';
    if(hasLimits && cachedTodayUsage){
      const u = cachedTodayUsage;
      if(limiti.sessioniAlGiorno && u.count >= limiti.sessioniAlGiorno){ limitReached = true; limitMsg = 'Hai raggiunto il limite di '+limiti.sessioniAlGiorno+' sessioni per oggi.'; }
      else if(limiti.minutiAlGiorno && u.minuti >= limiti.minutiAlGiorno){ limitReached = true; limitMsg = 'Hai raggiunto il limite di '+limiti.minutiAlGiorno+' minuti per oggi.'; }
      if(limitReached){
        card.appendChild(el('p',{class:'hint', style:'color:var(--alert); font-weight:600;'},[limitMsg+' Torna domani per continuare.']));
      } else if(limiti.sessioniAlGiorno || limiti.minutiAlGiorno){
        const restanti = [];
        if(limiti.sessioniAlGiorno) restanti.push((limiti.sessioniAlGiorno-u.count)+' sessioni');
        if(limiti.minutiAlGiorno) restanti.push((limiti.minutiAlGiorno-u.minuti)+' minuti');
        card.appendChild(el('p',{class:'hint'},['Oggi ti restano: '+restanti.join(', ')+'.']));
      }
    }

    const program = patientProgram(patientProfile);
    if(!program.length){
      card.appendChild(el('p',{class:'hint'},['Il tuo operatore non ha ancora assegnato un allenamento. Torna più tardi.']));
    } else if(!limitReached){
      card.appendChild(el('p',{class:'hint'},['Il tuo operatore ti ha assegnato '+program.length+(program.length>1?' allenamenti':' allenamento')+':']));
      program.forEach(item=>{
        const exLabel = EXERCISES[item.cfg.taskMode] ? EXERCISES[item.cfg.taskMode].label : item.cfg.taskMode;
        const row = el('div',{class:'histrow'},[
          el('div',{},[ el('div',{},[item.nome||exLabel]), el('div',{class:'l'},[exLabel]) ]),
          el('button',{class:'primary', style:'padding:10px 16px;', onclick:()=>{
            loadPreset({cfg:item.cfg});
            cfg.patientCode = patientProfile.codice_paziente;
            view='instructions'; render();
          }},['Inizia'])
        ]);
        card.appendChild(row);
      });
    }
    const nav = el('div',{class:'navlinks'});
    nav.appendChild(el('button',{class:'link', onclick:()=>{ view='history'; render(); }},['I miei risultati →']));
    nav.appendChild(el('button',{class:'link', onclick: cloudSignOut},['Esci']));
    card.appendChild(nav);
    s.appendChild(card); root.appendChild(s);
  }


  function ScreenHistory(root){
    root.appendChild(el('div',{class:'brand'},[el('div',{class:'mark'},['Traccia',el('span',{},['N'])])]));
    const s = el('div',{class:'screen'});
    const card = el('div',{class:'card'});
    const filterId = historyFilterPatientId;
    const filterPatient = filterId ? listLocalPatients().find(p=>p.id===filterId) : null;
    card.appendChild(el('h2',{},[filterPatient ? 'Storico di '+filterPatient.nome : 'Storico sessioni']));
    if(filterPatient){
      const rb0 = el('div',{class:'navlinks'});
      rb0.appendChild(el('button',{class:'link', onclick:()=>{ historyFilterPatientId=null; render(); }},['Vedi tutto lo storico →']));
      card.appendChild(rb0);
    }
    card.appendChild(el('p',{class:'hint'},[
      sb && cloudUser ? 'Sincronizzate con il cloud (' + cloudUser.email + ') e disponibili in locale su questo dispositivo.'
                       : 'Salvate solo in locale su questo dispositivo. Attiva la sincronizzazione cloud per condividerle tra i tuoi dispositivi.'
    ]));
    const listWrap = el('div',{},[el('p',{class:'empty'},['Caricamento…'])]);
    card.appendChild(listWrap);
    const rowbtns = el('div',{class:'rowbtns'});
    rowbtns.appendChild(el('button',{class:'ghost', onclick:()=>{ historyFilterPatientId=null; view=homeView(); render(); }},['← Nuova sessione']));
    if(!patientProfile){
      const exportBtn = el('button',{class:'ghost', onclick:async ()=>{ const items = await loadHistory(); if(items.length) exportCSV(items); }},['Esporta CSV']);
      rowbtns.appendChild(exportBtn);
    }
    card.appendChild(rowbtns);
    s.appendChild(card); root.appendChild(s);

    loadHistory().then(allItems=>{
      const items = filterId ? allItems.filter(r=> r.localPatientId===filterId) : allItems;
      listWrap.innerHTML='';
      if(!items.length){ listWrap.appendChild(el('p',{class:'empty'},['Nessuna sessione salvata.'])); return; }
      items.forEach(r=>{
        const family = r.family || 'signal';
        const exLabel = EXERCISES[r.taskMode] ? EXERCISES[r.taskMode].label : (r.taskMode==='sequenza'?'sequenza':'n-back');
        const detail = family==='choice' ? exLabel
          : (r.taskMode==='nback' ? exLabel+' n='+r.nLevel : exLabel);
        const scoreLabel = family==='choice'
          ? fmtPct(r.choice.accuracy)+' corr.'
          : family==='dual'
            ? fmtPct(r.metrics.acc)+' vis · '+fmtPct(r.metricsAud.acc)+' ud.'
            : family==='spatial'
              ? fmtPct(r.neglect.pctLeft)+' sin · '+fmtPct(r.neglect.pctRight)+' des'
              : fmtPct(r.metrics.acc)+(r.metrics.dprime!=null? ' · d′ '+r.metrics.dprime.toFixed(2):'');
        const row = el('div',{class:'histrow'},[
          el('div',{},[
            el('div',{},[((EXERCISES[r.taskMode] && EXERCISES[r.taskMode].usesStimType && !(r.taskMode==='ant' && r.antMode==='classico')) ? STIM_LABELS[r.stimType]+' · ':'')+detail+' · '+r.trials+' prove'+(r.patientCode?' · '+r.patientCode:'')]),
            el('div',{class:'l'},[r.dateLabel])
          ]),
          el('div',{},[scoreLabel])
        ]);
        listWrap.appendChild(row);
      });
    });
  }

  const SCREENS = {
    setup: ScreenSetup, instructions: ScreenInstructions, countdown: ScreenCountdown,
    manualEntry: ScreenManualEntry, results: ScreenResults, history: ScreenHistory,
    cloud: ScreenCloud, patients: ScreenPatients, patientHome: ScreenPatientHome, patientProgram: ScreenPatientProgram,
    operatorHome: ScreenOperatorHome, localPatientPicker: ScreenLocalPatientPicker
  };

  try{ if(window.speechSynthesis){ window.speechSynthesis.getVoices(); } }catch(e){}
  regenerateNumeriPool();
  regenerateParolePool();
  initSupabase();
  function decideInitialView(){
    if(patientProfile) return 'patientHome';
    if(cloudUser) return 'operatorHome'; // operatore già collegato: prima la scelta esercizi liberi/in presenza/remoto
    return 'cloud'; // non collegato: schermata di accesso
  }
  restoreCloudSession().finally(()=>{ view = decideInitialView(); render(); });
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
